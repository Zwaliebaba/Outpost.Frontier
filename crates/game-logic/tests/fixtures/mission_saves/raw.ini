; P3.5b: a hand-made player save for the mission restores of
; crates/game-logic/tests/mission_saves.rs, loaded into each of the fourteen
; story missions by the port and, as save_<mission>_raw.ini, by
; Content.dll's OracleLoadMissionSaves. Every value is synthetic. It holds
; the lines the writers make and lines they do not (missing values, other
; spellings, unknown keys, sections in an order the save never has), but no
; line that makes the reference dereference null (D813, D832).

