# The fixed-function shaders (decision record 0004, section 3). Each entry
# is one blob in ../compiled_shaders, compiled by `cargo xtask shaders`
# with the fixed flags of README.md.

[[shader]]
file = "fixed_function.hlsl"
entry = "vs_main"
profile = "vs_6_1"
output = "fixed_function_vs.cso"

[[shader]]
file = "fixed_function.hlsl"
entry = "ps_main"
profile = "ps_6_1"
output = "fixed_function_ps.cso"

# SHADEMODE FLAT: the colours are not interpolated.
[[shader]]
file = "fixed_function.hlsl"
entry = "ps_main"
profile = "ps_6_1"
output = "fixed_function_ps_flat.cso"
defines = ["FLAT=1"]

# The final blit through the gamma ramp.
[[shader]]
file = "blit.hlsl"
entry = "vs_main"
profile = "vs_6_1"
output = "blit_vs.cso"

[[shader]]
file = "blit.hlsl"
entry = "ps_main"
profile = "ps_6_1"
output = "blit_ps.cso"

# The test program of the programmable passes (record 0005): one vertex
# shader and three pixel shaders, drawn by the WARP tests of
# platform::d3d12::backend::ex. Shader model 6.1 (DXIL).
[[shader]]
file = "pass_test.hlsl"
entry = "vs_main"
profile = "vs_6_1"
output = "pass_test_vs.cso"

[[shader]]
file = "pass_test.hlsl"
entry = "ps_constant"
profile = "ps_6_1"
output = "pass_test_constant_ps.cso"

[[shader]]
file = "pass_test.hlsl"
entry = "ps_depth"
profile = "ps_6_1"
output = "pass_test_depth_ps.cso"

[[shader]]
file = "pass_test.hlsl"
entry = "ps_volume"
profile = "ps_6_1"
output = "pass_test_volume_ps.cso"
