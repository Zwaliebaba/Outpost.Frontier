595 = '''<RDL><PUSH/><TEXT>DIAMETER: 21,891 km</TEXT><PARA/><TEXT>MASS: 7.32 x 10</TEXT><TRA font="9"/><TEXT>²⁴</TEXT><TRA font="default"/><TEXT> kg</TEXT><PARA/><TEXT>TERRAIN: Terrestrial</TEXT><PARA/><TEXT>TEMPERATURE: 4°C to 39°C</TEXT><PARA/><TEXT>ESCAPE VELOCITY: 16.23 km/s</TEXT><PARA/><PARA/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;RESTRICTED&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>An oddity in the annals of human exploration. While initial surveys indicated a seemingly idyllic world of thick forests and low fogs, the first expeditions to make planetfall quickly learned that an essential component of the planetary ecology was a fast-acting organic poison fatal to human beings. Every plant and animal examined on the planet contained this poison to one degree or another and any plans for settlement were quickly abandoned.</TEXT><PARA/><POP/></RDL>'''
