# FieldGuideText: text module 1, the high 16 bits of its text IDs (fact F3).
# Keys are the 16-bit IDs inside the module. [cards] hold rich-text cards
# in <RDL> markup; the catalog build stores them as UTF-16LE with a
# byte-order mark. See README.md.

[cards]
3 = '''<RDL><PUSH/><TEXT>CLASS: Tyrell</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Restricted</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: Unknown</TEXT><PARA/><POP/></RDL>'''
4 = '''<RDL><PUSH/><TEXT>The Juneau Shipyard is the Helion Navy’s top secret installation that was built soon after the Texas Incident in 510 AS. All research and development of the Osiris class of battleships occurred at this facility.</TEXT><PARA/><POP/></RDL>'''
5 = '''<RDL><PUSH/><TEXT>CLASS: Tantalus</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Restricted</TEXT><PARA/><TEXT>AMENITIES: Limited</TEXT><PARA/><TEXT>POPULATION: Unknown</TEXT><PARA/><POP/></RDL>'''
6 = '''<RDL><PUSH/><TEXT>The LCI </TEXT><TRA italic="true"/><TEXT>Mitchell</TEXT><TRA italic="false"/><TEXT>  is a prison ship operated by the Helion Security Force (LSF).</TEXT><PARA/><POP/></RDL>'''
7 = '''<RDL><PUSH/><TEXT>CLASS: Dern</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 850</TEXT><PARA/><POP/></RDL>'''
8 = '''<RDL><PUSH/><TEXT>Built out of the old framework of an abandoned Republican Shipping outpost, Freeport 2 was founded in 650 AS by displaced Texas settlers, Hamburg drifters, and a variety of other individuals looking for safe haven. They aligned themselves with the Zoner movement and its open-to-all philosophy, then purchased a series of Synth Foods biodomes for Food production. The exploding demand for Food from the adjacent Texas System and from local criminal elements has provided them with a steady market for their surplus. Aside from the Zoners, Xenos and Unioners also frequent the station.</TEXT><PARA/><POP/></RDL>'''
9 = '''<RDL><PUSH/><TEXT>CLASS: Unknown</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Limited</TEXT><PARA/><TEXT>POPULATION: Unknown</TEXT><PARA/><POP/></RDL>'''
10 = '''<RDL><PUSH/><TEXT>The history of the Unioners is intimately tied to Alster. The shipyard opened in 412 AS, specializing in commercial transports and heavy lifters. Conditions were appalling in the yards, worker safety being merely a tertiary concern of the owners. Coupled with the excessively long spaceside rotations, the workers’ morale gradually deteriorated until a major accident killed several hundred workers in 512 AS.</TEXT><PARA/><PARA/><TEXT>Three months later, the workers formed the Alster Union. Because of their highly specialized skills, the management had no choice but to capitulate to their demands. During the next century the union gradually strengthened and eventually included the dockworkers on the Altona Station above Hamburg. By the end of the 80-Years War, the union demanded increasingly high wages and progressively fewer annual hours. The system was out of balance. Republican was no longer competitive with Orsena shipbuilders.</TEXT><PARA/><PARA/><TEXT>With the war over, demand for ships plummeted. The bloated headcount of Alster was now a sore point for Republican Shipping, desperately trying to restore profitablity. Management was now back in the driver’s seat after almost 200 years of acceding to union demands. They fired tens of thousands and won major concessions from the remaining workers, who lost centuries of gains in a matter of days.</TEXT><PARA/><PARA/><TEXT>As unemployment rocketed towards 30 percent in Hamburg, a radicalized version of the union reformed — more of a revolutionary cell than anything. The presence of Freeport 2 in Bering proved alluring to the nascent Unioner movement of Dornmark during the unsettled times. Following the popular uprising of 702, the station’s population exploded. In 720 the Zoners laid down the ultimatum: Take your criminal activities somewhere else. They would sell basic supplies to the rebels, but no more. So the Unioners carved their Pacifica base out of an asteroid in the Tanner Belt.</TEXT><PARA/><PARA/><TEXT>The Unioners range from Bering to Ironreach. Most of their attacks are focused on the Altona Outpost and the Alster Shipyard in Hamburg, which has alienated them from some of their still employed brethren. The bulk of their Trade Lane raids are directed against Republican ships traversing the Independent Worlds. Their main commodity is Diamonds, which they run from Kreuzberg to Dawson. Unioners are often spotted buying supplies on Freeport 2.</TEXT><PARA/><POP/></RDL>'''
11 = '''<RDL><PUSH/><TEXT>CLASS: Leviathan</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Limited</TEXT><PARA/><TEXT>POPULATION: Unknown</TEXT><PARA/><POP/></RDL>'''
12 = '''<RDL><PUSH/><TEXT>A Rogue base. Rogues are known associates of petty criminals and are believed to be involved in illegal drug trafficking.</TEXT><PARA/><POP/></RDL>'''
13 = '''<RDL><PUSH/><TEXT>CLASS: Overlord</TEXT><PARA/><TEXT>CREW: </TEXT><TRA color="#FF0000"/><TEXT>CLASSIFIED</TEXT><TRA color="default"/><PARA/><TEXT>ARMAMENT: </TEXT><TRA color="#FF0000"/><TEXT>CLASSIFIED</TEXT><PARA/><POP/></RDL>'''
14 = '''<RDL><PUSH/><TEXT>Deployed in orbit around California, the Battleship </TEXT><TRA italic="true"/><TEXT>Yukon</TEXT><TRA italic="false"/><TEXT>  is part of the Helion Navy’s effort to keep a close eye on Lane Hackers and to crack down on pirate activity. It is also used as a base for patrolling the Trade Lanes to and from Magellan and Cortez that are plagued by pirate attacks.</TEXT><PARA/><POP/></RDL>'''
15 = '''<RDL><PUSH/><TEXT>DIAMETER: 3,101 km</TEXT><PARA/><TEXT>MASS: 2.77 x 10</TEXT><TRA font="9"/><TEXT>²⁴</TEXT><TRA font="default"/><TEXT> kg</TEXT><PARA/><TEXT>TERRAIN: Ice</TEXT><PARA/><TEXT>TEMPERATURE: -110°C to -12°C</TEXT><PARA/><TEXT>ESCAPE VELOCITY: 6.7 km/s</TEXT><PARA/><POP/></RDL>'''
16 = '''<RDL><PUSH/><TEXT>A small icy planet with an unusually active volcanic system. Previously considered unsuitable for conventional terraforming, Planetform, Inc. has designed a new process to channel the planet’s enormous subterranean stores of geothermal energy. Despite harsh conditions, the potential for jobs has attracted coarse, manual laborers to its few hospitable areas.</TEXT><PARA/><POP/></RDL>'''
17 = '''<RDL><PUSH/><TEXT>DIAMETER: 8,351 km</TEXT><PARA/><TEXT>MASS: 3.22 x 10</TEXT><TRA font="9"/><TEXT>²⁴</TEXT><TRA font="default"/><TEXT> kg</TEXT><PARA/><TEXT>TERRAIN: Terrestrial</TEXT><PARA/><TEXT>TEMPERATURE: -40°C to 45°C</TEXT><PARA/><TEXT>ESCAPE VELOCITY: 8.98 km/s</TEXT><PARA/><POP/></RDL>'''
18 = '''<RDL><PUSH/><TEXT>Mostly covered in deep salt water oceans, Los Angeles was popular among upper-class Manhattanites before terraforming efforts failed during the Great California Drought of 543 AS. The planet’s popularity has resurged with the economic windfall generated by Synth Foods. Synth Foods has perfected an engineered plant matter that can flourish in harsh environments and then processed into Synth Paste. The booming technology market recently induced Ageira Technologies to locate an optical chip plant here.</TEXT><PARA/><POP/></RDL>'''
19 = '''<RDL><PUSH/><TEXT>CLASS: Tyrell</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 150</TEXT><PARA/><POP/></RDL>'''
20 = '''<RDL><PUSH/><TEXT>San Diego Border Station monitors the Magellan Jump Gate to stem the rise of criminal activity throughout the area, particularly that of Lane Hackers, Rogues, and Ashbound. The facility is entirely owned and operated by Helion Police, Inc. (LPI) and its support staff.</TEXT><PARA/><POP/></RDL>'''
21 = '''<RDL><PUSH/><TEXT>CLASS: Unknown</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Unknown</TEXT><PARA/><TEXT>POPULATION: Unknown</TEXT><PARA/><POP/></RDL>'''
22 = '''<RDL><PUSH/><TEXT>Willard Research Station operates under the auspices of the Helion Navy. Its research is classified.</TEXT><PARA/><POP/></RDL>'''
23 = '''<RDL><PUSH/><TEXT>CLASS: Dunkirk</TEXT><PARA/><TEXT>CREW: </TEXT><TRA color="#FF0000"/><TEXT>CLASSIFIED</TEXT><TRA color="default"/><PARA/><TEXT>ARMAMENT: </TEXT><TRA color="#FF0000"/><TEXT>CLASSIFIED</TEXT><PARA/><POP/></RDL>'''
24 = '''<RDL><PUSH/><TEXT>The Battleship </TEXT><TRA italic="true"/><TEXT>Norfolk</TEXT><TRA italic="false"/><TEXT>  anchors the Cambridge Line of electronic surveillance satellites to suppress the chronic pirate and smuggling activity in the system. Food transports, pharmaceutical shipments, and the local Trade Lanes are enticing targets for pirates who strike across the Line before retreating to the safety of the Barrier ice clouds.</TEXT><PARA/><POP/></RDL>'''
25 = '''<RDL><PUSH/><TEXT>DIAMETER: 10,723 km</TEXT><PARA/><TEXT>MASS: 5.11 x 10</TEXT><TRA font="9"/><TEXT>²⁵</TEXT><TRA font="default"/><TEXT> kg</TEXT><PARA/><TEXT>TERRAIN: Terrestrial</TEXT><PARA/><TEXT>TEMPERATURE: -49°C to 73°C</TEXT><PARA/><TEXT>ESCAPE VELOCITY: 10.21 km/s</TEXT><PARA/><POP/></RDL>'''
26 = '''<RDL><PUSH/><TEXT>This lush green world is home of the Cambridge Research Institute — an institution devoted to pure scientific research. Vespera’s epidemic Food shortages required the planetary regents to place farmers with scientists to develop more bountiful crops, making Cambridge the primary Food producer for Vespera. Now several Cambridge scientists sympathize with the Gaian eco-terrorist movement, igniting bitter debates among researchers over terraforming.</TEXT><PARA/><POP/></RDL>'''
27 = '''<RDL><PUSH/><TEXT>CLASS: Eden</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 350</TEXT><PARA/><POP/></RDL>'''
28 = '''<RDL><PUSH/><TEXT>Cambridge Research Station is part of a joint program between the Cambridge Research Institute and Cryer Pharmaceuticals. The station pursues a broad range of research, but primarily focuses on the development of medicines and bioware that require a zero-g environment.</TEXT><PARA/><POP/></RDL>'''
29 = '''<RDL><PUSH/><TEXT>CLASS: Wellington</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Limited</TEXT><PARA/><TEXT>POPULATION: 500</TEXT><PARA/><POP/></RDL>'''
30 = '''<RDL><PUSH/><TEXT>Cardiff Mining Facility is run by the Independent Mining Guild (IMG) and processes most of the Beryllium mined in Vespera’s asteroid fields. Processed Beryllium is delivered to buyers by Gateway Shipping, an IMG partner.</TEXT><PARA/><POP/></RDL>'''
31 = '''<RDL><PUSH/><TEXT>CLASS: Unknown</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Unknown</TEXT><PARA/><TEXT>POPULATION: Unknown</TEXT><PARA/><POP/></RDL>'''
32 = '''<RDL><PUSH/><TEXT>The history of the Jade Vow goes back to the fourth century. The founding members of the group were the Shogun’s Royal Guard during the Hideyoshi family dynasty. In a bloody coup during the celebration of the revived Sakura festival in 321 AS, the Shogun was surrounded in the palace by Samura-backed elements of the military and asked to surrender, along with the Royal Guard. The Shogun, humiliated by the shame he had brought his family, committed suicide. The guards, headed by Kozue Okamura, did not acquiesce so easily. In a bloody battle, they fought their way out of the palace and retreated into the darkness of northern Orsena space. Here they regrouped and began a long guerrilla campaign aimed at overthrowing the Samura-controlled Orsena government.</TEXT><PARA/><PARA/><TEXT>The Jade Vow are a tight group who hold the sympathy and support of individuals in the highest levels of Orsena government. They periodically launch surgical strikes and commando raids from their Kyoto base designed to destabilize the current government to the point where sympathetic officials could potentially seize power. Jade Vow prefer to target Samura and Orsena Naval Forces bases and ships, although they occasionally attack other House shippers for supplies.</TEXT><PARA/><PARA/><TEXT>The group is loosely allied with the Golden Chrysanthemums, who provide refuge and a forward tactical base for assault crews in the Hokkaido System. The Golden C. also provide many of the essential Commodities that the Jade Vow need, a critical function given the complete lack of Blood Dragon landing rights within the rest of Orsena space. The Chugoku Gate construction is viewed as a direct threat to the continued survival of the group.</TEXT><PARA/><POP/></RDL>'''
33 = '''<RDL><PUSH/><TEXT>CLASS: Monument</TEXT><PARA/><TEXT>CREW: </TEXT><TRA color="#FF0000"/><TEXT>CLASSIFIED</TEXT><TRA color="default"/><PARA/><TEXT>ARMAMENT: </TEXT><TRA color="#FF0000"/><TEXT>CLASSIFIED</TEXT><PARA/><POP/></RDL>'''
34 = '''<RDL><PUSH/><TEXT>Constructed in 777 AS, the Battleship </TEXT><TRA italic="true"/><TEXT>Rio Grande</TEXT><TRA italic="false"/><TEXT>  became famous in the 792 AS campaign against the Xenos in the Hudson System. The </TEXT><TRA italic="true"/><TEXT>Rio Grande</TEXT><TRA italic="false"/><TEXT>, currently commanded by Captain John Palmer, protects the economically vital Ageira Technologies manufacturing facility at Pueblo Station, and also patrols the Trade Lanes into Kepler and Galileo.</TEXT><PARA/><POP/></RDL>'''
35 = '''<RDL><PUSH/><TEXT>DIAMETER: 12,211 km</TEXT><PARA/><TEXT>MASS: 5.54 x 10</TEXT><TRA font="9"/><TEXT>²⁴</TEXT><TRA font="default"/><TEXT> kg</TEXT><PARA/><TEXT>TERRAIN: Terrestrial</TEXT><PARA/><TEXT>TEMPERATURE: -88°C to 59.1°C</TEXT><PARA/><TEXT>ESCAPE VELOCITY: 10.02 km/s</TEXT><PARA/><POP/></RDL>'''
36 = '''<RDL><PUSH/><TEXT>Denver was originally the home of miners, smelters, and shipyard workers, but these industries eventually collapsed in 600 AS. With the declining long-term water situation in the California System, however, the wealthy elite of Los Angeles began to look elsewhere for a vacation spot and found Denver’s rough, beautiful vistas to be ideal. Emigration from Los Angeles and Whiteharbor injected new life into the Denver economy, reviving the planet even as the new upper-class assumed control of the local government. Today Cryer Pharmaceuticals maintains a major research lab on Denver, while Ageira Technologies has a planetside headquarters to oversee its interests in the system. Helion Police, Inc. (LPI) is well paid by Colorado’s new elite to handle security.</TEXT><PARA/><POP/></RDL>'''
37 = '''<RDL><PUSH/><TEXT>CLASS: Unknown</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Unknown</TEXT><PARA/><TEXT>POPULATION: Unknown</TEXT><PARA/><POP/></RDL>'''
38 = '''<RDL><PUSH/><TEXT>This group was originally comprised of heavy manufacturing and mining workers within Colorado and Texas. Many of their ancestors also worked in the research station, which was a good employer for generations. But Helion increasingly made money from its information technology licensing and Trade Lane associated monopolies rather than hard, manufactured goods. Over time most of the blue-collar workers became unemployed and were pushed to the economic fringe of Helion society. As the Helion rich moved to Colorado to escape the paradise lost in California, the Xenos were displaced to a small base in the mined out Silverton Asteroid Field. Once there the Xenos launched sporadic raids focused against foreign shippers.</TEXT><PARA/><PARA/><TEXT>Whenever they were captured they were sent to Huntsville Prison in Texas, where cross-fertilization with other inmates only helped to swell their ranks. Xenos also hate the foreigner Ashbound that feed the habits of Helion’s morally corrupt rich. For this reason, most of those declared NCR for drug crimes are placed aboard the </TEXT><TRA italic="true"/><TEXT>Sugarland</TEXT><TRA italic="false"/><TEXT>  to keep the two groups separate.</TEXT><PARA/><PARA/><TEXT>Because of the Xeno preference for other Houses’ ships, Universal Shipping has actually benefited from the attacks and has lobbied the government to take it easy on them. It is rumored that some of their attacks on foreign shipping were not Xenos, but actually mercenaries hired by Universal to harass the competition.</TEXT><PARA/><PARA/><TEXT>There are two additional Xeno bases in the Independent World systems of Hudson and Kepler. Here the Xenos have been able to operate more freely, with only occasional Helion Navy patrols and Bounty Hunters to secure the areas. They make hit-and-run attacks into Texas frequently, especially to attack the Junker base at Beaumont and confront Ashbound.</TEXT><PARA/><PARA/><TEXT>The Xenos are currently one of the poorest of all the criminal factions, so they have little resources to buy better ships and weapons. To gain a more stable income stream, they hope to evict the Junkers from Texas, and ultimately Cinderwell, and thus control a crucial market for Cardamine.</TEXT><PARA/><PARA/><TEXT>The Xenos’ love of Side Arms has brought them into conflict with Ageira, especially around its Detroit Munitions plant. They also regularly attack Junkers in the Jersey Debris Field of northern Cinderwell.</TEXT><PARA/><POP/></RDL>'''
39 = '''<RDL><PUSH/><TEXT>CLASS: </TEXT><TRA color="#FF0000"/><TEXT>CLASSIFIED</TEXT><TRA color="default"/><PARA/><TEXT>GRAVITY: </TEXT><TRA color="#FF0000"/><TEXT>CLASSIFIED</TEXT><TRA color="default"/><PARA/><TEXT>DOCKING: </TEXT><TRA color="#FF0000"/><TEXT>CLASSIFIED</TEXT><TRA color="default"/><PARA/><TEXT>AMENITIES: </TEXT><TRA color="#FF0000"/><TEXT>CLASSIFIED</TEXT><TRA color="default"/><PARA/><TEXT>POPULATION: </TEXT><TRA color="#FF0000"/><TEXT>CLASSIFIED</TEXT><PARA/><PARA/><TRA bold="true"/><TEXT>&gt;&gt;&gt;HIGH SECURITY&lt;&lt;&lt;</TEXT><PARA/><POP/></RDL>'''
40 = '''<RDL><PUSH/><TEXT>Ageira Technologies manufacturing facility. Notice: All ships should be aware that Ageira Technologies facilities are protected by private security authorized to use deadly force against any deviation from standard flight procedures.</TEXT><PARA/><POP/></RDL>'''
41 = '''<RDL><PUSH/><TEXT>DIAMETER: 19,443 km</TEXT><PARA/><TEXT>MASS: 6.98 x 10</TEXT><TRA font="9"/><TEXT>²⁵</TEXT><TRA font="default"/><TEXT> kg</TEXT><PARA/><TEXT>TERRAIN: Terrestrial</TEXT><PARA/><TEXT>TEMPERATURE: -56°C to 53°C</TEXT><PARA/><TEXT>ESCAPE VELOCITY: 13.27 km/s</TEXT><PARA/><POP/></RDL>'''
42 = '''<RDL><PUSH/><TEXT>Unfettered by colony law, Curacao is run by Orbital Spa and Cruise Lines as a pleasure planet where every whim and decadent urge is fulfilled. The only sound that can be heard over the lapping waves on its fabulous beaches is the tremendous outpouring of credits by its patrons. This is not a planet for the idle vacationer; it was established to cater to the affluent from Whiteharbor and Los Angeles who, in many cases, have more currency than morals.</TEXT><PARA/><POP/></RDL>'''
43 = '''<RDL><PUSH/><TEXT>CLASS: Unknown</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Limited</TEXT><PARA/><TEXT>POPULATION: Unknown</TEXT><PARA/><POP/></RDL>'''
44 = '''<RDL><PUSH/><TEXT>A Rogue base. Rogues are known associates of petty criminals and are believed to be involved in the trade of illegal drug trafficking.</TEXT><PARA/><POP/></RDL>'''
45 = '''<RDL><PUSH/><TEXT>CLASS: Sanctuary</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Limited</TEXT><PARA/><TEXT>POPULATION: 900</TEXT><PARA/><POP/></RDL>'''
46 = '''<RDL><PUSH/><TEXT>Bautzen Station supports the Kruger Minerals operation in the Dresden System. Smaller than the rival Daumann facility at Leipzig, Kruger chose to focus solely on the extraction of Diamonds from the shifting clouds and rogue asteroids that populate Dresden.</TEXT><PARA/><POP/></RDL>'''
47 = '''<RDL><PUSH/><TEXT>CLASS: Abbey</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Limited</TEXT><PARA/><TEXT>POPULATION: 850</TEXT><PARA/><POP/></RDL>'''
48 = '''<RDL><PUSH/><TEXT>Leipzig Station is the main ore processing and smelting operation for Daumann Heavy Construction in Dresden. A chaotic system of fierce tidal eddies and volcanic asteroids, Dresden is an unforgiving environment; conditions aboard Leipzig are reportedly little better, with overcrowding a constant problem and industrial accidents a common occurrence. Cargo runs are usually under heavy protection since their valuable cargo makes them a particularly attractive target for pirates.</TEXT><PARA/><POP/></RDL>'''
49 = '''<RDL><PUSH/><TEXT>CLASS: Chapel</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 200</TEXT><PARA/><POP/></RDL>'''
50 = '''<RDL><PUSH/><TEXT>Pirna Border Station is the command center for the Dornmark Federal Police in the Dresden System. The Federal Police are tasked with protecting Daumann cobalt convoys outbound from Leipzig Station from pirate attacks.</TEXT><PARA/><POP/></RDL>'''
51 = '''<RDL><PUSH/><TEXT>CLASS: Unknown</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: Unknown</TEXT><PARA/><POP/></RDL>'''
52 = '''<RDL><PUSH/><TEXT>The story of the Hessians emerges from the turbulent history of the Dresden System, the mining heartland of Dornmark since the beginning of the third century. Mining there was dirty, dangerous work, but Daumann and Kruger had little reason to lose sleep over the welfare of their employees. The price of the occasional disability pension or life insurance policy was nothing compared to the money made from extracting and refining the metals and materials that fed Dornmark industry.</TEXT><PARA/><PARA/><TEXT>As the 80-Years War wound down to its ignoble conclusion, Dornmark found itself virtually bankrupt. Kruger and Daumann released thousands of employees throughout Dornmark. Promises of bonuses were left unfulfilled, and in many cases, miners were left completely destitute. An uprising was almost inevitable. A group of miners took control of the Daumann Heavy Construction facility on Von Rohe’s Day in 700 AS.</TEXT><PARA/><PARA/><TEXT>The revolt soon spread from Dresden to the rest of the Dornmark, gaining widespread backing from the legions of newly unemployed workers. The industrial heart of Dornmark stopped beating; the Popular Revolution had begun.</TEXT><PARA/><PARA/><TEXT>Within five months a new coalition government was established. Both Kruger and Daumann were required to pay reparations, and all Dornmark companies were forced to comply with a newly ratified Workers’ Rights Convention. They have been careful to adhere to the letter of the law, if not the spirit. The compromise left many that had fought in the revolution bitter. Many workers could not accept the prospect of working for their old taskmasters and decided to form the Cinder Guard, a group dedicated to destroying the two companies.</TEXT><PARA/><PARA/><TEXT>It was not long before Red Hessian political ideals were replaced by greed, which has led them to become more like pirates than activists. The police have been forced to maintain a significant presence in Dresden in an effort to prevent Hessian strikes from clogging the gears of Dornmark industry.</TEXT><PARA/><PARA/><TEXT>The Hessians have gradually expanded, assisted by their close proximity to Stuttgart Food shipments and an extensive Jump Hole network within the southern Nacre Reach. They now own a string of bases in the southern Dornmark Border Worlds. In Omega-5 they encountered their first real obstacle — the Rift Captains. They have fought the Edge World faction to a tenuous stalemate, with the Ronneburg base barely holding on against the stronger Corsair presence in that system. Fortunately, they live in a rich area of Sirius in terms of raw materials, especially Diamonds. Their preferred targets are Daumann and Kruger, although almost any shipper is vulnerable to attack.</TEXT><PARA/><POP/></RDL>'''
53 = '''<RDL><PUSH/><TEXT>CLASS: Unknown</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Limited</TEXT><PARA/><TEXT>POPULATION: Unknown</TEXT><PARA/><POP/></RDL>'''
54 = '''<RDL><PUSH/><TEXT>The history of the Mollys is intimately linked with that of Dublin. During the height of the Dublin Gold rush, the field manager in charge of the primary large-scale corporate operation in the system was a ruthless tyrant named Sir Edmund Graves. Graves pushed the miners to the limit in the name of profits, causing many unnecessary deaths. Greed combined with absolute control had proved too tempting. He and his lieutenants began skimming a percentage off the Gold take on a weekly basis.</TEXT><PARA/><PARA/><TEXT>The miners were pushed harder to cover up the shortfall in shipments back to Larkspur, and the situation became critical. The Founders Day Revolt, as it came to be known, occurred on the annual national Vesperan holiday in 752 AS that commemorated the original founding of Larkspur centuries before. The workers mutinied, executed Graves and his compatriots, and took control of the mining ships Endeavor and Glorious.</TEXT><PARA/><PARA/><TEXT>The Vesperan military response was swift and furious. Vesperan gunboats arrived shortly, and in the ensuing battle, destroyed the Endeavor and its mutineers. They pursued the Glorious across the system into a dense field, where they stumbled into a large, explosive booby trap set by the fleeing miners. One gunboat was destroyed; several were damaged.</TEXT><PARA/><PARA/><TEXT>The Battleship </TEXT><TRA italic="true"/><TEXT>Hood</TEXT><TRA italic="false"/><TEXT>  was rushed in from Larkspur to restore order. This proved to be the last straw. The remaining miners in the system declared their independence from the ruthless oppressor, and began a long guerrilla war of attrition against the Vesperan government.</TEXT><PARA/><PARA/><TEXT>In the most famous incident, they disabled the </TEXT><TRA italic="true"/><TEXT>Hood</TEXT><TRA italic="false"/><TEXT> ’s engines with a huge mine and set off a large chain-reaction explosion in the ship’s aft. The repairs required were extensive and could only be undertaken in the Larkspur shipyard. Unfortunately, the ship was considered too unstable to undertake the journey back through the Jump Gate. It was officially abandoned and stripped of most weaponry, engines, and sensitive electronics. The ship was later reoccupied by the IMG and now serves as the only Freeport within House frontiers.</TEXT><PARA/><PARA/><TEXT>Despite few tangible victories in their effort to free the Dublin System from control of the Vesperan government, they’ve still managed to fight a vastly superior military force to a near standstill. The Armed Forces patrols from the </TEXT><TRA italic="true"/><TEXT>Essex</TEXT><TRA italic="false"/><TEXT>  usually only respond when the Mollys make attacks on the BMM operation in the GS&amp;M Gold field.</TEXT><PARA/><POP/></RDL>'''
55 = '''<RDL><PUSH/><TEXT>CLASS: Dunkirk</TEXT><PARA/><TEXT>CREW: </TEXT><TRA color="#FF0000"/><TEXT>CLASSIFIED</TEXT><TRA color="default"/><PARA/><TEXT>ARMAMENT: </TEXT><TRA color="#FF0000"/><TEXT>CLASSIFIED</TEXT><PARA/><POP/></RDL>'''
56 = '''<RDL><PUSH/><TEXT>Home to the Vespera Armed Forces in this system, the </TEXT><TRA italic="true"/><TEXT>Essex</TEXT><TRA italic="false"/><TEXT>  scans all ships that pass through the Jump Gate for illicit Gold shipments smuggled from the Vespera Mining and Metal (BMM) operations.</TEXT><PARA/><POP/></RDL>'''
57 = '''<RDL><PUSH/><TEXT>CLASS: Victoria</TEXT><PARA/><TEXT>POPULATION: Unknown</TEXT><PARA/><POP/></RDL>'''
58 = '''<RDL><PUSH/><TEXT>The </TEXT><TRA italic="true"/><TEXT>Hood</TEXT><TRA italic="false"/><TEXT>  was an abandoned hulk until it was re-pressurized by a few enterprising members of the Independent Mining Guild looking to make a fast buck. The </TEXT><TRA italic="true"/><TEXT>Hood</TEXT><TRA italic="false"/><TEXT>  is now a floating bazaar where the Mollys come to trade, usually paying in Gold. The most popular pastime aboard the ship involves racing through the neighboring asteroid field; most races generally end with a survivor as opposed to a winner.</TEXT><PARA/><POP/></RDL>'''
59 = '''<RDL><PUSH/><TEXT>CLASS: </TEXT><TRA color="#FF0000"/><TEXT>— BLOCKED —</TEXT><TRA color="default"/><PARA/><TEXT>GRAVITY: </TEXT><TRA color="#FF0000"/><TEXT>— BLOCKED —</TEXT><TRA color="default"/><PARA/><TEXT>DOCKING: </TEXT><TRA color="#FF0000"/><TEXT>— BLOCKED —</TEXT><TRA color="default"/><PARA/><TEXT>AMENITIES: </TEXT><TRA color="#FF0000"/><TEXT>— BLOCKED —</TEXT><TRA color="default"/><PARA/><TEXT>POPULATION: </TEXT><TRA color="#FF0000"/><TEXT>— BLOCKED —</TEXT><PARA/><POP/></RDL>'''
60 = '''<RDL><PUSH/><TEXT>The Glorious played a decisive role in the Founders Day Revolt, when miners who were escaping Vesperan justice after their brutal execution of Sir Edmund Graves took it deep into the asteroid fields. It once served as a base of operations, but has since been so badly damaged that it is deemed uninhabitable.</TEXT><PARA/><POP/></RDL>'''
61 = '''<RDL><PUSH/><TEXT>CLASS: Wellington</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 900</TEXT><PARA/><POP/></RDL>'''
62 = '''<RDL><PUSH/><TEXT>Graves Station is entirely owned by Vespera Mining and Metal (BMM) and produces the bulk of all Gold mined in the colony. A contingent from the Vespera Police Authority is also stationed aboard to provide security against mounting attacks by the Mollys.</TEXT><PARA/><POP/></RDL>'''
63 = '''<RDL><PUSH/><TEXT>CLASS: Eden</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 100</TEXT><PARA/><POP/></RDL>'''
64 = '''<RDL><PUSH/><TEXT>Aberdeen Border Station is on constant watch for contraband runners and eco-terrorists. It is an official facility operated by the Vespera Police Authority and its support staff.</TEXT><PARA/><POP/></RDL>'''
65 = '''<RDL><PUSH/><TEXT>CLASS: Unknown</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: Unknown</TEXT><PARA/><POP/></RDL>'''
66 = '''<RDL><PUSH/><TEXT>Soon after tourists began to arrive in Edinburgh in 690 AS, Cambridge scientists voiced their concern over the enormous ecological damage that even the most regulated visits could inflict on the planet. Almost from birth Cambridgers had drilled into them the stories of how Larkspur and Leeds were blighted, so they tended to be very environmentally sensitive. A few of the younger and more militant scientists studying on Edinburgh actually went so far as to begin a campaign to sabotage tourist transports in an effort to discourage visits, but with little effect.</TEXT><PARA/><PARA/><TEXT>Once Cobalt was discovered on Gaia in 740, the BMM began to make noises in Larkspur about the need to establish a mining base there. What had been a quiet, bloodless campaign of active resistance blossomed into full-fledged conflict. Graffiti with slogans such as “GAIA WILL NOT BLEED” was spotted soon after. The eco-terrorist movement had begun.</TEXT><PARA/><PARA/><TEXT>Eventually any plans to mine the surface of Edinburgh were dropped — mostly out of fear that it might cut into the burgeoning tourist industry — but the Gaians had already broadened their horizons by an influx of radical elements from Cambridge who sought a ban on terraforming technologies. Planetform, Inc. was the natural target. What emerged was a militant terrorist group philosophically opposed to the exploitation of planets, and terraforming in particular. The group enjoyed considerable popular support on Cambridge, funded by the efforts of the legitimate arm of the Gaians called the Green Front.</TEXT><PARA/><PARA/><TEXT>While the Gaians and the eco-terrorist movement as a whole have made little progress outside of Vesperan space, Green Front propaganda is a common sight in Vespera. Green Front commentators are often present on the news, and unlike the Mollys, a certain amount of tolerance for them exists in the government from those disinclined to antagonize their Cambridge connections. Over the years, the movement has broadened considerably until the majority of its sympathizers are environmentally conscious individuals from throughout Vespera.</TEXT><PARA/><PARA/><TEXT>The sole Gaian base lies deep within the Islay Ice Cloud at the northeastern edge of the Edinburgh System. From here, the eco-terrorists coordinate attacks on their enemies within Vespera space and the Tau-31 system. Occasionally, raids are made on the center of all evil — Planetform, Inc. headquarters at the Canterbury Station in the Larkspur System. Ironically, although they have strong Cambridge roots, there is no activity within that system.</TEXT><PARA/><POP/></RDL>'''
67 = '''<RDL><PUSH/><TEXT>CLASS: Eden</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 450</TEXT><PARA/><POP/></RDL>'''
68 = '''<RDL><PUSH/><TEXT>Perth Station is owned and operated by Planetform, Inc. as a base for the arduous and hopefully lucrative process of terraforming the planet Ayr. This operation is under almost constant attack by Gaian eco-terrorists, despite increased protection from the Vesperan government.</TEXT><PARA/><POP/></RDL>'''
69 = '''<RDL><PUSH/><TEXT>CLASS: Wilde</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>PASSENGERS: 500</TEXT><PARA/><POP/></RDL>'''
70 = '''<RDL><PUSH/><TEXT>Owned and operated by Orbital Spa and Cruise Lines, the </TEXT><TRA italic="true"/><TEXT>Shetland</TEXT><TRA italic="false"/><TEXT>  is a moveable feast for the rich and those who service them. Aside from its gourmet restaurants and shopping arcades, guides aboard the </TEXT><TRA italic="true"/><TEXT>Shetland</TEXT><TRA italic="false"/><TEXT>  offer tours of the protected preserve of Gaia — a beautiful, pristine world — but planetside visas are an extraordinarily rare and expensive item.</TEXT><PARA/><POP/></RDL>'''
71 = '''<RDL><PUSH/><TEXT>CLASS: Unknown</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: Unknown</TEXT><PARA/><POP/></RDL>'''
72 = '''<RDL><PUSH/><TEXT>Believed to be founded by a group of Ironreach University students in 679 AS, the movement had much support among the liberal elite of Ironreach, tired of the corrupt practices of the government that had led them to financial ruin near the end of the 80-Years War. During the Dresden rebellion of 700 AS, the Bundschuh found their first official cause — shipping supplies “liberated” from Frankfurt to the Kruger and Daumann rebels. Three months after that, sympathetic maintenance workers started sabotaging Daumann manufacturing operations in Ironreach. The industrial heart of Dornmark stopped beating, and the Popular Revolution had begun.</TEXT><PARA/><PARA/><TEXT>Five years later the Emperor was overthrown,, and a new coalition government was established in its place. While the Bundschuh initially pushed for a full investigation into the activities of companies such as Kruger Minerals and Daumann Heavy Construction, more pragmatic elements within the government decided that for the newly formed Dornmark Republic to succeed, it needed the support of the aristocrats who controlled those and other major companies. Both Kruger and Daumann were eventually required to pay substantial reparations intended to “improve the Dornmark Republic for the good of all people,” and all Dornmark companies were forced to comply with a newly ratified Workers’ Rights Convention.</TEXT><PARA/><PARA/><TEXT>By 715 AS business in Dresden had more or less resumed as usual. The Bundschuh were driven underground, an impractical brand of idealism ill-suited to building a consensus among the many different government factions and the aristocrats who controlled the purse strings. The Bundschuh took the ideological high route, attracting the purists dedicated to overthrowing the corrupt Dornmark regime represented by the government, Daumann, and Republican. The Cinder Guard adapted the more pragmatic approach of stealing and plundering in the guise of fighting the powers that be. As a result, the Red Hessian ranks swelled, and the Bundschuh dwindled.</TEXT><PARA/><PARA/><TEXT>The Bundschuh have always looked to the Unioners, LWB, Cinder Guard, and disgruntled Republican, Daumann and Kruger workers for possible recruits. So they maintain a distinct note of neutrality towards the criminal groups, although they find the Red Hessian practice of indiscriminate piracy distasteful. They prefer to focus on Daumann, Republican, and military bases, although they do raid a ship on occasion for supplies, preferably Samura or Kishiro, as they have no more love for Orsena than the rest of the Dornmark.</TEXT><PARA/><POP/></RDL>'''
73 = '''<RDL><PUSH/><TEXT>CLASS: Chapel</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 100</TEXT><PARA/><POP/></RDL>'''
74 = '''<RDL><PUSH/><TEXT>Fulda Border Station is the command center for the Dornmark Federal Police in the Frankfurt System. The Federal Police is tasked with handling the interdiction of all illegal activity in the area, including drugs, smuggling, and pirate activity. They also maintain a watchful eye on the Gas Mining Guild (GMG).</TEXT><PARA/><POP/></RDL>'''
75 = '''<RDL><PUSH/><TEXT>DIAMETER: 14,320 km</TEXT><PARA/><TEXT>MASS: 6.00 x 10</TEXT><TRA font="9"/><TEXT>²⁴</TEXT><TRA font="default"/><TEXT> kg</TEXT><PARA/><TEXT>TERRAIN: Terrestrial</TEXT><PARA/><TEXT>TEMPERATURE: -29°C to 17°C</TEXT><PARA/><TEXT>ESCAPE VELOCITY: 12.11 km/s</TEXT><PARA/><POP/></RDL>'''
76 = '''<RDL><PUSH/><TEXT>Holstein was ignored for centuries until the government decided that it would be politically advantageous to develop the planet as a hedge against encroachment by the Gas Mining Guild (GMG). However, the 80-Years War doomed the project before its completion; Holstein was rendered marginally habitable, if not pleasant. However, Daumann engineers performing a routine survey recently discovered the presence of large amounts of valuable mineral salts in the oceans and a small extraction facility was constructed planetside.</TEXT><PARA/><POP/></RDL>'''
77 = '''<RDL><PUSH/><TEXT>CLASS: Abbey</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 200</TEXT><PARA/><POP/></RDL>'''
78 = '''<RDL><PUSH/><TEXT>Since the 80-Years War, all shipments from the Gas Mining Guild (GMG) to Dornmark are made using neutral Orsena shipping companies that are required to transfer their fuel to Republican Shipping transports at the Mainz Storage Facility.</TEXT><PARA/><POP/></RDL>'''
79 = '''<RDL><PUSH/><TEXT>CLASS: Sanctuary</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 400</TEXT><PARA/><POP/></RDL>'''
80 = '''<RDL><PUSH/><TEXT>Mannheim Station is the farthest outpost of the once vast Kruger Mineral concern, mining resources from the nearby gas giant, Munich. The impure gas resources collected from Munich, however, require the re-synthesis of H-Fuel in a process that is uneconomical, but which provides one of the few sources for H-Fuel in Dornmark space.</TEXT><PARA/><POP/></RDL>'''
81 = '''<RDL><PUSH/><TEXT>CLASS: Unknown</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Limited</TEXT><PARA/><TEXT>POPULATION: Unknown</TEXT><PARA/><POP/></RDL>'''
82 = '''<RDL><PUSH/><TEXT>A Rogue base. Rogues attack civilian and commercial targets of opportunity and are believed to be involved in the trade of Alien Artifacts.</TEXT><PARA/><POP/></RDL>'''
83 = '''<RDL><PUSH/><TEXT>CLASS: Unknown</TEXT><PARA/><TEXT>GRAVITY: Complete.</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: Unknown</TEXT><PARA/><POP/></RDL>'''
84 = '''<RDL><PUSH/><TEXT>A Lane Hacker base. Lane Hackers use their proprietary technology to interrupt and seize shipments from Trade Lanes.</TEXT><PARA/><POP/></RDL>'''
85 = '''<RDL><PUSH/><TEXT>CLASS: Elbe</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 7K</TEXT><PARA/><POP/></RDL>'''
86 = '''<RDL><PUSH/><TEXT>Constructed by Republican Shipping, the Alster Shipyard specializes in the construction of freight ships and transports; however, Alster is most well known as the birthplace of the Unioner movement. After the economic collapse and the ensuing Popular Revolution, the Unioners became increasingly radicalized until they were added to the official list of terrorist factions. While the Alster Shipyards continues to operate, Republican Shipping — in conjunction with the Dornmark Federal Police — is believed to have purged most of the Unioners from the facility.</TEXT><PARA/><POP/></RDL>'''
87 = '''<RDL><PUSH/><TEXT>CLASS: Cathedral</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 750</TEXT><PARA/><POP/></RDL>'''
88 = '''<RDL><PUSH/><TEXT>Altona Station is the primary point of contact between Republican Shipping and other foreign shipping concerns. Once bustling with shipping traffic from Helion, Altona has become substantially less busy as Helion shipping companies have begun shipping Food directly from the Stuttgart System to Helion.</TEXT><PARA/><POP/></RDL>'''
89 = '''<RDL><PUSH/><TEXT>CLASS: Bismarck</TEXT><PARA/><TEXT>CREW: </TEXT><TRA color="#FF0000"/><TEXT>CLASSIFIED</TEXT><TRA color="default"/><PARA/><TEXT>ARMAMENT: </TEXT><TRA color="#FF0000"/><TEXT>CLASSIFIED</TEXT><PARA/><POP/></RDL>'''
90 = '''<RDL><PUSH/><TEXT>The sole remaining ship in the once grand Dornmark Navy, the Battleship </TEXT><TRA italic="true"/><TEXT>Westfalen</TEXT><TRA italic="false"/><TEXT>, is tasked with preventing the spread of pirates into Dornmark space and dealing with attacks by Unioner terrorists. In the past the </TEXT><TRA italic="true"/><TEXT>Westfalen</TEXT><TRA italic="false"/><TEXT>  also assisted in preventing breakouts from nearby Vierlande Prison.</TEXT><PARA/><POP/></RDL>'''
91 = '''<RDL><PUSH/><TEXT>DIAMETER: 13,552 km</TEXT><PARA/><TEXT>MASS: 6.00 x 10</TEXT><TRA font="9"/><TEXT>²⁴</TEXT><TRA font="default"/><TEXT> kg</TEXT><PARA/><TEXT>TERRAIN: Ice</TEXT><PARA/><TEXT>TEMPERATURE: -62°C to 8°C</TEXT><PARA/><TEXT>ESCAPE VELOCITY: 11.99 km/s</TEXT><PARA/><POP/></RDL>'''
92 = '''<RDL><PUSH/><TEXT>Despite its forbidding cold and gray skies, Hamburg is a cosmopolitan environment of suits, traders, dock workers, security, and independent pilots. Hamburg is the place to go if you want to buy something in Dornmark space, hire a Bounty Hunter, or maybe just hear a rumor; however, Republican Shipping levies a tariff on all transactions for the continuing maintenance of facilities both planetside and in orbit.</TEXT><PARA/><POP/></RDL>'''
93 = '''<RDL><PUSH/><TEXT>CLASS: Chapel</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 75</TEXT><PARA/><POP/></RDL>'''
94 = '''<RDL><PUSH/><TEXT>Lübeck Border Station is the command center for the Dornmark Federal Police in the Hamburg System. The Federal Police is tasked with handling the interdiction of all illegal activity in the area, including drugs, smuggling, and pirate activity.</TEXT><PARA/><POP/></RDL>'''
95 = '''<RDL><PUSH/><TEXT>CLASS: Abbey</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 6K</TEXT><PARA/><POP/></RDL>'''
96 = '''<RDL><PUSH/><TEXT>When the unpleasant necessity of protecting the fledgling Dornmark Republic required the construction of a special prison for handling violent radicals, the Vierlande Prison was stationed in Hamburg in 715 AS. Its extreme isolation and lack of appreciable sunlight make it one of the more dreaded destinations for captured Cinder Guard, Unioners, and other criminals. Sentences are almost always for life.</TEXT><PARA/><POP/></RDL>'''
97 = '''<RDL><PUSH/><TEXT>CLASS: Unknown</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Unknown</TEXT><PARA/><TEXT>POPULATION: Unknown</TEXT><PARA/><POP/></RDL>'''
98 = '''<RDL><PUSH/><TEXT>Most scholars date the start of the group as the publication of </TEXT><TRA italic="true"/><TEXT>Golden Chrysanthemum in Bloom</TEXT><TRA italic="false"/><TEXT>  in 642 AS. The author, Yuyu Matsuda, was a young but critically acclaimed poet. Charismatic and well-spoken, Matusda had a considerable following among young Orsena women who found their lives lacking in direction but were reluctant to become married and fulfill their traditional role in Orsena society.</TEXT><PARA/><PARA/><TEXT>Matsuda decried what she saw as the corruption of the Orsena male-dominated culture and preached a revolution led by the long-suffering women of Orsena. These ideas were eventually encapsulated in </TEXT><TRA italic="true"/><TEXT>Golden Chrysanthemum in Bloom</TEXT><TRA italic="false"/><TEXT>, in which Matsuda described a fictitious nation called Yomi. A place of fat, lazy male bureaucrats who handed out concessions at the whim of entrenched mega-corporations, Yomi was eventually engulfed in revolution and united under the rule of a benevolent Empress personally selected by the goddess Amaterasu to watch over her people.</TEXT><PARA/><PARA/><TEXT>Matsuda looked to the foreigners as a model, where women could be president and run corporations. The </TEXT><TRA italic="true"/><TEXT>Chrysanthemum</TEXT><TRA italic="false"/><TEXT>  went on to become a best-seller. Unfortunately, in 648 AS, Matsuda crossed the dangerous line between ideas and actions when she was implicated in the botched assassination attempt of the planetary governor of Kyushu.</TEXT><PARA/><PARA/><TEXT>Rather than face the ignominy of imprisonment, Matsuda chose ritual suicide instead. An increase in attacks on government personnel and installations followed soon after. Neither as well armed as the Jade Vow nor as influential as the Hogosha, the Golden C. have been more of an irritant to the government than an actual threat.</TEXT><PARA/><PARA/><TEXT>Unfortunately, any attempts to locate the Golden C. base or learn more about their organization has been thwarted by their willingness to die rather than talk. A Golden C. pilot will trigger her ship’s self-destruction rather than be captured, and suicide attacks are common. Attempts to infiltrate the Golden C. have proven equally fruitless. On several occasions the Orsena government has received the finger of an undercover agent wrapped in a page from one of Matsuda’s books.</TEXT><PARA/><PARA/><TEXT>The Orsena State Police keeps a watchful eye on the faction, but has been unable to completely control them. This is at least partly due to the assistance of the Jade Vow, who have made use of the Golden C. base in Hokkaido as a rest stop on the long journey to the inner systems of Orsena. The Jade Vow also share the group’s desire to overthrow the government and reform House Orsena, although perhaps using more sophisticated methods.</TEXT><PARA/><POP/></RDL>'''
99 = '''<RDL><PUSH/><TEXT>CLASS: Genji</TEXT><PARA/><TEXT>CREW: </TEXT><TRA color="#FF0000"/><TEXT>CLASSIFIED</TEXT><TRA color="default"/><PARA/><TEXT>ARMAMENT: </TEXT><TRA color="#FF0000"/><TEXT>CLASSIFIED</TEXT><PARA/><POP/></RDL>'''
100 = '''<RDL><PUSH/><TEXT>The Battleship </TEXT><TRA italic="true"/><TEXT>Matsumoto</TEXT><TRA italic="false"/><TEXT> is one of the newest, most advanced ships in the Orsena Navy. The ship has been deployed to the Hokkaido System to provide protection for crews involved in the construction of Jump Gates and to eliminate the presence of terrorist groups believed to be using the system for refuge.</TEXT><PARA/><POP/></RDL>'''
101 = '''<RDL><PUSH/><TRA bold="true"/><TEXT>CHUGOKU GATE</TEXT><PARA/><POP/></RDL>'''
102 = '''<RDL><PUSH/><TEXT>The Jump Gate linking Hokkaido is part of a controversial construction project intended to open the recently discovered mineral riches of the Chugoku System to exploitation by Orsena business interests. However, because of the natural dangers of the Hokkaido System and significant levels of terrorist activity, Interspace Commerce (IC) refused to insure the venture until the Orsena government committed to station the Battleship </TEXT><TRA italic="true"/><TEXT>Matsumoto</TEXT><TRA italic="false"/><TEXT>  in the system for protection. Despite the large military presence, however, the Chugoku Gate is still a favorite target of the Jade Vow.</TEXT><PARA/><POP/></RDL>'''
103 = '''<RDL><PUSH/><TEXT>CLASS: Mifune</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 200</TEXT><PARA/><POP/></RDL>'''
104 = '''<RDL><PUSH/><TEXT>Constructed by Samura after the completion of the Jump Gate linking Hokkaido and Sablecross, Sapporo Station was intended to act as a local base from which Samura could survey the surrounding systems for mineral resources. But with construction proceeding ahead on the Chugoku Gate and the resulting increase in terrorist activity, Samura has been persuaded by the Orsena Shogunate to also house officials from Deep Space Engineering and Universal Shipping while providing support for the Orsena State Police.</TEXT><PARA/><POP/></RDL>'''
105 = '''<RDL><PUSH/><TEXT>CLASS: Mifune</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 100</TEXT><PARA/><POP/></RDL>'''
106 = '''<RDL><PUSH/><TEXT>Akita Border Station is the primary enclave of the Orsena State Police in the Honshu System. It is tasked with interdicting pirates and smugglers entering Orsena space from the lawless Border Worlds through the Hiryo Cloud.</TEXT><PARA/><POP/></RDL>'''
107 = '''<RDL><PUSH/><TEXT>CLASS: Akebono</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 550</TEXT><PARA/><POP/></RDL>'''
108 = '''<RDL><PUSH/><TEXT>Aomori Station is the major outpost of the Gas Mining Guild (GMG) in Orsena space. Initially built as an equipment depot for Honshu miners working the lucrative oceans of gas in the Crow Nebula, Aomori has been extensively expanded and renovated over the centuries. Once an exclusive agreement was signed with Samura in 330 AS for the distribution of Fuel, Aomori gained even greater importance as the main point of contact between the GMG and Samura. However, the GMG continues to assert its independence, and Aomori Station is considered sovereign GMG territory.</TEXT><PARA/><POP/></RDL>'''
109 = '''<RDL><PUSH/><TEXT>DIAMETER: 15,201 km</TEXT><PARA/><TEXT>MASS: 6.12 x 10</TEXT><TRA font="9"/><TEXT>²⁴</TEXT><TRA font="default"/><TEXT> kg</TEXT><PARA/><TEXT>TERRAIN: Archipelago</TEXT><PARA/><TEXT>TEMPERATURE: -52°C to 40°C</TEXT><PARA/><TEXT>ESCAPE VELOCITY: 12.02 km/s</TEXT><PARA/><POP/></RDL>'''
110 = '''<RDL><PUSH/><TEXT>The first Orsena colony established after the settlement of Sablecross, Honshu is mostly covered in water, with few sizable land masses. The first settlers struggled for several centuries before a catastrophic decline in ocean harvesting forced most of the inhabitants to turn their attentions to the nearby Crow Nebula and its bountiful gas resources. Over time the former Honshu settlers moved entirely into space and formed the Gas Mining Guild (GMG), all but abandoning their ancestral home. Honshu lay fallow until Kishiro selected the planet in 510 AS as the location for its main Optronics manufacturing facility.</TEXT><PARA/><POP/></RDL>'''
111 = '''<RDL><PUSH/><TEXT>CLASS: Mifune</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 450</TEXT><PARA/><POP/></RDL>'''
112 = '''<RDL><PUSH/><TEXT>A technology incubator formed as a joint project between Kishiro and the Orsena Navy, Kansai Research Station is tasked with developing new shielding and scanning technology specifically designed to deal with the often treacherous conditions found inside the gas nebula scattered throughout Orsena space. The Orsena Navy maintains a close watch on Kansai and has deployed several automated weapons platforms nearby to guard against terrorist attack.</TEXT><PARA/><POP/></RDL>'''
113 = '''<RDL><PUSH/><TEXT>CLASS: Akebono</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Limited</TEXT><PARA/><TEXT>POPULATION: 200</TEXT><PARA/><POP/></RDL>'''
114 = '''<RDL><PUSH/><TEXT>Constructed in 350 AS by Samura, the Osaka Storage Facility is the largest structure of its type in all of Sirius. Fuel shipments mined from the Crow Nebula by the Gas Mining Guild (GMG) are stored here until they can be transported to distribution points in the other colonies by foreign shipping companies.</TEXT><PARA/><POP/></RDL>'''
115 = '''<RDL><PUSH/><TEXT>CLASS: Chiba</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 7K</TEXT><PARA/><POP/></RDL>'''
116 = '''<RDL><PUSH/><TEXT>The Yukawa Shipyard is the primary ship construction facility for Kishiro. While Kishiro constructs ships for the commercial and civilian market, they have also become the chief supplier of ships and equipment to the Gas Mining Guild (GMG) and the Yukawa Shipyard operates around the clock to meet demand.</TEXT><PARA/><POP/></RDL>'''
117 = '''<RDL><PUSH/><TEXT>CLASS: Unknown</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Limited</TEXT><PARA/><TEXT>POPULATION: Unknown</TEXT><PARA/><POP/></RDL>'''
118 = '''<RDL><PUSH/><TEXT>A Rogue base. Rogues attack civilian and commercial targets of opportunity and are believed to be involved in the trade of stolen Diamonds.</TEXT><PARA/><POP/></RDL>'''
119 = '''<RDL><PUSH/><TEXT>CLASS: Unknown</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Limited</TEXT><PARA/><TEXT>POPULATION: Unknown</TEXT><PARA/><POP/></RDL>'''
120 = '''<RDL><PUSH/><TEXT>A Xeno base. Xenos are a radical political faction that seeks to drive all foreign elements from their territory.</TEXT><PARA/><POP/></RDL>'''
121 = '''<RDL><PUSH/><TEXT>CLASS: Cochrane</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Restricted</TEXT><PARA/><TEXT>AMENITIES: Limited</TEXT><PARA/><TEXT>POPULATION: 200</TEXT><PARA/><POP/></RDL>'''
122 = '''<RDL><PUSH/><TEXT>The Ames Research Station was originally established in 550 AS to study the movements of the strange clouds of dark matter in the system. The station is now largely occupied by Zoners, but a contingent of Deep Space Engineering support staff remains aboard.</TEXT><PARA/><POP/></RDL>'''
123 = '''<RDL><PUSH/><TEXT>CLASS: Unknown</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Limited</TEXT><PARA/><TEXT>POPULATION: Unknown</TEXT><PARA/><POP/></RDL>'''
124 = '''<RDL><PUSH/><TEXT>A Xeno base. Xenos are a radical political faction that seeks to drive all foreign elements from its territory.</TEXT><PARA/><POP/></RDL>'''
125 = '''<RDL><PUSH/><TEXT>CLASS: Meiji</TEXT><PARA/><TEXT>CREW: </TEXT><TRA color="#FF0000"/><TEXT>CLASSIFIED</TEXT><TRA color="default"/><PARA/><TEXT>ARMAMENT: </TEXT><TRA color="#FF0000"/><TEXT>CLASSIFIED</TEXT><PARA/><POP/></RDL>'''
126 = '''<RDL><PUSH/><TEXT>The Battleship </TEXT><TRA italic="true"/><TEXT>Nagumo</TEXT><TRA italic="false"/><TEXT>  was constructed in 723 AS as part of the recent Orsena emphasis on military development. The </TEXT><TRA italic="true"/><TEXT>Nagumo</TEXT><TRA italic="false"/><TEXT>  was initially stationed in the Kyushu System as a strategic deterrent against criminal intrusion from the neighboring border worlds; however, its mission has since been expanded to include protecting the Nansei Research Complex and preventing incursions by Jade Vow.</TEXT><PARA/><POP/></RDL>'''
127 = '''<RDL><PUSH/><TEXT>CLASS: Musashi</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Limited</TEXT><PARA/><TEXT>POPULATION: Unknown</TEXT><PARA/><POP/></RDL>'''
128 = '''<RDL><PUSH/><TEXT>Kyushu is often referred to as the Samura “company” planet within Orsena, as so many of its inhabitants depend on Samura’s continued largess. As part of an effort to stimulate rice production on Kyushu, Samura gradually organized the Kyushu farmers into cooperatives that would buy Fertilizer and customized seeds from their laboratories in Sablecross. Consumers paid exorbitant amounts for the rice produced, which everyone swore was much higher quality than that produced in any other part of Orsena, and thus worth the premium price it fetched in Samura’s Tokyo supermarkets.</TEXT><PARA/><PARA/><TEXT>With the eventual introduction of Trade Lanes, Orsena farmers were opened to competition with the rest of the Nacre Reach. They lobbied the government heavily, financed with Samura money, which had the most to lose from cheaper foreign competitors. The government acquiesced for several centuries, leading to astronomical Orsena Food prices. Eventually, under pressure from the Helion government, Orsena reopened the agricultural imports market, despite intense lobbying by Samura.</TEXT><PARA/><PARA/><TEXT>Synth Foods moved in and became an overnight success, opening franchises in the urban areas of Honshu and Sablecross. Demand for expensive Kyushu Food dropped, and many independent farmers were forced out of business. Feeling betrayed, some of the farmers proceeded to organize the Farmers Alliance, a militant group that lobbies for “farmers’ rights” — which include such things as government subsidies and restrictions on the sale of foreign foods in Orsena. In fact, the Farmers Alliance generally is opposed to foreign influence of any kind, particularly the Trade Lanes that have so damaged their livelihoods.</TEXT><PARA/><PARA/><TEXT>The general population ignores the Farmers Alliance for the most part, though they do have some support among older Orsena citizens. In reality The Farmers Alliance is little more than a puppet of Samura, who wishes to return to its Food and trade monopoly days. Samura uses them for much of its dirty work, attacking foreign shippers, Synth Foods, and even Kishiro on occasion. The Farmers Alliance likes the Hogosha, as they represent the traditional “criminals” of Orsena that fit in with society. They abhor the Golden Chrysanthemums and their disgusting drug habit. The Jade Vow are also viewed with suspicion, since whatever Samura says is the truth.</TEXT><PARA/><PARA/><POP/></RDL>'''
129 = '''<RDL><PUSH/><TEXT>DIAMETER: 13,820 km</TEXT><PARA/><TEXT>MASS: 5.98 x 10</TEXT><TRA font="9"/><TEXT>²⁴</TEXT><TRA font="default"/><TEXT> kg</TEXT><PARA/><TEXT>TERRAIN: Terrestrial</TEXT><PARA/><TEXT>TEMPERATURE: -38°C to 40°C</TEXT><PARA/><TEXT>ESCAPE VELOCITY: 11.99 km/s</TEXT><PARA/><POP/></RDL>'''
130 = '''<RDL><PUSH/><TEXT>Kyushu has few appreciable mineral resources but does possess arable land and an ideal climate for rice farming. While the independent farmers of Kyushu provided much of the basic Food stuffs for Sablecross for over three centuries, a recent Shogunate directive to further develop the planet has resulted in Samura assuming control under government contract. Samura has organized the farmers into collectives growing new, genetically engineered rice purchased from Samura’s labs in Sablecross. But the farmers have had difficulty recouping their investment as Synth Foods products have grown more popular among young Orsena.</TEXT><PARA/><POP/></RDL>'''
131 = '''<RDL><PUSH/><TEXT>CLASS: Amaterasu</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 650</TEXT><PARA/><POP/></RDL>'''
132 = '''<RDL><PUSH/><TEXT>The Nansei Research Complex is a cutting-edge Samura facility for the development of antimatter technology in conjunction with the Orsena Navy. The Battleship </TEXT><TRA italic="true"/><TEXT>Nagumo</TEXT><TRA italic="false"/><TEXT>  maintains a careful eye on the complex as a safeguard against strikes by any terrorist group intent on turning antimatter technology towards its own destructive ends.</TEXT><PARA/><POP/></RDL>'''
133 = '''<RDL><PUSH/><TEXT>CLASS: Nobunaga</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Limited</TEXT><PARA/><TEXT>POPULATION: 250</TEXT><PARA/><POP/></RDL>'''
134 = '''<RDL><PUSH/><TEXT>Tsushima Depot is the start of a vertically integrated chain completely owned and operated by Samura. Hydrocarbons imported from the Shikoku System are processed into Polymers here and then shipped to Samura’s shipyards and manufacturing plants in Sablecross.</TEXT><PARA/><POP/></RDL>'''
135 = '''<RDL><PUSH/><TEXT>CLASS: Victoria</TEXT><PARA/><TEXT>CREW: </TEXT><TRA color="#FF0000"/><TEXT>CLASSIFIED</TEXT><TRA color="default"/><PARA/><TEXT>ARMAMENT: </TEXT><TRA color="#FF0000"/><TEXT>CLASSIFIED</TEXT><PARA/><POP/></RDL>'''
136 = '''<RDL><PUSH/><TEXT>The Battleship </TEXT><TRA italic="true"/><TEXT>York</TEXT><TRA italic="false"/><TEXT>  is stationed in Leeds primarily to provide security for the LD-14 Uranium Processing Center, but also to patrol the neighboring Tau-31 System for criminal activity.</TEXT><PARA/><POP/></RDL>'''
137 = '''<RDL><PUSH/><TEXT>CLASS: Eden</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 250</TEXT><PARA/><POP/></RDL>'''
138 = '''<RDL><PUSH/><TEXT>The main base of operations for the Vespera Police Authority in Leeds, responsible for putting a halt to the piracy and drug trafficking conducted under cover of the substantial smog clouds in the system.</TEXT><PARA/><POP/></RDL>'''
139 = '''<RDL><PUSH/><TEXT>CLASS: Atkinson</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 950</TEXT><PARA/><POP/></RDL>'''
140 = '''<RDL><PUSH/><TEXT>Glasgow Outpost is the headquarters for Bowex (formerly Border World Exports), a very large, very old shipping conglomerate. Bowex, which received its royal charter from Prince Harry XXI himself in 310 AS, claims a long and storied history in which the company was involved in most of the major events of Vesperan history. But Bowex is the leading Vesperan shipping concern and handles most of the shipping in and around Leeds.</TEXT><PARA/><POP/></RDL>'''
141 = '''<RDL><PUSH/><TEXT>CLASS: Wellington</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Limited</TEXT><PARA/><TEXT>POPULATION: 800</TEXT><PARA/><PARA/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;HIGH SECURITY&lt;&lt;&lt;</TEXT><PARA/><POP/></RDL>'''
142 = '''<RDL><PUSH/><TEXT>The LD-14 Uranium Processing Center provides the vast bulk of MOX to the rest of the colonies, a key source of revenue for the Vesperan government. While life aboard LD-14 is harsh, the salaries offered for those willing to do a tour of duty means that LD-14 is never short of workers. Frequent attacks by terrorist groups trying to obtain weapons-grade plutonium, though, has only added to the troubles in an already hazardous working environment, and security is consequently extremely high.</TEXT><PARA/><POP/></RDL>'''
143 = '''<RDL><PUSH/><TEXT>DIAMETER: 10,723 km</TEXT><PARA/><TEXT>MASS: 5.11 x 10</TEXT><TRA font="9"/><TEXT>²⁵</TEXT><TRA font="default"/><TEXT> kg</TEXT><PARA/><TEXT>TERRAIN: Terrestrial</TEXT><PARA/><TEXT>TEMPERATURE: -30°C to 63°C</TEXT><PARA/><TEXT>ESCAPE VELOCITY: 9.21 km/s</TEXT><PARA/><POP/></RDL>'''
144 = '''<RDL><PUSH/><TEXT>Soon after settlement, Vespera needed raw materials, and Leeds was quickly recognized as the most resource rich system under Vesperan control. Companies were formed and given royal charters — near carte blanche — to develop the system in any way they saw fit, while settlers were handed generous incentives to move to Leeds and serve as the workforce. Over the centuries, however, unchecked industrial progress has led to significant environmental pollution as exemplified by the omnipresent smog clouds. Vespera Mining and Metal (BMM) operates the bulk of the planetside mining, smelting, and manufacturing facilities, while Bowex handles transportation of finished goods throughout Vespera.</TEXT><PARA/><POP/></RDL>'''
145 = '''<RDL><PUSH/><TEXT>CLASS: Wellington</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Limited</TEXT><PARA/><TEXT>POPULATION: 800</TEXT><PARA/><POP/></RDL>'''
146 = '''<RDL><PUSH/><TEXT>Stokes Mining Station, run by Vespera Mining and Metal (BMM), is the largest orbital facility in all of Vespera and has operated continuously for centuries. Aside from BMM, representatives from Orsena shipping companies are also present, negotiating for the basic materials required to fuel their own industries.</TEXT><PARA/><POP/></RDL>'''
147 = '''<RDL><PUSH/><TEXT>CLASS: Unknown</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 1K</TEXT><PARA/><POP/></RDL>'''
148 = '''<RDL><PUSH/><TEXT>Freeport 4 was originally a Vesperan station that was abandoned but later reopened by unemployed miners from Larkspur. The miners eventually joined the Independent Mining Guild (IMG) and declared the station a Freeport, open to all. The population largely subsists on whatever income it can manage by selling Water and ice to the IMG, independent pilots, or anyone else who has the credits, and by repairing the odd commercial transport damaged by asteroids or pirate raids.</TEXT><PARA/><POP/></RDL>'''
149 = '''<RDL><PUSH/><TEXT>CLASS: Unknown</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: Unknown</TEXT><PARA/><POP/></RDL>'''
150 = '''<RDL><PUSH/><TEXT>Lane Hackers are mostly composed of former Los Angeles Ageira Technologies employees who created the extremely complex scanning and database system known as USI (Universal Ship Identification). Departing the company rather acrimoniously in 750 AS, they have become a growing problem in the Independent Worlds.</TEXT><PARA/><TEXT>The Lane Hackers in Magellan and Galileo share one common origin — Ageira. The scandal that erupted within the company after the great Galileo bypass project, which resulted in the unnecessary construction of a hugely expensive set of Jump Gates and Trade Lanes, forced several executives and an elite development team out. This would become the second part of the core of the Lane Hackers, along with the original California scanner group that fled to Magellan.</TEXT><PARA/><PARA/><TEXT>The investigation continues to this day, but has so far been unsuccessful in locating the Lane Hacker bases. No Hacker has ever been captured, although various Rogues in the Independent Worlds have been caught possessing remarkably accurate information regarding upcoming high-value shipments.</TEXT><PARA/><PARA/><TEXT>Security measures have been added to the software, but the Hackers remain one step ahead, leading Ageira security experts to believe that there are many sympathetic programmers still within the company, possibly being secretly paid off with the proceeds from the thefts. The Lane Hackers prefer to sell their information to others rather than do the dirty work themselves, although they sometimes swoop in and tractor in a cargo if it’s particularly juicy. Fancying themselves as modern-day Robinhoods, they avoid direct confrontation when possible, unless it is the henchmen of the despised IC and Ageira.</TEXT><PARA/><PARA/><TEXT>They like to frequent Freeport 4 and the Ames Research Station, as their asteroid bases within the clouds can become claustrophobic. Their Cardamine addiction forces the Hackers to trade drugs for Trade Lane info with the Ashbound at the Mactan base. Leiden is a key transfer point for smuggled goods between Orsena and Helion, especially the Artifact trade, which the Hogosha dominate. A steady stream of Hogosha ships make the journey to the Galileo System. The Lane Hackers have also been spotted in Colorado, leading authorities to speculate that there may be multiple Jump Hole routes into that system from the Independent Worlds.</TEXT><PARA/><POP/></RDL>'''
151 = '''<RDL><PUSH/><TEXT>CLASS: Wellington</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Limited</TEXT><PARA/><TEXT>POPULATION: 600</TEXT><PARA/><POP/></RDL>'''
152 = '''<RDL><PUSH/><TEXT>Birmingham Station is a sizeable ice processing facility run by Vespera Mining and Metal (BMM). Frozen Methane, CO</TEXT><TRA font="9"/><TEXT>₂</TEXT><TRA font="default"/><TEXT>, and Hydrocarbons are mined from the nearby ice asteroid fields, processed, and stored until transported to their ultimate destination in Vespera or Helion. As a byproduct of processing Hydrocarbons into Polymers, Birmingham also produces substantial quantities of Oxygen, which are often sold to terraforming operations in the California System.</TEXT><PARA/><POP/></RDL>'''
153 = '''<RDL><PUSH/><TEXT>CLASS: Whitechapel</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Restricted</TEXT><PARA/><TEXT>AMENITIES: None</TEXT><PARA/><TEXT>POPULATION: 7K</TEXT><PARA/><POP/></RDL>'''
154 = '''<RDL><PUSH/><TEXT>The BPA </TEXT><TRA italic="true"/><TEXT>Newgate</TEXT><TRA italic="false"/><TEXT>  is a deep-max penitentiary, specially built as a high-security prison for those inmates deemed too risky to house on inhabited planets — usually serial felons, terrorists, and escape artists. Not only do several meters of armored plate stand between Her Majesty’s guests and freedom, but a thousand miles of hard vacuum in every direction provide an effective deterrent to escape. The </TEXT><TRA italic="true"/><TEXT>Newgate</TEXT><TRA italic="false"/><TEXT>  is also the headquarters for the Vespera Police Authority in the system, and is usually host to more than a few bounty hunters.</TEXT><PARA/><POP/></RDL>'''
155 = '''<RDL><PUSH/><TEXT>CLASS: Eden</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 100</TEXT><PARA/><POP/></RDL>'''
156 = '''<RDL><PUSH/><TEXT>Kingston Border Station is operated by the Vespera Police Authority as a base for interdicting smugglers, pirates, and Lane Hackers operating in the Manchester System.</TEXT><PARA/><POP/></RDL>'''
157 = '''<RDL><PUSH/><TEXT>CLASS: Eden</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 150</TEXT><PARA/><POP/></RDL>'''
158 = '''<RDL><PUSH/><TEXT>Liverpool Border Station is the command center for the Vespera Police Authority in the Manchester System and is tasked with suppressing the smugglers, pirates, and Lane Hackers who use the local ice fields for cover.</TEXT><PARA/><POP/></RDL>'''
159 = '''<RDL><PUSH/><TEXT>CLASS: Zeus</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 2K</TEXT><PARA/><POP/></RDL>'''
160 = '''<RDL><PUSH/><TEXT>Sheffield Station houses many of the off-shift prison, manufacturing, and mining personnel who work in facilities scattered throughout the Manchester System. A large number of guilds and shipping companies have regional headquarters on Sheffield, including Bowex and Gateway Shipping. But the Charter Guild more or less administrates the station, and its members keep the BPA </TEXT><TRA italic="true"/><TEXT>Newgate</TEXT><TRA italic="false"/><TEXT>  prison filled to capacity.</TEXT><PARA/><POP/></RDL>'''
161 = '''<RDL><PUSH/><TEXT>CLASS: Cathedral</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 3K</TEXT><PARA/><POP/></RDL>'''
162 = '''<RDL><PUSH/><TEXT>Bonn Station was constructed soon after agreements had been reached with Helion regarding the disposition of Trade Lanes and Jump Gates in sovereign Dornmark space, providing a headquarters for Interspace Commerce (IC) to oversee the transition of the Jump Gates and Trade Lanes to national control. Now IC works closely with the shipping companies to insure shipments throughout Sirius.</TEXT><PARA/><POP/></RDL>'''
163 = '''<RDL><PUSH/><TEXT>CLASS: Chapel</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 250</TEXT><PARA/><POP/></RDL>'''
164 = '''<RDL><PUSH/><TEXT>Brandenburg Border Station is the command center for the Dornmark Federal Police in the Ironreach System. Without a substantial military, it falls to the Federal Police to handle Red Hessian attacks against Trade Lane traffic.</TEXT><PARA/><POP/></RDL>'''
165 = '''<RDL><PUSH/><TEXT>CLASS: Abbey</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 2K</TEXT><PARA/><POP/></RDL>'''
166 = '''<RDL><PUSH/><TEXT>Dortmund Station is the primary processing facility for ALG Waste Disposal, one of the great Dornmark success stories and a leader in the field of waste disposal. While ALG handles the majority of waste disposal throughout Dornmark — making Dornmark one of the cleanest industrialized houses in the sector — teams are also frequently dispatched under special contract to handle industrial accidents in other colonies. Today ALG is expanding into the re-smelting of Scrap Metal and Toxic Waste to produce Alloys and MOX.</TEXT><PARA/><POP/></RDL>'''
167 = '''<RDL><PUSH/><TEXT>CLASS: Abbey</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 2K</TEXT><PARA/><POP/></RDL>'''
168 = '''<RDL><PUSH/><TEXT>Essen Station is the headquarters and primary manufacturing facility for Kruger Minerals, a once proud company currently experiencing hard times. Wishing to exploit the vast gas resources of the Crow Nebula despite claims made to the territory by the Gas Mining Guild (GMG), Kruger was a primary supporter of the 80-Years War. After that conflict ended in disaster, Kruger’s capital was exhausted and the company persecuted. Today Kruger is attempting to rebuild by allying itself with ALG Waste Disposal.</TEXT><PARA/><POP/></RDL>'''
169 = '''<RDL><PUSH/><TEXT>DIAMETER: 18,207 km</TEXT><PARA/><TEXT>MASS: 7.11 x 10</TEXT><TRA font="9"/><TEXT>²⁴</TEXT><TRA font="default"/><TEXT> kg</TEXT><PARA/><TEXT>TERRAIN: Ice</TEXT><PARA/><TEXT>TEMPERATURE: -73°C to 1°C</TEXT><PARA/><TEXT>ESCAPE VELOCITY: 14.22 km/s</TEXT><PARA/><POP/></RDL>'''
170 = '''<RDL><PUSH/><TEXT>On Ironreach, the capital of Dornmark, day and night each last for nearly a standard year, with the nightside of the planet being plunged into frigid, bitter winter, and the dayside a more temperate summer in which temperatures hover above the freezing point. Despite this potentially hostile environment, Ironreach is very close to the abundant natural resources of the Walker Nebula and so became the first planet settled by the Dornmark people. After the economic collapse brought about by the 80-Years War with the Gas Mining Guild (GMG) and the subsequent Popular Revolution in 702 AS, Ironreach became a society of marked contrasts. As millions try to recover from years of economic mismanagement and political scandal, the black markets of Dornmark boom while the underground clubs and cabarets of Ironreach are rumored to provide anything — for a price.</TEXT><PARA/><POP/></RDL>'''
171 = '''<RDL><PUSH/><TEXT>CLASS: Mosel</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 11K</TEXT><PARA/><POP/></RDL>'''
172 = '''<RDL><PUSH/><TEXT>One of the first large-scale projects undertaken by Daumann Heavy Construction, the Oder Shipyards, is the largest in Sirius. In the past the majority of the Dornmark Navy was constructed in its massive bays, but after the destruction of the Navy during the 80-Years War and the economic crash that followed, Daumann has been forced to transition into the less lucrative fields of commercial and civilian ship construction.</TEXT><PARA/><POP/></RDL>'''
173 = '''<RDL><PUSH/><TEXT>CLASS: Unknown</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Limited</TEXT><PARA/><TEXT>POPULATION: Unknown</TEXT><PARA/><POP/></RDL>'''
174 = '''<RDL><PUSH/><TEXT>A Junker base. Junkers are an itinerant population unaffiliated with any colony. They salvage and then resell abandoned ships, equipment, and other scrap.</TEXT><PARA/><POP/></RDL>'''
175 = '''<RDL><PUSH/><TEXT>CLASS: Special</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 9K</TEXT><PARA/><POP/></RDL>'''
176 = '''<RDL><PUSH/><TEXT>The Ring is probably the most recognizable symbol of Dornmark and a source of great pride among its people. Originally a loose amalgamation of shipyards, habitats, manufacturing centers, and smelting plants built to support the first great push into space from the surface of Ironreach, the structures soon merged into the shape from which its name is derived. The Ring is now a single, massive complex that produces vital components for Dornmark industry.</TEXT><PARA/><POP/></RDL>'''
177 = '''<RDL><PUSH/><TEXT>CLASS: Dunkirk</TEXT><PARA/><TEXT>CREW: </TEXT><TRA color="#FF0000"/><TEXT>CLASSIFIED</TEXT><TRA color="default"/><PARA/><TEXT>ARMAMENT: </TEXT><TRA color="#FF0000"/><TEXT>CLASSIFIED</TEXT><PARA/><POP/></RDL>'''
178 = '''<RDL><PUSH/><TEXT>The Battleship </TEXT><TRA italic="true"/><TEXT>Suffolk</TEXT><TRA italic="false"/><TEXT>  is Her Majesty’s chief display of military might, stationed in the area between Larkspur and the Cumbria Field to protect both civilian and commercial traffic from piracy and terrorist attacks.</TEXT><PARA/><POP/></RDL>'''
179 = '''<RDL><PUSH/><TEXT>CLASS: Eden</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 1K</TEXT><PARA/><POP/></RDL>'''
180 = '''<RDL><PUSH/><TEXT>Canterbury Station houses the headquarters for Planetform, Inc., a pioneer in transforming uninhabitable or marginally habitable planets into terrestrial worlds. With the sparseness of arable planets outside of the core systems claimed by Helion, Planetform, Inc. has been conducting a considerable amount of business in Vespera and elsewhere. However, its operations have recently come under attack by Gaian eco-terrorists, and by necessity security guidelines have grown more stringent.</TEXT><PARA/><POP/></RDL>'''
181 = '''<RDL><PUSH/><TEXT>CLASS: Izzard</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 500</TEXT><PARA/><POP/></RDL>'''
182 = '''<RDL><PUSH/><TEXT>Kensington Shipping Platform, owned and operated by Gateway Shipping, serves as a major staging area for the shipment of goods in and out of the Larkspur System.</TEXT><PARA/><POP/></RDL>'''
183 = '''<RDL><PUSH/><TEXT>DIAMETER: 10,723 km</TEXT><PARA/><TEXT>MASS: 4.90 x 10</TEXT><TRA font="9"/><TEXT>²⁴</TEXT><TRA font="default"/><TEXT> kg</TEXT><PARA/><TEXT>TERRAIN: Terrestrial</TEXT><PARA/><TEXT>TEMPERATURE: -46°C to 43°C</TEXT><PARA/><TEXT>ESCAPE VELOCITY: 10.27 km/s</TEXT><PARA/><POP/></RDL>'''
184 = '''<RDL><PUSH/><TEXT>Larkspur is the seat of the Vesperan government, but almost as important, it is the heart of the Vesperan way of life. Despite the pollution resulting from years of industrialization, the vast majority of the Vesperan aristocracy lives here, and even the most impoverished citizen is comfortably middle class. Most of the population works in the Vesperan bureaucratic aristocracy, an almost impenetrable network of obscure titles, government offices, and rules of procedure. Because of — or perhaps despite — this, all of the major Vesperan companies, including Bowex and Vespera Mining and Metal (BMM), have offices on Larkspur. The police and military also have their organizational headquarters here.</TEXT><PARA/><POP/></RDL>'''
185 = '''<RDL><PUSH/><TEXT>CLASS: Winchester</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 10K</TEXT><PARA/><POP/></RDL>'''
186 = '''<RDL><PUSH/><TEXT>The Southampton Shipyards are a massive assemblage of floating steel where most of the Vesperan naval fleet is constructed. The yard is organized around an enormous structure known by most employees as “The Bridge.” The Bridge is a well recognized object of pride for most Vesperans, symbolizing the brilliance and dedication of the Vesperan people. Though Southampton is largely controlled by Vespera Mining and Metal (BMM) and the Vespera Armed Forces, it is frequented by almost anybody who has business in Larkspur space.</TEXT><PARA/><POP/></RDL>'''
187 = '''<RDL><PUSH/><TEXT>CLASS: Edmunds</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 250</TEXT><PARA/><POP/></RDL>'''
188 = '''<RDL><PUSH/><TEXT>Thames Outpost is populated almost exclusively by Vespera Mining and Metal (BMM) staff and workers. The Vespera Armed Forces also keeps a small presence aboard in an effort to maintain a measure of security in the face of possible raids by pirates or criminal groups such as the Mollys. While the outpost itself has little strategic importance, it does have a significant amount of valuable resources that are constantly transferred between storage bays and transports.</TEXT><PARA/><POP/></RDL>'''
189 = '''<RDL><PUSH/><TEXT>CLASS: Unknown</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Limited</TEXT><PARA/><TEXT>POPULATION: Unknown</TEXT><PARA/><POP/></RDL>'''
190 = '''<RDL><PUSH/><TEXT>A Junker base. Junkers are an itinerant population unaffiliated with any colony . They salvage and then resell abandoned ships, equipment, and other scrap.</TEXT><PARA/><POP/></RDL>'''
191 = '''<RDL><PUSH/><TEXT>CLASS: Zeus</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 5K</TEXT><PARA/><POP/></RDL>'''
192 = '''<RDL><PUSH/><TEXT>Waterloo Station acts as headquarters for the local branch of Interspace Commerce (IC) as well as foreign shippers such as Republican Shipping and Universal Shipping. It is a busy, bustling place, constantly humming with activity as business transactions are conducted around the clock.</TEXT><PARA/><POP/></RDL>'''
195 = '''<RDL><PUSH/><TEXT>CLASS: Musashi</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: Unknown</TEXT><PARA/><POP/></RDL>'''
196 = '''<RDL><PUSH/><TEXT>Hogosha translates literally as “guardian” or “protector,” reflecting the organization’s rather romantic view held not only by its own members, but by a large portion of the Orsena population — though by no means the majority. Far from protectors, the Hogosha are actually descendents of the organized crime syndicates that grow within the shadow of any sizable human society — though the Hogosha have an oddly symbiotic relationship with both the government and Samura.</TEXT><PARA/><PARA/><TEXT>Their political connections would make any serious attempt to dismantle them an embarrassment to Orsena as any number of secrets and deals that had been kept out of the public eye came to light. However, neither do the Hogosha have a free license to operate. Arrests of low-level Hogosha operators who flaunt their activities are frequent and help keep up appearances — very important in Orsena. “Hard” crime, such as drug smuggling, is not tolerated.</TEXT><PARA/><PARA/><TEXT>Individual opinions vary, but most police consider the Hogosha a necessary evil required for the smooth functioning of Orsena society. The government simply treats the Hogosha like any other large </TEXT><TRA italic="true"/><TEXT>keiretsu</TEXT><TRA italic="false"/><TEXT>. The Orsena population as a whole has a similar attitude: It is pointless to like or dislike the Hogosha; they are simply a fact of life.</TEXT><PARA/><PARA/><TEXT>The Hogosha handle Artifact and gun smuggling and the fencing of stolen goods. They also do occasional dirty work for Samura. They view the Jade Vow as a major threat to their existence and have engaged in turf wars with them, mostly in the asteroid fields of Tokyo. The Golden Chrysanthemums are a new problem, as they have few qualms about dealing in the drug trade or its consequences. Since they have no corruptible leaders or long associations with Samura or the Orsena government and police, the GC — like the Jade Vow — are dangerous to the Hogosha way of life. They view the Junkers as their only real competitors within the Nacre Reach, and their only obstacle to expansion into the other Houses. They have approached the Rift Captains to assist them in their plan, although no concrete steps have been taken.</TEXT><PARA/><PARA/><TEXT>The Hogosha made a recent arrangement to purchase Artifacts directly from the Rift Captains on the cruise ship </TEXT><TRA italic="true"/><TEXT>Hawaii</TEXT><TRA italic="false"/><TEXT>, a move that infuriated the GMG, who formerly served as the middleman between the two crime syndicates. It also raised the ire of the LSF, who applied pressure on Orbital Spa to deny landing privileges to the two factions.</TEXT><PARA/><POP/></RDL>'''
197 = '''<RDL><PUSH/><TEXT>CLASS: Mifune</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 5K</TEXT><PARA/><POP/></RDL>'''
198 = '''<RDL><PUSH/><TEXT>After Jump Gates linked Sablecross with the other colonies, the Orsena Shogunate decided that the resulting influx of foreign traffic needed careful management. As a result, Narita Outpost was constructed to serve as the final destination for all shipments to Sablecross and as a base of operations for the major foreign shipping firms, primarily Republican Shipping, Bowex, and Gateway Shipping.</TEXT><PARA/><POP/></RDL>'''
199 = '''<RDL><PUSH/><TEXT>DIAMETER: 14,802 km</TEXT><PARA/><TEXT>MASS: 6.01 x 10</TEXT><TRA font="9"/><TEXT>²⁴</TEXT><TRA font="default"/><TEXT> kg</TEXT><PARA/><TEXT>TERRAIN: Archipelago</TEXT><PARA/><TEXT>TEMPERATURE: -35°C to 39°C</TEXT><PARA/><TEXT>ESCAPE VELOCITY: 12.01 km/s</TEXT><PARA/><POP/></RDL>'''
200 = '''<RDL><PUSH/><TEXT>Settled in 5 AS, Sablecross is the capital of the Orsena Empire and, with nearly two hundred million people clinging to its scattered islands, its most populous planet. Despite — or perhaps because of — this crowding, Sablecross is a vibrant world with centuries of history and some of the most advanced technology in the colonies. It is also a culture in transition, as bureaucrats and corporations wrestle with the best ways to manage the rapidly increasing pace of change. To accomplish this difficult task, the Orsena ruling body, the Shogunate, works closely with corporate </TEXT><TRA italic="true"/><TEXT>keiretsu</TEXT><TRA italic="false"/><TEXT> — such as Samura and Kishiro — to advance the interests of the Empire while safeguarding the heritage of the Orsena people.</TEXT><PARA/><POP/></RDL>'''
201 = '''<RDL><PUSH/><TEXT>CLASS: Akebono</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 4K</TEXT><PARA/><POP/></RDL>'''
202 = '''<RDL><PUSH/><TEXT>In the early years of the Orsena Empire, foreign immigration was strictly controlled and permanent foreign settlements on Sablecross were strictly forbidden. While the Orsena Shogunate was unwilling to bend these rules, it still accommodated foreign business interests by constructing Roppongi Station in orbit. Since that time, Roppongi has largely become home to elite expatriates from Cinderwell and Larkspur who have long-term business to conduct in the system. The station is also a popular destination for Sablecross youths wishing to sample its entertainment concourses. Interspace Commerce (IC) maintains an office on board to oversee its interests in the system.</TEXT><PARA/><POP/></RDL>'''
203 = '''<RDL><PUSH/><TEXT>CLASS: Mifune</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 2K</TEXT><PARA/><POP/></RDL>'''
204 = '''<RDL><PUSH/><TEXT>Shinagawa Station is the headquarters for Kishiro, one of the two largest </TEXT><TRA italic="true"/><TEXT>keiretsu</TEXT><TRA italic="false"/><TEXT> — vast corporate networks — in the Orsena Empire. While not as politically well-connected as their primary competitor, Samura, Kishiro has instead focused its efforts on developing cutting-edge technology. Its most notable breakthrough was in 91 AS when scientists working aboard Shinagawa perfected the mass production of Optical Chips using a common Polymer base. These Optical Chips have since become key components in everything from Optronics to ships to Jump Gates and Trade Lanes.</TEXT><PARA/><POP/></RDL>'''
205 = '''<RDL><PUSH/><TEXT>CLASS: Nobunaga</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 3K</TEXT><PARA/><POP/></RDL>'''
206 = '''<RDL><PUSH/><TEXT>Shinjuku Station is the corporate headquarters for Samura, the oldest of the </TEXT><TRA italic="true"/><TEXT>keiretsu</TEXT><TRA italic="false"/><TEXT> — vast corporate networks — in the Orsena Empire. The history of Samura is deeply intertwined with that of the Empire, and Samura maintains close ties with the Orsena Shogunate, its ruling governmental body. Samura holds key contracts for the construction of the Orsena Navy and terraforming in the Tau Border Worlds, and previously held the exclusive rights for the distribution of valuable resources produced by the Gas Mining Guild (GMG). However, because the agreement with the GMG has recently expired, Samura faces intense competition for the GMG’s business from archrival Kishiro. Samura is also engaged in a protracted dispute with Synth Foods over the lucrative race to feed the ever expanding Orsena population.</TEXT><PARA/><POP/></RDL>'''
207 = '''<RDL><PUSH/><TEXT>CLASS: Okinawa</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 2K</TEXT><PARA/><TEXT>POPULATION: 9K</TEXT><PARA/><POP/></RDL>'''
208 = '''<RDL><PUSH/><TEXT>Constructed in 50 AS by Samura, Yokohama Shipyards was the first orbital construction facility built in Orsena. While Samura has been forced to cede the construction of gas transports and miners to archrival Kishiro, Yokohama still does a bustling business building large orbital habitats to house the overflowing Sablecross population and servicing the ships of the Orsena Navy.</TEXT><PARA/><POP/></RDL>'''
209 = '''<RDL><PUSH/><TEXT>CLASS: Delaware</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 9K</TEXT><PARA/><POP/></RDL>'''
210 = '''<RDL><PUSH/><TEXT>Deep Space Engineering constructed the Baltimore Shipyard as part of its overall operations, but when not at full capacity it also builds prison ships and cruise liners for sale on spec.</TEXT><PARA/><POP/></RDL>'''
211 = '''<RDL><PUSH/><TEXT>CLASS: Overlord</TEXT><PARA/><TEXT>CREW: </TEXT><TRA color="#FF0000"/><TEXT>CLASSIFIED</TEXT><TRA color="default"/><PARA/><TEXT>ARMAMENT: </TEXT><TRA color="#FF0000"/><TEXT>CLASSIFIED</TEXT><PARA/><POP/></RDL>'''
212 = '''<RDL><PUSH/><TEXT>The Battleship </TEXT><TRA italic="true"/><TEXT>Missouri</TEXT><TRA italic="false"/><TEXT>  is the flagship of the Helion Navy. The </TEXT><TRA italic="true"/><TEXT>Missouri</TEXT><TRA italic="false"/><TEXT>  has state-of-the-art weaponry and is constructed around a unique triple-hulled design that incorporates integrated armor plating. The armor plating is specially manufactured in the Norfolk Shipyards for the Helion Navy using a classified, proprietary process. The </TEXT><TRA italic="true"/><TEXT>Missouri</TEXT><TRA italic="false"/><TEXT>  has not yet seen action in any major conflict, but its presence serves as both a warning and a reminder to those who visit the Cinderwell System of the indomitable Helion spirit. Captain Wendi White currently commands the </TEXT><TRA italic="true"/><TEXT>Missouri</TEXT><TRA italic="false"/><TEXT>.</TEXT><PARA/><POP/></RDL>'''
213 = '''<RDL><PUSH/><TEXT>CLASS: Cochrane</TEXT><PARA/><TEXT>GRAVITY:Partial</TEXT><PARA/><TEXT>DOCKING: Restricted</TEXT><PARA/><TEXT>AMENITIES: No</TEXT><PARA/><TEXT>POPULATION: 50</TEXT><PARA/><POP/></RDL>'''
214 = '''<RDL><PUSH/><TEXT>Benford Research Station is a largely automated facility currently tasked with studying the gravitational anomalies found in the Badlands. Dr. Hermann Van Pelt is the project’s lead researcher.</TEXT><PARA/><POP/></RDL>'''
215 = '''<RDL><PUSH/><TEXT>CLASS: Leviathan</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Limited</TEXT><PARA/><TEXT>POPULATION: Unknown</TEXT><PARA/><POP/></RDL>'''
216 = '''<RDL><PUSH/><TEXT>The Rogues are a product of over two centuries of systematic lower-class cleansing that occurred on the Helion planets of Whiteharbor, Denver, and Los Angeles. Relocated to the Texas prison system, many of them end up planetside on Houston upon release. Some stayed straight and joined the population scratching out a living. The rest returned to their life of crime, often ending up vaporized by a pursuing Helion police patrol or back in prison for longer stretches, manning the prison factories that are the economic lifeblood of the Texas System.</TEXT><PARA/><PARA/><TEXT>Some say the massive LPI roundups of even minor offenders in Helion have more to do with staffing these plants cheaply than reducing crime. Fresh out of the incubator of the Texas prison system, they have limited choices. Either they work in the factories of Houston for a pittance, join the Bounty Hunters and hunt down their former brethren, go radical and hook up with the Xenos, or rejoin their former partners in crime. The latter path is the obvious one for most. Simply put, these are not-too-quick opportunists, people willing to do whatever it takes to make a buck and get by until tomorrow. Usually they end up taking the fall for anything illegal that occurs in Helion, whether they were involved or not.</TEXT><PARA/><PARA/><TEXT>The Rogues are generally a disorganized lot. They are responsible for most of the Trade Lane attacks in Helion space and the adjacent Independent Worlds, usually operating in groups of only two or three ships, without much grasp of advanced tactics. They also provide shelter for the Ashbound in exchange for Cardamine. Recently they have become the smugglers for much of the Cardamine in Helion space, supplementing or even replacing the Ashbound on certain high-risk routes. This has made them accomplices to the most persecuted criminal group in Helion space. They admire the Ashbound, wishing they could be as smart and careful as the Edge World faction. But they regard the LPI as their ultimate masters, perhaps aware that soon they will probably be under the LPI’s thumb once again.</TEXT><PARA/><PARA/><TEXT>The primary Rogue base is Buffalo, deep within the confines of the Badlands of Cinderwell. Secondary bases are in the Whitney Asteroid Field in California, the Reppu Cloud in Galileo, the Corcovado Field in Cortez, and the Wrangell Field in Hudson. Rogues are frequent visitors to Junker and Lane Hacker bases.</TEXT><PARA/><PARA/><POP/></RDL>'''
217 = '''<RDL><PUSH/><TEXT>CLASS: Ford</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: No</TEXT><PARA/><TEXT>POPULATION: 1K</TEXT><PARA/><POP/></RDL>'''
218 = '''<RDL><PUSH/><TEXT>Detroit is the headquarters for Detroit Munitions, one of the oldest privately owned companies in Helion. Detroit has been manufacturing small- and medium-sized arms since its founding by patriarch Ed Garner in 614 AS. His name still graces the company’s most popular line of blasters.</TEXT><PARA/><POP/></RDL>'''
219 = '''<RDL><PUSH/><TEXT>CLASS: Goliath</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 5K</TEXT><PARA/><POP/></RDL>'''
220 = '''<RDL><PUSH/><TEXT>Ft. Bush was one of the earliest outposts established during the settlement of Helion. As Helion expanded, Fort Bush became a popular jumping-off point for any number of wild business ventures as explorers set out to make their fortunes among the stars. Today Ft. Bush provides a haven for traders from all over Sirius who have business to conduct in Helion. A branch of Helion Police, Inc. (LPI) headquartered aboard the station helps maintain the peace necessary to a free economy by suppressing pirate activity in the debris fields and administrating automated weapons platforms that defend the nearby Trade Lane junction.</TEXT><PARA/><POP/></RDL>'''
221 = '''<RDL><PUSH/><TEXT>CLASS: Cochrane</TEXT><PARA/><TEXT>STATUS: Abandoned</TEXT><PARA/><POP/></RDL>'''
222 = '''<RDL><PUSH/><TEXT>The Ithaca Research Station is a government research facility primarily tasked with studying the gravitational anomalies found in the Badlands by collecting data from over 20,000 probes and drones stationed in the quadrant. The data is then coordinated with sensor readings taken by the computers aboard Benford Research Station. Additional research projects are currently classified.</TEXT><PARA/><POP/></RDL>'''
223 = '''<RDL><PUSH/><TEXT>DIAMETER: 12,753 km</TEXT><PARA/><TEXT>MASS: 5.98 x 10</TEXT><TRA font="9"/><TEXT>²⁴</TEXT><TRA font="default"/><TEXT> kg</TEXT><PARA/><TEXT>TERRAIN: Terrestrial</TEXT><PARA/><TEXT>TEMPERATURE: -46°C to 43°C</TEXT><PARA/><TEXT>ESCAPE VELOCITY: 11.27 km/s</TEXT><PARA/><POP/></RDL>'''
224 = '''<RDL><PUSH/><TEXT>Founded in the year 1 AS, Whiteharbor was the first human colony established in the Nacre Reach. Over the last eight centuries it has grown into a teeming world of 220 million people who live and work in a single city that covers the vast majority of the planet. Nearly the entire population is dedicated to the manifest destiny of the Helion free market, and today Whiteharbor is the hub of a vast commercial network that stretches into almost every corner of Sirius. While “going to Whiteharbor” has become a commonly accepted phrase for leaving home to seek your fortune, the cost of living on Whiteharbor itself is extravagantly high. If a trend is new and exciting — and expensive — then it almost certainly originated here.</TEXT><PARA/><POP/></RDL>'''
225 = '''<RDL><PUSH/><TEXT>CLASS: Chasins</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 5K</TEXT><PARA/><POP/></RDL>'''
226 = '''<RDL><PUSH/><TEXT>Newark Station is the local headquarters for Interspace Commerce (IC), one of the largest financial concerns in the Nacre Reach. While IC was initially responsible for financing the construction of the vast Jump Gate and Trade Lane network that connects the various colonies, it was forced to divest itself of these holdings as a result of the Dornmark-Orsena Trade Embargo in 521 AS. IC has since transitioned to insuring cargo shipments within and between the various colonies. The remainder of the Newark Station population is a constantly shifting crowd of traders, technocrats, executives, and Bounty Hunters, all cutting deals and arranging for the transport or protection of their goods.</TEXT><PARA/><POP/></RDL>'''
227 = '''<RDL><PUSH/><TEXT>CLASS: Alabama</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 9K</TEXT><PARA/><POP/></RDL>'''
228 = '''<RDL><PUSH/><TEXT>The Norfolk Shipyard, in continuous operation since its construction in 230 AS, has the honor of being the oldest functional shipyard in the Nacre Reach. The facilities at Norfolk are chiefly used by the Helion Navy.</TEXT><PARA/><POP/></RDL>'''
229 = '''<RDL><PUSH/><TEXT>DIAMETER: 6,485 km</TEXT><PARA/><TEXT>MASS: 4.73 x 10</TEXT><TRA font="9"/><TEXT>²⁴</TEXT><TRA font="default"/><TEXT> kg</TEXT><PARA/><TEXT>TERRAIN: Desert</TEXT><PARA/><TEXT>TEMPERATURE: -38°C to 69°C</TEXT><PARA/><TEXT>ESCAPE VELOCITY: 9.04 km/s</TEXT><PARA/><POP/></RDL>'''
230 = '''<RDL><PUSH/><TEXT>Breakwater is covered by a single vast desert, broken only by large rocky outcroppings that have yet to be consumed by the sand. Without any ice asteroids in close proximity, the planet was not considered a good candidate for terraforming and remained sparsely populated until a full-scale mineral survey in 650 AS pinpointed deposits of Boron in the form of borax salts deep within the Corridera Plateau. A mining operation was established on the planet in 660 AS by Deep Space Engineering to exploit these deposits, and it is now the only raw material extraction facility within Helion space.</TEXT><PARA/><POP/></RDL>'''
231 = '''<RDL><PUSH/><TEXT>CLASS: Unknown</TEXT><PARA/><TEXT>GRAVITY: Unknown</TEXT><PARA/><TEXT>DOCKING: Unknown</TEXT><PARA/><TEXT>AMENITIES: Unknown</TEXT><PARA/><TEXT>POPULATION: Unknown</TEXT><PARA/><POP/></RDL>'''
232 = '''<RDL><PUSH/><TEXT>Where there’s junk, there are the Junkers. They’ve been around since the earliest days of the Trade Lanes. Descended from the working classes, they developed within the House systems as a sort of necessary evil, handling the dirty work that no one else would. They do well salvaging valuable materials from the ever-increasing debris fields throughout Sirius, with the notable exception of Orsena. To this day they remain held at bay by the Hogosha.</TEXT><PARA/><PARA/><TEXT>Anyone who deals with Junkers knows they live by a strict code; if you’re not a Junker, you’re not part of the family. A Junker will double-cross you without a second thought, and they’re fiercely protective of each other. Most House corporations consider the Junkers to be simple criminals, but Junkers will occasionally do favors for the police, turning in the odd, mid-level criminal or letting them know about the occasional drug shipment. So despite some harassment, the police stop short of shutting them down. The infrequent police cleanup operations are little more than exercises in public relations, though there’s no love lost between the two groups.</TEXT><PARA/><PARA/><TEXT>The Junkers make their official money from salvaging debris within the fields, but also have a good deal going with various criminals, who like their “no questions asked” policy. Tolerated by the governments, Junkers sometimes deal in contraband, but they are extremely hard to catch red-handed. They are frequently patronized by the criminal element for the refuge they offer within the often hostile territory of House capital systems.</TEXT><PARA/><PARA/><TEXT>Helion has two groups: a major population in the Cinderwell System, and a smaller enclave in Texas. The Junker base of operations in Larkspur is located near the shipyards within the Southampton Debris Field. In Ironreach they scavenge the remaining pockets of industrial waste and scrap within the asteroid fields. Their latest foray is a departure — a base in the Border Worlds. Attracted by the ALG operation in Sigma-13, they have set up shop near the facility and do most of the dirty work, picking off the best loot from the old ships for themselves. It also serves as a convenient launching point for Cardamine and Artifact runs into Ironreach. Long-distance smuggling is new for the faction, which is still perfecting this skill.</TEXT><PARA/><POP/></RDL>'''
233 = '''<RDL><PUSH/><TEXT>CLASS: Cochrane</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 1K</TEXT><PARA/><POP/></RDL>'''
234 = '''<RDL><PUSH/><TEXT>Ember Pier Outpost is home to Universal Shipping, one of the Big Three family of Helion companies that also includes Ageira Technologies and Deep Space Engineering. Universal Shipping made its fortune by gambling on shipping silver from California to Colorado for use in terraforming Los Angeles, long before Jump Gates and Trade Lanes reduced the risk of transporting goods over such long distances. Universal then cemented its reputation as the premiere Helion shipping company in 181 AS by signing a contract to handle all shipping between Ageira Technologies facilities and Deep Space Engineering construction sites.</TEXT><PARA/><POP/></RDL>'''
235 = '''<RDL><PUSH/><TEXT>CLASS: Military</TEXT><PARA/><TEXT>GRAVITY: </TEXT><TRA color="#FF0000"/><TEXT>CLASSIFIED</TEXT><TRA color="default"/><PARA/><TEXT>DOCKING: </TEXT><TRA color="#FF0000"/><TEXT>CLASSIFIED</TEXT><TRA color="default"/><PARA/><TEXT>AMENITIES: </TEXT><TRA color="#FF0000"/><TEXT>CLASSIFIED</TEXT><TRA color="default"/><PARA/><TEXT>POPULATION: </TEXT><TRA color="#FF0000"/><TEXT>CLASSIFIED</TEXT><PARA/><POP/></RDL>'''
236 = '''<RDL><PUSH/><TEXT>West Point Military Academy has been training the best and brightest officers in the Helion military for over 600 years. The commandant for West Point is currently Admiral Walter Evans, and his staff includes decorated veterans such as Captain Jason Findley and Captain Marcus Walker.</TEXT><PARA/><POP/></RDL>'''
237 = '''<RDL><PUSH/><TEXT>CLASS: Unknown</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: Unknown</TEXT><PARA/><POP/></RDL>'''
238 = '''<RDL><PUSH/><TEXT>A Red Hessian base. Cinder Guard are a trained, organized group of pirates and are considered extremely dangerous.</TEXT><PARA/><POP/></RDL>'''
239 = '''<RDL><PUSH/><TEXT>CLASS: Sanctuary</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 750</TEXT><PARA/><POP/></RDL>'''
240 = '''<RDL><PUSH/><TEXT>Locked in a geosynchronous orbit within the planetary shadow of Schutz, Solarius Station is the sole safe haven in the dangerous environ of Omega-11. At the heart of the system is a late-stage red giant that releases random radiation storms, fatal to any organic life unfortunate enough to be caught without protection. Despite the hazards, however, the Omega-11 System is also one of the most abundant sources of Diamonds in Sirius, the valuable gemstones locked in the circle of volcanic asteroids that ring the dying sun. Daumann Heavy Construction obtained the contract to develop Omega-11 and by 410 AS had managed to finish the construction of Solarius Station — at the cost of 87 men and women who died “for the greater glory of Dornmark and its people.”</TEXT><PARA/><POP/></RDL>'''
241 = '''<RDL><PUSH/><TEXT>CLASS: Cochrane</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Restricted</TEXT><PARA/><TEXT>AMENITIES: Limited</TEXT><PARA/><TEXT>POPULATION: Automated</TEXT><PARA/><POP/></RDL>'''
242 = '''<RDL><PUSH/><TEXT>The Baxter Research Station is an automated facility studying the asteroid-rich Omega-3 System.</TEXT><PARA/><POP/></RDL>'''
243 = '''<RDL><PUSH/><TEXT>CLASS: Wellington</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Limited</TEXT><PARA/><TEXT>POPULATION: 450</TEXT><PARA/><POP/></RDL>'''
244 = '''<RDL><PUSH/><TEXT>Douglas Station is owned and operated by Vespera Mining and Metal (BMM) for the manufacturing of Polymers using the abundant raw materials in the system. Security around the facility is abnormally high due to frequent skirmishes with Rift Captains.</TEXT><PARA/><POP/></RDL>'''
245 = '''<RDL><PUSH/><TEXT>CLASS: Dern</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 2K</TEXT><PARA/><POP/></RDL>'''
246 = '''<RDL><PUSH/><TEXT>Freeport 1 was founded by a group of Zoners over sixty years ago. It was the first station of its kind to be declared open to all, and it still provides a place for commerce and Food sales to everyone, regardless of legal status.</TEXT><PARA/><POP/></RDL>'''
247 = '''<RDL><PUSH/><TEXT>CLASS: Abbey</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Limited</TEXT><PARA/><TEXT>POPULATION: 250</TEXT><PARA/><POP/></RDL>'''
248 = '''<RDL><PUSH/><TEXT>Rugen Station was built by Daumann Heavy Construction for the manufacturing of Polymers using the abundant raw materials found in the system. While pirates are always a problem, Daumann’s long-running rivalry with the neighboring Vespera Mining and Metal (BMM) operation on Douglas Station has resulted in more than a few exchanges of weapons fire.</TEXT><PARA/><POP/></RDL>'''
249 = '''<RDL><PUSH/><TEXT>DIAMETER: 7,053 km</TEXT><PARA/><TEXT>MASS: 10.98 x 10</TEXT><TRA font="9"/><TEXT>²³</TEXT><TRA font="default"/><TEXT> kg</TEXT><PARA/><TEXT>TERRAIN: Desert</TEXT><PARA/><TEXT>TEMPERATURE: -71°C to 70°C</TEXT><PARA/><TEXT>ESCAPE VELOCITY: 13.57 km/s</TEXT><PARA/><POP/></RDL>'''
