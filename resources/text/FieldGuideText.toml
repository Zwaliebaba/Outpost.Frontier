254 = '''<RDL><PUSH/><TEXT>A Corsair base. Rift Captains are a well-trained, well-armed, organized group of pirates engaged in a wide range of illegal activities.</TEXT><PARA/><POP/></RDL>'''
255 = '''<RDL><PUSH/><TEXT>CLASS: Unknown</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: Unknown</TEXT><PARA/><POP/></RDL>'''
256 = '''<RDL><PUSH/><TEXT>A Corsair base. Rift Captains are a well-trained, well-armed, organized group of pirates engaged in a wide range of illegal activities.</TEXT><PARA/><POP/></RDL>'''
