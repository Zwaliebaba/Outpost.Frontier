258 = '''<RDL><PUSH/><TEXT>A Red Hessian base. Cinder Guard are a trained, organized group of pirates and are considered extremely dangerous.</TEXT><PARA/><POP/></RDL>'''
259 = '''<RDL><PUSH/><TEXT>CLASS: Cathedral</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Limited</TEXT><PARA/><TEXT>POPULATION: 275</TEXT><PARA/><POP/></RDL>'''
260 = '''<RDL><PUSH/><TEXT>The Briesen Mining Facility is controlled by Daumann Heavy Construction for the extraction of Copper and Cobalt deposits from the system.</TEXT><PARA/><POP/></RDL>'''
261 = '''<RDL><PUSH/><TEXT>CLASS: Cathedral</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Limited</TEXT><PARA/><TEXT>POPULATION: 400</TEXT><PARA/><POP/></RDL>'''
262 = '''<RDL><PUSH/><TEXT>Elbich Mining Facility is owned and operated by Kruger Minerals. Elbich focuses exclusively on the extraction of Silver from local asteroid fields.</TEXT><PARA/><POP/></RDL>'''
263 = '''<RDL><PUSH/><TEXT>CLASS: Cochrane</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 300</TEXT><PARA/><POP/></RDL>'''
264 = '''<RDL><PUSH/><TEXT>Freistadt Base is run by the Independent Mining Guild (IMG) to provide support for the mining of Copper, Cobalt, and Silver from nearby asteroid fields. Of course, the IMG asks few questions about where the ore was actually mined, and a few Cinder Guard have been known to take advantage of that fact when selling their goods. Gateway Shipping handles most of the cargo runs from Freistadt, while Deep Space Engineering teams and members of the Charter Guild are also frequently seen aboard.</TEXT><PARA/><POP/></RDL>'''
265 = '''<RDL><PUSH/><TEXT>DIAMETER: 13,534 km</TEXT><PARA/><TEXT>MASS: 6.02 x 10</TEXT><TRA font="9"/><TEXT>²⁴</TEXT><TRA font="default"/><TEXT> kg</TEXT><PARA/><TEXT>TERRAIN: Terrestrial</TEXT><PARA/><TEXT>TEMPERATURE: -23°C to 31°C</TEXT><PARA/><TEXT>ESCAPE VELOCITY: 12.69 km/s</TEXT><PARA/><POP/></RDL>'''
266 = '''<RDL><PUSH/><TEXT>The crippled sleeper ship </TEXT><TRA italic="true"/><TEXT>Perihelion</TEXT><TRA italic="false"/><TEXT>  arrived in Omicron Alpha almost 800 years ago. Its passengers named the planet Malta — a harsh place of acidic oceans, gray skies, and vast plains covered in a species of tall, thin, orange grass. They later learned that the grass could be rendered into a narcotic substance, that they called Cardamine.</TEXT><PARA/><PARA/><TEXT>Eventually the Ashbound — as they came to think of themselves — began limited exploration of their system. As pilots wandered farther and farther afield in search of resources, many became seriously ill. Upon planetfall, the crews mysteriously recovered.</TEXT><PARA/><PARA/><TEXT>Doctors were baffled. By chance, they made a genetic scan of a critically ill pilot and made a startling discovery. His genetic codes had been altered. Outcast DNA contained strands identical to that of the orange grasses that covered the planet — from which Cardamine was derived. Trace amounts were present in everything on the planet, from the air they breathed to the water they drank. Once pilots made lengthier journeys away from Malta, their bodies went into shock, followed by death.</TEXT><PARA/><PARA/><TEXT>The Ashbound were now truly separated from the rest of humanity — changed so that they could never expand beyond the planet on which they had landed. They needed the Cardamine now, like air or food or water. But with the origin of the sickness solved, they could at least compensate by carrying supplies of Cardamine with them and resume their exploration of their surrounding systems.</TEXT><PARA/><PARA/><TEXT>When they encountered the rest of the Houses in the seventh century, a new strategy emerged. The Ashbound would deliver the poison that would rot the other Houses from the inside out and grow rich from the profits of their trade.</TEXT><PARA/><PARA/><TEXT>Today the Ashbound conduct a lucrative drug-smuggling operation using the network of Jump Holes to escape detection and transport their product into the heart of the House systems. The Ashbound remain relatively few in number; a crash in the birth rate seems to have been another side effect of their genetic modification.</TEXT><PARA/><PARA/><TEXT>A new development has been Cryer’s continued efforts to create a synthetic version of Cardamine that would be approved as a legal medication within Helion. This poses a direct threat to the Ashbound’ source of income. The Atka Research Station, with nearby access to Edge Nebula clouds, is the most immediate threat to the Ashbound. The location of the base within Corsair territory has brought the Ashbound into conflict with their ancient brethren.</TEXT><PARA/><POP/></RDL>'''
267 = '''<RDL><PUSH/><TEXT>CLASS: Unknown</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Limited</TEXT><PARA/><TEXT>POPULATION: Unknown</TEXT><PARA/><POP/></RDL>'''
268 = '''<RDL><PUSH/><TEXT>An Outcast base. Ashbound are believed to be involved in the production and distribution of the drug Cardamine, which has been declared illegal in the four major Houses.</TEXT><PARA/><POP/></RDL>'''
269 = '''<RDL><PUSH/><TEXT>DIAMETER: 17,609 km</TEXT><PARA/><TEXT>MASS: 7.02 x 10</TEXT><TRA font="9"/><TEXT>²⁴</TEXT><TRA font="default"/><TEXT> kg</TEXT><PARA/><TEXT>TERRAIN: Terrestrial</TEXT><PARA/><TEXT>TEMPERATURE: -2°C to 41°C</TEXT><PARA/><TEXT>ESCAPE VELOCITY: 14.01 km/se</TEXT><PARA/><POP/></RDL>'''
270 = '''<RDL><PUSH/><TEXT>The ancestors of the Rift Captains that had set adrift from the crippled </TEXT><TRA italic="true"/><TEXT>Perihelion</TEXT><TRA italic="false"/><TEXT>  made planetfall on Crete shortly after the other Houses arrived in the Nacre Reach.</TEXT><PARA/><PARA/><TEXT>Scratching out a living, the Rift Captains managed a bleak existence for four centuries. Eventually they developed a strong self-identity, isolated from the rest of the Houses. In 450 AS, that insular world changed. An exploratory expedition headed by Franz Schulman — financed by Daumann and the Dornmark government — stumbled into the system while mapping the far reaches of the Walker Nebula. The local inhabitants, sensing a historic opportunity, attacked the landing party en masse, killing all save Schulman, whom they took hostage to gain control of the mother ship Schiller in orbit above the planet.</TEXT><PARA/><PARA/><TEXT>No one is entirely sure who first nicknamed them the “Rift Captains,” recalling the ancient pirate clans of the Mediterranean, but the name came into popular use among the Houses sometime around 500 AS. The Rift Captains began attacking unprotected outposts and ships, plundering whatever supplies and equipment they could lay their hands on, before escaping through one of their secret Jump Holes. The systematic expansion of the Houses into the Omega Border Worlds further fueled the Corsair movement, dramatically increasing the quantity and variety of accessible goods.</TEXT><PARA/><PARA/><TEXT>The final chapter began in the sixth century AS, when an enterprising, well-armed independent Helion pilot named Jim Bown made his way to Omicron Gamma. He brought various Consumer Goods to trade, but the Rift Captains could offer little but Artifacts. A year later, he returned. Those trinkets were all the rage with the elite of Whiteharbor. He saw a great business opportunity if they could set up a viable trade route to Helion. The Rift Captains were on their way. They grew rapidly in size and sophistication as they built up the Artifact trade.</TEXT><PARA/><PARA/><TEXT>The primary smuggling route goes north to Sigma-19, where Artifacts are traded with the Hogosha onboard the </TEXT><TRA italic="true"/><TEXT>Hawaii</TEXT><TRA italic="false"/><TEXT>. They have also opened up a route into Dornmark via the Yanagi Junker base in Sigma-13. In the west the Rift Captains invaded Vespera in order to reach the Junker Trafalgar base in Larkspur.</TEXT><PARA/><PARA/><TEXT>The Charter Guild has taken advantage of several Freeports in the Edge Worlds to attack the Rift Captains’ home system. So far they’ve been more of a nuisance than a real threat, but the presence of Zoner-controlled bases so close to Omicron Gamma has provoked intense debate among the Elders of Crete regarding the future of nearby Independent bases.</TEXT><PARA/><POP/></RDL>'''
271 = '''<RDL><PUSH/><TEXT>CLASS: Unknown</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Limited</TEXT><PARA/><TEXT>POPULATION: Unknown</TEXT><PARA/><POP/></RDL>'''
272 = '''<RDL><PUSH/><TEXT>A Corsair shipyard with minimal capabilities. Rift Captains are a well-trained, well-armed, organized group of pirates engaged in a wide range of illegal activities.</TEXT><PARA/><POP/></RDL>'''
273 = '''<RDL><PUSH/><TEXT>DIAMETER: 15,302 km</TEXT><PARA/><TEXT>MASS: 6.62 x 10</TEXT><TRA font="9"/><TEXT>²⁴</TEXT><TRA font="default"/><TEXT> kg</TEXT><PARA/><TEXT>TERRAIN: Unknown</TEXT><PARA/><TEXT>TEMPERATURE: -23°C to 40°C</TEXT><PARA/><TEXT>ESCAPE VELOCITY: 13.78 km/s</TEXT><PARA/><POP/></RDL>'''
274 = '''<RDL><PUSH/><TEXT>An Order base. No further information is available.</TEXT><PARA/><POP/></RDL>'''
275 = '''<RDL><PUSH/><TEXT>CLASS: Unknown</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 100</TEXT><PARA/><POP/></RDL>'''
276 = '''<RDL><PUSH/><TEXT>Freeport 9 is very nearly the only human population for hundreds of light years in every direction — which is exactly the way the Zoners like it. Despite its location in a system filled with strange nebula and forbidding black crystals, however, Freeport 9 is a frequent stop for criminal organizations looking to buy Food from the Freeport’s biodome, while Cryer Pharmaceuticals has shown an intense interest in the Alien Organisms that colonize many of the asteroids in the system.</TEXT><PARA/><POP/></RDL>'''
277 = '''<RDL><PUSH/><TEXT>CLASS: Sekigahara</TEXT><PARA/><TEXT>CREW: </TEXT><TRA color="#FF0000"/><TEXT>CLASSIFIED</TEXT><TRA color="default"/><PARA/><TEXT>ARMAMENT: </TEXT><TRA color="#FF0000"/><TEXT>CLASSIFIED</TEXT><PARA/><POP/></RDL>'''
278 = '''<RDL><PUSH/><TEXT>One of the first ships constructed for the Orsena Navy by Samura, the Battleship </TEXT><TRA italic="true"/><TEXT>Myoko</TEXT><TRA italic="false"/><TEXT>  is the most venerable of those military ships still in service. It is currently deployed in the Shikoku System to help stem the growing tide of piracy from the Independent Worlds. The </TEXT><TRA italic="true"/><TEXT>Myoko</TEXT><TRA italic="false"/><TEXT>  is scheduled for decommissioning in 806 AS, but it still remains a powerful warning to any outsiders who may wish to cause trouble.</TEXT><PARA/><POP/></RDL>'''
279 = '''<RDL><PUSH/><TEXT>CLASS: Akebono</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 7K</TEXT><PARA/><POP/></RDL>'''
280 = '''<RDL><PUSH/><TEXT>The Shikoku System was originally a gateway for almost all of the traffic originating from Helion and the independent worlds. Entry requirements for the Sablecross System were initially very strict, and as a result, Shikoku became home to a large band of itinerant foreigners. Deshima Station was constructed in 350 AS to house this population, and despite the significant relaxation of Sablecross System entry requirements, it still serves as a way station. Over the years Deshima has been substantially improved through the addition of a Synth Foods biodome, the construction of additional living space, and a partnership with Kishiro to manufacture Consumer Goods. The Charter Guild also recently opened an office here as the large numbers of foreigners in the system includes a significant criminal element.</TEXT><PARA/><POP/></RDL>'''
281 = '''<RDL><PUSH/><TEXT>CLASS: Mifune</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: No</TEXT><PARA/><TEXT>POPULATION: 6K</TEXT><PARA/><POP/></RDL>'''
282 = '''<RDL><PUSH/><TEXT>Originally located in the Sablecross System, Fuchu Prison was moved to the Shikoku System in 600 AS to handle the burgeoning foreign criminal element that was plaguing the area. While nearly 70% of the prisoners are from outside of Orsena space, the remaining 30% are almost exclusively members of a radical, political terrorist group called the Jade Vow. “Rehabilitation through work” is a core principal of the Fuchu Prison mandate, and inmates are routinely deployed to mine Hydrocarbon and work the Junyo fishing platforms.</TEXT><PARA/><POP/></RDL>'''
283 = '''<RDL><PUSH/><TEXT>DIAMETER: 5,280 km</TEXT><PARA/><TEXT>MASS: 3.89 x 10</TEXT><TRA font="9"/><TEXT>²⁴</TEXT><TRA font="default"/><TEXT> kg</TEXT><PARA/><TEXT>TERRAIN: Water</TEXT><PARA/><TEXT>TEMPERATURE: 4°C to 46°C</TEXT><PARA/><TEXT>ESCAPE VELOCITY: 8.83 km/s</TEXT><PARA/><POP/></RDL>'''
284 = '''<RDL><PUSH/><TEXT>Junyo is almost entirely covered by a deep ocean that remains liquid across the planet’s entire surface due to the young, hot Shikoku sun. While initially dismissed as infeasible for further development, the impending collapse of fisheries throughout Orsena in 630 AS motivated the government to begin terraforming the planet using recently discovered Alien Organisms in order to jump-start the nascent ecology. Within 50 years, the planetary environment had been sufficiently altered to begin wide-scale production of Luxury Foods under the administration of Samura, a company that refuses to concede the market to the competing Helion firm of Synth Foods.</TEXT><PARA/><POP/></RDL>'''
285 = '''<RDL><PUSH/><TEXT>CLASS: Mifune</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 175</TEXT><PARA/><POP/></RDL>'''
286 = '''<RDL><PUSH/><TEXT>Ohashi Station was originally constructed to process all requests for entry into the Sablecross System by foreigners. As entry requirements were relaxed, however, Ohashi transitioned into a base of operations for the Orsena State Police, who patrols the area in an effort to suppress the activities of the Jade Vow.</TEXT><PARA/><POP/></RDL>'''
287 = '''<RDL><PUSH/><TEXT>CLASS: Nostromo</TEXT><PARA/><TEXT>AMENITIES: Limited</TEXT><PARA/><TEXT>CREW: 400</TEXT><PARA/><POP/></RDL>'''
288 = '''<RDL><PUSH/><TEXT>Rich in vital gas resources, the Sigma-13 System has been contested by a number of groups since its discovery in 60 AS. Conflict reached a fever pitch when the system became one of the more fiercely contested prizes during the 80-Years War between the Gas Mining Guild (GMG) and Dornmark. Using speed and a thorough knowledge of the territory, the GMG managed to push back the Dornmark forces, finally obliterating the bulk of the Dornmark Navy at the Battle of the Yanagi Nebula. Since that time the system has been almost exclusively under GMG control, and the Gas Miner </TEXT><TRA italic="true"/><TEXT>Naha</TEXT><TRA italic="false"/><TEXT>  has provided support for the GMG’s extensive mining operations.</TEXT><PARA/><POP/></RDL>'''
289 = '''<RDL><PUSH/><TEXT>CLASS: Abbey</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 200</TEXT><PARA/><POP/></RDL>'''
290 = '''<RDL><PUSH/><TEXT>At the Battle of the Yanagi Nebula, the forces of the Gas Mining Guild managed to obliterate almost the entire Dornmark Navy in a surprise maneuver. The remnant of that great battle is a vast field of Scrap Metal and radioactive cores that has rendered the area a major navigational hazard. Under an agreement brokered by Interspace Commerce (IC), ALG Waste Disposal has been allowed to build Helgoland Station and begin clean-up of the affected area, shipping Scrap Metal and other waste back to Dornmark for re-smelting.</TEXT><PARA/><POP/></RDL>'''
291 = '''<RDL><PUSH/><TEXT>CLASS: Unknown</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Limited</TEXT><PARA/><TEXT>POPULATION: Unknown</TEXT><PARA/><POP/></RDL>'''
292 = '''<RDL><PUSH/><TEXT>A Junker base. Junkers are an itinerant population unaffiliated with any colony. They salvage and then resell abandoned ships, equipment, and other scrap.</TEXT><PARA/><POP/></RDL>'''
293 = '''<RDL><PUSH/><TEXT>CLASS: Tyrell</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 200</TEXT><PARA/><POP/></RDL>'''
294 = '''<RDL><PUSH/><TEXT>The Atka Research Center was constructed by Cryer Pharmaceuticals to study the Alien Organisms commonly found in the Edge clouds. Cryer is intensely interested in the commercial applications of these Organisms because they have proven useful in several phases of terraforming. Cryer imports substantial quantities from the nearby Samura operation on Kurile.</TEXT><PARA/><POP/></RDL>'''
295 = '''<RDL><PUSH/><TEXT>DIAMETER: 12,802 km</TEXT><PARA/><TEXT>MASS: 5.88 x 10</TEXT><TRA font="9"/><TEXT>²⁴</TEXT><TRA font="default"/><TEXT> kg</TEXT><PARA/><TEXT>TERRAIN: Water</TEXT><PARA/><TEXT>TEMPERATURE: 2°C to 38°C</TEXT><PARA/><TEXT>ESCAPE VELOCITY: 11.83 km/s</TEXT><PARA/><POP/></RDL>'''
296 = '''<RDL><PUSH/><TEXT>Initially discovered by the Gas Mining Guild (GMG) in 620 AS, the planet Kurile exists in the heart of an astronomical anomaly — a gravitational tidal pool that creates a clear zone in the middle of an otherwise treacherous nebula. The planet itself is entirely covered in water with a saline content so high that it is toxic to almost all known aquatic life elsewhere in Sirius. Despite this, Kurile possesses a single native life form, a microorganism that manages to thrive in its otherwise poisonous oceans. Samura eventually managed to construct a research platform on Kurile as part of an effort to harvest the microorganisms for use as fish food on Junyo — an incredibly success initiative.</TEXT><PARA/><POP/></RDL>'''
297 = '''<RDL><PUSH/><TEXT>CLASS: Nostromo</TEXT><PARA/><TEXT>AMENITIES: Limited</TEXT><PARA/><TEXT>CREW: 350</TEXT><PARA/><POP/></RDL>'''
298 = '''<RDL><PUSH/><TEXT>The Gas Mining Guild (GMG) first surveyed the Sigma-19 System in 550 AS and determined that it was rich in resources — though far distant from the GMG’s usual markets. After intense negotiations, the GMG signed an agreement with Kishiro to finance a Jump Gate to the system in exchange for mining rights. Once the Jump Gate was opened in 650 AS, the Gas Miner </TEXT><TRA italic="true"/><TEXT>Ogashawa</TEXT><TRA italic="false"/><TEXT>  was stationed in the system by the GMG and began full-scale operations. The fact that several Kishiro expert advisors are permanently assigned to the ship and that the </TEXT><TRA italic="true"/><TEXT>Ogashawa</TEXT><TRA italic="false"/><TEXT>  provides support for Kishiro’s own mining activities in the system has reportedly not been well received by its corporate rival, Samura.</TEXT><PARA/><POP/></RDL>'''
299 = '''<RDL><PUSH/><TEXT>CLASS: Wilde</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>PASSENGERS: 500</TEXT><PARA/><POP/></RDL>'''
300 = '''<RDL><PUSH/><TEXT>The spectacular vistas of the Sigma-19 System — said by many to be among the most beautiful in all of Sirius — did not go unnoticed by the tourist industry for long, and in 791 AS Orbital Spa and Cruise Lines stationed its state-of-the-art luxury liner </TEXT><TRA italic="true"/><TEXT>Hawaii</TEXT><TRA italic="false"/><TEXT>  in the system. An incredibly popular destination, the </TEXT><TRA italic="true"/><TEXT>Hawaii</TEXT><TRA italic="false"/><TEXT>  has operated at near capacity almost from the beginning. The location of the ship outside the policed boundaries of the colonies is also rumored to be part of the attraction, and much of the popularity of the </TEXT><TRA italic="true"/><TEXT>Hawaii</TEXT><TRA italic="false"/><TEXT>  lies in the implied promise of forbidden fruit available to those who can afford a ticket.</TEXT><PARA/><POP/></RDL>'''
301 = '''<RDL><PUSH/><TEXT>DIAMETER: 11,293 km</TEXT><PARA/><TEXT>MASS: 5.96 x 10</TEXT><TRA font="9"/><TEXT>²⁴</TEXT><TRA font="default"/><TEXT> kg</TEXT><PARA/><TEXT>TERRAIN: Terrestrial</TEXT><PARA/><TEXT>TEMPERATURE: 6°C to 42°C</TEXT><PARA/><TEXT>ESCAPE VELOCITY: 10.99 km/s</TEXT><PARA/><POP/></RDL>'''
302 = '''<RDL><PUSH/><TEXT>Baden-Baden is an idyllic world of large oceans, black sand beaches, and the odd hot spring bubbling from volcanic outcroppings of rock. Orbital Spa and Cruise Lines maintains a popular resort here, though it has seen a decline in business as the economic situation in Dornmark grows worse while radicals sympathetic to the LWB farmer’s movement attack government officials who vacation here. Orbital has reportedly been trying to remedy the situation by attracting bargain-hunting Helion tourists.</TEXT><PARA/><POP/></RDL>'''
303 = '''<RDL><PUSH/><TEXT>CLASS: Unknown</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Limited</TEXT><PARA/><TEXT>POPULATION: Unknown</TEXT><PARA/><POP/></RDL>'''
304 = '''<RDL><PUSH/><TEXT>Stuttgart has been the breadbasket of Dornmark since 100 years after settlement. Over time, its farmers formed a powerful union, named the WVS. The organization successfully lobbied the Dornmark government to subsidize Stuttgart agriculture for hundreds of years. With the end of the 80-Years War in 680 AS, however, the subsidies were no longer tenable.</TEXT><PARA/><PARA/><TEXT>In a secret deal during the war, the Dornmark government borrowed huge sums from Helion. Facing default on their loans, they were forced to offer something to House Helion. Synth Foods wanted complete access to Stuttgart, which Dornmark granted in exchange for renegotiated debt repayment terms. Immediately the Helion Food giant moved in, buying out huge numbers of nearly bankrupt Stuttgart farmers. Much of Stuttgart was converted into vast expanses of the bio-engineered mono-crops of Synth Foods.</TEXT><PARA/><PARA/><TEXT>The government backed the foreign company wholeheartedly and looked the other way as Synth Foods used unscrupulous business practices to further consolidate its control over Stuttgart. Remaining independent farmers were forced to buy all of their Fertilizers and seeds from Synth Foods and sell all of their production to them at low fixed rates — prices that were designed to squeeze the maximum out of the farmer and shift all risk away from Synth Foods.</TEXT><PARA/><PARA/><TEXT>The once proud Stuttgart farmers were reduced to indentured servants. Inexorably, Synth Foods assimilated the bulk of the planet’s arable land, dutifully paying its Dornmark federal taxes and feeding the bribe machine in Ironreach. The WVS tried to fight back legally in the courts but soon discovered that their influence had been sold to a higher bidder. Finally, in what some called an act of desperation, the more radical elements of the WVS left Stuttgart and founded the Landwirtrechtbewegung — farmers rights movement — simply referred to as the LWB.</TEXT><PARA/><PARA/><TEXT>LWB built a small depot called Darmstadt within the Ostnebel. This serves as a base for operations targeted at Synth Foods convoys within Dornmark space. The Cinder Guard also use it as way station along their route to Omega-11. The “war” has been going on for 25 years now, and both sides claim to be winning — although Synth Foods now controls 90 percent of the planet’s agriculture vs. 60 percent just three decades ago.</TEXT><PARA/><POP/></RDL>'''
305 = '''<RDL><PUSH/><TEXT>CLASS: Abbey</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 250</TEXT><PARA/><POP/></RDL>'''
306 = '''<RDL><PUSH/><TEXT>Freiburg Station was originally constructed in 312 AS as a clearinghouse for produce harvested on Stuttgart, but now it also handles traffic from foreign shipping companies who increasingly use the Stuttgart System as an alternative to shipping through the Hamburg System.</TEXT><PARA/><POP/></RDL>'''
307 = '''<RDL><PUSH/><TEXT>CLASS: Chapel</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 130</TEXT><PARA/><POP/></RDL>'''
308 = '''<RDL><PUSH/><TEXT>Konstanz Border Station is one of two command centers for the Dornmark Federal Police in the Stuttgart System. The Federal Police is tasked with handling the interdiction of all illegal activity in the area, including drug trafficking, smuggling, and pirate activity.</TEXT><PARA/><POP/></RDL>'''
309 = '''<RDL><PUSH/><TEXT>DIAMETER: 15,209 km</TEXT><PARA/><TEXT>MASS: 6.12 x 10</TEXT><TRA font="9"/><TEXT>²⁴</TEXT><TRA font="default"/><TEXT> kg</TEXT><PARA/><TEXT>TERRAIN: Terrestrial</TEXT><PARA/><TEXT>TEMPERATURE: -1°C to 34°C</TEXT><PARA/><TEXT>ESCAPE VELOCITY: 12.23 km/s</TEXT><PARA/><POP/></RDL>'''
310 = '''<RDL><PUSH/><TEXT>Stuttgart is a green, almost inconceivably fertile world owing to the high concentration of carbon dioxide and oxygen in its atmosphere. While the oxygen-rich atmosphere made industrial development infeasible — one stray spark could set off a massive conflagration — farming has been hugely successful as many plants from Earth and elsewhere in Sirius took to the environment without problem. Stuttgart has since become the primary source of Food for the entire Dornmark nation. However, concessions granted to Synth Foods by the Dornmark government have allowed them to purchase many of the cooperatives and individually owned farms on the planet, spurring the creation of the LWB farmers’ rights group.</TEXT><PARA/><POP/></RDL>'''
311 = '''<RDL><PUSH/><TEXT>CLASS: Chapel</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 125</TEXT><PARA/><POP/></RDL>'''
312 = '''<RDL><PUSH/><TEXT>Ulm Border Station is one of two command centers for the Dornmark Federal Police in the Stuttgart System. The Federal Police is tasked with handling the interdiction of all illegal activity in the area, including drug trafficking, smuggling, and pirate activity.</TEXT><PARA/><POP/></RDL>'''
313 = '''<RDL><PUSH/><TEXT>CLASS: Unknown</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Limited</TEXT><PARA/><TEXT>POPULATION: Unknown</TEXT><PARA/><POP/></RDL>'''
314 = '''<RDL><PUSH/><TEXT>An Outcast base. Ashbound are believed to be involved in the production and distribution of the drug Cardamine, which has been declared illegal in the four major Houses.</TEXT><PARA/><POP/></RDL>'''
315 = '''<RDL><PUSH/><TEXT>CLASS: Chesterton</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 175</TEXT><PARA/><POP/></RDL>'''
316 = '''<RDL><PUSH/><TEXT>The Independent Mining Guild (IMG) recently established Java Station in order to lay claim to the rich mineral resources present here, despite stiff competition from Vespera Mining and Metal (BMM), a company that had hoped to exploit the system itself once the Tau-31 Jump Gate was completed.</TEXT><PARA/><POP/></RDL>'''
317 = '''<RDL><PUSH/><TEXT>No info.</TEXT><PARA/><POP/></RDL>'''
318 = '''<RDL><PUSH/><TEXT>A system as rich in resources as Tau-23 was ripe for exploitation, and once surveyed by Vespera Mining and Metal (BMM) in 730 AS, the construction of a Jump Gate network linking the system with Vespera became a high priority. While work on the Tau-31 Jump Gate has proceeded apace, the project has recently come under intense attack by the criminal organization known as the Ashbound, though the reasons behind the hostilities remain unclear. BMM has been forced to hire extra security to protect the construction project and has even attempted to begin limited mining of the valuable Beryllium deposits in the system as a way to offset the skyrocketing costs.</TEXT><PARA/><POP/></RDL>'''
319 = '''<RDL><PUSH/><TEXT>CLASS: Unknown</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 800</TEXT><PARA/><POP/></RDL>'''
320 = '''<RDL><PUSH/><TEXT>Originally a loose assemblage of habitat modules intended to provide quarters for Deep Space Engineering crews constructing a Trade Lane through the system, the station was abandoned upon completion of the Trade Lane and eventually became home to the Zoners. The station was dubbed Freeport 6, and with the addition of a Synth Foods biodome, has become largely self-sufficient. Because of its strategic location in the Border World systems, it is a frequent way station for cargo runs by Vesperan and Orsena shipping companies, as well as a springboard for Independent Mining Guild (IMG) and Zoner expeditions.</TEXT><PARA/><POP/></RDL>'''
321 = '''<RDL><PUSH/><TEXT>CLASS: Akebono</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 200</TEXT><PARA/><POP/></RDL>'''
322 = '''<RDL><PUSH/><TEXT>Constructed in 603 AS by Kishiro, Nago Station is one of Kishiro’s primary sources for the Hydrocarbons needed to fabricate the Polymers used in Optical Chips. Optical Chip manufacturing is one of Kishiro’s major business sectors, and Kishiro depends on a supply of Polymers to manufacture them. The station also houses a standing security force to repulse frequent attacks by pirates and protect its interests from interference by corporate rival Samura.</TEXT><PARA/><POP/></RDL>'''
323 = '''<RDL><PUSH/><TEXT>CLASS: Nobunaga</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 300</TEXT><PARA/><POP/></RDL>'''
324 = '''<RDL><PUSH/><TEXT>Shinkaku Station was built in 602 AS to provide Orsena corporate giant Samura access to the abundant ammonia, water, and oxygen ice fields present in the system. From these raw materials, Shinkaku produces the valuable Fertilizers and Terraforming Gases that Samura needs to remain competitive with Helion food giant Synth Foods. However, the frequent attacks on Samura operations throughout the system by unidentified criminal elements have made extra security a necessary measure.</TEXT><PARA/><POP/></RDL>'''
325 = '''<RDL><PUSH/><TEXT>DIAMETER: 23,118 km</TEXT><PARA/><TEXT>MASS: 8.76 x 10</TEXT><TRA font="9"/><TEXT>²⁴</TEXT><TRA font="default"/><TEXT> kg</TEXT><PARA/><TEXT>TERRAIN: Transitional</TEXT><PARA/><TEXT>TEMPERATURE: -35°C to 48°C</TEXT><PARA/><TEXT>ESCAPE VELOCITY: 16.78 km/s</TEXT><PARA/><POP/></RDL>'''
326 = '''<RDL><PUSH/><TEXT>Previously a barren world, Harris was the object of one of the first large-scale terraforming efforts by Planetform, Inc. Initiated in 450 AS, the project was made easier by the abundance of pure Water and Oxygen ice in the system, while Terraforming Gases were easily transported by Bowex from the Stokes Mining Station in nearby Leeds. Harris was originally scheduled for colonization in 820 AS, but the project has recently suffered a series of setbacks due to attacks by Gaian terrorists.</TEXT><PARA/><POP/></RDL>'''
327 = '''<RDL><PUSH/><TEXT>CLASS: Ellison</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 250</TEXT><PARA/><POP/></RDL>'''
328 = '''<RDL><PUSH/><TEXT>While Tau-31 was considered infeasible for development by Vespera Mining and Metal (BMM), the smaller Independent Mining Guild (IMG) — eager to exploit areas in which BMM feared to tread — was quick to establish Holman Outpost to mine the large quantities of pure Water and Oxygen ice in the system. Water and Oxygen are then shipped to Harris in partnership with Planetform. The IMG and Deep Space Engineering also use the station to supply their respective operations in the recently opened Tau-23 System.</TEXT><PARA/><POP/></RDL>'''
329 = '''<RDL><PUSH/><TEXT>CLASS: Unknown</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 300</TEXT><PARA/><POP/></RDL>'''
330 = '''<RDL><PUSH/><TEXT>The Independent Mining Guild (IMG) established Falkland Base on an asteroid in the Tau-37 System soon after the construction of Freeport 10. Falkland has easy access to the rich deposits of Niobium nearby, a mineral rare enough to make the effort involved in mining and transporting it back to the colonies extremely profitable. However, Falkland and other IMG operations are subject to frequent attacks by local pirates, making life aboard the base a risky proposition at best.</TEXT><PARA/><POP/></RDL>'''
331 = '''<RDL><PUSH/><TEXT>CLASS: Unknown</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Yes</TEXT><PARA/><TEXT>POPULATION: 150</TEXT><PARA/><POP/></RDL>'''
332 = '''<RDL><PUSH/><TEXT>Until Freeport 10 was established in 760 AS by a band of Zoners looking to establish an outpost as far from the colonies as possible, Tau-37 remained a virtually unexplored system at the distant edge of the Nacre Reach. Largely self-sufficient due to a Synth Foods biodome, the Zoners have continued the open-to-all tradition of the Freeports and frequently play host to members of the Independent Mining Guild (IMG) and Ashbound.</TEXT><PARA/><POP/></RDL>'''
333 = '''<RDL><PUSH/><TEXT>CLASS: Eagle</TEXT><PARA/><TEXT>CREW: </TEXT><TRA color="#FF0000"/><TEXT>CLASSIFIED</TEXT><TRA color="default"/><PARA/><TEXT>ARMAMENT: </TEXT><TRA color="#FF0000"/><TEXT>CLASSIFIED</TEXT><PARA/><POP/></RDL>'''
334 = '''<RDL><PUSH/><TEXT>The Battleship </TEXT><TRA italic="true"/><TEXT>Mississippi</TEXT><TRA italic="false"/><TEXT>, constructed in 745 AS, is the oldest ship still serving in the Helion Navy. Affectionately referred to by more than one high-ranking officer as “Old Miss,” the </TEXT><TRA italic="true"/><TEXT>Mississippi</TEXT><TRA italic="false"/><TEXT>  is set to be decommissioned in 805 AS and turned into an orbiting military museum. Until that time, it is assigned to the Texas System where it provides additional security for the prison ships in orbit around Houston and attempts to hold the Texas Line surrounding the F-Zone. The </TEXT><TRA italic="true"/><TEXT>Mississippi</TEXT><TRA italic="false"/><TEXT>  is under the command of Captain Dane Caruthers.</TEXT><PARA/><POP/></RDL>'''
335 = '''<RDL><PUSH/><TEXT>CLASS: Unknown</TEXT><PARA/><TEXT>GRAVITY: Unknown</TEXT><PARA/><TEXT>DOCKING: Unknown</TEXT><PARA/><TEXT>AMENITIES: Unknown</TEXT><PARA/><TEXT>POPULATION: Unknown</TEXT><PARA/><POP/></RDL>'''
336 = '''<RDL><PUSH/><TEXT>A Junker base. Junkers are an itinerant population unaffiliated with any colony who salvage and then resell abandoned ships, equipment, and other scrap.</TEXT><PARA/><POP/></RDL>'''
337 = '''<RDL><PUSH/><TEXT>DIAMETER: 8,201 km</TEXT><PARA/><TEXT>MASS: 3.38 x 10</TEXT><TRA font="9"/><TEXT>²⁴</TEXT><TRA font="default"/><TEXT> kg</TEXT><PARA/><TEXT>TERRAIN: Desert</TEXT><PARA/><TEXT>TEMPERATURE: -88°C to 100°C</TEXT><PARA/><TEXT>ESCAPE VELOCITY: 9.02 km/s</TEXT><PARA/><POP/></RDL>'''
338 = '''<RDL><PUSH/><TEXT>Houston is an arid world whose population consists mostly of what Manhattanites would term the economically undesirable, many of them former inmates of the orbiting prison ships. The cheap labor force has attracted a number of industries, however, including a major Deep Space Engineering manufacturing plant and several factories specializing in Consumer Goods and Construction Machinery. The presence of phosphates in Houston’s alkaline deserts has also produced a booming market in Fertilizers. But Houston’s biggest industry is fueled by its substantial criminal problem, with both the Charter Guild and Helion Police, Inc. (LPI) maintaining their respective local headquarters on the planet.</TEXT><PARA/><POP/></RDL>'''
339 = '''<RDL><PUSH/><TEXT>CLASS: Tantalus</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Restricted</TEXT><PARA/><TEXT>AMENITIES: Limited</TEXT><PARA/><TEXT>POPULATION: 8K</TEXT><PARA/><POP/></RDL>'''
340 = '''<RDL><PUSH/><TEXT>The prison ship </TEXT><TRA italic="true"/><TEXT>Huntsville</TEXT><TRA italic="false"/><TEXT>, under the control of Helion Police, Inc. (LPI), is commonly referred to by prisoners and locals alike as “The Wall.” Xenos make up a large percentage of the population and are isolated here to minimize exposure to other inmates in the penal system. Apart from the prisoners and jailers, the Charter Guild also maintains an onboard presence in the event of any unforeseen escape attempts.</TEXT><PARA/><POP/></RDL>'''
341 = '''<RDL><PUSH/><TEXT>CLASS: Tantalus</TEXT><PARA/><TEXT>GRAVITY: Complete</TEXT><PARA/><TEXT>DOCKING: Restricted</TEXT><PARA/><TEXT>AMENITIES: Limited</TEXT><PARA/><TEXT>POPULATION: 6K</TEXT><PARA/><POP/></RDL>'''
342 = '''<RDL><PUSH/><TEXT>The prison ship </TEXT><TRA italic="true"/><TEXT>Sugarland</TEXT><TRA italic="false"/><TEXT>, under the control of Helion Police, Inc. (LPI), was built in 600 AS to handle the overflow from Huntsville. Sugarland is a particularly hard time, as a smelter worked by prison labor operates around the clock to re-process scrap from the Texas and Cinderwell debris fields. Apart from the prison population, a large contingent of Helion Police, Inc. (LPI), Bounty Hunters, and representatives of ALG Waste Disposal round out the personnel on board.</TEXT><PARA/><POP/></RDL>'''
343 = '''<RDL><PUSH/><TEXT>No info.</TEXT><PARA/><POP/></RDL>'''
344 = '''<RDL><PUSH/><TEXT>Heaven’s Gate. Scans indicate a large, fortified structure consistent with a military stronghold.</TEXT><PARA/><POP/></RDL>'''
345 = '''<RDL><PUSH/><TEXT>CLASS: Unknown</TEXT><PARA/><TEXT>GRAVITY: Partial</TEXT><PARA/><TEXT>DOCKING: Yes</TEXT><PARA/><TEXT>AMENITIES: Unknown</TEXT><PARA/><TEXT>POPULATION: Unknown</TEXT><PARA/><POP/></RDL>'''
346 = '''<RDL><PUSH/><TEXT>A Blood Dragon base. Jade Vow are dedicated to overthrowing the Orsena Empire; they are well-armed and considered highly dangerous.</TEXT><PARA/><POP/></RDL>'''
348 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>ARTIFACTS</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Remnants of an alien civilization that existed long before humanity crawled from the ocean. The particulars of each individual Artifact vary, but archeologists and scientists have been unable to determine their function; for all intents and purposes they appear to be inert chunks of crystal and metal inscribed with decorative patterns. A thriving market for Artifacts has sprung up over the years among art collectors and the social elite looking for a new status symbol.</TEXT><PARA/><POP/></RDL>'''
349 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>BASIC ALLOYS</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Melding the strength of Titanium with the lightness of Aluminum, Basic Alloys can be used economically to construct durable machine parts. The non-ferrous nature of parts constructed from Basic Alloys and their resistance to oxidization makes them ideal for use in almost any manufacturing environment. When Basic Alloys are infused with a matrix of Boron fibers and combined with Super Alloys, the resulting material is then fabricated into the Ship Hull Panels used by shipyards throughout the colonies.</TEXT><PARA/><POP/></RDL>'''
350 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>BERYLLIUM</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>In its processed metallic form, Beryllium is one of the lightest and stiffest naturally occurring materials known to science; unfortunately, it is also highly brittle, making unalloyed Beryllium unsuitable for most industrial processes. However, Beryllium was discovered to be extraordinarily effective at absorbing neutron radiation, and has since become a key component in the construction of modern reactors and engines.</TEXT><PARA/><POP/></RDL>'''
351 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>BORON</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Boron is an essential element in a number of industrial processes. In its fibrous form, Boron filaments are used as a stiffener in the creation of Ship Hull Panels, lending them unparalleled structural integrity. An isotope of Boron, Boron-10, is also used for control rods in the nuclear reactors that power large ships, stations, and planetside bases.</TEXT><PARA/><POP/></RDL>'''
352 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>CARDAMINE</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Cardamine is a drug that produces an intense sense of euphoria and energy in the user. It is both physically and psychologically addictive, but because users do not gain a tolerance, many simply dose themselves with Cardamine continuously to avoid the inevitable crash. Due to the genetic alterations caused by long-term Cardamine use, all of the major colonies have declared it contraband.</TEXT><PARA/><POP/></RDL>'''
353 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>COBALT</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Thousands of years ago the distinctive coloration of Cobalt was used to create blue-tinged glass that was admired throughout the known world. Since that time, Cobalt has become recognized as a strategic metal with diverse military and commercial applications. Brittle in its unalloyed form, Cobalt Alloys exhibit tremendous hardness and resistance to corrosion. When combined with Niobium, the resulting High-Temperature Alloy can withstand even the intense heat and pressure generated by the combustion chamber of a fusion engine.</TEXT><PARA/><POP/></RDL>'''
354 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>CONSTRUCTION MACHINERY</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>The speed with which planets have been settled over the last several centuries would not have been possible without the development of automated Construction Machinery. For higher-level planning, the real-time analysis of building specifications is combined with terrain and weather data transmitted from orbiting satellites. Autonomous software aboard each individual Construction Machine then executes the plan in the most efficient way possible based on local conditions.</TEXT><PARA/><POP/></RDL>'''
355 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>CONSUMER GOODS</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Once the basic necessities of survival have been met, most human beings look for ways to improve their life or to entertain themselves along the way. Consumer Goods satisfy these needs and include a broad range of relatively inexpensive bulk items such as clothing, toiletries, housewares, and Consumer Optronics. While most Consumer Goods are mass produced in automated factories, the ongoing rise in the prison population within the colonies has yielded a cheap labor force that many governments have turned to for handmade goods.</TEXT><PARA/><POP/></RDL>'''
356 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>COPPER</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Copper is a malleable, ductile, and essential component of room temperature Superconductors. Superconductors must be surrounded by shunt materials capable of carrying heavy currents around occasional Superconductor faults. For many of the same reasons that Copper was originally used in electrical wiring, it is an ideal shunt material in Niobium Superconductors. And, of course, Superconductors are an important component of modern Jump Gates and Trade Lanes.</TEXT><PARA/><POP/></RDL>'''
357 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>DIAMONDS</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Diamonds are the hardest natural substance known to modern science. Composed of a crystalline lattice of simple carbon formed under enormous heat and pressure, diamonds are an essential component of mining machinery, allowing saws and drills to cut through even the toughest asteroid or planetary crust. When properly cut and polished, however, the distinctive pattern of light refraction exhibited by diamonds results in the characteristic glittering, which has made them a hallmark of the rich and powerful elite.</TEXT><PARA/><POP/></RDL>'''
358 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>ENGINE COMPONENTS</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Fusion engines generate thrust by superheating plasma in a magnetic bottle. The plasma is then emitted as exhaust through a nozzle assembly, providing thrust for even the largest of battleships. The temperatures and pressures exerted by a fusion engine require that their components be manufactured from High-Temperature Alloys, while Superconductors are necessary to generate the huge magnetic fields needed to contain the plasma.</TEXT><PARA/><POP/></RDL>'''
359 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>FERTILIZERS</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Fertilizers increase crop yields and enable plants to grow in planetary environments that lack the necessary nutrients due either to natural conditions or as a result of large-scale harvesting and grazing. Fertilizers are also a key component of the terraforming process, acting as a catalyst to accelerate the production of the self-sustaining plant ecologies that regulate climate and provide food for more advanced lifeforms.</TEXT><PARA/><POP/></RDL>'''
360 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>FOOD RATIONS</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Most planets in the Nacre Reach are rich in natural resources, but few are capable of supporting large-scale agriculture. As a result, Food remains one of the basic but essential inputs of the Sirius economy. While a large assortment of Food stuffs are available in the different colonies, Synth Foods has cornered much of the market with its revolutionary Synth Paste. However, the continuing expansion of the colonies guarantees that the ever increasing demand for Food will keep the market open.</TEXT><PARA/><POP/></RDL>'''
361 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>OXYGEN</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>A typical human being consumes over 12,000 liters of Oxygen (O</TEXT><TRA font="9"/><TEXT>₂</TEXT><TRA font="default"/><TEXT>) daily. Oxygen, usually mixed with a neutral gas such as nitrogen, is absorbed through the tissues of the lungs and then diffused into the bloodstream, where it is carried throughout the body. All humans require a constant supply of Oxygen or they will perish within minutes.</TEXT><PARA/><POP/></RDL>'''
362 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>GOLD</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Gold is the oldest precious metal known to humanity, initially prized for its smooth, shiny appearance, and later for its unique physical characteristics. Gold is the most malleable and ductile of all metals known. Combined with its high reflectivity to radiation and resistance to corrosion, gold has obvious applications in both the optronics and ship construction industries. Of course, the scarcity of gold — colony holdings of gold increase by only 1.2% per standard year — also makes it the ultimate status symbol for those who can afford it.</TEXT><PARA/><POP/></RDL>'''
363 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>H-FUEL</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>H-fuel is the basic fuel used for engine propulsion everywhere in the colonies. A mix of elemental hydrogen, deuterium (H</TEXT><TRA font="9"/><TEXT>₂</TEXT><TRA font="default"/><TEXT>), and helium-3 (He</TEXT><TRA font="9"/><TEXT>₃</TEXT><TRA font="default"/><TEXT>), H-fuel can also be mixed with oxygen in fuel cells to provide water (via “cracking”) and electricity for smaller ships, space stations, and other facilities. H-fuel production is almost totally monopolized by the Orsena who obtain their supplies from the Gas Miners Guild before shipping it to storage depots and distribution facilities throughout the colonies.</TEXT><PARA/><POP/></RDL>'''
364 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>HIGH TEMPERATURE ALLOY</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>High temperature alloys are essential to the construction of engine components: only a material with the strength of cobalt and the temperature resistance of niobium could withstand the tremendous amount of heat and pressure that exists within the combustion chamber of a fusion engine. However, the rarity of niobium and the complex fabrication methods employed mean that high temperature alloys are relatively expensive — but without them, modern space travel would be impossible.</TEXT><PARA/><POP/></RDL>'''
365 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>SHIP HULL PANELS</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>One of the most important pieces of technology developed during the course of settling the Nacre Reach has been Ship Hull Panels. These wonders of materials research combine a Polymer and Hydrocarbon base along with Basic and Super Alloys to create a substance that is light and flexible, while providing insulation from hard vacuum and all but the most intense radiation. Boron fibers are infused into the panels to endow them with structural rigidity, protecting ships against kinetic impact and high-energy weapons fire.</TEXT><PARA/><POP/></RDL>'''
366 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>HYDROCARBONS</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Hydrocarbons are a class of organic compounds composed only of hydrogen and carbon molecules, resulting in a wide variety of substances that have important industrial applications. While hydrocarbons naturally occur in a gaseous state almost everywhere in the known universe, frozen deposits present the most easily exploited form of the substance. Hydrocarbon mining is key to the industrialization of the Nacre Reach as it provides the raw materials for the creation of the Ship Hull Panels and Optronics, upon which modern society depends.</TEXT><PARA/><POP/></RDL>'''
367 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>JUMP GATE / TRADE LANE PARTS</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Jump Gate and Trade Lane Parts are exclusively manufactured at the Ageira Technologies facility in the Colorado System and are delivered to individual construction sites as necessary. These components are sealed in scanner-proof, tamper-proof white boxes that can only be opened with complex biometric keys. The boxes are also designed to detonate if opened outside of an authorized facility. Additional security measures are confidential, but Ageira has never failed to recover a missing white box.</TEXT><PARA/><POP/></RDL>'''
368 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>LIGHT ARMS</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Light Arms include a wide array of portable weapons intended for personal defense, ranging from handheld blasters to shoulder-mounted needler rifles. While not suited to major military offensives, this line of weaponry is more than adequate for protecting oneself in close quarters combat. And with piracy on the rise throughout the colonies, the need for protection has never been greater.</TEXT><PARA/><POP/></RDL>'''
369 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>LUXURY CONSUMER GOODS</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>There are always those with money or influence who demand items that will set them apart from — and above — those without their resources. For such individuals, Luxury Consumer Goods offer the ultimate status symbol and include big ticket items such as jewelry, designer clothes, and advanced Optronics. All of these items are valuable precisely because they are rare, often fabricated from the most uncommon or difficult-to-obtain resources in the Nacre Reach.</TEXT><PARA/><POP/></RDL>'''
370 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>LUXURY FOOD </TEXT><TRA color="#FF0000"/><TEXT>&gt;&gt;&gt;HIGHLY PERISHABLE &lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><JUST loc="l"/><PARA/><TEXT>The first colonists found strange planets full of unknown flora and fauna, much of it indigestible or even toxic to human beings. As time passed, though, the colonists grew more confident about which indigenous life forms were both nutritional and flavorful, while some gene-banked plants and animals unexpectedly flourished in their new environments. Such delicacies quickly became some of the most popular and expensive imports from the worlds that produced them.</TEXT><PARA/><POP/></RDL>'''
371 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>MINING MACHINERY</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Much of the rich resources of the Nacre Reach are locked within barren planetoids or buried beneath the crust of an airless, frozen planet. By combining super-hard Diamond drill bits and advanced sensor arrays, however, even the deepest deposits can be excavated with relative ease. When used in conjunction with automated crushers, grinders, and sifters, a complete mining operation manned by only a few key personnel can rip apart an average-sized asteroid within a matter of standard weeks.</TEXT><PARA/><POP/></RDL>'''
372 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>MOX </TEXT><TRA color="#FF0000"/><TEXT>&gt;&gt;&gt;PERISHABLE &lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><JUST loc="l"/><PARA/><TEXT>A mixture of uranium oxide (UO</TEXT><TRA font="9"/><TEXT>₂</TEXT><TRA font="default"/><TEXT>) and a small (&lt;3%) portion of weapons-grade plutonium, MOX is the primary fuel for the nuclear reactors used aboard large spacecraft and the monstrous blast furnaces of manufacturing platforms. MOX is typically formed into ceramic pellets that are then loaded into zirconium fuel elements and packaged for transport. It is an efficient source of energy that utilizes a large percentage of recycled materials and exhibits only trace radiation, thus posing little threat to the environment.</TEXT><PARA/><POP/></RDL>'''
373 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>NIOBIUM</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Rare and exotic, Niobium has a number of unique properties. Relatively light and extremely heat resistant, Niobium-derived alloys have been used in the construction of spacecraft and nuclear reactors for centuries, while at lower temperatures Niobium acts as an effective Superconductor. But aside from its practical uses, Niobium is also visually distinctive. When anodized using an electric current, Niobium turns a range of iridescent colors. This property makes it a natural subject for the jeweler’s art.</TEXT><PARA/><POP/></RDL>'''
374 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>ALIEN ORGANISMS </TEXT><TRA color="#FF0000"/><TEXT>&gt;&gt;&gt;HIGHLY PERISHABLE &lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><JUST loc="l"/><PARA/><TEXT>A previously undiscovered bacterial lifeform unique to the Nacre Reach, these microorganisms are remarkably efficient at metabolizing certain elements into oxygen, nitrogen, and carbon dioxide. When seeded in an immature planetary environment they can accelerate the terraforming process tenfold, or provide a rich, abundant source of food for other organisms in more mature planetary ecosystems.</TEXT><PARA/><POP/></RDL>'''
375 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>OPTICAL CHIPS</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>The Optical Chip is a tiny electronic component featuring a general-purpose array of optical switches that can be programmed and instantly reprogrammed to perform nearly any function. Rather than using electricity, however, beams of light transfer information almost instantly, making general-purpose stateless computing machines possible. Optical Chips are the core components in the new field of Optronics on which all advanced technology is based.</TEXT><PARA/><POP/></RDL>'''
376 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>OPTRONICS</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>By stringing together arrays of adaptable Optical Chips connected with gossamer thin webs of organically spun glass waveguides, a new type of computing machine was created. These Optronic devices utilize almost no moving parts, consume very little power, and operate at the speed of light. Because Optical Chips can almost instantly reprogram themselves, Optronics excel at the kind of signal processing and computation that underlie a host of practical applications ranging from Consumer Goods to ship avionics.</TEXT><PARA/><POP/></RDL>'''
377 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>PHARMACEUTICALS</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Advanced pharmaceutical research has now yielded an entirely new class of custom tailored drugs. Using scanners and optronic computers, scientists can determine the precise molecular structure required for a drug to be most effective in treating a particular disease or affliction. The resulting drug is then assembled molecule by molecule from raw polymers; however, prototype drugs must be researched in zero-g to avoid the effects of gravitational pull which could disturb the delicate process.</TEXT><PARA/><POP/></RDL>'''
378 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>POLYMERS</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>A polymer is a large molecule of high relative molecular mass composed of five or more monomers, smaller molecular structures repeated over and over to form the polymer. While the simplest of polymers have only five monomers, typical polymers contain hundreds or thousands of monomers, and some advanced polymers stretch into chains of millions. Because of their physical and chemical characteristics, polymers have a tremendous range of uses and are ubiquitous within the technology and consumer products industries.</TEXT><PARA/><POP/></RDL>'''
379 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>SCRAP METAL</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>The rapid industrialization that followed the settlement of the Nacre Reach has resulted in large fields of Scrap Metal, the detritus resulting from extensive manufacturing and mining operations. These debris fields present both a navigational hazard and a potential second-stage resource, so a small cottage industry has sprung up among those who collect scrap metal and resell it at smelting plants.</TEXT><PARA/><POP/></RDL>'''
380 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>SILVER</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Silver has long been valued by humanity for its beauty, scarcity, and broad spectrum of uses. One of the most important uses for Silver today, however, is in terraforming. Silver iodide (AgI) is employed as a cloud-seeding agent to catalyze nascent ecologies by encouraging the production of rain. Silver also remains highly desirable for its aesthetic beauty, accessorizing the suit of many a technocrat or the arm of a society matron.</TEXT><PARA/><POP/></RDL>'''
381 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>SUPER ALLOY</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>In its unalloyed form, Beryllium is incredibly strong and light but also highly brittle; when combined with aluminum, however, the resulting Super Alloy offers all the benefits of Beryllium along with the stiffness of aluminum. The Super Alloy fabrication process is somewhat more complicated than that used to make Basic Alloys, though, and Super Alloy is consequently more expensive. Super Alloys are used in everything from Ship Hull Panels to the frames of advanced military vessels.</TEXT><PARA/><POP/></RDL>'''
382 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>SUPERCONDUCTORS</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Superconductors are materials that transmit without loss any current applied to them. Unfortunately, many materials act as superconductors only when cooled to temperatures near absolute zero. The discovery of “room temperature” superconductors built around a core of specially treated niobium with copper shunting, however, made possible quantum leaps in technology. Most importantly, superconductors are key components in fusion engines and in the construction of Jump Gates and Trade Lanes.</TEXT><PARA/><POP/></RDL>'''
383 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>TERRAFORMING GASES</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>The injection of gases such as carbon dioxide (CO</TEXT><TRA font="9"/><TEXT>₂</TEXT><TRA font="default"/><TEXT>) and perfluorocarbons (PFCs) into the atmosphere of a developing planet is an essential first step in the terraforming process. These greenhouse gases trap solar heat and raise the mean temperature to a sufficient level where a self-sustaining ecology can be initiated. PFCs are up to 10,000 times more effective than carbon dioxide as a greenhouse gas, but they do not occur naturally in planetary environments, and large quantities must be transported to any planet undergoing terraforming.</TEXT><PARA/><POP/></RDL>'''
384 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>TOXIC WASTE</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>The inevitable byproduct of many of the industrial processes used by the different colonies is Toxic Waste. While some companies specialize in waste removal or elimination, many companies still use the more basic but still effective method of simply dumping Toxic Waste into the nearest available stellar body.</TEXT><PARA/><POP/></RDL>'''
385 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>WATER</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Dihydrogen monoxide (H</TEXT><TRA font="9"/><TEXT>₂</TEXT><TRA font="default"/><TEXT>O) is odorless, tasteless, transparent, and absolutely essential to human life. Roughly 75% of the human body is composed of Water. Deprived of Water, most humans can only live three days. The process of dehydration is a painful one, as tissues shrivel and vessels shrink in a desperate bid by the dying body to preserve its remaining vital functions.</TEXT><PARA/><POP/></RDL>'''
386 = '''<RDL><PUSH/><TEXT>A large field of ice asteroids, entirely depleted of any pure water ice by the failed Los Angeles terraforming operation. The Sierra Field has little value today except as cover for the Rogues — pirates who attack shipments passing along the nearby Trade Lanes to and from Los Angeles.</TEXT><PARA/><POP/></RDL>'''
387 = '''<RDL><PUSH/><TEXT>A nebula of ice crystals. Two Trade Lanes pass through the cloud, but the presence of the San Diego Border Station and frequent Navy patrols discourage attacks. Rogues, Lane Hackers, and Ashbound are the most commonly spotted criminals. Willard Research Station is located deep within the Tahoe cloud, but the exact nature of its research is classified by the Helion Navy.</TEXT><PARA/><POP/></RDL>'''
388 = '''<RDL><PUSH/><TEXT>A large field of ice asteroids — though most of the pure water ice has already been consumed in the failed effort to terraform Los Angeles. The remainder of the field, however, provides cover for a wide range of criminal activities, including drug running and attacks against the nearby Trade Lane. Despite the best attempts by the Helion Navy to capture those responsible, criminals who manage to escape into Whitney almost always elude pursuit.</TEXT><PARA/><POP/></RDL>'''
389 = '''<RDL><PUSH/><TEXT>A medium-sized asteroid field notable for its large deposits of Beryllium. A branch of the Independent Mining Guild (IMG) based on the Cardiff Mining Facility has been working the field with lucrative results, despite occasional raids by Rift Captains who have managed to circumvent the Cambridge Line.</TEXT><PARA/><POP/></RDL>'''
390 = '''<RDL><PUSH/><TEXT>A thick cloud of small ice asteroids. The refractive nature of the cloud tends to confuse most scanners, providing excellent cover for Rift Captains who launch raids across the Cambridge Line.</TEXT><PARA/><POP/></RDL>'''
391 = '''<RDL><PUSH/><TEXT>A thick cloud of small ice asteroids. The refractive nature of the cloud tends to confuse most scanners, providing excellent cover for Rift Captains who often launch attacks on the Trade Lane to the Omega-3 Jump Gate.</TEXT><PARA/><POP/></RDL>'''
392 = '''<RDL><PUSH/><TEXT>A large rock asteroid field, used as cover by particularly bold Rift Captains to attack traffic to and from the Larkspur Gate. It contains no minerals of economic value.</TEXT><PARA/><POP/></RDL>'''
393 = '''<RDL><PUSH/><TEXT>A large rock asteroid field. Initial surveys indicated no ore or other resources worth mining. Alamosa is a favorite refuge of Rogues and Lane Hackers attempting to escape capture by the Helion Navy.</TEXT><PARA/><POP/></RDL>'''
394 = '''<RDL><PUSH/><TEXT>A large rock asteroid field. Initial surveys indicated no ore or other resources worth mining. This field is often frequented by Rogues.</TEXT><PARA/><POP/></RDL>'''
395 = '''<RDL><PUSH/><TEXT>Like most of the resources in Colorado, the famed Copperton Field has long since been exhausted. Trace amounts of copper remain. Xenos are active within the field.</TEXT><PARA/><POP/></RDL>'''
396 = '''<RDL><PUSH/><TEXT>Once the major source of Silver for all of Helion, the Silverton Field has been mined to rubble and dust. Within the field is the former site of an Ageira Technologies manufacturing facility, abandoned over a century ago in favor of Pueblo Station, it now houses a large contingent of Xenos. Trace amounts of Silver remain.</TEXT><PARA/><POP/></RDL>'''
397 = '''<RDL><PUSH/><TEXT>A medium-sized field of ice asteroids. Most of the Rogue activity in the system seems centered here, though the Helion Navy has yet to take any decisive action.</TEXT><PARA/><POP/></RDL>'''
398 = '''<RDL><PUSH/><TEXT>A medium-sized cloud of ice crystals. Rogues frequently hide in the mists, awaiting luxury cargos and passengers from Helion bound for the pleasure planet of Curacao.</TEXT><PARA/><POP/></RDL>'''
399 = '''<RDL><PUSH/><TEXT>A medium-sized cloud of ice crystals. A popular hiding place for Rogues and Lane Hackers to attack Trade Lane traffic to and from Manchester.</TEXT><PARA/><POP/></RDL>'''
400 = '''<RDL><PUSH/><TEXT>A field of Copper and Cobalt bearing asteroids. Heavily mined by Daumann Heavy Construction from their base on Leipzig Station, this field has produced the bulk of these minerals in the Nacre Reach for centuries — making it an irresistible target for Red Hessian pirates. However, experts speculate that the field will be depleted within two decades, leaving little behind but a massive cloud of sulfur.</TEXT><PARA/><POP/></RDL>'''
401 = '''<RDL><PUSH/><TEXT>A field of lava asteroids. Unfortunately, the field is too close to the sun and consequently too molten for any mining. Bautzen Station, local headquarters for Kruger Minerals, sits at the edge of the field.</TEXT><PARA/><POP/></RDL>'''
402 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;WARNING: SEVERE DANGER&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>The cloud is a swirling mass of sulfuric acid and hydrogen sulfide that will corrode the Hull Panels of even an armored, shielded ship in a relatively short amount of time. Because of its toxic nature, the cloud has never been fully explored, but Cinder Guard will sometimes use it as a method of evading pursuit after stealing valuable Diamond shipments from Daumann or Kruger.</TEXT><PARA/><POP/></RDL>'''
403 = '''<RDL><PUSH/><TEXT>A large sulfur cloud containing lava asteroids. Diamonds can often be found floating freely within the cloud and are collected by Kruger Minerals, operating from nearby Bautzen Station. However, Kruger has been forced to increase security to prevent theft by Cinder Guard.</TEXT><PARA/><POP/></RDL>'''
404 = '''<RDL><PUSH/><TEXT>A small field of lava asteroids. Often used as a waypoint for Red Hessian attacks on the Daumann facility at Leipzig.</TEXT><PARA/><POP/></RDL>'''
405 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;CAUTION&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>The Vespera Mining and Metal (BMM) Gold field is the richest pocket of free-floating Gold in the Nacre Reach and has been exclusively claimed by the BMM. To enforce their claim, BMM has ringed the area with a minefield and controls all access to both the field and their local headquarters on Graves Station.</TEXT><PARA/><POP/></RDL>'''
406 = '''<RDL><PUSH/><TEXT>Near the wreck of the </TEXT><TRA italic="true"/><TEXT>Hood</TEXT><TRA italic="false"/><TEXT>  lies an asteroid field, already plundered of any Gold it may have once held. Currently the field is the site of an extremely hazardous race course that the jaded inhabitants of the </TEXT><TRA italic="true"/><TEXT>Hood</TEXT><TRA italic="false"/><TEXT>  sometimes like to run when hopped up on the sunshine that passes for alcohol aboard the ship.</TEXT><PARA/><POP/></RDL>'''
407 = '''<RDL><PUSH/><TEXT>A medium-sized asteroid field with Gold deposits, largely worked by independent miners who are generally unfriendly to anyone who might lay stake to their claims. Recently, Rift Captains have been seen in the area.</TEXT><PARA/><POP/></RDL>'''
408 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;CAUTION&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>After the Founder’s Day Revolt and the subsequent bloody reprisals by both Vespera Mining and Metal (BMM) and the Vesperan Armed Forces, the majority of the Mollys took refuge in this asteroid field, ringing the perimeter with a treacherous minefield. Deposits of Gold scattered throughout the field have funded much of the Mollys’ efforts. NOTE: The Mollys are vicious and unprincipled; they will attack any outsiders who enter areas under their control.</TEXT><PARA/><POP/></RDL>'''
409 = '''<RDL><PUSH/><TEXT>A small cloud of ice crystals, less stunning than the Islay Ice Cloud, but also less dangerous to tourists given the lack of Gaian attacks.</TEXT><PARA/><POP/></RDL>'''
410 = '''<RDL><PUSH/><TEXT>A beautiful cloud of ice crystals surrounding a field of ice asteroids, the Islay Ice Cloud is considered one of the wonders of Sirius. It is also home to a large contingent of Gaian eco-terrorists who frequently attack unprotected Orbital and Planetform transports.</TEXT><PARA/><POP/></RDL>'''
411 = '''<RDL><PUSH/><TEXT>A small ice asteroid field, frequently used by the Gaians to stage attacks against nearby Perth Station, where Planetform, Inc. has located operations to terraform the planet Ayr.</TEXT><PARA/><POP/></RDL>'''
412 = '''<RDL><PUSH/><TEXT>A large nebula. Sometimes used to hide Unioner raiding parties that strike against valuable cargo being carried along the Trade Lane from the Border Worlds to Ironreach.</TEXT><PARA/><POP/></RDL>'''
413 = '''<RDL><PUSH/><TEXT>A field of bare rock asteroids, this was once a staging area for military operations during the 80-Years War. The field was later abandoned after Dornmark’s bitter defeat at the hands of the Gas Mining Guild (GMG). Ironically, probes have begun to detect a substantial Bundschuh presence in the field, though the exact nature of their activities is currently unknown.</TEXT><PARA/><POP/></RDL>'''
414 = '''<RDL><PUSH/><TEXT>A small ring of ice asteroids, believed to be the remnants of a planet that never fully coalesced.</TEXT><PARA/><POP/></RDL>'''
415 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;WARNING: NAVIGATIONAL HAZARD&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>A medium-sized cloud of dark matter. Lane Hackers are believed to be taking advantage of the scanner-blocking properties of the cloud to attack traffic throughout the system; however, neither the Helion nor the Orsena Navies have located their base of operations.</TEXT><PARA/><POP/></RDL>'''
416 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;WARNING: NAVIGATIONAL HAZARD&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>A medium-sized cloud of dark matter. Scanners do not function within the confines of the cloud.</TEXT><PARA/><POP/></RDL>'''
417 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;WARNING: NAVIGATIONAL HAZARD&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>A medium-sized cloud of dark matter. Because scanners do not function within the cloud, Rogues will often use it to escape pursuit by the military or Bounty Hunters after stealing cargo passing between Helion and Orsena.</TEXT><PARA/><POP/></RDL>'''
418 = '''<RDL><PUSH/><TEXT>A medium rock asteroid field. Commercial surveys have detected no mineral resources of value. Unioners often mount attacks on the Alster Shipyard from here.</TEXT><PARA/><POP/></RDL>'''
419 = '''<RDL><PUSH/><TEXT>Small rock asteroid field. Commercial surveys have detected no mineral resources of value.</TEXT><PARA/><POP/></RDL>'''
420 = '''<RDL><PUSH/><TEXT>Medium rock asteroid field. The field has no legitimate commercial use, but it has become a haven for Unioner terrorists who commit frequent strikes against traffic around Altona Station and the adjoining Trade Lanes.</TEXT><PARA/><POP/></RDL>'''
421 = '''<RDL><PUSH/><TEXT>Small rock asteroid field. Its lack of any resources left it virtually ignored until Vierlande Prison was constructed close by. Now “the Sud” is used by Cinder Guard, Unioners, and even Bundschuh to launch attacks against prison convoys and Vierlande itself in an effort to free their captive comrades.</TEXT><PARA/><POP/></RDL>'''
422 = '''<RDL><PUSH/><TEXT>A gaseous cloud. Jade Vow frequently use the cloud to launch attacks against the Chugoku Gate Construction Site.</TEXT><PARA/><POP/></RDL>'''
423 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;WARNING: SEVERE DANGER&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>A zone of intense radiation spewed from the active sun at the heart of the system. Instantly lethal to anyone unlucky enough to stumble into the zone unshielded, the radiation levels are high enough to degrade even active shielding over time. Most pilots cross the zone by pulling the “Kyofu Burn” — shields on full, afterburners on max, follow the navigational buoys, and cross your fingers.</TEXT><PARA/><POP/></RDL>'''
424 = '''<RDL><PUSH/><TEXT>A cloud that was only recently discovered to conceal large fields of H-Fuel. Samura has begun harvesting the Fuel using Sapporo Station as its base, in an opening of the cloud near the Sablecross Jump Gate, but has found itself in conflict with Golden Chrysanthemum terrorists who claim the cloud for their own. Little can be done to guard the gas miners and line of navigational buoys that lead through the cloud to the Chugoku Gate Construction Site on the other side of the system.</TEXT><PARA/><POP/></RDL>'''
425 = '''<RDL><PUSH/><TEXT>A gaseous cloud. A line of navigation buoys cuts through the cloud pointing the way through the lethally dangerous Kyofu — and the Kyofu is not the only danger. Jade Vow often lurk in the cloud waiting to attack supply shipments from Sapporo Station bound for the Chugoku Gate Construction Site.</TEXT><PARA/><POP/></RDL>'''
426 = '''<RDL><PUSH/><TEXT>A nebulous region at the periphery of the Crow Nebula. Ashbound frequently attack traffic along the Trade Lanes to and from the Sigma-19 Jump Gate.</TEXT><PARA/><POP/></RDL>'''
427 = '''<RDL><PUSH/><TEXT>A wisp of the Crow Nebula. The presence of the Akita Border Station at the edge of the cloud has done little to discourage Corsair attacks on the Trade Lane leading to the Sigma-13 Jump Gate.</TEXT><PARA/><POP/></RDL>'''
428 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;CAUTION&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>A cloud of gas that conceals the Kansai Research Center, the location of much of the joint research between Kishiro and the Orsena Naval Forces. While protected by a minefield and automated defense platforms, Kansai is still a frequent target of attacks by Jade Vow.</TEXT><PARA/><POP/></RDL>'''
429 = '''<RDL><PUSH/><TEXT>A large field of rock asteroids. A contingent of Xenos from the neighboring Texas System has settled in the field and make frequent raids on traffic passing through the system.</TEXT><PARA/><POP/></RDL>'''
430 = '''<RDL><PUSH/><TEXT>A small field of rock asteroids. Both Xeno and Rogue attacks occur on the Trade Lanes along this field.</TEXT><PARA/><POP/></RDL>'''
431 = '''<RDL><PUSH/><TEXT>A large field of rock asteroids. Helion authorities believe that Rogues are using the asteroids as cover for their various criminal activities and have increased naval patrols along the nearby Trade Lanes to discourage any attacks.</TEXT><PARA/><POP/></RDL>'''
432 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;WARNING: NAVIGATIONAL HAZARD&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>A small cloud of dark matter. Scanners do not function within the confines of the cloud, making it a popular hiding place for Xenos who attack traffic from Orsena in an effort to drive the so-called “foreign” presence from Helion.</TEXT><PARA/><POP/></RDL>'''
433 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;WARNING: NAVIGATIONAL HAZARD&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>An outcropping of the larger “Kuryo anomaly,” a large field of dark matter first charted by the great Orsena explorer Ichi Matsuo. Scanners do not function within the confines of the cloud.</TEXT><PARA/><POP/></RDL>'''
434 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;WARNING: NAVIGATIONAL HAZARD&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>A medium-sized cloud of dark matter. Scanners do not function within the confines of the cloud.</TEXT><PARA/><POP/></RDL>'''
435 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;WARNING: NAVIGATIONAL HAZARD&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>A large field of fine particulate matter. The Farmers Alliance has claimed the field and is believed to take advantage of its scanner-scrambling properties as a means of discussing strategy away from prying eyes and ears.</TEXT><PARA/><POP/></RDL>'''
436 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;WARNING: NAVIGATIONAL HAZARD&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>A large field of fine particulate matter. Scanners work poorly at best within the field, providing excellent concealment for Blood Dragon and Golden Chrysanthemum members to strike against Trade Lane traffic and other targets such as the Nansei Research Complex and Tsushima Depot. The Battleship </TEXT><TRA italic="true"/><TEXT>Nagumo</TEXT><TRA italic="false"/><TEXT>  was recently stationed at the edge of the field to keep the Trade Lanes clear and protect the Tau-29 Jump Gate.</TEXT><PARA/><POP/></RDL>'''
437 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;WARNING: NAVIGATIONAL HAZARD&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>A large Crow nebula cloud. Its poor visibility makes it ideal cover for terrorist groups such as the Jade Vow and the Golden Chrysanthemums.</TEXT><PARA/><POP/></RDL>'''
438 = '''<RDL><PUSH/><TEXT>A large cloud of smog that has coalesced over the centuries from the various industrial operations throughout Leeds. Gaians and Ashbound are often sighted within the cloud.</TEXT><PARA/><POP/></RDL>'''
439 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;CAUTION&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>At the heart of this dense asteroid field lies the LD-14 uranium processing center, responsible for producing the majority of MOX used by Vespera and Orsena. The asteroid field and its pockets of radiation provide natural protection against attempts to raid the facility, while the automated defense platforms ringing the facility offer further deterrence.</TEXT><PARA/><POP/></RDL>'''
441 = '''<RDL><PUSH/><TEXT>A medium-size asteroid field rich in aluminum, titanium and niobium, Vespera Mining and Metal (BMM) has been working the field with great success, smelting and refining raw materials obtained from the field at the massive Stokes smelting facility nearby.</TEXT><PARA/><POP/></RDL>'''
442 = '''<RDL><PUSH/><TEXT>A large cloud of smog that has coalesced over the centuries from the various industrial operations throughout Leeds. The Vesperan Police Authority has begun patrolling the cloud more closely after Molly terrorists began using the area as a staging ground for strikes against the LD-14 uranium processing center.</TEXT><PARA/><POP/></RDL>'''
443 = '''<RDL><PUSH/><TEXT>An outcropping of the Barrier, a massive cloud of ice crystals. The scattering effect of the crystals provides excellent concealment for Lane Hackers to attack the traffic passing between Vespera and Helion. Helion Navy patrols have been increased, but with little effect.</TEXT><PARA/><POP/></RDL>'''
444 = '''<RDL><PUSH/><TEXT>A huge field of ice asteroids. Wendell is currently being mined for its abundant quantities of Water and Oxygen by members of the Independent Mining Guild (IMG) stationed aboard Freeport 4.</TEXT><PARA/><POP/></RDL>'''
445 = '''<RDL><PUSH/><TEXT>The Birmingham Ice Field contains large quantities of frozen Terraforming Gases and Hydrocarbons. The Hydrocarbons are processed into Polymers by the facilities aboard the Birmingham Station, owned and operated by Vespera Mining and Metal (BMM).</TEXT><PARA/><POP/></RDL>'''
446 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;CAUTION&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>There is only one safe route through the Newgate minefield, protected by automated defense platforms. Ships are advised to follow the navigational buoys and not to stray from the indicated course. Any ships that deviate from these directives will be considered hostile and fired upon immediately.</TEXT><PARA/><POP/></RDL>'''
447 = '''<RDL><PUSH/><TEXT>A large field of ice asteroids. The North Sheffield Field has been a favorite haunt of Lane Hackers who find it a convenient location to lurk prior to attacking any of the several nearby Trade Lanes.</TEXT><PARA/><POP/></RDL>'''
448 = '''<RDL><PUSH/><TEXT>A large field of ice asteroids. As the crackdown on Molly terrorists has continued and the population of nearby Newgate Prison swells with their numbers, the South Sheffield Field has been used by the Mollys as cover from which to stage prison breaks.</TEXT><PARA/><POP/></RDL>'''
449 = '''<RDL><PUSH/><TEXT>A mined-out asteroid field. Its proximity to the Ring and Oder shipyards has made it a favorite hiding place for Bundschuh terrorists, while Unioners prefer to hit the diamond convoys passing along the Trade Lane to the Kruger Minerals headquarters on Essen Station.</TEXT><PARA/><POP/></RDL>'''
450 = '''<RDL><PUSH/><TEXT>A mined out asteroid field. Frequently used by Red Hessian pirates to attack Daumann and Kruger shipments arriving at the nearby Dresden Jump Gate — or to make the occasional daring raid on the multitude of cargo ships docked at the Ring.</TEXT><PARA/><POP/></RDL>'''
451 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;WARNING: NAVIGATIONAL HAZARD&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>The Ironreach System was initially settled because of its abundant and easily accessible resources. But while the other asteroid fields in the area yielded their treasures with relative ease, the rich Ruhr Asteroid Field proved to be a treacherous terrain of toxic gases and radioactive pockets. The debris from many a destroyed ship still litters the area, providing ample fodder for local Junkers. Unioners and the LWB have also been known to take advantage of the natural cover provided by the field to attack nearby Trade Lanes.</TEXT><PARA/><POP/></RDL>'''
452 = '''<RDL><PUSH/><TEXT>A mined-out asteroid field. Red Hessian pirates will often retreat into this field following attacks on the nearby Trade Lanes.</TEXT><PARA/><POP/></RDL>'''
453 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;WARNING: NAVIGATIONAL HAZARD&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>A mined-out asteroid field. The Trade Lane connecting Larkspur with the Cambridge Jump Gate was carefully surveyed prior to construction to ensure that it did not intersect any pockets of explosive gas remaining in the field.</TEXT><PARA/><POP/></RDL>'''
454 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;WARNING: NAVIGATIONAL HAZARD&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>The mining of the Cumbria field released large quantities of explosive gas trapped inside the asteroids, resulting in a number of fatalities over the centuries. The field no longer possesses any resources of note, but the explosive gas has since settled into a large pocket within a gravitational dead zone. Despite this, the proximity of Cumbria to Larkspur has made it a favorite launching point for attacks by the vicious terrorist group known as the Mollys, and the Battleship </TEXT><TRA italic="true"/><TEXT>Suffolk</TEXT><TRA italic="false"/><TEXT>  was recently assigned to patrol the perimeter of the field.</TEXT><PARA/><POP/></RDL>'''
455 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;WARNING: NAVIGATIONAL HAZARD&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>A large asteroid field exhausted of all useful resources. Care should be taken, however, as the mining process created at least one large pocket of explosive gas within the field. Devon is frequently used as cover for Gaian attacks on the nearby Canterbury Station, where Planetform, Inc. is headquartered.</TEXT><PARA/><POP/></RDL>'''
456 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;WARNING: NAVIGATIONAL HAZARD&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>One of the smaller asteroid fields in the system, mining of Somerset began soon after other asteroid fields in the system were depleted of resources; however, the large quantities of explosive gas within the Somerset asteroids quickly made any further mining impossible and the area was abandoned.</TEXT><PARA/><POP/></RDL>'''
457 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;WARNING: NAVIGATIONAL HAZARD&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>The Southampton Debris Field is a monument to government expediency, the product of centuries of ship construction without any form of government environmental oversight in an effort to expand the Vesperan space fleet as quickly as possible. The resulting eyesore, an ocean of scrap, is as emblematic of Vespera as the Southampton Shipyard itself. No serious attempt to clear the field was ever made, and eventually a large population of Junkers took up residence — despite the presence of dangerously radioactive areas around leaking engine cores.</TEXT><PARA/><POP/></RDL>'''
458 = '''<RDL><PUSH/><TEXT>An asteroid field exhausted of useful resources shortly after the larger Kanto field was depleted. The field has no other features of interest, though reports of Jade Vow in the area have become more frequent of late.</TEXT><PARA/><POP/></RDL>'''
459 = '''<RDL><PUSH/><TEXT>An asteroid field mined out centuries before during the initial Orsena burst of expansion. The field is entirely deserted today except for Kabukicho Depot, where the Hogosha endeavor to “protect the anonymity of their clients.” Police patrols have recently been increased as terrorist groups such as the Jade Vow and Farmers Alliance have been using the field to launch strikes against targets uncomfortably close to Sablecross itself.</TEXT><PARA/><POP/></RDL>'''
460 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;WARNING: NAVIGATIONAL HAZARD&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>The Badlands is a particulate cloud filled with asteroids and subject to intense electrical activity that renders most scanners inoperable. Two government research stations, Bedford and Ithaca, were constructed here to study these unique environmental phenomena. However, the Badlands also provides a natural refuge for all types of criminal elements. The Battleship </TEXT><TRA italic="true"/><TEXT>Missouri</TEXT><TRA italic="false"/><TEXT>  has since been deployed to protect Helion interests in the area and deter pirate attacks against nearby Trade Lanes.</TEXT><PARA/><POP/></RDL>'''
461 = '''<RDL><PUSH/><TEXT>An industrial dumping ground left over from early expansion efforts, it is now frequented by Junkers and Rogues.</TEXT><PARA/><POP/></RDL>'''
462 = '''<RDL><PUSH/><TEXT>A floating junkyard, the byproduct of orbital development around Whiteharbor. Some criminal activity is present, chiefly drug runners and smugglers, along with itinerant Junkers who comb the field looking for scrap and parts.</TEXT><PARA/><POP/></RDL>'''
463 = '''<RDL><PUSH/><TEXT>A cloud of abandoned ships, parts, and other scrap pulled into the planet Breakwater’s gravity well from the Baltimore Shipyard over the centuries. The Breakwater Debris Field is frequently used as cover by Rogues who like to attack traffic in and out of Breakwater.</TEXT><PARA/><POP/></RDL>'''
464 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;WARNING: RESTRICTED AREA&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>All information concerning Zone 21 is CLASSIFIED by the Helion Navy and the area protected by a minefield. Any unauthorized ships attempting to breach the Zone 21 minefield or enter Zone 21 itself will be nullified WITHOUT EXCEPTION OR EXEMPTION.</TEXT><PARA/><POP/></RDL>'''
465 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;WARNING: SEVERE DANGER&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>“The Gap,” a highly toxic field of solar radiation. Entering Abgrund is almost always fatal, and as such is avoided by all factions in the system — legitimate, criminal, and otherwise.</TEXT><PARA/><POP/></RDL>'''
466 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;CAUTION&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>A planetary fragment field with minimal background radiation. The last leg of a route leading to the Stuttgart Jump Gate has been cleared through the field, but it is often the most dangerous part of the journey due to constant attacks by Cinder Guard.</TEXT><PARA/><POP/></RDL>'''
467 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;CAUTION&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>A planetary fragment field with minimal background radiation. A route has been cleared through the asteroid field leading to Nordostriemen and the Stuttgart Jump Gate, using the asteroids as natural cover from the frequent radiation storms. Unfortunately, the asteroids also provide excellent cover for Red Hessian pirates to protect the often ill defended convoys of Diamonds leaving the system from Solarius Station.</TEXT><PARA/><POP/></RDL>'''
468 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;CAUTION&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>A planetary fragment field with minimal background radiation. Cinder Guard and Rift Captains are occasionally sighted in the area.</TEXT><PARA/><POP/></RDL>'''
469 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;CAUTION&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>A field of lava asteroids named after the great Dornmark explorer who initially surveyed the system at the cost of his own life. Thought to have once been a planet that was superheated to the point of destruction by the red giant at the heart of the system, the Van Rohe Belt contains a fortune in Diamonds. Unfortunately, the high radiation levels make mining the Belt a difficult and dangerous job for only the most daring — or desperate — of individuals, as the number of dead ships should attest.</TEXT><PARA/><POP/></RDL>'''
470 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;CAUTION&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>A planetary fragment field with minimal background radiation. A substantial Red Hessian contingent is present here, and will often stage direct attacks on neighboring Solarius Station where the Daumann Heavy Construction mining crews return with their valuable cargos.</TEXT><PARA/><POP/></RDL>'''
471 = '''<RDL><PUSH/><TEXT>A medium-sized field of ice asteroids. Freeport 1 is located near the inner edge of the field, and will sell its excess supplies to anyone without prejudice — including Rift Captains, who frequent the area.</TEXT><PARA/><POP/></RDL>'''
472 = '''<RDL><PUSH/><TEXT>A medium-sized field of mixed carbonaceous and ice asteroids. The second Vespera Mining and Metal (BMM) Polymer production facility is located here on Douglas Station, though attacks by Rift Captains have required BMM to substantially increase security.</TEXT><PARA/><POP/></RDL>'''
473 = '''<RDL><PUSH/><TEXT>A medium-sized cloud of ice asteroids. Rift Captains can sometimes be spotted in the cloud on their way to attack transport ships on the Trade Lanes.</TEXT><PARA/><POP/></RDL>'''
474 = '''<RDL><PUSH/><TEXT>A medium-sized field of mixed carbonaceous and ice asteroids. The Daumann Polymer and Hydrocarbon operation of Ruegen has been plagued by repeated Red Hessian attacks.</TEXT><PARA/><POP/></RDL>'''
475 = '''<RDL><PUSH/><TEXT>A medium-sized field of ice asteroids. Often used as cover by Red Hessian pirates to attack Trade Lane traffic passing through the area.</TEXT><PARA/><POP/></RDL>'''
476 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;WARNING: SEVERE DANGER&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>The dark neutron star at the heart of Omega-41 creates an area of intense radiation and high gravity that will destroy almost any ship unfortunate enough to fall within its grasp.</TEXT><PARA/><POP/></RDL>'''
477 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;CAUTION&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>A large, relatively open area that has been the site of multiple battles between rival criminal organizations the Cinder Guard and the Rift Captains. Armed mines, disabled ships, and wreckage are scattered everywhere, the result of casualties on both sides — or independent ships unlucky enough to stumble into the crossfire.</TEXT><PARA/><POP/></RDL>'''
479 = '''<RDL><PUSH/><TEXT>A large pocket within the nebula containing Copper, Cobalt, and Silver-bearing asteroids. The Independent Mining Guild (IMG) operates the Briesen Mining Facility within the cloud, despite the threat of Corsair attacks.</TEXT><PARA/><POP/></RDL>'''
480 = '''<RDL><PUSH/><TEXT>A medium-sized pocket within the nebula.</TEXT><PARA/><POP/></RDL>'''
481 = '''<RDL><PUSH/><TEXT>SCANNING...... profiling indicates that there is a 78.3% probability that this field is the remains of the sleeper ship </TEXT><TRA italic="true"/><TEXT>Perihelion</TEXT><TRA italic="false"/><TEXT>.</TEXT><PARA/><POP/></RDL>'''
482 = '''<RDL><PUSH/><TEXT>A medium-sized field of fine particulate matter.</TEXT><PARA/><POP/></RDL>'''
483 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;WARNING: NAVIGATIONAL HAZARD&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>A large Edge nebula. Rumored to be used as a burial ground for Outcast pilots and their ships.</TEXT><PARA/><POP/></RDL>'''
484 = '''<RDL><PUSH/><TEXT>A small rock asteroid field containing the Corsair base Tripoli.</TEXT><PARA/><POP/></RDL>'''
485 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;WARNING: NAVIGATIONAL HAZARD&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>SCANNING......profiling indicates a massive nebula cloud, but tomographic imaging is unable to ascertain any details of its internal structure.</TEXT><PARA/><POP/></RDL>'''
486 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;CAUTION&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>Part of the Walker Nebula. Scans show a high concentration of lava asteroids.</TEXT><PARA/><POP/></RDL>'''
487 = '''<RDL><PUSH/><TEXT>A large nebula. Initial surveys detected the presence of unidentified organic material.</TEXT><PARA/><POP/></RDL>'''
488 = '''<RDL><PUSH/><TEXT>A medium-sized nebula. Initial surveys detected the presence of unidentified material.</TEXT><PARA/><POP/></RDL>'''
489 = '''<RDL><PUSH/><TEXT>A medium-sized nebula. Initial surveys detected the presence of unidentified organic material.</TEXT><PARA/><POP/></RDL>'''
490 = '''<RDL><PUSH/><TEXT>Possibly the remains of a planetary body or a wandering planetoid destroyed in some unknown astronomical cataclysm.</TEXT><PARA/><POP/></RDL>'''
491 = '''<RDL><PUSH/><TEXT>The Keiun (“Beautiful”) Cloud lives up to its name, and were it not for the presence of pirates, would probably be a major Orsena tourist attraction. Unfortunately, its proximity to the Jump Gates leading to Galileo and Kepler make it ideal cover for Independent World pirates wishing to interdict traffic to and from Deshima Station.</TEXT><PARA/><POP/></RDL>'''
492 = '''<RDL><PUSH/><TEXT>The Saiun (“Painted”) Cloud is a beautiful mass of multicolored gases. But despite its aesthetic pleasures, the cloud is seldom appreciated by the Orsena Navy, which must constantly repulse Blood Dragon attacks launched against the nearby Trade Lane linking the Sablecross Jump Gate with Junyo. The Jade Vow will sometimes even strike against Fuchu Prison in an effort to free their imprisoned brothers and sisters.</TEXT><PARA/><POP/></RDL>'''
493 = '''<RDL><PUSH/><TEXT>The eponymous Shiun (“Violet”) Cloud is a large mass of inert gas leftover from the formation of the solar system.</TEXT><PARA/><POP/></RDL>'''
494 = '''<RDL><PUSH/><TEXT>During the Eighty Years War between Dornmark and the Gas Mining Guild (GMG), the decisive battle was fought in Sigma-13 when the bulk of the Dornmark battle group was ambushed by GMG forces and destroyed. With thousands of lives lost and the Dornmark Imperial Navy disgraced, the government was forced to negotiate with the GMG and their ill-advised war. The wreckage of that battle provides a constant, painful reminder of Dornmark’s defeat at the hands of the GMG, though ALG Waste Disposal has recently been awarded the contract to clear the area and properly dispose of any remains. Not surprisingly, Junkers have also moved into the area and are less concerned with the burial of the dead than busily salvaging any and all of the ships, parts, and weapons they can find.</TEXT><PARA/><POP/></RDL>'''
495 = '''<RDL><PUSH/><TEXT>A small clearing in the nebula that envelops the system and the location of Helgoland Station, local headquarters for ALG Waste Disposal. ALG is currently engaged in clearing the Yanagi Debris Field, the remnants of a battle fought between Dornmark and the Gas Mining Guild (GMG) during the Eighty Years War.</TEXT><PARA/><POP/></RDL>'''
496 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;WARNING: NAVIGATIONAL HAZARD&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>An outcropping of the Edge Nebula, Kunashir is unique in that it hides a planet within its foreboding depths: Kurile. Initially discovered by the Gas Mining Guild (GMG), it was abandoned for its lack of useful resources and later claimed by Samura. Samura is engaged in a long-term research project to find commercial applications for Kurile’s one form of native life, already proven useful in Junyo’s fish-farming operations. Frequent Corsair and Outcast attacks have in no way diminished Samura’s interest.</TEXT><PARA/><POP/></RDL>'''
497 = '''<RDL><PUSH/><TEXT>A large field of fine particulate matter. Atka Station, an outpost of Cryer Pharmaceuticals, was constructed here to study the varieties of organic life found in the nebula.</TEXT><PARA/><POP/></RDL>'''
498 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;WARNING: NAVIGATIONAL HAZARD&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>A medium-sized offshoot of the Edge Nebula that contains large fields of valuable gas resources. However, violent electrical storms and Outcast activity within the cloud have so far discouraged any large-scale gas mining by Kishiro or the Gas Mining Guild (GMG).</TEXT><PARA/><POP/></RDL>'''
499 = '''<RDL><PUSH/><TEXT>A small field of fine particulate matter. Strange, flower-like formations — the Gikka “dust blossoms” — make it a popular day trip for tourists aboard the Luxury Liner </TEXT><TRA italic="true"/><TEXT>Hawaii</TEXT><TRA italic="false"/><TEXT>, and the threat of attack by Corsair pirates only adds to the thrill.</TEXT><PARA/><POP/></RDL>'''
500 = '''<RDL><PUSH/><TEXT>A medium-sized arm of the Crow Nebula, famed throughout Sirius for its beautiful vistas. A significant amount of valuable gases and the close proximity of the Honshu Jump Gate has also made this an ideal location for the first official joint operation between Kishiro and the Gas Mining Guild (GMG) — much to the dismay of Kishiro’s chief corporate rival, Samura. The GMG gas miner </TEXT><TRA italic="true"/><TEXT>Ogashawa</TEXT><TRA italic="false"/><TEXT>  hosts not only several Kishiro “expert advisors,” but also acts as a base of operations for Kishiro’s own activities within the cloud.</TEXT><PARA/><POP/></RDL>'''
501 = '''<RDL><PUSH/><TEXT>A stray wisp of the Walker Nebula. Cinder Guard often use the cloud to organize attacks against traffic along the nearby Trade Lanes. Dornmark Federal Police also believe that LWB-backed terrorist activities originate from here, though they have so far been unable to locate their base of operations.</TEXT><PARA/><POP/></RDL>'''
502 = '''<RDL><PUSH/><TEXT>A drift of the Walker Nebula. The cloud hides a substantial amount of criminal activity, chiefly Cinder Guard, who prey on both food shipments outbound from Stuttgart and rich tourists heading to sample the pleasures of Baden-Baden.</TEXT><PARA/><POP/></RDL>'''
503 = '''<RDL><PUSH/><TEXT>A medium-sized field of Ammonia and Methane. Samura constructed Shinkaku Station nearby, providing it with easy access to not only the Ammonia and Methane vital to their fertilizer production, but also Oxygen and Water from the other ice fields in close proximity. Samura has recently increased security to repulse attacks by the normally non-confrontational Ashbound.</TEXT><PARA/><POP/></RDL>'''
504 = '''<RDL><PUSH/><TEXT>A large field of asteroids rich in hydrocarbons. After a Orsena research expedition stumbled onto the system and its abundant resources, a joint construction project between Vespera and Orsena opened the system to exploitation. Kishiro immediately established Nago Station along the trade route to the Kyushu Jump Gate for the express purpose of mining the field and manufacturing Polymers, a vital component in their optical chips.</TEXT><PARA/><POP/></RDL>'''
505 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;WARNING: NAVIGATIONAL HAZARD&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>A medium-sized field of frozen oxygen. Highly combustible, pilots are cautioned to take care when navigating the field to avoid igniting an explosion. Despite the danger, substantial Outcast activity has been observed in the field.</TEXT><PARA/><POP/></RDL>'''
506 = '''<RDL><PUSH/><TEXT>A medium-sized field of water ice. Freeport 6 is located in the heart of the field, along the leg of the Trade Lane leading to the Tau-31 Jump Gate. Open to anyone and everyone, Freeport 6 has become a frequent stop on cargo runs between Orsena and Vespera.</TEXT><PARA/><POP/></RDL>'''
507 = '''<RDL><PUSH/><TEXT>A medium-sized field of ice crystals.</TEXT><PARA/><POP/></RDL>'''
508 = '''<RDL><PUSH/><TEXT>A medium-sized field of rock asteroids. The Independent Mining Guild (IMG) has established an operation here, though its exact location and charter is unknown.</TEXT><PARA/><POP/></RDL>'''
509 = '''<RDL><PUSH/><TEXT>A small field of frozen water and oxygen crystals. Freeport 10 is located near its inner edge.</TEXT><PARA/><POP/></RDL>'''
510 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;WARNING: NAVIGATIONAL HAZARD&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>The South Dallas Debris Field consists of remnants of the Dallas Research complex, destroyed in the Texas incident in 500 AS. It appears to be home to a large concentration of Xenos terrorists.</TEXT><PARA/><POP/></RDL>'''
511 = '''<RDL><PUSH/><TEXT>A medium-sized field of debris that appears to be home to a large contingent of Junkers. Ashbound and Rogues are also frequently observed in the area.</TEXT><PARA/><POP/></RDL>'''
512 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;WARNING: NAVIGATIONAL HAZARD&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>A small debris field whose proximity to the F-Zone defensive line makes it a frequent destination for prison work convoys, but also a favorite meeting place for Xenos and local Rogues despite the best efforts of the Helion Navy to patrol the area.</TEXT><PARA/><POP/></RDL>'''
513 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;WARNING: NAVIGATIONAL HAZARD&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>This debris field is all that remains of the Jump Gate machinery, whose malfunction led to the Texas Incident in 500 AS. Today the area is highly radioactive and extremely dangerous, making it a refuge of last resort for criminals seeking to avoid capture by Helion authorities.</TEXT><PARA/><POP/></RDL>'''
514 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;WARNING: NAVIGATIONAL HAZARD&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>A large region of dark matter and radiation left behind after the Texas incident decimated the system in 500 AS. The Grande Negra is inimical to all unshielded organics and should be avoided at all costs.</TEXT><PARA/><POP/></RDL>'''
515 = '''<RDL><PUSH/><TRA bold="true" color="#FF0000"/><TEXT>&gt;&gt;&gt;WARNING: NAVIGATIONAL HAZARD&lt;&lt;&lt;</TEXT><TRA bold="false" color="default"/><PARA/><PARA/><TEXT>A smaller region of dark matter and radiation left behind in the wake of the Texas incident. The Pequena Negra is, however, just as lethal to unshielded organics as the larger Grande Negra, and should be avoided at all costs.</TEXT><PARA/><POP/></RDL>'''
