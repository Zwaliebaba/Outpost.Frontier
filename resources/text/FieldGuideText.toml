252 = '''<RDL><PUSH/><TEXT>Freeport 5 was originally built by the Independent Mining Guild (IMG), but the base was subsequently abandoned due to the intense radiation that plagues the system. A small, particularly dedicated band of Zoners moved in soon after and declared the base Freeport 5. Despite being shielded by a planetary fragment, the intense radiation requires a constant influx of Pharmaceuticals for both the Zoners and those travelers unfortunate enough to become afflicted with radiation poisoning.</TEXT><PARA/><POP/></RDL>'''
