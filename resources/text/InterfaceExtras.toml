177 = '''<RDL><PUSH/><TEXT>Lane Hackers often employ Tachyon-based weapons in combat, making them a serious threat. Keep that in mind when venturing forth in the Independent Worlds.</TEXT><PARA/><POP/></RDL>'''
178 = '''<RDL><PUSH/><TEXT>If you know you’re going to walk into a fight with the Helion Rogues, don’t use Plasma- and Particle-based weapons against them. You see, those weapons don’t work well against Molecular-based shield.</TEXT><PARA/><POP/></RDL>'''
179 = '''<RDL><PUSH/><TEXT>Positron-based shields work well against the Energy-based weapons favored by the Hessians.</TEXT><PARA/><POP/></RDL>'''
180 = '''<RDL><PUSH/><TEXT>If you ever find yourself in a fight with Cinder Guard, you may as well stow any Tachyon- or Neutron-based weapons and try something else. Hessians prefer to use Positron-based shields, much like the Rift Captains.</TEXT><PARA/><POP/></RDL>'''
181 = '''<RDL><PUSH/><TEXT>Don’t use Plasma- or Particle-based weapons against the Bundschuh. They use Molecular-based shields, so those weapons are rendered ineffective.</TEXT><PARA/><POP/></RDL>'''
182 = '''<RDL><PUSH/><TEXT>Word has it that the Bundschuh are using Tachyon-based weapons. If you think you’ll be running up against them, you should prepare with the right shield type.</TEXT><PARA/><POP/></RDL>'''
183 = '''<RDL><PUSH/><TEXT>Bounty Hunters have very maneuverable, agile ships designed specifically for one on one dogfights. If you’re looking to get into that field, or just need something highly maneuverable, you’ll need to visit a signature representative in Vesperan space. They aren’t available anywhere else.</TEXT><PARA/><POP/></RDL>'''
184 = '''<RDL><PUSH/><TEXT>If you’re in the market for a Bounty Hunter Heavy Fighter and you find yourself far from Shikoku, your next best bet is to visit Curacao.</TEXT><PARA/><POP/></RDL>'''
185 = '''<RDL><PUSH/><TEXT>There are special Orsena restrictions in place regarding the Charter Guild. If you’re looking to purchase a Bounty Hunter Heavy Fighter within this part of Sirius, you should head to Deshima, in the Shikoku system.</TEXT><PARA/><POP/></RDL>'''
186 = '''<RDL><PUSH/><TEXT>I hear the new conditions set down by the Charter Guild have limited the sale of Bounty Hunter Very Heavy Fighters to Freistadt. If you want one, that’s where you’ll have to go.</TEXT><PARA/><POP/></RDL>'''
187 = '''<RDL><PUSH/><TEXT>Hey, if you find yourself outside of Dornmark space and are looking for a Civilian Heavy Fighter, you still might be in luck — just head over to Kurile in the Sigma-17 system. I hear you can get them there now.</TEXT><PARA/><POP/></RDL>'''
188 = '''<RDL><PUSH/><TEXT>If you’re looking for a Civilian Light Fighter, cast your eye on Orsena space. That’s the only place you can get one.</TEXT><PARA/><POP/></RDL>'''
189 = '''<RDL><PUSH/><TEXT>Civilian Very Heavy Fighters are only sold on Freeport 9, which is in the Omicron Theta system.</TEXT><PARA/><POP/></RDL>'''
190 = '''<RDL><PUSH/><TEXT>If you’ve got your eye on a Border Worlds Light Fighter, you’ll have to go to Buffalo to get one. It’s the only place around that sells them.</TEXT><PARA/><POP/></RDL>'''
191 = '''<RDL><PUSH/><TEXT>When you’re ready, you might want to consider picking up a Border Worlds Freighter, I can’t recommend them enough. You’ll have to be friendly with the Lane Hackers at Mactan to get one though.</TEXT><PARA/><POP/></RDL>'''
192 = '''<RDL><PUSH/><TEXT>If hauling cargo is your business and you want the best ship for the job, check out the Border Worlds Freighter. It’s the best freighter available on the market.</TEXT><PARA/><POP/></RDL>'''
193 = '''<RDL><PUSH/><TEXT>If security is your game and defense is your concern, then you should know that the Very Heavy Fighter has the best armor rating in its class.</TEXT><PARA/><POP/></RDL>'''
194 = '''<RDL><PUSH/><TEXT>If you’re looking around at other ships, there are a couple of things you should know. For example, the Pirate Light Fighter and the Border Worlds Light Fighter are the only ships with turret mounts in that class. Check them out.</TEXT><PARA/><POP/></RDL>'''
195 = '''<RDL><PUSH/><TEXT>I hear that through some new trade channels the Border Worlds Heavy Fighter is now available on Kyoto in Orsena space, and also in Dornmark space on Bruchsal.</TEXT><PARA/><POP/></RDL>'''
196 = '''<RDL><PUSH/><TEXT>If you’re in the market for a Border Worlds Very Heavy Fighter you should think about heading either to Vogtland or Malta. Those will be your best bet for even finding one.</TEXT><PARA/><POP/></RDL>'''
197 = '''<RDL><PUSH/><TEXT>I hear the only way you can get your hands on a Corsair Very Heavy Fighter is to follow your nose to Leon or Crete. It isn’t a safe trip, but the benefits make it all worthwhile.</TEXT><PARA/><POP/></RDL>'''
198 = '''<RDL><PUSH/><TEXT>The Orsena and Vesperan Heavy Fighters are solid, dependable ships. However, some people avoid them due to their lack of turrets. It just depends what you’re after.</TEXT><PARA/><POP/></RDL>'''
199 = '''<RDL><PUSH/><TEXT>One of the disadvantages of the Light Fighter class is their inability to mount torpedoes. However, they can mount cruise disruptors, which still deliver a valuable advantage.</TEXT><PARA/><POP/></RDL>'''
200 = '''<RDL><PUSH/><TEXT>Vesperan Heavy Fighters are only sold through licensed dealers on Vesperan battleships. So you need a good reputation with the Vespera Armed Forces to even consider buying one.</TEXT><PARA/><POP/></RDL>'''
201 = '''<RDL><PUSH/><TEXT>Trafalgar is the only place to buy a Corsair Light Fighter. They use heavier versions in their Border Worlds Operations.</TEXT><PARA/><POP/></RDL>'''
202 = '''<RDL><PUSH/><TEXT>I hear the only way you can get your hands on a Corsair Heavy Fighter is to make the pilgrimage to Cadiz in Omega-5. That’s the mecca for that kind of specialty ship. They use them throughout the Omega Border Worlds.</TEXT><PARA/><POP/></RDL>'''
203 = '''<RDL><PUSH/><TEXT>Sales of the Orsena Heavy Fighter are strictly regulated by the Orsena Naval Forces. They are exclusively sold at ship dealers on Orsena battleships.</TEXT><PARA/><POP/></RDL>'''
204 = '''<RDL><PUSH/><TEXT>The first rule of piracy is, “What’s behind you doesn’t matter, it’s what’s ahead.” In support of this, you’ll notice that the Pirate Freighter class has the fewest number of total turrets, but has the most forward mounted guns of any freighter.</TEXT><PARA/><POP/></RDL>'''
205 = '''<RDL><PUSH/><TEXT>In the market for some pirate iron? If you’re looking for a Pirate Light Fighter, I hear that you can only get one in Rochester.</TEXT><PARA/><POP/></RDL>'''
206 = '''<RDL><PUSH/><TEXT>If you’re lookin’ around for something to give you an extra advantage out there, maybe you should get a Pirate Heavy Fighter. You’ll have to go to Arranmore or Montezuma to get one, but I think you’ll find it’s worth it.</TEXT><PARA/><POP/></RDL>'''
207 = '''<RDL><PUSH/><TEXT>Gotta bunch of cargo that needs hauling and you need something that’s up to a challenge? My advice would be to head over to Alcatraz and throw down some credits for a Pirate Freighter. They’re great for smuggling your cargo of choice.</TEXT><PARA/><POP/></RDL>'''
208 = '''<RDL><PUSH/><TEXT>If you’re looking to buy a Helion Heavy Fighter, you’re gonna have to go right into the mouth of the dragon to get it. They’re only sold on Helion battleships.</TEXT><PARA/><POP/></RDL>'''
209 = '''<RDL><PUSH/><TEXT>The Valkyrie is the most sought-after Dornmark craft. Fortunately, I know of the only place that one can be purchased: the battleship </TEXT><TRA italic="true"/><TEXT>Westfalen</TEXT><TRA italic="false"/><TEXT>.</TEXT><PARA/><POP/></RDL>'''
210 = '''<RDL><PUSH/><TEXT>You strike me as someone who strives to be the best. You should also fly the best, and everyone knows that the Dornmark Banshee is the best Light Fighter made.</TEXT><PARA/><POP/></RDL>'''
211 = '''<RDL><PUSH/><TEXT>There’s no mystery why Admiral Schultzky is here. Chancellor Niemann sent him to play politics with the President. Many in the government believe that Niemann was behind the attack on Relay Seven. Schultzky is here to appease Helion and the High Court, while the Dornmark Military continues to operate illegally in the Border Worlds. It’s not a big secret that Dornmark has been overstepping its boundaries out there for the last few weeks.</TEXT><PARA/><POP/></RDL>'''
212 = '''<RDL><PUSH/><TEXT>I’ve heard from a reliable source that Chancellor Niemann had ordered the strike on Relay Seven. My source also tells me that it has something to do with an archeological find somewhere in the Border Worlds.</TEXT><PARA/><POP/></RDL>'''
213 = '''<RDL><PUSH/><TEXT>It may not be the best move for Helion to send troops into Sigma even just to guard the Relay Seven wreck. Despite our best intentions, not everyone believes Helion means well — especially those who enjoy their privacy — like the Zoners. Meanwhile, enough people from every House died on Relay Seven that whoever did do this is likely to be hunted down and killed before they can be tried. No place will be safe for them to hide in the colonies. And if you ask me, they’ll get what they deserve.</TEXT><PARA/><POP/></RDL>'''
214 = '''<RDL><PUSH/><TEXT>I hear the LSF wants to accelerate the investigation by questioning survivors from Relay Seven — even the critically injured ones. They were going to wait but the pressure must really be on to pull a stunt like that. I mean what can some of these people really tell them? Most of them are barely hanging on. I’ve even heard that outside of the list of injured, the LSF isn’t entirely sure who was even on Relay Seven at the time. Typical government efficiency!</TEXT><PARA/><POP/></RDL>'''
215 = '''<RDL><PUSH/><TEXT>A lot of people say that The Order was behind the attack on Relay Seven. Makes perfect sense to me! That guy Avarren and his thugs are bent on destroying the peace in the colonies. Blowing up a neutral station run by the Zoners was a clever move. Now each House will blame the other for the incident.</TEXT><PARA/><POP/></RDL>'''
216 = '''<RDL><PUSH/><TEXT>I hear people say that you were on Freeport when it blew up. Did you hear the latest numbers? 2600 people dead! Listen, you better keep your head down. I heard from a good friend of mine in the LSF that all survivors are under surveillance. Something’s going on. Just watch your back.</TEXT><PARA/><POP/></RDL>'''
217 = '''<RDL><PUSH/><TEXT>The market took a pretty big hit today. Confidence in security is at an all-time low. You know, not that I condone profiting from others’ misfortunes, but a guy like you might want to seize this opportunity. You could do pretty well out there. There are companies and individuals just looking for the right kind of help.</TEXT><PARA/><POP/></RDL>'''
218 = '''<RDL><PUSH/><TEXT>Word has it that you were on Relay Seven. I talked to a Samura transport pilot the other day and he told me that his convoy left the station only minutes before it was attacked. He said that there were reports of unknown ships in the area. That’s why Relay Seven was unprotected when the attack occurred — they had sent most of their fighter protection away. I bet those ships attacked the station. Those Samura guys were lucky to get out alive.</TEXT><PARA/><POP/></RDL>'''
219 = '''<RDL><PUSH/><TEXT>I heard from the bartender that you’re signed on to work for Seraya Zane. I’ve worked with her for a few years. She’s tough but always fair and … best of all … she always pays on time.</TEXT><PARA/><POP/></RDL>'''
220 = '''<RDL><PUSH/><TEXT>Rumor has it that you’re the guy who’s flying for the LSF to Breakwater. You’re gonna be flying with Michael King. Consider yourself lucky. He’s one of the best pilots the LSF has around here. He’ll increase your chances to make it to Breakwater alive. Good luck, Independent pilot.</TEXT><PARA/><POP/></RDL>'''
221 = '''<RDL><PUSH/><TEXT>I hear you took the escort mission to Breakwater. Sera asked me yesterday to make that run. Looks like she finally found a fool for this silly scheme she and King cooked up. I’m guessing you’re flying in that crappy Starflier she had for a while. All I can say is be careful. That ship should have been put out of its misery a long time ago.</TEXT><PARA/><POP/></RDL>'''
222 = '''<RDL><PUSH/><TEXT>You were with King on that escort, weren’t you? That was an awesome job you did out there. These Rogues have been pestering us for a while now and it’s time that the LSF put a stop to them. Be careful, though. We believe that the Rogues have a fortified base somewhere near Breakwater.</TEXT><PARA/><POP/></RDL>'''
223 = '''<RDL><PUSH/><TEXT>Have you heard the news about Schultzky? He was attacked right here in Helion! No matter what the news tells you, I hear the LSF knows exactly who did it, but won’t tell us. They probably also know who destroyed Relay Seven. I wonder what they’re trying to cover up.</TEXT><PARA/><POP/></RDL>'''
224 = '''<RDL><PUSH/><TEXT>You know what I heard? The planetary defense grid around Whiteharbor was sabotaged. That’s how The Order managed to get through to Schultzky’s ship. It’s frightening what these people can pull off. They must have people helping them on the inside.</TEXT><PARA/><POP/></RDL>'''
225 = '''<RDL><PUSH/><TEXT>I’ve never even heard of “The Order” before the whole Schultzky incident. I’m no expert but I find it difficult to believe that the LSF, who is supposed to be protecting our interests and who we already know has a deep intelligence channel, didn’t know much about the attack. How could they not see this coming? Well at least they got the Rogues around Breakwater. That’s something.</TEXT><PARA/><POP/></RDL>'''
226 = '''<RDL><PUSH/><TEXT>You must be the guy King was talking about. He called in and said that you might show up here. I don’t really have a mission for you, but the Job Board has what you’re looking for. There should be plenty of assignments that should be interesting for you.</TEXT><PARA/><POP/></RDL>'''
227 = '''<RDL><PUSH/><TEXT>If you are looking for information, the first place you will want to go is the bar. The bartenders hear everything, so they are the guys you want to talk to if there’s something that you want to find out.</TEXT><PARA/><POP/></RDL>'''
228 = '''<RDL><PUSH/><TEXT>The fastest way to travel through civilized systems is to use the Trade Lanes. Usually the Lanes will link Jump Gates and bases throughout the system. They work like Jump Gates: target the ring with the destination you need, hit the Dock command and you are on your way.</TEXT><PARA/><POP/></RDL>'''
229 = '''<RDL><PUSH/><TEXT>During a dogfight, if your shields go down and your ship is taking significant damage, activate your Nanobot system. The tiny automated robots will make repairs to your ship while you fight. Don’t forget to purchase more if you deplete your onboard supply — they can save your life.</TEXT><PARA/><POP/></RDL>'''
230 = '''<RDL><PUSH/><TEXT>If you are headed to a location where there are no Trade Lanes, target a distant object in the direction you are headed and set your automated flight systems by clicking the Go To command. Once the onboard computer activates cruise engines, don’t worry, the AI can detect and avoid obstacles in your path, including asteroids.</TEXT><PARA/><POP/></RDL>'''
231 = '''<RDL><PUSH/><TEXT>If you are low on cash or just looking for work, search the Job Boards. Employers will post contracts that they need completed on these boards; you can find them in most bars. Once you fulfill a contract the payment will be automatically deposited in your account.</TEXT><PARA/><POP/></RDL>'''
232 = '''<RDL><PUSH/><TEXT>Many bartenders have connections with different factions throughout Sirius. Often times the bartender is willing to help your reputation along with these groups for a little money. It can be expensive to do this, and remember that if your reputation goes up with one group, it may go down with others.</TEXT><PARA/><POP/></RDL>'''
233 = '''<RDL><PUSH/><TEXT>You’ll hear the best rumors from those factions with whom you have a high reputation. If they only like you a little, you’ll get only basic information or none at all.</TEXT><PARA/><POP/></RDL>'''
234 = '''<RDL><PUSH/><TEXT>All Commodity rumors refer to profitable routes for the specified cargo.</TEXT><PARA/><POP/></RDL>'''
235 = '''<RDL><PUSH/><TEXT>Long-distance Commodity runs that span multiple systems are the best way to maximize trading profit. Short hops within systems will generally not yield more than 15% profit.</TEXT><PARA/><POP/></RDL>'''
236 = '''<RDL><PUSH/><TEXT>Common Commodities like Food, Water, and Oxygen are not generally recommended for long-distance cargo runs, as they are produced in many areas of the universe.</TEXT><PARA/><POP/></RDL>'''
237 = '''<RDL><PUSH/><TEXT>The best way to maximize profit in the shipping business is to buy directly from a rare Commodity source. The steepest price increases occur within the first few systems.</TEXT><PARA/><POP/></RDL>'''
238 = '''<RDL><PUSH/><TEXT>Be careful with highly perishable Commodities such as Luxury Foods and Alien Organisms; they will begin decaying as soon as you purchase them, so plan on making a speedy run to your planned point of sale in order to maximize profit.</TEXT><PARA/><POP/></RDL>'''
239 = '''<RDL><PUSH/><TEXT>If you hear a high-level rumor concerning a secret Jump Hole, criminal base, or shipwreck location, look for it on your Nav Map. The item should now be displayed.</TEXT><PARA/><POP/></RDL>'''
240 = '''<RDL><PUSH/><TEXT>Info purchases are a good way to find out about Jump Holes and hidden systems. You may hear about them in a rumor, but that’s not always a sure thing.</TEXT><PARA/><POP/></RDL>'''
241 = '''<RDL><PUSH/><TEXT>You may be offered information about corporate bases in other systems. Purchasing this info will allow you to view the Commodities on the Nav Map that are produced by the base, or in demand. This is very helpful in planning which Commodity to select for your cargo.</TEXT><PARA/><POP/></RDL>'''
242 = '''<RDL><PUSH/><TEXT>Check your reputation before selecting a distant base to deliver cargo to. You may not be able to land there if your reputation is too low with the faction that owns the base.</TEXT><PARA/><POP/></RDL>'''
243 = '''<RDL><PUSH/><TEXT>Criminal faction information may be offered in certain locations, providing a useful overview of that group’s allies, enemies, and history.</TEXT><PARA/><POP/></RDL>'''
244 = '''<RDL><PUSH/><TEXT>Info purchases for Jump Holes are usually offered at a lower reputation than their corresponding rumors. So if you aren’t close to a faction, you may still be able to buy the information.</TEXT><PARA/><POP/></RDL>'''
245 = '''<RDL><PUSH/><TEXT>Whenever you are selling or trading a ship, remember to strip all of your equipment off the ship first. Many dealers make huge profits from the spare equipment that is left on the ship when they take it over — you might end up giving away something important.</TEXT><PARA/><POP/></RDL>'''
246 = '''<RDL><PUSH/><TEXT>If you get into a fight while flying a freighter, switch weapons to turret mode and keep thrusters and countermeasures ready. Freighters are not built for dog fighting, it’s better to let the turret guns do the work.</TEXT><PARA/><POP/></RDL>'''
247 = '''<RDL><PUSH/><TEXT>Bounty Hunters will tell you that there are naturally occurring Jump Holes throughout Sirius. These small rifts in space can move your ship huge distances quickly. This would explain how criminal factions can travel from system to system avoiding the Jump Gates.</TEXT><PARA/><POP/></RDL>'''
248 = '''<RDL><PUSH/><TEXT>The Best Path command will use your ship’s navigational systems to plot the best course for your ship to take between your current position and a spot you click on the Nav Map. It will set waypoints which you can target and follow.</TEXT><PARA/><POP/></RDL>'''
249 = '''<RDL><PUSH/><TEXT>Whenever you discover a new location or object, it automatically gets recorded into your Neural Net’s memory files. Once that happens, you will always be able to pull up the data on the Nav Map.</TEXT><PARA/><POP/></RDL>'''
250 = '''<RDL><PUSH/><TEXT>Whenever you think you may have a fight ahead of you, don’t forget to load up on shield batteries and Nanobots at the equipment dealer. What you buy is up to you; some load up on Nanobots, though most prefer to use more shield batteries. If you can keep your shields from going down you won’t need the Nanobots.</TEXT><PARA/><POP/></RDL>'''
251 = '''<RDL><PUSH/><TEXT>If you are right on an enemy’s tail in a dogfight with your guns blazing, keep your eyes open — if he is any good he’ll drop mines. Of course, if some guy is on your tail, you can do the same thing.</TEXT><PARA/><POP/></RDL>'''
252 = '''<RDL><PUSH/><TEXT>If you are getting into trouble during a dogfight and think about running to a base, remember that your shields will have to come down during the last stage of the docking sequence. Your ship’s hull might not survive the punishment in those last few seconds.</TEXT><PARA/><POP/></RDL>'''
253 = '''<RDL><PUSH/><TEXT>Make sure that you mount newly purchased gear onto your ship before you leave the equipment dealer. A new weapon isn’t going to do you any good in a fight if it’s sitting in your cargo hold.</TEXT><PARA/><POP/></RDL>'''
254 = '''<RDL><PUSH/><TEXT>Corporates hang out in bars just like everybody else. A resourceful independent pilot could pick up a lot of work speaking to company representatives. The most successful independent pilots are the ones who go to bars looking for jobs, not beer.</TEXT><PARA/><POP/></RDL>'''
255 = '''<RDL><PUSH/><TEXT>Sometimes when a ship gets destroyed not all of the equipment onboard is lost. There may be salvageable equipment floating around that you can pick up, so don’t forget to look for loot after a fight.</TEXT><PARA/><POP/></RDL>'''
256 = '''<RDL><PUSH/><TEXT>Missiles are very fast, but do not turn well. If you’ve got one coming at you, turn perpendicular to it, drop countermeasures, and punch the afterburners. The missile should fly right by.</TEXT><PARA/><POP/></RDL>'''
257 = '''<RDL><PUSH/><TEXT>If you need to make a quick getaway, turrets can be helpful. Switch weapons to Turret Mode and fire off a few shots. The moment he breaks to evade, punch the cruise engines and get out of there. You might put enough distance between you and the other ship before he can fire off a cruise disruptor.</TEXT><PARA/><POP/></RDL>'''
258 = '''<RDL><PUSH/><TEXT>If you can’t seem to shake a bandit off your tail, here’s a tactic that might help: use Engine Kill. It cuts your engines, which means you will move in a straight line no matter what direction your craft faces. Spin your ship around and open up on him.</TEXT><PARA/><POP/></RDL>'''
259 = '''<RDL><PUSH/><TEXT>If you need information about your present location, click on the Question Mark icon in the top right of your HUD.</TEXT><PARA/><POP/></RDL>'''
260 = '''<RDL><PUSH/><TEXT>It can be dangerous to fly through some nebulae — many of them are radioactive, or contain highly unstable gas pockets that can be ignited by your engines. When you enter a new nebula, make sure to look out for these possibilities.</TEXT><PARA/><POP/></RDL>'''
261 = '''<RDL><PUSH/><TEXT>Use weapon groupings to conserve energy and make your weapon systems more efficient. It is a good idea to group long-range, quick-firing guns together to take down shields or hit targets from a distance. Make a separate group for heavy damage weapons like plasmas, and use them when you’re in close. The saved energy will allow you to sustain fire for a longer time.</TEXT><PARA/><POP/></RDL>'''
262 = '''<RDL><PUSH/><TEXT>A good pilot knows how to make use of the HUD Contact List. It is a filter that displays different things like solar objects, loot, ships, or everything all at once. Set the Contact List to different filters and it will show you important things, such as hostiles and mission-relevant items.</TEXT><PARA/><POP/></RDL>'''
263 = '''<RDL><PUSH/><TEXT>It might not be for everybody, but it’s possible to make decent money mining or collecting scrap metal. Your Nav Map will show you which areas within systems can be mined for ore by clicking on the Minable Zones filter.</TEXT><PARA/><POP/></RDL>'''
264 = '''<RDL><PUSH/><TEXT>Pirates are generally not very organized groups — they don’t fly in formation and are likely to flee if the odds turn against them in a fight. Even so, it’s important not to underestimate them, they can be quite dangerous.</TEXT><PARA/><POP/></RDL>'''
265 = '''<RDL><PUSH/><TEXT>The toughness rating of an enemy is displayed on your HUD, both in the targeting brackets and the target view. Sizing up your enemy is crucial when making those “fight or flight” decisions.</TEXT><PARA/><POP/></RDL>'''
266 = '''<RDL><PUSH/><TEXT>If you are going to take on a gunboat, try and stay beneath it where the fewest weapons can be used against you. A gunboat’s firepower is concentrated in the front, so don’t take him head on.</TEXT><PARA/><POP/></RDL>'''
267 = '''<RDL><PUSH/><TEXT>Entering a planet’s atmosphere without using the planetary docking ring will destroy your ship almost immediately. Space vessels are not equipped to handle atmospheric reentry without the shielding that the docking ring provides.</TEXT><PARA/><POP/></RDL>'''
268 = '''<RDL><PUSH/><TEXT>Use your strafing thrusters to dodge mines dropped by enemy ships you’re chasing. Just be careful not to follow them too closely to give you time to react.</TEXT><PARA/><POP/></RDL>'''
269 = '''<RDL><PUSH/><TEXT>Choose wisely in a fight. Although your reputation may increase with the faction you decide to side with, their enemies will become your enemies, and your reputation will go down with them.</TEXT><PARA/><POP/></RDL>'''
270 = '''<RDL><PUSH/><TEXT>The most successful pirates use their cargo scanner to find out what a potential target is carrying. There’s no sense in attacking a transport if the cargo isn’t worth the fight.</TEXT><PARA/><POP/></RDL>'''
271 = '''<RDL><PUSH/><TEXT>If you are going to attack a Trade Lane ring, keep in mind that they all have automated weapon turrets that police can activate. This makes them a more dangerous target than one might think.</TEXT><PARA/><POP/></RDL>'''
272 = '''<RDL><PUSH/><TEXT>It is always safer to travel in numbers; so if you see a friendly patrol or freight shipment going the same direction you are headed, you can form up with them by targeting one of the ships and using the Join Formation command.</TEXT><PARA/><POP/></RDL>'''
273 = '''<RDL><PUSH/><TEXT>If you need to cross a long stretch of space and there are no Trade Lanes nearby, activate your cruise engines for maximum speed.</TEXT><PARA/><POP/></RDL>'''
274 = '''<RDL><PUSH/><TEXT>Thrusters are one of the most useful items you can equip on your ship.  Most pilots believe they are absolutely essential. Thrusters help you stay on enemies in a dogfight, dodge incoming mines and missiles, and they can get you out of somebody’s targeting sights quickly.</TEXT><PARA/><POP/></RDL>'''
275 = '''<RDL><PUSH/><TEXT>Keep a close eye on how many Nanobots and Shield Batteries you have, they’re shown in the Player Ship view of your ship’s HUD. If you run out just stop by any friendly base and pick up more.</TEXT><PARA/><POP/></RDL>'''
276 = '''<RDL><PUSH/><TEXT>Criminals prefer to occupy zones where they can remain easily hidden, so keep your eyes open if you head into an asteroid or debris field — you might stumble upon some unfriendlies.</TEXT><PARA/><POP/></RDL>'''
277 = '''<RDL><PUSH/><TEXT>If you’ve taken severe structural damage, like the loss of a wing or tail fin, you’ll need to land on a base for repairs. Nanobots can’t fix that kind of damage.</TEXT><PARA/><POP/></RDL>'''
278 = '''<RDL><PUSH/><TEXT>Turret Mode can be helpful even if your ship has no turret weapons mounted. The turret cameras will still operate, which you can use to look around and get your bearings, or spot enemies and wingmen.</TEXT><PARA/><POP/></RDL>'''
280 = '''<RDL><PUSH/><TEXT>A smart independent pilot is one that stays informed. Make sure you talk to people when the opportunity arises to learn what they know. News Vendors are also an excellent source of information for what’s going on around Sirius.</TEXT><PARA/><POP/></RDL>'''
281 = '''<RDL><PUSH/><TEXT>Once you purchase new missile, mine, or countermeasure launchers, stock up on ammo and supplies. The new gear doesn’t do you any good if it isn’t loaded.</TEXT><PARA/><POP/></RDL>'''
282 = '''<RDL><PUSH/><TEXT>You can outfit your ship with a variety of weapons and equipment from vendors around Sirius, but remember that not all of it can be purchased by inexperienced pilots. Some of the high-end components will only be sold to veteran pilots and independent pilots.</TEXT><PARA/><POP/></RDL>'''
283 = '''<RDL><PUSH/><TEXT>When trading in goods, check the pricing indicator shown after the price — if it’s green on the dealer’s list, it’s a good time to buy; if it’s red, the item is overpriced. The same applies for your side of the dealer interface — if the indicator is green, you’re getting a good price; if it’s red, you are paying too much. Keep in mind that these indicators reflect market price, not necessarily the price you paid.</TEXT><PARA/><POP/></RDL>'''
284 = '''<RDL><PUSH/><TEXT>Feel free to hail friendly pilots in space. They will usually identify themselves and relay some information about their cargo run or patrol route.</TEXT><PARA/><POP/></RDL>'''
285 = '''<RDL><PUSH/><TEXT>Though you might hear rumors about secret Jump Holes, I would still try to avoid them. If there is an unregulated jump point within a system, it’s probably crawling with criminals.</TEXT><PARA/><POP/></RDL>'''
286 = '''<RDL><PUSH/><TEXT>Some of the missions people hand out are extremely dangerous. Read the offer thoroughly to make sure you’re not getting in over your head.</TEXT><PARA/><POP/></RDL>'''
287 = '''<RDL><PUSH/><TEXT>Some pilots are skilled enough to shoot and destroy incoming mines and missiles. You need to have nerves of steel and be a crack shot to pull this off.</TEXT><PARA/><POP/></RDL>'''
288 = '''<RDL><PUSH/><TEXT>If you like to keep up with what is going on around the colonies, the News Vendors will provide you with current information about the latest developments in Sirius.</TEXT><PARA/><POP/></RDL>'''
289 = '''<RDL><PUSH/><TEXT>If you would like to change the view at the equipment dealer, click the left and right arrows on the screen. This will allow you to see your ship from different angles.</TEXT><PARA/><POP/></RDL>'''
290 = '''<RDL><PUSH/><TEXT>No matter how much a particular faction may dislike you, their dealers will still sell you what they have for sale. A credit is still a credit, even if they don’t like who it came from.</TEXT><PARA/><POP/></RDL>'''
291 = '''<RDL><PUSH/><TEXT>Whiteharbor is one of the busiest places in all of Helion. People from all over Sirius come here — traders, Bounty Hunters, police, military officers, corporate execs — everybody.</TEXT><PARA/><POP/></RDL>'''
292 = '''<RDL><PUSH/><TEXT>You can make pretty good money just flying around the debris fields in Whiteharbor looting for scrap metal. You have to be a pretty good shot though; only the small, moving pieces of debris generally contain loot. This can be a good way to make some fast cash when you need money to repair your ship.</TEXT><PARA/><POP/></RDL>'''
293 = '''<RDL><PUSH/><TEXT>When you’re in a bar, it’s pretty easy to see what someone has to offer — a dollar sign means they’ll offer a bribe, a speech bubble means you’ll hear a rumor, and a suitcase means that they might have a mission for you.</TEXT><PARA/><POP/></RDL>'''
294 = '''<RDL><PUSH/><TEXT>If your ship has sustained any damage when you land at a base, you can repair the ship immediately by clicking the Wrench icon on your Neural Net display. That way you can land, repair, and get back into space quickly.</TEXT><PARA/><POP/></RDL>'''
295 = '''<RDL><PUSH/><TEXT>Be careful when you are dropping mines. It is not a good idea to let too many go at once because they can home in on anybody, even friendly ships.</TEXT><PARA/><POP/></RDL>'''
296 = '''<RDL><PUSH/><TEXT>Whenever you explore new regions of space, your Nav Map will automatically process the data and update itself to display useful information, including minable zones, political dominance of the area, and many of the patrol paths running through that region.</TEXT><PARA/><POP/></RDL>'''
297 = '''<RDL><PUSH/><TEXT>If you’re running low on cargo space, you can browse your inventory to see which items are taking up space by moving your cursor over them. A highlight will appear in your Cargo Space Bar showing how much room each item occupies.</TEXT><PARA/><POP/></RDL>'''
298 = '''<RDL><PUSH/><TEXT>You can target distant objects directly from your Nav Map. Click the object displayed on the map (you may need to zoom in to see it), and then click the Target Object icon.</TEXT><PARA/><POP/></RDL>'''
299 = '''<RDL><PUSH/><TEXT>Some of the heavier fighter classes can carry torpedoes. The torpedo’s velocity is too slow to use in dogfights, but is excellent against battleships and bases. They are extremely expensive but can cause incredible damage.</TEXT><PARA/><POP/></RDL>'''
300 = '''<RDL><PUSH/><TEXT>Generally, countermeasures are only effective against one missile — so if you have multiple missiles inbound, you will need to drop several countermeasures to protect your ship.</TEXT><PARA/><POP/></RDL>'''
301 = '''<RDL><PUSH/><TEXT>If you are having some trouble finding an object on your Nav Map, try turning on the Toggle Labels button; this will overlay the titles of known objects.</TEXT><PARA/><POP/></RDL>'''
302 = '''<RDL><PUSH/><TEXT>If you’re caught in a dogfight near a planet, you can always try to burn the bogeys off in the edge of the atmosphere; just make sure you don’t end up killing yourself instead.</TEXT><PARA/><POP/></RDL>'''
303 = '''<RDL><PUSH/><TEXT>If you need to make a quick getaway in an asteroid field, loop behind one of the larger rocks and try to get your cruise engines online. Once you’ve got them up, punch out of there in a straight line skimming the edges of asteroids to keep the cruise disrupters from hitting you.</TEXT><PARA/><POP/></RDL>'''
304 = '''<RDL><PUSH/><TEXT>It’s always a good idea to keep your reputation in mind. There’s a possibility that you could end up an outlaw for helping someone that you thought was innocent.</TEXT><PARA/><POP/></RDL>'''
305 = '''<RDL><PUSH/><TEXT>If you don’t qualify for high-end weapons yet, return to the equipment dealer after you have had a few more fights. Your experience status with the dealers might have changed.</TEXT><PARA/><POP/></RDL>'''
306 = '''<RDL><PUSH/><TEXT>An effective way to ambush cargo-laden transports is to take down a Trade Lane Ring. If you drop the shields on a Ring its generators go offline, and anyone traveling the Lane gets dumped out.</TEXT><PARA/><POP/></RDL>'''
307 = '''<RDL><PUSH/><TEXT>A tractor beam comes as standard equipment on every ship. You can use it when your craft is moving at low speeds to pick up salvageable loot after a fight, or when collecting ore or scrap metal.</TEXT><PARA/><POP/></RDL>'''
308 = '''<RDL><PUSH/><TEXT>A large network of Jump Gates links all the major systems of Sirius. You will find that the Gates are the safest way to travel from system to system.</TEXT><PARA/><POP/></RDL>'''
309 = '''<RDL><PUSH/><TEXT>A common Corsair strategy is to let you get on their six, then start dropping mines while his wingman lines you up for the kill from behind.</TEXT><PARA/><POP/></RDL>'''
310 = '''<RDL><PUSH/><TEXT>Anytime you enter a dealer’s area on a base your Neural Net is automatically updated with the list of items that the dealer buys and sells.</TEXT><PARA/><POP/></RDL>'''
311 = '''<RDL><PUSH/><TEXT>When you’re checking out the news, don’t forget to glance down at the price ticker. It’ll give you all the latest prices on equipment and Commodities sold on that base.</TEXT><PARA/><POP/></RDL>'''
312 = '''<RDL><PUSH/><TEXT>In time, you will be able to recognize members of different factions when you walk into a room by the clothes they are wearing.</TEXT><PARA/><POP/></RDL>'''
313 = '''<RDL><PUSH/><TEXT>Waypoints are a great way to keep track of a specific location in space or mark a particular object or path. You can even lay down your own waypoints by clicking your Nav Map.</TEXT><PARA/><POP/></RDL>'''
314 = '''<RDL><PUSH/><TEXT>If you’ve gotten some new or updated mission objectives while you’re on a base, your Neural Net will usually remind you after you launch.</TEXT><PARA/><POP/></RDL>'''
315 = '''<RDL><PUSH/><TEXT>Don’t make a habit of skipping out on missions or leaving them incomplete, no one likes it when somebody backs out on a deal. If you do it too often, you’ll get a bad reputation and some people won’t speak to you anymore.</TEXT><PARA/><POP/></RDL>'''
316 = '''<RDL><PUSH/><TEXT>A lot of the objects you encounter in space will have a set of brackets marking them. These brackets make it easier to find and select small objects and are also color coded: friendly objects in green, hostile in red, and neutral in white.</TEXT><PARA/><POP/></RDL>'''
317 = '''<RDL><PUSH/><TEXT>If you need to break out of a Trade Lane for any reason, click the Free Flight command. This will move you into normal space.</TEXT><PARA/><POP/></RDL>'''
318 = '''<RDL><PUSH/><TEXT>Once your target is in range of your guns, a small red cross — your Lead Indicator — will appear in front of your opponent, showing how far in front of his ship to fire.</TEXT><PARA/><POP/></RDL>'''
319 = '''<RDL><PUSH/><TEXT>Your reticule’s color will change when you sweep it over other ships — red for hostiles, green for friendlies.</TEXT><PARA/><POP/></RDL>'''
320 = '''<RDL><PUSH/><TEXT>While not necessary for basic flight, strafing thrusters are quite useful. Use the strafe left and right keys to dodge missiles and mines, or for precise maneuvering. Remember that the thrusters draw from the same power source as afterburners.</TEXT><PARA/><POP/></RDL>'''
321 = '''<RDL><PUSH/><TEXT>Remember: Your three most important indicators are Weapon Power, Shield Status, and Hull Integrity. They are located at the bottom center of your HUD, represented by yellow, blue, and red bars respectively.</TEXT><PARA/><POP/></RDL>'''
322 = '''<RDL><PUSH/><TEXT>You can click the Universe Map icon in the top right of your Nav Map to view every system you have information on. To zoom in on a system, click the system’s marker.</TEXT><PARA/><POP/></RDL>'''
323 = '''<RDL><PUSH/><TEXT>The universe is a big place; you can always find your location on the Nav Map by the blinking ship indicator. If you’ve changed maps to show the universe or a different system, click the Player Location button located in the top left of the Nav Map to refocus on your ship.</TEXT><PARA/><POP/></RDL>'''
324 = '''<RDL><PUSH/><TEXT>Your contact list is divided into five filters: Important Items, Ships, Solar Objects, Loot, and Everything. Click the icons at the top of the list to cycle through the filters.</TEXT><PARA/><POP/></RDL>'''
325 = '''<RDL><PUSH/><TEXT>To view mission objectives or updates to your journal, click the star-shaped button in the top-right corner of your HUD.</TEXT><PARA/><POP/></RDL>'''
326 = '''<RDL><PUSH/><TEXT>If you have any mission waypoints or have placed waypoints yourself, they’ll be listed in a panel to the left of your Nav Map. Using the icons above the list, you can also toggle between your personal waypoints and mission waypoints.</TEXT><PARA/><POP/></RDL>'''
327 = '''<RDL><PUSH/><TEXT>When a pilot broadcasts a message you will see a signal. If the ship is your current target or is off screen, a set of yellow arrows will point to the target indicator; if the ship is onscreen, its targeting bracket will turn yellow.</TEXT><PARA/><POP/></RDL>'''
328 = '''<RDL><PUSH/><TEXT>All off-screen hostile targets will show up as small red arrows around the outer edge of your HUD. Your current selected target will also appear as a colored arrow, only larger to more easily distinguish it from other ships and objects.</TEXT><PARA/><POP/></RDL>'''
329 = '''<RDL><PUSH/><TEXT>New weapons that you mount on your ship are turned off by default when you first launch to space. So once you have left the atmosphere of the planet, check your Weapon List window to ensure that none of your guns are offline.</TEXT><PARA/><POP/></RDL>'''
330 = '''<RDL><PUSH/><TEXT>For survival, new pilots must learn to manage their afterburners. Afterburners will propel your ship to great speeds, but they also drain power from a rechargeable thruster battery. A percentage indicator to the left of the Ship Status window displays the available battery power.</TEXT><PARA/><POP/></RDL>'''
331 = '''<RDL><PUSH/><TEXT>The target read out will tell you where a Trade Lane is coming from and going to. If you want to go the other direction, just fly around to the other side.</TEXT><PARA/><POP/></RDL>'''
332 = '''<RDL><PUSH/><TEXT>To view the data file on a ship or object that you have targeted, open the schematic view by clicking the applicable icon over the target window, and then click the Information (question mark) button.</TEXT><PARA/><POP/></RDL>'''
333 = '''<RDL><PUSH/><TEXT>Every ship is equipped with a number of equipment mounts called “hard points.” These hard points interface with different kinds of equipment at certain power ratings. This means you can’t put a shield generator on a weapon hard point, and you can’t put a high-power consumption weapon on a low- power weapon mount.</TEXT><PARA/><POP/></RDL>'''
334 = '''<RDL><PUSH/><TEXT>The enemies you will encounter in random missions are usually the veterans of their faction, and hence carry better weapons and more expensive Commodities than the rank and file. Any loot you pick up from their destroyed ships will generally be of a higher quality than normal.</TEXT><PARA/><POP/></RDL>'''
335 = '''<RDL><PUSH/><TEXT>There’s an independent group called the Mission Commission that monitors and tracks most of the freelance jobs in the Sirius system. They are the ones relaying updated mission information to you in space, and transferring credits to your account for finished jobs.</TEXT><PARA/><POP/></RDL>'''
336 = '''<RDL><PUSH/><TEXT>Once you’ve taken a job, the Mission Commission doesn’t care how long you take to begin; but once you start, they insist that you focus solely on the job until it is complete. If you fail to comply, your contract will be cancelled, your credits forfeited, and your reputation marred.</TEXT><PARA/><POP/></RDL>'''
337 = '''<RDL><PUSH/><TEXT>If you get a mission that only requires you to destroy a ship or group of ships, try to lure your targets away from surrounding enemy weapon platforms or defense systems to minimize damage taken during the encounter.</TEXT><PARA/><POP/></RDL>'''
338 = '''<RDL><PUSH/><TEXT>To quickly target the nearest enemy, click the Closest Enemy icon on the Target window, or press the hot key assigned to that icon.</TEXT><PARA/><POP/></RDL>'''
339 = '''<RDL><PUSH/><TEXT>Some of your weapon hard points are going to have limits on how far they can rotate; this is for your own protection, since full rotation on some hard points would allow you to shoot your own ship.</TEXT><PARA/><POP/></RDL>'''
340 = '''<RDL><PUSH/><TEXT>When you’re getting hit by enemy fire you’ll see a red semicircle appear in the center of your screen. This semicircle indicates the direction that the hostile fire is coming from.</TEXT><PARA/><POP/></RDL>'''
341 = '''<RDL><PUSH/><TEXT>Using the Formation icon is a good way to link up with a group of ships. Once you’re in formation, your ship will switch into autopilot and stick with the formation wherever it goes. To disengage from the formation, click the Free Flight maneuver icon.</TEXT><PARA/><POP/></RDL>'''
342 = '''<RDL><PUSH/><TEXT>You can sub-target specific sections of a larger target that you have selected. For example, to sub-target a section of a selected ship or object, click the section to target; or, switch the Target Status window to the schematic view, and then click the next and previous sub-target buttons. This is most useful against large ships when you’re trying to concentrate your missile or torpedo fire on a section of the vessel.</TEXT><PARA/><POP/></RDL>'''
343 = '''<RDL><PUSH/><TEXT>Nearly every faction can offer you missions if you’re on good terms with them. The type of mission you get sent on, of course, depends on the type of faction you are working for. You may be asked to do all manner of tasks — from retrieving stolen property to performing assassinations. There’s a lot of work out there if you’re sick of hauling Commodities.</TEXT><PARA/><POP/></RDL>'''
344 = '''<RDL><PUSH/><TEXT>Thanks to technological advances in quantum displacement compression, a ship’s cargo hold can contain a sizable amount of goods. Naturally, light fighter class ships can’t hold as much as heavy fighters; but nothing matches a freighter’s cargo capacity.</TEXT><PARA/><POP/></RDL>'''
345 = '''<RDL><PUSH/><TEXT>If you are going up against a heavily armored station, concentrate your fire on its weapons and any defending ships. Once those are knocked out, you can take your time blasting through its armor.</TEXT><PARA/><POP/></RDL>'''
346 = '''<RDL><PUSH/><TEXT>You’ve got to be on really friendly terms with a group before they’ll trust you and offer you their best weapons.</TEXT><PARA/><POP/></RDL>'''
347 = '''<RDL><PUSH/><TEXT>If you’re the adventurous type, you can try to locate a derelict ship out there in the void. If you’re lucky enough to find one, you’ll probably find some weapons in its arsenal.</TEXT><PARA/><POP/></RDL>'''
348 = '''<RDL><PUSH/><TEXT>Important safety tip: Don’t hang around once you have dropped a mine. Mines can have a large destructive radius.</TEXT><PARA/><POP/></RDL>'''
349 = '''<RDL><PUSH/><TEXT>Remember that a good thruster will outrun a missile every time.</TEXT><PARA/><POP/></RDL>'''
350 = '''<RDL><PUSH/><TEXT>A tactical hint: If you see a mine in your path or you’ve got an incoming missile, try strafing left or right.</TEXT><PARA/><POP/></RDL>'''
351 = '''<RDL><PUSH/><TEXT>While you’re checking out the weapons that are available, remember that turrets inherently have a longer range than standard guns.</TEXT><PARA/><POP/></RDL>'''
352 = '''<RDL><PUSH/><TEXT>If you hit an enemy with a Pulse-based weapon when their shields are down, it will drain their powerplant. This gives you a momentary tactical advantage.</TEXT><PARA/><POP/></RDL>'''
353 = '''<RDL><PUSH/><TEXT>If your ship’s powerplant can’t handle firing all your guns simultaneously, a good workaround is to toggle certain weapons off until your energy consumption is more manageable. On the other hand, some people just go with mounting missile launchers. That works until they can afford to upgrade.</TEXT><PARA/><POP/></RDL>'''
354 = '''<RDL><PUSH/><TEXT>Shield technology is a funny thing; it works great for fighters and freighters. But for anything larger — such as a large transport, train, or a capital ship — forget it. They’re just too damn big.</TEXT><PARA/><POP/></RDL>'''
355 = '''<RDL><PUSH/><TEXT>I was on the XT-19 when it was attacked. We were in deep trouble when you guys arrived. Thanks again for your help. We had fires on several decks, but we managed to fly the XT-19 back to Breakwater. I’m glad you took out that Rogue base. That’ll hopefully stop those guys for a while.</TEXT><PARA/><POP/></RDL>'''
356 = '''<RDL><PUSH/><TEXT>Aren’t you the guy who flew with King and took out that Rogue base? I’ve known King forever. He’s been fighting these Rogues ever since he joined the LSF many years ago. King’s a bit eccentric, but otherwise a nice guy. I would fly with him anytime.</TEXT><PARA/><POP/></RDL>'''
357 = '''<RDL><PUSH/><TEXT>The President apparently called Bonnerille and the LSF on the carpet for the whole Schultzky screw up. The Chancellor is furious, holding us responsible for Schultzky’s death. There’s a rumor floating around that Intelligence knew more about The Order than they are letting on.</TEXT><PARA/><POP/></RDL>'''
358 = '''<RDL><PUSH/><TEXT>Well, the first analysis of the Relay Seven data has just been made available. From what I have heard so far, the station’s defense systems didn’t fire one shot at the attacking ships. Either the radar system of the station didn’t pick up the attackers, or someone on the inside disabled the defense systems. Could be that there was a traitor on board.</TEXT><PARA/><POP/></RDL>'''
359 = '''<RDL><PUSH/><TEXT>You are the Rellan who’s working for the LSF, aren’t you? You definitely fit the description. Listen, I have a message for you from Seraya Zane. She told me that you might come by here since you don’t have jump access yet. Seraya is waiting for you on Whiteharbor. She has a new assignment for you. If I were you, I wouldn’t keep her waiting too long. You know how she can get when she’s angry.</TEXT><PARA/><POP/></RDL>'''
360 = '''<RDL><PUSH/><TEXT>A medic friend of mine told me that the LPI took all of the Relay Seven survivors to LSF headquarters for interrogation. He also told me that he spoke to one of these survivors, a man named Lonnigan, who said that the station was attacked by some strange-looking ships that were unlike anything he’d ever seen before. Strange, huh? Well, he was also muttering something about the government being “behind it all”, whatever that means. That Lonnigan guy was supposedly in pretty bad shape — but you never know, maybe there’s some truth to what he was saying.</TEXT><PARA/><POP/></RDL>'''
361 = '''<RDL><PUSH/><TEXT>A good friend of mine in the LSF told me that there is ample evidence that The Order was behind the attack on Relay Seven. He told me that they’ve interrogated most of the survivors from the station, and that all fingers point to The Order at this point.</TEXT><PARA/><POP/></RDL>'''
362 = '''<RDL><PUSH/><TEXT>It’s good to meet you, Rellan. I’m a friend of Michael King who I believe you know. He’s been bragging how he almost single-handedly took out the Rogue depot near Breakwater. You know how he is … not quiet Mr. Humble. Anyway, Michael told me that you might show up here. He’s waiting for you on Whiteharbor. Looks like he does need some help after all!</TEXT><PARA/><POP/></RDL>'''
363 = '''<RDL><PUSH/><TEXT>Ever since the attack on Admiral Schultzky, the navy has moved its heavy battleships to all Jump Gates. Every ship going in or out of the Cinderwell system is being scanned.</TEXT><PARA/><POP/></RDL>'''
364 = '''<RDL><PUSH/><TEXT>Have you heard about the artifact ban? Jacobi can pretend like there’s some security concern, but in the end it’s all about Helion getting their cut of a market they’ve been dying to get into. If they make it a controlled substance — and then later tax the hell out of it — they’ll get their chance.</TEXT><PARA/><POP/></RDL>'''
365 = '''<RDL><PUSH/><TEXT>They say The Order has struck again and this time it’s one of our ships! Kill all the Dornmark guys all you want but when you start killing our people, that’s when we lose it. How could they have gotten into Zone 21 in the first place — and then onto a cruiser? They had to have had inside information. I smell a traitor.</TEXT><PARA/><POP/></RDL>'''
366 = '''<RDL><PUSH/><TEXT>I know a nurse over at the Williams-Creek Medical Center. I’m sure you’ve heard the news by now that several of the Relay Seven survivors have died in the last few days supposedly due to severe injuries. Well, my nurse friend told me that she was taking care of this one guy who was in perfectly good health; the doctors had even scheduled him for release. But when she came in the next day she was told that he had suddenly up and died in the night. No explanation and no cause of death was reported other than “general trauma”. His body was removed before she reported to work in the morning and even his medical chart was confiscated by the LSF. I’m telling you, we’re not hearing everything that’s going on around there.</TEXT><PARA/><POP/></RDL>'''
367 = '''<RDL><PUSH/><TEXT>I’m sure you heard that Jacobi ordered the LSF to investigate the Relay Seven disaster. The team that went out there ran the usual engine signature tests, which is standard procedure on stuff like this. What’s puzzling, though, is that they’ve recorded particle signatures of a type that is not on record. Whatever attacked that station was not a regular bunch of pirates, I can tell you that.</TEXT><PARA/><POP/></RDL>'''
368 = '''<RDL><PUSH/><TEXT>Did you hear in the news that there was an attack in Zone 21 after all? First the Navy denied it, but now they confirmed that The Order has taken out a cruiser near the entrance passage to the Zone. It’s really scary how much damage an organization like The Order is able to inflict.</TEXT><PARA/><POP/></RDL>'''
369 = '''<RDL><PUSH/><TEXT>You were with the group of fighters that bailed us out earlier, weren’t you? In the name of all of us here on Pueblo, thank you. Because of your help, I’ll let you in on a little secret. Some of the fields here in Colorado contain large amounts of Silver. If you need money, that’s a good way to get cash without too much risk.</TEXT><PARA/><POP/></RDL>'''
370 = '''<RDL><PUSH/><TEXT>I just heard that the Rogues launched an attack near Fort Bush today. That must be the first time in years that they dare attack such a large installation. An LPI officer told me that they were trying to free a prisoner — an Artifact smuggler from what I’m told.</TEXT><PARA/><POP/></RDL>'''
371 = '''<RDL><PUSH/><TEXT>A friend of yours was looking for you earlier. His name is Lonnigan or something. He didn’t leave a message, but said that he’d find you. Not that it’s any of my business, but he was pretty worked up. Your friend should see a doctor.</TEXT><PARA/><POP/></RDL>'''
372 = '''<RDL><PUSH/><TEXT>A friend tells me that the reports about the Relay Seven survivors that have died are lies. The news reports that they’ve died due to their extensive injuries, but from what I heard, that’s not true at all. My friend also told me that at least one of the survivors managed to get out of the Medical facilities.</TEXT><PARA/><POP/></RDL>'''
373 = '''<RDL><PUSH/><TEXT>I heard that you have to fly to the California system. It’s really easy to get there and it’s not very far. Take the Trade Lane from Whiteharbor to West Point, and from there to the California Gate. After that, fly to Mojave and take the Trade Lane directly to California Minor. The only thing that you need to be careful about is the Lane Hackers, since they’ve been very active lately and it’s quite possible you could be attacked.</TEXT><PARA/><POP/></RDL>'''
374 = '''<RDL><PUSH/><TEXT>The bartender tells me that you are one of the few lucky people to survive the Relay Seven disaster. The funny thing is that you’re the second survivor I talked to today. A few hours ago, a man named Brandon Rowlett was here. He was looking for you, Mr. Rellan.</TEXT><PARA/><POP/></RDL>'''
375 = '''<RDL><PUSH/><TEXT>You know what I heard? Remember that Dornmark supposedly has found a planet full of Alien Artifacts? (This isn’t the regular stuff; people said these things actually still worked.) Anyway, a friend of mine told me that he heard that Relay Seven was destroyed because Dornmark had stored some of these Artifacts on the station. I wonder if there’s any truth to that.</TEXT><PARA/><POP/></RDL>'''
376 = '''<RDL><PUSH/><TEXT>We just heard that a convoy was attacked in the Barrera Passage. It must have been an undercover operation since it wasn’t listed on any official flight path. They should have talked to us before trying to take the Passage; artifact smugglers, Rogues and Ashbound have been operating in that area for a few days now. I wonder who was crazy enough to try this.</TEXT><PARA/><POP/></RDL>'''
377 = '''<RDL><PUSH/><TEXT>A friend of yours called in a few hours ago … his name is Michael King. He said that he would contact you again soon.</TEXT><PARA/><POP/></RDL>'''
378 = '''<RDL><PUSH/><TEXT>Say whatever you want about its methods or politics, but the navy is an impressive organization. They have tracked down just about all of the survivors from Relay Seven. Last report was that a patrol tracked down a man named Brandon Rowlett. He tried to flee, but these navy pilots are among the very best here in Helion. He never had a chance.</TEXT><PARA/><POP/></RDL>'''
379 = '''<RDL><PUSH/><TEXT>It’s really odd. My cousin, who’s been assigned to the southern sector of the California system for almost ten years, was just transferred by the navy without prior notice. It’s really unusual for the navy to do such a thing; actually, I’ve never heard of anyone who was transferred without reason or prior notification.</TEXT><PARA/><POP/></RDL>'''
380 = '''<RDL><PUSH/><TEXT>I hear that Walker has offered to help you. He’s probably the most respected officer in the entire Helion Fleet. He’s been the skipper of the </TEXT><TRA italic="true"/><TEXT>Utah</TEXT><TRA italic="false"/><TEXT>  for over five years now. They’re actually stationed in Los Angeles, but regularly patrol in these parts of the system to fight off all the pirates and smugglers in this area.</TEXT><PARA/><POP/></RDL>'''
381 = '''<RDL><PUSH/><TEXT>We just received reports of Dornmark Military ships operating in this system. I can’t believe that’s accurate, since it would be a direct violation of the Boorman Treaty. We haven’t been able to confirm that the reports are true. Anyway, keep your eyes open when you’re out there.</TEXT><PARA/><POP/></RDL>'''
382 = '''<RDL><PUSH/><TEXT>Those people you came here with, Seraya Zane and Captain Walker, they’re currently talking to our station commander. I don’t know exactly what’s going on, but apparently it got pretty loud in there — lots of yelling and shouting. Then after a while, they sent out a top-priority dispatch to Whiteharbor. Something’s going on, that’s for sure.</TEXT><PARA/><POP/></RDL>'''
383 = '''<RDL><PUSH/><TEXT>Most of us think that these Dornmark ships were sent here under direct orders from Chancellor Niemann. He’s denying it, of course, but there’s no way a small fleet of Dornmark gunships would operate in Helion without anyone in the Dornmark Military knowing about it.</TEXT><PARA/><POP/></RDL>'''
384 = '''<RDL><PUSH/><TEXT>There’s something strange going on in both the navy and the LSF. I’m hearing rumors about a bunch of people that are either reassigned or simply removed from their posts. It’s not like High Command to do things so under-handedly. It might have something to do with a traitor they’ve been trying to weed out lately.</TEXT><PARA/><POP/></RDL>'''
385 = '''<RDL><PUSH/><TEXT>There’s something strange going on in both the navy and the LSF. I’m hearing rumors about a bunch of people that are either reassigned or simply removed from their posts. It’s not like High Command to do things so under-handedly. It might have something to do with a traitor they’ve been trying to weed out lately.</TEXT><PARA/><POP/></RDL>'''
386 = '''<RDL><PUSH/><TEXT>What’s going on? Why is Dornmark attacking us? We’re a science station! Thank god for that cruiser formation. I’ll never ever say they take too much out of my taxes for military spending ever again. If it wasn’t for them, we might not even be here anymore.</TEXT><PARA/><POP/></RDL>'''
387 = '''<RDL><PUSH/><TEXT>I can’t believe Dornmark has reached this far into California. Just what are they thinking? Certainly President Jacobi won’t stand for this, but the way the Senate is, it would take days for them to actually decide on any recourse.</TEXT><PARA/><POP/></RDL>'''
388 = '''<RDL><PUSH/><TEXT>The navy has finally found the manifest of Relay Seven. It was pretty badly damaged, but we managed to retrieve most of the data. Finally, we’ll know who was on that station. We have a suspicion that someone on the inside had disabled the station’s defense systems. Our CO said that we are to round up anyone who was on Relay Seven. There’s a colony-wide search going on right now.</TEXT><PARA/><POP/></RDL>'''
389 = '''<RDL><PUSH/><TEXT>Something serious is going on that has to do with the Relay Seven investigation. My brother, who’s an officer in the LPI, tells me that the police and the LSF are going through the manifest and are actively looking for anyone who was on that station. He said that several people have been incarcerated and that the methods of interrogation are not, well, standard. That’s all he was willing to tell me. For my own protection, he said.</TEXT><PARA/><POP/></RDL>'''
390 = '''<RDL><PUSH/><TEXT>Is your name really Rellan? That’s funny. A lot of people seem to be looking for a guy named Corin Rellan. He apparently was on Relay Seven when it blew up and is supposed to know who is behind its destruction.</TEXT><PARA/><POP/></RDL>'''
391 = '''<RDL><PUSH/><TEXT>Have you heard all the talk about The Order? A colleague of mine told me that he was approached about two months ago to join The Order.</TEXT><PARA/><POP/></RDL>'''
392 = '''<RDL><PUSH/><TEXT>I hear that a navy cruiser abandoned her post a few days ago. They just straight up took the ship and there’s no trace of them. How do you get away with an entire cruiser? It’s not like you can just hide it in your pocket. Things must be getting intense in the military if ships are openly leaving positions like that without detection.</TEXT><PARA/><POP/></RDL>'''
393 = '''<RDL><PUSH/><TEXT>I have a friend who’s a private on the battleship </TEXT><TRA italic="true"/><TEXT>Independence</TEXT><TRA italic="false"/><TEXT>. Apparently, not too long ago the captain of the ship was found dead. The strange part was that an autopsy revealed she was missing her heart and brain! Can you believe that?</TEXT><PARA/><POP/></RDL>'''
394 = '''<RDL><PUSH/><TEXT>I just had a conversation an hour or so ago with a guy named Syd. He told me that he’s in the possession of an alien artifact and that it is the reason for all the catastrophes lately. You’d think he’s just a nut case, but you know, he seemed eerily serious and convinced.</TEXT><PARA/><POP/></RDL>'''
395 = '''<RDL><PUSH/><TEXT>I don’t know what’s going on, but the Helion Navy is going crazy right now. It’s like they completely switched gears. I always thought of them as rather open minded and peace loving. Then the hammer fell and now they’re arresting anyone with connections to artifacts. In fact, I’ve even heard that Dornmark is slowly moving into Zone 21 with Helion’s approval!</TEXT><PARA/><POP/></RDL>'''
396 = '''<RDL><PUSH/><TEXT>Just about every Bounty Hunter in the colonies is after you. You’re wanted for murder, Artifact smuggling, treason, and the destruction of Relay Seven. Quite an impressive list, but if you ask me, your chances of survival are pretty slim. At least get yourself a new ship — soon!</TEXT><PARA/><POP/></RDL>'''
397 = '''<RDL><PUSH/><TEXT>We heard that a renegade Helion cruiser opened fire and destroyed one of her own — the battleship </TEXT><TRA italic="true"/><TEXT>Unity</TEXT><TRA italic="false"/><TEXT>, I think. I’ve never actually seen one of those things open fire with that huge gun. It must have been something to see. I bet you could have seen it from the planet.</TEXT><PARA/><POP/></RDL>'''
398 = '''<RDL><PUSH/><TEXT>Apparently, all of Helion went into lockdown because of a few fugitives. What did these guys do anyways? From what we heard, they blasted right through West Point and blew up some research station before coming here. They must either be really good or really stupid to pull all that off and still make it out alive. I don’t think they even have a good lead on them anymore.</TEXT><PARA/><POP/></RDL>'''
399 = '''<RDL><PUSH/><TEXT>I just got back from Freeport 4. All I can say is that the Helion Navy was all over that place! When I left I saw a full cruiser formation coming in. What the hell happened in Helion anyways? You’d think someone blew up a planet or something.</TEXT><PARA/><POP/></RDL>'''
400 = '''<RDL><PUSH/><TEXT>All Bounty Hunters in this sector are looking for a guy named Rellan … I assume that’s you. Listen, the Helion government has placed a bounty on your head … 1 million credits! You better stay out of sight. Get yourself a new ship and a new identity if you want to live through this.</TEXT><PARA/><POP/></RDL>'''
401 = '''<RDL><PUSH/><TEXT>All the Bounty Hunters in Vespera are looking for an LSF officer — her name is Seraya Zane. I don’t know what crime she committed, but the Helion government has placed a bounty of 1 million credits on her head! That’s retirement right there! Let me know if you ever run into her, and I’ll split the bounty with you.</TEXT><PARA/><POP/></RDL>'''
402 = '''<RDL><PUSH/><TEXT>I’ve heard that you’re looking for Doctor Ronald Quintaine. I’ve known him for over twenty years. He’s an emeritus Professor of Archeology and Pre-Human Colonization at Cambridge University. His main interest for the last twenty years has been the study of Alien Artifacts. Many people consider him the foremost authority in that field. I haven’t seen him in a few weeks, but I’m sure he’s crawling around some ruins somewhere in the Border Worlds.</TEXT><PARA/><POP/></RDL>'''
403 = '''<RDL><PUSH/><TEXT>People say you’re looking for Quintaine? Be careful, it looks like the Professor has some powerful enemies. His lab has been destroyed and nobody has either seen or heard from the Professor in weeks. I fear the worst.</TEXT><PARA/><POP/></RDL>'''
404 = '''<RDL><PUSH/><TEXT>Well, it must have been a few months since we last saw each other. Didn’t you decide to leave Leeds to make a fortune in the Border Worlds? Tobias was heartbroken when you left, you know that, right? You’re like a son to him. He’s still running the Equipment Dealership here, of course. You shouldn’t have any problems finding him since he works pretty much all the time. In fact, if you go over there now, you’ll probably find him there.</TEXT><PARA/><POP/></RDL>'''
405 = '''<RDL><PUSH/><TEXT>Did you hear the latest news? Looks like Helion has dramatically stepped up their policies against all alien artifacts. Rumors speak of hundreds of arrests. I’m telling you, it’s just a matter of time before President Jacobi will try to seek these artifacts throughout the colonies.</TEXT><PARA/><POP/></RDL>'''
406 = '''<RDL><PUSH/><TEXT>I’ve heard reports coming in that Dornmarker’s have been spotted all over Magellan. It doesn’t look like an invasion fleet, though. It looks more like a search operation. They’re continually patrolling and sweeping for something. I’ve even heard that they’ve repeatedly attacked some Lane Hacker base out there, but that they keep getting beaten back.</TEXT><PARA/><POP/></RDL>'''
407 = '''<RDL><PUSH/><TEXT>Tobias and Rellan? Oh yeah, you mean Eddie. Yeah, they go way back. When Eddie was a kid his parents died in this horrible accident on Leeds. Tobias was a family friend and has raised him ever since. It’s funny, actually. Tobias was never all that great of a parent. He used to be such a womanizer. I guess old age changes people, sometimes for the worse.</TEXT><PARA/><POP/></RDL>'''
408 = '''<RDL><PUSH/><TEXT>I remember there was this girl Vanessa — a gorgeous creature with legs that didn’t stop. Smart, too. She’s a student at Cambridge. She used to go out with this total space case named Rellan. I think he broke up with her because of some kind of “deal of a lifetime.” What an idiot. While money comes and goes, a good woman is impossible to find.</TEXT><PARA/><POP/></RDL>'''
409 = '''<RDL><PUSH/><TEXT>How’s that deal of a lifetime holding out for you? I told you not to listen to that crazy bastard but NO, you had to go into space and nearly get blown to space dust for nothing. Next time listen to me. Come on, I’ll go buy you a drink. I heard they just got this new draft, Helion Ale or something.</TEXT><PARA/><POP/></RDL>'''
410 = '''<RDL><PUSH/><TEXT>Given all the tension with Dornmark lately, it was really creepy to see three Dornmarkers walking in the bar not too long ago. They were looking for two fugitives that are apparently on the run from Helion authorities. I don’t remember their names, but it was on the News not too long ago.</TEXT><PARA/><POP/></RDL>'''
411 = '''<RDL><PUSH/><TEXT>It’s really getting out of control now. People are saying that Dornmark warships have been seen in just about every system in the colonies, and Niemann dares to deny any involvement of the Dornmark Military. Now it seems they are moving forces into the Border Worlds surrounding Dornmark. This is leading us straight into a war, if you ask me.</TEXT><PARA/><POP/></RDL>'''
412 = '''<RDL><PUSH/><TEXT>I saw you talking to Vance earlier. That guy used to be one of the best combat pilots around here, but he’s totally washed-up now. All he does nowadays is shuttle people from planet to planet, and whatever money he makes, he uses to buy this terrible Sidewinder Fang stuff.</TEXT><PARA/><POP/></RDL>'''
413 = '''<RDL><PUSH/><TEXT>Are you with this woman Seraya Zane? She’s been sniffing around here for a while looking for Professor Quintaine. Let me tell you, you have to be careful. Even the walls have ears on this planet. There have been some strange people looking for the professor lately. Just a few hours ago, some rather suspicious Dornmarkers were asking for him. They said they were from the Ironreach Museum, but they didn’t look much like scientists, if you ask me.</TEXT><PARA/><POP/></RDL>'''
414 = '''<RDL><PUSH/><TEXT>Vance just told me that you’re looking for Professor Quintaine. I’ve been working for the professor for seven years. I just took on this job as a bartender because the professor disappeared without a trace a few weeks ago. I have been keeping my head down ever since. Someone is after the professor, but I don’t know who. Our lab has been destroyed and all of the professor’s papers have disappeared. If you find him, tell him that his staff went into hiding, but that most of us are alright.</TEXT><PARA/><POP/></RDL>'''
415 = '''<RDL><PUSH/><TEXT>I’ve heard that you’re working for the Hammer Research Institute and that you’re flying out to the research site on Sprague. I was just over in Omega-3 a few days ago. It’s actually not far from here at all — take the Trade Lane to the Norfolk and from there to the Omega-3 Gate. I would then fly up to Freeport 1 and cut over to Sprague from there. But let me warn you, be careful out there, Dornmark ships have been seen all over that system in the last few days.</TEXT><PARA/><POP/></RDL>'''
416 = '''<RDL><PUSH/><TEXT>We heard a unit of Dornmarker’s razed Sprague not too long ago! I don’t get it! There was nothing out there but a bunch of snooty archaeologists? What could Dornmark possible gain by razing such a remote planet?</TEXT><PARA/><POP/></RDL>'''
417 = '''<RDL><PUSH/><TEXT>Did you hear? Baxter Research Station just got blown to bits! I can’t believe it myself, I used to work there. I heard it was the Dornmarkers, but I think that some people are just exaggerating. Who would have seen it anyway? That station has been abandoned for years, and there’s no reason to go out there except to blow it up.</TEXT><PARA/><POP/></RDL>'''
418 = '''<RDL><PUSH/><TEXT>I just heard the battleship </TEXT><TRA italic="true"/><TEXT>Wotan</TEXT><TRA italic="false"/><TEXT>  was just destroyed! Wasn’t that the flagship of the West Dornmark Fleet? Wow, I wonder how that happened. There aren’t enough military forces combined to take on a capital ship of that class.</TEXT><PARA/><POP/></RDL>'''
419 = '''<RDL><PUSH/><TEXT>Cloaking devices? Bah, fairy tales. Years of research went into that lost cause. I think they actually did manage to get it working at one point, but the power it took was that of ten battleship cores! I bet if you could manage to cut that down by four orders of magnitude you could put it on a ship, but I don’t know of any human technology existing that could do that.</TEXT><PARA/><POP/></RDL>'''
420 = '''<RDL><PUSH/><TEXT>Hovis? Yeah, I know him. He’s undefeated in these races, you know. In fact, that’s all he does. He was exiled from Helion for illegal gambling and for rigging a bomb on the bottom of a ship. The problem was that ship was racing him at the time and was piloted by a major senator’s son. He’s been here ever since. I’d watch my back around him. He’s not exactly right, and as much as he loves to race, he loves winning even more — if you get my meaning.</TEXT><PARA/><POP/></RDL>'''
421 = '''<RDL><PUSH/><TEXT>Did you hear, the Dornmarkers blew up that old station Glorious in Dublin? At least it was abandoned for the most part. It was always a heap of scrap metal anyways.</TEXT><PARA/><POP/></RDL>'''
422 = '''<RDL><PUSH/><TEXT>I can’t believe it! The bet of a lifetime! The odds were 10,000 to 1. Apparently this no name, no talent scrub comes out of nowhere and actually beat Hovis in a race! Nobody knows who he was except that he went by the name Rellan. If you ever see him, tell him to come back, even if the odds go down to 500 to 1, I’ll bet the farm on him!</TEXT><PARA/><POP/></RDL>'''
423 = '''<RDL><PUSH/><TEXT>There are reports of Dornmark gunships in the Dublin system. I bet it was those same bastards that blew up the Glorious. I had friends there. I hope they got out alive.</TEXT><PARA/><POP/></RDL>'''
424 = '''<RDL><PUSH/><TEXT>Mr. Rellan?! Oh my god! I wanted to thank you for everything. I wouldn’t be alive right now if it wasn’t for you! I’m sorry I don’t have anything to pay you back with though, it all got blown up!</TEXT><PARA/><POP/></RDL>'''
425 = '''<RDL><PUSH/><TEXT>I just tried to get here from Tau-23! Those bastard Dornmarkers are blocking the Jump Gates, so I had to find a Jump Hole. Thank god for space anomalies. It seems like those bastards are blocking all the exits. I probably should have stayed in Tau-23 but my family’s here.</TEXT><PARA/><POP/></RDL>'''
426 = '''<RDL><PUSH/><TEXT>The ghost images that repeatedly show up? Those are cloaked ships, which can only mean one thing. Dornmark. I’ve heard reports of sightings near the Stokes Smelter, and even threats of hostility. At first they thought it was the Mollys, but I think that Dornmark is about to hit Leeds hard.</TEXT><PARA/><POP/></RDL>'''
427 = '''<RDL><PUSH/><TEXT>There was a huge battle over Leeds! I can’t believe it! The Dornmarkers have already managed to penetrate that deep into Vespera. Just when things looked really bad, this guy showed up, Tobias I think his name was. Took out an entire battleship himself and managed to keep the Dornmarkers at bay until the Vespera Royal Space Force could show up. Leeds still took one hell of a beating though.</TEXT><PARA/><POP/></RDL>'''
428 = '''<RDL><PUSH/><TEXT>It’s horrible. The Holman Outpost was decimated by the Dornmark Navy! I just can’t believe it. They were defenseless and Dornmark just shrugged them off like flies. Those bastards will pay for this!</TEXT><PARA/><POP/></RDL>'''
429 = '''<RDL><PUSH/><TEXT>Ah, yes — Kress. He left a message for you in this data pad. It’s encrypted, but he said Quintaine would know the password. Nice guy, but he had some really creepy bodyguards with him. Hope that helps.</TEXT><PARA/><POP/></RDL>'''
430 = '''<RDL><PUSH/><TEXT>I heard a couple of friends of mine ran into this huge ghost image on their radars. It stands to support the other things people have been hearing, about a Dornmark Fleet somewhere in Tau-29. I’d be careful wandering around out there.</TEXT><PARA/><POP/></RDL>'''
431 = '''<RDL><PUSH/><TEXT>I hear that Dornmark has managed to spread its forces to the borders of every major house. The military build up is accelerated but we don’t know how. They must have converted all their mining facilities to strip Dornmark of all of its resources. Even if they win, they lose.</TEXT><PARA/><POP/></RDL>'''
432 = '''<RDL><PUSH/><TEXT>I heard there was a guy they pulled out of a crushed FP7 life pod who had a bunch of Artifacts and millions in credits on him. Normally, I’d say it sounded like a buyer was in the wrong place at the wrong time, but with all those credits? I guess the LSF thinks it’s strange too since they are somehow linking this guy to The Order.</TEXT><PARA/><POP/></RDL>'''
433 = '''<RDL><PUSH/><TEXT>I hear the LSF took matters into their own hands with the Rogues around Breakwater; they didn’t even give them the chance to surrender. Bonnerille’s men have gone way beyond “official” orders and now they are using this problem with the Order as an excuse to clean house.</TEXT><PARA/><POP/></RDL>'''
434 = '''<RDL><PUSH/><TEXT>You know, just after the Artifact ban they found two collectors completely burned to a crisp in their shops. The police said they died in freak accidents, but it was weird — nothing was left of the bodies but ashes, while everything around them was just fine. It was like they spontaneously combusted or something.</TEXT><PARA/><POP/></RDL>'''
435 = '''<RDL><PUSH/><TEXT>They’re confiscating artifacts everywhere in Helion now. You know, just before the ban was set in place some guy — supposedly a big-time Dornmark count — made a record bid for some at an auction. He took delivery of the whole lot and left before the camera crew could even get his picture. As it turned out his name was a fake, but his credits were real enough. How weird is that?</TEXT><PARA/><POP/></RDL>'''
436 = '''<RDL><PUSH/><TEXT>Before The Order, I hear Avarren was an Edge World renegade. He slaughtered several outposts of civilians before troops could be sent to stop him. When they got there, there was nothing left. No one was left alive, and he had gone underground. Now he’s attacking us.</TEXT><PARA/><POP/></RDL>'''
437 = '''<RDL><PUSH/><TEXT>Things are not going well for us in Dornmark right now. The Chancellor says the President and the High Court are not moving fast enough in going after The Order. He suspects Orsena of conspiring with them and now I’m told he’s starting to think that our lack of action means Helion could be involved too.</TEXT><PARA/><POP/></RDL>'''
438 = '''<RDL><PUSH/><TEXT>I heard two “high rankers,” who were in here earlier, say that The Order got another one of our ships. I don’t know where this was, but they apparently were part of the search-and-rescue op and saw it themselves. There wasn’t much left. Get this — based on a coded transmission they think the target wasn’t just the ship, it was one guy: a General named Evans — Walter Evans. I’ve never heard of him. If it’s true, it seems like an awful lot of trouble to vaporize a whole ship and her escorts to get one man. From the way they were talking, I don’t think this one will be on the news.</TEXT><PARA/><POP/></RDL>'''
439 = '''<RDL><PUSH/><TEXT>I hear the LSF is taking this notion of Avarren being here in Helion more seriously than they’re letting on. Bonnerille’s formed an elite group of so-called “special agents” to deal with aggressively rooting out people or groups who may have any perceived ties with The Order.</TEXT><PARA/><POP/></RDL>'''
440 = '''<RDL><PUSH/><TEXT>I’ve heard this business in the Border Worlds between Dornmark and Orsena has less to do with planetary settlement than it does claims to artifact-rich planets that are in the gray areas. Out there, the law doesn’t mean all that much. If you can take it and defend it, it’s yours. But this is all academic politically; no one will admit to it.</TEXT><PARA/><POP/></RDL>'''
441 = '''<RDL><PUSH/><TEXT>Now it’s strictly a rumor mind you, but I’ve heard that there’s a new kind of Artifact that a Dornmark survey team discovered in the Border Worlds.  Not the usual stuff. As you probably know, most Artifacts are just the remnants of the technology used by the race of people who lived in Sirius thousands of years ago. Some are really elegant, crystalline structures that generate musical tones, light, colors, and other energy. Most of them are traded as art trinkets, but apparently Dornmark has hit the motherload and is trying to keep it </TEXT><TRA italic="true"/><TEXT>all</TEXT><TRA italic="false"/><TEXT>  for itself.</TEXT><PARA/><POP/></RDL>'''
442 = '''<RDL><PUSH/><TEXT>Don’t believe what you hear on the news feed. I hear this Avarren guy isn’t even really dead; he’s out in the Border Worlds somewhere controlling everything. Meanwhile, I think the LSF has underestimated him and The Order. I hear Avarren is hidden so deeply in the shadows of the underworld that no one outside of his most trusted men has even seen what he looks like. And don’t think The Order is just some lame outfit of outlaws either. I hear they’ve got their hands in every criminal faction in the colonies, not to mention legitimate businesses and perhaps even the government. In short, many people who probably don’t know they’re helping The Order really are. Avarren is clearly the mastermind behind all of this — and that guy the LSF killed, some shemp they either found or set up. I guess Bonnerille needed to show at least some kind of success to save his job. The bigger question is, why are we only hearing about The Order now?</TEXT><PARA/><TEXT>[/af1]It’s a slang expression.</TEXT><PARA/><TEXT>[kw2]I can’t find a definition for this term.</TEXT><PARA/><POP/></RDL>'''
443 = '''<RDL><PUSH/><TEXT>You know, since the assassination of Ettinger, several of my contacts in Dornmark have suddenly gone incommunicado. These are government officials, industry men, professionals; it’s not like them to just go dark.</TEXT><PARA/><POP/></RDL>'''
444 = '''<RDL><PUSH/><TEXT>I’ve heard that there have been clusters of Dornmark ships seen gathering around every way in and out of Ironreach. It looks like they are on some kind of alert, but it’s not on any of the public channels. What’s going on over there?</TEXT><PARA/><POP/></RDL>'''
445 = '''<RDL><PUSH/><TEXT>Have you seen the news? This is bad. I hear the Chancellor even suspects someone in his own government may be feeding sensitive information to the Orsena, who in turn use it in covert operations against him. I’m telling you, he’s becoming more paranoid every day.</TEXT><PARA/><POP/></RDL>'''
446 = '''<RDL><PUSH/><TEXT>I’m not really a student of history, but I understand the Boorman Treaty has been in place since the colonies were founded and the first Libertonians discovered the other settlements. It was one of the first things they agreed on to help avoid the mistakes that drove them from the Earth in the first place.</TEXT><PARA/><POP/></RDL>'''
447 = '''<RDL><PUSH/><TEXT>You know this is very bad for business, but thankfully Helion presides over the colonies and the High Court for a reason. Still, I’ve been hearing some rumblings from inside the government and growing concern that if the Chancellor loses it completely, he could do some serious damage to Orsena before anyone could stop him. Well, it’s up to us to keep that from happening and to restore the status quo. I know the President feels this way, and we are all behind her.</TEXT><PARA/><POP/></RDL>'''
448 = '''<RDL><PUSH/><TEXT>Have you heard the news? What the hell is the Chancellor playing at? We have consistently been his only real ally all of these years. Even the cabinet is outraged at this move of his, and they’ve always been slow to act. Irrespective of whether or not he is insane, the Queen simply will not stand for this.</TEXT><PARA/><POP/></RDL>'''
449 = '''<RDL><PUSH/><TEXT>The summit meeting is as good as dead. They’ve killed Quigley, man! I hear people think it’s The Order again. And by the way, I don’t believe for a second that that Ballenshine bloke went belly-up all by himself either. Somebody helped him along, and they’re just trying to cover it up. That’s what I think. I mean think about it. First they kill Helion’s man, and now ours. What better way to sabotage the summit.</TEXT><PARA/><POP/></RDL>'''
450 = '''<RDL><PUSH/><TEXT>Things are heating up in Dornmark. I just got back from Hamburg and there is an active effort going on from some kind of “agitators” to try and stir the people against Orsena. They’re doing a pretty good job of it, too. Meanwhile, the Chancellor himself has started a program to get the younger people into immediate military service. He’s taking on hundreds of new recruits every day. This isn’t some kind of “defensive action” like they are saying.</TEXT><PARA/><POP/></RDL>'''
451 = '''<RDL><PUSH/><TEXT>I’d be careful going out into the frontier if I were you. If the Border Worlds were rough before, they’re no place to be now. Not only are the Dornmark goons making it hard for us to get by out there, but I also heard some gas miner rummy blabbing about some kind of strange ship he’d seen that just “shimmered away.” Probably the alcohol talking, but he’s not alone — I heard a couple of other pilots reported seeing something weird out there, and were going to investigate. They didn’t come home.</TEXT><PARA/><POP/></RDL>'''
452 = '''<RDL><PUSH/><TEXT>Thank God the Queen wasn’t hurt on Curacao. She’s still sequestered in her own quarters waiting for the session to be recalled. I hear that Gunther Obst was only narrowly missed in the attack — and is outraged — understandably. This is the first time I’ve ever heard of anyone from The Order ever being captured alive, but he clearly was familiar with the layout and security to have made it in that far.</TEXT><PARA/><POP/></RDL>'''
453 = '''<RDL><PUSH/><TEXT>What do you think about Helion and the artifact ban? I mean, you know how Helion is — credits, credits, credits. I used to think it was all a smoke screen but now I’m not so sure. Supposedly Jacobi’s been talking to the Queen for a while in private about the importance of the artifact ban and the potential threat to Vespera; she wants us to extend the ban here, too. No worries, though. The Queen is young but she’s smart and has good people around her. If there’s any kind of real danger I believe she’ll act in our best interests.</TEXT><PARA/><POP/></RDL>'''
454 = '''<RDL><PUSH/><TEXT>If it was The Order’s mission to disrupt the conference, they did a good job, even if they missed Mr. Obst. Now he says Orsena is trying to kill him? I hear the assassin they captured died in his cell before he could be questioned — OD’d on Cardamine, injected a massive dose right into his own heart. Surprised they didn’t catch that when they searched him. Pity. I wanted to hear if Orsena really does have ties to The Order.</TEXT><PARA/><POP/></RDL>'''
455 = '''<RDL><PUSH/><TEXT>You know, there is a whole group of Orsena people — merchants, pilots, regular blokes — stuck in Dornmark and not allowed to return home. I hear the local police are leaning on them pretty heavily. They’re being unlawfully detained, questioned, searched, and their property illegally confiscated. I also hear the Chancellor is starting to see conspiracy everywhere now; he’s even looking for spies in his own family — people he’s known for years.</TEXT><PARA/><POP/></RDL>'''
456 = '''<RDL><PUSH/><TEXT>I hear that Dornmark might be right in thinking that Orsena is up to something. Apparently, there’s an indication that Orsena agents have tried to steal some kind of new ship technology from one of Dornmark’s top secret installations. This is obviously not something they can very well broadcast but it wouldn’t surprise me, though. The Orsena are known to be very aggressive about acquiring new toys for their own purposes.</TEXT><PARA/><POP/></RDL>'''
457 = '''<RDL><PUSH/><TEXT>This thing with Dornmark is getting worse all of the time. Poor Orsena devils. And now Jacobi’s sticking her nose deep into it. I’m glad we have the good sense to look at all the facts and not pretend to be the bloody “universal peacekeepers.” I mean really — the gall, the unmitigated self-importance of Helion. Sod the Boorman Treaty. Each colony’s got to do what’s right for them. Thankfully, we’re steering clear. That’s probably why our people can still get around Dornmark with no problem.</TEXT><PARA/><POP/></RDL>'''
458 = '''<RDL><PUSH/><TEXT>I heard there really was a bomb found in the wreckage of the Orsena medical convoy. It’s supposed to be made of something really nasty. Instead of just destroying its target, it eliminates everything organic and inorganic and renders the whole area toxic to all life. These guys weren’t on any medical run. They must have intended that charge to take out something big.</TEXT><PARA/><POP/></RDL>'''
459 = '''<RDL><PUSH/><TEXT>I hear that Niemann has told his people that they are no longer beholding to the High Court. That’s strange when you consider that he was once its biggest supporter and was the one pushing to extend its charter and scope. I’ve always thought he was a man who loved freedom and justice, but now he’s acting like a paranoid warmonger.</TEXT><PARA/><POP/></RDL>'''
460 = '''<RDL><PUSH/><TEXT>If you’re heading out into Dornmark anytime soon, just watch yourself. I hear there are more military and police around than normal, and they get pretty ill-tempered, even with neutrals. I’ve even heard that they’ve mined some of the Border Worlds systems. If you ask me, they’re gearing up for something major — I just hope we’re not on the menu.</TEXT><PARA/><POP/></RDL>'''
461 = '''<RDL><PUSH/><TEXT>Well, that about wraps it up for a settlement, I’d say. Nobody’s ever going to go back to that table. Not Dornmark — and definitely not Orsena — at least not till something significant changes.</TEXT><PARA/><POP/></RDL>'''
462 = '''<RDL><PUSH/><TEXT>This is going to single-handedly sink the market, let me tell you. Merchants — not just here, but all over — are starting to really feel it. Things were so carefully balanced between the colonies before that. Now this little ripple is turning into a major event that could set us </TEXT><TRA italic="true"/><TEXT>all</TEXT><TRA italic="false"/><TEXT>  pretty far back if it continues.</TEXT><PARA/><POP/></RDL>'''
463 = '''<RDL><PUSH/><TEXT>What they’re not telling us is that the Dornmarkers aren’t just sending some ships over. They’ve developed a new kind of ship — one that can cloak.  That’s what I heard, at least. Got a friend whose brother works for the Signals Corp. He says they’re worried, and with good reason. It’s the perfect recon and first strike weapon. No evidence — total surprise.</TEXT><PARA/><POP/></RDL>'''
464 = '''<RDL><PUSH/><TEXT>I suppose if anyone could make the President see our side of things, it would be Governor Tekagi. Have you heard the lies that Niemann has been spreading, that we’re the ones who support The Order? We have been doing everything possible to discover the whereabouts of The Order! The only reason we’ve had no trouble with them is because of the structure of our society, not because we support them. Everyone here has a role; everyone has a purpose. There is total dedication with no opportunity for perversion or infiltration by foreign influences — er, no offense to you, of course.</TEXT><PARA/><POP/></RDL>'''
465 = '''<RDL><PUSH/><TEXT>I hear that several Vesperan merchants inside Dornmark were successful in smuggling out some of our people. They say that things there are horrific there — that some of the countrymen have never come back from being questioned in the containment block. They have no idea what happened to them.</TEXT><PARA/><POP/></RDL>'''
466 = '''<RDL><PUSH/><TEXT>You know, there are plenty of Dornmarkers here and in the rest of the colonies who don’t feel the same way as the Chancellor does about the Orsena people. This atmosphere of distrust makes things difficult not just for them, but for everyone.</TEXT><PARA/><POP/></RDL>'''
467 = '''<RDL><PUSH/><TEXT>Someone on the inside tells me that one of the reasons why we’re so concerned about security isn’t just because of The Order, but because two high-ranking Vesperan intelligence operatives have recently been replaced in the Queen’s party. I dug a little more and found that these people weren’t reassigned — they disappeared. Naturally, this has been suppressed, but it’s causing a great deal of alarm in the intelligence community. If this report is true, how can anyone guarantee the safety and security of our own people or the information they carry?</TEXT><PARA/><POP/></RDL>'''
468 = '''<RDL><PUSH/><TEXT>I don’t trust Helion anymore. I’ve actually heard that they are secretly working with Dornmark to divide us on two fronts, and then come in to bleed us dry of our resources and technology. It’s in total disregard of the Boorman Treaty — that they themselves set up, but that’s the way they operate. They stand behind the law as long as it serves their interests. I’ve even heard they’ve been kidnapping some of our best scientists and forcing them to work on some secret project.</TEXT><PARA/><POP/></RDL>'''
469 = '''<RDL><PUSH/><TEXT>You know, despite the harsh feelings around here about Helion and the Artifact ban, it doesn’t make sense that they’re trying to get this under government control just for a few more credits. Before my Helion contact was reassigned, I heard of “vast fields of impounded Artifacts” in Zone 21 and learned that the Artifacts are being carefully examined by “special personnel.” It sounds more like they’re looking for something specific and they wanted some place very private to look for it. This expanded impound will just give them more to sift through.</TEXT><PARA/><POP/></RDL>'''
470 = '''<RDL><PUSH/><TEXT>I don’t believe it. It sounds as if the Governor actually intends to meet with that Dornmark animal! What makes him think that he won’t be arrested once he sets foot in Dornmark space? I hear the Chancellor is so paranoid that he’s sequestered himself in a fortified room and surrounded himself with guards, allowing only his inner circle inside. It’s madness for the Governor to undertake this mission.</TEXT><PARA/><POP/></RDL>'''
471 = '''<RDL><PUSH/><TEXT>I hear that the Chancellor has a group of psi-gifted advisors who are now guarding him against any possible danger. They’re constantly scouring the minds of those around him and reporting back! Anyone who is even remotely negative towards him is taken away for “conditioning.” They’re never quite the same after they return.</TEXT><PARA/><TEXT>[kw1]What does this mean?</TEXT><PARA/><TEXT>[/af2]Psi: It’s short for psionics. It’s not unlike ESP sensitivity or even telekinetic ability.</TEXT><PARA/><POP/></RDL>'''
472 = '''<RDL><PUSH/><TEXT>I heard from the palace staff that even though the Shogun did agree to support the artifact ban, he’s not taking any kind of immediate action. President Jacobi dangled it in front of us like a carrot in return for their support. I am sure Vespera was treated the same way…Jacobi and Niemann are cut from the same cloth.</TEXT><PARA/><POP/></RDL>'''
473 = '''<RDL><PUSH/><TEXT>The Governor and the Chancellor are meeting in absolute seclusion! No one has gone in or out since they sat down. Tekagi’s guards have refused to sleep or eat until he finishes — they just stand there at the door, eye to eye with the Chancellor’s guards.</TEXT><PARA/><POP/></RDL>'''
474 = '''<RDL><PUSH/><TEXT>You can tell from the news that our people were treated horribly. Dornmark has no shame. Most of them were government workers or corporate employees — they’re going to have to spend a long time being reoriented after what they’ve suffered. Considering their status, I’m sure Intel is very interested in knowing what Dornmark may have tried to learn from them…</TEXT><PARA/><POP/></RDL>'''
475 = '''<RDL><PUSH/><TEXT>Rumors about The Order are starting to circulate again. I hear the Shogun has increased the resources devoted to investigating them and doubled the number of Imperial Guards around him and Governor Tekagi. The strange thing is, I haven’t heard of The Order operating anywhere near Orsena, let alone threatening the government. Still, they’re probably right to be cautious now that things will be settling down again.</TEXT><PARA/><POP/></RDL>'''
476 = '''<RDL><PUSH/><TEXT>Have you heard? It’s war! The Chancellor has double-crossed us! He’s continuing to mobilize forces and has blacked out all news and information from Dornmark. We can’t get anything in or out — especially from or to any of our intelligence sources inside the colonies. We’re blind.</TEXT><PARA/><POP/></RDL>'''
477 = '''<RDL><PUSH/><TEXT>Many Dornmark citizens here are mystified by what’s happened…no one thought it could go this far, that the Chancellor would really provoke a full out war. And now that all communication with Dornmark has been cut off, our people still inside are more alone than ever before — in what’s become hostile territory.</TEXT><PARA/><POP/></RDL>'''
478 = '''<RDL><PUSH/><TEXT>I’ve just heard that the LSF’s Bonnerille has been missing for days. Nobody in the chain of command in Helion knows where he is and nobody’s heard from him. Something’s happened to him. Maybe the Order has finally struck down their biggest adversary.</TEXT><PARA/><POP/></RDL>'''
479 = '''<RDL><PUSH/><TEXT>I hear that Vespera is playing right into the Chancellor’s hand — he knows how stratified the social structure is there. For some time he’s been seeding unrest in the working class and now he’s turning up the heat with the threat of attack. Just the specter of war is all that it will take for the system to start breaking down. Under the right circumstances, he might take Vespera and her Border World holdings without even firing a shot.</TEXT><PARA/><POP/></RDL>'''
480 = '''<RDL><PUSH/><TEXT>I heard a bizarre rumor about Vespera. They say some sort of unmarked “mystery ships” were responsible for taking out a transport loaded with confiscated Artifacts near Leeds. Vespera intelligence is working on identifying them, but they seem to think they might have been from Dornmark.</TEXT><PARA/><POP/></RDL>'''
481 = '''<RDL><PUSH/><TEXT>I hear that in some of the colonies people have taken to rioting in the streets and even attacking Dornmarkers. Look what the Chancellor has brought down on his people — all of his people.</TEXT><PARA/><POP/></RDL>'''
482 = '''<RDL><PUSH/><TEXT>My brother just returned from a trading run in Helion, and he says things are worse than we’d thought — the President is trying to maintain power over the colony, while it appears several heads of state and their military units are dissenting and openly challenging her.</TEXT><PARA/><POP/></RDL>'''
483 = '''<RDL><PUSH/><TEXT>Look, you didn’t hear this from me, but I think the Chancellor has gone mad. He’s openly attacking members of his own family, questioning their loyalty, and attempting to root out a traitor who none of us believe really exists.</TEXT><PARA/><POP/></RDL>'''
484 = '''<RDL><PUSH/><TEXT>You know, it wasn’t always this way…something’s happened to us. Dornmark used to be a noble place — full of culture and heritage. Now, it seems like all you hear about is war and violence. If I were you, I’d leave here as quickly as you can.</TEXT><PARA/><POP/></RDL>'''
485 = '''<RDL><PUSH/><TEXT>I’ve heard the military police are questioning even loyal Dornmark scientists and support personnel about some kind of theft… from a government research lab, I think it was. Probably those damn Orsena again. They have been stealing from us for years.</TEXT><PARA/><POP/></RDL>'''
486 = '''<RDL><PUSH/><TEXT>I’ve heard that Helion has developed bombs that can turn a planet molten in a matter of minutes. They’ve been doing all sorts of illegal weapons research in that Zone 21 place of theirs. The Chancellor says they intend to use these weapons against us — they’re no better than The Order. We’ve got to stop them… Kill them before they can kill us, right?</TEXT><PARA/><POP/></RDL>'''
487 = '''<RDL><PUSH/><TEXT>There is probably a military coup going on in Helion right now, though no one will admit it. I think Jacobi is quite a strong woman, but, judging by the evidence, her dissenters in the military probably had her killed.</TEXT><PARA/><POP/></RDL>'''
488 = '''<RDL><PUSH/><TEXT>Helion is in the hands of the navy, Vespera is in disarray, the Dornmark Chancellor has gone mad, and now Orsena is warming up the nukes. This has been the Veilborn’ plan from day one — full-scale war in the colonies. And now it looks like it’s going to happen. If all that firepower is unleashed, I don’t know if there’ll be anyone left standing — even if we beat the Veilborn.</TEXT><PARA/><POP/></RDL>'''
489 = '''<RDL><PUSH/><TEXT>There is probably a military coup going on in Helion right now, though no one will admit it. I think Jacobi is quite a strong woman, but, judging by the evidence, her dissenters in the military probably had her killed.</TEXT><PARA/><POP/></RDL>'''
490 = '''<RDL><PUSH/><TEXT>Bundschuh rebels report that they’ve destroyed a potentially very dangerous weapon in the Frankfurt system. Reports are sketchy, but rumor has it that they’ve destroyed a new prototype for a Veilborn battleship.</TEXT><PARA/><POP/></RDL>'''
