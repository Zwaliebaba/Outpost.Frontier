132 = '''<RDL><PUSH/><TEXT>The IMG uses Positron-based shields, so any kind of Tachyon- or Neutron- based weapons you might have won’t work well against them. I’d swap them out and buy something else.</TEXT><PARA/><POP/></RDL>'''
133 = '''<RDL><PUSH/><TEXT>Look, if you ever find yourself being tracked by Bounty Hunters and have to engage them, don’t bother using your Plasma- or Particle-based weapons. Bounty Hunters tend to use Molecular-based shields, and those weapons just don’t work well against them.</TEXT><PARA/><POP/></RDL>'''
134 = '''<RDL><PUSH/><TEXT>Although the Bounty Hunter Laser has a very long range, it comes at a price. The Laser drains batteries very quickly, so most Hunters have to use them sparingly in battle.</TEXT><PARA/><POP/></RDL>'''
135 = '''<RDL><PUSH/><TEXT>Even though all Missiles have tracking abilities, it’s the Homing Missiles that are the most maneuverable — and therefore, the hardest to avoid.</TEXT><PARA/><POP/></RDL>'''
136 = '''<RDL><PUSH/><TEXT>Homing Missiles are more maneuverable, but they don’t often do as much damage as the Standard Missile class.</TEXT><PARA/><POP/></RDL>'''
137 = '''<RDL><PUSH/><TEXT>EMP Missiles are great for taking down shields, but they are ineffective on ship hulls.</TEXT><PARA/><POP/></RDL>'''
138 = '''<RDL><PUSH/><TEXT>You can’t mount Torpedoes on a Light Fighter, but you can easily carry a Cruise Disruptor, which can be tactically devastating in its own right.</TEXT><PARA/><POP/></RDL>'''
139 = '''<RDL><PUSH/><TEXT>If you want to take out Zoners, don’t bother using Plasma- or Particle- based weapons. The Zoner Molecular-based shields are very effective against those weapon classes.</TEXT><PARA/><POP/></RDL>'''
140 = '''<RDL><PUSH/><TEXT>Your survival depends on knowing how to use the right ordnance for the right job. Torpedoes are only truly effective against battleships and stations; all other ships can easily outrun them.</TEXT><PARA/><POP/></RDL>'''
141 = '''<RDL><PUSH/><TEXT>Sometimes it pays to plan ahead. If you were to mount two Missile Launchers on your ship, you’d probably stand a better chance of hitting an enemy who’s launching countermeasures.</TEXT><PARA/><POP/></RDL>'''
142 = '''<RDL><PUSH/><TEXT>A Cruise Disruptor Missile is simply a small stand-alone cruise engine with a guidance system and an electrostatic warhead. That’s how they travel so fast.</TEXT><PARA/><POP/></RDL>'''
143 = '''<RDL><PUSH/><TEXT>If you hit a target with an EMP Missile when its shields are down, you will drain its powerplant and eventually its guns.</TEXT><PARA/><POP/></RDL>'''
144 = '''<RDL><PUSH/><TEXT>Standard Mines can track a target to some degree, but not nearly as well as Homing Mines. It could make a difference out there.</TEXT><PARA/><POP/></RDL>'''
145 = '''<RDL><PUSH/><TEXT>Laser-based weapons may have the highest refire rate, but they offer the lowest amount of damage per shot. If you want to hit harder, try a different ordnance.</TEXT><PARA/><POP/></RDL>'''
146 = '''<RDL><PUSH/><TEXT>Although Plasma-based weapons do the most damage, it’s often hard to hit the target because they’re so slow.</TEXT><PARA/><POP/></RDL>'''
147 = '''<RDL><PUSH/><TEXT>Neutron-based weapons may be the most energy efficient, but they don’t really have much of a range.</TEXT><PARA/><POP/></RDL>'''
148 = '''<RDL><PUSH/><TEXT>Pulse-based weapons drain an enemy’s shields very quickly. However, they do very little damage to ship hulls.</TEXT><PARA/><POP/></RDL>'''
149 = '''<RDL><PUSH/><TEXT>If you find yourself in a combat situation and you’re using Lasers, they will have a reduced affect against Graviton-based shields. You’ll want to switch to another weapon.</TEXT><PARA/><POP/></RDL>'''
150 = '''<RDL><PUSH/><TEXT>Graviton-based shields provide good protection against Laser-, Photon-, and Pulse-based weapons.</TEXT><PARA/><POP/></RDL>'''
151 = '''<RDL><PUSH/><TEXT>Plasma-based weapons work well against Positron-based shields, but they are most effective on Graviton-based shields.</TEXT><PARA/><POP/></RDL>'''
152 = '''<RDL><PUSH/><TEXT>If you’re looking to outfit your ship with good shields, keep in mind that Molecular-based shields are the best protection against both Tachyon- and Neutron-based weapons. They just might save your life.</TEXT><PARA/><POP/></RDL>'''
153 = '''<RDL><PUSH/><TEXT>The Houses and larger factions have invested heavily in creating multiple weapons that are effective against a given type of shield. Usually there are two different types of weapons available for the task at hand.</TEXT><PARA/><POP/></RDL>'''
154 = '''<RDL><PUSH/><TEXT>If you’re going to take on Ashbound, you should be outfitted with a Positron-based shield, which works well against their energy weapons.</TEXT><PARA/><POP/></RDL>'''
155 = '''<RDL><PUSH/><TEXT>If you’re heading into Xeno territory, buy a Molecular-based shield. It works the best against their Particle-based weapons.</TEXT><PARA/><POP/></RDL>'''
156 = '''<RDL><PUSH/><TEXT>All shields are rated comparably for explosive, concussive, or shrapnel damage. The distinguishing factor is how they deal with the different types of Energy-based weapons.</TEXT><PARA/><POP/></RDL>'''
157 = '''<RDL><PUSH/><TEXT>Beware of Pulse-based weapons in combat encounters, as they can quickly drain most shield types. A Graviton-based shield works the best in this difficult situation.</TEXT><PARA/><POP/></RDL>'''
158 = '''<RDL><PUSH/><TEXT>The Bounty Hunters’ Lasers have the longest range of any faction — one of their technical innovations that make the Guild ships so formidable in combat.</TEXT><PARA/><POP/></RDL>'''
159 = '''<RDL><PUSH/><TEXT>Beware that similar weapon technologies used by different factions can have varying strengths. The Ashbound have made special modifications so that their weapons tend to do more damage.</TEXT><PARA/><POP/></RDL>'''
160 = '''<RDL><PUSH/><TEXT>If you run up against someone using Graviton-based shields, break out any of the Particle-based weapons. Those tend to work the best.</TEXT><PARA/><POP/></RDL>'''
161 = '''<RDL><PUSH/><TEXT>Tachyon-based weapons are the longest range class. If you want that “extra reach” advantage, Tachyon is the way to go.</TEXT><PARA/><POP/></RDL>'''
162 = '''<RDL><PUSH/><TEXT>Plasma-based weapons, though powerful, discharge relatively slow-moving bolts. Use them at short range for best effect.</TEXT><PARA/><POP/></RDL>'''
163 = '''<RDL><PUSH/><TEXT>If you come into contact with an enemy using Plasma-based weapons, try to keep your distance. The powerful Plasma bolts are slow-moving and you can probably avoid them, given enough advance warning.</TEXT><PARA/><POP/></RDL>'''
164 = '''<RDL><PUSH/><TEXT>If you’re looking for a weapon that packs both a high refire rate and high damage, try going with a Photon-based variety. Remember, they do use a lot of energy.</TEXT><PARA/><POP/></RDL>'''
165 = '''<RDL><PUSH/><TEXT>Particle-based weapons may have similar capabilities as Plasma-based weapons, but they use much more energy to increase their refire rate.</TEXT><PARA/><POP/></RDL>'''
166 = '''<RDL><PUSH/><TEXT>Don’t bother with Molecular-based shields in Orsena space. Even though they’re a good general-purpose shield, they probably won’t work well against Orsena weapons.</TEXT><PARA/><POP/></RDL>'''
167 = '''<RDL><PUSH/><TEXT>If you encounter an enemy using a Molecular-based shield and all you’ve got are Particle-based weapons, run for it.</TEXT><PARA/><POP/></RDL>'''
