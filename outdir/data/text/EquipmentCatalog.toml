2002 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>J63 "Javelin" Missile Launcher</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>The Javelin Missile Launcher’s main attribute is its stalwart reliability, delivering a punishing payload accurately and effectively. This and its relatively inexpensive cost make the Javelin a welcome addition to any arsenal.</TEXT><PARA/><PARA/><TEXT>* Requires Javelin Missile.</TEXT><PARA/><PARA/><POP/></RDL>'''
2003 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>J63 "Javelin" Missile Launcher</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>The Javelin Missile Launcher’s main attribute is its stalwart reliability, delivering a punishing payload accurately and effectively. This and its relatively inexpensive cost make the Javelin a welcome addition to any arsenal.</TEXT><PARA/><PARA/><TEXT>* Requires Javelin Missile.</TEXT><PARA/><PARA/><POP/></RDL>'''
2004 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>S-2 "Slingshot" Missile Launcher</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Based on the original Javelin design, the Slingshot Missile Launcher delivers more firepower in the same compact casing. Though it is slightly more expensive, the reformulated payload of its missiles provides a significant advantage in all offensive and defensive situations.</TEXT><PARA/><PARA/><TEXT>* Requires Slingshot Missile.</TEXT><PARA/><PARA/><POP/></RDL>'''
2005 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>C82b "Catapult" Missile Launcher</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Designed to deliver the maximum damage to the target, the Catapult Missile Launcher has distinguished itself repeatedly in armed combat situations. With its missiles having greater payload capacity and more sophisticated flight dynamics, this launcher is considered by many to be the premiere in ballistic weaponry.</TEXT><PARA/><PARA/><TEXT>* Requires Catapult Missile.</TEXT><PARA/><PARA/><POP/></RDL>'''
2006 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>T4-2 "Lancer" Missile Launcher</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>In terms of cost versus damage potential, the Lancer Missile Launcher is considered by many to be “the weapon of choice”. Though its missiles have only moderate tracking abilities, this perceived drawback is more than overshadowed by its enormous payload capacity.</TEXT><PARA/><PARA/><TEXT>* Requires Lancer Missile.</TEXT><PARA/><PARA/><POP/></RDL>'''
2007 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>C242 "Cannonball" Missile Launcher</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Delivering the most powerful destructive potential available in this category, the Cannonball’s damage rating is only surpassed by that of a torpedo. Originally formulated from demolitions research in asteroid mining, the Cannonball is now a standard loadout for military assault craft.</TEXT><PARA/><PARA/><TEXT>* Requires Cannonball Missile.</TEXT><PARA/><PARA/><POP/></RDL>'''
2008 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>X19 "Stalker" Homing Missile Launcher</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Developed to recognize and better track the evasive actions of target ships, the Stalker provides a remarkable advantage for its relative cost. Though delivering less of an explosive payload than many of its counterparts, this missile’s strength lies in its deadly accuracy and dogged relentlessness in the field.</TEXT><PARA/><PARA/><TEXT>* Requires Stalker Missile.</TEXT><PARA/><PARA/><POP/></RDL>'''
2009 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>X22 "Windstalker" Homing Missile Launcher</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Developed from the original design of the Stalker series, the Windstalker launcher’s missile carries a larger payload yet does not sacrifice any of the necessary maneuverability. The Windstalker is considered by many to be the best choice for its ability to deliver additional power without sacrificing accuracy.</TEXT><PARA/><PARA/><TEXT>* Requires Windstalker Missile.</TEXT><PARA/><PARA/><POP/></RDL>'''
2010 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>X27 "Moonstalker" Homing Missile Launcher</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Providing superior firepower with the renowned maneuverability and accuracy of the Stalker series, the Moonstalker continues the rich tradition. This launcher delivers a projectile so accurate and powerful that it is supremely hailed as the premiere homing missile available for its relative price.</TEXT><PARA/><PARA/><TEXT>* Requires Moonstalker Missile.</TEXT><PARA/><PARA/><POP/></RDL>'''
2011 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>X33 "Sunstalker" Homing Missile Launcher</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>One of the most advanced models available, the Sunstalker makes good on the promises of reliability and accuracy set down by the Stalker series of homing missiles. This launcher is considered by some to be the “only one to take into the Border Worlds” and therefore occupies a special place in their arsenals.</TEXT><PARA/><PARA/><TEXT>* Requires Sunstalker Missile.</TEXT><PARA/><PARA/><POP/></RDL>'''
2012 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>X45 "Firestalker" Homing Missile Launcher</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Considered by friend and foe alike to be the ultimate in homing missile technology, the Firestalker simply delivers the best homing missile available. With maximum range, tracking abilities and destructive potential, this weapon is hailed as the king of all homing weapons and has even been criticized by some liberals as being “too cruel” to use in combat.</TEXT><PARA/><PARA/><TEXT>* Requires Firestalker Missile.</TEXT><PARA/><PARA/><POP/></RDL>'''
2013 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>L-EMP-01 "Eraser" EMP Missile Launcher</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Delivering an EMP (Electromagnetic Pulse) that disrupts the target’s shields and powerplant and effectively crippling its defenses, the Eraser distinguishes itself as being the perfect weapon for a combined assault, following up with a Javelin or other missile of choice.</TEXT><PARA/><PARA/><TEXT>* Requires Eraser Missile.</TEXT><PARA/><PARA/><POP/></RDL>'''
2014 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>M-EMP-01 "Sweeper" EMP Missile Launcher</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Based on the same technology as the Eraser, the Sweeper is designed with a greater power output capacity and therefore delivers a more sizeable EMP blast to the target’s shields. In terms of cost, many consider this to be an exceptionally valuable piece of necessary armament.</TEXT><PARA/><PARA/><TEXT>* Requires Sweeper Missile.</TEXT><PARA/><PARA/><POP/></RDL>'''
2015 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>N-EMP-01 "Neutralizer" EMP Missile Launcher</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Second to only one other missile in its class, the Neutralizer releases an EMP on impact that is so devastating that it renders all but the strongest adversaries helpless within a couple of sequential hits.</TEXT><PARA/><PARA/><TEXT>* Requires Neutralizer Missile.</TEXT><PARA/><PARA/><POP/></RDL>'''
2016 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>O-EMP-01 "Paralyzer" EMP Missile Launcher</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Based on an entirely new approach, the Paralyzer discharges the most powerful EMP on the market. Research shows that when used in combat, the Paralyzer can completely disrupt most shields in just one blast. Again, this weapon serves as a very useful precursor to a follow-up attack, however further hits with the Paralyzer will also disable a target’s powerplant and guns.</TEXT><PARA/><PARA/><TEXT>* Requires Paralyzer Missile.</TEXT><PARA/><PARA/><POP/></RDL>'''
2017 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>CD88a "Wasp" Cruise Disruptor Missile Launcher</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Originally designed to help local law enforcement stop fleeing pirates, the Wasp uses a complex guidance and deployment system to effectively disrupt a target’s ability to maintain cruise velocity.</TEXT><PARA/><PARA/><TEXT>* Requires Wasp Missile.</TEXT><PARA/><PARA/><POP/></RDL>'''
2018 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>CD89b "Hornet" Cruise Disruptor Missile Launcher</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Based on the design of the Wasp, the Hornet makes use of several key improvements and is largely considered the fastest missile available today. As with the Wasp, the Hornet has little or no conventional effect in combat, however it is extremely effective against ships that have either engaged their cruise engines or are about to do so. Targets that endure an attack from the Hornet remain unable to engage their cruise engines until the field effects that this very valuable piece of weaponry produces wear off.</TEXT><PARA/><PARA/><TEXT>* Requires Hornet Missile.</TEXT><PARA/><PARA/><POP/></RDL>'''
2019 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>T-92 "Starkiller" Torpedo Launcher</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>The Starkiller launcher deploys a devastatingly powerful torpedo that has enough destructive potential to severely damage a small station, and adversely affect any small craft caught in the wake of its blast radius. Despite its power however, the Starkiller is a slower projectile and so is considered by many to be most effective against equally as slow or stationary objects.</TEXT><PARA/><PARA/><TEXT>* Requires Starkiller Torpedo.</TEXT><PARA/><PARA/><POP/></RDL>'''
2020 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>T-96 "Sunslayer" Torpedo Launcher</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Spawned from the weapon labs of the Military industrial complex, the Sunslayer is hands down the most destructive weapon in Sirius. Though using the same guidance system and components as the Starkiller, the Sunslayer’s massive payload dwarfs its counterpart’s — making it capable of delivering extreme damage to any target it comes in contact with.</TEXT><PARA/><PARA/><TEXT>* Requires Sunslayer Torpedo.</TEXT><PARA/><PARA/><POP/></RDL>'''
2021 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>M433 "Drone" Mine Dropper</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>The Drone is simple and effective, detonating and eviscerating its targets within a respectable kill radius. Given its relatively low cost and availability throughout Sirius, this mine dropper is by and large considered to be an old and faithful standby weapon.</TEXT><PARA/><PARA/><TEXT>* Requires Drone Mine.</TEXT><PARA/><PARA/><POP/></RDL>'''
2022 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>M468 "Wardog" Mine Dropper</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Though similar to the Drone in most respects, the step up in explosive payload and destructive capacity make the Wardog worth the extra cost.</TEXT><PARA/><PARA/><TEXT>* Requires Wardog Mine.</TEXT><PARA/><PARA/><POP/></RDL>'''
2023 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>M472 "Tadpole" Mine Dropper</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>The Tadpole’s revolutionary explosive mixture and shielded detonation components make it one of the most affordable and reliable mines of this category.</TEXT><PARA/><PARA/><TEXT>* Requires Tadpole Mine.</TEXT><PARA/><PARA/><POP/></RDL>'''
2024 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>M479 "Swatter" Mine Dropper</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>With more payload and the addition of no less than seventeen layers of hull-penetrating carbonized shrapnel, the Swatter is considered by most to be one of the deadliest mines available in Sirius.</TEXT><PARA/><PARA/><TEXT>* Requires Swatter Mine.</TEXT><PARA/><PARA/><POP/></RDL>'''
2025 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>M485 "Screamer" Mine Dropper</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Based on a new anti-ship technology, the Screamer mine dropper releases a deadly wafer that is hard to see, hard to avoid and even harder to survive. Tests in the field and actual combat records demonstrate this weapon’s repeated superiority and effectiveness.</TEXT><PARA/><PARA/><TEXT>* Requires Screamer Mine.</TEXT><PARA/><PARA/><POP/></RDL>'''
2026 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>HM-a "Seeker" Homing Mine Dropper</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Despite the fact that all mines can draw closer to their targets, the Seeker mine has advanced “seeking abilities” that increase its likelihood to deliver its maximum impact. There is a decrease in explosive payload as compared to traditional mines, however the improvement in the drop-to-hit ratio has made this a very popular secondary weapon.</TEXT><PARA/><PARA/><TEXT>* Requires Seeker Mine.</TEXT><PARA/><PARA/><POP/></RDL>'''
2027 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>HM-b "Razor" Homing Mine Dropper</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Though quite similar to the Seeker in theory, the Razor enjoys significant improvements in maneuverability and payload capacity. The Razor is probably the most widely used homing mine in existence today.</TEXT><PARA/><PARA/><TEXT>* Requires Razor Mine.</TEXT><PARA/><PARA/><POP/></RDL>'''
2028 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>HM-d "Driller" Homing Mine Dropper</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Not being satisfied with the “seeking” and damage capacities of the Razor, the Driller was developed. This mine is more powerful in every way than the Razor and yet is still affordable, making it the accepted “gold standard” in the industry.</TEXT><PARA/><PARA/><TEXT>* Requires Driller Mine.</TEXT><PARA/><PARA/><POP/></RDL>'''
2029 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>HM-g "Cutter" Homing Mine Dropper</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>Based on an entirely new formula, the destructive capacity of the Cutter rivals that of any other standard mine. In addition to this, the “seeking technology” behind the Cutter has been entirely re-engineered, enabling it to now deliver a larger, more accurate and deadlier blow to its target.</TEXT><PARA/><PARA/><TEXT>* Requires Cutter Mine.</TEXT><PARA/><PARA/><POP/></RDL>'''
2030 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>HM-i "Ripper" Homing Mine Dropper</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>The Ripper combines the most advanced “seeking technology” available along with an enormous charge and array of anti-ship elements to embody one of the most feared weapons in any arsenal. The Ripper is quite possibly the nastiest and most lethal support weapon in Sirius.</TEXT><PARA/><PARA/><TEXT>* Requires Ripper Mine.</TEXT><PARA/><PARA/><POP/></RDL>'''
2031 = '''<RDL><PUSH/><JUST loc="c"/><TRA bold="true"/><TEXT>"Barrager" Photon Cannon Mk I</TEXT><TRA bold="false"/><PARA/><JUST loc="l"/><PARA/><TEXT>This is a photon-based weapon which, though providing a high refire rate, requires enormous amounts of energy to deliver a significant damage output. This weapon is most effective against positron shields, and weakest against graviton shields.</TEXT><PARA/><PARA/><POP/></RDL>'''
