# DialogueText: text module 2, the high 16 bits of its text IDs (fact F3).
# Keys are the 16-bit IDs inside the module. [cards] hold rich-text cards
# in <RDL> markup; the catalog build stores them as UTF-16LE with a
# byte-order mark. See README.md.

[cards]
56 = '''<RDL><PUSH/><TEXT>I enjoy watching junkies in the last stages of the Cardamine addiction; they sit there oblivious to their surroundings, staring into space. They walk through golden palaces in their minds while in reality their bodies are rotting away in whatever hovel they found as shelter for their last high.</TEXT><PARA/><POP/></RDL>'''
57 = '''<RDL><PUSH/><TEXT>We are in the heart of Helion, right in the center of all Sirius, far from our homeland. This is the place we have to pump the majority of our drug shipments into. Since the Libertonians have the most money and the most people, they have the most junkies. If we could find a faster route into Helion we could increase the amount of Cardamine that gets here.</TEXT><PARA/><POP/></RDL>'''
58 = '''<RDL><PUSH/><TEXT>We smuggle stolen Gold and Diamonds to Rochester from here. It’s a tough run that we usually only give to our most senior smugglers with the best ships.</TEXT><PARA/><POP/></RDL>'''
59 = '''<RDL><PUSH/><TEXT>We’re Side Arm central. We ship them to Beaumont, Alcatraz, and Dawson from here — pretty much the entire Rogue world of bases.</TEXT><PARA/><POP/></RDL>'''
60 = '''<RDL><PUSH/><TEXT>The Cardamine run to Rochester is kind of like your Rogue graduation test. If you make it, you’re ready to take on the Independent Worlds. Navy’s waiting by West Point for smugglers — so is the LPI in the north. Of course, the Xenos are also a wildcard.</TEXT><PARA/><POP/></RDL>'''
61 = '''<RDL><PUSH/><TEXT>There’s always traffic headed to and from Ember Pier and Newark station, plus Whiteharbor and Breakwater. You’ll encounter attack squadrons all over Cinderwell space, and they all come back here. This base is a place for us to refit our ships, lay low between sorties, and enjoy Cardamine when we’re not popping freighters.</TEXT><PARA/><POP/></RDL>'''
62 = '''<RDL><PUSH/><TEXT>We get most of our supplies from Beaumont because it’s actually safer to hit the Jump Hole into Texas. The Junker base is right on the other side of the Jump Hole in a debris field, plus we don’t have to leave the cover of the Badlands on our side. It’s all about the cover; we try and expose ourselves as little as possible.</TEXT><PARA/><POP/></RDL>'''
63 = '''<RDL><PUSH/><TEXT>Last week a buddy of mine got his ship cracked open by a Helion military patrol. He hung around a pirated ship too long trying to get all the salvage he could. Sometimes it’s the greed that kills you. When you hit a shipment, grab what you can, then bury the throttle and get out of there.</TEXT><PARA/><POP/></RDL>'''
64 = '''<RDL><PUSH/><TEXT>We take incoming shipments of Cardamine from Ashbound and make the suicide run across the Cinderwell system to Rochester. Many a shipment’s been lost en route. Those Junkers just don’t get how hard it is to dodge all those Bounty Hunters and the LPI.</TEXT><PARA/><POP/></RDL>'''
65 = '''<RDL><PUSH/><TEXT>This is the home base of the Helion Rogues. Sure, we got a base in California, but this is the big leagues. Everyone comes to Cinderwell, and we’re here to make sure they leave something behind before they go. Being a pirate is better than working the Fertilizer plants in Texas. So what if we take more risk? Prison isn’t an unfamiliar thing to a Rogue.</TEXT><PARA/><POP/></RDL>'''
66 = '''<RDL><PUSH/><TEXT>I just got out of Sugarland; they had me making toys in that hellhole. It’s messed up, we get locked away for a stretch and they force us to earn them money making crap for families and kids. If I ever see another one of them Space Jumper Happy Bears I’m gonna blow a hole in its forehead.</TEXT><PARA/><POP/></RDL>'''
67 = '''<RDL><PUSH/><TEXT>Rochester ships Diamonds, Niobium, and Gold to Whiteharbor. Most of it is stolen property that we are selling back to the very people who owned it in the first place.</TEXT><PARA/><POP/></RDL>'''
68 = '''<RDL><PUSH/><TEXT>Rogues come in here and pick up Side Arm shipments for their Badlands base. It’s a long haul around the system to safety for them.</TEXT><PARA/><POP/></RDL>'''
69 = '''<RDL><PUSH/><TEXT>We ship Cardamine and Artifacts to Whiteharbor — one of the riskiest runs for a Junker there is.</TEXT><PARA/><POP/></RDL>'''
70 = '''<RDL><PUSH/><TEXT>We get our Artifacts from Leiden, up in the Galileo system. The Hogosha hand them over to the Rogues there.</TEXT><PARA/><POP/></RDL>'''
71 = '''<RDL><PUSH/><TEXT>If the heat from Helion Police ever gets too bad, we just serve up some petty criminal or deadbeat hauling some illegal cargo. LPI doesn’t really care as long as it looks like they are cracking down on criminals; an arrest here and there with some confiscated contraband usually gets them off our backs for a while.</TEXT><PARA/><POP/></RDL>'''
72 = '''<RDL><PUSH/><TEXT>The Cinderwell Debris Fields give us plenty of cover to operate in; we’ve pulled most of the scrap and salvage from Jersey, but we still find plenty of goodies in the Breakwater and Detroit Fields. You might run across an occasional fragged ship floating in there too. Those are the guys who crossed us.</TEXT><PARA/><POP/></RDL>'''
73 = '''<RDL><PUSH/><TEXT>We like to get along with everybody around here; the more the merrier I always say. Of course, that only counts if “the more” means more people with money. The more criminals that need us means we have our hands in all that many more pockets, and that’s really what we want.</TEXT><PARA/><POP/></RDL>'''
74 = '''<RDL><PUSH/><TEXT>Operating from here or our base in the Badlands, you’ll find Helion Rogues pirating the Trade Lanes and hitting the storage depots near the various commercial stations in this system.</TEXT><PARA/><POP/></RDL>'''
75 = '''<RDL><PUSH/><TEXT>California is one of the richest systems in Sirius. On our way back home we’ll hit shipments cruising through the Trade Lanes here; we have plenty of cover in the ice fields that populate the system. They cover us as we smuggle our way in and steal our way back out again. I love California.</TEXT><PARA/><POP/></RDL>'''
76 = '''<RDL><PUSH/><TEXT>The Helion battleship </TEXT><TRA italic="true"/><TEXT>Yukon</TEXT><TRA italic="false"/><TEXT>  might scare a lot of thieves and petty criminals, but it doesn’t bother the Ashbound. We can lose her patrols in the ice fields as we cross the system.</TEXT><PARA/><POP/></RDL>'''
77 = '''<RDL><PUSH/><TEXT>We ship Gold stolen by the Ashbound and Lane Hackers in the Barrier on to Buffalo. It eventually gets sold by the Junkers planetside — a nice, clean operation.</TEXT><PARA/><POP/></RDL>'''
78 = '''<RDL><PUSH/><TEXT>We supply Side Arms to the Rogue base out in the Barrier. The Ashbound also buy from us. Nothing cheaper than Detroit Side Arms.</TEXT><PARA/><POP/></RDL>'''
79 = '''<RDL><PUSH/><TEXT>Alcatraz ships Cardamine to Buffalo and Beaumont. I’d like to make that run myself one day, but I’m not good enough yet. The Ashbound tend to get angry when you blow one of their Cardamine loads.</TEXT><PARA/><POP/></RDL>'''
80 = '''<RDL><PUSH/><TEXT>California is a good home to the Rogues. First off, there’s ice asteroid fields all over the system, which makes for good cover when traveling through the system hauling illegal goodies. Our base is hidden in the same asteroid field that hides the Jump Hole to Texas, and from Texas you can jump into Cinderwell space, no problem.</TEXT><PARA/><POP/></RDL>'''
81 = '''<RDL><PUSH/><TEXT>Our boys here in Alcatraz like to “tax” all the goods moving through the Trade Lanes between Vespera and Helion. Los Angeles is filled with those snobby successful types who buy loads of Luxury Goods from Whiteharbor. It ain’t right that they get all the good things in life just ’cuz they were born with money, so we take some of it off their hands.</TEXT><PARA/><POP/></RDL>'''
82 = '''<RDL><PUSH/><TEXT>You can reach Montezuma in Cortez by running to the Tahoe Ice Cloud on the western edge of the system, where the Jump Hole to Cortez is hidden. The Trade Lane to Magellan travels by the same field, so you might be able to hit a shipment or two on the way.</TEXT><PARA/><POP/></RDL>'''
83 = '''<RDL><PUSH/><TEXT>The Ashbound know we need their Cardamine, and they look down on us for it. I can see it in their eyes, even if they don’t say anything. I don’t like them holding the Cardamine over us, but I need it.</TEXT><PARA/><POP/></RDL>'''
84 = '''<RDL><PUSH/><TEXT>Rogues live life for the day, not for the future. We don’t dwell on the past neither. If I got money in my pocket and some Cardamine stashed, then what do I gotta worry about tomorrow or yesterday for? Besides, I can’t always remember what happened yesterday and I might be dead tomorrow.</TEXT><PARA/><POP/></RDL>'''
85 = '''<RDL><PUSH/><TEXT>There’s been talk of a Helion Rogue who is uniting all of us together. I dunno if it’s true or not, but I’ve heard people say he’s got over 100 kills and more and more Rogue pilots are joining under his command. If I get a chance I’ll join with him. I think he’s in Cinderwell.</TEXT><PARA/><POP/></RDL>'''
86 = '''<RDL><PUSH/><TEXT>We run supply shipments of Side Arms to Nome, our base in Kepler. If you have some extra cargo space, maybe you could earn a few credits.</TEXT><PARA/><POP/></RDL>'''
87 = '''<RDL><PUSH/><TEXT>When the Xenos began, we were just miners who kept getting shafted by Helion. There were fewer and fewer jobs as the years rolled by. Finally, there was nothing left for us, no jobs, not unless you could use a data pad instead of an auto-digger. All our jobs were being done by somebody in Dornmark or Orsena. Well, we decided to take back what had been taken from us.</TEXT><PARA/><POP/></RDL>'''
88 = '''<RDL><PUSH/><TEXT>The Lane Hackers in Galileo are a bunch of pansy rich boys who can’t do their own dirty work. It’s that kind of attitude that has let foreigners come in and take jobs from the Helion working man. At least they use Rogues to do their work for them and not Orsena pirates. That still makes the Rogues the pawns of the rich and lazy. Lane Hackers don’t know what real work is, how hard it is for so many of us to survive.</TEXT><PARA/><POP/></RDL>'''
89 = '''<RDL><PUSH/><TEXT>We might not have the best equipment or ships, but we are a lot better organized than we were. It was getting so bad that LPI almost won and ripped us out of Colorado. But we have a focused agenda now: We lift supplies from Orsena shipping, a little extortion here and there, some salvaging, and we get by. This lets us attack our real enemies — the Junkers in Cinderwell. Once we knock them out of Rochester, we’ll corner the contraband trade in Helion.</TEXT><PARA/><POP/></RDL>'''
90 = '''<RDL><PUSH/><TEXT>Our base in Kepler, Nome, is right next to the Jump Hole to Colorado and borders the Trade Lane that comes in from Shikoku, so we can attack Orsena shipping. Most of our supplies come from the Zoner base in Kepler.</TEXT><PARA/><POP/></RDL>'''
91 = '''<RDL><PUSH/><TEXT>The main drug-smuggling routes cross the eastern part of the Jersey Debris Field, which will be our turf someday. This would let us interdict the drug shipments headed to and from Rochester. If we could control the Helion drug trade, we wouldn’t have to scrape by.</TEXT><PARA/><POP/></RDL>'''
93 = '''<RDL><PUSH/><TEXT>Our legitimate cover business in Texas is mining Scrap Metal from the Texas Debris Fields and shipping it to Sugarland for recycling. We’re providing a useful service to the Helion government.</TEXT><PARA/><POP/></RDL>'''
94 = '''<RDL><PUSH/><TEXT>We bring in some of the stolen Diamonds from Dornmark and sell them on the open market in Houston. No way they can tell where they came from, is there?</TEXT><PARA/><POP/></RDL>'''
95 = '''<RDL><PUSH/><TEXT>We provide a lot of the essential supplies for criminals in California and Cinderwell. It’s just a quick trip through the Holes.</TEXT><PARA/><POP/></RDL>'''
96 = '''<RDL><PUSH/><TEXT>I’ve been poking around these fields for twenty years. Had a few radiation scares. Heard there’s some great loot in those dark clouds, but I’m not going in there. Radiation’s supposed to be lethal to even a decently shielded ship.</TEXT><PARA/><POP/></RDL>'''
97 = '''<RDL><PUSH/><TEXT>Beaumont serves as a criminal supply center for many of the Rogue bases in Helion. Consumer Goods, Pharmaceuticals, H-Fuel, Water, Food, and Oxygen are all shipped to Buffalo, Dawson, and Alcatraz.</TEXT><PARA/><POP/></RDL>'''
98 = '''<RDL><PUSH/><TEXT>The Ashbound stop here on their long Cardamine runs in from the Edge Worlds. I don’t trust them a bit. They don’t like any of us; we’re just pawns to them. One day something bad will happen.</TEXT><PARA/><POP/></RDL>'''
99 = '''<RDL><PUSH/><TEXT>We have a problem here in Texas with the Xenos; those crazy bastards hate everybody. It doesn’t make any sense. If they had dealings with us, we could both profit. But as it is, they run attacks on us. The Junkers could be good friends to them.</TEXT><PARA/><POP/></RDL>'''
100 = '''<RDL><PUSH/><TEXT>The income we get from hauling scrap to the Sugarland from the debris in this system goes into our Xenos account. The Xenos account is the money we use to hire Junker-friendly smugglers and pirates to attack the Xenos and defend us against their attacks. What a waste of money.</TEXT><PARA/><POP/></RDL>'''
101 = '''<RDL><PUSH/><TEXT>The Xenos are a small group and they are poor too. That’s why they have no chance against us right now. Everybody owes the Junkers a favor or two, and we have plenty of money so we can buy protection as well. The problem is that the Xenos keep growing; seems like every third ex-con that walks from Huntsville becomes a Xeno.</TEXT><PARA/><POP/></RDL>'''
102 = '''<RDL><PUSH/><TEXT>This is the farthest south you will find Ashbound in Sirius. We are near the end of the line at Buffalo, which is just on the other side of the Cinderwell Jump Hole in the Badlands.</TEXT><PARA/><POP/></RDL>'''
103 = '''<RDL><PUSH/><TEXT>The Ashbound who get caught hauling in Helion space end up on the Sugarland, so we run occasional raids on the prison transports sending our men into lockup. A lot of Ashbound, once sent to the Huntsville or Sugarland, get killed by Xenos. So LPI decided to put all of us on the Sugarland, and all the Xenos on the Huntsville.</TEXT><PARA/><POP/></RDL>'''
104 = '''<RDL><PUSH/><TEXT>This system is home to a lot of Helion Rogues. Most of us have spent about half our lives on either the Huntsville or Sugarland. I just got off “the Walls” myself a few months ago; I wouldn’t be surprised if I were heading back some time or other. Going back isn’t so bad — it gets to be kinda like home. A lot of my buddies are in there pulling time.</TEXT><PARA/><POP/></RDL>'''
105 = '''<RDL><PUSH/><TEXT>The Rogues can get to Cinderwell through the Jump Hole hidden in the same debris field this base is in. Also, there is a Jump Hole to California in the West Dallas Debris Field, though you have to be careful. Parts of that area are radioactive. There’s another Jump Hole to the Hudson system in the South Dallas Debris Field. That about covers it.</TEXT><PARA/><POP/></RDL>'''
124 = '''<RDL><PUSH/><TEXT>If it’s personal protection you’re looking for, Ageira Technologies has the answer. Try our famous Mk 11 Perforator — a great price and guaranteed to put more holes in your target than necessary. If it’s stopping power you want, you’ll get it with our line of Wide Bore Pocket Cannons. The finest products are available exclusively from Detroit Munitions, just a quick Trade Lane jump away.</TEXT><PARA/><POP/></RDL>'''
125 = '''<RDL><PUSH/><TEXT>We ship Side Arms here to Whiteharbor from Detroit, our munitions plant that serves all of Helion and much of Orsena and Vespera. We don’t usually ship Detroit weaponry to Dornmark because they produce their own, but it doesn’t compare with Detroit Deathware.</TEXT><PARA/><POP/></RDL>'''
126 = '''<RDL><PUSH/><TEXT>Our Detroit munitions plant gets its Water and Oxygen from Whiteharbor. I will make the run myself sometimes. It’s well protected, which makes the trip an easy one.</TEXT><PARA/><POP/></RDL>'''
127 = '''<RDL><PUSH/><TEXT>Bowex ships Gold into Whiteharbor from Larkspur. This is one of the most dangerous runs you can make between Cinderwell and Larkspur. Think about it — you’re hauling Gold, something everybody wants.</TEXT><PARA/><POP/></RDL>'''
128 = '''<RDL><PUSH/><TEXT>Bowex ships Luxury Consumer Goods from here in Whiteharbor to Larkspur. I was hired by Bowex to pilot their freighters, but I’ve been thinking about going into a new line of work. I was almost killed a few days ago when Lane Hackers attacked my ship in the Independent Worlds.</TEXT><PARA/><POP/></RDL>'''
129 = '''<RDL><PUSH/><TEXT>Bowex deals in Luxury Goods. Only the finest products are shipped by Border World Exports. Unfortunately, these are the very items coveted by the villainous Lane Hackers. They attack our shipments in the Independent Worlds of Cortez and Magellan between here and Larkspur.</TEXT><PARA/><POP/></RDL>'''
130 = '''<RDL><PUSH/><TEXT>Cryer fights everyday to push back the tide of nature and prolong the lives of the good people of Helion. That’s why our vessels run twenty-four hours a day delivering much needed Pharmaceuticals to everyone in Sirius space. People are always going to be sick; it’s part of nature’s cycle.</TEXT><PARA/><POP/></RDL>'''
131 = '''<RDL><PUSH/><TEXT>Cryer Pharmaceuticals arrive in Whiteharbor from our primary production facility in Denver. From here they are shipped into California towards Los Angeles. Most of the time we don’t encounter too much difficulty. We fight off the Rogues occasionally, but that just comes with shipping in Helion.</TEXT><PARA/><POP/></RDL>'''
132 = '''<RDL><PUSH/><TEXT>With all that Cryer does to make the people of Sirius healthy and safe it still appalls me to see those poor Cardamine junkies dying in plain view. One day soon Cryer will make a synthetic Cardamine that isn’t addictive or harmful. Cryer is dedicated to a healthy and fun lifestyle that doesn’t reduce worker productivity.</TEXT><PARA/><POP/></RDL>'''
133 = '''<RDL><PUSH/><TEXT>The Construction Machinery you see here in Whiteharbor was supplied by us from our manufacturing plants in Houston. Houston supplies a large portion of Helion’s heavy machinery.</TEXT><PARA/><POP/></RDL>'''
134 = '''<RDL><PUSH/><TEXT>Here in Whiteharbor DSE purchase the supplies necessary to run our Cinderwell bases. We ship Water and Food to Breakwater, and Oxygen to Baltimore. Men die every week protecting shipments of basic supplies. I know the criminals need them too, I just can’t get used to the idea of dying over a shipment of Water.</TEXT><PARA/><POP/></RDL>'''
135 = '''<RDL><PUSH/><TEXT>DSE is an important part of the machinery of Helion power in Sirius, so you will see that we have adequate protection within her space. Unfortunately, many of our Trade Lane and Jump Gate construction projects are found far outside the safety of Helion, where our affairs can often fall victim to pirates and vandals.</TEXT><PARA/><POP/></RDL>'''
136 = '''<RDL><PUSH/><TEXT>In Whiteharbor we purchase Water, Oxygen, Pharmaceuticals, Food, Consumer Goods, and H-Fuel for use at our Rochester base. It’s completely legit — so if you ever want to run supplies for us Junkers without getting your hands dirty, you can.</TEXT><PARA/><POP/></RDL>'''
137 = '''<RDL><PUSH/><TEXT>People like dealing with Junkers, because we always offer a square deal. That’s why we transport so many goods from Rochester, our base in this system. We bring in Gold, Diamonds, Niobium, and Luxury Foods. We don’t ask many questions on where they come from; that’s none of our business.</TEXT><PARA/><POP/></RDL>'''
138 = '''<RDL><PUSH/><TEXT>If you don’t mind working around the law, you can always ship Cardamine or Artifacts from Rochester in the Jersey Debris Fields here into Whiteharbor. If you ever wondered where Whiteharbor gets all her illegal goodies, it’s from us.</TEXT><PARA/><POP/></RDL>'''
139 = '''<RDL><PUSH/><TEXT>If you own a ship you are going to need what we have to sell, that’s right — top-quality Kishiro H-Fuel straight from the refineries of Ogashawa, far away in the Sigma-19 system.</TEXT><PARA/><POP/></RDL>'''
140 = '''<RDL><PUSH/><TEXT>We purchase Luxury Goods here to be delivered to Sablecross and Honshu. There is a large market for excellent products in Orsena. Beauty and opulence are the benefits of being rich.</TEXT><PARA/><POP/></RDL>'''
141 = '''<RDL><PUSH/><TEXT>The Niobium that we get from the IMG in Freeport 6 is brought here to sell. It is a long and dangerous run. We constantly get attacked by the Hogosha in Orsena and then have to deal with the Xenos in Helion.</TEXT><PARA/><POP/></RDL>'''
142 = '''<RDL><PUSH/><TEXT>If you ever have the cash to purchase a Helion Elite Fighter, it will have to come from a Helion Navy base, and having the money to purchase the ship doesn’t mean we will sell it to you. You have to prove that you are loyal to Helion and the way of life she stands for.</TEXT><PARA/><POP/></RDL>'''
143 = '''<RDL><PUSH/><TEXT>Helion Police, Inc., or LPI, doesn’t have the will or the guts it would take to eradicate criminal activity here in Cinderwell. It’s the Navy that patrols the Trade Lanes along the southern edge of Cinderwell; the police won’t even go south of Detroit. Let’s face it: If crime ended so would LPI, and they don’t want that to happen.</TEXT><PARA/><POP/></RDL>'''
144 = '''<RDL><PUSH/><TEXT>The Navy doesn’t have the authority to enter another colony’s space without the permission of the government. That’s why sometimes if you want to catch somebody you have to hire a Bounty Hunter to do it, as unsavory as that is. Usually Bounty Hunters are just as bad as the scum you hire them to capture.</TEXT><PARA/><POP/></RDL>'''
145 = '''<RDL><PUSH/><TEXT>The Ashbound we have encountered in Helion have been on the east side of the Badlands. We work in conjunction with Bounty Hunters to try and halt the Cardamine flowing into Cinderwell. Unfortunately, most infiltrators we’ve dropped into the Badlands have never returned.</TEXT><PARA/><POP/></RDL>'''
146 = '''<RDL><PUSH/><TEXT>The Helion Navy is the most sophisticated and well trained of all the navies in Sirius. Helion’s annual expenditures in the budget for naval and military spending are based upon cost estimates for a scenario in which Helion would be fighting against two other Houses simultaneously.</TEXT><PARA/><POP/></RDL>'''
147 = '''<RDL><PUSH/><TEXT>Zone 21 is restricted to authorized personnel only. I wouldn’t fly my ship too close to that part of space. You might not mean any harm, but the Navy’s not going to wait to see. They are just going to kill you.</TEXT><PARA/><POP/></RDL>'''
148 = '''<RDL><PUSH/><TEXT>The battleship </TEXT><TRA italic="true"/><TEXT>Missouri</TEXT><TRA italic="false"/><TEXT>  runs a patrol along the Trade Lanes between Zone 21 and the Badlands. That’s as dangerous as you are going to get here in Cinderwell — unless you actually fly into the Badlands; then you are just asking to get aced.</TEXT><PARA/><POP/></RDL>'''
149 = '''<RDL><PUSH/><TEXT>The Navy sends patrols into the Badlands, where the criminals are smuggling in a large portion of the contraband that enters the system. We have yet to find the Jump Hole they are using, but when we do the citizens of this system will be a lot safer than they are now.</TEXT><PARA/><POP/></RDL>'''
150 = '''<RDL><PUSH/><TEXT>The LPI 8th patrol wing is assigned to the Detroit Debris Field. There are no criminal bases there that we know of, but it is a well-populated area for Rogues and Junkers. The Detroit Field lies on the west side of the system, just beyond Whiteharbor where they can find cover in the Jersey Debris Fields.</TEXT><PARA/><POP/></RDL>'''
151 = '''<RDL><PUSH/><TEXT>One of the Rogues we arrested just spilled his guts. This guy and two of his wingmen had traveled from the Badlands all the way around Helion space following the debris fields till he reached Baltimore Shipyards. They flew right by one of our patrols and got tagged on their final approach to Baltimore.</TEXT><PARA/><POP/></RDL>'''
152 = '''<RDL><PUSH/><TEXT>Xenos are hitting the Trade Lanes surrounding Whiteharbor. They are moving in from the Jersey Debris Fields; there must be a Jump Hole somewhere within the Jersey. At least they don’t really attack Helion shipping, just Orsena and Dornmark.</TEXT><PARA/><POP/></RDL>'''
153 = '''<RDL><PUSH/><TEXT>Xenos in the Jersey are in a turf war with the Junkers right now. I say let the scum kill each other off. It’s not like we need Junkers loitering about anyway.</TEXT><PARA/><POP/></RDL>'''
154 = '''<RDL><PUSH/><TEXT>LPI’s biggest problem is the Helion Rogues. Lucky for us they are completely disorganized and usually not great pilots either. The problem is there are so many of them. They are all over the place — kill one and two more pop up.</TEXT><PARA/><POP/></RDL>'''
155 = '''<RDL><PUSH/><TEXT>The Junkers are criminal dirtbags, but they are smart about it, unlike the Rogues. They have a legitimate cover as scrap collectors, but we know they are as crooked as any other criminal. And they will never give up one of their own. You squeeze a Junker to make him talk about other criminals.</TEXT><PARA/><POP/></RDL>'''
156 = '''<RDL><PUSH/><TEXT>The Xenos don’t usually mess with Helion shipping, but that all changes when it comes to Side Arms. The Xenos love stealing guns, they’ve been concentrating attacks on the Detroit Munitions Plant for some time now. Ageira is guarding the plant better, so now they’re focusing on the Trade Lane between here and Detroit.</TEXT><PARA/><POP/></RDL>'''
157 = '''<RDL><PUSH/><TEXT>LPI is almost like two companies: you got the LPI who police Helion space and run the Sugarland and Huntsville prison ships, and then you have LPI the consumer goods manufacturer making all kinds of products with the captured criminals as their labor force.</TEXT><PARA/><POP/></RDL>'''
158 = '''<RDL><PUSH/><TEXT>LPI is a privatized police force. I am an employee of Helion Police, Inc. We are actually just executing company policy when we patrol Helion space looking for criminals. LPI is sanctioned by the Helion government so we have legal jurisdiction, but the bottom line is about money.</TEXT><PARA/><POP/></RDL>'''
159 = '''<RDL><PUSH/><TEXT>Scrap Metal ain’t the only kind of debris you’ll find in the Jersey. Ever heard somebody refer to another person as “good debris”? That means the guy they’re talking about went on a little space walk without a suit on. That’s what happens to rats and traitors. You want to hear the juicy part? LPI will put you into the debris too, if you make ’em angry enough.</TEXT><PARA/><POP/></RDL>'''
160 = '''<RDL><PUSH/><TEXT>A lot of LPI officers like the Xenos. The Xenos attack other criminal factions in Cinderwell and they don’t attack Helion shipping. They attack Ageira, but only for the guns. Just a bunch of harmless crazies, those Xenos.</TEXT><PARA/><POP/></RDL>'''
161 = '''<RDL><PUSH/><TEXT>The Rogues are all over Cinderwell. Actually, LPI might be out of business if it wasn’t for the Rogues. It doesn’t matter too much though; some LPI will bring you in for nothing but being in the wrong place at the wrong time. LPI can always use more workers at Sugarland and Huntsville.</TEXT><PARA/><POP/></RDL>'''
162 = '''<RDL><PUSH/><TEXT>The LSF has been on high alert lately. The Helion Security Force is chartered with providing our government with the information they need to make informed decisions regarding national security matters. We are Helion’s eyes and ears in Cinderwell and beyond.</TEXT><PARA/><POP/></RDL>'''
163 = '''<RDL><PUSH/><TEXT>The LSF is keenly interested in any Artifacts that private citizens have purchased, even for private use. They are illegal, and will be confiscated if discovered in your possession.</TEXT><PARA/><POP/></RDL>'''
164 = '''<RDL><PUSH/><TEXT>The LSF has been commissioned with confiscating all Alien Artifacts in Sirius. Not all the other Houses are as cooperative as they should be, so sometimes we are forced to take unilateral action. Orsena officials have been particularly lax in their enforcement of the ban.</TEXT><PARA/><POP/></RDL>'''
165 = '''<RDL><PUSH/><TEXT>Sometimes the LSF will employ independent pilots that pass our strict security clearance checks. If you are ever lucky enough to serve Helion in such a way, whatever you do for us will have to remain a secret for the rest of your life.</TEXT><PARA/><POP/></RDL>'''
166 = '''<RDL><PUSH/><TEXT>Right now Artifact interdiction is the LSF’s priority; this comes from the top. Anyone in Helion caught smuggling Artifacts is going to spend some time in an interrogation chamber, and then a long time on the Sugarland making toys.</TEXT><PARA/><POP/></RDL>'''
167 = '''<RDL><PUSH/><TEXT>Cardamine has become a real problem for the people of Helion, but so far our attempts to get an operative within the Outcast organization have proved impossible. Somehow they have a way to tell whether or not you are an Outcast.</TEXT><PARA/><POP/></RDL>'''
168 = '''<RDL><PUSH/><TEXT>An entire LSF Dark Ops Shadow Team was found in a container on the edge of the Badlands. They had been sent in to interdict an Outcast shipment and capture one if possible. They were all dead and had bags of Cardamine stuffed into their mouths.</TEXT><PARA/><POP/></RDL>'''
169 = '''<RDL><PUSH/><TEXT>The LSF advises the Navy in various locations throughout Helion, particularly in those areas known for their Artifact smuggling routes. We also have agents periodically raid the wealthy Helion elites’ private residences in search of Artifact collections.</TEXT><PARA/><POP/></RDL>'''
170 = '''<RDL><PUSH/><TEXT>The Lane Hackers have stolen advanced Ageira technology, which has given them the ability to predict and intercept cargo shipments throughout the Trade Lane network. They are a very smart criminal organization, but sooner or later they will make a mistake.</TEXT><PARA/><POP/></RDL>'''
171 = '''<RDL><PUSH/><TEXT>Orbital has whatever you’re looking for to meet your vacationing needs. Take a trip on the </TEXT><TRA italic="true"/><TEXT>Shetland</TEXT><TRA italic="false"/><TEXT>  to the forests of Gaia, visit the hot springs of Baden-Baden, maybe dip in the cool waters of Curacao, or if adventure is what you seek, how about </TEXT><TRA italic="true"/><TEXT>Hawaii</TEXT><TRA italic="false"/><TEXT>?</TEXT><PARA/><POP/></RDL>'''
172 = '''<RDL><PUSH/><TEXT>We offer the finest in luxury vacations and stellar tourism. Our spas and resorts are the finest in the galaxy. If there is a beautiful spot in Sirius you’re dying to take the family to, or if you’re dying to get away from the family, Orbital Spa and Cruise has what you’re looking for.</TEXT><PARA/><POP/></RDL>'''
173 = '''<RDL><PUSH/><TEXT>We ship Luxury Goods from here in Whiteharbor to Curacao in the Cortez system. We strive to provide our guests with the absolute best of all things, so when they think luxury, they think Orbital. It’s quite a commitment since these shipments are often attacked by Rogues and Lane Hackers.</TEXT><PARA/><POP/></RDL>'''
174 = '''<RDL><PUSH/><TEXT>Republican Shipping specializes in shipping concerns between Helion and Dornmark, via Hamburg and Texas. Unfortunately, rising crime and piracy within Texas and the Independent Worlds has been making it difficult to maintain our excellent standards. The Helion Security Forces really must do something about this problem.</TEXT><PARA/><POP/></RDL>'''
175 = '''<RDL><PUSH/><TEXT>We ship the finest in Silver from Ironreach and Hamburg into Whiteharbor. We also ship Diamonds into Helion from Ironreach. Both Commodities are used in the manufacture of Luxury Goods, a Whiteharbor specialty.</TEXT><PARA/><POP/></RDL>'''
176 = '''<RDL><PUSH/><TEXT>Republican Shipping sends the Luxury Consumer Goods produced here to Ironreach. Sometimes it gets to me that I’m putting my life on the line to haul some rich executive a Diamond tie pin or real leather shoes.</TEXT><PARA/><POP/></RDL>'''
177 = '''<RDL><PUSH/><TEXT>If you want your ship’s engines to run cleanly, you should buy Samura’s Osaka Brand H-Fuel. Our fuel convoys are under constant attack by Xenos, Jade Vow, and the odd Rogue, but it doesn’t matter — we keep Sirius fueled.</TEXT><PARA/><POP/></RDL>'''
178 = '''<RDL><PUSH/><TEXT>We supply Whiteharbor’s luxury market with its Niobium from our dealers in Freeport 6. I used to pilot the flight myself a while back, but I lost my nerve; I just can’t do it anymore. I’m not going to get killed for a paycheck. Luckily, I knew a higher-up and got transferred to a desk.</TEXT><PARA/><POP/></RDL>'''
179 = '''<RDL><PUSH/><TEXT>Samura gets the best for the people of Orsena. We do not manufacture Luxury Goods ourselves so we come here to get them. The finest Luxury Goods are bought here in Whiteharbor and shipped to our intermediaries in Sablecross.</TEXT><PARA/><POP/></RDL>'''
180 = '''<RDL><PUSH/><TEXT>Synth Foods delivers its best in synthetic Food Pastes to Whiteharbor from its Los Angeles biodomes. From here we head into Colorado — there’s a hungry person everywhere, and our goal is to put a tube of Food Paste in their hands.</TEXT><PARA/><POP/></RDL>'''
181 = '''<RDL><PUSH/><TEXT>Synth Foods offers tasty Pastes throughout all of Helion and beyond. Our Paste containers are always filled and always on the go with your favorite Synth Foods flavors. Sure we lose daring pilots and gunners and engineers all the time, but when you have a job to do, it’s just part of the work day.</TEXT><PARA/><POP/></RDL>'''
182 = '''<RDL><PUSH/><TEXT>We produce Luxury Foods like lettuce and potatoes on Stuttgart and ship them here for the privileged few who can afford them. They are highly perishable, so we usually make the journey in one shot.</TEXT><PARA/><POP/></RDL>'''
183 = '''<RDL><PUSH/><TEXT>Universal Shipping handles all Side Arm shipments to LPI and Navy bases within Helion space. If you’ve ever had a cop or Navy boy pull a Perforator on you, then I’m the guy who delivered it to ’em more than likely.</TEXT><PARA/><POP/></RDL>'''
184 = '''<RDL><PUSH/><TEXT>We handle all manner of precious cargo bound for the outer colonies. We ship Luxury Goods to Larkspur, Sablecross, and Ironreach. It is extremely dangerous between Larkspur and here, especially because of the Lane Hackers. They aren’t the dangerous part, it’s the Ashbound who they sell the shipping information to that you have to worry about.</TEXT><PARA/><POP/></RDL>'''
185 = '''<RDL><PUSH/><TEXT>We bring all manner of Commodities into Whiteharbor: Gold from Larkspur, Silver from Bonn, Niobium from Sablecross, and Consumer Goods from Houston. Universal uses her best pilots to make these runs; the Commodities onboard are very valuable and their loss is sorely felt.</TEXT><PARA/><POP/></RDL>'''
193 = '''<RDL><PUSH/><TEXT>All our cruise ships require constant resupply of Luxury Goods for our clientele. I ship Luxury Goods from here in Whiteharbor to the </TEXT><TRA italic="true"/><TEXT>Shetland</TEXT><TRA italic="false"/><TEXT>  in the Edinburgh system. It isn’t a joy ride, since there are all kinds of fun exciting ways to get blown to bits on the trip.</TEXT><PARA/><POP/></RDL>'''
194 = '''<RDL><PUSH/><TEXT>A lot of the Luxury Goods produced here in Whiteharbor are headed to the luxury liner </TEXT><TRA italic="true"/><TEXT>Hawaii</TEXT><TRA italic="false"/><TEXT>  in the Sigma-19 system. I just got assigned the route a few months ago. So far I’ve had nine escorts come and go courtesy of the Ashbound.</TEXT><PARA/><POP/></RDL>'''
195 = '''<RDL><PUSH/><TEXT>Ever hear of the LWB? They are some kind of militant Dornmark farmers who have turned to piracy. The Luxury Goods we ship from here in Whiteharbor to our resort on planet Baden-Baden in the Stuttgart system have been falling under their attacks.</TEXT><PARA/><POP/></RDL>'''
196 = '''<RDL><PUSH/><TEXT>Universal Shipping is the backbone of shipping within Helion and Cinderwell. We supply all Helion Navy and LPI bases with Food, Water, Oxygen, and H-Fuel. Usually the escorts we get are LPI or the Navy to bring these goods in, so it is a pretty safe run. It took me a long time to get the seniority to pull these kinds of routes.</TEXT><PARA/><POP/></RDL>'''
197 = '''<RDL><PUSH/><TEXT>We ship Whiteharbor’s famous Luxury Goods to the booming planets of Los Angeles and Denver. A lot of the ultra rich go to California or Colorado to play or retire. They are newer systems that cater to the elite.</TEXT><PARA/><POP/></RDL>'''
198 = '''<RDL><PUSH/><TEXT>Universal Shipping handles all Pharmaceutical shipments to naval bases within Helion space. The Helion government has complete confidence in Universal, or else they wouldn’t provide us with such a crucial contract.</TEXT><PARA/><POP/></RDL>'''
199 = '''<RDL><PUSH/><TEXT>Helion is a good place to be if you are a Bounty Hunter; all the best contracts come right out of this system. The big corporations do their business here, and where there’s business, there is crime, and that’s where we come in.</TEXT><PARA/><POP/></RDL>'''
200 = '''<RDL><PUSH/><TEXT>Plenty of Bounty Hunters have spent time on an LPI ship making Consumer Goods, but that is where I learned to think like the criminals that I hunt down. You see, before I went to the Huntsville I wasn’t really a criminal. When I got out I had three choices: mine Boron, join the Rogues, or become a Bounty Hunter.</TEXT><PARA/><POP/></RDL>'''
201 = '''<RDL><PUSH/><TEXT>A lot of them damned technocrats turn their noses up when a Bounty Hunter walks by, but they sure do get friendly when they need someone nabbed who’s been stealing their goodies.</TEXT><PARA/><POP/></RDL>'''
202 = '''<RDL><PUSH/><TEXT>South of here is Zone 21. You aren’t going to find many criminals there; you have to keep heading south past 21 until you reach the Badlands. And let me tell you when they call it the Badlands, they mean it. There are guys in there who will smoke you before you have the chance to cry for your mama.</TEXT><PARA/><POP/></RDL>'''
203 = '''<RDL><PUSH/><TEXT>I cracked a team of Rogues that was raiding the Food shipments coming in here from Ft. Bush. So I guess that they won’t need to steal as much Food with three less mouths to feed.</TEXT><PARA/><POP/></RDL>'''
204 = '''<RDL><PUSH/><TEXT>Xenos don’t really come this far into Cinderwell; mostly they try for Detroit weapon shipments on the west side of the system. Plus the amount of Junkers and Rogues between here and New Jersey makes for a rough trip if you’re a Xeno. Most likely he’d be dead by now.</TEXT><PARA/><POP/></RDL>'''
205 = '''<RDL><PUSH/><TEXT>The problem with the run to Breakwater is I have to travel through the Breakwater Debris Fields. It always puts me on edge moving through debris; you can’t see hostiles until it’s too late, and usually the police can’t move in fast enough to help.</TEXT><PARA/><POP/></RDL>'''
206 = '''<RDL><PUSH/><TEXT>We ship Boron from this plant into Vespera, specifically Stokes and Southampton. It’s a long and brutal run to those bases. You got Rogues here, Mollys there, and Ashbound in between. And they will all try and kill you for your cargo.</TEXT><PARA/><POP/></RDL>'''
207 = '''<RDL><PUSH/><TEXT>Bowex is really a high-cost item shipper, but our contracts for the Boron here pay us reasonably well so we do it. Many of our ships haul Luxury Goods, Luxury Foods, and Gold. But I like hauling Boron. Pirates don’t usually care as much about a shipment of Boron and will let me pass.</TEXT><PARA/><POP/></RDL>'''
208 = '''<RDL><PUSH/><TEXT>We ship the Boron produced here to the Baltimore Shipyard. It is a relatively short run, but that doesn’t mean it’s easy; Rogues come barreling out of the Breakwater Debris Field all the time.</TEXT><PARA/><POP/></RDL>'''
209 = '''<RDL><PUSH/><TEXT>Though Deep Space is primarily a manufacturing firm, we do dabble in mining. And this base is an example of that since we extract Boron here. We also have a Fertilizer production facility in Houston.</TEXT><PARA/><POP/></RDL>'''
210 = '''<RDL><PUSH/><TEXT>The Trade Lane technology that Ageira uses to run its Jump Gates is its most sensitive secret. We manufacture the Trade Lanes, but the real technology, the Jump Gate “engine” if you will, is housed in a black box that is plugged into the Ring that we construct. Any attempt to open the box will cause it to self-destruct, and it usually takes whoever was trying to open the box with it.</TEXT><PARA/><POP/></RDL>'''
211 = '''<RDL><PUSH/><TEXT>The Construction Machinery we use in our mining operations here is shipped to us from Houston. There are all kinds of scumbags in Texas that make life difficult for us shippers. And once we get into Cinderwell, that doesn’t mean that things necessarily get any better.</TEXT><PARA/><POP/></RDL>'''
212 = '''<RDL><PUSH/><TEXT>This corporation is the backbone of Helion industry. Deep Space Engineering builds luxury and prison liners, military ships, and Trade Lanes and Jump Gates under contract from Ageira.</TEXT><PARA/><POP/></RDL>'''
213 = '''<RDL><PUSH/><TEXT>We ship Water and Food from Whiteharbor to our base here. They are basic supplies that all bases require for maintaining their populations. It’s surprising how many people die trying to ship or steal the most basic things.</TEXT><PARA/><POP/></RDL>'''
214 = '''<RDL><PUSH/><TEXT>The contracts we have with Ageira have kept Deep Space at the technical and manufacturing edge of Helion. Every Trade Lane you use is a quality Deep Space product.</TEXT><PARA/><POP/></RDL>'''
215 = '''<RDL><PUSH/><TEXT>The Rogues in the area can make it difficult for us to keep our operations running smoothly. The LPI at Ft. Bush are spread too thinly in this area to interdict all the Rogue attacks on our Trade Lane.</TEXT><PARA/><POP/></RDL>'''
216 = '''<RDL><PUSH/><TEXT>Deep Space employs a large part of Helion’s labor force; some would call them the lower class. But the employees at Deep Space are not underpaid; we take good care of our people, even the miners in the boron fields.</TEXT><PARA/><POP/></RDL>'''
217 = '''<RDL><PUSH/><TEXT>The Breakwater Debris Field is mined out in the north, but there is still plenty of scrap in the south, and that’s where you’ll find the majority of Junkers who come into our fields.</TEXT><PARA/><POP/></RDL>'''
218 = '''<RDL><PUSH/><TEXT>The Junkers around Breakwater keep to their scrap-collecting most of the time. But don’t be fooled, they do plenty of illegal trafficking, too. Scrap Metal isn’t all they haul.</TEXT><PARA/><POP/></RDL>'''
219 = '''<RDL><PUSH/><TEXT>The Bounty Hunters will hunt down and kill just about anybody for the right price. A lot of talk around here makes them sound more like hit men than Bounty Hunters. Sure, they nab a lot of criminals and make Helion space safer, but they smoke plenty of innocents, too. Just because you are wanted by a corporation doesn’t necessarily mean you did anything illegal; you might have made the wrong enemies is all.</TEXT><PARA/><POP/></RDL>'''
220 = '''<RDL><PUSH/><TEXT>The police maintain a presence here on behalf of Deep Space Engineering. We try to keep an eye on the Lanes that this base’s suppliers use to deliver the supplies needed to keep this place running. The Rogues love to hang out in the Breakwater Field. It provides ample cover for their attacks, and they can sell their goods at the Junker base in the Jersey Field.</TEXT><PARA/><POP/></RDL>'''
221 = '''<RDL><PUSH/><TEXT>Most of the Junkers in this area aren’t really doing anything illegal, just looking for scrap. Occasionally we’ll catch one of them trying to steal some equipment, which means we are gonna bust some Rogues that the Junker will rat out to save his own hide.</TEXT><PARA/><POP/></RDL>'''
222 = '''<RDL><PUSH/><TEXT>The shipping companies that come to this base are always whining about not having enough protection in this area. We simply don’t have enough men to spread around this much space. But our patrols keep the route to this base relatively safe.</TEXT><PARA/><POP/></RDL>'''
223 = '''<RDL><PUSH/><TEXT>Our transports take containers of Boron from here to the Sugarland Smelter in Texas. Even though this is Helion my superiors in Dornmark are making sure we do our shipping on time and on schedule.</TEXT><PARA/><POP/></RDL>'''
224 = '''<RDL><PUSH/><TEXT>This station requires our services in many ways. It just goes to show that Helion would not be all that she is without the support of the other Houses. Mining Machinery is brought to this base from Ft. Bush.</TEXT><PARA/><POP/></RDL>'''
225 = '''<RDL><PUSH/><TEXT>Mining Machinery is brought to this base from Essen in Ironreach. This is a very dangerous run to make between Dornmark and Helion. Some of the most dangerous criminals in all of Sirius haunt those Independent Worlds, not to mention the criminals within House space on either side.</TEXT><PARA/><POP/></RDL>'''
226 = '''<RDL><PUSH/><TEXT>The Boron produced here is shipped by us to the Norfolk Shipyard, the Pueblo Plant in Colorado, and the Sugarland Smelter in Texas. As you can see, Universal Shipping travels throughout Helion to meet all of her shipping needs.</TEXT><PARA/><POP/></RDL>'''
227 = '''<RDL><PUSH/><TEXT>Some of the Mining Machinery that we ship comes from Essen in Ironreach. Republican brings a good deal of machinery into this base, but they cannot handle all of the demand. That’s why we make the run also, as dangerous as it is.</TEXT><PARA/><POP/></RDL>'''
228 = '''<RDL><PUSH/><TEXT>Universal provides this facility with the majority of its supplies from Ft. Bush: Mining Machinery, Pharmaceuticals, Food, and H-Fuel. The exception is Consumer Goods, which we ship to this base from Houston.</TEXT><PARA/><POP/></RDL>'''
229 = '''<RDL><PUSH/><TEXT>We at ALG are committed to making Sirius space a safe place to fly. Our company processes and disposes of waste in every House in Sirius. Damned the Xenos who attack our ships simply because we are a Dornmark firm. Their harassment is not treated sternly enough by the Helion Police or the Navy.</TEXT><PARA/><POP/></RDL>'''
230 = '''<RDL><PUSH/><TEXT>ALG supplies this ship with MOX from the Dortmund plant. Isn’t it obvious who makes the cleanest burning ship fuel? Of course it is ALG. If not, wouldn’t Helion purchase MOX from BMM?</TEXT><PARA/><POP/></RDL>'''
231 = '''<RDL><PUSH/><TEXT>The Toxic Waste produced in the engines of this ship is sent to the plant in Dortmund and disposed of properly. The amount of Xenos I have to fight off just to haul Toxic Waste is stupefying. Those bloodthirsty animals will attack anything without a Helion flag stamped on the outside of its hull.</TEXT><PARA/><POP/></RDL>'''
232 = '''<RDL><PUSH/><TEXT>Most of the Hunters in our guild are Hunters because this is what they want to do — at least the good ones are like that. I like working on my own terms and not answering to anybody. That’s my style — no bosses.</TEXT><PARA/><POP/></RDL>'''
233 = '''<RDL><PUSH/><TEXT>The Ashbound are using the Rogues. The Ashbound smuggle their Cardamine into the Rogue base in the Badlands, and then the Rogues and Junkers get it planetside. Most of the Rogues I’ve brought in were strung out on the Cardamine, so I’m guessing the Ashbound are the ones with their hands on the throttle.</TEXT><PARA/><POP/></RDL>'''
234 = '''<RDL><PUSH/><TEXT>Being a Bounty Hunter is a tough job; nobody likes you and a lot of guys would enjoy killing you. But, that’s why I like it. Bounty Hunters don’t really operate like they used to. There was a time when we were paid to bring criminals in — now we are paid to make criminals disappear.</TEXT><PARA/><POP/></RDL>'''
235 = '''<RDL><PUSH/><TEXT>I’m one of the few guys who’ll go into the heart of the Badlands, but I’ve gotten to know the space pretty well. I’ve got my hiding places and ambush points, and I can read the Rogue activity pretty well. I also stay clear of the Ashbound. That’s why I’m still alive.</TEXT><PARA/><POP/></RDL>'''
236 = '''<RDL><PUSH/><TEXT>When I got out off “the Wall” I didn’t have many choices ahead of me, at least no appealing choices. I knew I didn’t want to go back to making clothes on the Huntsville. I also knew I didn’t like most of the scum I did time with.</TEXT><PARA/><POP/></RDL>'''
237 = '''<RDL><PUSH/><TEXT>The main objective of this dreadnought is to patrol Cinderwell space and keep her safe from any who may threaten the interests of the Helion government. This ship is one of four battleships in Helion space.</TEXT><PARA/><POP/></RDL>'''
238 = '''<RDL><PUSH/><TEXT>The LPI does not enter the Badlands, which is our domain. Patrols generally skirt the periphery of the great cloud. From there we launch probing attacks into the area, looking to intercept and dispose of criminals.</TEXT><PARA/><POP/></RDL>'''
239 = '''<RDL><PUSH/><TEXT>Zone 21 is a classified area for civilians and any non-military entities; trespass into that area and you are threatening House security. If you try to enter the system and survive the mines, you will not survive the Helion Navy. There are no exceptions.</TEXT><PARA/><POP/></RDL>'''
240 = '''<RDL><PUSH/><TEXT>The police think they have it tough on the north end, but the truth is the majority of those fat, overworked, under skilled pilots have never come up against real trouble. I’d like to see how long an LPI would last against an Outcast… I’m guessing thirty seconds.</TEXT><PARA/><POP/></RDL>'''
241 = '''<RDL><PUSH/><TEXT>The Trade Lanes between the Texas and California Jump Gates are patrolled by Helion Navy heavy fighter wings. Our presence is mainly to protect the interstellar shipping that passes through our turf, but we also scan ships and interdict smugglers.</TEXT><PARA/><POP/></RDL>'''
242 = '''<RDL><PUSH/><TEXT>Ageira’s technologies have kept Helion at the forefront in Sirius, technologically and economically. We guard that corporation’s interests like no others. Where would Helion or even Sirius be if it weren’t for the Jump Gate technology that Ageira developed?</TEXT><PARA/><POP/></RDL>'''
243 = '''<RDL><PUSH/><TEXT>West Point is the training academy for the best of the Helion officers. My family has put a man into “the Point” for the last six generations. I’m glad to be stationed here in the same system. Sometimes I’ll pass a training patrol of theirs in my heavy fighter, and I know those kids have got to be jealous.</TEXT><PARA/><POP/></RDL>'''
244 = '''<RDL><PUSH/><TEXT>We know there is a Rogue base in the Badlands. We also know that Cardamine comes into Cinderwell through there. The problem is that the Badlands is a big and very dangerous chunk of space; it’s not worth the men and ships we’d lose to try and clear it out. Best to just pop them as they leave it.</TEXT><PARA/><POP/></RDL>'''
245 = '''<RDL><PUSH/><TEXT>I keep an Mk 3 Riot Breaker behind the bar here. Not to say I’d use it on a Navy boy, but we’ve got Bounty Hunters aboard who can get unruly sometimes. They tend to quiet down fast when you level some Detroit machinery on ’em.</TEXT><PARA/><POP/></RDL>'''
246 = '''<RDL><PUSH/><TEXT>The Navy does more than watch for criminals, we stand guard against any who might threaten Helion, including other Houses. Our ship, if it ever comes to that, is fully capable of launching an attack outside Helion space. She’s got enough firepower aboard to lead an offensive.</TEXT><PARA/><POP/></RDL>'''
247 = '''<RDL><PUSH/><TEXT>ALG handles all the Toxic Waste that this ship’s reactors produce. A lot of the men here don’t really care to have Dornmarkers on board this ship, but ALG does take care of our waste. It’s better than dumping it in Helion space.</TEXT><PARA/><POP/></RDL>'''
248 = '''<RDL><PUSH/><TEXT>Universal Shipping supplies this ship with Food, Water, and Oxygen from Whiteharbor. We are under constant attack from Rogues that lie in wait in the debris fields littering the system.</TEXT><PARA/><POP/></RDL>'''
249 = '''<RDL><PUSH/><TEXT>The Side Arms you see on the hips of the personnel at this base are brought here by us from the Detroit Munitions plant. I carry one myself, a Detroit Mk 3 Resolver Hideway. It comes in handy for surprising would-be attackers.</TEXT><PARA/><POP/></RDL>'''
250 = '''<RDL><PUSH/><TEXT>We bring Pharmaceuticals here from Ft. Bush and Denver in Colorado. No matter where you go, people are always gonna get sick or injured.</TEXT><PARA/><POP/></RDL>'''
251 = '''<RDL><PUSH/><TEXT>Ageira ships Basic Alloys from this base to Detroit for use in the manufacturing of personal weaponry.</TEXT><PARA/><POP/></RDL>'''
252 = '''<RDL><PUSH/><TEXT>A Universal is the company that ships Ageira’s Trade Lane components to the Deep Space Engineering sites that will eventually become Jump Gates and Trade Lanes. They are fortunate to be honored with our very lucrative, exclusive contracts.</TEXT><PARA/><POP/></RDL>'''
253 = '''<RDL><PUSH/><TEXT>Ageira ships Side Arms to this station from Detroit. The Xenos love attacking weapon shipments, so we usually fly here under escort. We killed three Xenos on the last run to this base.</TEXT><PARA/><POP/></RDL>'''
254 = '''<RDL><PUSH/><TEXT>Our finely crafted Detroit personal weaponry is sent throughout Sirius space from here — that is, with the exception of Dornmark, which produces its own Side Arms. However, Detroit firepower is generally recognized as the best in personal protection.</TEXT><PARA/><POP/></RDL>'''
255 = '''<RDL><PUSH/><TEXT>Ageira ships Super Alloys and Superconductors to this base from Pueblo. Since this base serves as HQ for Universal Shipping, these Commodities will eventually be shipped throughout all of Sirius.</TEXT><PARA/><POP/></RDL>'''
256 = '''<RDL><PUSH/><TEXT>Jump Gate parts are brought to Ember Pier from Pueblo in Colorado. Those components will eventually be assembled by Deep Space Engineering into future Jump Gates and Trade Lane Rings.</TEXT><PARA/><POP/></RDL>'''
257 = '''<RDL><PUSH/><TEXT>Food is brought to this station from Los Angeles by Synth Foods.</TEXT><PARA/><POP/></RDL>'''
258 = '''<RDL><PUSH/><TEXT>This is but one base that our Paste-delivery fleet visits in our quest to keep the people of Sirius fed. Though we work towards a good cause, we still have our enemies.</TEXT><PARA/><POP/></RDL>'''
259 = '''<RDL><PUSH/><TEXT>The run from California to this base isn’t a bad one as runs go. Sometimes our Food shipments get attacked by Rogues, but overall, we’re pretty well protected. Once our ships enter the system, we head past West Point. Plenty of patrols and the LPI keep this area relatively safe since it’s so close to Whiteharbor.</TEXT><PARA/><POP/></RDL>'''
260 = '''<RDL><PUSH/><TEXT>This base serves as the headquarters for Universal Shipping, the primary shipping and transport company in Helion. We ship to far-flung destinations throughout all of Sirius. If you want it shipped, you’d better go with Universal!</TEXT><PARA/><POP/></RDL>'''
261 = '''<RDL><PUSH/><TEXT>The Trade Lane components at this base are shipped by us to Waterloo in Larkspur. We are part of the life blood of shipping that is Jump Gate technology, and all of Sirius benefits from our shipping convoys.</TEXT><PARA/><POP/></RDL>'''
262 = '''<RDL><PUSH/><TEXT>Because Universal handles such sensitive technology, we have become known as the premier shipper of rarified and valuable items. That means that our transports will very rarely stray from the Trade Lanes, and travel through Border Worlds and dangerous areas hardly ever happens.</TEXT><PARA/><POP/></RDL>'''
263 = '''<RDL><PUSH/><TEXT>The Oxygen and Water consumed at this base is shipped in by us from Whiteharbor. These basic components must be shipped to almost every base in every system in all of Sirius space. Maybe one day Universal will ship to them all.</TEXT><PARA/><POP/></RDL>'''
264 = '''<RDL><PUSH/><TEXT>The Side Arms at this base are shipped by Universal to Larkspur and Sablecross. Both runs are very dangerous; anytime you travel through Independent Worlds you have to be ready for a fight. That goes double for Side Arm shipments.</TEXT><PARA/><POP/></RDL>'''
265 = '''<RDL><PUSH/><TEXT>If Ageira builds it, you can count on Universal being the company to ship it. Universal ships the Side Arms to Ember Pier from Detroit, and we’ve been doing so for many years.</TEXT><PARA/><POP/></RDL>'''
266 = '''<RDL><PUSH/><TEXT>Universal ships Super Alloys to the Oder shipyard in Ironreach, and let me tell you I must age ten years each time I fly through the Independent Worlds into Dornmark.</TEXT><PARA/><POP/></RDL>'''
267 = '''<RDL><PUSH/><TEXT>Universal ships Superconductors to Ember Pier from Pueblo. From this base they will be distributed to locations throughout Sirius for all manner of implementations.</TEXT><PARA/><POP/></RDL>'''
268 = '''<RDL><PUSH/><TEXT>The Superconductors brought here are shipped by Universal to the Southampton Shipyard in Larkspur, where they will be used to drive the engines of the Vesperan Navy. We here at Universal are proud to take part in such an honor.</TEXT><PARA/><POP/></RDL>'''
269 = '''<RDL><PUSH/><TEXT>We ship Food from here to Ageira’s weapons manufacturing center in Detroit. Synth Foods delivers its own Pastes to Helion planets; we handle more of the specific deliveries to military, police, and commercial bases.</TEXT><PARA/><POP/></RDL>'''
270 = '''<RDL><PUSH/><TEXT>We ship Basic Alloys here from the Sugarland in Texas. It is a mean trip that kills pilots and escorts all the time. Texas is a dangerous system filled with the rabble of Helion.</TEXT><PARA/><POP/></RDL>'''
271 = '''<RDL><PUSH/><TEXT>The Navy gives Universal special protection. After all, Universal Shipping handles Ageira’s “black boxes,” covert military and government shipments, munitions — you name it. If it’s dangerous or expensive, Universal has its fingers in it.</TEXT><PARA/><POP/></RDL>'''
272 = '''<RDL><PUSH/><TEXT>The Superconductors here are shipped by Universal to the Southampton Shipyard in Larkspur. The trip is not an easy one, and my ship is almost always beat up when I come limping into Southampton. They patch me up and send me on back to do it all over again. I swear I lose a hair each time worrying about whether I’m gonna make it or not.</TEXT><PARA/><POP/></RDL>'''
273 = '''<RDL><PUSH/><TEXT>When you think Optronics, the Orsena manufacturers come to mind. But when it comes to Optical Chips, Ageira builds some of the finest in all of Sirius. They are shipped here from Los Angeles to be used in the construction of ships of all sizes.</TEXT><PARA/><POP/></RDL>'''
274 = '''<RDL><PUSH/><TEXT>Ageira ships Super Alloys and Superconductors from Pueblo, Colorado. These components will be used in the construction of Helion’s naval fleets, the ships that symbolize Helion’s dominance in Sirius space.</TEXT><PARA/><POP/></RDL>'''
275 = '''<RDL><PUSH/><TEXT>From Jump Gates to Side Arms and Optical Chips, Ageira is the high-tech leader for all of Helion and Sirius. What other company has given so much toward the progress of all the people here?</TEXT><PARA/><POP/></RDL>'''
276 = '''<RDL><PUSH/><TEXT>ALG ships Scrap Metal produced here to the Sugarland Smelter in Texas. Every shipyard produces Scrap Metal, which ALG gladly collects for recycling into Basic Alloys.</TEXT><PARA/><POP/></RDL>'''
277 = '''<RDL><PUSH/><TEXT>ALG ships High-Temperature Alloys and MOX to this facility from Dortmund, Ironreach. On the last run we lost two in our convoy to Xenos and Rogues as we passed through Texas.</TEXT><PARA/><POP/></RDL>'''
278 = '''<RDL><PUSH/><TEXT>Toxic Waste and Scrap Metal produced here is shipped to Dortmund in Ironreach. It is the responsibility of ALG to ensure that waste is not strewn throughout Sirius space. Remember, what one throws away another can use.</TEXT><PARA/><POP/></RDL>'''
279 = '''<RDL><PUSH/><TEXT>Think you’re a good pilot? Well, tell me what you think of yourself after you tangle with a Corsair. That’s if you survive, which honestly, I doubt you would.</TEXT><PARA/><POP/></RDL>'''
280 = '''<RDL><PUSH/><TEXT>The scum you see here in Helion is all that you find in an area with the greatest police and military presence in Sirius. Once you leave Helion, you start meeting the real bad ones: Mollys in Vespera, Cinder Guard in Dornmark, and Jade Vow in Orsena.</TEXT><PARA/><POP/></RDL>'''
281 = '''<RDL><PUSH/><TEXT>The pirates and raiders here in Helion are punks compared to what you’ll find on the fringes of Sirius. Sure, there are Ashbound here, but they are an Edge World syndicate that travels into the heart of Helion to sell their Cardamine.</TEXT><PARA/><POP/></RDL>'''
282 = '''<RDL><PUSH/><TEXT>Most Bounty Hunters you run across have either been hunting for a few years and know the ropes, or they’re green — in which case they’ll probably be dead within a month or two.</TEXT><PARA/><POP/></RDL>'''
283 = '''<RDL><PUSH/><TEXT>Some people say that Ashbound and Rift Captains used to be the same people. I guess it’s possible, though if you’ve ever seen an Outcast you might think differently. They are just different from the rest of the people of Sirius and the Rift Captains. I can’t imagine them being friendly with anyone but other Rift Captains.</TEXT><PARA/><POP/></RDL>'''
284 = '''<RDL><PUSH/><TEXT>Ever been out away from colony space? It’s dangerous out there in the Edge Worlds, and you can get popped in the blink of an eye. But that’s where you have to go to get the meanest and the toughest criminals.</TEXT><PARA/><POP/></RDL>'''
285 = '''<RDL><PUSH/><TEXT>Bowex ships Gold here from the GS&amp;M depot in Dublin. Among other things, the Gold is used on ship windows as a reflective coating.</TEXT><PARA/><POP/></RDL>'''
286 = '''<RDL><PUSH/><TEXT>Bowex is one of the oldest and most reliable shipping firms in all of Sirius. We have more ships and greater hauling ability than the upstarts at Gateway Shipping. Their company will not last the test of time, as Bowex has.</TEXT><PARA/><POP/></RDL>'''
287 = '''<RDL><PUSH/><TEXT>The Mollys in Dublin hit the last shipment headed here before this last one. All hands were lost, but that is the cost of shipping valuable Commodities like Gold. That is what Bowex is known for — um, the shipping valuable Commodities part, not the dead-employee part.</TEXT><PARA/><POP/></RDL>'''
288 = '''<RDL><PUSH/><TEXT>Deep Space ships Boron from Breakwater to this shipyard. The Breakwater Debris Field makes a nice hideout for the scum that attack my ship on my way from Breakwater.</TEXT><PARA/><POP/></RDL>'''
289 = '''<RDL><PUSH/><TEXT>We ship Construction Machinery to this shipyard from Houston. The Ashbound staged a major assault on our convoy in Texas on this last trip. I saw two transports and three escorts go up in flames. I don’t know how many died all told.</TEXT><PARA/><POP/></RDL>'''
290 = '''<RDL><PUSH/><TEXT>Deep Space Engineering maintains the only civilian shipyards in Helion space: Baltimore Shipyards. We manufacture components that are shipped here and used at this military shipyard, so you can see that Deep Space builds or helps build the finest ships in Sirius.</TEXT><PARA/><POP/></RDL>'''
291 = '''<RDL><PUSH/><TEXT>Even though this run is a dangerous one, we need to fulfill this contract with the Helion Navy. When this company first began no one believed it would survive, but we grow stronger every day.</TEXT><PARA/><POP/></RDL>'''
292 = '''<RDL><PUSH/><TEXT>Gateway ships Gold to this base from the Hood in Dublin. The Rogues’ ability to sniff out the Gold convoys seems uncanny. I’m told that they get their info from the Lane Hackers, so they are the real enemy — the ring leaders versus the attack dogs.</TEXT><PARA/><POP/></RDL>'''
293 = '''<RDL><PUSH/><TEXT>The Gold shipments we bring in from Dublin are a fight all the way to this station. First we have to fight the Mollys out of Dublin. Once we hit the Independent World Trade Lanes, we have to contend with the Lane Hackers or whomever they’ve sold our cargo manifests to. Once we get into Helion space, we have to fight the Rogues off.</TEXT><PARA/><POP/></RDL>'''
294 = '''<RDL><PUSH/><TEXT>This base is the home of Helion naval ship construction. In this place the greatest ships are built in all of Sirius. And the best naval officers command them. I served on the Missouri; she’s one of Norfolk’s finest.</TEXT><PARA/><POP/></RDL>'''
295 = '''<RDL><PUSH/><TEXT>The majority of Helion naval ships protect our shipping concerns in the Independent Worlds. That is where the more dangerous pirates and criminal activities take place. The exception is the Missouri, which is stationed in Cinderwell to keep the jewel of Sirius safe.</TEXT><PARA/><POP/></RDL>'''
296 = '''<RDL><PUSH/><TEXT>The sorties launched from this base are patrols tasked with keeping the inbound Commodities to this base safe so that ship production is never slowed by thieves and pirates.</TEXT><PARA/><POP/></RDL>'''
297 = '''<RDL><PUSH/><TEXT>The Bounty Hunters you see here are pretty good; we’re near the Badlands and I’ve seen these guys around before. Usually you only see green Bounty Hunters once.</TEXT><PARA/><POP/></RDL>'''
298 = '''<RDL><PUSH/><TEXT>ALG ships MOX to this facility from Dornmark. If you ever want to ship MOX, you are going to have to be pretty good friends with the people in Dortmund. A lot of criminal factions would like to get their hands on MOX — it’s possible to separate small amounts of plutonium from it.</TEXT><PARA/><POP/></RDL>'''
299 = '''<RDL><PUSH/><TEXT>This is more Navy space than it is an LPI patrol area. We send a flight down the Trade Lane between here and Ft. Bush, but that’s to protect against Rogue attacks launched from the Breakwater debris.</TEXT><PARA/><POP/></RDL>'''
300 = '''<RDL><PUSH/><TEXT>If we didn’t need labor for our consumer goods facilities, I’d kill all the Rogues I came across. I just get tired of putting away the same scum and watching ’em get released a couple years later to start doing the same illegal activity.</TEXT><PARA/><POP/></RDL>'''
301 = '''<RDL><PUSH/><TEXT>I sure as hell don’t like hanging out with all these Navy guys around. They are so straight-laced it makes me itch just to watch ’em march around from place to place in here. They need a couple of Helion ales to loosen those stuffy collars.</TEXT><PARA/><POP/></RDL>'''
302 = '''<RDL><PUSH/><TEXT>The Trade Lanes between Dornmark and Helion are dangerous ones. In Hudson the Xenos attack our transports, and in Bering we are attacked by Unionist scum.</TEXT><PARA/><POP/></RDL>'''
303 = '''<RDL><PUSH/><TEXT>Republican Shipping is the premier Dornmark shipping firm. If it weren’t for the massive debts that Dornmark accumulated during the 80-Years War, Republican would still be the only shippers in Dornmark space.</TEXT><PARA/><POP/></RDL>'''
304 = '''<RDL><PUSH/><TEXT>Engine Components are shipped here from the Ring in Ironreach via Republican Shipping. The Ring is Dornmark’s symbol of industrial might; many of Dornmark’s Commodities are produced there.</TEXT><PARA/><POP/></RDL>'''
305 = '''<RDL><PUSH/><TEXT>Universal ships the basic supplies from Whiteharbor for this base: Food, Water, and Oxygen. It is Universal that supplies the majority of basic supplies to myriad bases throughout Helion.</TEXT><PARA/><POP/></RDL>'''
306 = '''<RDL><PUSH/><TEXT>Universal ships Gold to this base from Larkspur. I’ve been the pilot for this Gold run for many years. I remember when I first started long ago. I’ve seen so much since then that it feels like more than a lifetime ago that I was strapping into my own freighter for the first time.</TEXT><PARA/><POP/></RDL>'''
307 = '''<RDL><PUSH/><TEXT>H-Fuel from Ft. Bush and Basic Alloys from Sugarland are brought to this base by Universal Shipping. The Basic Alloys are dropped off here. I head up to Ft. Bush to pick up the H-Fuel, come back here to unload it, and then head back to Texas to start all over.</TEXT><PARA/><POP/></RDL>'''
308 = '''<RDL><PUSH/><TEXT>The Junkers want us to take on the Xenos since they have been staging more attacks on them lately. We’ll oblige, as we’re not sure what the Xenos are really up to. Some of the bosses think they want to take over the Cardamine business from us. Fat chance of that.</TEXT><PARA/><POP/></RDL>'''
309 = '''<RDL><PUSH/><TEXT>We need to hire Independent pilots and Bounty Hunters on occasion to keep Junkers from swiping resources from our Baltimore Shipyard. We are, after all, near a debris field that is prime Junker turf.</TEXT><PARA/><POP/></RDL>'''
312 = '''<RDL><PUSH/><TEXT>This station is our trading center for operations in Helion space. We supply high-demand items to Ageira in Pueblo, but first we come through this point. We insure many of our shipments through IC at this base.</TEXT><PARA/><POP/></RDL>'''
313 = '''<RDL><PUSH/><TEXT>Bowex ships Hydrocarbons and Polymers from this base to Pueblo. The bloody Xenos are always a problem when it comes to making our various shipments in Helion space. What is just as infuriating is Helion’s apparent apathy concerning the Xeno issue.</TEXT><PARA/><POP/></RDL>'''
314 = '''<RDL><PUSH/><TEXT>Bowex ships Hydrocarbons and Polymers to this base from the Birmingham facility in Manchester. We supply all of Helion’s needs with these important Commodities.</TEXT><PARA/><POP/></RDL>'''
315 = '''<RDL><PUSH/><TEXT>We ship Beryllium from this base to Pueblo. Our transports have been coming under Xeno attack, but that is the price of being a shipping firm in Helion space.</TEXT><PARA/><POP/></RDL>'''
316 = '''<RDL><PUSH/><TEXT>The Beryllium we supply Ageira with in Pueblo will eventually be made into Ship Hull Panels and then sent back to one of the two Helion shipyards.</TEXT><PARA/><POP/></RDL>'''
317 = '''<RDL><PUSH/><TEXT>We ship Beryllium to this base from Kensington. Our shipments are frequently attacked in the Independent Worlds; no doubt the goods that the criminals manage to steal will end up back in Cinderwell.</TEXT><PARA/><POP/></RDL>'''
318 = '''<RDL><PUSH/><TEXT>IC hires Bounty Hunters to take care of the dirty work that goes with insuring shipments and operations throughout Sirius. If somebody starts to cost IC more money than it costs to hire Bounty Hunters, then we deal with them.</TEXT><PARA/><POP/></RDL>'''
319 = '''<RDL><PUSH/><TEXT>There is a strong Outcast presence in the northern Edge systems. Unfortunately, that’s where mining operations are starting to look for new resources, and that’s where we come in.</TEXT><PARA/><POP/></RDL>'''
320 = '''<RDL><PUSH/><TEXT>IC has been losing money with the construction project fiasco in Tau-23 that will facilitate mining in the area. They have turned to the Charter Guild to take care of the problem. I am here awaiting specific mission orders for my operations in that area.</TEXT><PARA/><POP/></RDL>'''
321 = '''<RDL><PUSH/><TEXT>IC wants me to hunt down and kill every single Lane Hacker I can get in my sights. They don’t want them captured, nor do they want information from them like Ageira does. They just want them dead.</TEXT><PARA/><POP/></RDL>'''
322 = '''<RDL><PUSH/><TEXT>The Lane Hackers are a smart bunch. Heck, I kind of respect them. But IC wants ’em wiped, so I’m going to perforate some rich-boy California types for IC. I love my job; nothing like blowing holes in rich people.</TEXT><PARA/><POP/></RDL>'''
323 = '''<RDL><PUSH/><TEXT>The way to get a Lane Hacker is to give him Cardamine. They like to spend time in California, so that is where I will go. I’ll snag a little Cardamine on the way and use it to buy my way in with them. Once I have their trust… well, you get the idea.</TEXT><PARA/><POP/></RDL>'''
324 = '''<RDL><PUSH/><TEXT>Interspace Commerce began as a banking institution formed to supply other Houses with the capital necessary for the construction of Trade Lanes within their space. Over time we became an insurance agency.</TEXT><PARA/><POP/></RDL>'''
325 = '''<RDL><PUSH/><TEXT>After the Dornmark-Orsena Embargo of 521, IC lost millions of credits as both Houses nationalized their Trade Lanes. The massive debts that those Houses had incurred were wiped away, and the Trade Lanes became theirs.</TEXT><PARA/><POP/></RDL>'''
326 = '''<RDL><PUSH/><TEXT>The tolls that Orsena and Dornmark had to pay us were not nearly the full amount that we had put up to fund their Jump Gates. The compromise reached in the Sirius Commerce Pact was not a compromise for our corporation, but unfortunately Helion didn’t have the military clout to enforce the payment of Dornmark and Orsena’s debts to us.</TEXT><PARA/><POP/></RDL>'''
327 = '''<RDL><PUSH/><TEXT>Any Trade Lane construction venture that begins is insured by us. If it isn’t, then the Trade Lane doesn’t get built. No one can risk losing the enormous capital required for the construction.</TEXT><PARA/><POP/></RDL>'''
328 = '''<RDL><PUSH/><TEXT>The Charter Guild, though perceived as not entirely trustworthy by some, is very helpful to us. They handle all of the nasty work that goes into insuring the progress of Sirius and Helion.</TEXT><PARA/><POP/></RDL>'''
329 = '''<RDL><PUSH/><TEXT>Recently we partnered with Ageira to create the Universal Ship Identification system, or USI. It is installed in Jump Gates and Trade Lanes so we can see the cargo that is being hauled by each individual vessel, allowing for proper tariffs to be levied and shipments to be properly tracked.</TEXT><PARA/><POP/></RDL>'''
330 = '''<RDL><PUSH/><TEXT>The Lane Hackers’ illegitimate use of our Universal Ship Identification system is infuriating. A technology created for the good of Sirius commerce is being exploited by a bunch of hedonistic junkies! That is why IC has begun hiring the Bounty Hunters in force.</TEXT><PARA/><POP/></RDL>'''
331 = '''<RDL><PUSH/><TEXT>The Lane Hackers must be destroyed. They know which shipments to hit that hurt us the most. Once they are gone, IC will double its current profits; the increase in revenue will be enormous.</TEXT><PARA/><POP/></RDL>'''
332 = '''<RDL><PUSH/><TEXT>Our relations with Orsena and Dornmark have never really recovered. They have banished our company from residence in their major planets, and we cannot even build bases in any of their minor systems. The irony is that we were the ones who lost all the money.</TEXT><PARA/><POP/></RDL>'''
333 = '''<RDL><PUSH/><TEXT>The LPI, though sanctioned with policing the Trade Lanes in Helion, is as corrupt as many of the criminals it is supposed to be arresting. The LPI can be bribed and coerced by almost any criminal with a little cash. The IC does not put any trust in the LPI.</TEXT><PARA/><POP/></RDL>'''
334 = '''<RDL><PUSH/><TEXT>The Vesperan authorities, the LSF, and the Helion military are stalwart allies in our crusade against piracy upon the Trade Lanes. They can be trusted not to take bribes or be lenient upon the scum that plague the dark places in Sirius space. If only the Dornmark Federal Police or the LPI could be relied upon…</TEXT><PARA/><POP/></RDL>'''
335 = '''<RDL><PUSH/><TEXT>Any pirates who attack Trade Lane shipping or Jump Gates deserve to be exterminated, whether their motives are greed or politics. Terror and piracy must not be tolerated.</TEXT><PARA/><POP/></RDL>'''
336 = '''<RDL><PUSH/><TEXT>Ashbound, Rift Captains, Cinder Guard, Jade Vow, Golden Chrysanthemums, Helion Rogues, Unioners, Xenos, the LWB, the Farmers Alliance, Gaians, and Lane Hackers — all these groups attack Trade Lanes. And that’s why IC will pay any Bounty Hunter top dollar to kill them, any of them. But especially Lane Hackers.</TEXT><PARA/><POP/></RDL>'''
337 = '''<RDL><PUSH/><TEXT>IC’s plans for Texas have gone sour — too many criminals in that area. Hudson and Bering have their fill of criminals, too. The Helion to Dornmark Trade Lanes have been trouble for IC as long as I can remember.</TEXT><PARA/><POP/></RDL>'''
338 = '''<RDL><PUSH/><TEXT>The Lane Hackers are a bunch of California boys who split on Ageira and became the worst possible enemies of IC. They have Trade Lane technology, which allows them to punch ships out of the Trade Lanes. Once that happens, the shipments are basically theirs.</TEXT><PARA/><POP/></RDL>'''
339 = '''<RDL><PUSH/><TEXT>Samura should not be here selling Fuel; we supply more than enough H-Fuel to Helion. Samura would be better served to stay in Orsena where it can continue its illegitimate business practices in safety.</TEXT><PARA/><POP/></RDL>'''
340 = '''<RDL><PUSH/><TEXT>It is unfortunate that Helion does not use more of Kishiro’s quality Optical Chips, but must instead rely upon Ageira, whose only abilities are crafting Trade Lanes and weapons.</TEXT><PARA/><POP/></RDL>'''
341 = '''<RDL><PUSH/><TEXT>Kishiro supplies this base with H-Fuel from Ogashawa. Much of the H-Fuel that we attempt to ship here is stolen by Rogues and Xenos, which forces us to raise our costs to cover expected losses due to theft.</TEXT><PARA/><POP/></RDL>'''
342 = '''<RDL><PUSH/><TEXT>We maintain a presence here at the IC headquarters as a show of support. After all, IC has been insuring investments throughout Helion for a very long time. This corporation is very interested in curbing piracy. Of course not entirely, or no one would need IC anymore.</TEXT><PARA/><POP/></RDL>'''
343 = '''<RDL><PUSH/><TEXT>I don’t like being around the Bounty Hunters on this base. I recognize some of them as criminals I’ve put away before. But Bounty Hunters can go where the LPI doesn’t have jurisdiction — outside Helion.</TEXT><PARA/><POP/></RDL>'''
344 = '''<RDL><PUSH/><TEXT>I don’t know why they call them Bounty Hunters — in my book they are assassins, plain and simple. You hire them to go hunt someone down and kill them. Very rarely are they required to bring someone back alive — and that’s usually the runaway son of some executive.</TEXT><PARA/><POP/></RDL>'''
345 = '''<RDL><PUSH/><TEXT>Samura is an ancient company dating back to the first Shogunate of Orsena. Since then Samura has become the leader in a wide array of technologies. Samura supplies Helion with her fuel, so they are indispensable to the people of this House. Remember that.</TEXT><PARA/><POP/></RDL>'''
346 = '''<RDL><PUSH/><TEXT>Samura supplies this base with H-Fuel from Osaka. Both Kepler and Galileo are difficult systems to cross, and once inside Helion we are plagued by the accursed Rogues.</TEXT><PARA/><POP/></RDL>'''
347 = '''<RDL><PUSH/><TEXT>Samura ships Alien Organisms to this base from Kurile. Alien Organisms are difficult to find and can be used in all manner of industry from terraforming to Food production.</TEXT><PARA/><POP/></RDL>'''
348 = '''<RDL><PUSH/><TEXT>The pilots who make the shipping runs within Helion and Vespera have it best. Sure there are lots of criminals in this House and in Vespera, but we have dire enemies in Dornmark and Orsena.</TEXT><PARA/><POP/></RDL>'''
349 = '''<RDL><PUSH/><TEXT>Synth ships run our Paste tubes to this base from Los Angeles. If you want the best Food money can buy, head to Whiteharbor. That’s where you’ll find the Luxury Foods.</TEXT><PARA/><POP/></RDL>'''
350 = '''<RDL><PUSH/><TEXT>Soon every planet and station in Sirius will have a biodome. Our farms will supply Food to every mouth in the galaxy. The farmers in Stuttgart just don’t realize the noble work they are doing, but they will soon understand.</TEXT><PARA/><POP/></RDL>'''
351 = '''<RDL><PUSH/><TEXT>We ship Alien Organisms from this base to California Minor, where they are used for terraforming processes. H-Fuel is also shipped by Universal to Los Angeles, West Point, and Detroit.</TEXT><PARA/><POP/></RDL>'''
352 = '''<RDL><PUSH/><TEXT>We bring Oxygen and Water to this base from Whiteharbor. It’s one of the shortest and safest runs in all of Sirius. It took many years of flying for Universal before I got this cherry assignment.</TEXT><PARA/><POP/></RDL>'''
353 = '''<RDL><PUSH/><TEXT>H-Fuel is brought to Sheffield by our shipping convoys. We need plenty of escorts because every dirty criminal out there has to steal H-Fuel to keep his ship running.</TEXT><PARA/><POP/></RDL>'''
354 = '''<RDL><PUSH/><TEXT>I’ve killed Cinder Guard in Dornmark; Rogues, Lane Hackers, and Ashbound in Helion; Mollys in Vespera; Hogosha and Jade Vow in Orsena; I’ve even bagged a few Rift Captains. But I’ve never brought any of ’em in. Bounty Hunters aren’t paid to capture criminals; we’re paid to kill them.</TEXT><PARA/><POP/></RDL>'''
355 = '''<RDL><PUSH/><TEXT>The Navy doesn’t get it; you can’t just patrol for the criminals. Sure, that helps, but if you want to solve the problem you have to seek them out — hunt them at their lair. And once you’re there, you kill them all, every single one. That’s how you solve the problem.</TEXT><PARA/><POP/></RDL>'''
356 = '''<RDL><PUSH/><TEXT>If I were one of these stuck-up Navy captains, I’d just roll the Missouri right into the middle of the Badlands and start cleaning house. They say it’s impossible logistically, but that’s a politician’s word. Just go in there and kill them — it’s that simple.</TEXT><PARA/><POP/></RDL>'''
357 = '''<RDL><PUSH/><TEXT>There’s no way I’d ever wear a uniform or salute some stuck-up jerk every time he walked by just because he has a few more pieces of metal on his chest. Bounty Hunters have to work harder because we don’t have a fleet behind us. But if you need someone dealt with, we do the job.</TEXT><PARA/><POP/></RDL>'''
358 = '''<RDL><PUSH/><TEXT>The Junkers are a crafty bunch of scumbags; they know the dirt on everybody — and they’re willing to talk if the price is right. It’s not my money that pays ’em off. That’s part of my bill for offing my mark. Give me a little bribe, some gas money, and a reward for completion of assignment, and I’ll smoke anyone you want.</TEXT><PARA/><POP/></RDL>'''
359 = '''<RDL><PUSH/><TEXT>Fighting an Outcast is like fighting a Corsair: they’re both armed to the teeth, mean as hell, and can pilot a ship as well as anyone you’re gonna find. That’s why it’s best to take them on with two-to-one or better odds. And if the guy you’re flying with gets popped, that means more money for you.</TEXT><PARA/><POP/></RDL>'''
360 = '''<RDL><PUSH/><TEXT>The weapon platforms that surround this base make it almost impossible for an attacker to survive a direct assault on our station. As of yet, none who’ve tried have lasted five minutes.</TEXT><PARA/><POP/></RDL>'''
361 = '''<RDL><PUSH/><TEXT>We run patrols along the edges of the Badlands and the Trade Lanes leading to California. We intercept Rogues trying to make the run between the Detroit Debris Fields and the Badlands.</TEXT><PARA/><POP/></RDL>'''
362 = '''<RDL><PUSH/><TEXT>I’ve been waiting to get into West Point my whole life, but now I don’t know if I’ll be able to handle it. Last week my dorm mate and best friend died on one of our patrols sweeping the outer edges of the Badlands. Ashbound weren’t supposed to come through that area, just Rogues.</TEXT><PARA/><POP/></RDL>'''
363 = '''<RDL><PUSH/><TEXT>The recruits here are good boys from the top families in Helion. One day they will lead Helion’s military and keep our space safe from enemies.</TEXT><PARA/><POP/></RDL>'''
364 = '''<RDL><PUSH/><TEXT>This academy is near the California Jump Gate. California is a favorite hangout for the Lane Hackers. Lane Hackers were former Ageira employees who turned to crime. They’re smarter than most of the criminals you’ll go up against.</TEXT><PARA/><POP/></RDL>'''
365 = '''<RDL><PUSH/><TEXT>The tactics that the cadets here are instructed in cover all manner of scenarios, from defending our space from foreign invasion to small-operations tactics. The best of our graduates go on to captain dreadnoughts and other capital ships. If they have good, fast-twitch reflexes and lightning-quick decision-making abilities, they might end up piloting a Helion Heavy Fighter as leader of an attack wing.</TEXT><PARA/><POP/></RDL>'''
366 = '''<RDL><PUSH/><TEXT>The Orsena-Dornmark embargo was an incident that reminded Helion that her forces must remain ever-vigilant. We believed our military might to be unstoppable, but we were wrong. Once the H-Fuel stopped flowing into Helion we could no longer power our attack crafts and had to acquiesce to the demands of the foreign powers.</TEXT><PARA/><POP/></RDL>'''
367 = '''<RDL><PUSH/><TEXT>We teach these cadets the importance of estimation. An officer must never overestimate his own capabilities, or the capability of his men or his ship. Overestimating our forces was the darkest lesson that the Helion Navy ever had to learn.</TEXT><PARA/><POP/></RDL>'''
368 = '''<RDL><PUSH/><TEXT>Ashbound killed some of our boys last week. Our intelligence showed that our training wing’s operating area was supposedly unpopulated by Ashbound. Well, Intel was wrong and we lost two cadets. The instructor was able to bag a couple of Outcast ships before they escaped back into the Badlands.</TEXT><PARA/><POP/></RDL>'''
369 = '''<RDL><PUSH/><TEXT>I was the marine commander aboard the Missouri for many years. Now they have me teaching these little runts about ship-boarding operations and planetary-invasion scenarios. I miss being back aboard the “Iron Miz.” I suppose it’s my duty to train whelps now.</TEXT><PARA/><POP/></RDL>'''
370 = '''<RDL><PUSH/><TEXT>It is a bad influence to have this Bounty Hunter scum amongst all of our cadets. The young lads are still easily influenced, and Bounty Hunters have no code, no honor, and no loyalty. It’s not good for the newest of ours to be exposed to this.</TEXT><PARA/><POP/></RDL>'''
371 = '''<RDL><PUSH/><TEXT>This academy also serves as a supply point for the remote stations within the Badlands. We also carry supplies for the ships entering the system through California that might be running low on Water, Oxygen, or Food.</TEXT><PARA/><POP/></RDL>'''
372 = '''<RDL><PUSH/><TEXT>The Navy sends a patrol wing into the Detroit Debris Fields. There is a lot of illegal traffic moving through there. Criminals use the debris to hide in as they jump from debris field to debris field through Helion space.</TEXT><PARA/><POP/></RDL>'''
373 = '''<RDL><PUSH/><TEXT>Right before graduation the cadets here are sent into the Badlands to kill some criminals. It’s the last part of their training, and they go without an instructor. By that point they should be able to handle themselves reasonably well, even if they are still pretty green.</TEXT><PARA/><POP/></RDL>'''
374 = '''<RDL><PUSH/><TEXT>The Navy has secret research stations in the Badlands. I think they are there to study anomalies that occur within the area. Of course it could also be a cover for covert operations there.</TEXT><PARA/><POP/></RDL>'''
375 = '''<RDL><PUSH/><TEXT>Universal ships Water and Oxygen from Whiteharbor; Synth Foods brings Food in from Los Angeles. It’s a good thing that I run supplies to the academy. I was in trouble on my way here a few weeks ago until a training squadron came in from nowhere and wiped the Rogues on my tail.</TEXT><PARA/><POP/></RDL>'''
376 = '''<RDL><PUSH/><TEXT>We ship Water, Food, and Oxygen to Norfolk from this base. It can be treacherous to make this run, because a lot of dangerous criminals like to attack this Trade Lane. It lies right outside the edge of the Badlands, so there are plenty of places we can be ambushed.</TEXT><PARA/><POP/></RDL>'''
377 = '''<RDL><PUSH/><TEXT>To keep West Point running, this station requires Side Arms, which we ship in from Detroit. We also get Pharmaceuticals from Ft. Bush, and H-Fuel from Norfolk. All of these Commodities are required to train tomorrow’s officers of the Helion naval fleet.</TEXT><PARA/><POP/></RDL>'''
389 = '''<RDL><PUSH/><TEXT>We smuggle Diamonds from the Junker base in Berlin to the Rogue base Dawson in the Hudson system. This is our main source of income to carry on our war against Republican Shipping.</TEXT><PARA/><POP/></RDL>'''
390 = '''<RDL><PUSH/><TEXT>The union that formed after the Alster Tragedy of 512 gained well-deserved benefits for the shipwrights and welders who built the transports that shipped goods throughout Sirius. In the decades that followed, the union grew stronger. When the 80-Years War broke out, we were sitting pretty on a mountain of government subsidies and contracts.</TEXT><PARA/><POP/></RDL>'''
391 = '''<RDL><PUSH/><TEXT>We run shipments from the Junker base in Ironreach; they supply us with superior Dornmark Side Arms and Orsena H-Fuel. Not an easy run through Hamburg, but decent profit.</TEXT><PARA/><POP/></RDL>'''
392 = '''<RDL><PUSH/><TEXT>The Alster Shipyards are home to the Unioner movement. In 412 AS it was established by Imperial Shipping to supply the Dornmark Empire with transport freighters, lifters, and repair ships.</TEXT><PARA/><POP/></RDL>'''
393 = '''<RDL><PUSH/><TEXT>When the 80-Years War came to an end the Union joined the Popular Revolt to overthrow the Imperial government. There were no more government contracts, and unemployment skyrocketed.</TEXT><PARA/><POP/></RDL>'''
394 = '''<RDL><PUSH/><TEXT>In 512 AS an explosion in the Alster Shipyards killed hundreds of workers. They formed a union and walked out on the Imperial Shipping executives. It was then that Imperial Shipping realized how valuable its workers were. Production ground to a stop, and they started losing millions of credits for each day production was halted.</TEXT><PARA/><POP/></RDL>'''
395 = '''<RDL><PUSH/><TEXT>Our old boss Imperial Shipping became Republican Shipping after the Popular Revolt. It was a dark time for the common laborer, and within months we lost all the rights we had been working to create for the past several decades. Republican Shipping really stuck it to the worker, using the weak economic situation to strong-arm the faltering union.</TEXT><PARA/><POP/></RDL>'''
396 = '''<RDL><PUSH/><TEXT>The Unioners are a political organization fighting like many others throughout Sirius for the fair treatment of the working classes. We cannot allow the type of exploitation that is common practice of the corporations</TEXT><PARA/><POP/></RDL>'''
397 = '''<RDL><PUSH/><TEXT>With our old union destroyed after the Popular Revolt, we reformed and called ourselves the Unioners. We were formed to make Republican Shipping pay for the wrongs it had committed against its workers.</TEXT><PARA/><POP/></RDL>'''
398 = '''<RDL><PUSH/><TEXT>We use this as our primary base to attack Republican Shipping in Hamburg via the Jump Hole just south of this base. The asteroid fields in the northern part of that system provide good cover. We also attack them on the Trade Lanes that pass through this system.</TEXT><PARA/><POP/></RDL>'''
399 = '''<RDL><PUSH/><TEXT>I tell you, there’s a lot of work for Bounty Hunters in these parts. The Navy covers the north Trade Lanes and Texas Jump Gate okay, but they aren’t around a lot of the time. Xenos and Rogues hit the northern Trade Lane, Unioners the south. Yup, lots of work.</TEXT><PARA/><POP/></RDL>'''
400 = '''<RDL><PUSH/><TEXT>The Unioner base is out there in the southwestern part of the system. You’ll know if you’ve stumbled onto that hornet’s nest, believe me. The Xenos and Rogues tend to be more in the northwest part of the system — guess the Jump Hole to Hudson is somewhere out there.</TEXT><PARA/><POP/></RDL>'''
401 = '''<RDL><PUSH/><TEXT>It’s a good thing the Zoners let us land on their bases. The criminals don’t like it, but fair is fair. If the Zoners didn’t allow us to land, IC and the Helion Navy would shut this Freeport down in a second, and the Zoners know that.</TEXT><PARA/><POP/></RDL>'''
402 = '''<RDL><PUSH/><TEXT>From Houston we ship in Fertilizers to the biodomes here and return with Food for the prison factories.</TEXT><PARA/><POP/></RDL>'''
403 = '''<RDL><PUSH/><TEXT>We’re kind of new to the long-distance Food-shipping business. Until we got Stuttgart handed to us by the Helion government, we had little business outside of Helion systems. Now we have better ships and escorts, so we can handle these tough Independent World crossings.</TEXT><PARA/><POP/></RDL>'''
404 = '''<RDL><PUSH/><TEXT>The Unioners and Xenos don’t bother us too much here. Nothing like that damned LWB in Stuttgart. The Rogues, on the other hand, are not very discriminating in their targets.</TEXT><PARA/><POP/></RDL>'''
405 = '''<RDL><PUSH/><TEXT>We run supply shipments of Food, Oxygen, Consumer Goods, Pharmaceuticals, H-Fuel, and Water to our base out in the southern asteroid fields of this system. Just watch out for Bounty Hunters.</TEXT><PARA/><POP/></RDL>'''
406 = '''<RDL><PUSH/><TEXT>We left Hamburg for this system after we reformed into the Unioners, but too many of us flooded onto this Freeport. It was an obvious target for the Dornmark Military, so the Zoners eventually asked us to leave. We put our skills to use and carved a hidden base out of an asteroid in the Tanner Asteroid Field.</TEXT><PARA/><POP/></RDL>'''
407 = '''<RDL><PUSH/><TEXT>The current workers in the Alster Shipyards and Altona hate us for the attacks we make against their manufactories, but they don’t understand the way they are being exploited by Republican Shipping. If only they could open their eyes, we’d have more strong hands to join us in our cause.</TEXT><PARA/><POP/></RDL>'''
408 = '''<RDL><PUSH/><TEXT>This is one of the only bases around that lets us land. Those Zoners are good people, although they do seem to like foreigners a bit too much. We run supply shipments for basic needs like Food, Fuel, Oxygen, Pharmaceuticals, and Water from here to our base in Hudson.</TEXT><PARA/><POP/></RDL>'''
409 = '''<RDL><PUSH/><TEXT>The Zoners run Side Arms from Hamburg to this Freeport. That’s a big help for us, as otherwise we’d have nowhere else to get our guns for our base in the Hudson system. An unarmed Xeno doesn’t last long in Barrow. Only problem is that the guns are Dornmark made; it’s just too hard to get proper Helion hardware in these parts.</TEXT><PARA/><POP/></RDL>'''
410 = '''<RDL><PUSH/><TEXT>We like to hit Republican convoys in Bering whenever we can. Those Unioners hate ’em even more. That’s what we like to see — them killing each other off. One day this system will belong to just us and the Zoners, soon as we get the Rogues to see the light and join our cause.</TEXT><PARA/><POP/></RDL>'''
411 = '''<RDL><PUSH/><TEXT>We make supply runs to Hamburg to import essential Commodities like Oxygen, Water, Consumer Goods, and Pharmaceuticals.</TEXT><PARA/><POP/></RDL>'''
412 = '''<RDL><PUSH/><TEXT>The Unioners have a base out in the asteroid fields in the southwestern part of the system. They visit us frequently to purchase supplies.</TEXT><PARA/><POP/></RDL>'''
413 = '''<RDL><PUSH/><TEXT>There are two Jump Holes into this system. Both of them lie in Unioner territory, so be careful. The one to Hamburg is in the southwestern quadrant; the one to Hudson is straight across on the western edge of the system.</TEXT><PARA/><POP/></RDL>'''
414 = '''<RDL><PUSH/><TEXT>Our main activity on Freeport 2 is Food production. Synth Foods brings in Fertilizers from Houston and buys much of our excess to feed the burgeoning prison population in Texas.</TEXT><PARA/><POP/></RDL>'''
415 = '''<RDL><PUSH/><TEXT>The Xenos visit our base to buy all of their supplies and to purchase Side Arms. They grumble about them being Dornmark made, but buy them anyway. A strange lot.</TEXT><PARA/><POP/></RDL>'''
416 = '''<RDL><PUSH/><TEXT>Xenos, Rogues, and Unioners attack the Trade Lanes within this system. Bounty Hunters and the Helion Navy keep them somewhat in check, but it’s still not a very safe place to be. We are truly the sanctuary in these parts.</TEXT><PARA/><POP/></RDL>'''
417 = '''<RDL><PUSH/><TEXT>We run Side Arms in from Hamburg. The senior council of the station is split on that policy, as Zoners do not condone violence. However, it’s profitable and it fulfills a need for the criminals that visit our base.</TEXT><PARA/><POP/></RDL>'''
418 = '''<RDL><PUSH/><TEXT>This station originally belonged to Republican Shipping, who used it as a supply and repair depot before the Trade Lanes were built in 550. In 650 our ancestors drifted in from Texas and Hamburg and refurbished the abandoned station, naming it Freeport 2, the second in the Nacre Reach.</TEXT><PARA/><POP/></RDL>'''
419 = '''<RDL><PUSH/><TEXT>Zoners firmly believe in the concept of Freeports — places where anyone, regardless of their criminal or political affiliation, is welcome. Unfortunately, the authorities in the House systems do not subscribe to this philosophy, so there are none within House boundaries.</TEXT><PARA/><POP/></RDL>'''
420 = '''<RDL><PUSH/><TEXT>Synth Foods has been good for us. They helped install and maintain the biodomes, provided the special seeds, and sold us the processing and flavorant units that turn inedible crops into digestible food. Until they came along, the Zoners and other free thinkers struggled with the starvation caused by the lack of arable planets in the Independent and Border Worlds.</TEXT><PARA/><POP/></RDL>'''
421 = '''<RDL><PUSH/><TEXT>This system only exists as a way point on the Jump Gate routes because the distance between Hamburg and Texas was longer than the six-light-year limit of early Jump Gates. Before the Trade Lanes were built, the asteroids caused constant problems with shipping.</TEXT><PARA/><POP/></RDL>'''
422 = '''<RDL><PUSH/><TEXT>We sheltered the Unioners when they first fled Hamburg in the years following the Popular Revolution, but they soon became too numerous for us to support. When Republican hired Bounty Hunters and the Dornmark Military started to harass us, the Unioners left and established their own base at our request. They still come for supplies, though.</TEXT><PARA/><POP/></RDL>'''
423 = '''<RDL><PUSH/><TEXT>Our base is actually an old abandoned mining plant from a time when Helion did its mining. Any Republican Shipping vessel that comes into Hudson better not get spotted or there’s gonna be more Dornmark widows. We also keep a check on any Unioner that strays too far north from that Rogue base in the southern part of the system. Don’t get those Rogues, fraternizing with the enemy.</TEXT><PARA/><POP/></RDL>'''
424 = '''<RDL><PUSH/><TEXT>There weren’t many of us Xenos when we first began, but LPI solved that problem for us. The first of us captured were sent to the Huntsville in Texas, where we found others that saw the truth. Our numbers grew as we recruited from the prisons. LPI got wise after a while and started isolating Xenos from other inmates. They realized that for every Xeno they put away, three more converts would walk out five years later.</TEXT><PARA/><POP/></RDL>'''
425 = '''<RDL><PUSH/><TEXT>Helion’s plans for terraforming the Hudson system’s planet Atka came to a rumbling halt in 771 when one of our attack squads blew up a Planetform terraforming vessel. Now those pitiful Vesperans won’t even come into the system until it’s more secure, which isn’t going to happen anytime soon. This system will one day be the Helion Free Republic — for people just like us, who want to be left alone.</TEXT><PARA/><POP/></RDL>'''
426 = '''<RDL><PUSH/><TEXT>The LPI embodies everything that is wrong with Helion. It shouldn’t surprise anybody that most of the “criminals” that operate the Texas factories where rounded up for slave labor, not for any real crimes they committed. We used to get paid for our work in the former times; now we get thrown in prison and are forced into slave labor.</TEXT><PARA/><POP/></RDL>'''
427 = '''<RDL><PUSH/><TEXT>One day we will be victorious and the Junkers will be gone. Then the northern and southern clans of the Xenos will unite and rule the Independent Worlds, free from the corrupt grasp of the LPI.</TEXT><PARA/><POP/></RDL>'''
428 = '''<RDL><PUSH/><TEXT>As much as Xenos hate Junkers, we aren’t strong enough to get rid of those scavengers. They run the shipping points for inbound drug shipments into Helion. First we gotta push the Junkers out of Texas, and then we need to find a way to kick the Junkers out of Helion. Once that’s done, no one will be able to stop the Xenos. We’ll control the Cardamine that enters Helion space, and those rich elites that run the show in Whiteharbor will be at our mercy.</TEXT><PARA/><POP/></RDL>'''
429 = '''<RDL><PUSH/><TEXT>Hudson is perfect for our operations in this sector. The Jump Hole to Bering and our supply point at Freeport 2 is in the Wrangell Field — where you’ll find plenty of Rogues, though they don’t bother us too much. The Texas Jump Hole is in the Sitka Field. It’s our portal for conducting business in Texas — liberating our comrades from Huntsville, and hitting the Junkers and Ashbound.</TEXT><PARA/><POP/></RDL>'''
430 = '''<RDL><PUSH/><TEXT>We make supply runs and attack runs into the Bering system. We get our supplies from the Zoners at Freeport 2 and attack the Unioners. The Unioners should go back to Dornmark where they come from. This is Helion space, and they got no business coming here. When we see Unioner ships we attack them. This is our space — they can find some other place to steal.</TEXT><PARA/><POP/></RDL>'''
431 = '''<RDL><PUSH/><TEXT>A lot of Diamonds get mined in the Walker Nebula systems, especially in Dresden and Omega-41. Helion buys a lot of them Diamonds from the Dornmarkers — legally and illegally. The Unioners and Rogues travel across our system with Diamond shipments every so often. Those are the ones we really try and stop. The Diamond business sure could help us buy new ships and get the equipment we need to run our operations.</TEXT><PARA/><POP/></RDL>'''
432 = '''<RDL><PUSH/><TEXT>We sell our smuggled Diamonds from Kreuzberg here. It’s a dangerous journey through Hamburg, but well worth it.</TEXT><PARA/><POP/></RDL>'''
433 = '''<RDL><PUSH/><TEXT>Our base is through the Jump Hole to Bering. We don’t really like to stay long in this system — the Xenos hate us for some reason. The Rogues here are a rough, uncultured lot, but they buy our Diamonds.</TEXT><PARA/><POP/></RDL>'''
434 = '''<RDL><PUSH/><TEXT>We would prefer to live in Dornmark, but Republican is too strong. Fortunately, the Xenos unwittingly help us attack our common enemy, albeit for different reasons.</TEXT><PARA/><POP/></RDL>'''
435 = '''<RDL><PUSH/><TEXT>There’s plenty of work for us Bounty Hunters in this part of the Barrier. Between the Rogues in the Weddell field and the Lane Hackers and Ashbound in the Barrier Cloud, it’s a non-stop hunting party. Gotta watch out for those Ashbound, though — I’ve lost more than a few buddies to those lowlifes.</TEXT><PARA/><POP/></RDL>'''
436 = '''<RDL><PUSH/><TEXT>There’s a couple of Jump Holes in this system — the one to Cortez in the northern part of the system is easier to find. If you wait patiently enough, you can pop a Rogue or two as they come through; they won’t even know what hit them. If you see an Outcast, you better have some support, though.</TEXT><PARA/><POP/></RDL>'''
437 = '''<RDL><PUSH/><TEXT>I don’t get why everyone hates us so much. We’re providing a service to society, cleaning up all the criminal dregs, and making the Trade Lanes and Jump Gates safer for commerce. It’s not an easy life, living out in these hellhole Freeports at the edge of nowhere.</TEXT><PARA/><POP/></RDL>'''
438 = '''<RDL><PUSH/><TEXT>We run patrols throughout the system. Most of the bounties are put up by IC and Ageira, who seem to really hate the Lane Hackers’ guts. You get a lot less for a Rogue, but they’re easier to find and take out.</TEXT><PARA/><POP/></RDL>'''
439 = '''<RDL><PUSH/><TEXT>If you want to find Rogues, just pop through the Cortez Hole. You’ll find them in abundance over there. I think their base is pretty close to the Hole.</TEXT><PARA/><POP/></RDL>'''
440 = '''<RDL><PUSH/><TEXT>It’s pretty frustrating not being able to just take out my Detroit Executioner and waste the Lane Hackers and Rogues that come into this bar. It’d certainly be easier than chasing them down in space. Guess that’s the downside of Freeports. The IMG folks running the place are okay, but not real friendly. Got that Vesperan superiority attitude going or something.</TEXT><PARA/><POP/></RDL>'''
441 = '''<RDL><PUSH/><TEXT>I just made a run from California with Pharmaceuticals, Consumer Goods, Food, H-fuel, and Engine Components. A quick trip — although a little hazardous. Decent profit.</TEXT><PARA/><POP/></RDL>'''
442 = '''<RDL><PUSH/><TEXT>Mining Machinery is in demand here. We ship it in from Kensington to help our allies, the IMG. I’ll probably continue on with some Water bound for Los Angeles.</TEXT><PARA/><POP/></RDL>'''
443 = '''<RDL><PUSH/><TEXT>Be careful in those Barrier Clouds. It’s hard to see — lots of Lane Hackers and Ashbound — little in the way of security forces. My best friend’s convoy got nailed last week at the Manchester Gate by some Lane Hackers. He was hauling Gold from Vespera to Cinderwell — not low-value stuff like Oxygen and Water.</TEXT><PARA/><POP/></RDL>'''
444 = '''<RDL><PUSH/><TEXT>We buy supplies here for our base in the Barrier Cloud to the west. It’s pretty mundane stuff — Pharmaceuticals, Engine Components, H-Fuel, Consumer Goods, Oxygen, and Water. We prefer if independent pilots like you haul them, as it attracts less attention with Bounty Hunters.</TEXT><PARA/><POP/></RDL>'''
445 = '''<RDL><PUSH/><TEXT>Between you and me, that chunk of ice in the Barrier Cloud gets a little close at times, especially with those weirdo Ashbound stopping by on their drug runs all the time. It’s a beautiful view of the Barrier from the Freeport, so we visit here as often as we can sneak by the Bounty Hunters.</TEXT><PARA/><POP/></RDL>'''
446 = '''<RDL><PUSH/><TEXT>There’s a Jump Hole into Cortez from here; that’s how the Rogues get into this system. There’s no way directly into California except through the Gate. It’s been a while since I’ve seen the beautiful skies of Los Angeles.</TEXT><PARA/><POP/></RDL>'''
447 = '''<RDL><PUSH/><TEXT>We produce Oxygen and Water from our ice mining operation to the north of the base, in the Weddell Ice Field. There’s an old Jump Gate out there, owned by the Helion government. They used to use it for long range jump tests.</TEXT><PARA/><POP/></RDL>'''
448 = '''<RDL><PUSH/><TEXT>Gateway brings us our Mining Machinery from Kensington. They also deliver Engine Components, Food, H-Fuel, Consumer Goods, and Pharmaceuticals from Los Angeles.</TEXT><PARA/><POP/></RDL>'''
449 = '''<RDL><PUSH/><TEXT>I’m not supposed to say anything, but there’s a Lane Hacker base in the Barrier Cloud in the west. You’ll also find Jump Holes to Manchester and Cortez. Watch yourself out there. Outcast drug runners will waste you in a second if you don’t know what you’re doing.</TEXT><PARA/><POP/></RDL>'''
450 = '''<RDL><PUSH/><TEXT>We ship some of our Oxygen and Water to Sheffield Station in Manchester and bring back Pharmaceuticals and Consumer Goods.</TEXT><PARA/><POP/></RDL>'''
451 = '''<RDL><PUSH/><TEXT>The Lane Hackers and Rogues land here to get supplies. The Bounty Hunters are always hovering around the station, watching their prey mosey right by them. That’s the way it is with Freeports.</TEXT><PARA/><POP/></RDL>'''
452 = '''<RDL><PUSH/><TEXT>The Lane Hackers and Ashbound prefer the safety of the Barrier Clouds for their attacks. The bloody Rogues don’t care — they’ll attack shipping in the Weddell Field, until the Helion Navy shows up from the California Gate.</TEXT><PARA/><POP/></RDL>'''
453 = '''<RDL><PUSH/><TEXT>The bulk of the Water mined here goes to the terraforming operation on California Minor or Los Angeles. It’s cheaper to import it from Magellan than to desalinize their nasty seawater.</TEXT><PARA/><POP/></RDL>'''
454 = '''<RDL><PUSH/><TEXT>The asteroid fields of Magellan were notorious for their unpredictability. The Vesperan government established this base in 220 and called it the Gough Station. Repair and lifter ships were stationed here to assist disabled ships and to remove errant asteroids as they crossed the cleared trade routes.</TEXT><PARA/><POP/></RDL>'''
455 = '''<RDL><PUSH/><TEXT>Those Lane Hackers are a funny bunch. They fancy themselves as the Nacre Reach’s Robin Hoods. They avoid direct confrontation when possible, unless it is the henchmen of the despised IC or Ageira. They like to frequent our base a lot, as that cloudy ice asteroid base of theirs can become a wee bit claustrophobic at times. They are all addicted to Cardamine. They also trade drugs for Trade Lane info with the Ashbound.</TEXT><PARA/><POP/></RDL>'''
456 = '''<RDL><PUSH/><TEXT>With the completion of Trade Lanes across the Barrier by Deep Space in 535, the old Vespera station was no longer needed. The station was officially decommissioned by the Vesperan government and left to drift. Early IMG folks came in around 580 from Larkspur and reopened the place. Been going ever since. It’s our only outpost in the Independent Worlds — a little too close to Helion for our taste.</TEXT><PARA/><POP/></RDL>'''
457 = '''<RDL><PUSH/><TEXT>We haul a lot of Water from here to the California Minor terraforming operation, which is in its final stages. Centuries of ice mining by Los Angeles has depleted almost all of California’s pure ice.</TEXT><PARA/><POP/></RDL>'''
458 = '''<RDL><PUSH/><TEXT>The Rogues are our main problem between here and California. They like to hit you in the asteroid fields or in the Sierra Cloud.</TEXT><PARA/><POP/></RDL>'''
459 = '''<RDL><PUSH/><TEXT>At least we don’t have the Gaian problem in Magellan. That begins in Manchester and is widespread throughout Vesperan space. Not sure how they became so misguided. We’re performing a valuable service for humankind.</TEXT><PARA/><POP/></RDL>'''
460 = '''<RDL><PUSH/><TEXT>There’s a Jump Hole into Manchester just to the west of this base. We often pop through and hang out in the North Sheffield Field, waiting for an unsuspecting Bowex Gold shipment on the Trade Lanes.</TEXT><PARA/><POP/></RDL>'''
461 = '''<RDL><PUSH/><TEXT>The Ashbound are a pretty odd lot. Can’t figure them out sometimes. They wear those funny breathers that act as Cardamine inhalers. In the heat of battle they can give themselves a Cardamine booster with a flick of the wrist. Maybe that’s why they’re such awesome pilots.</TEXT><PARA/><POP/></RDL>'''
462 = '''<RDL><PUSH/><TEXT>Since we know what ships are hauling what, we can hit the Gold freighters and sell the Gold to the Rogues at their Montezuma base in Cortez. This keeps the Rogues pretty happy with us, and oftentimes they do our dirty work, which leaves more time to pursue our own diversions — like dropping Cardamine.</TEXT><PARA/><POP/></RDL>'''
463 = '''<RDL><PUSH/><TEXT>The Ashbound run Cardamine in here from somewhere out in the Tau worlds. They ship it out from here into Helion, with the Rogues handling much of the dangerous work in Cinderwell. We pay a pretty high price even here. If you wanted to make a killing, get in close with the Ashbound and buy some Cardamine further up the stream, closer to the source.</TEXT><PARA/><POP/></RDL>'''
464 = '''<RDL><PUSH/><TEXT>The Ashbound use our base as one of their R &amp; R bases on the long journey into Helion from the Edge Worlds. We trade information for Cardamine, which we need on a daily basis. Funny, we didn’t use to need it all the time like nowadays. We have to take Cardamine with us any time we leave base, as we start to get sick pretty quick otherwise.</TEXT><PARA/><POP/></RDL>'''
465 = '''<RDL><PUSH/><TEXT>We designed the entire USI software system to track ships and their contents throughout the entire Trade Lane network in the Nacre Reach. Ageira didn’t give us a penny extra. So we left and started the Lane Hackers, along with a scanner hardware development group from Colorado. IC uses the USI system to calculate precise shipping insurance rates. With USI there is no cheating, like there was in the old days. The shippers hate it, but they have to insure their shipments. IC and Ageira are quite the pair.</TEXT><PARA/><POP/></RDL>'''
466 = '''<RDL><PUSH/><TEXT>No Lane Hacker has ever been captured. Sure, some of our lackeys have gotten tagged by the police or military, but nobody ever knows enough to finger the Lane Hackers. It just goes to prove that we’re smarter than everyone else. That’s why we left Ageira; we didn’t get the recognition and money we deserved.</TEXT><PARA/><POP/></RDL>'''
467 = '''<RDL><PUSH/><TEXT>In this system we make plenty of raids on valuable shipments traveling between Helion and Vespera. We use the Jump Hole to raid shipments in Cortez that may be trying to bypass Magellan, and the Jump Hole from Cortez to California let’s us get back to our beloved homeland. Financial freedom has its costs, I guess.</TEXT><PARA/><POP/></RDL>'''
468 = '''<RDL><PUSH/><TEXT>Being a Lane Hacker is a commitment to a way of life. I guess some would call us hedonists — maybe we are. We live for pleasure and the moment. I used to work for Ageira and I can tell you that this is a much better way to live. We enjoy the finest things in life — we eat the best foods, we wear the best clothes, and we have the best toys. And the Cardamine… as much Cardamine as you want. If we could just land on Curacao, life would be perfect.</TEXT><PARA/><POP/></RDL>'''
469 = '''<RDL><PUSH/><TEXT>Well, I must admit, the weather here is far superior to that of London — not that I travel much. I’ve been on the Essex chasing down Mollys in Dublin for the past two years. It’s about time they gave me a rest.</TEXT><PARA/><POP/></RDL>'''
470 = '''<RDL><PUSH/><TEXT>The drinks are really cheap here, not like back home where they’re highly taxed. I’m not particularly fond of Helion ale, though. I think I’ll try jet sailing tomorrow; it’s supposed to be a great way to see the planet.</TEXT><PARA/><POP/></RDL>'''
471 = '''<RDL><PUSH/><TEXT>I won a sweepstakes, that’s why I’m here — it’s not something I could afford on a Navy pilot’s salary. I’m originally from Leeds, so oxygen-rich air like they have on Curacao is a definite pleasure. My mood is improving already.</TEXT><PARA/><POP/></RDL>'''
472 = '''<RDL><PUSH/><TEXT>This is one nice place to be based, although those snooty, rich Whiteharbor types don’t seem to like us much. Lots of work around here. Rogues, Lane Hackers, Ashbound. We’ve got our hands full in Cortez.</TEXT><PARA/><POP/></RDL>'''
473 = '''<RDL><PUSH/><TEXT>I’m not supposed to tell anyone this, but I’ve had a few. There are some Jump Holes I know of in this system. One is in the southeastern quadrant in the Paloma Cloud, and it leads to California. The other is in the Corcovado Field. That one goes to Magellan.</TEXT><PARA/><POP/></RDL>'''
474 = '''<RDL><PUSH/><TEXT>I just came back from a tough battle in the Roatan Cloud. I was ambushing some Lane Hackers when some Ashbound showed up out of nowhere. Barely got out. My wingman didn’t. I think I’ll need a couple of those Curacao shooters from the bar tonight.</TEXT><PARA/><POP/></RDL>'''
475 = '''<RDL><PUSH/><TEXT>If you know the shipping paths of the Ashbound, you can snag some Cardamine cargos. They don’t give up without a fight, though. Best thing is to find the Jump Hole to California in the Paloma Cloud, then hang out a little to the southwest of it. They’ll be along soon enough.</TEXT><PARA/><POP/></RDL>'''
476 = '''<RDL><PUSH/><TEXT>We do a lot of patrols in this system. There’s a Rogue base somewhere out in the Corcovado Field. Good luck getting close to it. It’s swarming with Rogues, Hackers, and Ashbound.</TEXT><PARA/><POP/></RDL>'''
477 = '''<RDL><PUSH/><TEXT>I’m thinking of starting a side business. Take out some of those soft rich folks from the inner House worlds that have never seen true Indie-world danger. Cruise the clouds, look for some trouble, then hightail it out of there before it gets too hot. What do ya think?</TEXT><PARA/><POP/></RDL>'''
478 = '''<RDL><PUSH/><TEXT>I’m normally based on Glasgow, that’s our corporate headquarters. The Leeds system doesn’t offer the recreational opportunities that this place can. We are close to the cruise ship in Edinburgh, but you can’t land on the planet there.</TEXT><PARA/><POP/></RDL>'''
479 = '''<RDL><PUSH/><TEXT>The reefs here are stupendous. We took the five-day sail and sea package. They dive for all sorts of strange creatures and prepare absolutely amazing meals every night. The night sky is just incredible here. You can see the Barrier in all of its glory stretching off into space.</TEXT><PARA/><POP/></RDL>'''
480 = '''<RDL><PUSH/><TEXT>Bowex is holding its company executive retreat here for the fourth consecutive year. It’s a little dicey getting here, but great once you’ve arrived. They should convert one of those crazy Vesperan terraforming projects into a pleasure planet like this.</TEXT><PARA/><POP/></RDL>'''
481 = '''<RDL><PUSH/><TEXT>I’ve come here every year for the past decade; I love this place. You have to try the undersea trip. If you’re lucky, you might see one of the giant norfins. They’re scary at first, but the sub is well equipped to defend itself.</TEXT><PARA/><POP/></RDL>'''
482 = '''<RDL><PUSH/><TEXT>I work on the Cambridge Research Station — a long ways from Helion and this place. It gets kind of crazy in there after a couple of months of zero-g. Cambridge is nice to visit, but it ain’t like good ’ole Helion, folks. Much better food here.</TEXT><PARA/><POP/></RDL>'''
483 = '''<RDL><PUSH/><TEXT>This is THE place for Helion executives like me to take vacations. You can do a lot of networking here if you want, or you can just sit back and enjoy the good life by the pool.</TEXT><PARA/><POP/></RDL>'''
484 = '''<RDL><PUSH/><TEXT>My ship broke down in the Paloma Cloud yesterday. They’re still working on it, so I’ve got at least another night here to burn on company time. I think I’ll head down to the casino and roll the dice tonight.</TEXT><PARA/><POP/></RDL>'''
485 = '''<RDL><PUSH/><TEXT>This is the best layover you get on Gateway runs. We normally don’t stop here much, but when we do, it’s a nonstop party.</TEXT><PARA/><POP/></RDL>'''
486 = '''<RDL><PUSH/><TEXT>This is the only safe stop in this neck of the woods. Pretty rough on both sides in the clouds. I was stuck here once when the Trade Lane got taken down for a few days. I liked it so much that I try to come back at least once every few years with the missus. The sun’s pretty hot though — I always get burned.</TEXT><PARA/><POP/></RDL>'''
487 = '''<RDL><PUSH/><TEXT>I love this place. They have plenty of gambling, great Food, and lots of oceanic fishing trips — some pretty weird creatures out there. There’s a purple wing fish that literally flies out of the water at you when it gets hooked. Have to carry a shield with you at all times.</TEXT><PARA/><POP/></RDL>'''
488 = '''<RDL><PUSH/><TEXT>It gets a little pricey here, especially if you’ve just lost last month’s salary in the casino. Oh well, there are always the cheap buffets of Luxury Foods like lettuce and potatoes, none of that Synth Paste crap. Now I know how the rich people of Sirius live. The seafood is pretty weird though. They can keep that.</TEXT><PARA/><POP/></RDL>'''
489 = '''<RDL><PUSH/><TEXT>I’m taking a well deserved R&amp;R, compliments of Orbital Spa and Cruise. My patrol saved Orbital’s butt last week on the east Trade Lane to the California Gate. A crew of Rogues was about to make off with a Luxury Goods shipment. We saved the day.</TEXT><PARA/><POP/></RDL>'''
490 = '''<RDL><PUSH/><TEXT>We export our pure Water to Los Angeles, which always needs more than it can get. On the return trip we carry H-Fuel, Pharmaceuticals, Food, and Consumer Goods.</TEXT><PARA/><POP/></RDL>'''
491 = '''<RDL><PUSH/><TEXT>We send patrols out into the eastern fields to keep the considerable criminal population in check. Fortunately, there is a substantial Bounty Hunter contingent based here to provide some sense of security. Unfortunately, their rather crude behavior and offensive odor has been a problem with our regular guests.</TEXT><PARA/><POP/></RDL>'''
492 = '''<RDL><PUSH/><TEXT>We bring in Luxury Goods from Whiteharbor so that our clients can shop in addition to their daily regime of water sports and gambling. The armored transports tend to get attacked quite a bit in the Paloma Cloud.</TEXT><PARA/><POP/></RDL>'''
493 = '''<RDL><PUSH/><TEXT>This is the original home of Orbital Spa and Cruise, founded in 475 by Tony Cortez. This was the first planet in the Nacre Reach devoted solely to the pursuit of pleasure. There is now a second in Stuttgart, and several cruise ships in the far reaches of civilized space.</TEXT><PARA/><POP/></RDL>'''
494 = '''<RDL><PUSH/><TEXT>We ship Luxury Food from Larkspur. It’s perishable, so we have to be fast. Only the finest Cambridge organic produce for our discriminating customers.</TEXT><PARA/><POP/></RDL>'''
495 = '''<RDL><PUSH/><TEXT>The unusually high oxygen content of Curacao’s atmosphere has a rejuvenating effect on most of our patrons, which primarily include the Helion wealthy. They can hop a special transport and be here in a matter of days via the Jump Gates and Trade Lanes.</TEXT><PARA/><POP/></RDL>'''
496 = '''<RDL><PUSH/><TEXT>There is no appreciable landmass on this planet. Outside of the hotel platform there is a vast, shallow sea covering the planet. Various water sports are the preferred activity. We also offer submersible expeditions for more adventurous travelers who want to experience the exotic undersea life.</TEXT><PARA/><POP/></RDL>'''
497 = '''<RDL><PUSH/><TEXT>Curacao wasn’t discovered until 465 because of its obscured position in the heart of the Barrier. The </TEXT><TRA italic="true"/><TEXT>Tantulus</TEXT><TRA italic="false"/><TEXT>, a Helion survey ship, accidentally stumbled into the system while researching a new Jump Gate route between Helion and Vespera.</TEXT><PARA/><POP/></RDL>'''
498 = '''<RDL><PUSH/><TEXT>Orbital will normally accept any guest that can pay their way, even a Bounty Hunter. On our </TEXT><TRA italic="true"/><TEXT>Hawaii</TEXT><TRA italic="false"/><TEXT>an ship you can spot Hogosha and even the odd Corsair or two. The Lane Hackers have expressed interest in staying here, but we feel their piracy against our ships is too severe to ignore.</TEXT><PARA/><POP/></RDL>'''
499 = '''<RDL><PUSH/><TEXT>We occasionally ship in Luxury Goods from Los Angeles to supplement those from Orbital Spa.</TEXT><PARA/><POP/></RDL>'''
500 = '''<RDL><PUSH/><TEXT>These Independent Worlds are the roughest areas that Universal has to traverse. At least we don’t have to deal with the Border Worlds. Just last week we lost a shipment to Hackers in the Roatan Cloud.</TEXT><PARA/><POP/></RDL>'''
501 = '''<RDL><PUSH/><TEXT>Our main business on the Vesperan-Libertonian Line is Vesperan Gold, Cinderwell Luxury Goods, and Trade Lane Parts bound for Vespera.</TEXT><PARA/><POP/></RDL>'''
502 = '''<RDL><PUSH/><TEXT>This resort is the first Orbital Spa and Cruise hotel built. They have a second one in the Stuttgart system, but I prefer to be closer to home in case something goes wrong. The hotel is getting a little old, though. I think they should level it and create an artificial island here.</TEXT><PARA/><POP/></RDL>'''
503 = '''<RDL><PUSH/><TEXT>The only time it gets scary here is when there’s a big storm. We were caught in one five years ago — we thought the platform wouldn’t make it. But it’s still standing, so I guess I shouldn’t worry too much.</TEXT><PARA/><POP/></RDL>'''
504 = '''<RDL><PUSH/><TEXT>I heard that some visiting dignitaries were kidnapped en route by Rogues in the Paloma Cloud. That’s unsettling.</TEXT><PARA/><POP/></RDL>'''
505 = '''<RDL><PUSH/><TEXT>This is where we sell our stolen Gold to the Rogues, who run it into Texas and Cinderwell. There the Junkers launder it back into the legit system.</TEXT><PARA/><POP/></RDL>'''
506 = '''<RDL><PUSH/><TEXT>We mainly use Montezuma as a forward tactical base to stage attacks on Trade Lanes in Cortez via the Jump Hole into California. We prefer the safety of the Barrier Clouds, whereas the Rogues will attack almost anywhere.</TEXT><PARA/><POP/></RDL>'''
507 = '''<RDL><PUSH/><TEXT>We’d like to use the hotel on Curacao. Orbital Spa and Cruise wouldn’t care if we did, but IC won’t insure any Trade Lane shipping in this system. Besides, there are too many Bounty Hunters lurking around the hotel. They give me the creeps.</TEXT><PARA/><POP/></RDL>'''
508 = '''<RDL><PUSH/><TEXT>The Rogues are a simple lot. We don’t really have much in common with them, except maybe the love of Cardamine. Most Rogues are products of the Helion penal system. We’re too smart to get caught by the LPI or Navy. We’d rather die than set foot in Texas.</TEXT><PARA/><POP/></RDL>'''
509 = '''<RDL><PUSH/><TEXT>The Ames Research Station is the main supply source for our base in Galileo. We ship all the essentials like Food, H-Fuel, Water, Oxygen, Pharmaceuticals, Engine Components, and Consumer Goods there.</TEXT><PARA/><POP/></RDL>'''
510 = '''<RDL><PUSH/><TEXT>The Jump Hole to Galileo is directly between the edges of the Kuryo and Matsuo Clouds. Aim for the gap and you won’t miss it.</TEXT><PARA/><POP/></RDL>'''
511 = '''<RDL><PUSH/><TEXT>We like to hit Niobium and other high-value shipments coming through this system. Unfortunately, the misguided Xenos and scumbag Bounty Hunters are often lurking, so we have to be careful — especially when we leave the no-fire zone around the station.</TEXT><PARA/><POP/></RDL>'''
512 = '''<RDL><PUSH/><TEXT>This base keeps the northern Xeno alliance alive. Those Zoners are our saviors, although they share the base with those vile Bounty Hunters — the scourge of the Nacre Reach. We ship supplies from here to our Denko Cloud base — basic needs, such as Food, H-Fuel, Oxygen, Pharmaceuticals, and Water.</TEXT><PARA/><POP/></RDL>'''
513 = '''<RDL><PUSH/><TEXT>We share this system with those posh Lane Hackers. They attract the Helion Navy ’cause Ageira despises them. It’s a nice dark system — lots of places to hide. But you gotta have a decent shield if you want to hang out in the clouds ’cause of all the radiation from that dark matter, or whatever they call it.</TEXT><PARA/><POP/></RDL>'''
514 = '''<RDL><PUSH/><TEXT>Samura and Kishiro make lots of supply runs through here, inbound for Colorado. Universal makes Side Arm shipments sometimes; that’s the only time we get interested in Helion shipping.</TEXT><PARA/><POP/></RDL>'''
515 = '''<RDL><PUSH/><TEXT>We make supply runs to Deshima for essential Commodities such as Oxygen, Water, H-Fuel, Consumer Goods, Food, Engine Components, and Pharmaceuticals.</TEXT><PARA/><POP/></RDL>'''
516 = '''<RDL><PUSH/><TEXT>The Ames Independent Research Station was established in 550 to study the Kuryo Anomaly in preparation for the construction of Trade Lanes by Deep Space Engineering. Jump Gates couldn’t bypass this system because of the danger in traversing the dark matter clouds of the Anomaly — a lesson painfully learned in the Texas Incident.</TEXT><PARA/><POP/></RDL>'''
517 = '''<RDL><PUSH/><TEXT>Lane Hackers partly owe their origin to the Ames Research studies, which predicted that a huge storm would disrupt the system in 680. On the advice of Ageira technicians, Helion financed a costly alternative Trade Lane through Galileo. When the storm didn’t materialize, Ageira tried to redeem itself by ruthlessly ousting an elite development team and several executives, who re-emerged as the core of the northern Lane Hackers.</TEXT><PARA/><POP/></RDL>'''
518 = '''<RDL><PUSH/><TEXT>The criminals in the area use our base as a supply point. Lane Hackers and Xenos come here to buy various supplies.</TEXT><PARA/><POP/></RDL>'''
519 = '''<RDL><PUSH/><TEXT>The Zoners occupied the research station soon after it was opened and eventually took over its operation when the research phase was complete. It’s a difficult place, as the clouds are constantly on the move and could someday engulf the Freeport.</TEXT><PARA/><POP/></RDL>'''
520 = '''<RDL><PUSH/><TEXT>There’s an old Trade Lane route through this system that was damaged during a storm around 20 years ago. People say there are some old shipwrecks along it.</TEXT><PARA/><POP/></RDL>'''
521 = '''<RDL><PUSH/><TEXT>Beware of the dark matter clouds. They have radiation and hide criminals. The Matsuo Cloud is named after the original Orsena explorer of this area, long before Jump Gates and Trade Lanes.</TEXT><PARA/><POP/></RDL>'''
522 = '''<RDL><PUSH/><TEXT>The Trade Lane path through the sister system of Kepler, Galileo, was constructed mainly as an insurance policy in case the Kepler Trade Lane was ever severed, something that Helion and Orsena could not allow to happen.</TEXT><PARA/><POP/></RDL>'''
523 = '''<RDL><PUSH/><TEXT>This base serves as our strategic center of operations for the northern Xenos. Not exactly the most scenic place, but us Xenos can tough it out. We supply the Xeno asteroid base in Colorado with basic supplies such as Food, H-Fuel, and Water; in return, they periodically ship us stolen Side Arms.</TEXT><PARA/><POP/></RDL>'''
524 = '''<RDL><PUSH/><TEXT>Our base here is right next to the Jump Hole to Colorado and provides easy access to the Trade Lane from Shikoku, so we can attack Orsena shipping. Once we jump into Colorado we can hit Republican, Samura, and Kishiro as they transport supplies to Ageira. Gotta watch out for those Bounty Hunters, though. They always seem to be lurking out there.</TEXT><PARA/><POP/></RDL>'''
525 = '''<RDL><PUSH/><TEXT>We might not have the best equipment or ships, but we’re a lot better organized than we were. It was getting so bad that LPI and the Navy almost won and ripped us out of Colorado. Now we have a focused agenda: we lift supplies from Orsena shipping, a little extortion here and there, switch out tired combat crews from Ouray, and then give them the supplies they need to continue the fight.</TEXT><PARA/><POP/></RDL>'''
526 = '''<RDL><PUSH/><TEXT>This area is real stormy. The cloud has moved a lot since we carved this base out of the rock. Lots of dark matter in the area, so ya got to pop those Cryer anti-radiation pills daily. Good thing we can occasionally steal shipments, otherwise we’d be broke and the Zoners on Ames very rich.</TEXT><PARA/><POP/></RDL>'''
527 = '''<RDL><PUSH/><TEXT>The Helion Navy closely patrols the southern Trade Lane in this system; it’s risky to attack too near the Gate. The best spots are about halfway between the Shikoku or Colorado Gates and the Ames Station. Not too many Bounty Hunters or military in the middle — plenty of time to escape.</TEXT><PARA/><POP/></RDL>'''
528 = '''<RDL><PUSH/><TEXT>We’re unable to establish the exact location, but we think there’s a Jump Hole between the Kuryo and Matsuo Clouds. That’s how the Lane Hackers get into the system. We’d love to shut it down, but we have to find it first. A lot of Bounty Hunters are out there, which makes poking around difficult.</TEXT><PARA/><POP/></RDL>'''
529 = '''<RDL><PUSH/><TEXT>The vile Bounty Hunters are everywhere in this system. They’re worse than the LPI because they follow only one rule: Secure proof for every Xeno vaporized. They evidently know about the Jump Holes and always hang out in the no-fire zone around Ames. They often ambush us on supply hauls, so we usually send rookies to limit our losses.</TEXT><PARA/><POP/></RDL>'''
530 = '''<RDL><PUSH/><TEXT>Our numbers are growing, and in time we will be strong enough to stop all foreign shippers from crossing this system. The Orsena corporations must understand that it is not worth the money they earn to ship their goods into Helion.</TEXT><PARA/><POP/></RDL>'''
531 = '''<RDL><PUSH/><TEXT>A lot of the Xenos you see here in Kepler have spent time in Texas making toys while we serve our time at “The Walls” — that’s what we call the Huntsville prison ship. But once we got released, we came back here. The Xenos in Texas and Hudson do an alright job attacking Dornmark, but somebody’s gotta be up here stopping the Orsena from getting into Helion.</TEXT><PARA/><POP/></RDL>'''
532 = '''<RDL><PUSH/><TEXT>We run supply shipments of Food, Luxury Goods, Side Arms, Pharmaceuticals, Engine Components, and Consumer Goods to our base in Hokkaido. It’s a long, dangerous run past the Farmers Alliance in Kyushu and the Bounty Hunters of Shikou, but well worth it financially.</TEXT><PARA/><POP/></RDL>'''
533 = '''<RDL><PUSH/><TEXT>Down here we run Cardamine and H-Fuel from our base in Hokkaido in exchange for many of our basic supplies. Leiden indirectly supplies the Blood Dragon base in Chugoku via Ainu. That’s the real reason we have to make so many runs down to this alien place. They often protect us from hostile attacks, so it’s worth it.</TEXT><PARA/><POP/></RDL>'''
534 = '''<RDL><PUSH/><TEXT>The Jump Hole to Shikoku is very close, just to the north of this base. It is the first of three jumps to get to the dangerous but beautiful Hokkaido system.</TEXT><PARA/><POP/></RDL>'''
535 = '''<RDL><PUSH/><TEXT>We receive Side Arms from the Rogue base Padua in the Reppu Cloud and ship Food, Pharmaceuticals, Engine Components, Consumer Goods, Oxygen, and Water there.</TEXT><PARA/><POP/></RDL>'''
536 = '''<RDL><PUSH/><TEXT>Although we sell much of the information we retrieve from Universal’s data banks, we use some of the data ourselves to attack the most tempting targets. There are three Jump Holes in this system. The two most valuable to the Lane Hackers are the Jump Holes to Colorado and Kepler.</TEXT><PARA/><POP/></RDL>'''
537 = '''<RDL><PUSH/><TEXT>Ageira wonders how we can keep up with its advances in Trade Lane technology and security. Truth is, everybody who was sympathetic to the Lane Hackers didn’t necessarily stop working for Ageira. That’s right — we’ve got insider friends who keep us one step ahead of the game.</TEXT><PARA/><POP/></RDL>'''
538 = '''<RDL><PUSH/><TEXT>We get shipments of H-Fuel from the Golden Chrysanthemums in Hokkaido and ship them Food, Side Arms, Pharmaceuticals, Engine Components, and Luxury Goods. Those Golden Cs love their Luxury Goods.</TEXT><PARA/><POP/></RDL>'''
539 = '''<RDL><PUSH/><TEXT>The Golden Chrysanthemums get most of their supplies from us. We keep them living in the style that they are accustomed to. In return, they supply us with all the Cardamine we can use from their Hokkaido base.</TEXT><PARA/><POP/></RDL>'''
540 = '''<RDL><PUSH/><TEXT>Cardamine has changed my life. It’s the greatest stuff you can imagine. You have really strange hallucinations with heavy doses — flying across alien landscapes, seeing creatures and places that you can’t imagine. It’s truly an amazing trip. I’ve noticed that I’m gradually losing interest in eating regular old Synth Paste. I’ve heard that Outcast Food is more palatable to heavy Cardamine users. Not sure why.</TEXT><PARA/><POP/></RDL>'''
541 = '''<RDL><PUSH/><TEXT>We get most of our basic supplies — such as Food, Pharmaceuticals, Engine Components, Consumer Goods, Oxygen, and Water — from the Zoner Ames Research Station.</TEXT><PARA/><POP/></RDL>'''
542 = '''<RDL><PUSH/><TEXT>This base serves as the primary trans-shipment point for Artifacts inbound from Sigma-17. The Hogosha run them through Orsena space, terminating their long run here. The Rogues then haul the Artifacts into Rochester via their base in the southern end of the system. Don’t know why people love those Artifacts so much.</TEXT><PARA/><POP/></RDL>'''
543 = '''<RDL><PUSH/><TEXT>The Lane Hackers are disinterested in politics. We do not fight for any cause or rally behind a flag. The only thing that is important to a Hacker is money so that any wants are fulfilled.</TEXT><PARA/><POP/></RDL>'''
544 = '''<RDL><PUSH/><TEXT>This is the end of our Artifact smuggling route that begins in the Border Worlds and crosses all of Orsena space. We don’t like to see the Golden Chrysanthemums here, but we have no choice if we want to sell these trinkets to the rich Helion fools on Whiteharbor. The Lane Hackers seem okay, though — nothing like those disgusting Rogues.</TEXT><PARA/><POP/></RDL>'''
545 = '''<RDL><PUSH/><TEXT>This is the cheapest place to buy Side Arms within Hogosha territory, if you can call this black rock fragment in a dark matter cloud “territory” in the conventional sense. Within Orsena space Side Arms cost considerably more.</TEXT><PARA/><POP/></RDL>'''
546 = '''<RDL><PUSH/><TEXT>We use the Jump Hole to Shikoku, then skirt the west end of the system through the nebula clouds to avoid detection by the Jade Vow — our mortal enemies. The police and Bounty Hunters rarely bother us. At the far end of Shikoku is a Jump Hole to Kyushu, followed shortly by a Hole to Sablecross. Very convenient.</TEXT><PARA/><POP/></RDL>'''
547 = '''<RDL><PUSH/><TEXT>Since this base is pretty remote we have to get almost everything shipped to us from Beaumont. Aside from our basic supplies of Food, Water, and Oxygen, we receive H-Fuel, Pharmaceuticals, Consumer Goods, and Side Arms from Beaumont.</TEXT><PARA/><POP/></RDL>'''
548 = '''<RDL><PUSH/><TEXT>Every Rogue likes his gun collection. Most Rogues have several pieces of Detroit death machinery, so we need to supplement our Side Arm shipments from Beaumont with extra shipments from Buffalo.</TEXT><PARA/><POP/></RDL>'''
549 = '''<RDL><PUSH/><TEXT>The Diamonds we get here from the Dornmark Unioner folk are shipped to Buffalo or Beaumont. They make us a lot of money in Cinderwell.</TEXT><PARA/><POP/></RDL>'''
550 = '''<RDL><PUSH/><TEXT>The Helion Navy patrols the Trade Lanes from Hamburg to Texas that run through this system. They’ve tried to clear us out many times, but there are too many places to hide. That’s why Hudson will always belong to the outlaws.</TEXT><PARA/><POP/></RDL>'''
551 = '''<RDL><PUSH/><TEXT>The Xenos and Unioners have been killing each other in this system. The Xeno base is in the Wrangell Field just north of this field, and the Unioners come here to trade Diamonds with us. I don’t care who gets fried as long as the Diamonds keep coming in.</TEXT><PARA/><POP/></RDL>'''
552 = '''<RDL><PUSH/><TEXT>If you want to get into Dornmark space without attracting much attention, just pop through the Jump Hole in the field east of this base. It will take you right into Hamburg.</TEXT><PARA/><POP/></RDL>'''
553 = '''<RDL><PUSH/><TEXT>I hear Helion had plans for making this system the main trade route from Dornmark into Texas because of all the drifting asteroid problems in Bering.</TEXT><PARA/><POP/></RDL>'''
554 = '''<RDL><PUSH/><TEXT>There must have been plans for making use of the planet Atka here in this system. A Planetform ship came in here to scope out the planet. Then the Xenos swooped in on ’em and blew the ship up. Those Xenos are a crazy bunch, but they crack me up. Heh heh, no more Planetform types have come back here yet.</TEXT><PARA/><POP/></RDL>'''
555 = '''<RDL><PUSH/><TEXT>Some of the Xenos we run into have dropped hints about trying to get in on the Diamond trade, but it ain’t gonna happen. Diamonds come from Dornmark, and nobody from Dornmark is going to do business with the Xenos, and vice versa. Bad for them; good for us.</TEXT><PARA/><POP/></RDL>'''
556 = '''<RDL><PUSH/><TEXT>The Diamonds that the Unioners bring to this base eventually arrive in Whiteharbor for sale on the black market. That’s what the Bounty Hunters are really after. Most of the bounties offered by Republican are pretty small.</TEXT><PARA/><POP/></RDL>'''
557 = '''<RDL><PUSH/><TEXT>The Unioners are forced to operate on the edges of Dornmark space, not only because of the Dornmark authorities, but also because of another criminal group within Dornmark: the Cinder Guard.</TEXT><PARA/><POP/></RDL>'''
558 = '''<RDL><PUSH/><TEXT>With their old union destroyed after the Popular Revolt, the Unioners reformed to become what they are today: political criminals dedicated to making Republican Shipping pay for the wrongs it committed against its workers.</TEXT><PARA/><POP/></RDL>'''
559 = '''<RDL><PUSH/><TEXT>We ship the Water and Oxygen produced at this base to Montezuma in Cortez. The other supplies this base trades in are also sent to Montezuma, including Food, Pharmaceuticals, Engine Components, H-Fuel, and Consumer Goods.</TEXT><PARA/><POP/></RDL>'''
560 = '''<RDL><PUSH/><TEXT>Making the run to Freeport 4 for supplies can get dangerous — we gotta leave the cover of the Barrier, and Bounty Hunters are all over the place, but it needs to be done.</TEXT><PARA/><POP/></RDL>'''
561 = '''<RDL><PUSH/><TEXT>There are Jump Holes to Manchester and Cortez hidden in the Barrier in the western half of the system. The Manchester Hole is just north of the Lane Hacker base; the Cortez Hole is even further north.</TEXT><PARA/><POP/></RDL>'''
562 = '''<RDL><PUSH/><TEXT>Bounty Hunters and the Helion Navy patrol the gap between the Weddell Ice Field and the Barrier. That’s where we have to go to get supplies, but if you wanna do a little piracy, it’s better to hit the Trade Lanes as they pass into the Barrier. Stay in protected space as much as you can if you don’t want company from the Navy or Hunters.</TEXT><PARA/><POP/></RDL>'''
563 = '''<RDL><PUSH/><TEXT>Most of the corporate types in Helion hate the Rogues, but the truth is, the suits are the ones who made us. You think I’d be doing this if I could have made it in their world? The only choice I had was to become a Rogue or burn my life away in the Boron mines of Breakwater. If you aren’t born into a company, you aren’t going anywhere but the slag pile.</TEXT><PARA/><POP/></RDL>'''
564 = '''<RDL><PUSH/><TEXT>The Junkers don’t take a lot of new blood these days; they have their own inner circle. The LPI are corporate lap dogs, the Lane Hackers are rich corporate types turned bad, and the Ashbound — hell, they aren’t even human anymore. It was Rogues or nothing for me.</TEXT><PARA/><POP/></RDL>'''
565 = '''<RDL><PUSH/><TEXT>This base requires that all of its supplies come in from the IMGers at Freeport 4. We bring Water, H-Fuel, Oxygen, Food, Pharmaceuticals, Engine Components, and Consumer Goods from there.</TEXT><PARA/><POP/></RDL>'''
566 = '''<RDL><PUSH/><TEXT>A lot of money flows into this system from Helion and Vespera. All the Manhattanites come to Curacao to drink and snob it up. Sometimes their luxury transports don’t always make it. And we are happy to lift the Commodities between the two Houses that cross our paths.</TEXT><PARA/><POP/></RDL>'''
567 = '''<RDL><PUSH/><TEXT>We juice up on much of the Cardamine that the Ashbound bring here. They take the rest with them as they go into Helion, or we send it out ourselves to pay for what we use. From here we ship Cardamine to Buffalo, Alcatraz, and Beaumont.</TEXT><PARA/><POP/></RDL>'''
568 = '''<RDL><PUSH/><TEXT>When we head to Alcatraz to deliver Gold, we pick up Side Arms to bring back here. That way our esteemed guests can haul weaponry to the far edges of Sirius.</TEXT><PARA/><POP/></RDL>'''
569 = '''<RDL><PUSH/><TEXT>There’s a Jump Hole into California in the Paloma Ice Clouds just south of the Jump Gate. If you’re trying to move some illegals and wanna stay clean of the scans, then that’s the way to get into California.</TEXT><PARA/><POP/></RDL>'''
570 = '''<RDL><PUSH/><TEXT>Things got a little frosty around here last week. An Outcast killed one of ours for accidentally alerting some Bounty Hunters to his location. When the Outcast landed, the kid’s best friend stood up to the masker. The Outcast, without saying a word, pulled a Detroit Pocket Canon and blew him in half.</TEXT><PARA/><POP/></RDL>'''
571 = '''<RDL><PUSH/><TEXT>The Gold we get from the Lane Hackers is shipped to Alcatraz. Eventually it will make its way into Cinderwell.</TEXT><PARA/><POP/></RDL>'''
572 = '''<RDL><PUSH/><TEXT>Our base is fairly well hidden here in the Corcovado. It’s useful to know that there is a Jump Hole into Magellan in this ice cloud, too. From Magellan there’s a Jump Hole to Manchester, so you can cross into Vespera space unscanned if you need to.</TEXT><PARA/><POP/></RDL>'''
573 = '''<RDL><PUSH/><TEXT>I love seeing the Outcast ship landing on this base. Some folks get so excited when he drops the inbound call that they fly out to meet him. Once one our greeters blew the Outcast’s cover and put a couple of Bounty Hunters on him. When the mask breather was done smoking the two Hunters, he vaped the poor kid, too. Things got worse when he landed.</TEXT><PARA/><POP/></RDL>'''
574 = '''<RDL><PUSH/><TEXT>The Xenos in this system are on their way out. We kill and capture more than they can replace; most of them reside in their southern bases on the other side of Cinderwell. Besides, they’re easy to pick off, and they have to come to this base to get supplies.</TEXT><PARA/><POP/></RDL>'''
575 = '''<RDL><PUSH/><TEXT>The Lane Hackers in this system are former Ageira personnel who got panned after the Kepler Storm scandal cost IC and Ageira an untold fortune. Now they are making Ageira and IC pay an even dearer price for making them take the fall.</TEXT><PARA/><POP/></RDL>'''
576 = '''<RDL><PUSH/><TEXT>If you’re looking for Xenos, you’ll find them in the Denko Cloud on the western side of this system. If you keep going southwest past the cloud, you might run into a Jump Hole leading into Colorado.</TEXT><PARA/><POP/></RDL>'''
577 = '''<RDL><PUSH/><TEXT>This system and Galileo are as far north as I like to go unless I’m cruising up along the Edge Worlds. I don’t like going into Orsena space, and the Orsena don’t like me there either. Their word for non-Orsena is Gaijin, which means outsider or stranger.</TEXT><PARA/><POP/></RDL>'''
578 = '''<RDL><PUSH/><TEXT>In the east of this system between the Kuryo and Matsuo Clouds, you can find a Jump Hole leading to Galileo — and Hacker territory.</TEXT><PARA/><POP/></RDL>'''
579 = '''<RDL><PUSH/><TEXT>Xenos do a lot of their pirating in Colorado. You’ll find Lane Hackers there, too. Going north into Shikoku and beyond, you will run into the Orsena criminals such as the Golden Chrysanthemums, Jade Vow, and Hogosha.</TEXT><PARA/><POP/></RDL>'''
580 = '''<RDL><PUSH/><TEXT>We sell the Xenos the supplies they need. They’re different from us — that’s certain — but we try and get along with everybody. They’ve been making trouble for Orsena shipping, and I’ve heard that the Orsena military has been vaporizing them here and there. But they keep coming and getting their supplies.</TEXT><PARA/><POP/></RDL>'''
581 = '''<RDL><PUSH/><TEXT>The Bounty Hunters here are a rough lot. I heard them joking about how they killed a group of Xenos in the Denko Cloud a few days ago. It sounds like Bounty Hunters really enjoy doing their job; it’s just frightening how much they enjoy it.</TEXT><PARA/><POP/></RDL>'''
582 = '''<RDL><PUSH/><TEXT>Xenos won’t mess with Helion too much. They are more concerned with foreigners coming into Helion space, so that’s who they tend to attack. They’ve been squeezed hard in Colorado, which explains why they’ve set up a base here in Kepler.</TEXT><PARA/><POP/></RDL>'''
583 = '''<RDL><PUSH/><TEXT>Padua receives the supplies we get from the Lane Hackers at this base. Padua requires the importation of all of its vital supplies, including Food, Side Arms, Engine Components, Pharmaceuticals, H-Fuel, Consumer Goods, Oxygen, and Water.</TEXT><PARA/><POP/></RDL>'''
584 = '''<RDL><PUSH/><TEXT>The Artifacts that the Lane Hackers receive from the Hogosha at this base are taken by us to Rochester or to Padua.</TEXT><PARA/><POP/></RDL>'''
585 = '''<RDL><PUSH/><TEXT>The Golden Chrysanthemums that hang out at this base are into their Luxury Goods, probably the daughters of rich Samura and Kishiro executives in Orsena. I like ’em. They’re all into Cardamine and stealing — my two favorite past times.</TEXT><PARA/><POP/></RDL>'''
586 = '''<RDL><PUSH/><TEXT>The Lane Hackers’ Leiden base provides us with all of our supplies. Their base is located in the Komatsu Cloud due north of the Reppu Cloud that hides this base.</TEXT><PARA/><POP/></RDL>'''
587 = '''<RDL><PUSH/><TEXT>We make a run to Leiden every third week to pick up the essentials that keep this base going: Waters, Consumer Goods, H-Fuel, Engine Components, Pharmaceuticals, and Food.</TEXT><PARA/><POP/></RDL>'''
588 = '''<RDL><PUSH/><TEXT>There are two Jump Holes in the Komatsu Cloud, which hides the Lane Hackers’ Leiden base. The northern Jump Hole leads to Shikoku, the other to Kepler.</TEXT><PARA/><POP/></RDL>'''
589 = '''<RDL><PUSH/><TEXT>Rochester has plenty of Side Arms to sell, so we pick them up and run them here. The Side Arms we bring in usually head on over to Leiden, where we trade the Lane Hackers for cash or info on ship cargoes headed through the system.</TEXT><PARA/><POP/></RDL>'''
590 = '''<RDL><PUSH/><TEXT>We ship Artifacts to this base from Leiden. They are highly illegal, and the LSF will smoke you if you get scanned with ’em. But the demand is high on Whiteharbor’s black market, all the Manhattanites love ’em. From here we ship them out to Rochester.</TEXT><PARA/><POP/></RDL>'''
591 = '''<RDL><PUSH/><TEXT>We don’t like dealing with the Hogosha, and they don’t like dealing with us. But we get along with the Lane Hackers alright, and they cut us into the Artifact trade.</TEXT><PARA/><POP/></RDL>'''
592 = '''<RDL><PUSH/><TEXT>Watch the black matter in the system. If you fly into some, you aren’t gonna fly back out. Black matter is what led to all the Trade Lane trouble with Ageira and the corporate venture that blew up in its face. To pin it on somebody, Ageira canned a few of its top-level execs and a development team; those guys now operate the Hacker base in Leiden.</TEXT><PARA/><POP/></RDL>'''
593 = '''<RDL><PUSH/><TEXT>The Lane Hackers appreciate the good things in life — the Cardamine — just like us; difference is, they got things all figured out. Me, I’m just having fun. After my last trip through the Huntsville I didn’t really care what happened to me, I only knew I’d be damned if I was gonna play by the rules anymore.</TEXT><PARA/><POP/></RDL>'''
594 = '''<RDL><PUSH/><TEXT>One of our guys was gonna rat the Hackers out to a Hunter that had credits to burn. He didn’t make it to the rendezvous. The Hackers are too valuable to us to scrape for some temporary cash. Too bad I was the one who had to smoke one of our own.</TEXT><PARA/><POP/></RDL>'''
595 = '''<RDL><PUSH/><TEXT>Caught a Junker stealing some Superconductors from the Baltimore storage depots yesterday. He dropped it and ran. I let him go. Not worth the trouble.</TEXT><PARA/><POP/></RDL>'''
596 = '''<RDL><PUSH/><TEXT>Let me tell you, never stray into Zone 21. One of our patrols got off course chasing some Rogues. They went straight into the mine field and got heavily damaged. Then the Navy flyboys showed up and started shooting, no questions asked. One of the LPI guys didn’t make it home that night. No apology or nothing from them military folks.</TEXT><PARA/><POP/></RDL>'''
597 = '''<RDL><PUSH/><TEXT>Ft. Bush has been around since anyone can remember. Plenty of action around here, but not like Texas or the Tahoe Cloud in California. That suits me fine. Kind of miss the planetside life to go home to at night, like the Whiteharbor boys.</TEXT><PARA/><POP/></RDL>'''
598 = '''<RDL><PUSH/><TEXT>The Xenos sometimes hit the Detroit Trade Lanes, mostly after foreigners. We never bring them in, ’cause if you send one Xeno to Texas, three come back out. Best to just vaporize them on the spot.</TEXT><PARA/><POP/></RDL>'''
599 = '''<RDL><PUSH/><TEXT>Whiteharbor says we have to snag a dozen Rogues a day there. That’s a pretty tall order. Guess they’re getting shorthanded on the assembly lines in Texas. Looks like I’ll be hanging out in the Breakwater Debris Field for the next few days.</TEXT><PARA/><POP/></RDL>'''
600 = '''<RDL><PUSH/><TEXT>I’m thinking of joining the Charter Guild. They always have the best stories, and you get paid much better to boot. Sure, some of them did time in Huntsville or Sugarland, but it ain’t always their fault with all the LPI roundups going on all the time.</TEXT><PARA/><POP/></RDL>'''
601 = '''<RDL><PUSH/><TEXT>We bring in Superconductors and Super Alloys from Pueblo. Samura and Kishiro then ship them off to Orsena. We purchase basic supplies for the return trip, like H-Fuel, Oxygen, Water, and Food.</TEXT><PARA/><POP/></RDL>'''
602 = '''<RDL><PUSH/><TEXT>Denver is the site of our USI scanner hardware R&amp;D division. A while back a bunch of high-level employees got forced out after a big screw-up. They drifted up into Galileo and set up base, calling themselves Lane Hackers. Nothing but trouble on the Trade Lanes ever since.</TEXT><PARA/><POP/></RDL>'''
603 = '''<RDL><PUSH/><TEXT>Just came in from Detroit with a Side Arms shipment. Colorado is one of our toughest runs. All those damned Xenos. We get attacked almost every time in the Silverton Field.</TEXT><PARA/><POP/></RDL>'''
604 = '''<RDL><PUSH/><TEXT>I just got back from a tough run into the Alamosa Field. It was swarming with Rogues and Hackers. They must have a Hole somewhere up there. Bagged me two Rogues, though. Not a bad day’s work. Way better than my old job at LPI.</TEXT><PARA/><POP/></RDL>'''
605 = '''<RDL><PUSH/><TEXT>The Xenos have a base down in the Silverton Field. Pretty easy to bag ’em around there, but the bounty isn’t that good, so I don’t bother. Guess they don’t piss off the powers that be enough.</TEXT><PARA/><POP/></RDL>'''
606 = '''<RDL><PUSH/><TEXT>I’ve heard the Rogues make smuggling runs from the Galileo Hole across the east side of the system to the Cinderwell Hole. If you figure out their route, you can ambush them pretty easy.</TEXT><PARA/><POP/></RDL>'''
607 = '''<RDL><PUSH/><TEXT>There’s a couple of Holes into this system. Us Bounty Hunters aren’t supposed to tell anyone about them, but you look okay to me. The first one is in the northern end of the Alamosa Field; it goes to Galileo. There’s another one into Kepler from the Copperton Field. The Xenos use that one a lot.</TEXT><PARA/><POP/></RDL>'''
608 = '''<RDL><PUSH/><TEXT>I’m heading off to Galileo after I rest up. Now that’s some intense action up there. All those dark matter clouds, crawling with baddies. You definitely want to have a good shield and a killer ship in the Indie Worlds. This is child’s play here in Helion.</TEXT><PARA/><POP/></RDL>'''
609 = '''<RDL><PUSH/><TEXT>My buddy works for the LPI. I used to, but it was lousy pay and a bunch of corporate crap. I prefer the freelance life of a Bounty Hunter. You can make a killing at this, if you don’t get killed first. He’ll still be doing time with LPI when I’m retired and sipping a California Breeze on the beach in L.A.</TEXT><PARA/><POP/></RDL>'''
610 = '''<RDL><PUSH/><TEXT>Denver is home to Cryer’s headquarters and largest drug-production facility. We distribute the Pharmaceuticals ourselves within Helion to Houston, Whiteharbor, and Los Angeles, but lack the advanced ships to risk the Independent World crossings.</TEXT><PARA/><POP/></RDL>'''
611 = '''<RDL><PUSH/><TEXT>We have several other research and limited-production bases. One is out in Sigma-17. Rough area, that is. Ashbound and Rift Captains. Company pays very well out there — takes out big life insurance policies on anyone that gets assigned. They prefer single types.— less to pay out, you know.</TEXT><PARA/><POP/></RDL>'''
612 = '''<RDL><PUSH/><TEXT>We just arrived from Los Angeles with a load of Hydrocarbons and Polymers for Pharmaceutical production. Thought I’d catch a drink before headin’ back out. At least Helion is relatively safe. Some of our research stations are way out there, in harm’s way.</TEXT><PARA/><POP/></RDL>'''
613 = '''<RDL><PUSH/><TEXT>We ship Pharmaceuticals produced here to Deshima, along with Superconductors bound for our Yukawa commercial shipyard in Honshu.</TEXT><PARA/><POP/></RDL>'''
614 = '''<RDL><PUSH/><TEXT>Those cursed Xenos are a serious problem for us in Colorado and Kepler. We’ve lobbied the Helion government to step up patrols, but that has proved unsatisfactory. The Xenos seem to attack only Orsena ships, not Helion commerce. We don’t understand their hatred for us.</TEXT><PARA/><POP/></RDL>'''
615 = '''<RDL><PUSH/><TEXT>We bring in Engine Components from Honshu, Optronics and Food from Deshima, and H-Fuel from our new base Ogashawa in the Sigma-19 system.</TEXT><PARA/><POP/></RDL>'''
616 = '''<RDL><PUSH/><TEXT>I’m on R&amp;R from the </TEXT><TRA italic="true"/><TEXT>Rio Grande</TEXT><TRA italic="false"/><TEXT>. That’s the battleship out by Gunnison. If we weren’t around, those worthless LPI drones wouldn’t even bother to patrol the areas they do. We take care of the Independent World patrols, too. That’s another story. It’s no joke out there.</TEXT><PARA/><POP/></RDL>'''
617 = '''<RDL><PUSH/><TEXT>We nailed a Xeno raiding party in the Copperton Field the other day. It was a turkey shoot. Normally we don’t even bother with them that much, but the Orsena government had been raising a stink about Helion not taking the Xenos seriously enough. It’s true, outside of an odd Side Arms shipment, they don’t really harass Helion shipping.</TEXT><PARA/><POP/></RDL>'''
618 = '''<RDL><PUSH/><TEXT>I’m about to turn around and head back out on patrol to the Rio Grande. We patrol the east-west line. LPI covers the two other Lanes out of Denver. Personally, I think they should let us patrol the whole system, leave nothing to those incompetents.</TEXT><PARA/><POP/></RDL>'''
619 = '''<RDL><PUSH/><TEXT>We’ve cleaned out almost all of the economic undesirables from this planet. Still a few hanging on up in the hills, but we’ll root ’em out and put them to work in the Texas prison factories soon enough.</TEXT><PARA/><POP/></RDL>'''
620 = '''<RDL><PUSH/><TEXT>We patrol the Trade Lanes in the eastern half of the system; the Navy boys the west side. Mostly Xenos in their part of the system. We get more Rogues on this side. Also get a few Lane Hackers in the Alamosa Field.</TEXT><PARA/><POP/></RDL>'''
621 = '''<RDL><PUSH/><TEXT>Caught myself a Rogue smuggling Artifacts behind Denver in the Cheyenne Field last week. He tried to run for it but smacked straight into an asteroid. Gotta tell ya, it cracked me up watching that ship explode. Stupid Rogues.</TEXT><PARA/><POP/></RDL>'''
622 = '''<RDL><PUSH/><TEXT>We got a short-term holding tank for any low-lifers that we round up here. Prison convoy leaves once a week, bound for Sugarland. It’s getting harder and harder to find undesirables on Colorado to fill it. Gotta fill that quota and keep the factories hummin’ — that’s what HQ says.</TEXT><PARA/><POP/></RDL>'''
623 = '''<RDL><PUSH/><TEXT>We don’t stray too far from the Trade Lanes most of the time. They don’t pay me enough to risk my neck going into assault patrols in the asteroid fields. Some of those young bucks get into it, though. They do a daily into the Cheyenne Field, and do a quick pass into the southern Alamosa.</TEXT><PARA/><POP/></RDL>'''
624 = '''<RDL><PUSH/><TEXT>The Bounty Hunters handle most of the asteroid fields. One of my nutso buddies decided he wasn’t gettin’ enough action with LPI, so he went and joined up a couple of months ago. Keeps bugging me to join him. That’s not for me, I got a family and a life to go home to.</TEXT><PARA/><POP/></RDL>'''
625 = '''<RDL><PUSH/><TEXT>Sometimes I think the rich folks here in Denver don’t really appreciate all we do for them. We don’t really get paid that well, and we take care of all the dirty business that they don’t want to deal with. Sometimes it gets kind of dicey, coming up with a reason to arrest some crazy loner out in a shack, just for being what he is.</TEXT><PARA/><POP/></RDL>'''
626 = '''<RDL><PUSH/><TEXT>Those Xenos are kind of crazy. Rogues, I can relate to them. Just trying to make a living on the wrong side of the law. But Xenos, they hate everybody. Even the Rogues can’t figure them out. Who cares about foreign shippers anyway? They still have stuff to steal.</TEXT><PARA/><POP/></RDL>'''
627 = '''<RDL><PUSH/><TEXT>They’re always trying to cut costs at LPI, make everyone meet their criminal quotas of the week. Guess that’s what you get with privatized police. I heard they don’t do it that way in the other Houses. Those guys seem pretty happy. Go figure.</TEXT><PARA/><POP/></RDL>'''
628 = '''<RDL><PUSH/><TEXT>We ship Pharmaceuticals to Tokyo, which supplies all of Orsena. Less frequently we haul Super Alloys and Superconductors for ship construction in Yokohama.</TEXT><PARA/><POP/></RDL>'''
629 = '''<RDL><PUSH/><TEXT>Denver has an insatiable demand for Junyo seafood. We also bring in H-Fuel from Osaka and Deshima, which gets distributed to the Colorado bases by Universal and Ageira.</TEXT><PARA/><POP/></RDL>'''
630 = '''<RDL><PUSH/><TEXT>I can’t stand this Synth Paste you Helion people eat everyday. In Orsena we have superior Food grown by the dedicated farmers of Kyushu using traditional methods. It may cost a bit more, but it’s worth it.</TEXT><PARA/><POP/></RDL>'''
631 = '''<RDL><PUSH/><TEXT>I ran a load of Food up here last week from Whiteharbor. I usually do the Los Angeles-Denver run straight through.</TEXT><PARA/><POP/></RDL>'''
632 = '''<RDL><PUSH/><TEXT>The corporate plan is to eventually handle Food production for all the colonies. We got Dornmark in the bag. Right now, Orsena is proving a bit more of a challenge, mainly Samura and their Farmers Alliance henchmen. Vespera will have to wait.</TEXT><PARA/><POP/></RDL>'''
633 = '''<RDL><PUSH/><TEXT>I’m running a load of Fertilizer up from Houston to the biodome operation on Deshima. Samura won’t sell it to us there, so we have to haul it a fair ways. I’ll sure be sorry to leave Helion. Gets pretty hostile up there in Orsena space, especially with that Farmers Alliance.</TEXT><PARA/><POP/></RDL>'''
634 = '''<RDL><PUSH/><TEXT>We ship all sorts of stuff out of here: supply shipments to the Rio Grande, Orsena Optronics and Engine Components to Houston, and Pharmaceuticals to the Missouri and the Ames Research Station.</TEXT><PARA/><POP/></RDL>'''
635 = '''<RDL><PUSH/><TEXT>Came in from Whiteharbor yesterday. I’m delivering part of my Luxury Goods load here in Denver. We’re bound for Roppongi in Sablecross to deliver the remainder. Gotta cross Galileo first, which will be the usual white-knuckle affair.</TEXT><PARA/><POP/></RDL>'''
636 = '''<RDL><PUSH/><TEXT>I just came in from Houston with a load of Consumer Goods. Houston is the cheapest place in the Nacre Reach for those, thanks to all the free prisoner labor. We sometimes run Construction Machinery in from Ft. Bush.</TEXT><PARA/><POP/></RDL>'''
637 = '''<RDL><PUSH/><TEXT>ALG ships MOX from the Dortmund facility to the Rio Grande on a periodic basis. Toxic Waste is then transported back to Dornmark for disposal.</TEXT><PARA/><POP/></RDL>'''
638 = '''<RDL><PUSH/><TEXT>We get attacked frequently by Xenos on our runs through Colorado, Texas, and the Independent Worlds of Hudson and Bering. They are one of the few criminal factions that attack out Toxic Waste shipments. We are friendly to Helion, so I don’t understand their hostility.</TEXT><PARA/><POP/></RDL>'''
639 = '''<RDL><PUSH/><TEXT>ALG handles all of the MOX delivery and Toxic Waste disposal for Helion Navy battleships.</TEXT><PARA/><POP/></RDL>'''
640 = '''<RDL><PUSH/><TEXT>I’m heading out on a run against the Xeno base in the Silverton Field in a few hours. We don’t get that big a bounty from IC and the government for Xenos. Now Ashbound, that’s another matter.</TEXT><PARA/><POP/></RDL>'''
641 = '''<RDL><PUSH/><TEXT>A good way to catch Xenos is to fly into the Copperton Field, then take the Jump Hole to Kepler. Watch out on the other side, swarms of them in that cloud. Their base is real close. Never seen it, but you can feel it.</TEXT><PARA/><POP/></RDL>'''
642 = '''<RDL><PUSH/><TEXT>The LPI doesn’t have the guts to come into the fields very far. First sign of trouble, and they’re hightailing it back to Denver. That’s where we come in. Since a lot of us are Rogues who did time in Sugarland or Huntsville, we know where the Jump Holes and bases are. Guild rules are that you tell no one or you may have a little “accident” out there.</TEXT><PARA/><POP/></RDL>'''
643 = '''<RDL><PUSH/><TEXT>Helion space is the training grounds for all Bounty Hunters. As a Hunter becomes more and more accomplished, they will begin to move out towards the edges of Sirius. Only the very best should be going up against Rift Captains and Ashbound.</TEXT><PARA/><POP/></RDL>'''
644 = '''<RDL><PUSH/><TEXT>Got me a Rogue ace the other day by the name of Buford “Tex” Wilson. He’d been shooting up a lot of ships along the Trade Lane to the Galileo Gate during the past few weeks. The LPI cornered him once, but he just shot his way out of it. I was patient, waited in the Alamosa Field near the Galileo Jump Hole. When he came through, blammo! That bounty will set me up for a while.</TEXT><PARA/><POP/></RDL>'''
645 = '''<RDL><PUSH/><TEXT>Bounties used to be for bringing back the offender dead or alive. Somewhere back when the Lane Hackers started itching old Ageira and IC, it changed to dead only, please.</TEXT><PARA/><POP/></RDL>'''
646 = '''<RDL><PUSH/><TEXT>I’m stuck running Trade Lane patrols. We do all of them that fan out from the ship. Pretty boring work, not what I signed up in the Navy for. I hear they put you on the Galileo and Kepler patrols when you’ve proved yourself a bit. Don’t want any greenies out there.</TEXT><PARA/><POP/></RDL>'''
647 = '''<RDL><PUSH/><TEXT>We’re always bailing out those LPI losers, especially in the Alamosa Field. I don’t know why they don’t just let us take over security. They can focus on running those prison factories, since that’s what they seem to really want to do.</TEXT><PARA/><POP/></RDL>'''
648 = '''<RDL><PUSH/><TEXT>We’re supposedly here to watch out for Xenos, but I think that Helion wants to keep a close eye on Pueblo — all that top secret stuff there that Orsena and Dornmark are always trying to find out about. Guess the Trade Lanes and Jump Gates are a big deal — a mystery to me.</TEXT><PARA/><POP/></RDL>'''
649 = '''<RDL><PUSH/><TEXT>I hear the toughest systems for the Navy are the Independent Worlds between Texas and Hamburg. Colorado is pansy land — just some stupid Rogues and Xenos.</TEXT><PARA/><POP/></RDL>'''
650 = '''<RDL><PUSH/><TEXT>We run two patrols into the fields from the Rio Grande. One goes into the Copperton Field, the other into the Alamosa. Usually the bad guys hightail it out of there when we show up, but not always. I killed me twelve Rogues and twenty Xenos so far since being posted up here — no Lane Hackers yet, though. They don’t stick around as much as the others.</TEXT><PARA/><POP/></RDL>'''
651 = '''<RDL><PUSH/><TEXT>We’re pretty sure that the Xenos have a base in the Denko Cloud in Kepler. They won’t let us go take a looksee though. They say the radiation levels are too high. That sounds like a bunch of political red tape to me.</TEXT><PARA/><POP/></RDL>'''
652 = '''<RDL><PUSH/><TEXT>The Navy patrols the Independent Worlds of Galileo and Kepler. We split duties with the Orsena armed forces. They cover the northern half of the Trade Lanes; we do the southern half. It’s kind of dark and spooky up there — no suns. All those dark clouds make the baddies hard to see.</TEXT><PARA/><POP/></RDL>'''
653 = '''<RDL><PUSH/><TEXT>The Lane Hackers and Rogues both have bases somewhere in Galileo, probably in those dark matter clouds. Orsena won’t let us go take a look though. Says it’s their responsibility. Hey, Helion was the one that paid for those Trade Lanes up there. Orsena didn’t have to put up a cent for the Galileo route.</TEXT><PARA/><POP/></RDL>'''
654 = '''<RDL><PUSH/><TEXT>Universal supplies all Helion Navy bases with essentials like H-Fuel, Food, Water, Oxygen, and Pharmaceuticals. On the Rio Grande, these come from Denver.</TEXT><PARA/><POP/></RDL>'''
655 = '''<RDL><PUSH/><TEXT>Universal brings in Side Arms from Detroit. We get attacked by Xenos on occasion in the Silverton Field.</TEXT><PARA/><POP/></RDL>'''
656 = '''<RDL><PUSH/><TEXT>We deliver some supplies here, then continue with H-Fuel, Water, and Oxygen to the Pueblo facility just down the Trade Lane.</TEXT><PARA/><POP/></RDL>'''
658 = '''<RDL><PUSH/><TEXT>We ship in our basic needs like Food, Oxygen, Water, and H-Fuel from Denver. Usually these shipments are pretty uneventful, which is just how I like it.</TEXT><PARA/><POP/></RDL>'''
659 = '''<RDL><PUSH/><TEXT>Ageira Technologies produces the most sophisticated technology in the Nacre Reach. We have exclusively designed and manufactured all of the Trade Lanes and Jump Gates that have made hyper-fast, long-distance space travel feasible for the first time in human history.</TEXT><PARA/><POP/></RDL>'''
660 = '''<RDL><PUSH/><TEXT>There has been one most unfortunate occurrence in Ageira’s past: the Dallas Incident in 500 AS, a Jump Gate research project in the Texas system that went horribly wrong. Thousands of dedicated Ageira employees were lost in one dreadful moment. To this day the Texas system remains mostly off-limits due to the radiation and debris hazards.</TEXT><PARA/><POP/></RDL>'''
661 = '''<RDL><PUSH/><TEXT>Ageira ships its primary products of Super Alloys, Superconductors, and Trade Lane Parts to Ember Pier, where Universal distributes them across the Nacre Reach.</TEXT><PARA/><POP/></RDL>'''
662 = '''<RDL><PUSH/><TEXT>Pueblo is our primary Trade Lane Parts manufacturing facility. We also produce the latest Super Alloys and Superconductors for use in Helion Navy Ship Hull construction and engines.</TEXT><PARA/><POP/></RDL>'''
663 = '''<RDL><PUSH/><TEXT>Ageira products like the Jump Gates have been developed through the centuries based on advanced technologies unlocked from Alien Artifacts found at an excavation site in Whiteharbor during the early days of Helion. It is Helion’s most valuable secret, and one that is jealously guarded.</TEXT><PARA/><POP/></RDL>'''
664 = '''<RDL><PUSH/><TEXT>We handle the shipment of Superconductors and Super Alloys to the Norfolk Shipyard in Cinderwell, and Denver. These high-tech components become the armor of Helion ships.</TEXT><PARA/><POP/></RDL>'''
665 = '''<RDL><PUSH/><TEXT>Ageira has a long and distinguished history. Its founders were among the initial population of Helion, soon after planetfall on Whiteharbor in 0 AS. All scientists and engineers — they were handpicked by the Helion government to exploit and develop new transportation technologies for the future.</TEXT><PARA/><POP/></RDL>'''
666 = '''<RDL><PUSH/><TEXT>The very best students from the Helion University of Cinderwell are handpicked by Ageira recruiters. Our corporation has always selected from the top one percent of each graduating class. The members of the Lane Hackers who left Ageira were no different.</TEXT><PARA/><POP/></RDL>'''
667 = '''<RDL><PUSH/><TEXT>The Lane Hackers are a misguided group of software and hardware development engineers that never appreciated the opportunities that Ageira presented. They stole extremely valuable Ageira intellectual property and used it to their own personal advantage. Due to their shortsighted actions, the criminal scourge has spread like a plague throughout the entire Sirius network of Trade Lanes.</TEXT><PARA/><POP/></RDL>'''
668 = '''<RDL><PUSH/><TEXT>ALG delivers large quantities of MOX to this facility. This is far and away our largest customer for this product. It is used as a base energy source for Trade Lanes and Jump Gates, although there is no way that fusion alone could create the energy required to operate these monstrous creations.</TEXT><PARA/><POP/></RDL>'''
669 = '''<RDL><PUSH/><TEXT>We haul tremendous amounts of Toxic Waste away from this plant. The Xenos are always waiting in the asteroid field it seems.</TEXT><PARA/><POP/></RDL>'''
670 = '''<RDL><PUSH/><TEXT>ALG would like to produce Super Alloys at our Dortmund plant in the near future. We are perfectly willing to handle other people’s garbage for a chance to eventually learn exactly how their products are made.</TEXT><PARA/><POP/></RDL>'''
671 = '''<RDL><PUSH/><TEXT>We bring in Polymers and Hydrocarbons from Manchester, site of our Birmingham manufactory, via Newark.</TEXT><PARA/><POP/></RDL>'''
672 = '''<RDL><PUSH/><TEXT>This is the sole location where Superconductors are produced in the Nacre Reach. None of the other Houses could stay competitive with Helion. We ship them to Los Angeles, and eventually Southampton Shipyard in the Larkspur system.</TEXT><PARA/><POP/></RDL>'''
673 = '''<RDL><PUSH/><TEXT>Bowex feels that Vesperan Super Alloys are superior to those produced here, so we don’t feel the need to import any. House Orsena and Dornmark unfortunately do not agree with our assessment.</TEXT><PARA/><POP/></RDL>'''
674 = '''<RDL><PUSH/><TEXT>We bring in the Beryllium to Pueblo all the way from the Cardiff mine in Cambridge, even though we have no outbound cargo here. It is a quick shot back into Cinderwell where we can fill up for the journey home.</TEXT><PARA/><POP/></RDL>'''
675 = '''<RDL><PUSH/><TEXT>We’d like to break into the Trade Lane Parts-hauling business, but the Helion government and Ageira will not allow it. They say it must be a Helion company that handles their precious cargo. I smell something fishy.</TEXT><PARA/><POP/></RDL>'''
676 = '''<RDL><PUSH/><TEXT>Helion does seem to have a lot of criminal problems — not as tough as our Mollys, and certainly nothing like the Rift Captains — but plenty of them, especially those Rogues.</TEXT><PARA/><POP/></RDL>'''
677 = '''<RDL><PUSH/><TEXT>We ship Niobium in from Deshima. On the return journey we bring Terraforming Gases for the biodome farms there. We also transport Superconductors, which are shipped onward to the Yukawa Shipyard in Honshu.</TEXT><PARA/><POP/></RDL>'''
678 = '''<RDL><PUSH/><TEXT>We’ve attempted to analysis Ageira products at our Kansai research center, but so far, unsuccessfully. If we could duplicate the Trade Lanes, we could finally be free of Helion’s stranglehold on that most critical technology.</TEXT><PARA/><POP/></RDL>'''
679 = '''<RDL><PUSH/><TEXT>We get attacked on the way down from Shikoku by Lane Hackers and Rogues, and both ways by Xenos. Orsena space is certainly much safer than this. We don’t have crime problems like this. I wish Helion would clean up the Independent Worlds, since the criminals come from here.</TEXT><PARA/><POP/></RDL>'''
680 = '''<RDL><PUSH/><TEXT>I just finished a very difficult run from the Ring in Ironreach with a load of Daumann-mined Cobalt and Copper. First we have to deal with the Unioners in Ironreach and Hamburg. Then the Xenos take over in Hudson and Texas. Then they hit us again just down the Lane in the Silverton Field. You’d think they wouldn’t care about a bunch of ore, but they just hate us.</TEXT><PARA/><POP/></RDL>'''
681 = '''<RDL><PUSH/><TEXT>We’re heading out tomorrow for the Ring and the Oder Shipyard with a load of Superconductors and Super Alloys. I need a drink before pondering that journey. Wish I could find a decent beer around here; that Helion ale is awful.</TEXT><PARA/><POP/></RDL>'''
682 = '''<RDL><PUSH/><TEXT>It’s too bad Dornmark can’t manufacture these goods herself, because we certainly have the raw materials. Dornmark innovation and entrepreneurship has lagged since the 80-Years War.</TEXT><PARA/><POP/></RDL>'''
683 = '''<RDL><PUSH/><TEXT>Samura ships Niobium to Pueblo all the way from Freeport 6 in the Tau-29 system. We’re picking up a return shipment of Superconductors bound for the Nansei antimatter research center in Kyushu.</TEXT><PARA/><POP/></RDL>'''
684 = '''<RDL><PUSH/><TEXT>Samura uses Super Alloys and Superconductors for construction of Orsena Naval Forces ships in the Yokohama Shipyard. House Orsena would love to manufacture these items internally, but we have been unable to duplicate Ageira’s manufacturing techniques, which are truly a mystery.</TEXT><PARA/><POP/></RDL>'''
685 = '''<RDL><PUSH/><TEXT>The Xenos are a constant scenescript in our side in Galileo and Colorado. We’ve had to invest in better ships and more escorts to protect ourselves. Samura doesn’t understand why the Xenos blame us for their misfortunes. Most of it can be blamed on their own Deep Space Engineering and Ageira, who did not respond to the Orsena challenge in commercial ship building.</TEXT><PARA/><POP/></RDL>'''
686 = '''<RDL><PUSH/><TEXT>We bring additional supplies of Oxygen, Water, and H-Fuel from Denver via the Rio Grande to supplement what Ageira ships here. We pick up Superconductors outbound for Ember Pier.</TEXT><PARA/><POP/></RDL>'''
687 = '''<RDL><PUSH/><TEXT>We ship Trade Lane parts to Roppongi in the Sablecross system. There they get offloaded to a DSE freighter for the final leg of their journey to the Chugoku Gate construction site in Hokkaido. That’s way out there, some pretty hostile territory.</TEXT><PARA/><POP/></RDL>'''
688 = '''<RDL><PUSH/><TEXT>We ship Boron in from Breakwater, Copper from Houston, and Basic Alloys from Texas or Ft. Bush. Universal is willing to ship throughout Helion to keep her in the forefront.</TEXT><PARA/><POP/></RDL>'''
695 = '''<RDL><PUSH/><TEXT>I’ve just completed a Cardamine run from the Junker base Trafalgar in the Larkspur system. Unlike Helion, there aren’t many places to lay over in Vesperan space.</TEXT><PARA/><POP/></RDL>'''
696 = '''<RDL><PUSH/><TEXT>Of all the factions in Sirius, these are the ones that know what they want and how to get it. They have more money than they need, and all the information they need to get more. We are blessed that the fools are so willing to spend their money on our Cardamine.</TEXT><PARA/><POP/></RDL>'''
697 = '''<RDL><PUSH/><TEXT>We often make Cardamine shipment transfers at the Rogue base in the Cortez system. I’m heading on to the California Rogue hideout with my Cardamine — I can make a more money with only a little more risk.</TEXT><PARA/><POP/></RDL>'''
698 = '''<RDL><PUSH/><TEXT>The Lane Hackers’ Trade Lane technology access is truly remarkable; Hackers give us specific information regarding ship manifests. As payment, they often alert us to high-value cargo coming through the system. If we could only get our hands on their technology… Perhaps one day they will give it to us for a large enough Cardamine shipment.</TEXT><PARA/><POP/></RDL>'''
699 = '''<RDL><PUSH/><TEXT>If you want to get in with us, you’ll need to take some Cardamine on a short run. Be friendly to the Hackers and Rogues; stay away from those Rift Captains, though. Bad news.</TEXT><PARA/><POP/></RDL>'''
700 = '''<RDL><PUSH/><TEXT>I’m starting to get sick — guess I’ve been away from home too long. These runs to Helion can be taxing. The inhaler masks aren’t a long term substitute for the Cardamine-infused biosphere of Malta.</TEXT><PARA/><POP/></RDL>'''
701 = '''<RDL><PUSH/><TEXT>I’m heading out to Beaumont, the pit of Texas, to deliver another load of Helion’s poison. It was a long journey from Cali. These Rogues are scum, but they perform an essential duty for us — at least for now.</TEXT><PARA/><POP/></RDL>'''
702 = '''<RDL><PUSH/><TEXT>I’m making the quick hop to Alcatraz tomorrow with a small payload of drugs. They’ve got Cardamine sleep chambers at the base here for itinerants like me. Not bad for an icy rock in the middle of nowhere.</TEXT><PARA/><POP/></RDL>'''
703 = '''<RDL><PUSH/><TEXT>Heading back out to Cali with Side Arms. They’re so cheap here — much better deal than at Trafalgar. On my way in from Buffalo yesterday I did some target practice on a Universal convoy in California. Paid off — got some Luxury Goods bound for Larkspur.</TEXT><PARA/><POP/></RDL>'''
704 = '''<RDL><PUSH/><TEXT>Dropping off some Water and Oxygen for those antisocial Zoners. Can’t see what they like about this dark and forbidding place. Just look around you — Xenos, Lane Hackers, and those sleazy Bounty Hunters. Not exactly a savory bunch. I can feel the predators’ eyes watching me. They’ll probably ambush us once we get out of the Freeport’s no-fire zone.</TEXT><PARA/><POP/></RDL>'''
705 = '''<RDL><PUSH/><TEXT>I just made the run from Denver with some Pharmaceuticals. I’m turning around and heading right back out before any of the bad guys have time to set up anything. They prefer stealing their drugs to buying them. Then they usually torch the ship anyway, just for grins.</TEXT><PARA/><POP/></RDL>'''
706 = '''<RDL><PUSH/><TEXT>I’m a pilot for the Universal ships that come through this area. They usually just need me on the stretch from Deshima to Ames, with the clouds and all. It can get really bad through here. Depends on how hungry the Hackers are. They tend to strike from the east side of the Trade Lanes, Xenos from the west. They don’t bother us much.</TEXT><PARA/><POP/></RDL>'''
707 = '''<RDL><PUSH/><TEXT>In 614 AS, Ageira began crafting Side Arms and personal weaponry at this manufacturing plant, and since then Detroit has been synonymous with firepower. When you want to put someone down fast, look to Detroit to meet your needs.</TEXT><PARA/><POP/></RDL>'''
708 = '''<RDL><PUSH/><TEXT>This plant supplies Helion, Vespera, and Orsena with Side Arms and personal weaponry. The only other Side Arms factory is the Ring in Ironreach. But everyone knows that Detroit hardware is superior to the Dornmark arms.</TEXT><PARA/><POP/></RDL>'''
709 = '''<RDL><PUSH/><TEXT>The Lane Hackers are Ageira’s worst enemy. They use their stolen technology to interfere with our shipping and undermine the safety of our Trade Lane systems. Our USI system was supposed to benefit commerce in Sirius, but it has been twisted into a way to know which ships to pirate.</TEXT><PARA/><POP/></RDL>'''
710 = '''<RDL><PUSH/><TEXT>Our Side Arms are shipped throughout Helion by our own transports and Universal Shipping. We deliver them to Whiteharbor, Ember Pier, Los Angeles, and Denver.</TEXT><PARA/><POP/></RDL>'''
711 = '''<RDL><PUSH/><TEXT>The Lane Hackers very rarely do their own dirty work; they usually sell or trade ship Commodity information to the Rogues or Ashbound. The most infuriating part of it all is that there has been no way to stop them yet. We kill the occasional Rogue or Outcast, but we’ve never been able to catch a Lane Hacker.</TEXT><PARA/><POP/></RDL>'''
712 = '''<RDL><PUSH/><TEXT>Universal Ship Identification (USI) is a system in which ship cargo manifests are downloaded into databases as ships pass through Jump Gates and Trade Lanes. Somehow the Lane Hackers got their hands on the technology and now know which shipments carry the most valuable Commodities, making it easy for them to target specific transports.</TEXT><PARA/><POP/></RDL>'''
713 = '''<RDL><PUSH/><TEXT>This station requires supplies from different sources to manufacture our famous Side Arms. Since Ageira makes the best weapons, we ship the finest materials here: H-Fuel from Newark, Water and Oxygen from Whiteharbor, and Food and Basic Alloys from Ember Pier.</TEXT><PARA/><POP/></RDL>'''
714 = '''<RDL><PUSH/><TEXT>Is personal armor putting a damper on your fun? Try Detroit’s newest hypersonic Polymer jacketed round. That’s right, our latest Barrier Breaker Armor Piercing Shells travel so fast you’ll hear them break the sound barrier! They can penetrate ceramic armor plating, hull plating, engine blocks, reactor chambers — you name it.</TEXT><PARA/><POP/></RDL>'''
715 = '''<RDL><PUSH/><TEXT>Originally, Ageira was headquartered in Whiteharbor, but we moved our operations to California. We felt it was important to put weapons manufacturing in the heart of Helion.</TEXT><PARA/><POP/></RDL>'''
716 = '''<RDL><PUSH/><TEXT>Xenos were making more and more frequent attacks on this installation in an attempt to steal our Side Arms — that is until we put up the defensive satellite grid outside the station. After the first few encounters with our upgraded defenses, the Xenos attacked this base much less frequently.</TEXT><PARA/><POP/></RDL>'''
717 = '''<RDL><PUSH/><TEXT>Xenos don’t usually harass Helion shipping — unless, of course, you are shipping Side Arms, which is our business here in Detroit. That is why we have hired extra Bounty Hunters to patrol the Trade Lanes leading to and from this base.</TEXT><PARA/><POP/></RDL>'''
718 = '''<RDL><PUSH/><TEXT>The LPI does its best in this part of space, but it just doesn’t have the agents or the ships to protect all the shipping that passes through this system. IC, which insures much of our cargo, has been a close Ageira ally since Trade Lanes first went into mass production back in 215 AS.</TEXT><PARA/><POP/></RDL>'''
719 = '''<RDL><PUSH/><TEXT>The Xenos who used to attack this base are either dead or smart enough now to know that the defense satellites encircling this plant will vaporize their ships faster than they can get their cruise charged up for an escape.</TEXT><PARA/><POP/></RDL>'''
720 = '''<RDL><PUSH/><TEXT>Ageira has hired me to hunt down and kill any Rogues I can find. They need Hunters to kill Ashbound too, but I don’t have the ship I need to take down those guys. But with every Rogue I bag, I come a few thousand credits closer to getting it.</TEXT><PARA/><POP/></RDL>'''
721 = '''<RDL><PUSH/><TEXT>I lie in wait for Rogues as they leave the cover of the Detroit Debris Field on their way to the Trade Lanes between this base and Whiteharbor. Their base is in the Badlands, so they have to come through that point if they want to use the debris fields in the system for cover.</TEXT><PARA/><POP/></RDL>'''
722 = '''<RDL><PUSH/><TEXT>Xenos fly out of the Jersey Debris Fields and stage attack runs on Ageira ships headed to Whiteharbor or Ember Pier.</TEXT><PARA/><POP/></RDL>'''
723 = '''<RDL><PUSH/><TEXT>If I can ever capture a Lane Hacker alive, Ageira and IC would both pay me enough money to retire. No Lane Hacker has ever been captured — though occasionally one will get blown to pieces with his ship.</TEXT><PARA/><POP/></RDL>'''
724 = '''<RDL><PUSH/><TEXT>The Ashbound don’t really come into this end of the system; they stay more to the south in and around the Badlands. So that’s where I go for the big-money contracts Ageira hands out to those guys.</TEXT><PARA/><POP/></RDL>'''
725 = '''<RDL><PUSH/><TEXT>I like hanging out at this base; nothing like walking into the machine rooms where all those shiny new weapons are being boxed up by the thousands ready to be shipped throughout Sirius. One of the pieces I carry was a gift from the third shift foreman in the handguns and hold-out weapons wing of the plant.</TEXT><PARA/><POP/></RDL>'''
726 = '''<RDL><PUSH/><TEXT>I run a patrol that skirts the edge of the Jersey Debris Field — that’s where you can hit the Rogues headed for the Junker base getting ready to drop their stolen cargo and contraband.</TEXT><PARA/><POP/></RDL>'''
727 = '''<RDL><PUSH/><TEXT>IC wants us to keep a patrol flying between here and Whiteharbor non-stop. IC and Ageira are corporate allies, along with Universal Shipping and Deep Space Engineering. All these companies worked together for the creation of the Trade Lanes, so we have a long relationship.</TEXT><PARA/><POP/></RDL>'''
728 = '''<RDL><PUSH/><TEXT>Universal Shipping handles many of Ageira’s shipping accounts that leave Helion for other House space. We ship Side Arms from this base to Larkspur and Sablecross.</TEXT><PARA/><POP/></RDL>'''
729 = '''<RDL><PUSH/><TEXT>We play a major role ensuring that Detroit Munitions has all the necessary supplies to keep her running smoothly. We bring in H-Fuel from Newark, Food from Ember Pier, and Basic Alloys from Sugarland.</TEXT><PARA/><POP/></RDL>'''
730 = '''<RDL><PUSH/><TEXT>Ageira is somewhat disliked in Texas because of the whole Dallas incident. The sad truth is that no one could have done better, but you can’t always fight perception. So we ship the Side Arms manufactured here to Houston for them, and we also ship to the battleships and other police bases in Helion.</TEXT><PARA/><POP/></RDL>'''
731 = '''<RDL><PUSH/><TEXT>The Xenos cause some trouble for the Dornmark and Orsena shipping that comes in and flies out of this base. They’ve put contracts out on some of them in this area. The best part is that some Helion firms have been paying me to let Xenos go.</TEXT><PARA/><POP/></RDL>'''
732 = '''<RDL><PUSH/><TEXT>This place makes me a lot of money, and I don’t have to go far to earn it. If I go out along the Trade Lanes or into the Breakwater Debris Fields, I’m bound to come across some Rogues.</TEXT><PARA/><POP/></RDL>'''
733 = '''<RDL><PUSH/><TEXT>The Rogues that fly this area are a pretty disorganized lot. Most of them feel the prison ships in Texas are like second homes. I prefer to offer them permanent housing in a chunk of space debris that was their imploded ship.</TEXT><PARA/><POP/></RDL>'''
734 = '''<RDL><PUSH/><TEXT>LPI has to worry about bringing pirates, smugglers, and thieves in to be tried and sent to one of their toy factories. All I have to do is kill ’em. That’s why Bounty Hunters help get the job done when LPI fails.</TEXT><PARA/><POP/></RDL>'''
735 = '''<RDL><PUSH/><TEXT>This base’s close proximity to the Breakwater Debris Fields, coupled with the amount of traffic that comes through here, makes this an irresistible target for Rogues and the like.</TEXT><PARA/><POP/></RDL>'''
736 = '''<RDL><PUSH/><TEXT>This is one of the better bases to overhear a conversation or get an idea of what is being shipped where in Helion space. Ft. Bush is truly the crossroads of the Nacre Reach, even more so than Whiteharbor.</TEXT><PARA/><POP/></RDL>'''
737 = '''<RDL><PUSH/><TEXT>Ft. Bush lies on our Boron route that starts in Breakwater and goes all the way to Vespera. I just brought in a shipment last night. We’ll be heading off to Larkspur after a few beers. Makes the drive a little less boring.</TEXT><PARA/><POP/></RDL>'''
738 = '''<RDL><PUSH/><TEXT>Normally I run Luxury Goods from Whiteharbor to Larkspur. That is a cargo more befitting of a senior Bowex captain. Unfortunately, I lost a recent shipment in Magellan to Lane Hackers, and was promptly demoted to the Breakwater to Stokes Boron run. Maybe it’s a hint that I should get out of the shipping business.</TEXT><PARA/><POP/></RDL>'''
739 = '''<RDL><PUSH/><TEXT>I’m returning to Newark after dropping off a load of Polymers and Hydrocarbons at Pueblo. It’s not too bad here in Helion space. At least there aren’t any of those pesky Rift Captains. I refuse to do any Border World runs anymore. It’s just not worth it.</TEXT><PARA/><POP/></RDL>'''
740 = '''<RDL><PUSH/><TEXT>At Cryer, we feel your health is our top priority. That’s why we’re shipping our Pharmaceuticals throughout Sirius around the clock. From hypo-sprays to bionic eye replacements, Cryer is ensuring a healthier life for everyone.</TEXT><PARA/><POP/></RDL>'''
741 = '''<RDL><PUSH/><TEXT>I realize that people become desperate for medical supplies when they are sick, or one of their loved ones is injured, but that does not justify the piracy of Cryer goods. I mean, if you can’t afford to buy medicines, should you really be living anyway?</TEXT><PARA/><POP/></RDL>'''
742 = '''<RDL><PUSH/><TEXT>This is Cryer’s main southern Helion distribution point for our Pharmaceuticals produced in Denver. We transfer the cargo to ships bound for Los Angeles and Houston here. Cryer doesn’t handle large drug shipments across Independent or Border World space. We let the shipping companies deal with that.</TEXT><PARA/><POP/></RDL>'''
743 = '''<RDL><PUSH/><TEXT>This is the main transfer point for our Houston-produced Construction Machinery. We ship it out to Denver. I’m heading over to the shipyard across the way for a beer in a moment. Feels more like home over there.</TEXT><PARA/><POP/></RDL>'''
744 = '''<RDL><PUSH/><TEXT>In the old days, they didn’t need Ft. Bush. We just had the Baltimore Shipyard out here. With the rise of the Rogues they had to do something. Too many ships were getting wasted right in front of our eyes. If they hadn’t let that debris build up so close, there wouldn’t be all the problems around here. Where there’s debris, there are roaches. That’s what I say.</TEXT><PARA/><POP/></RDL>'''
745 = '''<RDL><PUSH/><TEXT>One of these days they’ll have all the Rogues in prison, and the debris fields will be gone. Then all we’ll build is cruise ships, and they’ll shut this place down. Yeah right.</TEXT><PARA/><POP/></RDL>'''
746 = '''<RDL><PUSH/><TEXT>We ship Optronics to this base from Honshu. You will find that they are of the highest quality. We do not have the connections that Samura has gained through its many years of less-than-ethical business practices, so we must rely upon our workmanship.</TEXT><PARA/><POP/></RDL>'''
747 = '''<RDL><PUSH/><TEXT>You want your ship to run with the best fuel at the lowest price? Then you should try our H-Fuel, which we bring here all the way from Ogashawa in the Sigma-19 system. Soon the GMG will no longer use Osaka and Samura. We will be the exclusive supplier to the Nacre Reach.</TEXT><PARA/><POP/></RDL>'''
748 = '''<RDL><PUSH/><TEXT>I’m heading back up to Pueblo to load up on some Superconductors bound for Yukawa. Hopefully the Xenos in the Silverton Field won’t bother me if I’m empty.</TEXT><PARA/><POP/></RDL>'''
749 = '''<RDL><PUSH/><TEXT>I patrol the Jump Gate from Colorado, which means I see a lot of Orsena shipping moving through my patrol path. My buddy patrols on the Texas Trade Lane side of Ft. Bush, which means he sees a lot of Dornmark shipping.</TEXT><PARA/><POP/></RDL>'''
750 = '''<RDL><PUSH/><TEXT>Sure, there’s a lot of piracy out there, but the LPI is hindered in ways that the Bounty Hunters are not. We have well-defined patrol area boundaries and a company policy that prohibits us from killing outlaws. We are to capture them if possible for rehabilitation at our factories.</TEXT><PARA/><POP/></RDL>'''
751 = '''<RDL><PUSH/><TEXT>The Xenos aren’t really making things too tough on the Junkers over in the Jersey; they don’t have the men or the equipment, at least not yet. Personally, I’m kinda rooting for them. They aren’t as smart as the Junkers and that means more arrests for us, which means I get a bigger bonus.</TEXT><PARA/><POP/></RDL>'''
752 = '''<RDL><PUSH/><TEXT>We run regular patrols into the Breakwater Debris Fields. Lots of Rogues back there. A few Junkers, but they’re not smuggling anything in that area, so we generally leave them alone.</TEXT><PARA/><POP/></RDL>'''
753 = '''<RDL><PUSH/><TEXT>I’m taking a quick break before heading out on the last leg to Breakwater with a load of Mining Machinery from Essen. We pick up Boron for the return trip back to Sugarland.</TEXT><PARA/><POP/></RDL>'''
754 = '''<RDL><PUSH/><TEXT>I left Berlin weeks ago. We were attacked no less than five times. I’m getting too old for this. We usually ship in Cobalt and Copper from The Ring bound for Ageira’s big plant in Colorado. We also handle Mining Machinery from Essen on occasion, bound for Breakwater.</TEXT><PARA/><POP/></RDL>'''
755 = '''<RDL><PUSH/><TEXT>The Xenos aren’t too bad in the southern area of Cinderwell. Just Rogues and occasional Ashbound. We Dornmarkers don’t have to deal with them too often. Now Rift Captains and Cinder Guard, that’s a different story. I told my dispatcher, “No more of those Omega-7 runs — I want to live to retirement.”</TEXT><PARA/><POP/></RDL>'''
756 = '''<RDL><PUSH/><TEXT>We are an ancient company spanning the centuries since just after Orsena was founded. We have survived this long because we create excellent products. The H-Fuels we supply to this base from Osaka are of the highest grade.</TEXT><PARA/><POP/></RDL>'''
757 = '''<RDL><PUSH/><TEXT>I would prefer not to venture outside of Orsena space to peddle our products to the Gaijin here in Helion, but I must pay the price for accidentally breaking one of my general manager’s prized Alien Artifacts at last year’s Sakura celebration.</TEXT><PARA/><POP/></RDL>'''
758 = '''<RDL><PUSH/><TEXT>It is obvious to Samura that Helion does not take our shipping problems seriously. Our shipments are under constant attack from Xenos, but the Helion government does hardly anything for us. Where is their navy? Ah yes, they only operate in the southern sector of Cinderwell, leaving us to be guarded by the LPI.</TEXT><PARA/><POP/></RDL>'''
759 = '''<RDL><PUSH/><TEXT>Hey, what’s tastier than a barrel of Paste? That’s right, nothing in Sirius that won’t cost you half a month’s pay. When you want Food Paste and you want it bad, you know who to come to.</TEXT><PARA/><POP/></RDL>'''
760 = '''<RDL><PUSH/><TEXT>This is the halfway point on my route from Los Angeles to Denver. We usually bring a little extra for the bases in this area of Helion. I’m so sick of Synth Paste. You get it at a discount working for them. Of course, the execs get free Luxury Food from Stuttgart shipped right to their doorstep. That’s what I call service.</TEXT><PARA/><POP/></RDL>'''
761 = '''<RDL><PUSH/><TEXT>Our biodomes are flowering up all over Sirius; our experts are growing and cultivating the finest in Luxury Foods in Stuttgart.</TEXT><PARA/><POP/></RDL>'''
762 = '''<RDL><PUSH/><TEXT>Universal Shipping is Helion’s premier shipping company. We bring in Basic Alloys, Consumer Goods, and Cobalt from Texas; Water and Oxygen from Whiteharbor; and Boron from Breakwater.</TEXT><PARA/><POP/></RDL>'''
763 = '''<RDL><PUSH/><TEXT>Breakwater receives a large portion of her supplies from this base. Oxygen, Food, Water, Mining Machinery, H-Fuel, Pharmaceuticals, and Consumer Goods are shipped there by Universal.</TEXT><PARA/><POP/></RDL>'''
764 = '''<RDL><PUSH/><TEXT>This is a transit point for Construction Machinery being shipped up to Colorado from Texas, and for Boron headed for Sugarland and Pueblo from Breakwater.</TEXT><PARA/><POP/></RDL>'''
765 = '''<RDL><PUSH/><TEXT>Ft. Bush serves as the second largest distribution port for Orsena H-Fuel and Optronics in Cinderwell. From here we make shipments to Houston and military bases in the southeast area of the system.</TEXT><PARA/><POP/></RDL>'''
766 = '''<RDL><PUSH/><TEXT>ALG disposes of the waste that this shipyard produces. Toxic Waste and Scrap Metal are shipped by us to Dortmund in Ironreach.</TEXT><PARA/><POP/></RDL>'''
767 = '''<RDL><PUSH/><TEXT>Some of the Scrap Metal produced here at this shipyard is shipped by ALG to the Sugarland. Our freighters in Texas then bring Ship Hull Panels back to this base from Houston.</TEXT><PARA/><POP/></RDL>'''
768 = '''<RDL><PUSH/><TEXT>MOX and Ship Hull Panels are brought to this base from Dortmund by ALG for Deep Space Engineering’s use in the construction of ships.</TEXT><PARA/><POP/></RDL>'''
769 = '''<RDL><PUSH/><TEXT>Bowex brings this shipyard the finest in Polymers from Birmingham. Yes, we brave the Rogues to ship these components to Helion space.</TEXT><PARA/><POP/></RDL>'''
770 = '''<RDL><PUSH/><TEXT>Our corporation is the cornerstone of Vesperan shipping. We have always competed fairly with other shippers from outside of Vespera, but the filthy young upstarts at Gateway Shipping have neither the experience nor the intellect to make a successful venture of their firm.</TEXT><PARA/><POP/></RDL>'''
771 = '''<RDL><PUSH/><TEXT>This company received the first royal shipping charter from the Crown; we have hauled and shipped material throughout Vespera’s long and illustrious history. Through it all we have remained steadfast and vigilant to the needs of our customers, often times not only shipping but insuring precious Commodities.</TEXT><PARA/><POP/></RDL>'''
772 = '''<RDL><PUSH/><TEXT>This is the last of the commercial shipyards in Helion. We had to specialize in prison and cruise ships to survive. Orsena took over the general transport business a while ago. That’s when they shut down the Edison Yard in Colorado. Lot of good people lost their way of life on that dark day. Now they’re Rogues and Xenos.</TEXT><PARA/><POP/></RDL>'''
773 = '''<RDL><PUSH/><TEXT>The primo jobs at DSE are the Trade Lane and Jump Gate construction crews. They get loads of hazard pay, plus free room and board. It’s all secret and such. Aren’t supposed to ask questions on what’s inside the guts of those Rings. Just swap them out with new ones from Ageira if they’re busted.</TEXT><PARA/><POP/></RDL>'''
774 = '''<RDL><PUSH/><TEXT>Building prisons is big business in Helion. When they’re done, they fill them with all the people that they just laid off from DSE. There’s something wrong with that, but I can’t do nothin’ about it, so why worry? Who knows, maybe someday I’ll be living in one of the cells I helped build. Now, ain’t that ironic?</TEXT><PARA/><POP/></RDL>'''
775 = '''<RDL><PUSH/><TEXT>Prison and cruise ships. That says a lot about Helion society. We don’t build all the miners or transports. That went to Orsena and Dornmark over a century ago. A lot of my old buddies that got laid off joined the Xenos to fight back. Personally, I think they should go after IC and all the rich people using these cruise ships.</TEXT><PARA/><POP/></RDL>'''
776 = '''<RDL><PUSH/><TEXT>I’m just stopping by on the supply run from Whiteharbor. We bring the usual stuff like Oxygen and Water. Sometimes I bring more Construction Machinery up from Houston. Pretty easy runs.</TEXT><PARA/><POP/></RDL>'''
777 = '''<RDL><PUSH/><TEXT>Deep Space Engineering is the exclusive manufacturer of machinery and shipping in Sirius’ private sector. If you want something huge or luxurious, then we are the ones to contract.</TEXT><PARA/><POP/></RDL>'''
778 = '''<RDL><PUSH/><TEXT>Baltimore isn’t a bad place. Could be worse, like Houston. Houston is the pits. They get some hellacious dust storms there. Real hot, too. You got one foot in a prison cell there, the other on some factory line with the warden trying to make his monthly bonus.</TEXT><PARA/><POP/></RDL>'''
779 = '''<RDL><PUSH/><TEXT>I got a friend over at the Norfolk yard. They do a lot of the Hull Panel fabrication onsite to keep everything secret. Once you start building ships for the Navy, you’re in for life. Can’t ever tell your family what you do. Too much stress for me.</TEXT><PARA/><POP/></RDL>'''
780 = '''<RDL><PUSH/><TEXT>Helion used to mine most of the materials we use here. Now it’s all shipped in from far away. All that debris you see around here is old scrapped ships and junk that everyone threw away for centuries without a thought. Now they’re starting to salvage it. It’s about time.</TEXT><PARA/><POP/></RDL>'''
781 = '''<RDL><PUSH/><TEXT>Ageira don’t treat DSE with any respect. They think we’re just a bunch of mechanics or something. The Navy’s okay. They know that someone has to build their ships, and it can’t be criminals or foreigners.</TEXT><PARA/><POP/></RDL>'''
782 = '''<RDL><PUSH/><TEXT>Bowex will tell you that we don’t have the experience or expertise to be prominent shippers of Vesperan Commodities. But the truth is they realize what a threat we are to their firm. We do the same business they do, but for less.</TEXT><PARA/><POP/></RDL>'''
783 = '''<RDL><PUSH/><TEXT>Gold is brought to this base for use in wiring the ships built here. We have the pleasure of shipping it in from the Hood in Dublin.</TEXT><PARA/><POP/></RDL>'''
784 = '''<RDL><PUSH/><TEXT>I’ve heard that some of the Rogues in this system have been tipped off about our Gold shipments to this base, not by the Lane Hackers but by Bowex. I wouldn’t put it past those corporate bastards.</TEXT><PARA/><POP/></RDL>'''
785 = '''<RDL><PUSH/><TEXT>This station’s proximity to Ft. Bush and the Trade Lanes that feed her make this area dangerous for the shipping companies that bring in supplies used to build the ships and machinery churned out by this station. That’s one of the reasons why the Bounty Hunters maintain a presence here.</TEXT><PARA/><POP/></RDL>'''
786 = '''<RDL><PUSH/><TEXT>The Rogues in the area seem to know which ships are bringing the Gold into this base. They must be getting the information from the Lane Hackers. Whenever Gateway ships Jump into the system, some of us are contracted to escort them into this base.</TEXT><PARA/><POP/></RDL>'''
787 = '''<RDL><PUSH/><TEXT>Xenos don’t really come this far east into the system from the Jersey Debris Fields, but they will harass the Orsena Dornmark and Vesperan firms coming to this base via Trade Lanes.</TEXT><PARA/><POP/></RDL>'''
788 = '''<RDL><PUSH/><TEXT>The Junkers in this area will try to steal machinery and components left unguarded. They aren’t too dangerous unless you tangle with several of them in some lonely space with no witnesses around. They will kill you without a thought.</TEXT><PARA/><POP/></RDL>'''
789 = '''<RDL><PUSH/><TEXT>I killed four Rogues trying to escape into the Breakwater Fields last week. They almost made it, but I blew out the engines on one of their ships, and the other three came back to tried and save him. They must have been high on Cardamine the way they were flying.</TEXT><PARA/><POP/></RDL>'''
790 = '''<RDL><PUSH/><TEXT>Kishiro put up some contracts for us Bounty Hunters to exterminate the Rogues who were attacking their shipments on the Trade Lanes. Here is something to think about: We are to engage and destroy all Xenos that we encounter, unless they’re attacking Samura shipments, in which case we are to break off.</TEXT><PARA/><POP/></RDL>'''
791 = '''<RDL><PUSH/><TEXT>H-Fuel is shipped to this base by Kishiro from Ogashawa. We are proud to contribute to Libertonian industry.</TEXT><PARA/><POP/></RDL>'''
792 = '''<RDL><PUSH/><TEXT>Optronics and Engine Components are brought to this shipyard by Kishiro from Honshu in Orsena space. These Orsena products that will be used in the luxury liners and prison ships will be reliable for many years.</TEXT><PARA/><POP/></RDL>'''
793 = '''<RDL><PUSH/><TEXT>Not all of the Engine Components brought to this base by Kishiro come from outside of Helion; some of them are from Dornmark.</TEXT><PARA/><POP/></RDL>'''
794 = '''<RDL><PUSH/><TEXT>My father was a joint fitter who worked on the </TEXT><TRA italic="true"/><TEXT>Shetland</TEXT><TRA italic="false"/><TEXT>  when it was under construction here. They laid him off, and our family struggled for many years. When I got old enough I joined the LPI because I knew there would always be work catching criminals.</TEXT><PARA/><POP/></RDL>'''
795 = '''<RDL><PUSH/><TEXT>A lot of the workers here think about turning to crime between contracts when Deep Space will lay off a few hundred or even a thousand employees. Then if they aren’t careful, they will end up making toys on the Sugarland instead of making ships in Baltimore.</TEXT><PARA/><POP/></RDL>'''
796 = '''<RDL><PUSH/><TEXT>The employees who work at this station are prime examples of the disappearing working class in Helion. If you aren’t an ultra-rich Manhattanite or a technocrat, you are working too hard for your money. Some of the labor force here is temporary. Between big contracts they do other things, like fly for the Rogues.</TEXT><PARA/><POP/></RDL>'''
797 = '''<RDL><PUSH/><TEXT>Republican Shipping is relied upon by DSE to bring Engine Components crafted at the Ring in Dornmark to this base. After all, Dornmark Engine Components are the best around.</TEXT><PARA/><POP/></RDL>'''
798 = '''<RDL><PUSH/><TEXT>The Xenos are a scenescript in our side at Republican Shipping, and yet the Helion government does next to nothing to curb their piracy. It is obvious they are being bribed by Helion corporations who do not want outside competition.</TEXT><PARA/><POP/></RDL>'''
799 = '''<RDL><PUSH/><TEXT>We have been the premier Dornmark Shipping firm since before the 80-Years War. Back then we were known as Imperial Shipping, but alas, no more empire. Now we represent our mighty republic in shipping concerns throughout Sirius.</TEXT><PARA/><POP/></RDL>'''
800 = '''<RDL><PUSH/><TEXT>We risk many dangers shipping H-Fuel to this base from the refineries in Osaka, but Deep Space Engineering pays well for the Commodities it consumes.</TEXT><PARA/><POP/></RDL>'''
801 = '''<RDL><PUSH/><TEXT>The best Optronics that Kishiro makes are used at their own manufacturing facilities in Orsena. They would never sell Helion the best of what they produce. I have told DSE this many times, but they seem satisfied with their inferior Kishiro products.</TEXT><PARA/><POP/></RDL>'''
802 = '''<RDL><PUSH/><TEXT>We used to provide this station with all of its H-Fuel. Unfortunately, Deep Space in their wisdom allowed Kishiro to come in and sell their H-Fuels. Kishiro, being the fools that they are, have lowered their prices to try to force us out, so we must lower our prices also. DSE ends up paying less while both Orsena companies lose.</TEXT><PARA/><POP/></RDL>'''
803 = '''<RDL><PUSH/><TEXT>Gateway is not the only company that ships Gold here. Universal brings Gold to this shipyard from Larkspur.</TEXT><PARA/><POP/></RDL>'''
804 = '''<RDL><PUSH/><TEXT>Universal ships many materials and components to this yard from around Helion. We bring in Optical Chips from Los Angeles; Basic Alloys from Sugarland; and Engine Components from Denver.</TEXT><PARA/><POP/></RDL>'''
805 = '''<RDL><PUSH/><TEXT>Not only do these guys build all civilian ships in Sirius as well as the majority of heavy construction in Helion, they hold the exclusive contract to build Jump Gates from Ageira. Deep Space Engineering, even though it’s not known as one of the “big three” Helion corporations, has more power than almost any other corporation in Sirius.</TEXT><PARA/><POP/></RDL>'''
806 = '''<RDL><PUSH/><TEXT>This is the center of the universe for Ageira. Company HQ. I do my little part by shipping in Side Arms from Detroit. I take Optical Chips to Norfolk on the way back to Cinderwell. Only tough part of the trip is getting the Side Arms past the Xenos on the first stretch to Whiteharbor.</TEXT><PARA/><POP/></RDL>'''
807 = '''<RDL><PUSH/><TEXT>I hear the Lane Hackers get lonely for California sometimes. They got some asteroid base out in the Barrier someplace, where you never see the sun. IC and Ageira are determined to catch them. They might start right here. Word is, the Hackers got some secret friends inside still. That’s how they are keeping up with all the security patches that Ageira releases.</TEXT><PARA/><POP/></RDL>'''
808 = '''<RDL><PUSH/><TEXT>This is where they do all of the software development for Ageira. Few years back, some programmers got uppity and took off with a bunch of source codes for the USI tracking software. IC was furious; came in and had a big investigation done. Hasn’t stopped the Lane Hackers.</TEXT><PARA/><POP/></RDL>'''
809 = '''<RDL><PUSH/><TEXT>Just made a circuit of the Sierra Field. We like to troll for Rogues close to the Trade Lane to Mojave. They like to hang out there at the edge of the field, waiting for ships to come along.</TEXT><PARA/><POP/></RDL>'''
810 = '''<RDL><PUSH/><TEXT>We know there’s a Rogue asteroid base in the Whitney Field. Problem is getting close enough to nail someone without disturbing the hornets’ nest. Believe me, you’ll know if you did. There’s Ashbound around too. So ya gotta be careful.</TEXT><PARA/><POP/></RDL>'''
811 = '''<RDL><PUSH/><TEXT>Bagged me a trophy Outcast the other day just inside the Tahoe Cloud to the west of the San Diego Lane. Just an escort for a smuggler, but still a pretty good bounty. Drinks are on me tonight.</TEXT><PARA/><POP/></RDL>'''
812 = '''<RDL><PUSH/><TEXT>It’s hard to get to, but there’s a Jump Hole to Texas pretty close to the Rogue base. Tough to hang out there for long; Rogues and Ashbound will swarm you pretty quick. Only the gutsy guys risk it.</TEXT><PARA/><POP/></RDL>'''
813 = '''<RDL><PUSH/><TEXT>I’m new to the system. Got tired of Cinderwell. Only way to move up there in the Guild is to head into the Badlands. Nasty, that dark cloud is. I prefer open asteroid fields, personally. I think I’ll head out to the Whitney Field for a look.</TEXT><PARA/><POP/></RDL>'''
814 = '''<RDL><PUSH/><TEXT>I’m heading off to Cortez. I hear there’s Rogues as far as the eye can see out there. A big group of ex-LPI guys is based at that resort Curacao — keep asking me to join them. They expect to cash out pretty quick, although two of them already bit it. Definitely some risk involved.</TEXT><PARA/><POP/></RDL>'''
815 = '''<RDL><PUSH/><TEXT>We know there’s a Rogue asteroid base in the Whitney Field. Problem is getting close enough to nail someone without disturbing the hornets’ nest. Believe me, you’ll know if you did. There’s Ashbound around, too, so ya gotta be careful.</TEXT><PARA/><POP/></RDL>'''
816 = '''<RDL><PUSH/><TEXT>We just came in with a load of Polymers and Hydrocarbons from Birmingham, across the Barrier in Manchester. I’m turning the ship back for Sheffield Station tomorrow with a load of Optical Chips.</TEXT><PARA/><POP/></RDL>'''
817 = '''<RDL><PUSH/><TEXT>I haul Luxury Food from Cambridge all the way here. You really have to push it to make it before the Food spoils. We typically pick up a load of Luxury Goods for Larkspur on the return. That’s less time-sensitive but more dangerous for the Lane Hackers in Cortez and Magellan. They always seem to know when we’re coming.</TEXT><PARA/><POP/></RDL>'''
818 = '''<RDL><PUSH/><TEXT>I’ve hauled Superconductors and Boron from Cinderwell to Larkspur and Leeds as long as I can remember. I usually pick up a load of Polymers or Hydrocarbons in Manchester for the return trip across the Barrier.</TEXT><PARA/><POP/></RDL>'''
819 = '''<RDL><PUSH/><TEXT>I handle Gold and Luxury Goods runs between Larkspur and Whiteharbor. It gets pretty stressful. The armored transport helps, but it also serves as a flashing billboard for every criminal in scanning range to come and take a look.</TEXT><PARA/><POP/></RDL>'''
820 = '''<RDL><PUSH/><TEXT>This is our turn-around point in Helion. We run Pharmaceuticals from our Denver plant to Ft. Bush and Whiteharbor, then continue on to Los Angeles. We pick up raw materials like Hydrocarbons and Polymers that are produced in Manchester here.</TEXT><PARA/><POP/></RDL>'''
821 = '''<RDL><PUSH/><TEXT>One day Helion will rid itself of the Ashbound and its Cardamine habit. There will be much safer ways for users to feel good using future Cryer products, without funding the activities of illegals like the Rogues and Ashbound.</TEXT><PARA/><POP/></RDL>'''
822 = '''<RDL><PUSH/><TEXT>Cryer transports don’t handle small shipments to police and military bases. We also don’t go to Cortez or Magellan. So Universal, Gateway, and Orbital Spa perform distribution duties for us in this part of Sirius.</TEXT><PARA/><POP/></RDL>'''
823 = '''<RDL><PUSH/><TEXT>My ship has been running Beryllium into Colorado for some time now. We pick it up in Kensington, Larkspur. That’s just a way point. It gets mined in the Cambridge system. We usually stop here and pick up a load of Optical Chips for the Cambridge Consumer Goods factory on our return. Sure beats hauling Food to Freeport 4.</TEXT><PARA/><POP/></RDL>'''
824 = '''<RDL><PUSH/><TEXT>Just got in on a Gold run from the Hood in Dublin. Everything was fine until we got to the Barrier Cloud in Magellan. The Lane Hackers were waiting as usual — pounced on us as soon as we entered the Trade Lane to Freeport 4. We got lucky when a Universal convoy showed up. Still lost one of my escorts.</TEXT><PARA/><POP/></RDL>'''
825 = '''<RDL><PUSH/><TEXT>Gateway supplies most of the IMG bases in the Nacre Reach and hauls their products to market. Take Freeport 4 in Magellan, for example. We ship them their Food, Pharmaceuticals, Consumer Goods, Engine Components, and H-Fuel. We bring Water back. Not a killer run, but it pays the bills.</TEXT><PARA/><POP/></RDL>'''
826 = '''<RDL><PUSH/><TEXT>I’m on leave from the </TEXT><TRA italic="true"/><TEXT>Yukon</TEXT><TRA italic="false"/><TEXT>. That’s the battleship parked in orbit above LA. They gave a group of us some time to recuperate after doing patrols into Cortez. Helion is a joke compared to the Independent Worlds. The LPI wouldn’t last two seconds out there.</TEXT><PARA/><POP/></RDL>'''
827 = '''<RDL><PUSH/><TEXT>I’m on leave from the </TEXT><TRA italic="true"/><TEXT>Yukon</TEXT><TRA italic="false"/><TEXT>. They gave my squadron some time to recuperate after doing a month of combat patrols in Cortez. Helion is a joke compared to the Independent Worlds. The LPI wouldn’t last two seconds out there.</TEXT><PARA/><POP/></RDL>'''
828 = '''<RDL><PUSH/><TEXT>It’s frustrating trying to stop the Cardamine smuggling. All of those rich New Yorkers keep buying the drugs, then they turn around and tell us that it’s a big problem that has to be fought. Rumor is that Cryer is doing some pretty hard lobbying back in Whiteharbor to keep the drug war going.</TEXT><PARA/><POP/></RDL>'''
829 = '''<RDL><PUSH/><TEXT>Los Angeles is the dream post for an LPI trooper. Nice climate, and they give you a special cost of living adjustment for all the high prices. Living quarters are kind of tight, but you take what you can get.</TEXT><PARA/><POP/></RDL>'''
830 = '''<RDL><PUSH/><TEXT>Sometimes I really can’t take the superior attitude of the Synth Food and Ageira types with their fancy houses and all. They expect us to keep their little world perfect, but at the same time, stay invisible. We’re just honest, hardworking Joes trying to make a living.</TEXT><PARA/><POP/></RDL>'''
831 = '''<RDL><PUSH/><TEXT>Had a long patrol today. Went all the way to the Cinderwell Gate. We ran into some Rogues at the Mojave Trade Lane bend. Seems to be a popular place for the criminally minded.</TEXT><PARA/><POP/></RDL>'''
832 = '''<RDL><PUSH/><TEXT>We’re pretty sure there’s a Rogue base in the Whitney Field, but the higher ups say that’s a Bounty Hunter problem. We should just find it and clear out the nest. My guess is that Bounty Hunters are paying off the LPI execs back in Houston. They don’t want the criminal population to be reduced too much. Bad for business.</TEXT><PARA/><POP/></RDL>'''
833 = '''<RDL><PUSH/><TEXT>California is Rogue central. We got ’em in all the asteroid fields. No Xenos, though. Never been any mining or manufacturing workers in this system.</TEXT><PARA/><POP/></RDL>'''
834 = '''<RDL><PUSH/><TEXT>We think there’s an illegal access route from Cortez into the Tahoe Cloud somewhere, but that’s not our problem. I won’t set foot off the Trade Lane in that area.</TEXT><PARA/><POP/></RDL>'''
835 = '''<RDL><PUSH/><TEXT>I’m heading out on a patrol into the Sierra Ice Field tomorrow. It’ll be my first time on an assault crew. I’m pretty pumped. We’re looking for Rogues to fill this week’s prison convoy bound for Texas.</TEXT><PARA/><POP/></RDL>'''
836 = '''<RDL><PUSH/><TEXT>I heard some Bounty Hunters talking about trailing an Outcast in the Tahoe the other day. He lost ’em before they could get close enough. Probably hauling Cardamine. All those scum use it.</TEXT><PARA/><POP/></RDL>'''
837 = '''<RDL><PUSH/><TEXT>They got me on California Minor patrol. Pretty boring. Nothing like the Tahoe Cloud. That’s the hardest place LPI goes in all of Helion.</TEXT><PARA/><POP/></RDL>'''
838 = '''<RDL><PUSH/><TEXT>The military handles most of the tough Lane Hacker and Outcast areas of the western Tahoe Cloud. They don’t want us interferin’, they say. Just a bunch of privileged, arrogant hotheads in my opinion.</TEXT><PARA/><POP/></RDL>'''
839 = '''<RDL><PUSH/><TEXT>Next week they’re transferring me to the Los Angeles-San Diego Trade Lane patrol through the Tahoe. You’re liable to run into Rogues, Lane Hackers, even Ashbound. It’s an assignment for gung ho young ’uns straight out of the academy, or bored vets about to join the Bounty Hunters. I’m neither.</TEXT><PARA/><POP/></RDL>'''
840 = '''<RDL><PUSH/><TEXT>Last week the Rogues attacked the prison convoy bound for Texas somewhere near the Cinderwell Gate. It’s tough keeping that area under control — no bases nearby. They didn’t succeed, but it was close there for a while. It shut down the Trade Lane for a couple of hours.</TEXT><PARA/><POP/></RDL>'''
841 = '''<RDL><PUSH/><TEXT>We purchase most of our supplies like Food, Oxygen, Pharmaceuticals, and H-Fuel from Los Angeles. It’s a short run, but off the Trade Lanes, so it takes a while. Not too much risk from Rogues with these cargos.</TEXT><PARA/><POP/></RDL>'''
842 = '''<RDL><PUSH/><TEXT>I run the Silver to California Minor for the cloud-seeding operation, which will need to go on for another few decades at least. The Rogues wait patiently for the Silver run. I’ve been attacked so many times I don’t even think much about it anymore.</TEXT><PARA/><POP/></RDL>'''
843 = '''<RDL><PUSH/><TEXT>California Minor gets their Terraforming Gases and Water from Magellan and Manchester. All the Water here is so full of toxic, dissolved mineral salts that it’s too expensive to attempt desalinization. That’s why they mined out so much of this system’s ice asteroids over the centuries. All that’s left is low grade, dirty stuff.</TEXT><PARA/><POP/></RDL>'''
844 = '''<RDL><PUSH/><TEXT>We bring in Fertilizers from Houston, then ship out Food to Denver, Whiteharbor, and Houston. Synth Foods is the future. I wish the farmers of Orsena and Dornmark could see that.</TEXT><PARA/><POP/></RDL>'''
845 = '''<RDL><PUSH/><TEXT>This is Synth Foods’ home base. We still produce a fair amount of Food here, although not as cheaply as Stuttgart. Our plan is to eventually phase out growing operations on Los Angeles. The soil and climate just can’t support the sustainable production levels that we need.</TEXT><PARA/><POP/></RDL>'''
846 = '''<RDL><PUSH/><TEXT>We are committed to enhancing Food production throughout the Nacre Reach, whether it is through increased use of biodomes in the Independent and Border Worlds, or the introduction of more efficient use of technology to traditional growing areas like Stuttgart and Kyushu. We will prevail.</TEXT><PARA/><POP/></RDL>'''
847 = '''<RDL><PUSH/><TEXT>They got me running basic supplies to all the bases in California. There’s the Yukon, the Police border station, California Minor, and then that research base, Willard. Gets a little exciting in the clouds, especially when I’m hauling Food and Pharmaceuticals. They don’t care much about the Oxygen and Water.</TEXT><PARA/><POP/></RDL>'''
848 = '''<RDL><PUSH/><TEXT>I do the Larkspur to Whiteharbor Gold run inbound, Luxury Goods on the return trip. Gets rough crossing the Barrier. Pretty much a breeze inside of Helion. We usually stop in L.A. because there’s always a lot of demand from all the luxury boutiques here.</TEXT><PARA/><POP/></RDL>'''
849 = '''<RDL><PUSH/><TEXT>I’m heading out in a couple of hours to do an Optical Chip run from the Ageira plant to Houston. I hope to pick up some Construction Machinery and return next week sometime. Otherwise I could be stuck on Houston for a while.</TEXT><PARA/><POP/></RDL>'''
850 = '''<RDL><PUSH/><TEXT>I’m heading out in a couple of hours to do an Optical Chip and Polymer run to Houston. I hope to pick up some Construction Machinery and Engine Components and return next week sometime. If I’m lucky, they might give me a Silver shipment for the cloud-seeding programs here in California.</TEXT><PARA/><POP/></RDL>'''
851 = '''<RDL><PUSH/><TEXT>I’m just passing through from Ember Pier HQ with a load of Superconductors bound for Southampton in Larkspur. It’s more interesting than the Water run from Whiteharbor. Now that’s a bore.</TEXT><PARA/><POP/></RDL>'''
852 = '''<RDL><PUSH/><TEXT>The Planetform folks let us use their site as a forward base for our operations in the central part of California. They’re mostly interested in stopping the Rogues who prey on their Silver shipments from Los Angeles.</TEXT><PARA/><POP/></RDL>'''
853 = '''<RDL><PUSH/><TEXT>Fastest way to some quick bounties? Head straight for the Trade Lane to the Magellan Gate, around the middle of the Tahoe Cloud. You’ll get some strikes pretty fast in that area.</TEXT><PARA/><POP/></RDL>'''
854 = '''<RDL><PUSH/><TEXT>This is a good location to launch into the Tahoe Cloud. You don’t have to go far to find trouble in there. It’s also a straight shot across the system to the Whitney Field, if that don’t offer enough action for you.</TEXT><PARA/><POP/></RDL>'''
855 = '''<RDL><PUSH/><TEXT>I made it all the way to the Texas Jump Hole in the Whitney Field yesterday. I didn’t hang around for long. Didn’t even a take a shot at the Rogues in the area. I’ll go back next time with a posse.</TEXT><PARA/><POP/></RDL>'''
856 = '''<RDL><PUSH/><TEXT>The air’s a little thin here still. I like to sleep in my ship at night. It’s warmer and there’s more air. Those Planetform people are kind of uptight sometimes. Guess that’s how all Vesperans are.</TEXT><PARA/><POP/></RDL>'''
857 = '''<RDL><PUSH/><TEXT>Heaviest action in the system is by the Cortez Hole in the Tahoe Cloud. You better come in with your guns blazing if you want a chance of going home that night. Been trying to talk a few of my buddies into doing it, but they all keep backing out.</TEXT><PARA/><POP/></RDL>'''
858 = '''<RDL><PUSH/><TEXT>We run patrols around California Minor. I think it’s a waste of time. Not enough bad guys around here. I heard that the real reason is that Synth Foods wants to move up the schedule on Planetform a lot. They been resisting, saying there were too many shipping losses.</TEXT><PARA/><POP/></RDL>'''
859 = '''<RDL><PUSH/><TEXT>I hate this place — cold, it’s always windy, really thin air. I get headaches all the time. We’re supposed to make Planetform happy by being here. What did I do to get this transfer? Must have pissed someone off back in Los Angeles.</TEXT><PARA/><POP/></RDL>'''
860 = '''<RDL><PUSH/><TEXT>This is as far off the Trade Lanes as we get in Helion. They’ll build one to the planet once Planetform is finished. Then Synth Foods will shift Food production here.</TEXT><PARA/><POP/></RDL>'''
861 = '''<RDL><PUSH/><TEXT>We bring in the bulk of our supplies like Food, Pharmaceuticals, H-Fuel, Construction Machinery, and Oxygen from Los Angeles.</TEXT><PARA/><POP/></RDL>'''
862 = '''<RDL><PUSH/><TEXT>The Oxygen is mostly used for the terraforming machines, which run around the clock. Their purpose is twofold: to increase Oxygen content in the air around the base, and to introduce various atmosphere forming gases like carbon dioxide and nitrogen into the atmosphere. We still have at least fifty years before this operation is completed.</TEXT><PARA/><POP/></RDL>'''
863 = '''<RDL><PUSH/><TEXT>We bring in our Terraforming Gases from Birmingham in the Manchester system. At least there aren’t any of those dreadful Gaians in this corner of space.</TEXT><PARA/><POP/></RDL>'''
864 = '''<RDL><PUSH/><TEXT>Some time ago Planetform discovered that the Alien Organisms found in the Edge Nebula systems had very high reproductive rates, and could exist in quite hostile conditions. One of their primary functions is to dissolve the carbonate rocks found in abundance here, releasing elemental oxygen and carbon dioxide in the process.</TEXT><PARA/><POP/></RDL>'''
865 = '''<RDL><PUSH/><TEXT>Most of our Water is hauled in from Freeport 4 in the Magellan system. The thin snow layer that covers this planet is actually quite recent, a product of our Phase I cloud-seeding efforts. California Minor is still too cold and arid for sustainable agriculture.</TEXT><PARA/><POP/></RDL>'''
866 = '''<RDL><PUSH/><TEXT>Planetform, Inc. has operations in two Vespera systems in addition to this one: Edinburgh and Tau-31. The Edinburgh project has been plagued from conception by terrorist activity in the area. Our headquarters is in the Larkspur system at Canterbury.</TEXT><PARA/><POP/></RDL>'''
867 = '''<RDL><PUSH/><TEXT>Helion has been quite accommodating to our needs. We certainly haven’t had to contend with anything like the Gaians. They are more pragmatic here. The primary use of this planet following the completion of our project will be synthetic Food production, now that Los Angeles is becoming too dry.</TEXT><PARA/><POP/></RDL>'''
868 = '''<RDL><PUSH/><TEXT>The use of Alien Organisms dramatically accelerate the terraforming process. Original estimates for California Minor were in the 400-year range. We now think we will be able to complete it in 840 AS, less than a quarter of the original estimate.</TEXT><PARA/><POP/></RDL>'''
869 = '''<RDL><PUSH/><TEXT>Our hope is that some even more robust and prolific Alien Organisms can be discovered in the mysterious clouds of the Edge Nebula. It’s as if they were tailor-made for the process of making planets habitable.</TEXT><PARA/><POP/></RDL>'''
870 = '''<RDL><PUSH/><TEXT>We bring in supplies to augment Planetform’s operation here — mostly Oxygen, Food, Construction Machinery, and H-Fuel.</TEXT><PARA/><POP/></RDL>'''
871 = '''<RDL><PUSH/><TEXT>Just made the monthly Silver run from Newark. Always gives me the nerves. Everybody out there is your enemy when you start hauling high-value stuff. Guess they use it for their cloud-seeding operations.</TEXT><PARA/><POP/></RDL>'''
872 = '''<RDL><PUSH/><TEXT>We bring in the Alien Organisms from Newark that Planetform uses to jumpstart the process. The Sirius Commerce Act prohibits any import of Alien Organisms onto planets with indigenous life forms like Whiteharbor, but sterile planets like this one don’t apply.</TEXT><PARA/><POP/></RDL>'''
873 = '''<RDL><PUSH/><TEXT>We’re here to pick up this ship’s Toxic Waste for shipment to our Dortmund reprocessing facility in Ironreach. You’d think Helion would take advantage of all this potentially valuable material, but they were throwing it out in the debris fields of Texas before we started our program.</TEXT><PARA/><POP/></RDL>'''
874 = '''<RDL><PUSH/><TEXT>Running MOX in from Dortmund is pretty risky for us in Helion. The criminals would love to get their hands on it, especially the Xenos. At least there aren’t any of those annoying people in California.</TEXT><PARA/><POP/></RDL>'''
875 = '''<RDL><PUSH/><TEXT>California doesn’t offer us much in the way of useful Scrap Metal or Toxic Waste, outside of this ship. Nothing like the other Helion systems. Helion has been very profitable for ALG, which is helpful for our company, as BMM has locked us out of Vespera.</TEXT><PARA/><POP/></RDL>'''
876 = '''<RDL><PUSH/><TEXT>I’m pretty new to the Charter Guild. They call me a “reformed” Rogue. Spent ten years in Sugarland rolling Sheet Metal. Now I’m out here hunting my old comrades down. At least it’s legit work. I can live on a real planet instead of inside a stinky rock somewhere out in an asteroid field.</TEXT><PARA/><POP/></RDL>'''
877 = '''<RDL><PUSH/><TEXT>I just got back from Cortez. Did an assault patrol into the Corcovado Field. It’s crawling with Rogues. We got a bunch, but there were plenty more. They should send the military in there to clean it out. Its like a rat’s nest.</TEXT><PARA/><POP/></RDL>'''
878 = '''<RDL><PUSH/><TEXT>This is a good spot for hunting Hackers and Ashbound, probably the best in Helion space. They all collect in the Tahoe Cloud to the west of the Lane. Happy hunting!</TEXT><PARA/><POP/></RDL>'''
879 = '''<RDL><PUSH/><TEXT>The Navy guys don’t give us access to a lot of this ship. Guess they’re suspicious of a lot of the Guild members; a lot of them have done time in Texas. I don’t blame ’em, some of the Hunters can be pretty rough looking.</TEXT><PARA/><POP/></RDL>'''
880 = '''<RDL><PUSH/><TEXT>Bounty Hunters have a difficult job and we certainly aren’t a very popular group, but the best of us are the finest pilots in all of Sirius. Many will look down upon us, because most of our ranks were once criminals, but that is their mistake. It is just as honorable to fall and rise again, than never to fall at all.</TEXT><PARA/><POP/></RDL>'''
881 = '''<RDL><PUSH/><TEXT>I’m a second-generation Bounty Hunter. My dad was famous; he made it all the way out to the Edge Worlds before gettin’ toasted by those Outcast bastards. Me, I’m going to hunt them down till the day I die. I’m gonna stuff that Cardamine down their throats until they gag.</TEXT><PARA/><POP/></RDL>'''
882 = '''<RDL><PUSH/><TEXT>I just got out of West Point last week. This is my first assignment. I’m patrolling the Lane between here and the Cortez Gate. So far it hasn’t been as interesting as I thought it would be.</TEXT><PARA/><POP/></RDL>'''
883 = '''<RDL><PUSH/><TEXT>We could clean up all the Independent Worlds like Cortez and Magellan in a flash if the other Houses would just let us base our battleships there. Guess they’re afraid we’d annex them eventually. Not much there to exploit as far as I can tell.</TEXT><PARA/><POP/></RDL>'''
884 = '''<RDL><PUSH/><TEXT>Our toughest patrol in the system is the Tahoe Cloud circuit. We usually see somebody in there. Tough to track them down, though — short visibility and lots of asteroids.</TEXT><PARA/><POP/></RDL>'''
885 = '''<RDL><PUSH/><TEXT>The Outcast smuggling route goes right along the Trade Lane in the Tahoe Cloud for some reason. We’ve caught a few that way. Guess they can’t resist the temptation to snag some cargo.</TEXT><PARA/><POP/></RDL>'''
886 = '''<RDL><PUSH/><TEXT>We handle the west side of the Trade Lane to the Magellan Gate, LPI, the east. In my opinion, we should handle everything in there. They wouldn’t know what to do with a Lane Hacker or an Outcast if they caught one.</TEXT><PARA/><POP/></RDL>'''
887 = '''<RDL><PUSH/><TEXT>I just got reassigned from the Mississippi based in Texas. We were in Hudson chasing down Xenos and Rogues. The Dornmark Military doesn’t help at all in that area. Guess they’re broke.</TEXT><PARA/><POP/></RDL>'''
888 = '''<RDL><PUSH/><TEXT>I’m doing patrols into Cortez. We usually just hang around at the Gate, but sometimes we venture down to Curacao. After that the convoys are on their own. I call it the “Cortez gap.”</TEXT><PARA/><POP/></RDL>'''
889 = '''<RDL><PUSH/><TEXT>We could clean up this second if the Guild would just tell us where the Jump Holes are. We know one is in the Tahoe Cloud, but have been unable to locate it. Cinderwell doesn’t let us vary our patrol routes as much as we would like.</TEXT><PARA/><POP/></RDL>'''
890 = '''<RDL><PUSH/><TEXT>I don’t know what they’re doing on that research base Willard. I hear it’s something with those Alien Organisms they ship in from Sigma-17.</TEXT><PARA/><POP/></RDL>'''
891 = '''<RDL><PUSH/><TEXT>I’m bringing in a load of Pharmaceuticals and Food from Los Angeles. A typical Helion battleship has a lot of people to take care of.</TEXT><PARA/><POP/></RDL>'''
892 = '''<RDL><PUSH/><TEXT>Just making a quick stop by the bar while they unload my ship. I do the Oxygen, Water, and H-Fuel run from Los Angeles to Willard Research Station once a week. I drop most of it here. They don’t have much storage, so they need pretty frequent visits.</TEXT><PARA/><POP/></RDL>'''
893 = '''<RDL><PUSH/><TEXT>I’m based in Detroit. Just making my monthly rounds to all the police and military bases to deliver Side Arms to the new recruits. At least there aren’t any of those pesky Xenos in California.</TEXT><PARA/><POP/></RDL>'''
894 = '''<RDL><PUSH/><TEXT>This place makes me feel real unwelcome. Them Navy folks just don’t want us here. They’re all suspicious and secretive. We’re just performing a necessary duty — waste disposal. That’s what I would call it.</TEXT><PARA/><POP/></RDL>'''
895 = '''<RDL><PUSH/><TEXT>I’m getting bored around here. Same old stuff with the Rogues and Hackers. I want to get out to the Border Worlds. The Rift Captains and Cinder Guard are supposed to be nasty in the Omega systems.</TEXT><PARA/><POP/></RDL>'''
896 = '''<RDL><PUSH/><TEXT>I’m just taking a breather. Been floating around this cursed cloud for weeks. There’s lots of bad guys out there; it’s just tough to nail them. Half the time you’re just trying to avoid ice crystals appearing out of the mists.</TEXT><PARA/><POP/></RDL>'''
897 = '''<RDL><PUSH/><TEXT>This is a good base to intercept Ashbound doing their smuggling runs from Cortez to Texas. Their main route passes just south of here. That doesn’t make it guaranteed, but definitely a better chance.</TEXT><PARA/><POP/></RDL>'''
898 = '''<RDL><PUSH/><TEXT>Those white coats gave me a strange request last week. They said to bring back an Outcast with their Cardamine. Guess they want to study them more closely. Sounds kind of creepy to me.</TEXT><PARA/><POP/></RDL>'''
899 = '''<RDL><PUSH/><TEXT>We’re not too far from the Whitney Ice Asteroid Field. The main Rogue hideout in California is there. They also got the Jump Hole to Texas.</TEXT><PARA/><POP/></RDL>'''
900 = '''<RDL><PUSH/><TEXT>I’m here to patrol the area and look for Rogues and Ashbound. I have no idea what research they do. That area of the base is restricted access, scientists only. They have some biological quarantine barrier between the labs and the rest of the ship.</TEXT><PARA/><POP/></RDL>'''
901 = '''<RDL><PUSH/><TEXT>I heard they had an accident down in the lab last week. Some sort of unknown pathogen released from one of their samples. Guess that’s why they keep it so closed off.</TEXT><PARA/><POP/></RDL>'''
902 = '''<RDL><PUSH/><TEXT>They used to attack this base a lot before we placed a regular squadron on it. We run a patrol through the cloud daily, letting them know who’s in charge here.</TEXT><PARA/><POP/></RDL>'''
903 = '''<RDL><PUSH/><TEXT>I hear they got all sorts of bizarre plants no one’s seen before growing in a greenhouse down on Level B. They’re all sorts of strange orange and purple colors. Cryer’s supposed to be interested in that one.</TEXT><PARA/><POP/></RDL>'''
904 = '''<RDL><PUSH/><TEXT>Most of this ice around us is ammonia. Not much help for California’s water problems. They mined the Sierra and Whitney Fields for a long time, however. Nothing left there now but some old, abandoned equipment and Rogues.</TEXT><PARA/><POP/></RDL>'''
905 = '''<RDL><PUSH/><TEXT>The LSF has brought in some of those strange Artifacts to the lab. We never heard what happened, but I suppose they did some experimenting or something. I never have figured out exactly what the LSF does.</TEXT><PARA/><POP/></RDL>'''
906 = '''<RDL><PUSH/><TEXT>I can’t stand being penned up on this rock for weeks. We only see the sun as a hazy apparition most of the time, unless we’re on patrol. Those Bounty Hunters get stinky, too. Guess they don’t learn proper hygiene in prison.</TEXT><PARA/><POP/></RDL>'''
907 = '''<RDL><PUSH/><TEXT>Some top-secret folks came in from Alaska last week. All interested in the Alien stuff going on here. Sometimes I think there’s a lot more going on in Helion than I ever imagined.</TEXT><PARA/><POP/></RDL>'''
908 = '''<RDL><PUSH/><TEXT>The Navy is a great place for someone to move up in Helion society. We’re held in great respect by the big corporations, defending their interests wherever they may be.</TEXT><PARA/><POP/></RDL>'''
909 = '''<RDL><PUSH/><TEXT>This base was opened up in 700 to more carefully study the Alien Organisms that are brought back from the Omicron systems. They figured this field would be a good place to study their interaction with ammonia and methane, which are far more common frozen gases than water in the California system.</TEXT><PARA/><POP/></RDL>'''
910 = '''<RDL><PUSH/><TEXT>I used to work for the Bounty Hunters before joining up with the Navy. I don’t fit in too good with these squeaky-clean military types, but I’ve saved their butts a bunch of times out in Cortez. They need people like me.</TEXT><PARA/><POP/></RDL>'''
911 = '''<RDL><PUSH/><TEXT>This is my second stop on the California supply run. We bring Food, Water, Oxygen, Pharmaceuticals, and H-Fuel to the military and police bases in the system. Last stop is the San Diego Border Station at the Magellan Gate.</TEXT><PARA/><POP/></RDL>'''
912 = '''<RDL><PUSH/><TEXT>Not sure why they want these Alien Organisms here. We bring them in from Newark. I thought all they used these things for was terraforming.</TEXT><PARA/><POP/></RDL>'''
913 = '''<RDL><PUSH/><TEXT>I think the military should handle its own supplies for bases like this. Too much risk for us. Why did they have to build a base in the middle of the second nastiest cloud in Helion space anyway?</TEXT><PARA/><POP/></RDL>'''
914 = '''<RDL><PUSH/><TEXT>I love it out here. I grew up on Houston, but I always dreamed about going to the Barrier. It’s so beautiful in the skies of Helion. Who would’ve known it was chock-full of nasties? I use this as my base for popping into Magellan. I’d rather have the LPI as roommates than the criminals on those Freeports.</TEXT><PARA/><POP/></RDL>'''
915 = '''<RDL><PUSH/><TEXT>I got the Jump Hole routes down in this part of Sirius. The Ashbound run their drugs from Manchester through a Hole to Magellan, then across to Cortez. From there, into the Tahoe Cloud, then across this system to the Texas Hole. Pretty good, eh? I dare you to follow it.</TEXT><PARA/><POP/></RDL>'''
916 = '''<RDL><PUSH/><TEXT>The Guild does a regular “fishing” trip into the Cloud every day. We usually snag something. A Rogue or two — once in a while you get an Outcast. Like catching one of those giant black two-finned sharks they have on Curacao. You have to let it run the line till it tires out.</TEXT><PARA/><POP/></RDL>'''
917 = '''<RDL><PUSH/><TEXT>They say if you want to get in with the Ashbound, get friendly with the Rogues. Then graduate to the Lane Hackers. Run some drugs. Then you’re on your way. Hard to turn back at that point, since you’ll be a Cardamine addict for life.</TEXT><PARA/><POP/></RDL>'''
918 = '''<RDL><PUSH/><TEXT>I’m doing long-range recon patrols into the Whitney Field. We do a lazy loop around it, keeping our distance from the Rogue base. Our usual path runs right along the Outcast smuggling route, so you have to be real careful.</TEXT><PARA/><POP/></RDL>'''
919 = '''<RDL><PUSH/><TEXT>The Rift Captains are a tough lot. Best chance to get in with them is with the Junkers. Whatever you do, stay away from the Hessian and Outcast alliances. As I said, hard to do.</TEXT><PARA/><POP/></RDL>'''
920 = '''<RDL><PUSH/><TEXT>Talk about bad luck… I got posted here six months ago. LPI shouldn’t even be here. This is practically Border World territory. We got a huge cloud full of nasties separating us from civilization. Can’t just go for a pleasure run to Los Angeles.</TEXT><PARA/><POP/></RDL>'''
921 = '''<RDL><PUSH/><TEXT>They send all the problem people here, literally to kill you. Our western patrol goes right into the thick of the cloud west of the Lane. I’ve seen more than one of my buddies disappear in a puff of smoke. One moment they’re joking with you about their next vacation, next thing, poof!</TEXT><PARA/><POP/></RDL>'''
922 = '''<RDL><PUSH/><TEXT>They set up this border station to keep a watch on the Magellan Gate, since it’s so isolated from everything else in the system. Then some genius planetside decided that we needed to do patrols into the Tahoe Cloud.</TEXT><PARA/><POP/></RDL>'''
923 = '''<RDL><PUSH/><TEXT>The eastern patrol goes through some old abandoned paths from the ice mining days. Then it loops back towards the Trade Lane. I just grit my teeth the whole way and hope that no baddies show up on radar.</TEXT><PARA/><POP/></RDL>'''
924 = '''<RDL><PUSH/><TEXT>I’m just countin’ the days. I got thirty-two left before I go back to a life. The attrition rate here is real bad. So far, twenty guys this month got vaporized by Ashbound, Hackers, or Rogues. That’s some bad odds. I need to look for a new line of work if I make it through this.</TEXT><PARA/><POP/></RDL>'''
925 = '''<RDL><PUSH/><TEXT>I may as well join the Bounty Hunters if I’m going to get posts like this. When they told me back on Sugarland that there was a combat opening in California, I jumped at the chance. Now I know why. I was replacing some other fool who lasted all of three days.</TEXT><PARA/><POP/></RDL>'''
926 = '''<RDL><PUSH/><TEXT>Just dropping off some basic supplies from Los Angeles. We usually stop at Willard first. Today we’re bringing in Food, Oxygen, Water, and H-Fuel. I’m getting out of here as fast as I can.</TEXT><PARA/><POP/></RDL>'''
927 = '''<RDL><PUSH/><TEXT>They ordered some Side Arms, so we’re obliging. I wish they could just come to Los Angeles to pick them up; it would make life a lot easier. I guess the replacement rate for new recruits is pretty high, so they need a lot of new issues on Side Arms.</TEXT><PARA/><POP/></RDL>'''
928 = '''<RDL><PUSH/><TEXT>I guess the Universal contract with LPI and the Navy is real lucrative. Half the time we’re flying half-empty. I don’t care. Just give me my paycheck. At least the pirates don’t hassle us too much.</TEXT><PARA/><POP/></RDL>'''
929 = '''<RDL><PUSH/><TEXT>If you want to really make some money with us, come to Cali in Tau-23. Its exact location is up to you to discover.</TEXT><PARA/><POP/></RDL>'''
930 = '''<RDL><PUSH/><TEXT>Those annoying Xenos seem to think that they will be able to defeat the Junkers and force us to use them as our intermediaries. They are sorely mistaken in that assumption.</TEXT><PARA/><POP/></RDL>'''
931 = '''<RDL><PUSH/><TEXT>I’m running a Cardamine load in from the Lane Hacker base in Magellan. Just taking a Cardamine break before I head on to Buffalo in the Badlands. It’s a very long journey to Helion from where I come from.</TEXT><PARA/><POP/></RDL>'''
932 = '''<RDL><PUSH/><TEXT>A few of our brethren are prisoners at Sugarland. The supply of Cardamine in the prison is adequate to keep them alive. Those that have been sent to Huntsville with the Xenos don’t last long.</TEXT><PARA/><POP/></RDL>'''
933 = '''<RDL><PUSH/><TEXT>We do quick hops across these systems. I’m on a convoy headed for Beaumont in the Texas Debris Fields. We started in Cortez yesterday at the Rogue base. Normally the Rogues do these runs, but they were losing too many shipments. Sometimes you just have to do it yourself.</TEXT><PARA/><POP/></RDL>'''
939 = '''<RDL><PUSH/><TEXT>Larkspur serves as our supply base for the Thames Outpost — high in orbit above us. We purchase Food, H-Fuel, Oxygen, and Water.</TEXT><PARA/><POP/></RDL>'''
940 = '''<RDL><PUSH/><TEXT>The Gold mined at our GS&amp;M base in Dublin is brought here for shipment to the House capitals. It is closely guarded until it is within the hands of the shipper who will transport it. Dublin is not far, but Molly attacks are frequent.</TEXT><PARA/><POP/></RDL>'''
941 = '''<RDL><PUSH/><TEXT>BMM views the Mollys as vicious hooligans with no morals whatsoever. We abhor their approach of extreme violence over sensible moderation.</TEXT><PARA/><POP/></RDL>'''
942 = '''<RDL><PUSH/><TEXT>I almost caught a Corsair in the Cornwall Field yesterday. They’ve been gettin’ real aggressive lately — walkin’ all over that Police Authority, they are. The government called us in as backup until they get up to speed on those Border World pirates.</TEXT><PARA/><POP/></RDL>'''
943 = '''<RDL><PUSH/><TEXT>I heard those Rift Captains found a Hole to Cambridge in the Somerset that nobody even knew existed. That’s when all the trouble started in London. Before that, the Rift Captains weren’t that bad in Cambridge. Nothing much that interested them there.</TEXT><PARA/><POP/></RDL>'''
944 = '''<RDL><PUSH/><TEXT>The Bounty Hunters in Vespera are different lot than those in Helion. Some of us are former Bowex pilots; a few are former BMM types. Only a few are from the police. Me, I came from the IMG. I was gettin’ bored chipping rock all day. I knew the Jump Hole network okay, and I could deal with an Outcast or Corsair. It was a natural fit.</TEXT><PARA/><POP/></RDL>'''
945 = '''<RDL><PUSH/><TEXT>The Rift Captains run their Artifacts from the Somerset up to Devon, then across to the Junker base of Trafalgar. Then they start to pillage. That’s where I come in.</TEXT><PARA/><POP/></RDL>'''
946 = '''<RDL><PUSH/><TEXT>I’ve been chasing Mollys in Dublin for a while. Thought I’d move up and try me some Rift Captains. They’re pretty easy to find in the Somerset Field. Just watch out for those gas pockets left over from the old mining days.</TEXT><PARA/><POP/></RDL>'''
947 = '''<RDL><PUSH/><TEXT>I used to be a BMM miner in the Somerset when I was a young bloke. Then they shut us down for good ’bout 10 years back. Some of us went to the Mollys and IMG; I joined up with the Hunters.</TEXT><PARA/><POP/></RDL>'''
948 = '''<RDL><PUSH/><TEXT>Larkspur serves as our primary distribution point for H-Fuel in Vespera. It’s shipped in from the Glasgow Outpost in Leeds. From here we transfer it to ships bound for police and military bases within Cambridge, Manchester, and Dublin.</TEXT><PARA/><POP/></RDL>'''
949 = '''<RDL><PUSH/><TEXT>Side Arms are transferred from Universal transports to Bowex ships on Larkspur for shipment to Cambridge, Leeds, and the three Armed Forces battleships stationed within our frontiers.</TEXT><PARA/><POP/></RDL>'''
950 = '''<RDL><PUSH/><TEXT>Some of our traffic consists of Food shipments from Cambridge. We use London as a trans-shipment point, with cargos delivered to Southampton and the </TEXT><TRA italic="true"/><TEXT>Essex</TEXT><TRA italic="false"/><TEXT>  and </TEXT><TRA italic="true"/><TEXT>Suffolk</TEXT><TRA italic="false"/><TEXT>  battleships. On the return trip to Cambridge I usually haul Fertilizers or Construction Machinery.</TEXT><PARA/><POP/></RDL>'''
951 = '''<RDL><PUSH/><TEXT>Our ships haul the raw materials like Basic Alloys and Optronics to Cambridge and return with Consumer Goods, which get distributed to Leeds and Glasgow. Unfortunately, all of these Commodities are desired by the Rift Captains, and there have been a fair number of attacks in recent weeks, mostly in the eastern end of this system.</TEXT><PARA/><POP/></RDL>'''
952 = '''<RDL><PUSH/><TEXT>Bowex handles BMM Gold shipments to Helion. We usually make the return run with Luxury Goods. It gets a bit dicey in the Independent Worlds.</TEXT><PARA/><POP/></RDL>'''
953 = '''<RDL><PUSH/><TEXT>Pharmaceuticals are shipped to Leeds, Manchester, and military bases from our primary Vespera distribution center here in Larkspur.</TEXT><PARA/><POP/></RDL>'''
954 = '''<RDL><PUSH/><TEXT>We handle the eastern portion of the system; the Vespera Armed Forces patrols the west. That arrangement worked most satisfactorily until the arrival of the Rift Captains. At this point, we may well have the more difficult assignment in Larkspur.</TEXT><PARA/><POP/></RDL>'''
955 = '''<RDL><PUSH/><TEXT>We’ve got a few homegrown problems in Vespera. The Mollys are trying to break off in Dublin. BMM and the Armed Forces have that headache. We deal with the Gaians, some upper-class Cambridge types that went eco-terrorist on us. More annoying than anything, they are.</TEXT><PARA/><POP/></RDL>'''
956 = '''<RDL><PUSH/><TEXT>Just came back from a rough patrol into the Cornwall Field. Those bloody Rift Captains have decided to move in and have a little party at our expense. It’s like they came out of nowhere. Used to be an easy job, Larkspur was. That’s just a memory now.</TEXT><PARA/><POP/></RDL>'''
957 = '''<RDL><PUSH/><TEXT>The Vespera Police Authority is a highly professional organization that takes pride in its highly ethical conduct. We view that contemptible corporation called the LPI as an embarrassment to Helion. They are more interested in staffing their factories inexpensively than maintaining law and order.</TEXT><PARA/><POP/></RDL>'''
958 = '''<RDL><PUSH/><TEXT>I was relieved on Canterbury yesterday. Did a return patrol along the Lane. I’m glad to be back home. I’ll take the rain any day over Rift Captains and Gaians interrupting my sleep.</TEXT><PARA/><POP/></RDL>'''
959 = '''<RDL><PUSH/><TEXT>My only experience with Molly attacks has been on the prison transport run to Newgate in the Manchester system. We’re heading out momentarily with a crew of them brought in from the </TEXT><TRA italic="true"/><TEXT>Essex</TEXT><TRA italic="false"/><TEXT>  yesterday. We have to keep them sedated and well secured, as they can get quite violent — not my favorite duty.</TEXT><PARA/><POP/></RDL>'''
960 = '''<RDL><PUSH/><TEXT>We provide Optronics and Engine Components for Vespera. They are shipped from our plants in Honshu. It is a long and arduous journey through the Border Worlds, where Ashbound are an ever present threat. Recently, Rift Captains have started attacking our ships within Larkspur itself. This is most unsettling.</TEXT><PARA/><POP/></RDL>'''
961 = '''<RDL><PUSH/><TEXT>We pick up Gold on some of our return trips — always a stressful journey. It’s as if you shine in the dark for the criminal elements like the Mollys and Ashbound. They come like moths to a flame.</TEXT><PARA/><POP/></RDL>'''
962 = '''<RDL><PUSH/><TEXT>Kishiro would like to become your H-Fuel shipper of choice. The mixture sold here comes from our new Ogashawa complex in Sigma-19, a joint venture with the GMG.</TEXT><PARA/><POP/></RDL>'''
963 = '''<RDL><PUSH/><TEXT>The Engine Components business has become very difficult. We used to be the exclusive supplier to Vespera. Kishiro has become a strong adversary since the 80-Years War. I guess we’ll have to cut our costs to remain competitive.</TEXT><PARA/><POP/></RDL>'''
964 = '''<RDL><PUSH/><TEXT>It’s a very difficult journey between here and Dornmark, especially when you are transporting something as alluring as Vesperan Gold. The Cinder Guard and Rift Captains will be waiting for us in Omega-3 and Omega-7 — you can be sure of that.</TEXT><PARA/><POP/></RDL>'''
965 = '''<RDL><PUSH/><TEXT>What a cold and wet place this is. It’s a long journey for our GMG H-Fuel from Osaka, Honshu. We often pick up our return cargo from the Stokes Smelter in Leeds.</TEXT><PARA/><POP/></RDL>'''
966 = '''<RDL><PUSH/><TEXT>Vespera is the only source of Gold for the entire Nacre Reach. We are heading back to Yokohama with a load as soon as we can arrange the escort. Those Ashbound will be waiting on our long journey home.</TEXT><PARA/><POP/></RDL>'''
967 = '''<RDL><PUSH/><TEXT>We ship a large amount of Fertilizer to Larkspur, where it is transferred to Bowex freighters for the final leg of their trip to Cambridge. We are proud to assist Vespera’s farmers, who are still independent and not under the evil eye of Synth Foods.</TEXT><PARA/><POP/></RDL>'''
968 = '''<RDL><PUSH/><TEXT>ALG ships valuable components to this base from our facilities in Dortmund. This includes Ship Hull Panels and High-Temperature Alloys.</TEXT><PARA/><POP/></RDL>'''
969 = '''<RDL><PUSH/><TEXT>The ship-building supplies we have brought to this base are also shipped to other locations within Helion. Both Norfolk and Baltimore have need of our Ship Hull Panels and our High-Temperature Alloys.</TEXT><PARA/><POP/></RDL>'''
970 = '''<RDL><PUSH/><TEXT>The Xenos in this system make themselves a constant problem to us. The fools do not understand that without our goods Helion could not make the ships to protect her. More aggravating is that Helion authorities do not seem to take the Xeno threat seriously.</TEXT><PARA/><POP/></RDL>'''
971 = '''<RDL><PUSH/><TEXT>From Ft. Bush and Denver we bring Pharmaceuticals to this base. From that point on Universal and Republican ship our medical goods throughout Helion and the rest of Sirius.</TEXT><PARA/><POP/></RDL>'''
972 = '''<RDL><PUSH/><TEXT>It is a good thing that we do not have to spend much time within this system, since it is filled with all manner of scum. Other shipping companies take over and ship our Pharmaceuticals from here, leaving them with the risk of piracy.</TEXT><PARA/><POP/></RDL>'''
973 = '''<RDL><PUSH/><TEXT>The Ashbound bring their dreaded Cardamine to this system and then on to Cinderwell. At Cryer we are working on a synthetic form of Cardamine that will not lower worker productivity and will be relatively non-addictive.</TEXT><PARA/><POP/></RDL>'''
974 = '''<RDL><PUSH/><TEXT>This base provides us with a great deal of the Construction Machinery we use in all our operations in Cinderwell. From this base we ship to Whiteharbor, Breakwater, Norfolk, Ft. Bush, and our Baltimore Shipyards.</TEXT><PARA/><POP/></RDL>'''
975 = '''<RDL><PUSH/><TEXT>Deep Space Engineering builds all the greatest of Helion’s technological marvels. From the Jump Gates and Trade Lanes that enable high-speed travel throughout the Nacre Reach, to the luxury liners that bring her joy, we are Helion construction.</TEXT><PARA/><POP/></RDL>'''
976 = '''<RDL><PUSH/><TEXT>The majority of our operations are found in Cinderwell, yet Texas is where you must come if you are looking for heavy-duty Construction Machinery. This makes us vulnerable to attacks from the pirates and thieves that litter this system.</TEXT><PARA/><POP/></RDL>'''
977 = '''<RDL><PUSH/><TEXT>This base being primarily a Commodity producer means that it is a tempting target for the criminals in the area. So I patrol the Trade Lanes nearby, hunting for the scum who waylay shipping.</TEXT><PARA/><POP/></RDL>'''
978 = '''<RDL><PUSH/><TEXT>We offset the cost of housing Helion’s criminals by putting them to work making products for the good citizens of Helion. If you are on the Sugarland you will be working in the scrap smelters; if you are on the Huntsville, you will be making Consumer Goods.</TEXT><PARA/><POP/></RDL>'''
979 = '''<RDL><PUSH/><TEXT>The Ashbound come in from the California Jump Hole and then head for the Junker base in Debris Field One. Before they leave the system, they do a bit of pirating themselves. You’d think they wouldn’t care about pirating with all the money they make from Cardamine.</TEXT><PARA/><POP/></RDL>'''
980 = '''<RDL><PUSH/><TEXT>The Xenos are strong in this system; they harass foreign shipping resources on the way to Cinderwell from Dornmark. The Dornmark government and her corporations are displeased with the lack of action from LPI, so oftentimes we get hired to reduce the Xeno population in the system.</TEXT><PARA/><POP/></RDL>'''
981 = '''<RDL><PUSH/><TEXT>There are all manner of debris fields in this system for the outlaws to hide in, but you have to be careful if you go in, because some of the debris areas contain radiated fields that will cook you and your ship before you can escape.</TEXT><PARA/><POP/></RDL>'''
982 = '''<RDL><PUSH/><TEXT>If the Ashbound are going to attack a prison, they will attack the Sugarland. That is the only prison that houses them, and truth be told, there aren’t many Ashbound there at all. Most of them fight to the death when cornered. The ones who are captured usually die within the first month of incarceration for some reason. Some of them manage to survive, though.</TEXT><PARA/><POP/></RDL>'''
983 = '''<RDL><PUSH/><TEXT>Some of the finest quality Diamonds are brought to this base from Beaumont. We also ship Cobalt here. The income we receive from selling these goods allow us to re-supply our base from here with Consumer Goods, Oxygen, H-Fuel, Water, Food, Pharmaceuticals, Side Arms, and Engine Components.</TEXT><PARA/><POP/></RDL>'''
984 = '''<RDL><PUSH/><TEXT>Our base is nicely hidden within this system. A lot of shipping come through Texas, which means there is a lot of piracy, too. That just means we get to take part in the shipping of goods in Texas. If you want to do business with us, look for our base in the North Dallas Debris Field.</TEXT><PARA/><POP/></RDL>'''
985 = '''<RDL><PUSH/><TEXT>We supply the underclass of Houston with its vice of choice: Cardamine from Beaumont. You were surprised? Everyone has bad habits; we just make it easier for them.</TEXT><PARA/><POP/></RDL>'''
986 = '''<RDL><PUSH/><TEXT>Our battleships have been patrolling this system since the catastrophe with the Dallas. At first we patrolled this system to protect citizens from going into deadly radiation areas caused by the failed Ageira experiment, but now we patrol to curb the piracy in the lawless area of the Forbidden Zone.</TEXT><PARA/><POP/></RDL>'''
987 = '''<RDL><PUSH/><TEXT>My patrol wing flies through the southern part of the system, along the edges of the South and East Dallas Debris Fields. Our route then takes us along the western edge of the Grande Negra. A ship can only last a few seconds in the dark matter of the Negras.</TEXT><PARA/><POP/></RDL>'''
988 = '''<RDL><PUSH/><TEXT>All our patrols originate from the Mississippi. Some patrol the Trade Lane to the Bering Jump Gate, and others fly through the North Dallas Debris Field and along the southern edge of Pequena Negra looking for criminals where we suspect Jump Holes may exist.</TEXT><PARA/><POP/></RDL>'''
989 = '''<RDL><PUSH/><TEXT>Fifty percent of the population living within this system has either served time at an LPI facility or is currently incarcerated. We house all of Helion’s prison population on the Sugarland or Huntsville, or within the penal colony planetside.</TEXT><PARA/><POP/></RDL>'''
990 = '''<RDL><PUSH/><TEXT>We’ve got permanent residents at the prison here. They are the ones called NCRs, or “no chance for rehabilitation.” In other words, they are going to be staying in Texas for the rest of their lives.</TEXT><PARA/><POP/></RDL>'''
991 = '''<RDL><PUSH/><TEXT>There is a Junker base in this system, and that’s where you are going to find a lot of the criminals that haven’t been dragged to one of our prison ships yet. But it’s just a matter of time.</TEXT><PARA/><POP/></RDL>'''
992 = '''<RDL><PUSH/><TEXT>We offset the cost of housing Helion’s criminals by putting them to work making products for the good citizens of Helion. If you are on the Sugarland, you will be working in the scrap smelters; if you are on the Huntsville, you will be making Consumer Goods.</TEXT><PARA/><POP/></RDL>'''
993 = '''<RDL><PUSH/><TEXT>If it wasn’t for LPI, Helion Police, Inc., Helion would have been bankrupted by the sheer cost of housing all of her prisoners. But they were smart enough to privatize their department of corrections, and that is how we were formed.</TEXT><PARA/><POP/></RDL>'''
994 = '''<RDL><PUSH/><TEXT>A lot of the original LPI employees were police that had worked for the state. When the police went private, the pay decreased, so we had to make up for the shortfall, if you know what I mean. Fortunately, we have a little more latitude than we did as employees of the government.</TEXT><PARA/><POP/></RDL>'''
995 = '''<RDL><PUSH/><TEXT>Republican ships goods from this base to the heart of Helion: Cinderwell. Mining Machinery is sent to Breakwater and Ft. Bush, and Cobalt is also delivered to Ft. Bush. Whiteharbor receives Silver and Diamonds that have been transported from Dornmark.</TEXT><PARA/><POP/></RDL>'''
996 = '''<RDL><PUSH/><TEXT>We bring Engine Components and Silver to Los Angeles from Houston. It’s a long stretch for us to get to California, but at least there aren’t any Xenos there.</TEXT><PARA/><POP/></RDL>'''
997 = '''<RDL><PUSH/><TEXT>Republican ships Copper to Pueblo, and we return with Superconductors and Super Alloys bound for the Oder Shipyard in Ironreach. One day Dornmark will manufacture all of our necessary materials.</TEXT><PARA/><POP/></RDL>'''
998 = '''<RDL><PUSH/><TEXT>Many of the Commodities traded here are shipped to Dornmark. From Houston we ship Pharmaceuticals to Ironreach, and Optical Chips to the Alster Shipyard in Hamburg.</TEXT><PARA/><POP/></RDL>'''
999 = '''<RDL><PUSH/><TEXT>We ship a wide variety of raw materials and finished products needed by Helion industry from the Ironreach system: Mining Machinery from Essen; Copper and Silver from Bonn; Diamonds from Ironreach; and Cobalt, Engine Components, and Copper from the Ring.</TEXT><PARA/><POP/></RDL>'''
1000 = '''<RDL><PUSH/><TEXT>All the Fertilizer produced here is bought and shipped by Synth Foods to destinations around Sirius. Most of the Fertilizer makes its way to Stuttgart to support Synth Foods’ largest operation to date. Food produced there is then imported into Texas to cheaply feed the burgeoning prison populations there.</TEXT><PARA/><POP/></RDL>'''
1001 = '''<RDL><PUSH/><TEXT>The Fertilizers produced at this base will be flown by us to the biodomes of Freeport 2 in Bering. From there we ship the Food back to Houston, to augment the Food imported from Stuttgart.</TEXT><PARA/><POP/></RDL>'''
1002 = '''<RDL><PUSH/><TEXT>We promote commerce in Helion as well as Dornmark and Orsena. We will ship Fertilizers from this base to Denver and Los Angeles, and then ship Food back here from Los Angeles.</TEXT><PARA/><POP/></RDL>'''
1003 = '''<RDL><PUSH/><TEXT>Everyone needs Fertilizers, even the Orsena. That’s why our transports ship the Fertilizers from this base to Deshima in Shikoku.</TEXT><PARA/><POP/></RDL>'''
1004 = '''<RDL><PUSH/><TEXT>Our shippers in Cinderwell return with Side Arms from Detroit, Super Alloys and Superconductors from Ember Pier, and H-Fuel and Optronics from Ft. Bush.</TEXT><PARA/><POP/></RDL>'''
1005 = '''<RDL><PUSH/><TEXT>Houston and its orbiting prisons are the primary Consumer Goods manufacturing locations for Helion, with the distinction of being the cheapest producer in the entire Nacre Reach, thanks to our free prisoner labor. Consumer Goods are distributed by Universal throughout Helion space from here.</TEXT><PARA/><POP/></RDL>'''
1006 = '''<RDL><PUSH/><TEXT>The Consumer Goods industry needs various raw materials. On return trips we’ll deliver Polymers and Optical Chips from Los Angeles, or Optronics from Ft. Bush.</TEXT><PARA/><POP/></RDL>'''
1007 = '''<RDL><PUSH/><TEXT>Just came in with a load of H-Fuel from Ft. Bush. We’ll head out in the morning to make the delivery rounds to the Huntsville, Sugarland, and the Mississippi.</TEXT><PARA/><POP/></RDL>'''
1008 = '''<RDL><PUSH/><TEXT>Universal services all police and military bases in Texas. Only thing we bring back down is Basic Alloys from the Sugarland Smelter. They use them in the Consumer Goods and Construction Machinery plants here.</TEXT><PARA/><POP/></RDL>'''
1009 = '''<RDL><PUSH/><TEXT>Our convoy just moored a few hours ago. We ran a load of Silver in from Bonn. Rough run, that was. I think we’ll try the Bering system next time. Sometimes we run Diamonds. That’s even more intense. Those criminals can smell it like a pack of dogs.</TEXT><PARA/><POP/></RDL>'''
1010 = '''<RDL><PUSH/><TEXT>We ship Pueblo-produced Super Alloys and Superconductors all the way to Ironreach. Try to pick up a load of Engine Components and Copper at the Ring for the return.</TEXT><PARA/><POP/></RDL>'''
1011 = '''<RDL><PUSH/><TEXT>This system is a Bounty Hunter’s dream. Point your ship in a direction, start flying, and sooner or later you’re going to run into somebody who is wanted for a bounty — especially on the west side of the system. West Texas is a dangerous cesspool.</TEXT><PARA/><POP/></RDL>'''
1012 = '''<RDL><PUSH/><TEXT>I like to patrol out by the Negra Pequena and the North Dallas Debris Field. You can find Rogues, Ashbound, Xenos, and Junkers in that area. There is a Jump Hole around there that leads to Cinderwell, I believe. Somehow a lot of the criminals find their way into this system from California in that general area, too.</TEXT><PARA/><POP/></RDL>'''
1013 = '''<RDL><PUSH/><TEXT>The radiation pocket in the center of the West Dallas Debris Field will fry your ship quick. One of my favorite things to do is chase the scumbags I’m following into that area, and then I let the radiation do my work for me.</TEXT><PARA/><POP/></RDL>'''
1014 = '''<RDL><PUSH/><TEXT>IC pays me well to protect their interests in Texas. They don’t have any people or offices here, but this is a very important system for them. The majority of the crime that goes on in Helion goes on right here in this system. And since most of the stolen cargo is insured by IC… well, you get the idea.</TEXT><PARA/><POP/></RDL>'''
1015 = '''<RDL><PUSH/><TEXT>I believe that an Outcast would rather die than go to prison. I don’t know of any currently at this facility. I think that any Ashbound who do happen to get captured go to the Sugarland.</TEXT><PARA/><POP/></RDL>'''
1016 = '''<RDL><PUSH/><TEXT>I’ve seen the Jump Hole in this system that leads to California. It is in the West Dallas Debris Field, just north of the radiation pocket.</TEXT><PARA/><POP/></RDL>'''
1017 = '''<RDL><PUSH/><TEXT>I oversee the workers in the textile wing of this prison facility. The clothes you are wearing right now were made by convicts who work under my supervision.</TEXT><PARA/><POP/></RDL>'''
1018 = '''<RDL><PUSH/><TEXT>This facility houses all the Xenos we apprehend in Helion space. The Xenos are a relatively small faction, but their numbers are constantly growing. This place is where they do their recruiting.</TEXT><PARA/><POP/></RDL>'''
1019 = '''<RDL><PUSH/><TEXT>Any Ashbound that are captured are sent to the Sugarland; if they come here they will die. Xenos hate Ashbound because they are so different and foreign. So any Outcast who comes will be killed within days by the Xeno population.</TEXT><PARA/><POP/></RDL>'''
1020 = '''<RDL><PUSH/><TEXT>The convoys that run prisoners to this base from other systems in Helion are under constant attack. Criminals are always trying to break their comrades out before they reach this base. Once they get here the apprehended criminals are here to stay.</TEXT><PARA/><POP/></RDL>'''
1021 = '''<RDL><PUSH/><TEXT>All of the work done at this ship actually takes place onboard. If you were ever to find yourself an inmate on the Sugarland, you might be put on a work detail clearing radioactive debris from one of the debris fields in this system.</TEXT><PARA/><POP/></RDL>'''
1022 = '''<RDL><PUSH/><TEXT>We don’t do a lot of security patrols in his system; we leave most of that to the Navy or Bounty Hunters. This is more of a corrections area for LPI than anything else. We are most concerned with keeping the prisoners here and putting them to work once they arrive, not necessarily catching them.</TEXT><PARA/><POP/></RDL>'''
1023 = '''<RDL><PUSH/><TEXT>One of the patrols that we make in this system is the Trade Lane from Houston to the Cinderwell Jump Gate. There are too many attacks on that small part of Texas space to ignore.</TEXT><PARA/><POP/></RDL>'''
1024 = '''<RDL><PUSH/><TEXT>The East Dallas Debris Field is where many inmates are transported from the other penal ship Sugarland to clean up the scrap. The radiation has died down quite a bit in that field since the Dallas incident, but it is still too dangerous for civilian workers.</TEXT><PARA/><POP/></RDL>'''
1025 = '''<RDL><PUSH/><TEXT>Many of the civilians in this system have four choices: work for LPI on one of the penal ships, become a Bounty Hunter, work at Houston in the Fertilizer plants, or become a criminal. I chose working for LPI; it was the safest choice.</TEXT><PARA/><POP/></RDL>'''
1026 = '''<RDL><PUSH/><TEXT>This base receives Pharmaceuticals, Side Arms, and the usual supplies from Houston. While I’m here between shipments I get a chance to see the scum who harass our shipping concerns. They’re behind bars or making toys in the factory.</TEXT><PARA/><POP/></RDL>'''
1027 = '''<RDL><PUSH/><TEXT>This is the only safe zone in Texas, behind the F-Zone boundary of weapon platforms and satellites controlled by the military. No Universal ship would ever be caught over there. That’s criminal country.</TEXT><PARA/><POP/></RDL>'''
1028 = '''<RDL><PUSH/><TEXT>It is a wonder that anything arrives or leaves this system. Most of the criminals in Helion reside in Texas. The Navy and LPI do their best to curb piracy and theft within Texas, but it’s not enough. All our shipments that pass through here are insured by IC, so I suppose it becomes their problem — except for our pilots, who get killed in pirate attacks.</TEXT><PARA/><POP/></RDL>'''
1029 = '''<RDL><PUSH/><TEXT>The Xenos must be destroyed at all costs — they make it difficult for non-Helion corporations to do their jobs here. Perhaps if Helion does not care about this problem, we will begin letting them take care of their own waste problems.</TEXT><PARA/><POP/></RDL>'''
1030 = '''<RDL><PUSH/><TEXT>From Dortmund in the heart of Dornmark we bring MOX to this ship so that it can power its magnificent engines. Once we arrive and deliver the MOX we pick up the Toxic Waste produced in the ship’s reactors and ship it back to Dortmund to be reprocessed into fresh reactor fuel.</TEXT><PARA/><POP/></RDL>'''
1031 = '''<RDL><PUSH/><TEXT>ALG has had to take some of the profits gained from doing business in this sector to pay Bounty Hunters for protection. There are all manner of criminals in this system, and this last leg of our journey is usually the most dangerous. So a little protection from the Bounty Hunters is always welcome.</TEXT><PARA/><POP/></RDL>'''
1032 = '''<RDL><PUSH/><TEXT>The Texas system at one time was just wide open space with a couple planets. All the crap you see in this system — the dark matter clouds, the debris fields with the radiation — it is all Ageira’s fault. It all happened in one fateful day centuries ago.</TEXT><PARA/><POP/></RDL>'''
1033 = '''<RDL><PUSH/><TEXT>The prisons here are revolving doors for the criminals. That is why if you want to get rid of crime, you have to kill the criminals. I don’t know where you come down on the rehabilitation issue, but I think it’s just a phony word used by politicians and corporate spin wizards.</TEXT><PARA/><POP/></RDL>'''
1034 = '''<RDL><PUSH/><TEXT>If you’re looking for Xenos, I recommend you check out the South Dallas Debris Field here in the southern edge of the system, hidden away. It’s rumored that there’s a Jump Hole leading to Hudson.</TEXT><PARA/><POP/></RDL>'''
1035 = '''<RDL><PUSH/><TEXT>I used to live planetside on Houston. They’re always going through some drought. Worked in the phosphate Fertilizer plant for a while as a supervisor for the LPI, then I switched to Consumer Goods. Let me tell you, I wouldn’t buy any of that junk they produce in there. So here I am with the Guild, where I belong.</TEXT><PARA/><POP/></RDL>'''
1036 = '''<RDL><PUSH/><TEXT>I don’t like hanging around this base, but I can put my ear to the ground and hear where the Navy is encountering criminals nearby. That way I can use my sources and the Navy’s sources to track down the scum I’m hired to kill.</TEXT><PARA/><POP/></RDL>'''
1037 = '''<RDL><PUSH/><TEXT>I actually spent some time on the Huntsville a few years back, but I’m one of the smart ones. It is a downward spiral to stay in the crime business in Texas; sooner or later you’re going to get a life sentence or you’re going to get killed. I’ve never heard of a Rogue or Xeno retiring rich.</TEXT><PARA/><POP/></RDL>'''
1038 = '''<RDL><PUSH/><TEXT>After the Dallas incident this system went to hell. I guess it was a bad idea in the long run to make one system the depository for all criminals within a House and a government test area.</TEXT><PARA/><POP/></RDL>'''
1039 = '''<RDL><PUSH/><TEXT>This system used to be the testing grounds for Ageira’s Jump Gate projects in the early days of Helion. After the Dallas got destroyed with about half of Texas, the government pulled stakes and left the system.</TEXT><PARA/><POP/></RDL>'''
1040 = '''<RDL><PUSH/><TEXT>The epicenter of the Dallas explosion was almost directly across the sun from us, between those two dark matter clouds. Rumor is that a Jump Hole was formed by the incident. That’s when all the crime problems in Helion started.</TEXT><PARA/><POP/></RDL>'''
1041 = '''<RDL><PUSH/><TEXT>We do the majority of the patrolling here in the system. We are commissioned with curbing the criminal activity in Texas, but it is almost an impossible job. Every time we bring one in, they are releasing two more for time served, and most of them are coming back.</TEXT><PARA/><POP/></RDL>'''
1042 = '''<RDL><PUSH/><TEXT>One of my ancestors was on guard duty aboard the Dallas on that fateful day. He and everyone else onboard was killed instantly. The ironic part was that the naval commander had recommended the ship be moved to a safe distance from the experimental Jump Gate, so the test didn’t begin until they had repositioned the Dallas to twice the normal distance.</TEXT><PARA/><POP/></RDL>'''
1043 = '''<RDL><PUSH/><TEXT>If the Bounty Hunters and LPI weren’t so damned easy to bribe, Helion would have much less crime on her hands. But that’s what happens when you hire a corporation to do the government’s job, or when dealing with mercenaries.</TEXT><PARA/><POP/></RDL>'''
1044 = '''<RDL><PUSH/><TEXT>Many of the prisoners aboard the two penal ships in this system are petty criminals who don’t deserve the sentence they got, but that doesn’t matter to the LPI. They just want workers for their facilities, so they will arrest everyone they can.</TEXT><PARA/><POP/></RDL>'''
1045 = '''<RDL><PUSH/><TEXT>Once the government pulled out of the system, half the people in Texas lost their jobs. All the money here was government money, and overnight it was gone. Crime exploded three hundred percent within the first ten years.</TEXT><PARA/><POP/></RDL>'''
1046 = '''<RDL><PUSH/><TEXT>Did you know that there weren’t any Jump Holes in Texas before the Dallas incident? The criminals in all of Sirius were helped more than they could possibly know. Texas is the crossroads of the criminal universe. If it weren’t for the Jump Holes, we would have crime locked down to nothing.</TEXT><PARA/><POP/></RDL>'''
1047 = '''<RDL><PUSH/><TEXT>It is our pleasure to deliver the goods that keep this military installation operational. That way we know that they have every reason to track down and kill the murderous pirates who harass our shipping.</TEXT><PARA/><POP/></RDL>'''
1048 = '''<RDL><PUSH/><TEXT>This ship requires that we bring supplies from Houston. These Commodities are necessary to keep the crew and ship maintained and equipped.</TEXT><PARA/><POP/></RDL>'''
1049 = '''<RDL><PUSH/><TEXT>We ship excess Water, H-Fuel, and Oxygen to the Sugarland. We are a company dedicated to keeping crime at a minimum by making sure that the authorities have all they need to do their jobs.</TEXT><PARA/><POP/></RDL>'''
1050 = '''<RDL><PUSH/><TEXT>You can find good Scrap Metal in this system. As the radiation slowly dies down, more and more of it will be accessible to us.</TEXT><PARA/><POP/></RDL>'''
1051 = '''<RDL><PUSH/><TEXT>This is the crossroads of the criminal universe: Jump Holes to Hudson, Cinderwell, and California. Without this lovely lawless area of west Texas connecting them so conveniently, we’d have a much harder time operating in Helion space.</TEXT><PARA/><POP/></RDL>'''
1052 = '''<RDL><PUSH/><TEXT>Though the Rogues try to be friends with the Xenos, the simple truth is that they are friends with no one and nothing but money and Cardamine. So if the Xenos start becoming too troublesome, we pay a few Rogues to go bag a couple.</TEXT><PARA/><POP/></RDL>'''
1053 = '''<RDL><PUSH/><TEXT>The Xenos in this system are a hindrance to our drug trade. They are rather fun to kill, though, because I know that they hate us so much. The Junkers will pay for proof of a dead Xeno, so I might as well make money doing it.</TEXT><PARA/><POP/></RDL>'''
1054 = '''<RDL><PUSH/><TEXT>There are many Silver and Diamond shipments in this system that the Lane Hackers give us information on — well, perhaps “give” isn’t the right word. The Lane Hackers are eager to trade their information for our Cardamine.</TEXT><PARA/><POP/></RDL>'''
1055 = '''<RDL><PUSH/><TEXT>Several weeks ago I dragged a Bounty Hunter through the edge of the Negra Pequena and watched his ship disappear into the darkness — quite enjoyable. His last distress call was sent wideband, so I was able to hear the fear in his voice.</TEXT><PARA/><POP/></RDL>'''
1056 = '''<RDL><PUSH/><TEXT>This system is my home, and this base is one of my favorite hangouts. You can get whatever you want at this base or on the Lanes picking ships for cargo. One day I’m going to retire with a mountain of Cardamine and Gold.</TEXT><PARA/><POP/></RDL>'''
1057 = '''<RDL><PUSH/><TEXT>I kind of like the Xenos. Truth is I almost joined up with them on a tour of “the Walls,” but I decided to join up with the Rogues instead. But the Junkers will pay me good money or Cardamine to kill Xenos, so if I see one flying solo, then I’ll kill him. If there’s more than one, I don’t pay them much mind.</TEXT><PARA/><POP/></RDL>'''
1058 = '''<RDL><PUSH/><TEXT>I’ve served three sentences on the Huntsville. If you’ve served time there, you know the real name given to her by the inmates. We call the Huntsville “the Walls.”</TEXT><PARA/><POP/></RDL>'''
1059 = '''<RDL><PUSH/><TEXT>We are a Dornmark company committed to disposing of all of Sirius’ waste. Just think of the future when there will be no more toxic radiation areas in space, no more debris fields for criminals to hide in. All of Sirius will be clean, thanks to ALG.</TEXT><PARA/><POP/></RDL>'''
1060 = '''<RDL><PUSH/><TEXT>Our transports will pick up Scrap Metal from Norfolk and Baltimore in Cinderwell and bring them here to be used in the smelters, which will convert the scrap into alloys.</TEXT><PARA/><POP/></RDL>'''
1061 = '''<RDL><PUSH/><TEXT>We bring MOX to fuel the giant furnaces aboard this manufacturing platform from Dortmund, then take the Toxic Waste produced here back to Dortmund to be reprocessed into new MOX fuel pellets — a highly efficient process that is more cost-effective than that used at LD-14 in Leeds.</TEXT><PARA/><POP/></RDL>'''
1062 = '''<RDL><PUSH/><TEXT>The largest concentration of Bounty Hunters in the system is hanging out around the North Dallas Debris Field. There is a Junker base in there, and where you find Junkers you are going to find other criminals too.</TEXT><PARA/><POP/></RDL>'''
1063 = '''<RDL><PUSH/><TEXT>If you patrol the Trade Lanes leading from Cinderwell to Bering and Hudson, you are going to run across Xenos. Those guys hate outsiders; anyone who is not Helion is an enemy in their eyes. So if you have been hired to kill Xenos, just watch the foreign shipping convoys moving through.</TEXT><PARA/><POP/></RDL>'''
1064 = '''<RDL><PUSH/><TEXT>One of my buddies was chasing some Ashbound near the West Dallas Debris Field a few weeks ago. He tried to cut across the edge of the Negra Pequena to catch up with them, but he stayed in too long and bought the farm. Too bad, he was pretty good.</TEXT><PARA/><POP/></RDL>'''
1065 = '''<RDL><PUSH/><TEXT>Aside from Trade Lane activity, most of the crime that takes place in this system goes on west of the warning buoys that the Navy put up to protect people from flying into dangerous space. Going past those buoys used to worry me when I was green, but now I don’t even notice them.</TEXT><PARA/><POP/></RDL>'''
1066 = '''<RDL><PUSH/><TEXT>Rogues like to come into this system since there is so much shipping passing through. They come in from Cinderwell I believe, and run their sorties from the Junker base somewhere in the North Dallas Debris Field.</TEXT><PARA/><POP/></RDL>'''
1067 = '''<RDL><PUSH/><TEXT>ALG hired me to kill all the Xenos and Rogues I run across, with a bonus for every Xeno. The truth is that Ashbound do a fair bit of pirating and raiding in this system, too. They probably drop their Cardamine with the Junkers and instead of going back home with empty hulls, decide to pick up some goodies on the way home.</TEXT><PARA/><POP/></RDL>'''
1068 = '''<RDL><PUSH/><TEXT>We bring Scrap Metal to this ship from the Beaumont within this same system. If you wanted to haul scrap, you could always come by “the Beau.” She is tucked safely into the recesses of the North Dallas Debris Field.</TEXT><PARA/><POP/></RDL>'''
1069 = '''<RDL><PUSH/><TEXT>Believe it or not, there is a large black market within the prison population aboard this ship. The only incarcerated Ashbound in all of Helion are here. We sneak them small shipments of Cardamine to keep them alive. Their brothers and sisters look after them well.</TEXT><PARA/><POP/></RDL>'''
1070 = '''<RDL><PUSH/><TEXT>The Xenos in this system make life difficult for us, but we fend them off by using our varied business contacts. Of course, it costs us money to do this, which is aggravating. Junkers shouldn’t have any enemies; we want to be friends with everyone.</TEXT><PARA/><POP/></RDL>'''
1071 = '''<RDL><PUSH/><TEXT>This ship produces the Basic Alloys that Helion uses in Houston and Cinderwell, and all our labor is done by convicted criminals. That’s how we offset the cost of their housing. Without LPI, Helion would be overrun with lawlessness, and would not be competitive with the other Houses.</TEXT><PARA/><POP/></RDL>'''
1072 = '''<RDL><PUSH/><TEXT>Our inmates are clearing the debris fields left by the Dallas incident. Many of the fields have pockets of radiation and are too dangerous to clean yet. The first one to get cool enough to begin clearing was the East Dallas area. It is still too hot for civilian workers, but our inmates do the job. We stock plenty of anti-radiation pills in the dispensary.</TEXT><PARA/><POP/></RDL>'''
1073 = '''<RDL><PUSH/><TEXT>This ship holds all the captured Ashbound. Most of the Ashbound that come here end up dying for some reason we can’t figure out, but some of them survive long enough to serve their time.</TEXT><PARA/><POP/></RDL>'''
1074 = '''<RDL><PUSH/><TEXT>The other prison ship, the Huntsville, produces the majority of Consumer Goods in Helion, although they’re sold down on Houston. We manufacture the Basic Alloys. These ships were built to alleviate the overcrowding of prison facilities planetside in Houston.</TEXT><PARA/><POP/></RDL>'''
1075 = '''<RDL><PUSH/><TEXT>I run the escort patrols around the East Dallas Debris Field. The work convoys we send out to clean the debris are vulnerable to prison escapes and criminal raids. That is the point from which they can most easily free their captured fellow criminals.</TEXT><PARA/><POP/></RDL>'''
1076 = '''<RDL><PUSH/><TEXT>We used to house Xenos at this base, but somehow they always managed to get to the Ashbound no matter how much we tried to keep them separate. In the end, the only way to stop the two factions from killing each other here was to put them on two separate ships.</TEXT><PARA/><POP/></RDL>'''
1077 = '''<RDL><PUSH/><TEXT>The smelters that work our metal works are oftentimes well-trained before they come here. A lot of these prisoners were legitimate factory workers who got tired of working for a pittance; now they work for free.</TEXT><PARA/><POP/></RDL>'''
1078 = '''<RDL><PUSH/><TEXT>Xenos attack the Ashbound and Junkers in this system, so sometimes they actually make our jobs easier for us. The Dornmark government, though, has been kicking up a fuss about the Xeno attacks on foreign shipping. The foreign corporations are pretty angry about it too, except for the Helion companies that benefit from the Xenos attacking foreign shipping.</TEXT><PARA/><POP/></RDL>'''
1079 = '''<RDL><PUSH/><TEXT>Even though the name of our company uses the word “police” in its title, I’m more of a factory manager than a law enforcement officer. I’m more concerned with squeezing all the production I can out of the miscreant workers here. Usually they are more inspired to work if I hold back their Food rations for a day or two. That always helps boost productivity.</TEXT><PARA/><POP/></RDL>'''
1080 = '''<RDL><PUSH/><TEXT>From Breakwater and Ft. Bush we bring Boron for use in the Basic Alloy production aboard this ship. Of course, we make more money hauling Commodities here from Dornmark, but the supplemental income from these smaller runs is worth our valuable time.</TEXT><PARA/><POP/></RDL>'''
1081 = '''<RDL><PUSH/><TEXT>We ship much-needed Commodities to this base all the way from Dornmark. It is a long journey but well worth it. Mining Machinery is brought here from Essen, and Copper is imported to this ship from the Ring.</TEXT><PARA/><POP/></RDL>'''
1082 = '''<RDL><PUSH/><TEXT>There is no system in Dornmark with this much widespread crime and violence. And we certainly don’t have any dark matter pockets like the ones found here. Also look at all the debris. This system is the armpit of Sirius.</TEXT><PARA/><POP/></RDL>'''
1083 = '''<RDL><PUSH/><TEXT>Universal ships Basic Alloys to Pueblo, Colorado. On the way back we pick up Hydrocarbons from Los Angeles to be used in the smelting process.</TEXT><PARA/><POP/></RDL>'''
1084 = '''<RDL><PUSH/><TEXT>We ship Basic Alloys throughout Cinderwell from this base. Then we pick up Water from Whiteharbor and ship it back here. Texas always needs Water.</TEXT><PARA/><POP/></RDL>'''
1085 = '''<RDL><PUSH/><TEXT>Basic Alloys produced here are shipped to Houston; supplies are brought up on the return trips.</TEXT><PARA/><POP/></RDL>'''
1094 = '''<RDL><PUSH/><TEXT>We’re selling a load of Pharmaceuticals produced at the Cambridge Research Station orbiting Cambridge. Cryer produces enough at the facility to supply Vespera and its adjacent Border Worlds.</TEXT><PARA/><POP/></RDL>'''
1095 = '''<RDL><PUSH/><TEXT>We often head up to Glasgow to inspect the latest shipments of Alien Organisms arriving from Sigma-17 on Samura ships. We are always looking for new varieties to aid our research and development of new drugs.</TEXT><PARA/><POP/></RDL>'''
1096 = '''<RDL><PUSH/><TEXT>Ashbound are Cryer’s worst enemy. That Edge World pestilence is well established in Vespera, especially in the northern systems of Leeds and Manchester.</TEXT><PARA/><POP/></RDL>'''
1097 = '''<RDL><PUSH/><TEXT>Gateway actually has very limited business on Larkspur. We ship in Silver from our main base at Kensington by the planet Dover. Oxygen and Water are the only Commodities that London can offer us.</TEXT><PARA/><POP/></RDL>'''
1098 = '''<RDL><PUSH/><TEXT>Gateway is in partnership with the IMG, Bowex with BMM. Until we came along, BMM had IMG in a stranglehold since Bowex would refuse to ship their products in many cases. We’ve had a rough time ourselves, since Bowex has powerful government connections that insure them exclusive contracts with the Armed Forces and Police Authority.</TEXT><PARA/><POP/></RDL>'''
1099 = '''<RDL><PUSH/><TEXT>I always feel uncomfortable here — this is Bowex territory. You can almost feel the stuffy arrogance of this place. It reeks of the Vesperan aristocrats that won’t let go of our country. BMM and Bowex — what a pair.</TEXT><PARA/><POP/></RDL>'''
1100 = '''<RDL><PUSH/><TEXT>We Junkers are engaged in only legitimate transporting activities. We need Oxygen, Water, Food, H-Fuel, and Pharmaceuticals up on Trafalgar.</TEXT><PARA/><POP/></RDL>'''
1101 = '''<RDL><PUSH/><TEXT>If you want to make some real money, haul some Cardamine and Artifacts from our base to this lovely city. Just don’t get caught by the police. We don’t know a thing.</TEXT><PARA/><POP/></RDL>'''
1102 = '''<RDL><PUSH/><TEXT>Those Rift Captains want all sorts of strange stuff. They can pay for it, so we oblige. This time I’m hauling some Basic Alloys, Engine Components, and Construction Machinery up to our base in the debris field.</TEXT><PARA/><POP/></RDL>'''
1103 = '''<RDL><PUSH/><TEXT>I’m running another load of Side Arms up to Trafalgar. It’s the only place you can buy them, legally and all, in Vespera.</TEXT><PARA/><POP/></RDL>'''
1104 = '''<RDL><PUSH/><TEXT>Orbital Spa and Cruise Lines maintains the </TEXT><TRA italic="true"/><TEXT>Shetland</TEXT><TRA italic="false"/><TEXT>  cruise ship which orbits the ecological Eden of Gaia in the Edinburgh system. They’re always in need of Food, Pharmaceuticals, Consumer Goods, and H-Fuel.</TEXT><PARA/><POP/></RDL>'''
1105 = '''<RDL><PUSH/><TEXT>I don’t understand how we became enemies of the Gaians. We are only engaged in tourism, not in the ecological change of planets like Planetform, Inc. The same Larkspur elites that secretly support the Gaians enjoy the facilities on our cruise ships. I would say that is a bit hypocritical.</TEXT><PARA/><POP/></RDL>'''
1106 = '''<RDL><PUSH/><TEXT>We ship our Luxury Goods and Luxury Foods from Larkspur to the </TEXT><TRA italic="true"/><TEXT>Shetland</TEXT><TRA italic="false"/><TEXT>  in Edinburgh on a regular basis. Watch out for the Gaians. They will often attack from the smog clouds of Leeds, or from the Islay Cloud near the ship itself.</TEXT><PARA/><POP/></RDL>'''
1107 = '''<RDL><PUSH/><TEXT>We use Larkspur mostly as a supply base for our HQ in Canterbury, right across from the Kensington Shipping Platform near Dover. Most of our shipments consist of Food, Water, and Oxygen.</TEXT><PARA/><POP/></RDL>'''
1108 = '''<RDL><PUSH/><TEXT>The Gaians harass us endlessly throughout Vesperan space. The only operation they can’t reach is California Minor. We’ve attempted to explain our views to the Vesperan public, especially on Cambridge and Larkspur, but they continue to sympathize with the terrorists.</TEXT><PARA/><POP/></RDL>'''
1109 = '''<RDL><PUSH/><TEXT>Our terraforming operations are critical to the continued well-being of Vespera. The government has not adequately explained the dire consequences for future generations if we do not complete these projects in a timely fashion.</TEXT><PARA/><POP/></RDL>'''
1110 = '''<RDL><PUSH/><TEXT>Most of our business in Vespera is with Southampton and the Stokes Smelter in Leeds. At least Larkspur is a more civilized stop than those grossly polluted sites. Vespera should learn from Dornmark and clean up its industrial waste.</TEXT><PARA/><POP/></RDL>'''
1111 = '''<RDL><PUSH/><TEXT>I just signed off a load of Side Arms to the Vesperan Police. It’s a rough run from Detroit — seems like the bad guys know every move we make, especially in Cortez. Must be those Lane Hackers at it again.</TEXT><PARA/><POP/></RDL>'''
1112 = '''<RDL><PUSH/><TEXT>Universal handles various levels of Commodities on the Whiteharbor to Larkspur route. Our armored transports handle the Vesperan Gold bound for Whiteharbor, and the Luxury Goods on the return trip. If they’re well escorted, they usually make it okay through the Independent World gauntlet.</TEXT><PARA/><POP/></RDL>'''
1113 = '''<RDL><PUSH/><TEXT>I’m making the daily run down from Waterloo to get supplies like Water, Oxygen, Food, and H-Fuel. I think I prefer it up there. At least you get to hang out around other Helion folks, not these stuffy Vesperans.</TEXT><PARA/><POP/></RDL>'''
1114 = '''<RDL><PUSH/><TEXT>Southampton is a strategic base for the Armed Forces. In addition to protecting the center of Vespera’s industrial might against attack by the criminal element, we run patrols in all directions from here.</TEXT><PARA/><POP/></RDL>'''
1115 = '''<RDL><PUSH/><TEXT>Cardamine use is also on the rise in Larkspur. We once thought it was exclusively a problem in Helion. Ashbound have been sighted in the debris fields and along the Trade Lanes near the Leeds Jump Gate, presumably engaged in smuggling and piracy activities.</TEXT><PARA/><POP/></RDL>'''
1116 = '''<RDL><PUSH/><TEXT>The patrols into the Devon Field are to keep the Gaians in check, and more importantly, to address the increasing presence of Rift Captains, who have overwhelmed the resources of the Police Authority since their arrival several years ago.</TEXT><PARA/><POP/></RDL>'''
1117 = '''<RDL><PUSH/><TEXT>Frankly, the Vesperan Armed Forces has fallen behind Orsena and Helion. We just don’t have the resources we once had. Our policy is appeasement and compromise.</TEXT><PARA/><POP/></RDL>'''
1118 = '''<RDL><PUSH/><TEXT>We run a daily patrol into the Southampton Debris Field, which contains radiation pockets and numerous criminals. We need to clean up the mess to clear out the criminal menace, but government funds are lacking. The multiple terraforming projects in progress have virtually bankrupted the treasury, and the financial drain continues.</TEXT><PARA/><POP/></RDL>'''
1119 = '''<RDL><PUSH/><TEXT>We’ve noticed a marked increase in Larkspur Artifact availability and a corresponding drop in price since the Rift Captains arrived. The Junkers are suspected in importing the banned trinkets, but they’re difficult to catch red-handed.</TEXT><PARA/><POP/></RDL>'''
1120 = '''<RDL><PUSH/><TEXT>We get many of our raw materials from the Stokes Smelter in Leeds. The inbound run usually consists of Basic Alloys, Super Alloys, or Ship Hull Panels. Then we fill up with Scrap Metal and Toxic Waste to haul up to the cesspool that they call the Leeds system.</TEXT><PARA/><POP/></RDL>'''
1121 = '''<RDL><PUSH/><TEXT>Company says Mollys cost us a lot of jobs last year. That’s why they had to lay off so many. Me, I think it’s ’cause Orsena is making transports cheaper and faster than old, stodgy BMM.</TEXT><PARA/><POP/></RDL>'''
1122 = '''<RDL><PUSH/><TEXT>I run the basic supply train up from Larkspur every few days — mostly Food, Oxygen, and Water. Not much to it, unless the Mollys show up. You just hop on the Trade Lane and there you are.</TEXT><PARA/><POP/></RDL>'''
1123 = '''<RDL><PUSH/><TEXT>Those Gaians are a bunch of upper-class Cambridge snobs that don’t have their heads screwed on straight. I would welcome a new planet to live on. It’s got to be better than the catastrophe they call Leeds.</TEXT><PARA/><POP/></RDL>'''
1124 = '''<RDL><PUSH/><TEXT>The Mollys are always sittin’ out in the Southampton or Cumbria Fields waiting for some poor BMM bloke to come along, just minding his own business. A nasty lot, they are.</TEXT><PARA/><POP/></RDL>'''
1125 = '''<RDL><PUSH/><TEXT>Those Junkers are bad for this area. Ever since they showed up we’ve been getting Ashbound. Now the Rift Captains are starting to arrive. They should go in and clean them out. Seems like they can never catch them red-handed.</TEXT><PARA/><POP/></RDL>'''
1126 = '''<RDL><PUSH/><TEXT>I’ve got my family back in Leeds. They’ve got all sorts of health problems. Company says it’s ’cause we haven’t been taking care of our kids properly. I dunno, seems like that nasty, thick brown air and smelly water may have something to do with it.</TEXT><PARA/><POP/></RDL>'''
1127 = '''<RDL><PUSH/><TEXT>Larkspur used to be the mining center of Vespera. Cornwall, Devon, Somerset, and Cumbria were all famous in their day. Those fields employed hundreds of thousands of the Vesperan working class. Now they import everything from the Border Worlds. Everyone’s had to migrate out there in search of the work.</TEXT><PARA/><POP/></RDL>'''
1128 = '''<RDL><PUSH/><TEXT>I’m a third-generation Yardie here on Southampton. We’ve built all of Vespera’s great ships ever since anyone can remember. My ancestors have worked here for hundreds of years.</TEXT><PARA/><POP/></RDL>'''
1129 = '''<RDL><PUSH/><TEXT>The Junkers are a slimy set. They like to come and steal from our storage depots when no one is looking. We had to arm them, we did. To think that the Junkers used to be proper Yardies — what a shame.</TEXT><PARA/><POP/></RDL>'''
1130 = '''<RDL><PUSH/><TEXT>Let me tell you, this is right in the thick of it as far as bad guys in Vespera. You’ve got Gaians and Rift Captains in the Devon Field, Mollys coming in from the Cumbria, and everyone imaginable in the Southampton Debris Field.</TEXT><PARA/><POP/></RDL>'''
1131 = '''<RDL><PUSH/><TEXT>Word is, the Rift Captains found some old Jump Hole in the Somerset Field from Cambridge. That’s when all the problems started over there. I’m heading over to check it out pretty soon.</TEXT><PARA/><POP/></RDL>'''
1132 = '''<RDL><PUSH/><TEXT>I’m a former Molly that saw the light in Newgate. I won’t go after my old comrades, I prefer to hunt the foreign invaders of our space like the Rift Captains and Ashbound. It’s my patriotic duty.</TEXT><PARA/><POP/></RDL>'''
1133 = '''<RDL><PUSH/><TEXT>Larkspur is a just a sideshow for the Ashbound, ’cause there’s no Jump Hole into Manchester from here. The main Cardamine route is through the Leeds smog clouds.</TEXT><PARA/><POP/></RDL>'''
1134 = '''<RDL><PUSH/><TEXT>You don’t get much of a bounty for Gaians. The Rift Captains and the Ashbound are a different matter. Bag one of them and you’ll be taking it easy for a while.</TEXT><PARA/><POP/></RDL>'''
1135 = '''<RDL><PUSH/><TEXT>I used to work these fields — know ’em like the back of my hand. That’s what gives me the edge against the baddies. Gotta watch out for those gas pockets. They’re in most of the fields in this system. They got them marked, but not everyone pays attention.</TEXT><PARA/><POP/></RDL>'''
1136 = '''<RDL><PUSH/><TEXT>On our trips from Breakwater we bring in the Boron they use for the Hull Panels. We also pick up Superconductors and Optical Chips in Los Angeles every other trip. Those are used for engine combustion chambers and avionics.</TEXT><PARA/><POP/></RDL>'''
1137 = '''<RDL><PUSH/><TEXT>Running the MOX in from LD-14 can be a real nail biter. Rumor has it that the Mollys are trying to steal some to make a bomb.</TEXT><PARA/><POP/></RDL>'''
1138 = '''<RDL><PUSH/><TEXT>I just came down from Glasgow in the Leeds system with a load of Orsena Optronics and Engine Components. That’s our HQ for all Bowex field operations. It would make more sense to be in London, but they got this thing about tradition.</TEXT><PARA/><POP/></RDL>'''
1139 = '''<RDL><PUSH/><TEXT>We just started shipping High-Temperature Alloys from ALG’s Dortmund plant to Southampton. BMM normally doesn’t give us the time of day, but they’d like to get a cheaper supplier and be less dependent on those arrogant Republican shippers.</TEXT><PARA/><POP/></RDL>'''
1140 = '''<RDL><PUSH/><TEXT>We don’t get hassled by pirates nearly as much as our competitors do. Our allies, the IMG, get along pretty well with the Mollys and the Hessians. That’s a big advantage for us in the Omega Border World Trade Lane routes to Dornmark. Of course, we still have to deal with the Rift Captains.</TEXT><PARA/><POP/></RDL>'''
1141 = '''<RDL><PUSH/><TEXT>I’m headed back out to Kensington as soon as I can. This is enemy territory as far as I’m concerned. I used to work for Bowex hauling Ship Hull Panels. We got fed up with the conservative culture and started our own thing.</TEXT><PARA/><POP/></RDL>'''
1142 = '''<RDL><PUSH/><TEXT>They are unloading my ship right now. We ship Optronics and Engine Components from Honshu on a regular basis. You should visit my homeland sometime. It’s very beautiful. The lovely blue clouds of the Crow Nebula surround my system.</TEXT><PARA/><POP/></RDL>'''
1143 = '''<RDL><PUSH/><TEXT>Kishiro is a progressive company. We are much more innovative than Samura, which uses its influence to resist change rather than embrace it. Soon we’ll be hauling the H-Fuel to this shipyard.</TEXT><PARA/><POP/></RDL>'''
1144 = '''<RDL><PUSH/><TEXT>The Ashbound are very troublesome. Ever since we opened our Hydrocarbon and Polymer plant in Tau-29, they have become very aggressive. We were even attacked in the southern part of Leeds during the last trip. That’s not a promising sign for Vespera’s well-being.</TEXT><PARA/><POP/></RDL>'''
1145 = '''<RDL><PUSH/><TEXT>Republican has been providing High-Temperature Alloys to the Nacre Reach for centuries. We still dominate this specialty, aided by our easy access to the raw materials of the Walker Nebula in Dresden and Omega-7.</TEXT><PARA/><POP/></RDL>'''
1146 = '''<RDL><PUSH/><TEXT>I noticed that the Orsena transports are unloading Engine Components also. This is not a good sign. One day we may not be coming to this shipyard with Dornmark products anymore.</TEXT><PARA/><POP/></RDL>'''
1147 = '''<RDL><PUSH/><TEXT>The route for Republican through the Omega Border Worlds is very difficult — much more so than the Tau systems that the Orsena must traverse. This challenge hurts us competitively, at least as far as the Vesperan export market is concerned.</TEXT><PARA/><POP/></RDL>'''
1148 = '''<RDL><PUSH/><TEXT>This is just a quick stop for our ship. We’re dropping off a load of H-Fuel from Osaka in the Honshu system. We’ll be heading back up to Stokes to pick up our return cargo.</TEXT><PARA/><POP/></RDL>'''
1149 = '''<RDL><PUSH/><TEXT>Vespera’s not too dangerous. At least compared to Orsena space and the Tau Border Worlds. The Jade Vow are the most serious menace with Orsena. The Ashbound replace them as the threat once you leave Kyushu.</TEXT><PARA/><POP/></RDL>'''
1150 = '''<RDL><PUSH/><TEXT>The most valuable Commodity Vespera has to offer us is Gold. We use it in our ship construction site at Yokohama for coating windows.</TEXT><PARA/><POP/></RDL>'''
1151 = '''<RDL><PUSH/><TEXT>We’re just making a pit stop to unload some Superconductors. Then it’s back to Waterloo for a little break before heading home to Ember Pier. It’s kind of polluted here in Vespera — and I thought Cinderwell was bad.</TEXT><PARA/><POP/></RDL>'''
1152 = '''<RDL><PUSH/><TEXT>Universal doesn’t bother hauling stuff past the capital systems like Larkspur. We let the local shippers take over. They can have the Border Worlds, as far as we’re concerned. Insurance premiums go up quite a bit.</TEXT><PARA/><POP/></RDL>'''
1153 = '''<RDL><PUSH/><TEXT>This Southampton yard is impressive — lots of stalls, although it doesn’t look like very many are occupied. They call this “The Bridge,” which sounds kind of optimistic to me. Looks like Vespera’s shipbuilding industry is hurting as much as ours.</TEXT><PARA/><POP/></RDL>'''
1154 = '''<RDL><PUSH/><TEXT>The </TEXT><TRA italic="true"/><TEXT>Suffolk</TEXT><TRA italic="false"/><TEXT>’s primary mission is to suppress and, if possible, eliminate Molly activity within the southwestern quadrant of the Larkspur system. The Mollys are a very fanatical group that must be stopped.</TEXT><PARA/><POP/></RDL>'''
1155 = '''<RDL><PUSH/><TEXT>You know the real war going on? It’s the Mollys and the Rift Captains. Those Rift Captains are moving in on Molly turf like they weren’t even there. We may not have a Molly problem much longer with that going on. Of course, having a sky full of Rift Captains ain’t too grand either.</TEXT><PARA/><POP/></RDL>'''
1156 = '''<RDL><PUSH/><TEXT>We do regular patrols into the Cumbria Field looking for Mollys. Just the other day we spotted a Corsair assault group. That gave us all the chills because they aren’t supposed to be over this far. They must have sniffed out that Dublin Gold and decided that they want some for themselves.</TEXT><PARA/><POP/></RDL>'''
1157 = '''<RDL><PUSH/><TEXT>I heard that the real reason we’ve been put up here is because London got wind of some Molly bomb plot to drop a bunch of dirty MOX bombs in the upper atmosphere and poison the bulk of the planet. They’re scared to death down there, those squirmy aristocrats.</TEXT><PARA/><POP/></RDL>'''
1158 = '''<RDL><PUSH/><TEXT>We do a regular circuit around Larkspur just to make sure the Mollys know we’re watching them. We just caught a few of them the other day making a run on the Thames outpost. They really hate BMM.</TEXT><PARA/><POP/></RDL>'''
1159 = '''<RDL><PUSH/><TEXT>I don’t really think the Mollys are as bad as we’ve all been told by the government. From what I hear, BMM is a pretty nasty place to work, especially that GS&amp;M station under Graves.</TEXT><PARA/><POP/></RDL>'''
1160 = '''<RDL><PUSH/><TEXT>I’ve seen some pretty good action off the </TEXT><TRA italic="true"/><TEXT>Suffolk</TEXT><TRA italic="false"/><TEXT>. Just head into the Cumbria Field. It’s got your Mollys and Rift Captains — they get straight to business. And I thought Larkspur would be a snoozer post.</TEXT><PARA/><POP/></RDL>'''
1161 = '''<RDL><PUSH/><TEXT>There’s a Jump Hole into Dublin from the Cumbria. The military would love to know about it, but hey, us Bounty Hunters have to make a livin’ now, don’t we?</TEXT><PARA/><POP/></RDL>'''
1162 = '''<RDL><PUSH/><TEXT>The Armed Forces is having problems with Rift Captains down here. It’s spreadin’ like the plague. Rift Captains don’t care much for anything but Gold in this area but, seeing as that’s the only product of Dublin, we’ve got a serious problem.</TEXT><PARA/><POP/></RDL>'''
1163 = '''<RDL><PUSH/><TEXT>They brought me in from Freeport 1. I’m a Corsair specialist — been out in the Omega systems for a couple of years. This species of Corsair is nothing like what’s out there. Heaven help ’em if those bastards make it into Vespera.</TEXT><PARA/><POP/></RDL>'''
1164 = '''<RDL><PUSH/><TEXT>Beware of the Cumbria Gas Pocket; it can put some holes in your shield pretty quick. It’s easy to avoid, except when you’ve got Mollys or Rift Captains breathing down your neck.</TEXT><PARA/><POP/></RDL>'''
1165 = '''<RDL><PUSH/><TEXT>All this talk about Mollys bombing London is just that, talk. It’s a bunch of hot air pumped up by BMM. I’ve heard they’re bribing the government and the media to keep the Mollys on the defensive.</TEXT><PARA/><POP/></RDL>'''
1166 = '''<RDL><PUSH/><TEXT>I’m just making my usual battleship delivery run for the week: Side Arms, Food, Pharmaceuticals, Oxygen, H-Fuel, and Water. I’ll head onto the </TEXT><TRA italic="true"/><TEXT>Essex</TEXT><TRA italic="false"/><TEXT>  in Dublin next. That may be more interesting.</TEXT><PARA/><POP/></RDL>'''
1167 = '''<RDL><PUSH/><TEXT>They’re installing the new MOX fuel rods for the fusion reactor right now. We’ll fill up on some nasty Toxic Waste and head back to LD-14 for reprocessing. And watch out for Mollys. They’re probably watching us right now from the Cumbria Field, waiting for me to leave the safety of the ship.</TEXT><PARA/><POP/></RDL>'''
1168 = '''<RDL><PUSH/><TEXT>Bowex has the exclusive contract to supply all military and police bases in Vespera — at highly inflated rates I might add. What’s good for Bowex is good for Vespera, I say.</TEXT><PARA/><POP/></RDL>'''
1169 = '''<RDL><PUSH/><TEXT>IC thinks we’re scum, but they need us. They never set foot outside their sanitized offices. Wouldn’t last a second out where they send us.</TEXT><PARA/><POP/></RDL>'''
1170 = '''<RDL><PUSH/><TEXT>The Rift Captains are pretty occupied with the Cinder Guard in Omega-2 right now. That’s a good thing for Vespera. If the Rift Captains didn’t have to devote all those ships and manpower to protect their right flank against the Dornmarkers, there would be some serious pillaging going on in this system.</TEXT><PARA/><POP/></RDL>'''
1171 = '''<RDL><PUSH/><TEXT>I just got back from enforcing a little IC directive in Leeds. Some Gaians were hitting the Trade Lane to the Edinburgh Gate a little too readily. Planetform lost two convoys in a row, so they sent us up to take care of business. We can’t rely on those polite Vespera police types.</TEXT><PARA/><POP/></RDL>'''
1172 = '''<RDL><PUSH/><TEXT>I’ve been on the Outcast trail for a couple of months on deep recon for IC. We’ve mapped it all the way from Edinburgh to Larkspur. Next month Operation Hailstorm commences — loads of Bounty Hunters, Vesperan military, and police going to clear out the Ashbound from Vespera for good. Me, I’m a bit skeptical.</TEXT><PARA/><POP/></RDL>'''
1173 = '''<RDL><PUSH/><TEXT>IC pays the best of all. You better be good, but they’ll reward you well if you can get the job done. The Vesperan government is broke — too much terraforming is my guess.</TEXT><PARA/><POP/></RDL>'''
1174 = '''<RDL><PUSH/><TEXT>IC doesn’t care much about what happens off of Trade Lanes or Jump Gates. That’s why Junkers and Hogosha never really register on their radar. IC doesn’t see the obvious role the Junkers play in supplying and harboring criminals.</TEXT><PARA/><POP/></RDL>'''
1175 = '''<RDL><PUSH/><TEXT>I’m here to pick up some more Trade Lane Parts for the Trade Lane construction site in Tau-23 — a pretty ambitious project by BMM. They got the Vesperan government to foot part of the bill, all for some lousy Niobium. I hope it’s worth it.</TEXT><PARA/><POP/></RDL>'''
1176 = '''<RDL><PUSH/><TEXT>One of the company rules for as long as I can remember is that nobody touches Trade Lane or Jump Gate construction without LSF clearance. I never did figure that one out. What do they have to do with us?</TEXT><PARA/><POP/></RDL>'''
1177 = '''<RDL><PUSH/><TEXT>This is civilized space here. Tau-23 is some wild country. Ashbound are buzzing around like hornets out there. I watched a Skye-22 Ring crane get demolished by the Ashbound last time I was up there. They lost a lot of people on that project. That’s for the thrill-seeking DSE types. Not me.</TEXT><PARA/><POP/></RDL>'''
1178 = '''<RDL><PUSH/><TEXT>Few people understand what Interspace Commerce really does. We are primarily in the insurance business — specifically, hazard insurance for ships and cargos that use Ageira-manufactured Jump Gates and Trade Lanes in the Nacre Reach.</TEXT><PARA/><POP/></RDL>'''
1179 = '''<RDL><PUSH/><TEXT>We have information that the Rift Captains and Hessians are engaged in some sort of territorial dispute in the outer Omega systems. This has distracted them somewhat from fully exploiting the vulnerable position of the Trade Lanes through Omega-3 and Omega-7. Apparently, there are no Jump Holes directly linking those systems.</TEXT><PARA/><POP/></RDL>'''
1180 = '''<RDL><PUSH/><TEXT>We developed USI technology in tandem with Ageira. It allows us to track shipments anywhere on the Trade Lane grid using powerful ship-sized scanners. There is no easy way for shippers to cheat us by overstating the value of their cargos in case of loss, or attempting to ship high-value cargos without our knowledge. This allows us to set our rates at a premium and minimize fraud.</TEXT><PARA/><POP/></RDL>'''
1181 = '''<RDL><PUSH/><TEXT>The newly constructed Tau-23 to Tau-31 Jump Gate pair is currently the highest risk IC investment in the Nacre Reach. BMM’s exploitation of mineral resources in the system has presented a serious threat to the Ashbound’ sense of territory, and the Ashbound appear to be fighting back with a vengeance.</TEXT><PARA/><POP/></RDL>'''
1182 = '''<RDL><PUSH/><TEXT>The Lane Hackers’ theft of our proprietary technology has been most unfortunate. Ageira is in the process of patching the software and modifying the hardware scanners to make it Lane Hacker proof, at which point we feel that full confidence in IC and Ageira will be restored.</TEXT><PARA/><POP/></RDL>'''
1183 = '''<RDL><PUSH/><TEXT>Vespera has been quite agreeable to the terms of IC, unlike Orsena and Dornmark, who defaulted on our perfectly legal Trade Lane financing terms in 521. Because Helion was not ready to back us up, we lost significant leverage and were forced to transform our company from finance to insurance.</TEXT><PARA/><POP/></RDL>'''
1184 = '''<RDL><PUSH/><TEXT>We work in tandem with the Bounty Hunters. They perform the unpleasant job of criminal disposal, much like the Deep Space simpletons handle the manual labor of building and maintaining the Trade Lanes and Jump Gates for Ageira, and ultimately, us.</TEXT><PARA/><POP/></RDL>'''
1185 = '''<RDL><PUSH/><TEXT>There is currently one hotspot in this sector. The Trade Lane stretch through the Keswick Cloud in the Cambridge system has been the site of several successful attacks during the past few weeks. Several repeat Corsair offenders have been identified and marked for deletion.</TEXT><PARA/><POP/></RDL>'''
1186 = '''<RDL><PUSH/><TEXT>In southern Leeds between the smog clouds, a certain pair of Ashbound has grown accustomed to preying on that Trade Lane, resulting in several large claims. We have Bounty Hunters in the area, but additional guns are always welcome.</TEXT><PARA/><POP/></RDL>'''
1187 = '''<RDL><PUSH/><TEXT>I’m just making the hop up from London with supplies like Oxygen, Water, H-Fuel, and Food. I’ll probably head back down to pick up my Gold shipment for Whiteharbor after a few days of rest.</TEXT><PARA/><POP/></RDL>'''
1188 = '''<RDL><PUSH/><TEXT>Universal hauls Trade Lanes Parts wherever there are Trade Lanes between Helion and the minor House capitals. Then Deep Space takes over and ships them to the actual construction or repair sites.</TEXT><PARA/><POP/></RDL>'''
1189 = '''<RDL><PUSH/><TEXT>I’m glad we don’t have to go any farther than here. Deep Space is having a lot of problems out in Tau-31 and Tau-23 with this BMM project. Ashbound — that says it all.</TEXT><PARA/><POP/></RDL>'''
1190 = '''<RDL><PUSH/><TEXT>They’ve got me here chasing Gaians up in the Devon field. It’s not very complicated work. Those Gaians are a little green — pardon my pun — when it comes to tactics and combat. They got lots of spunk, though.</TEXT><PARA/><POP/></RDL>'''
1191 = '''<RDL><PUSH/><TEXT>The Gaians don’t know what to make of those real criminals, the Rift Captains. I think all those Cambridge University grads are scared to death of the Border World bad guys. That’s not what they signed up for.</TEXT><PARA/><POP/></RDL>'''
1192 = '''<RDL><PUSH/><TEXT>We’re heading out to the Somerset to hunt some Rift Captains. It’s real bad down there. Ya don’t want to go in alone or your kin will be gettin’ a little notice from the Guild offering their condolences.</TEXT><PARA/><POP/></RDL>'''
1193 = '''<RDL><PUSH/><TEXT>Planetform seems to have loads of money to pay us for hunting down those Gaians. They must get it from the government. It’s no problem with me. I’ll just keep poppin’ them as long as they want.</TEXT><PARA/><POP/></RDL>'''
1194 = '''<RDL><PUSH/><TEXT>I just got back from Edinburgh. It’s pretty messy up there. The Gaians have more cover and seem to be more organized than everyone else here. I don’t get why they think that stupid planet is so important. I say us Vesperans should be able to assert our rights and live where we want.</TEXT><PARA/><POP/></RDL>'''
1195 = '''<RDL><PUSH/><TEXT>No Jump Holes in the Devon field — makes it a little bit quiet. The Somerset is another story. It’s swarming with Rift Captains, that is. They run the Artifacts across to Trafalgar from the Cambridge Hole, and then they start hittin’ the ships that wander into their range.</TEXT><PARA/><POP/></RDL>'''
1196 = '''<RDL><PUSH/><TEXT>This is a new post for the Police Authority. The sudden rise in the Corsair population in eastern London forced headquarters to substantially increase patrols on these Lanes.</TEXT><PARA/><POP/></RDL>'''
1197 = '''<RDL><PUSH/><TEXT>Duty in Larkspur used to be quite enjoyable, actually. The military handled the Molly areas. All we had to deal with were the Gaians, who many of us feel should not really be classified as simple criminals since they do not engage in common piracy. But Larkspur and Planetform have kept the pressure up, so we must oblige.</TEXT><PARA/><POP/></RDL>'''
1198 = '''<RDL><PUSH/><TEXT>I find the Bounty Hunters a distasteful and crude lot. They do perform essential and unpleasant tasks for the authority, though. At least we don’t have to go into the Somerset.</TEXT><PARA/><POP/></RDL>'''
1199 = '''<RDL><PUSH/><TEXT>We run patrols on all four Trade Lanes that originate here. The Manchester Jump Gate and Cambridge Trade Lanes are the bad ones. Sometimes an entire squadron is lost. Rift Captains move about freely, unafraid of our ships. The military is occupied on the far side of the system, with the Mollys.</TEXT><PARA/><POP/></RDL>'''
1200 = '''<RDL><PUSH/><TEXT>I was just trying to make it to retirement on Larkspur making customs inspections. They issued a directive for all able bodied pilots to be on active combat duty until the Corsair threat is eliminated, so here I am, just trying to survive.</TEXT><PARA/><POP/></RDL>'''
1201 = '''<RDL><PUSH/><TEXT>The Rift Captains are fairly indiscriminate in their targets. They seem to hate everybody, and relish confrontation. They will never allow themselves to be captured. I’ve seen more than a few attempts to ram you even with their ship afire and weapons knocked out. I guess it’s more honorable for them to die than surrender.</TEXT><PARA/><POP/></RDL>'''
1202 = '''<RDL><PUSH/><TEXT>We bring in our basic supplies like Food, Oxygen, and Water from Larkspur. The Gaians will even attack the lowly supply ships, if given the chance.</TEXT><PARA/><POP/></RDL>'''
1203 = '''<RDL><PUSH/><TEXT>Planetform’s official view of the Gaians is that they are a terrorist organization engaged in open piracy. We do not understand why the Vesperan public sympathizes with this group of ruffians.</TEXT><PARA/><POP/></RDL>'''
1204 = '''<RDL><PUSH/><TEXT>Privately, I doubt that terraforming will ever produce the results expounded by our company, at least in the time frame promised. The use of Alien Organisms has shown promise, but tests show that they will accelerate the process twofold at most, which puts us several hundred years behind schedule.</TEXT><PARA/><POP/></RDL>'''
1205 = '''<RDL><PUSH/><TEXT>My ship is being loaded with Silver for the outbound trip to Harris in Tau-31. They use it for cloud-seeding operations. Harris is still pretty much a desert. It’s a Phase III operation, which means that we’re trying to boost surface water amounts in final preparation for settlement.</TEXT><PARA/><POP/></RDL>'''
1206 = '''<RDL><PUSH/><TEXT>Planetform was chartered in 450 AS at the request of the Vesperan government. Several Cambridge researchers teamed up with a group of experienced California atmospheric modification experts from Los Angeles. They outlined methods to transform arid, lifeless planets with minimal atmospheres into new locations for human settlement within 400 years.</TEXT><PARA/><POP/></RDL>'''
1207 = '''<RDL><PUSH/><TEXT>There are rumblings that terraforming was never a viable technology. The founders of this company became very rich without ever having actually completed one project. The government did not want to admit to the Vesperan people that it had let Leeds become poisoned to the point of ecological collapse, so they sank trillions into terraforming as the solution to all of Vespera’s problems.</TEXT><PARA/><POP/></RDL>'''
1208 = '''<RDL><PUSH/><TEXT>We’ve got operations in California, Tau-31, and Edinburgh. Edinburgh is the problem child. We’ve just begun Phase I, and already the Gaians are making our operation a difficult and costly endeavor. I guess we need more money from the government.</TEXT><PARA/><POP/></RDL>'''
1209 = '''<RDL><PUSH/><TEXT>We discovered the power of the Alien Organisms by accident. In 740, A Orsena ship hauling them across Tau-31 was attacked by pirates and ventured far off course. A hull breach killed the crew, and the ship drifted into the gravitational field of Harris. The Alien Organisms not only survived the impact, they flourished in the frigid, oxygen-deficient environment of the planet’s surface.</TEXT><PARA/><POP/></RDL>'''
1210 = '''<RDL><PUSH/><TEXT>One report from the government asserts that if we do not find new arable land for Leeds’ population soon, there could be famine, or at the very least, disastrous economic and social repercussions for Vespera within a few years.</TEXT><PARA/><POP/></RDL>'''
1211 = '''<RDL><PUSH/><TEXT>Thames is company headquarters for all of our operations across Sirius. Supply runs from Larkspur bring in Food, Oxygen, Water, and H-Fuel. We then transfer them for special shipment to the Graves Survey &amp; Mining base in Dublin.</TEXT><PARA/><POP/></RDL>'''
1212 = '''<RDL><PUSH/><TEXT>The Mollys have been a challenge for BMM ever since the revolt on the Graves Station in 752, in which they mercilessly executed the chief of base operations, Sir Edmund Graves, and several of his senior lieutenants. They fantasized of Dublin being their own country. We asked for assistance from the Vespera Armed Forces at the time and have been engaged in a war of attrition ever since.</TEXT><PARA/><POP/></RDL>'''
1213 = '''<RDL><PUSH/><TEXT>The Tau-23 foray was a mistake. We have expended most of our company’s financial reserves, all to satisfy the egos of senior management. Those guys refused to recognize the true costs of opening up new systems in outer Border Worlds where the criminal element has the upper hand. We could’ve just bought our Niobium from the IMG, and been done with it.</TEXT><PARA/><POP/></RDL>'''
1214 = '''<RDL><PUSH/><TEXT>We use the outpost as a distribution point for Leeds-produced Mining Machinery, which is then shipped out to our bases in Omega-3, Manchester, and Dublin.</TEXT><PARA/><POP/></RDL>'''
1215 = '''<RDL><PUSH/><TEXT>The Gaians have recently begun raiding the Stokes and Birmingham plants, apparently because they believe we are guilty of producing gases subsequently used in terraforming operations. In my opinion, this guilt by association is not constructive and further alienates their cause from the common man in Vespera.</TEXT><PARA/><POP/></RDL>'''
1216 = '''<RDL><PUSH/><TEXT>IMG is a motley collection of unemployed Larkspur miners, former BMM malcontents, and hordes of Daumann and Kruger Dornmarkers. They have no business operating as a legal entity within the boundaries of Vespera. There is little we can do in the Border Worlds, unfortunately.</TEXT><PARA/><POP/></RDL>'''
1217 = '''<RDL><PUSH/><TEXT>BMM has operations throughout Vespera and the adjoining Border Worlds. We run the Stokes Smelter and LD-14 MOX processing plants in Leeds, the Birmingham Polymer production plant in Manchester, and mineral extraction facilities in Dublin, Omega-3, and Tau-23.</TEXT><PARA/><POP/></RDL>'''
1218 = '''<RDL><PUSH/><TEXT>The LD-14 has begun reprocessing Toxic Waste in an effort by BMM to show the Vesperan people that we are committed to operating in a more environmentally sensitive fashion in the Leeds system than in the past.</TEXT><PARA/><POP/></RDL>'''
1219 = '''<RDL><PUSH/><TEXT>BMM and Bowex have had a long and profitable relationship stretching back over 500 years. You should never listen to what Gateway, IMG, or ALG tell you. They are young, poorly run organizations that will not be there for you in the long haul.</TEXT><PARA/><POP/></RDL>'''
1220 = '''<RDL><PUSH/><TEXT>We were asked to provide supplementary security for this group of bases following the sharp increase in Corsair activity around here. We’ve had direct attacks from the Somerset Field twice in recent weeks. It got pretty bloody.</TEXT><PARA/><POP/></RDL>'''
1221 = '''<RDL><PUSH/><TEXT>They just transferred me from Cambridge for my expert knowledge of Rift Captains, as they put it. The only advice I can offer is run for your life. Leeds is starting to look more and more attractive.</TEXT><PARA/><POP/></RDL>'''
1222 = '''<RDL><PUSH/><TEXT>I alternately patrol the two eastern Trade Lanes that originate here, but I dread the Cambridge Jump Gate run the most. I start getting the shakes a good hour before heading out on those days. I signed up for the police, not the military.</TEXT><PARA/><POP/></RDL>'''
1223 = '''<RDL><PUSH/><TEXT>The Gaians aren’t really active south of the Devon Field. They’re more of a northern Vesperan problem. I’ve never seen them in Cambridge, which is kind of ironic since that’s where most of them originally came from.</TEXT><PARA/><POP/></RDL>'''
1224 = '''<RDL><PUSH/><TEXT>The Gaians are always putting out probing attacks on this area to check for a lull in our patrols. We can’t give them the chance.</TEXT><PARA/><POP/></RDL>'''
1225 = '''<RDL><PUSH/><TEXT>I almost caught me a Corsair smuggler crossing the Manchester Trade Lane the other day. Saw him scurry across in front of us. We pursued him, but lost him in the fields. The Rift Captains mostly ship Artifacts, which wouldn’t be a business model if those idiot aristocrats back in London would stop buying them.</TEXT><PARA/><POP/></RDL>'''
1226 = '''<RDL><PUSH/><TEXT>This is Gateway’s home base and hub for our shipping operations throughout the Nacre Reach. Bowex made sure that we couldn’t use London itself as our base. We’ve adapted okay. It’s actually a little more centrally located.</TEXT><PARA/><POP/></RDL>'''
1227 = '''<RDL><PUSH/><TEXT>Gateway and the IMG are partners. We haul their minerals and supplies to distant markets. ALG has recently joined our little group, enabling us to expand into Dornmark and take on the Daumann-Republican monopoly, which is eerily similar to our own BMM-Bowex road block.</TEXT><PARA/><POP/></RDL>'''
1228 = '''<RDL><PUSH/><TEXT>Just turning my ship around right now. Got in from Narita in the Sablecross system yesterday with a load of H-Fuel. I’ll head back there tomorrow with a load of Beryllium from the Cardiff mine in Cambridge.</TEXT><PARA/><POP/></RDL>'''
1229 = '''<RDL><PUSH/><TEXT>One of the key aims of our partnership with IMG is to get along with as many of the criminal factions as we can, thereby lowering our operating costs in the Border Worlds, which will comprise the bulk of future mineral discoveries in the sector. BMM and Bowex take a much harder line, which hurts them with factions like the Mollys and Cinder Guard.</TEXT><PARA/><POP/></RDL>'''
1230 = '''<RDL><PUSH/><TEXT>I’m running supplies up to the Holman Outpost. They get Consumer Goods, Pharmaceuticals, and Food. I usually pick up a couple of containers of Niobium mined from Tau-23 on the return trip. Ashbound are the main threat for us up in Tau-31.</TEXT><PARA/><POP/></RDL>'''
1231 = '''<RDL><PUSH/><TEXT>We’d like to get more involved in the Luxury Goods and Food trade, but Bowex has a lock on that. Its exclusive military and police supply contracts are the worst because they make the Vesperan government pay through the nose. That’s what you get with centuries of no competition.</TEXT><PARA/><POP/></RDL>'''
1232 = '''<RDL><PUSH/><TEXT>We went to Leeds to pick up Mining Machinery last week. What a pit. That’s what happens when you let a company like BMM go unchecked for centuries — pure greed, with no thought of the consequences. We’ll be heading on to Cardiff and eventually Freeport 1 from here.</TEXT><PARA/><POP/></RDL>'''
1233 = '''<RDL><PUSH/><TEXT>Silver is brought in from the IMG Freeport in Omega-7. Then we ship it out to Larkspur and the terraforming folks.</TEXT><PARA/><POP/></RDL>'''
1234 = '''<RDL><PUSH/><TEXT>Our two big cargos for long-range runs to Helion are Beryllium and Gold. That Gold attracts a lot of attention, especially in the Independent Worlds, although the Rift Captains have begun to hit us just outside the base here.</TEXT><PARA/><POP/></RDL>'''
1235 = '''<RDL><PUSH/><TEXT>We’re just stopping by to pick up basic supplies for the </TEXT><TRA italic="true"/><TEXT>Hood</TEXT><TRA italic="false"/><TEXT>  in Dublin. We usually get Food, Water, Oxygen, Pharmaceuticals, and such. There are lots of miners to support out there. Everyone scrambles for supply duty — a chance to get back to the world, if ya know what I mean.</TEXT><PARA/><POP/></RDL>'''
1236 = '''<RDL><PUSH/><TEXT>The Gold run from the Hood used to be a cake walk back when the Mollys weren’t really our enemies. That all changed when the Rift Captains came to town. Rift Captains have been hurting our operation pretty badly. We lost two Gold shipments in a row last month.</TEXT><PARA/><POP/></RDL>'''
1237 = '''<RDL><PUSH/><TEXT>I’m based in Cambridge most of the time, where Beryllium at Cardiff is mined. It’s the first operation opened by the IMG. We usually pick up our Mining Machinery here for the return.</TEXT><PARA/><POP/></RDL>'''
1238 = '''<RDL><PUSH/><TEXT>We get our basic supplies and Silver from Kensington. Our base is just across the way. Pretty quiet over there — feels more like a real HQ than this. I like to hear the pilots’ stories here at the bar.</TEXT><PARA/><POP/></RDL>'''
1239 = '''<RDL><PUSH/><TEXT>Seems like these Gateway people have a much easier time with the criminal element than we do, except, of course, the Rift Captains and Ashbound. Nobody gets close with them, at least not on the legitimate side of the coin.</TEXT><PARA/><POP/></RDL>'''
1240 = '''<RDL><PUSH/><TEXT>Those Gaians had the gall to attack this base the other day. I guess they were going for storage depots. Too many police and Bounty Hunters around. They chased them off pretty quick.</TEXT><PARA/><POP/></RDL>'''
1241 = '''<RDL><PUSH/><TEXT>This is the last stop for us on our Artifact run from our homeland. Maybe one day you could run Artifacts for the Rift Captains. It’s dangerous but pays very well. If those aren’t two things that interest you then I’m wasting my time talking to you. Just make sure to stay clear of those Cinder Guard.</TEXT><PARA/><POP/></RDL>'''
1242 = '''<RDL><PUSH/><TEXT>There are Ashbound on this base. Once they were our brothers, but that was long, long ago. Now they are just like everyone else — targets. It’s not that we don’t like them, but that won’t stop us from taking one of their shipments or putting them in the airlock. Somehow I doubt those masks they wear would save them from that.</TEXT><PARA/><POP/></RDL>'''
1243 = '''<RDL><PUSH/><TEXT>You could run reinforcement supplies to our base in Cadiz if you want to gain favor with the Rift Captains. We need H-Fuel and Engine Components there to continue fighting the Cinder Guard in Omega-5.</TEXT><PARA/><POP/></RDL>'''
1244 = '''<RDL><PUSH/><TEXT>Vespera offers many tempting targets. We soon realized that we didn’t need to buy the Gold from the Junkers; we could go steal it ourselves from the Mollys and IMG. Once we dispose of the local criminals, Vespera will be ours.</TEXT><PARA/><POP/></RDL>'''
1245 = '''<RDL><PUSH/><TEXT>Once we drop our Artifacts here, the fun begins. We raid the Trade Lanes here in Vespera to supply our bases back home along the Edge Worlds. Before we discovered that we could make such a nice profit from selling the Artifacts, we lived solely by raiding. The easiest targets are here in Vespera; police presence is a joke in this space.</TEXT><PARA/><POP/></RDL>'''
1246 = '''<RDL><PUSH/><TEXT>Now that there has been a ban declared on Artifacts, it has been more difficult to sell as many as before, but we have compensated by raising the prices. Everyone always wants what they can’t have, and now the rich fools who crave these toys will pay almost any amount for them.</TEXT><PARA/><POP/></RDL>'''
1247 = '''<RDL><PUSH/><TEXT>The conditions on this base are absolutely appalling. It goes against a Gaian’s very nature to be surrounded by the cretinous scavengers who populate these dingy corridors. Yet we are compelled to purchase those things we need to maintain our existence at our own base in the Islay Cloud of Edinburgh: Pharmaceuticals, H-Fuel, Food, Consumer Goods, and such.</TEXT><PARA/><POP/></RDL>'''
1248 = '''<RDL><PUSH/><TEXT>The Mollys’ hatred for BMM is an advantage to our own attacks upon that corporation, and though we don’t share the same motivations that the Mollys’ do, our disgust with the despoilers of BMM is just as intense. Unlike many underground operations, we are not motivated by the acquisition of money. We are a political organization dedicated to improving the quality of life for all who live in Vespera, even our enemies, though they are too blind to see it.</TEXT><PARA/><POP/></RDL>'''
1249 = '''<RDL><PUSH/><TEXT>If it wasn’t for the Green Front, I doubt the Gaians would be able to operate at all. We have the support of the intellectuals in Vespera and the educated elite of Cambridge but without the financial assistance that Green Front brings in… Well, let’s just say that good causes don’t fund themselves.</TEXT><PARA/><POP/></RDL>'''
1250 = '''<RDL><PUSH/><TEXT>The Gaians wouldn’t have any place to get their supplies if it weren’t for this base, but you should see how they gulp and sniff whenever they set foot in here. I hate dealing with them, but they bring us money in return for the supplies they need for their base in Edinburgh.</TEXT><PARA/><POP/></RDL>'''
1251 = '''<RDL><PUSH/><TEXT>The Artifacts that come into Vespera pass through here. They are brought to us by the Rift Captains from their bases in the southern Edge Worlds. We do run into Larkspur, which can get pretty risky with the police and military hovering about. If you get scanned, it’s over.</TEXT><PARA/><POP/></RDL>'''
1252 = '''<RDL><PUSH/><TEXT>If you need cash, you can ship supplies to the Molly base Arranmore in Dublin. They need Oxygen, Water, H-Fuel, Pharmaceuticals, Consumer Goods, Food, Side Arms, and Engine Components.</TEXT><PARA/><POP/></RDL>'''
1253 = '''<RDL><PUSH/><TEXT>We sell the Mollys’ Gold, Rift Captains’ Artifacts, and Ashbound’ Cardamine in Larkspur. You can make very good money doing it, but don’t get caught. We’ll say we’ve never seen you before.</TEXT><PARA/><POP/></RDL>'''
1254 = '''<RDL><PUSH/><TEXT>The Rift Captains require Gold and Engine Components for their Tripoli Shipyard in Omicron Gamma. If you’re friendly enough with them, you could make some very good money.</TEXT><PARA/><POP/></RDL>'''
1255 = '''<RDL><PUSH/><TEXT>The Gaian base is known as Islay; they call it “the Sleet.” Everyone knows that it’s in the Islay Ice Cloud, but they don’t know where — it’s too well camouflaged. It’s situated very close to a hidden Jump Hole to Leeds, which is really handy for hit-and-run attacks against BMM and the Trade Lanes, or for hitting the ice mining by Planetform’s Perth base at Ayr.</TEXT><PARA/><POP/></RDL>'''
1256 = '''<RDL><PUSH/><TEXT>The war-torn Corsair base Cadiz in Omega-5 is in need of H-Fuel and Engine Components. Be careful getting there. The Cinder Guard don’t like independent pilots helping their enemy.</TEXT><PARA/><POP/></RDL>'''
1257 = '''<RDL><PUSH/><TEXT>Sometimes people wonder where the Junkers come from. It’s true you can find us throughout Sirius except Orsena space, but no one knows where we started. The truth is that the Junkers are comprised of all kinds. We are the ones who weren’t happy working for one group or another. Our blood is from all the people of Sirius, even the Orsena. Truth is, once yer a Junker you aren’t nothing else but a Junker, and whatever you were before falls away.</TEXT><PARA/><POP/></RDL>'''
1258 = '''<RDL><PUSH/><TEXT>We buy Engine Components, Basic Alloys, Side Arms, and other criminal necessities in Larkspur. The authorities can’t lift a finger, even though they know where we’re headed.</TEXT><PARA/><POP/></RDL>'''
1259 = '''<RDL><PUSH/><TEXT>Criminals deal with us because we can go where they can’t. They could run the gauntlet into Helion from here, but they wouldn’t be able to dock anywhere. We Junkers have a cover. Most authorities don’t know if we’re hauling scrap or contraband, and that’s how we get through. We can get our ships onto almost any planet, so criminals have to deal with us.</TEXT><PARA/><POP/></RDL>'''
1260 = '''<RDL><PUSH/><TEXT>Us Junkers, we’re a different breed from the rest of our “clientele.” We just want to get along with everyone. You know why? Cuz that’s the way to make money. We don’t care about politics or which group killed this other group. To Junkers it’s all about how many credits we can get our hands on, so we get all kinds on our bases and that’s how we like it.</TEXT><PARA/><POP/></RDL>'''
1261 = '''<RDL><PUSH/><TEXT>The Junkers like to deal with us because we bring them something everybody wants: Gold. We used to mine it for BMM; now we steal theirs or mine it from our own fields. We aren’t thieves, though. We paid for that Gold in blood and the broken hands of our fathers before us.</TEXT><PARA/><POP/></RDL>'''
1262 = '''<RDL><PUSH/><TEXT>We like to get our supplies for Arranmore — that’s our base in Dublin — here in Larkspur. The IMG charges a bit too much on the </TEXT><TRA italic="true"/><TEXT>Hood</TEXT><TRA italic="false"/><TEXT>, and they won’t sell us our Side Arms.</TEXT><PARA/><POP/></RDL>'''
1263 = '''<RDL><PUSH/><TEXT>One of our lads, Roger Patience, got captured last week by the military in Leeds during a MOX raid. He’s one of our best. He was on a prison convoy headed for Newgate Prison. We cracked him out in Manchester yesterday as it broke from the Trade Lanes. If you see him, he might buy you a drink to celebrate his new-found freedom.</TEXT><PARA/><POP/></RDL>'''
1264 = '''<RDL><PUSH/><TEXT>So you’re interested in working for us? Try running a load of Cardamine to Magellan or Cortez for us. The Lane Hackers would appreciate that.</TEXT><PARA/><POP/></RDL>'''
1265 = '''<RDL><PUSH/><TEXT>We buy Side Arms for the Cali base in Tau-23 here. It’s not an easy Jump Hole route between Trafalgar and our base out there. Fortunately, the Barrier offers plenty of cover.</TEXT><PARA/><POP/></RDL>'''
1266 = '''<RDL><PUSH/><TEXT>Cardamine was the one good thing that fate gave us. When we first landed on Malta the weak who didn’t want to live anymore could go to a better place chewing the orange grass. It was also a curse, as we became dependent on Cardamine to survive, though we don’t get a high from it anymore. Now we use Cardamine to make money. Eventually we’ll run Sirius. Once a large enough portion of the populace is hooked, we’ve got them.</TEXT><PARA/><POP/></RDL>'''
1267 = '''<RDL><PUSH/><TEXT>Orbital Spa and Cruise has made itself an annoyance to the Ashbound. Its </TEXT><TRA italic="true"/><TEXT>Shetland</TEXT><TRA italic="false"/><TEXT>  cruise ship in Edinburgh lies right in the path of our Cardamine route to this base. The truth is, if they keep pushing into Outcast space, some tourists are going to be killed.</TEXT><PARA/><POP/></RDL>'''
1268 = '''<RDL><PUSH/><TEXT>From here we ship to Helion via the Rogue base Montezuma in Cortez. They can’t get enough of our Cardamine, so as long as we keep it flowing they are under our control. They make good attack dogs. Soon more of the criminal factions will become addicted, and we’ll rule Sirius — then our revenge will be complete.</TEXT><PARA/><POP/></RDL>'''
1269 = '''<RDL><PUSH/><TEXT>BMM is no match for our military in Tau-23. We will force them out of the system and destroy the Jump Gate. Our survival as a sovereign nation is at stake. Cali is a crucial distribution point for Cardamine on the trip to Vespera and Helion.</TEXT><PARA/><POP/></RDL>'''
1270 = '''<RDL><PUSH/><TEXT>If you don’t mind flying past weapon platforms, military patrols, and Mollys, you might be just the person to take supplies to LD-14. It scares the hell out of me going to that base. There’s enough radiation in there to cook an egg, and I’ll tell you I don’t want my eggs cooked! If you aren’t afraid, you could bring lots of Pharmaceuticals to LD-14, ’cause they run through them pretty fast there.</TEXT><PARA/><POP/></RDL>'''
1271 = '''<RDL><PUSH/><TEXT>BMM makes sure that the Stokes base gets all it needs to keep running smoothly. Everything’s in this system, so that’s nice for me. You don’t look like you care, but I’ve got a lot of family in Stokes — maybe too much family. We send our own Leeds-produced Mining Machinery up to Stokes and usually haul Basic Alloys on the return trip.</TEXT><PARA/><POP/></RDL>'''
1272 = '''<RDL><PUSH/><TEXT>Those damn dirty Ashbound almost blew my ship in half in Manchester. I was making my way to Birmingham from Larkspur. I had just unloaded a shipment of Mining Machinery in Thames and was going to pick up a load of Polymers to bring back here. All of a sudden my ship dropped right out of the Trade Lanes and I was buried in Ashbound. I’m glad my escorts were sharp, or BMM woulda been sending my teeth home to the family.</TEXT><PARA/><POP/></RDL>'''
1273 = '''<RDL><PUSH/><TEXT>Bowex ships basic supplies throughout this system, keeping several Leeds bases equipped. I fly Oxygen, Water, and Food to York, Glasgow, and Durham. It might be a short jaunt, but I lose escorts every week.</TEXT><PARA/><POP/></RDL>'''
1274 = '''<RDL><PUSH/><TEXT>I make the Bowex supply run to the police base Aberdeen in Edinburgh. You’d think they would take better care of their supply shipments, but I usually come into the base limping with a few gunners dead or dying.</TEXT><PARA/><POP/></RDL>'''
1275 = '''<RDL><PUSH/><TEXT>Glasgow sells H-Fuel and buys Consumer Goods. It’s a nice run if you enjoy hauling more expensive Commodities than just the Oxygen and Water, and it keeps you in-system too, if that’s what you are looking for. Oh, I almost forgot, mate… York needs Pharmaceuticals.</TEXT><PARA/><POP/></RDL>'''
1276 = '''<RDL><PUSH/><TEXT>If you’d like to visit the capital, I know how you can get there and back and make decent coin doing it too. Bowex ships Construction Machinery to Larkspur and Southampton regularly. On the return, you can haul Diamonds for the Leeds Mining Machinery plant, which uses gems for all those drills and grinders. Hauling cargo like Diamonds is quite dangerous though, so I hope you like action. Every pirate that runs a scan on you is going to come in firing.</TEXT><PARA/><POP/></RDL>'''
1277 = '''<RDL><PUSH/><TEXT>Ooh, fancy yerself a tough one do ya, laddie? Well, how do you like the sound of the Border Worlds, eh? I though that might get your attention. Bowex supplies Freeport 6 in Tau-29 with Mining Machinery. Yup, there’s money to be made out there if you’ve got the sand for it. My guess is you’ll be dusted before you ever make landing in Freeport 6.</TEXT><PARA/><POP/></RDL>'''
1278 = '''<RDL><PUSH/><TEXT>I hate them Cambridge folks. They are all stuck up cod livers, with their datapads and degrees and their “Oh, I’m a smart one aren’t I?” attitudes. Here in Leeds a datapad is best used for breaking over somebody’s head. Well, if you wanna run to Cambridge doing the same thing Bowex does, then I recommend picking up some Optronics here and returning with Food.</TEXT><PARA/><POP/></RDL>'''
1279 = '''<RDL><PUSH/><TEXT>Manchester is a fine system, it is. We need their Optical Chips too. Sheffield has some of the finest in all of Sirius. Careful though, it’s right on the edge of the Independent Worlds and a lot of bad traffic flows through there. I almost bought it on that run. I think there was one bolt holding my ship together when I set it down.</TEXT><PARA/><POP/></RDL>'''
1280 = '''<RDL><PUSH/><TEXT>You ever want to head into Orsena space? It’s quite a different bag of socks, I’ll be the first to say. But if you want to get out there and see Sirius, like every young buck, then off ya go to Narita. We need their Optronics here at this base.</TEXT><PARA/><POP/></RDL>'''
1281 = '''<RDL><PUSH/><TEXT>I fly a patrol along the Trade Lane leading to the Edinburgh Jump Gate. That’s the route the tourists like to take getting to the </TEXT><TRA italic="true"/><TEXT>Shetland</TEXT><TRA italic="false"/><TEXT>. Gaians, Mollys, and Ashbound hit that Lane pretty frequently, especially through the West Leeds Smog Cloud.</TEXT><PARA/><POP/></RDL>'''
1282 = '''<RDL><PUSH/><TEXT>If you fly your ship through either one of the smog clouds in this system, get it washed before you touch it. The industrial waste you’re flying through is highly acidic and though it might not do a great deal to your ship, it’ll burn through your skin in seconds.</TEXT><PARA/><POP/></RDL>'''
1283 = '''<RDL><PUSH/><TEXT>The Vesperan Police patrol this sector for unlawful activity. The military takes care of the northern part of Leeds mostly around the Trade Lanes leading to Tau-31 and LD-14. It’s more of a military matter protecting the processed MOX nuclear fuel produced at the plant there.</TEXT><PARA/><POP/></RDL>'''
1284 = '''<RDL><PUSH/><TEXT>I always believed in what the Gaians were fighting for; I just didn’t like the way they went about doing things. I didn’t take them as seriously as the others — just rich kids ya know. Well, that all changed a few months ago when they zapped my mate on a routine patrol. We weren’t even in attack formation — just flying by — and they opened up on us. Roger’s ship imploded before I could blink.</TEXT><PARA/><POP/></RDL>'''
1285 = '''<RDL><PUSH/><TEXT>The Vesperan Police aren’t like them Helion coppers you’ll find glossing it up in Cinderwell. No sir, we don’t take bribes and we don’t take it easy. If you break the law in Vespera, you’re going to pay. That I promise you.</TEXT><PARA/><POP/></RDL>'''
1286 = '''<RDL><PUSH/><TEXT>I patrol down the south side near the Larkspur Jump Gate. I know that them damn criminals are making a way into our capital system somehow; I just wish I knew where. I make certain that they don’t slip past me into the Jump Gate.</TEXT><PARA/><POP/></RDL>'''
1287 = '''<RDL><PUSH/><TEXT>My folks and their ancestors all come from Leeds. We’ve been workin’ the foundries in my family as long as I can remember — except me. My father was always moaning about getting the rake from BMM, so I figured I’d get out from under that thumb. I apprenticed myself to an independent pilot and learned to fly. After a bit I took the opportunity to join the authorities.</TEXT><PARA/><POP/></RDL>'''
1288 = '''<RDL><PUSH/><TEXT>I enjoy doing my job and putting away the malcontents, but I wouldn’t do it in Dublin. No lad, them Mollys will blow a hole in you the size o’ the West Smog. I’ll take ’em in smaller doses right here.</TEXT><PARA/><POP/></RDL>'''
1289 = '''<RDL><PUSH/><TEXT>The Ashbound make their appearance in this system quite often. This is part of their route into center Sirius and Vespera with that blasted Cardamine they peddle. They are tough ones I don’t like to tangle with — makes me doubt my pension.</TEXT><PARA/><POP/></RDL>'''
1290 = '''<RDL><PUSH/><TEXT>In Tau-31 there is a base named Holman. That base requires Gateway to ship them Construction and Mining Machinery. If you did a few runs, then I wouldn’t have to fly there so often, and maybe I could take it easy for a while. I hate flying into the Border Worlds.</TEXT><PARA/><POP/></RDL>'''
1291 = '''<RDL><PUSH/><TEXT>Kensington buys some of the Mining Machinery produced in Leeds. It is a nice, easy run once you make it past the smog clouds and are about to hit the Jump Gates. Of course, making it past the smog clouds is the trick, isn’t it? All manner of scoundrel lay in wait for you in there.</TEXT><PARA/><POP/></RDL>'''
1292 = '''<RDL><PUSH/><TEXT>Ever heard the saying “Keep your head down”? Of course you have, but it doesn’t seem like it would matter in a spaceship, does it? I mean either you decompress or you don’t, right? No head ducking is gonna save you if the hull caves in. Well, that’s what I used to think until the last run I made. Old Charles, my tail gunner, got his head taken off by a chunk of metal that blew free of a relay panel on my ship. Charlie always was a bit too tall.</TEXT><PARA/><POP/></RDL>'''
1293 = '''<RDL><PUSH/><TEXT>You know how far I have to fly to deliver this H-Fuel to this base? It is a long way across Sirius at the Ogashawa Refinery in Sigma-19. Here’s the worst part — I have to get through Ashbound to get into Orsena space, and then I deal with the pirates there, including the Hogosha and the Golden Chrysanthemums. Finally I get through all that and have to fly through the Border Worlds on the other side of Orsena space. Guess who attacks me there? That’s right, more Ashbound.</TEXT><PARA/><POP/></RDL>'''
1294 = '''<RDL><PUSH/><TEXT>We ship Optronics to this base from Honshu. It is better than having to ship H-Fuel here, which is a longer flight. Don’t misunderstand. It is a long and dangerous flight from Honshu. Any travel across the Border Worlds is risky.</TEXT><PARA/><POP/></RDL>'''
1295 = '''<RDL><PUSH/><TEXT>When you cross Orsena space you have to be careful of the Hogosha. You are Gaijin and therefore unprotected, and I have to be careful because I work for Kishiro. Yet Samura does not have to be wary of the Hogosha. What does that tell you?</TEXT><PARA/><POP/></RDL>'''
1296 = '''<RDL><PUSH/><TEXT>Care to make a jaunt into Tau-31? Planetform needs Commodities at its base, and though we do our best to ship them everything, they always want more. Ah, I can hear the damn supply master whining in my ear even now, and he’s a Jump Gate away. You’ll find him at Harris. He always needs more Construction and Mining Machinery.</TEXT><PARA/><POP/></RDL>'''
1297 = '''<RDL><PUSH/><TEXT>Construction and Mining Machinery, that’s what Perth in Edinburgh needs as soon as possible. You look like just the one to do it, too. You don’t mind fighting off a few rich snobs who’ve read too many datapads for their own good do you? That’s right, you’d be doing me a personal favor if you could kill a few of those lilies. Gaia might not bleed, but Gaians will.</TEXT><PARA/><POP/></RDL>'''
1298 = '''<RDL><PUSH/><TEXT>Planetform is working on making another planet for Vespera to grow crops in. Cambridge is helping to alleviate the Food shortage in this sector of space, but it is only a temporary fix. If we don’t create more arable land, then Vespera will have major Food shortages within two hundred years. That is a fact, at least according to our data.</TEXT><PARA/><POP/></RDL>'''
1299 = '''<RDL><PUSH/><TEXT>The Mollys here in this system are quite disturbing — so vicious they remind me of the Jade Vow in Orsena space. I have to fly Fuel to this disgusting filth of a system from Osaka. Have you ever touched your ship after flying through a smog cloud? Well, don’t do it. I hate this place, and I hate Vespera.</TEXT><PARA/><POP/></RDL>'''
1300 = '''<RDL><PUSH/><TEXT>The corporations in this part of Sirius have no true power if they let the criminals run rampant like this through their systems. I lost my last escort to Mollys as we were coming into this system. The first two escorts died back in Tau-29 fighting Ashbound.</TEXT><PARA/><POP/></RDL>'''
1301 = '''<RDL><PUSH/><TEXT>I keep hearing about the Gaians and I know they operate in this system, but I have not seen any yet. Maybe they do not operate along the Trade Lanes I use. Thank goodness. It would be too much if I had to fight the Gaians along with the Ashbound and Mollys.</TEXT><PARA/><POP/></RDL>'''
1302 = '''<RDL><PUSH/><TEXT>If you care to visit Southampton, you can make good money there running supplies for BMM. We transport Ship Hull Panels, Super Alloys, and Basic Alloys there. If you decide to do that, you might want to pick up Scrap Metal, which is always in demand at the Stokes Smelter.</TEXT><PARA/><POP/></RDL>'''
1303 = '''<RDL><PUSH/><TEXT>The pollution you see in this system is a byproduct of BMM’s industrial practices, but there wasn’t much choice, as Vespera had to catch up with the other houses in the early years. You will hear the lower classes speak of the ruthlessness with which BMM has run its corporation and its employees, but what they don’t understand is that there was no other way.</TEXT><PARA/><POP/></RDL>'''
1304 = '''<RDL><PUSH/><TEXT>If it weren’t for BMM’s industrial power, Vespera would have been over taken by one of the other Houses, probably Helion. You see, our sleeper ship was the last to arrive in Sirius, so we got the most difficult area to colonize. Very rapid industrialization was Vespera’s only chance of economic survival, for better or worse.</TEXT><PARA/><POP/></RDL>'''
1305 = '''<RDL><PUSH/><TEXT>You want a nice easy run in-system? Usually BMM will ship the Basic Alloys produced here to Leeds. There we purchase supplies for our mining and smelting crews. There’s no reason you couldn’t pick up those Commodities and deliver them.</TEXT><PARA/><POP/></RDL>'''
1306 = '''<RDL><PUSH/><TEXT>Ever tangle with a Molly? Aye, it’s a tough fight. I have to do it quite often when I’m making supply runs to LD-14 from here. I’ll ship Toxic Waste, Hydrocarbons, Boron, and Beryllium.</TEXT><PARA/><POP/></RDL>'''
1307 = '''<RDL><PUSH/><TEXT>I’m only telling you this because you are a trusted friend of BMM. Some of the MOX produced at LD-14 is shipped to this base. You know MOX contains Plutonium, right? Well, that means you can’t let the Mollys get their hands on it. They have threatened to make a bomb and blow it up over Larkspur.</TEXT><PARA/><POP/></RDL>'''
1308 = '''<RDL><PUSH/><TEXT>I’m one of the pilots who travels to Manchester to deliver supplies needed at two bases in that system. I bring Hydrocarbons and Polymers here from Birmingham. It’s not a bad run, all things considered. At least I don’t have to make the MOX or Toxic Waste run.</TEXT><PARA/><POP/></RDL>'''
1309 = '''<RDL><PUSH/><TEXT>You look like a scrapper. Well, so am I. I know I’m just a BMM cargo pilot, but I have dropped as many Ashbound as some Bounty Hunters. Sure I have escorts, and our ships travel in convoys, but it was me at the turrets when those bloody mask breathers went up in flames. I’m one of the chaps who makes the run into the Border Worlds. That’s right, I run Beryllium to this base from Tau-23.</TEXT><PARA/><POP/></RDL>'''
1310 = '''<RDL><PUSH/><TEXT>Leeds is running dry — the system and the planet. The planet only has a hundred maybe a hundred fifty years left of minable goods in her. This place is dying and it will be ugly. I’m saving all I can to get me and me family out of this sulfur pit. I was thinking about working on the “short time,” but my wife still wants more kids from me, so I have to do it slowly. That’s alright with me, I suppose.</TEXT><PARA/><POP/></RDL>'''
1311 = '''<RDL><PUSH/><TEXT>I am one of the Bowex pilots that ships Boron from Los Angeles. A lot of people here think I’m crazy, but I like cruising the Independent Worlds. Sure it’s more dangerous, but I earn more money than most. Being a good pilot is all about confidence. If you have it, you usually live; if you don’t it’s over quickly.</TEXT><PARA/><POP/></RDL>'''
1312 = '''<RDL><PUSH/><TEXT>I know the chap who runs the Basic Alloys and Ship Hull Panels to Freeport 6 in Tau-29. He usually continues the run to Yokohama in Sablecross with the extras he hasn’t delivered there. He’s pretty good, but he’s also pretty new. The last guy didn’t last too long.</TEXT><PARA/><POP/></RDL>'''
1313 = '''<RDL><PUSH/><TEXT>Bowex ships Basic Alloys down to Cambridge and Larkspur. On the return flight we usually pick up Boron from Sheffield. It is a decent run that could make you some money if you had the inclination to burn some fuel through Vespera.</TEXT><PARA/><POP/></RDL>'''
1314 = '''<RDL><PUSH/><TEXT>We cross the entire bleeding Vesperan colony to deliver Copper here from Freistadt in Omega-7. Talk about a dangerous run! First we fight Rift Captains in the southern Sirius systems, and then we have to deal with Ashbound once we get to Leeds.</TEXT><PARA/><POP/></RDL>'''
1315 = '''<RDL><PUSH/><TEXT>If I didn’t know better, I’d swear Bowex controls the Armed Forces. Here we are getting attacked from all sides by the Rift Captains. There are flames pouring out of my ship, and the Armed Forces patrol flies right by to help a Bowex transport sending a distress call from thirty minutes away! When will the time come that we start getting a fair shake around here? Gateway Shipping has had to struggle from the very start because of all the history Bowex has with London.</TEXT><PARA/><POP/></RDL>'''
1316 = '''<RDL><PUSH/><TEXT>You think the Ashbound are bad? You should try going up against a Corsair. They are the meanest lads I’ve ever encountered. They make the Mollys look like schoolyard bullies. Once we left Freistadt with a convoy of eleven. By the time the Rift Captains were finished with us, there were only five ships that limped into Cambridge a week later.</TEXT><PARA/><POP/></RDL>'''
1317 = '''<RDL><PUSH/><TEXT>Molly attacks make this run one of the most dangerous that a Kishiro man can do. We take the Basic Alloys produced here all the way to Sablecross. It is a long journey, or maybe it seems longer because I am constantly worried that I am about to die. I have a wife and many children. I am only trying to feed them, but try to tell that to an Outcast or a Molly. You ever pick up their messages? They enjoy killing.</TEXT><PARA/><POP/></RDL>'''
1318 = '''<RDL><PUSH/><TEXT>Kishiro is slowly beginning to take command of Orsena corporate power. Samura made a terrible mistake by angering the GMG. Perhaps now Kishiro will be the one that supplies Sirius with the fuel that drives all of its engines. This keiretsu is better because we are more innovative than Samura, which has grown lazy.</TEXT><PARA/><POP/></RDL>'''
1319 = '''<RDL><PUSH/><TEXT>Poor Wang, one of my gunners. I don’t think he is going to survive. I barely lived myself, but the Ashbound will chase you as far as they can. Luckily we were able to make it to the Jump Gate. Once we entered the system, Mollys almost finished us off. All three of my escorts were dead, but a Vesperan Navy patrol was coming by at the time of our entry. If they hadn’t chased off the Mollys, Wang would be dead for sure. I hope he lives, because he is supposed to marry my sister. If he dies, no one will marry her.</TEXT><PARA/><POP/></RDL>'''
1320 = '''<RDL><PUSH/><TEXT>This station produces Terraforming Gases, which, as you might guess, are vital to our operations on Harris. Harris is located in the Border Worlds and is therefore a dangerous shipment to make. We only do it for the good of Vespera — and money of course. Let’s not forget that part.</TEXT><PARA/><POP/></RDL>'''
1321 = '''<RDL><PUSH/><TEXT>Ah, dear sweet Perth, nestled in the heart of Gaian space. That’s right, Perth is in Edinburgh, so I must fly into that dreaded chunk of space to deliver Terraforming Gases to our engineers there. One day an inhabitable Perth will be growing crops for the people of Vespera.</TEXT><PARA/><POP/></RDL>'''
1322 = '''<RDL><PUSH/><TEXT>The Bounty Hunters in this system have been paid a lot of money to kill Gaians, and I love it. Bounty Hunters are not kind, and it makes me feel safe to know that my corporation has hired them to exterminate the Gaian threat. We are a noble company at heart, but sometimes you must deal with the repugnant to destroy the repulsive.</TEXT><PARA/><POP/></RDL>'''
1323 = '''<RDL><PUSH/><TEXT>The pride of Dornmark is The Ring, home of Daumann. Stokes provides us with Niobium for our Engine Component manufacturing center there. It’s quite a journey back to Berlin — dangerous as hell, but we Dornmarkers are the best in Sirius. If the Cinder Guard don’t try to kill you, the Rift Captains certainly will.</TEXT><PARA/><POP/></RDL>'''
1324 = '''<RDL><PUSH/><TEXT>We were plagued by Hessians and Rift Captains across the Omega worlds, and then by Ashbound as we entered this accursed pit. My co-pilot was killed near the smog clouds. It’s a sad fact of life, but a Republican shipper’s first Border World flight is often his last.</TEXT><PARA/><POP/></RDL>'''
1325 = '''<RDL><PUSH/><TEXT>I wonder how long the poor souls who work at the smelters and do the hard labor will live in such conditions. This is the foulest place I have ever visited. I don’t think these men will live to see fifty — not one of them. Working for Samura is much better. They take care of their employees for life.</TEXT><PARA/><POP/></RDL>'''
1326 = '''<RDL><PUSH/><TEXT>The Basic Alloys crafted here are shipped by Samura Industries to our Yokohama Shipyard in Sablecross. It is a dangerous trip, and I’m thinking of retiring soon. The Border Worlds kill many fine Samura employees, but we must do what we are ordered for the good of the company.</TEXT><PARA/><POP/></RDL>'''
1327 = '''<RDL><PUSH/><TEXT>The men who work for Kishiro have an easier journey than we do. They don’t need to fear the Jade Vow as much as we do. Those vicious pirates have a blind hatred for our noble company that stretches back hundreds of years.</TEXT><PARA/><POP/></RDL>'''
1328 = '''<RDL><PUSH/><TEXT>Ashbound and Mollys give us the most trouble in these parts of space; the Gaians don’t really operate up here — not that they would be much of a threat compared to the blokes we already fight every day.</TEXT><PARA/><POP/></RDL>'''
1329 = '''<RDL><PUSH/><TEXT>We patrol the northern sector of Leeds. Mostly we run search and destroy missions around LD-14. It is vital to the security of Vespera that we protect the shipments of Uranium coming into the base from the LD-14 field and the MOX that is shipped out.</TEXT><PARA/><POP/></RDL>'''
1330 = '''<RDL><PUSH/><TEXT>We encounter a good deal of Bounty Hunters hired by BMM to kill the criminals we can’t lay a beam to, but they are as shady as the criminals at times, plus I think they enjoy their job too much. I kill because I have to; these sadists kill because they enjoy it.</TEXT><PARA/><POP/></RDL>'''
1331 = '''<RDL><PUSH/><TEXT>The new Trade Lane construction project in Tau-31 has come under a lot of fire by the Ashbound in recent weeks. The York will be sending out two daily patrols starting tomorrow to keep BMM and Deep Space Engineering happy.</TEXT><PARA/><POP/></RDL>'''
1332 = '''<RDL><PUSH/><TEXT>The Gaians have been attacking the Harris terraforming project in Tau-31 for some time now. Planetform claims they have caused many delays in the project. I’m not so sure about that. Last patrol I did, we saw more Ashbound than Gaians.</TEXT><PARA/><POP/></RDL>'''
1333 = '''<RDL><PUSH/><TEXT>The York is also responsible for patrolling the Tau-31 system. It gets rough up in the Barrier fields with the Ashbound. London is talking about sending us up farther into Tau-23. I guess the BMM project up there isn’t going so well.</TEXT><PARA/><POP/></RDL>'''
1334 = '''<RDL><PUSH/><TEXT>The military personnel on this ship are always looking down their noses at us Bounty Hunters, but the truth is that if they could do their job well enough, BMM wouldn’t be forced to hire us to do what the military can’t.</TEXT><PARA/><POP/></RDL>'''
1335 = '''<RDL><PUSH/><TEXT>The reason the Ashbound are in this area is because of the Jump Hole to the west of the radiation zone in the LD-14 field. The Hole goes to Edinburgh, which is where the Cardamine comes from.</TEXT><PARA/><POP/></RDL>'''
1336 = '''<RDL><PUSH/><TEXT>The Mollys come into this system from Larkspur. The Guild figures the southern Jump Hole is hidden somewhere in the two smog clouds. All the Leeds criminals use those clouds for attacks and cover.</TEXT><PARA/><POP/></RDL>'''
1337 = '''<RDL><PUSH/><TEXT>Tau-31 is a productive area for us. The Gaians hang out near Harris, if that’s what you fancy. For the more advanced Hunter, the Ashbound offer plenty of challenge in the northern part of the system.</TEXT><PARA/><POP/></RDL>'''
1338 = '''<RDL><PUSH/><TEXT>I heard there’s some big bounties offered by BMM at their mining base in Tau-23. I guess the Ashbound have been sockin’ it to ’em up there. They bit more off than they could chew on that one, they did. That’s practically Edge World.</TEXT><PARA/><POP/></RDL>'''
1339 = '''<RDL><PUSH/><TEXT>Planetform hired me to kill Gaians a few months ago, so that’s what I do. They aren’t the best pilots around, though some of them know a few moves. They come out of the Edinburgh Jump Hole in the northwest end of the system, headed for the West Leeds Smog Cloud.</TEXT><PARA/><POP/></RDL>'''
1340 = '''<RDL><PUSH/><TEXT>Just doing a quick supply run from Leeds. This system is one of those exceptions to the rule that planetside life is better. They were going through one of those gas mask-level smog alerts when I left this morning. That’s when even the rats start to die.</TEXT><PARA/><POP/></RDL>'''
1341 = '''<RDL><PUSH/><TEXT>I used to do the Border World run to Orsena. This is my last job until retirement, which will not be on Leeds, mind you. I’ve got my eye on a nice cottage in the Cambridge countryside.</TEXT><PARA/><POP/></RDL>'''
1342 = '''<RDL><PUSH/><TEXT>You are reasonably trustworthy in Bowex’s eyes, so I don’t mind telling you that the MOX from this base comes directly from LD-14. We ship them back Toxic Waste to reprocess. BMM had to start doing it after 800 years of dumping because of ALG.</TEXT><PARA/><POP/></RDL>'''
1343 = '''<RDL><PUSH/><TEXT>It’s a quick jaunt up from Leeds. We have to bring all the essentials up here, like life support gases, Food — the usual. Nobody bothers us most of the time.</TEXT><PARA/><POP/></RDL>'''
1344 = '''<RDL><PUSH/><TEXT>Bowex handles shipping to the Border Worlds to keep this base running. I don’t make the shipments; I leave that to the pilots who enjoy danger. We deliver Pharmaceuticals and Consumer Goods to Freeport 6 and return with Fertilizers and Alien Organisms.</TEXT><PARA/><POP/></RDL>'''
1345 = '''<RDL><PUSH/><TEXT>Ever think about traveling to foreign lands? Do you enjoy white-knuckle danger? Well this station could always use more H-Fuel. We get it from Osaka in Honshu. While you are buried in the middle of Orsena space you might as well stop and pick up some Optronics and Engine Components from Narita in Sablecross. We buy them at a good price here.</TEXT><PARA/><POP/></RDL>'''
1346 = '''<RDL><PUSH/><TEXT>Cambridge may be the breadbasket of Vespera, but they need their Fertilizers to grow all that food, which is where Bowex comes in. We make the return trip with Consumer Goods bound for Freeport 6 and points beyond.</TEXT><PARA/><POP/></RDL>'''
1347 = '''<RDL><PUSH/><TEXT>Once we get past the smog clouds to the south it is a pretty easy flight into Larkspur. Bowex delivers Optronics and Engine Components to Southampton. Then we head to Larkspur to drop off H-Fuel, often loading Pharmaceuticals for the return.</TEXT><PARA/><POP/></RDL>'''
1348 = '''<RDL><PUSH/><TEXT>Glasgow has served as our company headquarters and shipping portal to the Border Worlds for centuries. It is now used mainly as a fuel distribution point for northern Vespera, although in the past it contained most of the corporate offices. Larkspur is now the center of operations.</TEXT><PARA/><POP/></RDL>'''
1349 = '''<RDL><PUSH/><TEXT>I was raised in this system and was smart enough to get out of the smelters. It is a dead end to try and be a part of BMM. They will use you up and throw you away, just like they did with this system. Look around you. Does this place look like the work of conscientious people? Some say it was Vespera’s only choice. I think there is always another way.</TEXT><PARA/><POP/></RDL>'''
1350 = '''<RDL><PUSH/><TEXT>We have been serving Sirius since 66 AS. That makes us one of the oldest surviving companies in Vespera. We didn’t get this far by being easy on our competitors and enemies. That irritating upstart, Gateway, will fail soon enough. Our influential friends in London will make sure of that.</TEXT><PARA/><POP/></RDL>'''
1351 = '''<RDL><PUSH/><TEXT>We are experts at shipping between Orsena and Vespera. It has been this way for several centuries, and though it was Vespera’s industry that kept the system alive, Bowex was the life blood of Vespera’s industrial prowess. Remember that the next time you encounter some Gateway trash trying to haul scrap across Bowex space.</TEXT><PARA/><POP/></RDL>'''
1352 = '''<RDL><PUSH/><TEXT>This base trades in Alien Organisms and H-Fuel, two Commodities we need in our operations in Perth. We prefer to ship these vital project Commodities ourselves, but qualified independent pilots are welcome to do the job. It is a good way to make money, if traveling into Gaian territory doesn’t bother you.</TEXT><PARA/><POP/></RDL>'''
1353 = '''<RDL><PUSH/><TEXT>The Gaians in this system are losing more of their numbers everyday to our Bounty Hunters. Planetform will not be beaten by pseudo-intellectual rabble. Although they are still very strong in Edinburgh, we will overcome them in time.</TEXT><PARA/><POP/></RDL>'''
1354 = '''<RDL><PUSH/><TEXT>If it weren’t for the Green Front, the Gaian political action group, funds wouldn’t be available to conduct their operations. Why this political cabal is not persecuted by the Vesperan government is beyond my understanding. The terrorists in this group are not protesters; they are murderers and deserve to be dealt with accordingly.</TEXT><PARA/><POP/></RDL>'''
1355 = '''<RDL><PUSH/><TEXT>I run the marine contingent on this base. It’s one of the worst duties you can pull. If you get sent here, someone up top really hates you. They can’t send the dregs here you know, so we have an important job to do.</TEXT><PARA/><POP/></RDL>'''
1356 = '''<RDL><PUSH/><TEXT>Everyone stationed at this base has it bad for the Mollys. The ones that get captured don’t survive long enough to be shipped out of here. The last one we captured was found the next morning in his cell with two pieces of MOX where his eyes used to be.</TEXT><PARA/><POP/></RDL>'''
1357 = '''<RDL><PUSH/><TEXT>We come across the Ashbound at this base occasionally. I think they are just passing through, but we are bound by duty to engage them. They are one tough fight. Their ships are better than ours — makes me a bit angry to think about that — but I do what I have to.</TEXT><PARA/><POP/></RDL>'''
1358 = '''<RDL><PUSH/><TEXT>Bounty Hunters refuse to come to this base. I can’t say that I blame them, but I’m glad they don’t. We have enough criminals in these parts as it is. Most Bounty Hunters have done a turn or two at one of our prisons. How do you think they know all the underworld secrets that they do?</TEXT><PARA/><POP/></RDL>'''
1359 = '''<RDL><PUSH/><TEXT>Once a pilot has completed a tour of duty at this base he gets his choice of assignments. Most go right to Larkspur. I’ve got three months left of duty left here. I transferred in with six others, all pretty green. I’m the only one left. Mollys and Ashbound killed the rest of my mates. I try not to make friends here anymore; I just do my job.</TEXT><PARA/><POP/></RDL>'''
1360 = '''<RDL><PUSH/><TEXT>I like to fly out into the fields alone. I fight best solo. I don’t have to worry about some stupid kid just out of the academy getting more of our equipment destroyed. It’s dangerous, though — no one to watch your back if you get jumped by a pair of Ashbound or Mollys.</TEXT><PARA/><POP/></RDL>'''
1361 = '''<RDL><PUSH/><TEXT>BMM ships the majority of its basic supplies from Leeds to this base. Let me tell you, it is a relief to see those weapon platforms encircling this base when I’m bringing in a load of supplies.</TEXT><PARA/><POP/></RDL>'''
1362 = '''<RDL><PUSH/><TEXT>I’m waiting here to meet the BMM replacement pilot who will be taking the place of John Gibbs, the chap who used to make the run from Southampton with Toxic Waste. He got jumped by a couple of Mollys. They say the first shot that went through his shields hit a Toxic Waste container. No more John Gibbs, unless you count the tiny little chunks floating in space.</TEXT><PARA/><POP/></RDL>'''
1363 = '''<RDL><PUSH/><TEXT>Stokes Smelter, just down the Trade Lane, provides most of our raw materials here, beyond the Uranium itself. They do the run every week, slipping in a Toxic Waste shipment on occasion to keep the Mollys guessing.</TEXT><PARA/><POP/></RDL>'''
1364 = '''<RDL><PUSH/><TEXT>You know what the workers at this base call it? Heh, they call it “short time.” It’s a fitting name. The employees who work here make three times their normal salary, but their exposure to radiation ages them untold years. So, if you walk too long a stretch here you won’t be alive very long.</TEXT><PARA/><POP/></RDL>'''
1365 = '''<RDL><PUSH/><TEXT>The Mollys have been trying to get at this base for as long as I can remember. That’s why we have the military here. The Mollys are either trying to steal Toxic Waste or MOX to make weapons of mass destruction, or they are trying to blow this place up.</TEXT><PARA/><POP/></RDL>'''
1366 = '''<RDL><PUSH/><TEXT>BMM will chew you up and spit you out. The company has no regard for worker safety since it cuts down on the profits. Most of the employees who work this station aren’t ever the same again afterwards — all kinds of health problems, but that doesn’t stop BMM from pumping out the MOX.</TEXT><PARA/><POP/></RDL>'''
1367 = '''<RDL><PUSH/><TEXT>The weapon platforms they installed in this area have gone a long way to curbing attacks on the base, even though our miners still get perforated in the fields by the occasional Molly attack. Hey, that’s why they take the danger pay. You just hope you’re not the one who takes a ship-to-ship missile in the chest — ain’t much left of you when that happens.</TEXT><PARA/><POP/></RDL>'''
1368 = '''<RDL><PUSH/><TEXT>My father worked on this base trying to get enough money together to get our family out of this system. We received a letter of grievance signed with a rubber stamp when an explosion occurred in the refinery unit where he worked. There were no survivors. The bodies were so irradiated that they had to be sealed in special containers for the funerals.</TEXT><PARA/><POP/></RDL>'''
1369 = '''<RDL><PUSH/><TEXT>One of my mates has been losing his hair, and not bit by bit either, if you catch my drift. He’s been on this base longer than anyone else, but I think it’s time he took his pay and pulled stakes. The greed is going to kill him if he lets it. I guess that goes for anybody, really. You have to know when its time to leave.</TEXT><PARA/><POP/></RDL>'''
1370 = '''<RDL><PUSH/><TEXT>Bowex ships H-Fuel to this base from Glasgow. It’s the only shipment we make that doesn’t involve MOX or Toxic Waste, so it is considerably less dangerous. Toxic Waste is flammable or even explosive, and the MOX makes you a prime target for the Mollys.</TEXT><PARA/><POP/></RDL>'''
1371 = '''<RDL><PUSH/><TEXT>It makes me worried just to step foot on this base. Do you know how many times this base has gone critical and flooded the corridors with radiation? More than once, you can be sure of that. I make a decent living working for Bowex running MOX from this base to the Armed Forces battleships. I pick up their spent fuel pellets for reprocessing on the return trip.</TEXT><PARA/><POP/></RDL>'''
1372 = '''<RDL><PUSH/><TEXT>Bowex is the exclusive supplier of MOX to the Orsena Naval Forces. We ship it to Yokohama in Sablecross, where it is distributed by Samura to the various locations. While we are there we pick up their Toxic Waste and ship it back here — a tidy arrangement.</TEXT><PARA/><POP/></RDL>'''
1373 = '''<RDL><PUSH/><TEXT>The military and the police might have their orders concerning which targets are the highest priority, but I don’t see it that way. Planetform will pay me a lot more for a dead Gaian than a Molly, so I kill Gaians — they are easy pickings. If I wanted a challenge I’d square off with some Mollys. BMM will pay you well to take them down.</TEXT><PARA/><POP/></RDL>'''
1374 = '''<RDL><PUSH/><TEXT>I’m not bound by jurisdiction, so if a company puts a contract out on you, I’m going to hunt you down. And when I find you I’m gonna kill you, because that’s how I put food on the table for my son.</TEXT><PARA/><POP/></RDL>'''
1375 = '''<RDL><PUSH/><TEXT>I’m a Leedite, born and raised here in Leeds, son of a Uranium miner. Did a turn in prison too, but that’s all behind me now. I know where the Jump Holes are in this system. I learned about them in Newgate. You can get to Manchester under wraps in the East Leeds, Larkspur through the West Leeds.</TEXT><PARA/><POP/></RDL>'''
1376 = '''<RDL><PUSH/><TEXT>If you choose the life of a Bounty Hunter, you should know that you’ll never win any popularity contests. The crooks hate you cuz you make a living of putting them in the past tense. The police and military envy you because you can take on the jobs they can’t always do. The corporations dislike you because you don’t follow the rules, and other Bounty Hunters might not like you because you are their competition.</TEXT><PARA/><POP/></RDL>'''
1377 = '''<RDL><PUSH/><TEXT>If I’m hired to pop Gaians, I’ll head for the Edinburgh Jump Hole. If the contract reads for Mollys, I’m gonna head for the Larkspur or Manchester Holes — most likely the Larkspur Hole. That’s really where the majority of ’em come from.</TEXT><PARA/><POP/></RDL>'''
1378 = '''<RDL><PUSH/><TEXT>The Edinburgh Jump Hole is a dangerous place to hang out. It’s in the LD-14 field, and all manner of thieves and killers pass through that area. Not only that, it is just slightly west of a pocket of radiation in the field, so an inexperienced pilot might get cooked.</TEXT><PARA/><POP/></RDL>'''
1379 = '''<RDL><PUSH/><TEXT>Bowex supplies this base with everything it needs to operate. It all comes from Leeds. It’s a short trip, but one of the most dangerous Lanes in the system with all the criminal traffic that crosses it.</TEXT><PARA/><POP/></RDL>'''
1380 = '''<RDL><PUSH/><TEXT>The best way to climb your way out of this dirt hole is to become a pilot. It is possible; I’ve seen people do it. Slowly they change from creatures into people with enough self-respect to stand up for themselves. That’s what happened to me.</TEXT><PARA/><POP/></RDL>'''
1381 = '''<RDL><PUSH/><TEXT>This police post is a new construction designed to monitor this Trade Lane. There have been numerous attacks here by all the resident criminal factions within Vespera’s boundaries.</TEXT><PARA/><POP/></RDL>'''
1382 = '''<RDL><PUSH/><TEXT>I fly patrols into the West Leeds Smog Cloud. Every single criminal faction in Leeds hangs out in that slime. It’s my job to root them out and bring them to justice, since the military is too busy up north protecting LD-14. The Gaians are the easiest group, though I must admit that their quality has been improving.</TEXT><PARA/><POP/></RDL>'''
1383 = '''<RDL><PUSH/><TEXT>One of the more satisfying jobs on this base is escorting the prison convoy into Larkspur, a big ship full of criminals. Any Ashbound onboard aren’t coming back; they usually kick off in prison, for some reason. Of course we don’t capture too many of them in the first place.</TEXT><PARA/><POP/></RDL>'''
1384 = '''<RDL><PUSH/><TEXT>The police in Vespera have a hard time shaking the lousy reputation that Helion shippers have of the police. That’s because they are used to the LPI, which is just as crooked as the criminals.</TEXT><PARA/><POP/></RDL>'''
1385 = '''<RDL><PUSH/><TEXT>Some Bounty Hunters are alright, I suppose. Others are rotten and will kill anybody if the money is right. Basically, they are assassins that companies hire to kill the criminals we haven’t had the chance to apprehend yet.</TEXT><PARA/><POP/></RDL>'''
1386 = '''<RDL><PUSH/><TEXT>This base was built to protect the shipping coming into Leeds on its way to Larkspur. This is the main trade artery between Orsena and Vespera and is Bowex’s bread and butter. If you want to talk about a company with its hands in The Crown’s pocket, it’s Bowex.</TEXT><PARA/><POP/></RDL>'''
1387 = '''<RDL><PUSH/><TEXT>The East Leeds Smog Cloud is as dangerous a place as any. The Mollys especially like to use it as cover, and so do the Ashbound. Even the Gaians will use the East Leeds to get up into the Stokes Asteroid Field where they hit Planetform shipments moving in and out of Stokes.</TEXT><PARA/><POP/></RDL>'''
1388 = '''<RDL><PUSH/><TEXT>You might hear a lot of talk about the Ashbound and the Gaians, but the highest priority in this system is the Mollys. Sure, the other factions cause trouble, but the Mollys pose the greatest threat to Vespera.</TEXT><PARA/><POP/></RDL>'''
1389 = '''<RDL><PUSH/><TEXT>Some of the Vesperan Police will eventually join the military. This is good training in that respect. Both institutions are honorable and you do a lot of the same things, though I’d say our job is a bit harder because we are supposed to apprehend criminals where we can. The military doesn’t see things quite the same way.</TEXT><PARA/><POP/></RDL>'''
1390 = '''<RDL><PUSH/><TEXT>You aren’t gonna find tourists, artists, or scientists in this system. You are gonna find wolves and sheep. Now, who is who is for you to figure out. Which one are you going to be?</TEXT><PARA/><POP/></RDL>'''
1391 = '''<RDL><PUSH/><TEXT>I like visiting this place. Normally I look out my office window in Leeds and can’t see anything green through all of the sulfurous clouds. My company’s executive office wants to exploit Gaia much as they did with Leeds, with little or no government foresight. I’m not sure that’s such a good idea at this point, given our track record.</TEXT><PARA/><POP/></RDL>'''
1392 = '''<RDL><PUSH/><TEXT>I’m going on an unofficial hunting expedition tomorrow. I met a Bounty Hunter who says he can find me a blue ground sloth. That would be an interesting addition to the collection of heads in my study.</TEXT><PARA/><POP/></RDL>'''
1393 = '''<RDL><PUSH/><TEXT>I’ve seen company documents that described negligible amounts of Cobalt on Gaia. It was a ploy for the government to let us in and begin full-scale strip mining of Aluminum and Titanium, the Basic Alloy metals that we have almost exhausted in Stokes. So, the Gaians and Cambridge researchers were not unfounded in their accusations.</TEXT><PARA/><POP/></RDL>'''
1394 = '''<RDL><PUSH/><TEXT>If you want to rack up the bounties, just hang out by the Leeds Jump Hole in the Islay Cloud. You’ll have company, since it’s the main supply and smuggling route into the rest of Vespera for the Ashbound and Gaians.</TEXT><PARA/><POP/></RDL>'''
1395 = '''<RDL><PUSH/><TEXT>Those Gaians don’t really seem to be a bad lot — maybe a little up in the clouds, if you know what I mean. They haven’t had to deal with makin’ a living, like us working-class folks. Orbital has brought us here to bring in a few scalps, and that’s what I’ll do.</TEXT><PARA/><POP/></RDL>'''
1396 = '''<RDL><PUSH/><TEXT>I just arrived yesterday. We had a bit of a scare with some Gaians along the Islay Cloud stretch, but the Police Authority soon gave chase. I’m headed down to Gaia this afternoon. We’ve been promised by the guide that we’ll see plenty of grass antelope and white buffalo, and maybe a giant tusked tiger if we’re lucky.</TEXT><PARA/><POP/></RDL>'''
1397 = '''<RDL><PUSH/><TEXT>Bowex does not officially take a stand on Gaia or terraforming in general. I personally feel that it has been a tremendous waste of government money that could’ve been better spent in a clean-up of Leeds, or in subsidizing new technology research to make Vespera more competitive with the other Houses.</TEXT><PARA/><POP/></RDL>'''
1398 = '''<RDL><PUSH/><TEXT>Back in Larkspur, more than a few people are starting to question the official media’s version of the Gaians. Instead of engaging in general piracy, the Gaians focus their efforts on Gaia and terraforming-related activities in Vespera. I must admit, it is a unique planet that represents something that we have lost in Vespera. It’s worth protecting from Cobalt mining, or whatever BMM wanted to do.</TEXT><PARA/><POP/></RDL>'''
1399 = '''<RDL><PUSH/><TEXT>The commander of the </TEXT><TRA italic="true"/><TEXT>York</TEXT><TRA italic="false"/><TEXT>  selects the best squadron once a year and sends us all here. I’d never tasted Luxury Food before, until coming to the </TEXT><TRA italic="true"/><TEXT>Shetland</TEXT><TRA italic="false"/><TEXT>. I don’t really care about visiting Gaia, though. I grew up on the Birmingham Mining Station. I never really knew planetside life.</TEXT><PARA/><POP/></RDL>'''
1400 = '''<RDL><PUSH/><TEXT>We’ve been doing a lot of patrols in the LD-14 area, looking mostly for Mollys. We keep running into Gaians and Ashbound, which has been a real puzzler. Enough of work talk. I need one of those Gaian Shooters everyone’s doing over there at the bar.</TEXT><PARA/><POP/></RDL>'''
1401 = '''<RDL><PUSH/><TEXT>I’m heading out with a Bounty Hunter today on an Arran Cloud flight. Guess I need some action, even when I’m on leave. He said I could handle the guns if anyone shows up.</TEXT><PARA/><POP/></RDL>'''
1402 = '''<RDL><PUSH/><TEXT>As part of our security arrangement with Orbital, one Aberdeen Police Authority employee is allowed a free stay at the </TEXT><TRA italic="true"/><TEXT>Shetland</TEXT><TRA italic="false"/><TEXT>  every month. We’re more likely to respond quickly to Orbital distress calls, if you know what I mean.</TEXT><PARA/><POP/></RDL>'''
1403 = '''<RDL><PUSH/><TEXT>We’re supposed to keep an eye out for Cardamine use on the </TEXT><TRA italic="true"/><TEXT>Shetland</TEXT><TRA italic="false"/><TEXT>  when we’re here on holiday. This ship seems pretty clean, though. It’s a little too difficult for the dealers to smuggle past our border station. I’ve heard there’s some Gaian plant that produces an even better effect than Cardamine.</TEXT><PARA/><POP/></RDL>'''
1404 = '''<RDL><PUSH/><TEXT>All these rich people from the big planets make me kind of self-conscience. They spend more on clothes and jewelry in a couple of days here than I earn in a year. I’ll just hang out at the buffet and feast, I guess.</TEXT><PARA/><POP/></RDL>'''
1405 = '''<RDL><PUSH/><TEXT>I’m taking a breather from the rigors of life in the confines of the Cambridge Research Station. I plan to spend my entire trip lying on the equatorial beaches of Gaia. The binary stars of this system produce some spectacular light shows during the sunrises and sunsets — simply amazing.</TEXT><PARA/><POP/></RDL>'''
1406 = '''<RDL><PUSH/><TEXT>The researchers down on Gaia don’t even want us tourists there. They say we introduce alien viruses and diseases to the indigenous animal population. It’s been an ongoing dispute between Cambridge University and Orbital Spa.</TEXT><PARA/><POP/></RDL>'''
1407 = '''<RDL><PUSH/><TEXT>We’re doing all sorts of crazy research back in Cambridge. They keep bringing in those Alien Organisms, and you have to be very careful with them. Management is hoping to find one that can help us unlock the mysteries of Cardamine, but I’m not sure why they want to do that.</TEXT><PARA/><POP/></RDL>'''
1408 = '''<RDL><PUSH/><TEXT>They say that Gaia is what our long-lost Earth was like about 200 million years ago — sort of like real-life time travel. There’s nothing else like it in the Nacre Reach. The Orsena love it here. Don’t know why they need those Bounty Hunters here, too. They’re a bunch of crass working-class thugs.</TEXT><PARA/><POP/></RDL>'''
1409 = '''<RDL><PUSH/><TEXT>It’s stressful at Gateway. Bowex lobbyists have a lock on the Vesperan government and its contracts. They’ve made it hard for us to expand much in Vespera. We’re hoping that the ALG and IMG partnerships will eventually allow us to control the Border World shipping business beyond the reach of Trade Lanes.</TEXT><PARA/><POP/></RDL>'''
1410 = '''<RDL><PUSH/><TEXT>Gateway doesn’t handle any Edinburgh traffic — this is Planetform territory. I don’t know why they’re starting this new project. They haven’t even finished Harris or California Minor yet. They should just leave this place alone.</TEXT><PARA/><POP/></RDL>'''
1411 = '''<RDL><PUSH/><TEXT>Gaia is the reason I am here. We have the cruise ship </TEXT><TRA italic="true"/><TEXT>Hawaii</TEXT><TRA italic="false"/><TEXT>  in Sigma-19, which offers everything that the </TEXT><TRA italic="true"/><TEXT>Shetland</TEXT><TRA italic="false"/><TEXT>  can in terms of luxuries and pleasures, but this planet is unique. I come here every year and explore a different area.</TEXT><PARA/><POP/></RDL>'''
1412 = '''<RDL><PUSH/><TEXT>Gaia has many attractions. There is a beautiful stretch of beaches, a large preserve dedicated to wild animals, and a mountain range this is twice as high as anything I’ve ever seen in Orsena.</TEXT><PARA/><POP/></RDL>'''
1413 = '''<RDL><PUSH/><TEXT>It is a long journey here from Orsena. I’m stationed in Kyushu on the battleship </TEXT><TRA italic="true"/><TEXT>Nagumo</TEXT><TRA italic="false"/><TEXT>. I normally do Tau-29 patrols but never go further than that. Tau-31 is pretty, but Leeds is horribly polluted. We have nothing like that in Orsena.</TEXT><PARA/><POP/></RDL>'''
1414 = '''<RDL><PUSH/><TEXT>We are outraged that the government, at the urging of the researchers on Gaia, has refused our Oxygen and Water supply ships to land. This necessitates a trip to the Planetform operation at Perth, with all of the inherent risks of Gaian attack.</TEXT><PARA/><POP/></RDL>'''
1415 = '''<RDL><PUSH/><TEXT>The best money you can make on supply duty is hauling Luxury Goods and Luxury Foods from Larkspur. These goods are more enticing to the Ashbound, so there is considerably more risk involved. Be especially careful in the West Leeds Smog Cloud.</TEXT><PARA/><POP/></RDL>'''
1416 = '''<RDL><PUSH/><TEXT>Most of our basic supplies like Consumer Goods, Food, and Pharmaceuticals come from Larkspur or Leeds. It can be a worthwhile run for a freelance shipper, but watch out for the Gaians.</TEXT><PARA/><POP/></RDL>'''
1417 = '''<RDL><PUSH/><TEXT>Some of our ships run Luxury Goods all the way from the source in Whiteharbor to our location. It’s one of the most lucrative legal cargo runs in Sirius, but it goes without saying that there are a number of hurdles to cross. The Barrier is probably the most difficult.</TEXT><PARA/><POP/></RDL>'''
1418 = '''<RDL><PUSH/><TEXT>Business has been very good on the </TEXT><TRA italic="true"/><TEXT>Shetland</TEXT><TRA italic="false"/><TEXT>. The Vesperan populace enjoys visiting an unspoiled paradise like Gaia. Unfortunately, tourists’ impressions of Gaia have served to increase public sympathy for the Gaian movement, making it more difficult to obtain government funds for eradicating the terrorists.</TEXT><PARA/><POP/></RDL>'''
1419 = '''<RDL><PUSH/><TEXT>Gaia is a remarkable planet. We are blessed with a pristine ecosystem that has supported the evolution of higher life-forms like giant reptiles and mammals.</TEXT><PARA/><POP/></RDL>'''
1420 = '''<RDL><PUSH/><TEXT>London doesn’t give us much for a Gaian bounty. Ashbound, on the other hand — they’ll keep you in business. This is their main access route to the inner systems of Vespera.</TEXT><PARA/><POP/></RDL>'''
1421 = '''<RDL><PUSH/><TEXT>The Jump Hole in the Islay Cloud is a pretty rough place to hang out. If you’re quick, you can catch a few Ashbound unaware, before they have a chance to respond. On the other hand, the Gaians will really swarm you since it’s so close to their base.</TEXT><PARA/><POP/></RDL>'''
1422 = '''<RDL><PUSH/><TEXT>Those Gaians are a stubborn lot. I had me one on his knees — a flaming wreck, weapons gone. He tried to ram me, so I had to finish him off. I guess he knew what was waiting for him in Newgate. All those working-class blokes in there fancy a little upper-crust Cambridge companionship on occasion.</TEXT><PARA/><POP/></RDL>'''
1423 = '''<RDL><PUSH/><TEXT>We do a daily run down to the Skye Field. The Gaians like to hang out there, waiting for Planetform to stick their heads out. If we haven’t been chasing the Gaians hard enough. Planetform sometimes gives us better bounties as a temporary incentive.</TEXT><PARA/><POP/></RDL>'''
1424 = '''<RDL><PUSH/><TEXT>The reason that Edinburgh is so important? There’s no Jump Hole from Tau-31 to Leeds. Ashbound and Gaians have to come through here to get to the Border Worlds. There’s lots of cover in the clouds here. The only point of vulnerability is the crossing north of the cruise ship. You just sit there, and eventually an Outcast is bound to turn up.</TEXT><PARA/><POP/></RDL>'''
1425 = '''<RDL><PUSH/><TEXT>The Guild has members in almost every system of Sirius. Once you get off the Trade Lanes, we’re it as far as law and order goes, though some types might take offense to that. They would say that we’re the problem. Don’t matter to me.</TEXT><PARA/><POP/></RDL>'''
1426 = '''<RDL><PUSH/><TEXT>I’ve just dropped off our monthly supply shipment for this base. We bring it in from Leeds, Side Arms and all. I’m not in a hurry to get back to Leeds, because I’ve got a respiratory problem that always acts up when I land there.</TEXT><PARA/><POP/></RDL>'''
1427 = '''<RDL><PUSH/><TEXT>This is a beautiful place. I’ll have to come back sometime to visit the </TEXT><TRA italic="true"/><TEXT>Shetland</TEXT><TRA italic="false"/><TEXT>. I’m glad that Bowex doesn’t have to supply the other bases, though. Security gets to be a much bigger issue once you leave the safety of Aberdeen and the Gate area.</TEXT><PARA/><POP/></RDL>'''
1428 = '''<RDL><PUSH/><TEXT>Had a rough run through the West Leeds Smog Cloud on my last return trip. Some Ashbound mistook me for something juicy, like a VIP ship. They never should have let that cloud get so out of hand. That’s our efficient government for you — always on top of it.</TEXT><PARA/><POP/></RDL>'''
1429 = '''<RDL><PUSH/><TEXT>Aberdeen serves as the guardian for the rest of Vesperan space in this sector. Before the establishment of this post, the Ashbound and the Gaian eco-terrorists had free reign in this system.</TEXT><PARA/><POP/></RDL>'''
1430 = '''<RDL><PUSH/><TEXT>I think it’s a bloody waste of taxpayer money having us up here. This really shouldn’t be under the Authority’s jurisdiction. My guess is that some private contributions were made by Planetform to certain Vesperan government officials.</TEXT><PARA/><POP/></RDL>'''
1431 = '''<RDL><PUSH/><TEXT>The Cambridge researchers on Gaia have made quite a stink about us all being here in Edinburgh. They think it’ll lead to the deterioration of the environment and mass extinctions. I don’t think I’d go that far.</TEXT><PARA/><POP/></RDL>'''
1432 = '''<RDL><PUSH/><TEXT>The positioning of Aberdeen is quite strategic. We can protect the Gate and sit astride the Gaian attack parties bound for the Sky Ice Field. The Islay Cloud is also in close proximity, enabling easy monitoring of Gaian movements along the </TEXT><TRA italic="true"/><TEXT>Shetland</TEXT><TRA italic="false"/><TEXT>  access route.</TEXT><PARA/><POP/></RDL>'''
1433 = '''<RDL><PUSH/><TEXT>We aren’t really here to control the Gaians. That’s just the public version that the government spewed out. Our primary mission, as far as London is concerned, is Outcast monitoring and suppression.</TEXT><PARA/><POP/></RDL>'''
1434 = '''<RDL><PUSH/><TEXT>We get conflicting reports from London on how to handle the Gaians. One week it’s “Vaporize them all on sight”; next week it’s “Leave them be if they aren’t causing problems.”</TEXT><PARA/><POP/></RDL>'''
1435 = '''<RDL><PUSH/><TEXT>We send out two daily patrols: one to Perth, and one to </TEXT><TRA italic="true"/><TEXT>Shetland</TEXT><TRA italic="false"/><TEXT>. These keep the Gaians in check most of the time. If the Ashbound show up, we can only hope that the Bounty Hunters are close by.</TEXT><PARA/><POP/></RDL>'''
1436 = '''<RDL><PUSH/><TEXT>Since we established Aberdeen, those rich folks on the </TEXT><TRA italic="true"/><TEXT>Shetland</TEXT><TRA italic="false"/><TEXT>  have had to clean up their act. No more Cardamine coming through this Gate. I hear it’s not quite the party it once was.</TEXT><PARA/><POP/></RDL>'''
1437 = '''<RDL><PUSH/><TEXT>We’re pretty certain the Gaian base is in the Islay Cloud. It’s hard to find it in there though; those ice asteroids look all the same after a while. If you’re unlucky, you could stumble into an Outcast doing some smuggling. My former wing man did that last year — may he rest in peace.</TEXT><PARA/><POP/></RDL>'''
1438 = '''<RDL><PUSH/><TEXT>The austere majesty of Gaia is cheapened by the swarms of tourists that set foot upon the planet. Orbital Spa and Cruise, though it may feign to preserve the abundance of its locales, cares for nothing more than its next credit.</TEXT><PARA/><POP/></RDL>'''
1439 = '''<RDL><PUSH/><TEXT>The Aberdeen Police Station and the in-system Bounty Hunters are the only things that stop us from completely destroying Planetform’s operations in this system. Maybe the Green Front will be able to garner enough public support for us on Larkspur so that we don’t have to contend with the police anymore.</TEXT><PARA/><POP/></RDL>'''
1440 = '''<RDL><PUSH/><TEXT>We have information indicating that the centuries-long terraforming operations run by Planetform will never succeed. A top secret government report obtained by the Green Front asserts that the planets will lose their nascent atmospheres within several hundred years of completion of the process due to uncontrolled outgassing.</TEXT><PARA/><POP/></RDL>'''
1441 = '''<RDL><PUSH/><TEXT>Tau-31 is an important sector for the Gaians. Though terraforming operations on Harris are almost complete, they still need Alien Organisms from the Edge Nebula. The Organisms are crucial in speeding up the terraforming process, thereby making it more economically viable.</TEXT><PARA/><POP/></RDL>'''
1442 = '''<RDL><PUSH/><TEXT>The terraforming gases produced at the Stokes plant in Leeds are a high-priority target for Gaian attack. It is a dangerous run because of our inability to hide for some stretches of travel through Leeds. Usually, only our best pilots make that trip.</TEXT><PARA/><POP/></RDL>'''
1443 = '''<RDL><PUSH/><TEXT>Our hope is that one day the corrupt leadership of BMM and Planetform will be exposed for the greedy, shortsighted people they are. They have squandered our national heritage and future after eight hundred years of unregulated industrialization.</TEXT><PARA/><POP/></RDL>'''
1444 = '''<RDL><PUSH/><TEXT>We bring in all of our supplies, other than our locally available Oxygen and Water, from Trafalgar. It is most ironic that the only place we can land is the despised Junker base — guardians of filth, corruption, and the criminal element.</TEXT><PARA/><POP/></RDL>'''
1445 = '''<RDL><PUSH/><TEXT>Leeds is our greatest example of the ruin that mankind can wreck upon nature — the sheer destructiveness of pure exploitation. It is also the home of the Stokes Smelter, where Terraforming Gases are produced. Fortunately, the system can be used as an access route to all of Vesperan travel because of all the smog clouds. It’s ironic how we escape in the filth we are trying so hard to eradicate.</TEXT><PARA/><POP/></RDL>'''
1446 = '''<RDL><PUSH/><TEXT>We have to ship in a lot of supplies for a Phase I operation. Phase I means there is no breathable atmosphere planetside yet. All procedures like ice asteroid bombardment are done from orbit. Gotta wear a suit to go down on the surface and do Organism placements.</TEXT><PARA/><POP/></RDL>'''
1447 = '''<RDL><PUSH/><TEXT>I just came back from Stokes with a load of PFCs. They’ll dump it into the upper atmosphere of Ayr starting next week. That’s the preferred Stage I Terraforming Gas. It’s nine thousand times more potent than CO2 as far as GWP potential — gets a planet warmed up real quick.</TEXT><PARA/><POP/></RDL>'''
1448 = '''<RDL><PUSH/><TEXT>Our Construction and Mining Machinery comes from Leeds. It’s a pretty rough run through the smog clouds. If the Gaians don’t get you there, they’ll try again right up the road off the Skye Field.</TEXT><PARA/><POP/></RDL>'''
1449 = '''<RDL><PUSH/><TEXT>We ship the Alien Organisms from Glasgow at the northern edge of Leeds. Surface crews are sent down to survey for the correct geological and physical surface conditions. Then they scatter the Organisms with modified planet dusters and let them go to work eating the rock.</TEXT><PARA/><POP/></RDL>'''
1450 = '''<RDL><PUSH/><TEXT>Company headquarters in Canterbury supplies us with Food and crew replacements. Every few weeks they send up one of their office staff to take a look. We put on a good show and then go back to work.</TEXT><PARA/><POP/></RDL>'''
1451 = '''<RDL><PUSH/><TEXT>We’ve dramatically improved the process since we started on Harris 400 years ago. We expect Ayr to take only a hundred years, from start to finish. That’s if the Gaians will let us — pain in the arse, they are.</TEXT><PARA/><POP/></RDL>'''
1452 = '''<RDL><PUSH/><TEXT>This is the one of the best places to buy Gold, or you can head to Dublin for the producer’s price. Just remember, that comes at an added risk of Corsair and Molly attack.</TEXT><PARA/><POP/></RDL>'''
1453 = '''<RDL><PUSH/><TEXT>They say that the Police Authority has been caught unawares of the Corsair threat because the director ignored most of the field reports from Cambridge during the last few years. The Rift Captains were on the move towards Larkspur. There’s plenty of time to build some new bases out there in the east end.</TEXT><PARA/><POP/></RDL>'''
1454 = '''<RDL><PUSH/><TEXT>We focus our efforts in Larkspur, Manchester, and Edinburgh; the military takes over in Dublin and the Border World frontier areas of Cambridge and Leeds.</TEXT><PARA/><POP/></RDL>'''
1455 = '''<RDL><PUSH/><TEXT>Cambridge is Vespera’s breadbasket and Consumer Goods production center. We have various crews shipping Foods and Luxury Foods out to London. Consumer Goods shipments are consigned for London and Leeds.</TEXT><PARA/><POP/></RDL>'''
1456 = '''<RDL><PUSH/><TEXT>I’m just dropping a bit of Gold from Larkspur. We’re headed out in the morning for Dornmark so I better have a drink tonight, since it could be my last.</TEXT><PARA/><POP/></RDL>'''
1457 = '''<RDL><PUSH/><TEXT>We bring in the raw materials for Consumer Goods production from various locations. Basic Alloys are shipped from Stokes, Optical Chips come from Los Angeles, and Optronics are shipped from Orsena via Larkspur. Polymers make the short trip from Freeport 1 in the Omega-3 system.</TEXT><PARA/><POP/></RDL>'''
1458 = '''<RDL><PUSH/><TEXT>We transfer a lot of the Republican cargo from Dornmark to Bowex ships here, including Engine Components and High-Temperature Alloys going to Southampton. Occasionally, there’s the odd Diamond shipment bound for the Leeds Mining Machinery plants.</TEXT><PARA/><POP/></RDL>'''
1459 = '''<RDL><PUSH/><TEXT>Cambridge imports Fertilizers, Side Arms, and Luxury Goods from Larkspur — quite an eclectic mix of needs there, if I don’t say so myself.</TEXT><PARA/><POP/></RDL>'''
1460 = '''<RDL><PUSH/><TEXT>The prison convoy bound for Manchester got attacked yesterday. Rift Captains came out of nowhere and ambushed them along the Lane to the Larkspur Gate. They figure they were waiting on the nightside of Cambridge.</TEXT><PARA/><POP/></RDL>'''
1461 = '''<RDL><PUSH/><TEXT>The patrol to the Norfolk isn’t too bad. You’ve got the Cambridge Line between you and the bad guys in the clouds, and the military not far away. You’ve just got to keep an eye out.</TEXT><PARA/><POP/></RDL>'''
1462 = '''<RDL><PUSH/><TEXT>The Grasmere Cloud patrol is a volunteer-only assignment — mostly young hotheads out to prove themselves. They’ve got plenty to do with all the Rift Captains in there. There are heavy casualties on that one, sometimes 20% a week. The folly of youth…</TEXT><PARA/><POP/></RDL>'''
1463 = '''<RDL><PUSH/><TEXT>Cambridge is a very nice posting for one of us police types. It’s not industrialized and all like Leeds and London. It does have those Cambridge University snobs, though. They help support the Green Front, which is the “official” arm of the Gaians. They provide financial support and sustain the media war with Planetform and BMM back in London.</TEXT><PARA/><POP/></RDL>'''
1464 = '''<RDL><PUSH/><TEXT>Synth Foods hasn’t arrived in Vespera yet because nobody wants what happened to Dornmark. Consequently, the Cambridge growers are trying to be more efficient and lobbying London to insure that Helion, Inc. doesn’t get a foothold here.</TEXT><PARA/><POP/></RDL>'''
1465 = '''<RDL><PUSH/><TEXT>At least the Police Authority doesn’t have to deal with Omega-3. The Armed Forces has its hands full with Rift Captains and Cinder Guard out there. I’ve never been out of Vespera and plan to keep it that way.</TEXT><PARA/><POP/></RDL>'''
1466 = '''<RDL><PUSH/><TEXT>We use Cambridge as a convenient supply source for the Cambridge Research Station, which is high in orbit above this planet. Hydrocarbons and Polymers are shipped from Omega-3.</TEXT><PARA/><POP/></RDL>'''
1467 = '''<RDL><PUSH/><TEXT>Cryer uses Cambridge as our trans-shipment point for Pharmaceuticals produced on the station. In addition to our research activities, we supply all of Vespera’s needs.</TEXT><PARA/><POP/></RDL>'''
1468 = '''<RDL><PUSH/><TEXT>Cambridge is a good recruiting center for Cryer. The University provides us with many eager graduates who do not want to be far from home. There is a daily work shuttle expressly for that purpose.</TEXT><PARA/><POP/></RDL>'''
1469 = '''<RDL><PUSH/><TEXT>I’m on the Kensington circuit. We usually import H-Fuel or Gold. On the outbound trip it could be Food, Pharmaceuticals, or Consumer Goods. We don’t make a lot of profit, but it’s a fairly safe trip.</TEXT><PARA/><POP/></RDL>'''
1470 = '''<RDL><PUSH/><TEXT>We run the supplies to the IMG base Cardiff across the system. From there we pick up Beryllium for shipment to Kensington or Dornmark.</TEXT><PARA/><POP/></RDL>'''
1471 = '''<RDL><PUSH/><TEXT>From here the Trade Lanes get much more difficult. I’m heading out to the IMG base Freistadt in Omega-3. We ship Pharmaceuticals and Consumer Goods there. That’s if the Hessians or Rift Captains don’t intercept me first.</TEXT><PARA/><POP/></RDL>'''
1472 = '''<RDL><PUSH/><TEXT>This is Republican’s main terminating point in Vespera. We deliver Engine Components and High-Temperature Alloys from Berlin and Dresden. The rise of the Rift Captains in Vespera has persuaded us to let Vesperans handle the cargo for the last leg to Larkspur.</TEXT><PARA/><POP/></RDL>'''
1473 = '''<RDL><PUSH/><TEXT>The highest value cargos shipped between Dornmark and Vespera are Diamonds and Gold. Rift Captains and Cinder Guard plague us the entire way.</TEXT><PARA/><POP/></RDL>'''
1474 = '''<RDL><PUSH/><TEXT>We only do business with established, reliable shippers like Bowex. Gateway is a brash upstart company that has unwisely chosen to partner with the renegade IMG.</TEXT><PARA/><POP/></RDL>'''
1475 = '''<RDL><PUSH/><TEXT>Cryer used to ship its own Organisms from Leeds. Unfortunately, that little spat with the Ashbound led to a lot of its ships being destroyed in Smog Alley, that stretch of Trade Lane between Leeds and the Larkspur Gate that runs between the clouds. Now we handle it.</TEXT><PARA/><POP/></RDL>'''
1476 = '''<RDL><PUSH/><TEXT>We normally stop by Cambridge to pick up a load of Food or Consumer Goods for Leeds on our return trip up north. That doesn’t interest the Ashbound up there as much.</TEXT><PARA/><POP/></RDL>'''
1477 = '''<RDL><PUSH/><TEXT>It’s too bad Vespera has to depend on a Helion company for our drugs. Just goes to show you how we’ve fallen behind over the centuries. Maybe some of these young researchers will see the light and head off on their own.</TEXT><PARA/><POP/></RDL>'''
1479 = '''<RDL><PUSH/><TEXT>This station gets all of its basic supplies from Cambridge. We ship the Pharmaceuticals produced here either to Cambridge or directly to Larkspur.</TEXT><PARA/><POP/></RDL>'''
1480 = '''<RDL><PUSH/><TEXT>Cryer is the sole Pharmaceutical producer remaining in the Nacre Reach. We closely guard our secrets here. We feel that we charge very reasonable prices for our products, given the lack of competition.</TEXT><PARA/><POP/></RDL>'''
1481 = '''<RDL><PUSH/><TEXT>There is a special secret lab that I’m not supposed to talk about. That’s where all Organisms first go when they arrive. The scientists verify whether the particular strain has been characterized before releasing it to the rest of the researchers in the station.</TEXT><PARA/><POP/></RDL>'''
1482 = '''<RDL><PUSH/><TEXT>We are not allowed to land on any planet inhabited by Alien Organisms that we use for our research purposes here, so we have to ship them from the Glasgow Outpost in Leeds.</TEXT><PARA/><POP/></RDL>'''
1483 = '''<RDL><PUSH/><TEXT>Cambridge Research Station was created to provide a stimulating research and development environment in zero-g and to enable us to study the Organisms from the Edge Nebula. These opportunities were unavailable on our planetside locations due to the Alien Import Prohibition Act of 500 AS, which prohibits the importing of any Alien Organism onto inhabited planets.</TEXT><PARA/><POP/></RDL>'''
1484 = '''<RDL><PUSH/><TEXT>Cryer is trying to synthetically derive Cardamine from the Alien Organisms. Cardamine is naturally harvested by the Ashbound within the Omicron systems of the Edge Nebula. If Cryer can reproduce it here, but in a milder and more socially acceptable form, then all the Cardamine addicts in Sirius will be able to switch to our legal version.</TEXT><PARA/><POP/></RDL>'''
1485 = '''<RDL><PUSH/><TEXT>One focus of the zero-g research here is to improve drugs for those workers and travelers that frequently must exist in both environments concurrently, such as the police, military, and other pilots of small spacecraft that lack the aid of artificial gravity.</TEXT><PARA/><POP/></RDL>'''
1486 = '''<RDL><PUSH/><TEXT>Our efforts to synthesize Cardamine have not gone unnoticed by the Ashbound. The Atka Research Station in Sigma-17 is under constant attack. We definitely have a dangerous criminal enemy, which has led management to suspend direct shipments outside of Helion unless Outcast activity is minimal along the route.</TEXT><PARA/><POP/></RDL>'''
1487 = '''<RDL><PUSH/><TEXT>The zero-g production environment has enabled us to produce many exotic drugs not possible planetside. It also aids in researching diseases peculiar to space-dwelling humans.</TEXT><PARA/><POP/></RDL>'''
1488 = '''<RDL><PUSH/><TEXT>We go further into the clouds than the Armed Forces do. I’ve gone right by the Omega-5 Jump Hole more than once. That takes some guts, let me tell ya. The Rift Captains get really nasty if you get too close to their access points. I’ve never been in Omega-5. Not too many Hunters survive to tell their tales of that area.</TEXT><PARA/><POP/></RDL>'''
1489 = '''<RDL><PUSH/><TEXT>Word from Freeport I is that the Rift Captains are losing their turf war with the Hessians in Omega-5. That’ll save Vespera’s rear. Once the Hessians cut off Omega-5, the Rift Captains won’t have an access route into Cambridge anymore. Hessians don’t much care about this corner of the woods.</TEXT><PARA/><POP/></RDL>'''
1490 = '''<RDL><PUSH/><TEXT>Our group went on a long-range patrol along the Corsair Artifact smuggling route to the Larkspur Jump Hole. I got one of ’em in my sights, but his buddies laid some wicked covering fire that forced me to break off. Those Rift Captains are a wily lot.</TEXT><PARA/><POP/></RDL>'''
1491 = '''<RDL><PUSH/><TEXT>There are some top Hunters of the Guild out in the Omega Sector. I was talking to one of ’em last week on Freeport 1 — said he’d made it all the way to Freeport 5 in Omega-41. That’s on the edge of nothing, that is. He talked about a neutron star’s deadly radiation that’ll fry ya in a couple of minutes if you aren’t properly protected.</TEXT><PARA/><POP/></RDL>'''
1492 = '''<RDL><PUSH/><TEXT>I used to be an IMG miner in Cardiff. This is much better work — yeah, a little more dangerous, but a lot more rewarding. They recruited me for my knowledge of the Grasmere and Keswick Clouds. I grew up on Cambridge, so I know ’em like the back of my hand.</TEXT><PARA/><POP/></RDL>'''
1493 = '''<RDL><PUSH/><TEXT>The Guild is gaining membership in Dornmark. It was tough for a while, but the pay is better than the Federal Police can offer, and you have more freedom to boot. Of course, the Cinder Guard are growing, too, so it’s not an easy job. The Mollys and Gaians would be chicken feed for that lot.</TEXT><PARA/><POP/></RDL>'''
1494 = '''<RDL><PUSH/><TEXT>We are delivering supplies from Cambridge for the battleship. It’s not much of a run, but it keeps me busy. The Rift Captains rarely bother us along the Cambridge line. We bring the Side Arms and H-Fuel in from London as needed.</TEXT><PARA/><POP/></RDL>'''
1495 = '''<RDL><PUSH/><TEXT>We had a rough MOX run on the way in. Mollys attacked us as we left LD-14. The Armed Forces saved the day on that one. Then the Mollys bit us again in Larkspur. This time it got dicey, since all we had were police in the area. I lost an escort on that one.</TEXT><PARA/><POP/></RDL>'''
1496 = '''<RDL><PUSH/><TEXT>Normally, running Toxic Waste from a ship like this one is not an attractive target, but those Mollys think they can build a dirty bomb with some of this nasty stuff. So, we have to deal with stress both ways from LD-14.</TEXT><PARA/><POP/></RDL>'''
1497 = '''<RDL><PUSH/><TEXT>The Norfolk serves as a keystone in the defense of Vespera against the scourge of the Rift Captains. The Cambridge Line stretches between here and Cambridge to offer additional protection for ships traveling along that Trade Lane.</TEXT><PARA/><POP/></RDL>'''
1498 = '''<RDL><PUSH/><TEXT>Omega-3 is a sea of ice asteroids. Rift Captains are more of a problem in our end of the system; the Cinder Guard take over at the east end. Apparently, there’s no Jump Hole between Omega-3 and here, or between Omega-3 and Omega-7. That keeps things a little bit more controlled.</TEXT><PARA/><POP/></RDL>'''
1499 = '''<RDL><PUSH/><TEXT>We patrol the Trade Lane into the Keswick Cloud, a favorite crossing point for Rift Captains, and the Lane to Cardiff. The Omega-3 Gate area is particularly contentious right now. We’ve allocated an entire squadron to patrol just that vicinity.</TEXT><PARA/><POP/></RDL>'''
1500 = '''<RDL><PUSH/><TEXT>Captain Edwards says we’re going out into the Grasmere tomorrow on a search and destroy mission to look for Rift Captains. Guess I better record a message for my momma, in case I don’t come back.</TEXT><PARA/><POP/></RDL>'''
1501 = '''<RDL><PUSH/><TEXT>We’ve extended our patrols into Omega-3 per the conditions of the Omega Trade Lane Pact with Dornmark. Problem is, they aren’t holding up their end in Omega-7. The excuse is not enough money. We’re itching to go in there, but London won’t allow it.</TEXT><PARA/><POP/></RDL>'''
1502 = '''<RDL><PUSH/><TEXT>Cambridge used to be such a peaceful place, and then the Rift Captains showed up. They’ve built that Cambridge Line to assure all those university types in Cambridge that everything is under control. Fact is the Line’s useless. The weapon platforms are too far apart, and the Rift Captains just go around the ends of the Line.</TEXT><PARA/><POP/></RDL>'''
1503 = '''<RDL><PUSH/><TEXT>We’re unloading supplies from Cambridge, and then we’ll reload with Beryllium and head for the ALG smelter in Dortmund. It should be a smooth trip once we get past the Rift Captains in the Keswick Cloud and Omega-3.</TEXT><PARA/><POP/></RDL>'''
1504 = '''<RDL><PUSH/><TEXT>The IMG has been good for us. We were really struggling, shipping Water and Oxygen to corporate bases and Freeports, until they selected us as their shipper of choice.</TEXT><PARA/><POP/></RDL>'''
1505 = '''<RDL><PUSH/><TEXT>Gateway hopes to surpass Bowex someday, but that’ll be a tall order with all of the aristocratic friends they have in London. IMG has the same problem with BMM.</TEXT><PARA/><POP/></RDL>'''
1506 = '''<RDL><PUSH/><TEXT>This is the first IMG base established. BMM surveyors somehow missed it during the great mapping period in 450 AS. A couple of Cambridge geology professors on research sabbatical stumbled across it in 654. Lacking the practical experience to develop it, they persuaded some BMM mining engineers to start a new company.</TEXT><PARA/><POP/></RDL>'''
1507 = '''<RDL><PUSH/><TEXT>The IMG is a consortium of former BMM workers, independent miners of various creeds, and more recently, the unemployed legions of Dornmark workers resulting from the collapse of the Dornmark economy in 702.</TEXT><PARA/><POP/></RDL>'''
1508 = '''<RDL><PUSH/><TEXT>The IMG has encountered unexpected resistance in the Edge Worlds. The very territorial Rift Captains and Ashbound view any incursions into the outer Omega or Tau worlds as direct assaults on them.</TEXT><PARA/><POP/></RDL>'''
1509 = '''<RDL><PUSH/><TEXT>Cardiff produces the bulk of the Beryllium in the Nacre Reach. Gateway ships it to Dornmark, while the IMG handles the short run to Kensington. For the return journey, the IMG purchases Mining Machinery.</TEXT><PARA/><POP/></RDL>'''
1510 = '''<RDL><PUSH/><TEXT>Until quite recently, the IMG lacked the shipping capabilities to compete with BMM and Republican. Now that Gateway has joined forces, we are a much stronger entity.</TEXT><PARA/><POP/></RDL>'''
1511 = '''<RDL><PUSH/><TEXT>ALG has recently joined our cause, which makes our loose alliance very powerful. It has the most advanced refining capabilities in all of Vespera and Dornmark. We now have all the pieces to establish a more progressive corporation than our competitors.</TEXT><PARA/><POP/></RDL>'''
1512 = '''<RDL><PUSH/><TEXT>The IMG has been forced to conduct patrols since the arrival of Rift Captains in our space. They have destroyed mining ships and illegally mined Beryllium directly from the field.</TEXT><PARA/><POP/></RDL>'''
1513 = '''<RDL><PUSH/><TEXT>The IMG feels that the Mollys were wronged by BMM. We should know, since most of us were exploited for years. Our Dornmark brethren can tell much the same story. Part of the Guild’s charter is to share the wealth with as many of our rank and file as possible.</TEXT><PARA/><POP/></RDL>'''
1514 = '''<RDL><PUSH/><TEXT>The Hood, Freistadt, and Freeport 4 are open to all. This is part of our Freeport philosophy that we adopted from the Zoners. It is very effective in the Border and Independent Worlds and allows us to coexist with most criminal factions, unlike BMM, Daumann, and Kruger.</TEXT><PARA/><POP/></RDL>'''
1515 = '''<RDL><PUSH/><TEXT>I’m just over here picking up some Oxygen and Ice for the </TEXT><TRA italic="true"/><TEXT>Shetland</TEXT><TRA italic="false"/><TEXT>. It’s easier than going into Leeds for the same of slightly more dubious quality. The only drawback is the potential of a Gaian attack.</TEXT><PARA/><POP/></RDL>'''
1516 = '''<RDL><PUSH/><TEXT>Can’t say I really like these Planetform folks and what their operation could mean for our tourist business if they continue. The Gaians would certainly hassle us more if they left, so the operation diverts a lot of Gaian energy.</TEXT><PARA/><POP/></RDL>'''
1517 = '''<RDL><PUSH/><TEXT>I’m due to be transferred to the </TEXT><TRA italic="true"/><TEXT>Hawaii</TEXT><TRA italic="false"/><TEXT>  in Sigma-19 next month. They rotate all Orbital Spa personnel every two years. That way we get to see all the different areas of the Nacre Reach — a nice fringe benefit of working for Orbital.</TEXT><PARA/><POP/></RDL>'''
1518 = '''<RDL><PUSH/><TEXT>Just between you and me, the real reason we’ve started Ayr is that the government contracts pay the bulk of the milestone payments for an entire process during Phase I. Harris is so far behind schedule that it’s on company costs now. A lot of our money is being siphoned off to Tau-31. Once it’s complete, we’ll probably bail out on Edinburgh and the Gaians.</TEXT><PARA/><POP/></RDL>'''
1519 = '''<RDL><PUSH/><TEXT>Planetform doesn’t actually mind the Gaians as much as you would think. Truth is, they’re a good excuse when it comes to cost overruns and other delays. Blame it on the Gaians, that’s what we do.</TEXT><PARA/><POP/></RDL>'''
1520 = '''<RDL><PUSH/><TEXT>The ice mining we do is part of Phase I terraforming. We look for a large ice asteroid field nearby with appreciable amounts of frozen methane, C02, water, and ammonia. We set off explosives in strategic positions on asteroids, which set them into a collision course with the planet. There’s an art to it — maximum asteroid size for minimum energy expenditure.</TEXT><PARA/><POP/></RDL>'''
1521 = '''<RDL><PUSH/><TEXT>This is a very cheap place for us to purchase Side Arms for our bases far out in the Edge Worlds. The Rogues bring them across Cinderwell for us.</TEXT><PARA/><POP/></RDL>'''
1522 = '''<RDL><PUSH/><TEXT>This is the end of the road for Cardamine shipments, at least as far as we’re concerned. Rogue smugglers take over for the last leg to the Junker base of Rochester. We prefer the safety and protection offered by the Badlands.</TEXT><PARA/><POP/></RDL>'''
1523 = '''<RDL><PUSH/><TEXT>We have stopovers in Trafalgar, Mactan, and Montezuma on our journey in from Tau-23. If you want to make big money in the Cardamine business, you need to work your way up the stream a bit from here.</TEXT><PARA/><POP/></RDL>'''
1524 = '''<RDL><PUSH/><TEXT>The Rogues are annoying at times, but serve our purposes well. If Helion becomes weakened enough by Cardamine addiction, we will no longer need them, as we will be able to enter the rest of the Cinderwell system ourselves.</TEXT><PARA/><POP/></RDL>'''
1525 = '''<RDL><PUSH/><TEXT>Just making a supply run back out to Buffalo. Why do people like me always get the lousy jobs? I have to run the gauntlet of the LPI and Navy through the Detroit Field and across the Trade Lanes with little profit in it for me.</TEXT><PARA/><POP/></RDL>'''
1526 = '''<RDL><PUSH/><TEXT>This is a good base if you want to hang out and attack the local Trade Lanes. Gotta watch out for those Xenos in the eastern part of Jersey, though.</TEXT><PARA/><POP/></RDL>'''
1527 = '''<RDL><PUSH/><TEXT>We’ve been running Diamonds and Gold up from Buffalo. It’s a pretty wild ride across Cinderwell. Anytime you got cargo like that, you gotta expect trouble. All that stuff is smuggled into Helion after getting stolen in the Independent Worlds — kind of like recycled property. That’s the way I see it.</TEXT><PARA/><POP/></RDL>'''
1528 = '''<RDL><PUSH/><TEXT>That Artifact run from Leiden can be rough. There’s a long stretch across Colorado where you’re pretty exposed — Bounty Hunters always out there, circling like vultures. Once you get to the Silverton Field, you got the Xenos.</TEXT><PARA/><POP/></RDL>'''
1529 = '''<RDL><PUSH/><TEXT>Running Cardamine from Buffalo is one of the toughest jobs you can do in Cinderwell. I don’t know why the Ashbound can’t do it themselves. They always make us do all the dirty work. One day we’ll be in charge.</TEXT><PARA/><POP/></RDL>'''
1535 = '''<RDL><PUSH/><TEXT>Rift Captains enter this system from the Jump Hole to Larkspur. They are attracted by all the Gold that gets mined here, and they know it is the most lawless of all the Vesperan system — the police don’t even come into this system, it is just the military and us.</TEXT><PARA/><POP/></RDL>'''
1536 = '''<RDL><PUSH/><TEXT>The Mollys are tough, but GS&amp;M pays big money for every one I kill. The Mollys have pretty much fought the Vesperan military to a standstill in this system, using guerrilla style hit-and-run tactics, so GS&amp;M hires us to kill ’em off one by one.</TEXT><PARA/><POP/></RDL>'''
1537 = '''<RDL><PUSH/><TEXT>There is a Jump Hole to Larkspur in this system. That’s how all the Molly Gold gets out of Dublin. It is located in the Independent Gold Field. That’s where I lie in wait to ambush Molly Gold runners.</TEXT><PARA/><POP/></RDL>'''
1538 = '''<RDL><PUSH/><TEXT>The Rift Captains will fight anyone; they have no fear. I guess they don’t have much reason to be too afraid of anyone. If you don’t respect them, you are either stupid or dead. They attack all of the Gold transport routes out of the system. Indiscriminate, those Rift Captains are.</TEXT><PARA/><POP/></RDL>'''
1539 = '''<RDL><PUSH/><TEXT>Bowex has hired me to kill Rift Captains in this system. Those trouble makers attack Bowex, IMG, and BMM in the open, and the Mollys near the Jump Hole.</TEXT><PARA/><POP/></RDL>'''
1540 = '''<RDL><PUSH/><TEXT>The mine field surrounding the Molly Gold field has dissuaded the military from sending any of its larger ships into the field. The smaller patrols are pretty hesitant to enter as well, but that doesn’t stop me from going in. I kill Mollys for a living, so that’s where I go.</TEXT><PARA/><POP/></RDL>'''
1541 = '''<RDL><PUSH/><TEXT>I don’t even like stepping foot onto this base because the stench is overpowering. Next time I’m going to bring a breather mask. I run the Gold from this base to Helion. Once I leave this system I have to cross the Independent Worlds, which is always a fight. The criminals always seem to know when I’m passing through, too.</TEXT><PARA/><POP/></RDL>'''
1542 = '''<RDL><PUSH/><TEXT>BMM is GS&amp;M’s parent corporation, and they are putting on the pressure to keep the Gold shipments flowing from Graves. The Mollys are making it tough for BMM to pull a large profit here. The word is that The Crown is tired of stationing one of its expensive capital ships in Dublin on a semi-permanent basis.</TEXT><PARA/><POP/></RDL>'''
1543 = '''<RDL><PUSH/><TEXT>The last thing I want to do when I’m in this system is come up against a Corsair. They raid this system for the Gold they can swipe. I always start sweating as I’m approaching the Jump Gate out of here. If the Rift Captains are gonna hit us, they will hit us there. We got jumped three runs ago. I made it out of the system with one escort, but I was too badly damaged to take the Gold to Helion. I had to stop in Larkspur for repairs.</TEXT><PARA/><POP/></RDL>'''
1544 = '''<RDL><PUSH/><TEXT>The one Commodity that we use too much to trade is Pharmaceuticals. Mining is dangerous work, and this base doesn’t provide the finest of living conditions, if you catch my drift. You can always head to Kensington with a shipment of Gold and come back with Pharmaceuticals.</TEXT><PARA/><POP/></RDL>'''
1545 = '''<RDL><PUSH/><TEXT>All the supplies that keep this base running are shipped from Kensington. It’s a pretty easy run for me, but no one really messes with us around here. If you want to earn some funds, you can always bring us basic supplies: Food, Oxygen, Water, and H-Fuel. We also need Mining Machinery and Consumer Goods brought in for work and play.</TEXT><PARA/><POP/></RDL>'''
1546 = '''<RDL><PUSH/><TEXT>The race track near this base has some of the best gambling you are going to find in Sirius. If you like playing the odds, you can bet on the pilots to see who will win. The odds are usually fifty-fifty, ’cuz usually one of ’em is gonna hit a chunk of rock while flying a rocket engine with a few thousand pounds of fuel aboard.</TEXT><PARA/><POP/></RDL>'''
1547 = '''<RDL><PUSH/><TEXT>The IMG miners make a living in this system selling supplies to the Mollys and mining the Gold in the Independent Gold Field to the east of here. The other two Gold fields belong to the Mollys and GS&amp;M, respectively. If you try to pull Gold from those fields, you are asking to get clipped.</TEXT><PARA/><POP/></RDL>'''
1548 = '''<RDL><PUSH/><TEXT>We are lucky enough to provide the Mollys with their supplies in this system, so they don’t really mess with us IMG. But a word of warning to you: Mollys have no problem with killing. All of them are killers and will not hesitate to bury you if you make yourself a nuisance to them.</TEXT><PARA/><POP/></RDL>'''
1549 = '''<RDL><PUSH/><TEXT>This ship has so many decks and rooms that people can get lost. The worst of the scum in this system come here; some decide to make it their home. Stay on the safe side and don’t wander too far from this area or the Engineering Deck. If you do have to walk through the dark corridors, keep your gun ready and be prepared to use it.</TEXT><PARA/><POP/></RDL>'''
1550 = '''<RDL><PUSH/><TEXT>There’s Cardamine here at the base, if that’s your pleasure, but if you want the best moonshine in all of Sirius, you should swing by the Engineering Deck. Make sure you get your liquor and get out of there, though. You never know when one of those stills are gonna explode.</TEXT><PARA/><POP/></RDL>'''
1551 = '''<RDL><PUSH/><TEXT>I still hope for the day that I hit that big pocket of Gold and strike it rich. I came here ten years ago from Newgate, but this is pretty much the end of the line for work in Vespera. I didn’t want to go back to the Newgate Hotel, so I decided to mine for Gold.</TEXT><PARA/><POP/></RDL>'''
1552 = '''<RDL><PUSH/><TEXT>The </TEXT><TRA italic="true"/><TEXT>Essex</TEXT><TRA italic="false"/><TEXT>  was a Vesperan battleship that chased a squad of Molly guerillas into this field. The Mollys had laid a trap, and just as the ship entered the field, it got hit by a highly explosive mine. Mollys stole aboard, fought their way to the engine room, and set off a chain reaction in the engines, crippling the ship.</TEXT><PARA/><POP/></RDL>'''
1553 = '''<RDL><PUSH/><TEXT>We hold our own Gold field with mines and malice. Ya don’t cross a Molly in Dublin or you’ll be wearing a pick axe for a hat and some fools gold in your pocket.</TEXT><PARA/><POP/></RDL>'''
1554 = '''<RDL><PUSH/><TEXT>It’s my turn to pick up supplies from this base and deliver them to Arranmore. This week I’m picking up the basics plus Consumer Goods and Mining Machinery.</TEXT><PARA/><POP/></RDL>'''
1555 = '''<RDL><PUSH/><TEXT>The Bounty Hunters at this base keep an eye poked in our direction, but they won’t do anything while we are here. They wouldn’t be able to come here any more if they crossed IMG by attacking a Molly at this base. I don’t mind ’em here, but if they cross me out in the fields, I’ll put an end to ’em.</TEXT><PARA/><POP/></RDL>'''
1556 = '''<RDL><PUSH/><TEXT>Sir Edmund Graves used to run this station. He was known as a tyrant who didn’t mind risking his miners’ lives to boost Gold shipments to Larkspur. Until the Founders Day Revolt, that was fine with BMM, GS&amp;M’s parent corporation. That was the day that the Mollys were officially formed. It was also the day that old man Graves got his head taken off, courtesy of the Mollys.</TEXT><PARA/><POP/></RDL>'''
1557 = '''<RDL><PUSH/><TEXT>Sir Edmund’s daughter runs this station now, and she does so pretty well. Most everybody thinks she’s as mean as her old man, but she’s smarter than he was. She realizes it is his fault that the Mollys exist, so she gives the miners just enough to keep them from quitting or joining the Mollys.</TEXT><PARA/><POP/></RDL>'''
1558 = '''<RDL><PUSH/><TEXT>The Vesperan military supports this station to the best of its ability, but the Mollys are fighting very effectively. The military escorts for Gold shipments leaving this station are not enough. The Mollys will attack several locations simultaneously in small groups.</TEXT><PARA/><POP/></RDL>'''
1559 = '''<RDL><PUSH/><TEXT>I fly one of the Gold transports from this base into Larkspur. It is dangerous as hell to do what I do, even with the military escorts. Mollys are always attacking our shipments, and if it isn’t the Mollys, it’s the Rift Captains.</TEXT><PARA/><POP/></RDL>'''
1560 = '''<RDL><PUSH/><TEXT>This base gets all of its basic supplies and Mining Machinery from Thames in Larkspur. It’s not as dangerous of a run as the Gold run into Larkspur, but it is still pretty bad. The Mollys will attack us to disrupt operations at our base. If you want to make the run, you might attract less attention. Then again, maybe not.</TEXT><PARA/><POP/></RDL>'''
1561 = '''<RDL><PUSH/><TEXT>With the military’s help BMM controls the most lucrative Gold field in the system. It still isn’t safe. The Mollys have no fear and fight as viciously as anyone possibly can, maybe with the exception of the Rift Captains.</TEXT><PARA/><POP/></RDL>'''
1562 = '''<RDL><PUSH/><TEXT>After the Founders Day Revolt the Vesperan government sent several destroyers to quell the uprising. The miners had captured two mining ships: the </TEXT><TRA italic="true"/><TEXT>Endeavor</TEXT><TRA italic="false"/><TEXT>  and </TEXT><TRA italic="true"/><TEXT>Glorious</TEXT><TRA italic="false"/><TEXT>, and the destroyers immediately opened fire on them. The </TEXT><TRA italic="true"/><TEXT>Endeavor</TEXT><TRA italic="false"/><TEXT>  got hit in the reactor core and went up with all hands; the </TEXT><TRA italic="true"/><TEXT>Glorious</TEXT><TRA italic="false"/><TEXT>  fled to an asteroid field to escape. The destroyers pursued </TEXT><TRA italic="true"/><TEXT>Glorious</TEXT><TRA italic="false"/><TEXT>  into the field and right through a trap that the insurgents had set. One destroyer, the </TEXT><TRA italic="true"/><TEXT>Longfield</TEXT><TRA italic="false"/><TEXT>, was blown in half; three other destroyers suffered terrible damage and heavy casualties.</TEXT><PARA/><POP/></RDL>'''
1563 = '''<RDL><PUSH/><TEXT>The first battleship that entered the system was the </TEXT><TRA italic="true"/><TEXT>Hood</TEXT><TRA italic="false"/><TEXT>, which restored order after GS&amp;M miners revolted on Founders Day. The miners had revolted in reaction to their atrocious working conditions, but the arrival of the battleship was the last straw. They declared their independence from the Vesperan government and became separatists.</TEXT><PARA/><POP/></RDL>'''
1564 = '''<RDL><PUSH/><TEXT>The Molly guerilla warfare tactics are too tenacious for the military. Though they haven’t had any significant victories, the Mollys are still here and make themselves quite the scenescript in BMM’s side. They are financed by the Gold they mine from their own asteroid field, which is surrounded by a very dangerous minefield.</TEXT><PARA/><POP/></RDL>'''
1565 = '''<RDL><PUSH/><TEXT>I escort the BMM Gold shipments that leave the system and the supply shipments that return. My role is to protect the goods at all costs. We have two wings flying the escort missions: one to defend against attack and one to pursue the attackers after they are repulsed.</TEXT><PARA/><POP/></RDL>'''
1566 = '''<RDL><PUSH/><TEXT>The captain of this battleship does not underestimate the cunning and ability of the Mollys in this system. This is not true of the former captain of the battleship </TEXT><TRA italic="true"/><TEXT>Hood</TEXT><TRA italic="false"/><TEXT>, which is now a nest of criminals, vagrant miners, and other similar filth. The </TEXT><TRA italic="true"/><TEXT>Hood</TEXT><TRA italic="false"/><TEXT>  was decommissioned after being badly damaged in a Molly trap.</TEXT><PARA/><POP/></RDL>'''
1567 = '''<RDL><PUSH/><TEXT>The most embarrassing epoch in Vesperan military history was the time right after the Founders Day Revolt. The destroyers made the first mistake by following the Mollys into an asteroid field. Even worse was when the </TEXT><TRA italic="true"/><TEXT>Hood</TEXT><TRA italic="false"/><TEXT>  made the same mistake and got too badly crippled to make it back home to Larkspur. It was decommissioned and stripped of all weaponry, engines, supplies, and materials.</TEXT><PARA/><POP/></RDL>'''
1568 = '''<RDL><PUSH/><TEXT>The separatists in this system are only part of the problem; the Rift Captains also pose quite a threat to the Gold mined here. Aside from Rift Captains and the Mollys, there are all kinds of criminals in this lawless system and that is why we run patrols by the Hood. All the criminals in this system get their supplies here.</TEXT><PARA/><POP/></RDL>'''
1569 = '''<RDL><PUSH/><TEXT>I don’t understand why there are Bounty Hunters in this system. If the military can’t curb the crime in this sector, then there is not much that common rabble will be able to do about it, either. I think that if the Gold shipments from Graves keep decreasing, Lady Edmund and BMM will be replaced with someone who can do the job.</TEXT><PARA/><POP/></RDL>'''
1570 = '''<RDL><PUSH/><TEXT>The Mollys are smart about their attacks. They attack in several different parts of the system simultaneously so we have to split our forces. The trouble comes from not knowing which attacks have the greatest number of ships. When they attack they do as much damage as they can, and then they split up and get out, making the chase very difficult.</TEXT><PARA/><POP/></RDL>'''
1571 = '''<RDL><PUSH/><TEXT>The Charter Guild maintains a presence on this ship because we have been hired to assist the military in curbing pirate activity in this system. We go places that the military might not, and the tactics we employ might not necessarily be allowed by military code.</TEXT><PARA/><POP/></RDL>'''
1572 = '''<RDL><PUSH/><TEXT>The dragnet that the military creates to stop pirated or illegally mined Gold from leaving the system is not as effective as they would have you believe, or else how would the Mollys continue to fund themselves? They are getting their Gold out of the system and into Larkspur through a Jump Hole.</TEXT><PARA/><POP/></RDL>'''
1573 = '''<RDL><PUSH/><TEXT>Whenever the Mollys make an attack, the corporations that pay my Paste ticket expect me to bring back some heads. I have to go searching for the Mollys in their own territory — the asteroid fields. This is where the Mollys are most dangerous. Remember, they are miners, so they know the asteroids better than anyone else.</TEXT><PARA/><POP/></RDL>'''
1574 = '''<RDL><PUSH/><TEXT>The Rift Captains are one of the fiercest criminal groups in Sirius space, rivaled only by the Cinder Guard in Dornmark and the Ashbound of the Northern Edge Worlds. The Rift Captains are usually found in the Southern Edge Worlds and Dornmark.</TEXT><PARA/><POP/></RDL>'''
1575 = '''<RDL><PUSH/><TEXT>A Molly’s natural environment is an asteroid field, so that is where you have to look for them. They use all the asteroid fields in this system for cover, except the GS&amp;M field. That’s not to say they don’t go into that field, too, but they aren’t looking for cover there.</TEXT><PARA/><POP/></RDL>'''
1576 = '''<RDL><PUSH/><TEXT>The Jump Hole to Larkspur is in the south side of the Independent Gold Field just to the north of this ship. That is also the main entry point for the Rift Captains who come raiding for Gold. The Rift Captains will attack corporate and separatist shipments alike; they don’t care who they piss off.</TEXT><PARA/><POP/></RDL>'''
1577 = '''<RDL><PUSH/><TEXT>The basic supplies that come to this base from Larkspur are under constant attack from Mollys and other undesirables. I know this because I run the shipment every once in a while. This station also needs Side Arms and Pharmaceuticals shipped from Larkspur.</TEXT><PARA/><POP/></RDL>'''
1578 = '''<RDL><PUSH/><TEXT>The Bounty Hunters you see at this base are here because Bowex wants them here. The bottom line is that they help reduce the attacks on our shipping convoys, which means we lose less money to pirates. They are a scruffy lot and the truth is I don’t like them very much, but I am glad they are here.</TEXT><PARA/><POP/></RDL>'''
1579 = '''<RDL><PUSH/><TEXT>The Toxic Waste that this ship’s engines produce is hauled off to LD-14 for disposal or reprocessing. It can be dangerous because Toxic Waste is often highly volatile, so a stray shot into your hold could blow your ship in half. Once you get to Leeds with the Toxic Waste, you can pick up MOX that is produced there and bring it back.</TEXT><PARA/><POP/></RDL>'''
1580 = '''<RDL><PUSH/><TEXT>Why d’ya think the police don’t come into the system? We’ll skin ’em is why. They don’t have the stomach for the type of fightin’ that goes on here. Ever since we were founded it’s been us against the military, and we ain’t exactly losin’.</TEXT><PARA/><POP/></RDL>'''
1581 = '''<RDL><PUSH/><TEXT>The Mollys were established right after the Founders Day Revolt. All we were trying to do was let the government know how bad we were being treated by BMM. The government didn’t care. We weren’t worth anything in their eyes, just like the BMM executives. We knew that Vespera wasn’t our home, and if we ever wanted to have a home we would have to carve it from Vesperan space.</TEXT><PARA/><POP/></RDL>'''
1582 = '''<RDL><PUSH/><TEXT>You can process tiny amounts of weapons-grade Plutonium from MOX. We steal the MOX as it gets shipped from BMM’s LD-14 base in Leeds. Soon we’ll have enough MOX to detonate a bomb in the skies over Larkspur. Maybe then they’ll leave Dublin to us.</TEXT><PARA/><POP/></RDL>'''
1583 = '''<RDL><PUSH/><TEXT>The Mollys hate BMM. They were the ones who worked us to the bone. The life expectancy for a miner before the revolt was less than six years. If you’re gonna have a life expectancy for a job, you might as well be a soldier.</TEXT><PARA/><POP/></RDL>'''
1584 = '''<RDL><PUSH/><TEXT>Well, we lobbed old man Graves’s head off in the Founders Day Revolt, but now his daughter runs GS&amp;M. She is just as bad as he ever was, but she is more dangerous because she is smarter. One day I will see her dead. Our attacks at their base are getting closer and closer to blowing the whole station.</TEXT><PARA/><POP/></RDL>'''
1585 = '''<RDL><PUSH/><TEXT>One of our lads got captured last week by Vesperan military in Leeds during a MOX raid. He’s one of our best — Roger Patience’s his name. He’s on a prison convoy on its way to Newgate Prison. We’re gonna crack him out in Manchester as the ships break from the Trade Lanes.</TEXT><PARA/><POP/></RDL>'''
1586 = '''<RDL><PUSH/><TEXT>The Hood supplies us with our basic Commodities. We also get Mining Machinery and Consumer Goods from the folks at that filth-infested base.</TEXT><PARA/><POP/></RDL>'''
1587 = '''<RDL><PUSH/><TEXT>We send our people through the Jump Hole to Larkspur to deal with the Junkers at Trafalgar to get the basic supplies that keep Arranmore running. They bring back Side Arms and Engine Components from Trafalgar. Junkers are always willing to trade those goods for the Gold that we’ve mined here.</TEXT><PARA/><POP/></RDL>'''
1588 = '''<RDL><PUSH/><TEXT>Any MOX you can get your hands on will be much appreciated by us here. What we do with it is none of your business. And you aren’t gonna mention who you sold it to if you ever get pinched. If ya do — well, we have boys in Newgate, too.</TEXT><PARA/><POP/></RDL>'''
1589 = '''<RDL><PUSH/><TEXT>I love this place — nice scenery, gambling to your heart’s content, Food like I’ve never tasted before. They let you eat all you want — go figure. This is nothing like my days growing up in Leeds. Joining the Guild was definitely a good thing for me.</TEXT><PARA/><POP/></RDL>'''
1590 = '''<RDL><PUSH/><TEXT>I just made a run into the Arran Ice Cloud. That’s Outcast country out there. They make their Cardamine runs into Vespera through a Jump Hole somewhere in there. They don’t mess around, so you’d better be prepared.</TEXT><PARA/><POP/></RDL>'''
1591 = '''<RDL><PUSH/><TEXT>I came out here to hunt for Ashbound and Gaians, but there’s more reliable business taking out tourists on trips to the clouds, or down to Gaia. I specialize in a little area of jungle in Pangaea known for its ferocious monster reptiles.</TEXT><PARA/><POP/></RDL>'''
1592 = '''<RDL><PUSH/><TEXT>We run a regular assault patrol into the Islay Cloud. The Gaians usually oblige us with at least one skirmish. What we’re really hoping to find is an Outcast smuggler. That pays for more than a few nights in the </TEXT><TRA italic="true"/><TEXT>Shetland</TEXT><TRA italic="false"/><TEXT>  Casino.</TEXT><PARA/><POP/></RDL>'''
1593 = '''<RDL><PUSH/><TEXT>Orbital does a patrol run across the edge of the Islay Cloud to keep the Gaians in check. We know their base is in there somewhere, but that is a police and Bounty Hunter affair, not our problem.</TEXT><PARA/><POP/></RDL>'''
1594 = '''<RDL><PUSH/><TEXT>The Ashbound have been attacking some of our runs. For this reason we invited the Bounty Hunters to use our ship as a forward base. They are not exactly the kind of guests we like to have on the </TEXT><TRA italic="true"/><TEXT>Shetland</TEXT><TRA italic="false"/><TEXT>, but sometimes one has few choices.</TEXT><PARA/><POP/></RDL>'''
1595 = '''<RDL><PUSH/><TEXT>The </TEXT><TRA italic="true"/><TEXT>Shetland</TEXT><TRA italic="false"/><TEXT>  offers discriminating travelers everything they could desire: luxurious buffets with delicacies such as lettuce, apples, and roast hindcow; lavish boutiques stocked with all of the latest Whiteharbor fashions; and wild, exotic animals.</TEXT><PARA/><POP/></RDL>'''
1596 = '''<RDL><PUSH/><TEXT>Frankly, most people come for the gambling and feasting. The younger set opts for the planetside excursions. Most of the retirees just sit here and gorge themselves. Many are New Londoners, but we get a few of the Leedites, as we call them. They want one big trip before they die of whatever affliction Leeds gave them after living 40 years in that nightmare.</TEXT><PARA/><POP/></RDL>'''
1600 = '''<RDL><PUSH/><TEXT>The inmates aboard this ship are considered so dangerous that all guards have the right to shoot and kill any prisoner at any time. That may seem somewhat brutal, but it is necessary to maintain order among so many violent felons.</TEXT><PARA/><POP/></RDL>'''
1601 = '''<RDL><PUSH/><TEXT>The prisoners do not cross Mollys aboard this ship, especially the Mollys that carry the Maguire spike. That weapon is a filed down metal splinter. When we found one on an inmate last week, the guard shot him on the spot.</TEXT><PARA/><POP/></RDL>'''
1602 = '''<RDL><PUSH/><TEXT>Mollys don’t attack this base as much as they used to now that we have installed weapon platforms and a minefield along the Newgate’s perimeter. The current problem is that they try to rescue their captured comrades by attacking the convoys headed into the base.</TEXT><PARA/><POP/></RDL>'''
1603 = '''<RDL><PUSH/><TEXT>Aye, the Mollys aboard this ship are a mean lot, but the main problem is the free ones who keep trying to liberate their fellows. The worst attempt I can remember was about two years ago when one of the attackers’ missiles penetrated the hull and a whole cell block underwent explosive decompression. Everyone in there died, including guards and prisoners.</TEXT><PARA/><POP/></RDL>'''
1604 = '''<RDL><PUSH/><TEXT>Ever hear of Willy “The Snake” Logan? He’s the prisoner some say escaped off this hulk. Me, I don’t buy it. I say his corpse is out floating around somewhere in the vac-suit he fashioned.</TEXT><PARA/><POP/></RDL>'''
1605 = '''<RDL><PUSH/><TEXT>The guards who work this prison are the best in Vespera. Most of them are incorruptible, though there are always bad apples. One crooked guard is now serving time here for delivering George Good’s orders. He’s the leader of one of the Larkspur crime syndicates.</TEXT><PARA/><POP/></RDL>'''
1606 = '''<RDL><PUSH/><TEXT>We try to keep the Mollys separated on this ship. Anytime you have more than two of them together, trouble is just around the corner. We learned this only after three of them killed two guards, stole their weapons, and tried to fight their way to the bridge.</TEXT><PARA/><POP/></RDL>'''
1607 = '''<RDL><PUSH/><TEXT>Some of the guards here used to know Willy Logan. He was an escape artist who some people say busted out of the Newgate. Maybe he did. His cell mate says that the vac-suit he made looked pretty good. The closest base sure is a long way to go using a stolen fire extinguisher as propulsion.</TEXT><PARA/><POP/></RDL>'''
1608 = '''<RDL><PUSH/><TEXT>There are three Commodities consumed at this base that we do not produce ourselves: Mining Machinery, H-Fuel, and Food. We ship here from Thames.</TEXT><PARA/><POP/></RDL>'''
1609 = '''<RDL><PUSH/><TEXT>Hydrocarbons and Polymers are the two Commodities that I ship to Stokes from this facility. I’ll tell you, I do not enjoy going into Leeds. That place is a cesspool.</TEXT><PARA/><POP/></RDL>'''
1610 = '''<RDL><PUSH/><TEXT>The Ashbound must be rich from the Cardamine trade. I don’t understand why they would risk their lives attacking convoys of basic supplies and other low-priced Commodities. They either hate everyone, or they just enjoy fighting.</TEXT><PARA/><POP/></RDL>'''
1611 = '''<RDL><PUSH/><TEXT>If you are a BMM grunt, then this is the place to be. Don’t get me wrong. The workers here spend long hours on unsavory tasks, but at least here there isn’t a short life expectancy.</TEXT><PARA/><POP/></RDL>'''
1612 = '''<RDL><PUSH/><TEXT>The Bounty Hunters here are filthy chaps who curse and drink too much, but it makes us pilots feel a bit safer to know that they are nearby. More than once my ship’s hull has been close to imploding from pirate attacks, when one of these boys swooped in to help.</TEXT><PARA/><POP/></RDL>'''
1613 = '''<RDL><PUSH/><TEXT>The nearby ice asteroid field is the source for most of this plant’s raw materials. Sometimes huge chunks of ice from the fields drift into the Trade Lanes. If a ship moving at Lane speed plows through a sizeable enough piece of ice… well, you can imagine what happens.</TEXT><PARA/><POP/></RDL>'''
1614 = '''<RDL><PUSH/><TEXT>It makes me nervous working and living in the same system as the most infamous prison in Vespera. I know that it’s supposed to be impossible to escape from Newgate, but the idea of all those murderers right here in this system just gives me the chills.</TEXT><PARA/><POP/></RDL>'''
1615 = '''<RDL><PUSH/><TEXT>I’m glad I’m not stationed in Leeds anymore. My family has suffered enough from the five years I worked there. It is the filthiest system in all of Vespera, in all of Sirius. It is also incredibly dangerous. I still fly shipments there, so I get to see the danger first-hand.</TEXT><PARA/><POP/></RDL>'''
1616 = '''<RDL><PUSH/><TEXT>Mollys attack this base quite frequently. They hate all BMM employees and try to destroy every base or ship that has the name BMM painted into it. A shame Sir Edmund had to treat his workers so deplorably that they would revolt and become the Mollys.</TEXT><PARA/><POP/></RDL>'''
1617 = '''<RDL><PUSH/><TEXT>Gaians used to be the easiest kill in the book, and they still are pretty much, but they’re getting better at fighting and coordinating attacks. Some of them are rather good pilots now. I still kill them.</TEXT><PARA/><POP/></RDL>'''
1621 = '''<RDL><PUSH/><TEXT>The Hydrocarbons that we produce at this base are taken directly to Honshu. If you are willing to cross through these Border Worlds and all of Orsena space, you could deliver them.</TEXT><PARA/><POP/></RDL>'''
1622 = '''<RDL><PUSH/><TEXT>My good friend was killed recently on his last trip to Freeport 6. We are getting a new pilot to ship Polymers to Freeport 6 and return to the Nago with Mining Machinery and basic supplies.</TEXT><PARA/><POP/></RDL>'''
1623 = '''<RDL><PUSH/><TEXT>The Polymers we produce here and ship to our factories in Orsena space will be processed into Optical Chips. This eliminates any dependencies on Samura, which is most important to our company.</TEXT><PARA/><POP/></RDL>'''
1624 = '''<RDL><PUSH/><TEXT>Shinagawa is in the heart of Orsena. It is a pleasure to leave these worlds behind for my ancestral home. I get the opportunity when I deliver Polymers to Shinagawa from this base.</TEXT><PARA/><POP/></RDL>'''
1625 = '''<RDL><PUSH/><TEXT>Though the Samura base is closer to the Outcast Cardamine route, we have our own share of problems with the outsiders. They need the Polymers we produce at this base for their own construction and manufacturing concerns. At least this was the information given to us by the Orsena military consultants we hired.</TEXT><PARA/><POP/></RDL>'''
1626 = '''<RDL><PUSH/><TEXT>Our miners once found a half destroyed Outcast ship. The cockpit was still intact, so they brought the pilot’s body back to our base. Some of our scientists ran an autopsy and discovered that they differ from regular human beings on a genetic level. Their cell reproduction requires Cardamine to build RNA.</TEXT><PARA/><POP/></RDL>'''
1627 = '''<RDL><PUSH/><TEXT>My convoy was returning to this base from Sablecross when we were attacked by Ashbound. Kishiro always loses ships and men on the Nago-Sablecross Polymer run.</TEXT><PARA/><POP/></RDL>'''
1628 = '''<RDL><PUSH/><TEXT>I can’t wait to cycle back to Sablecross. Maybe the space born don’t mind the dank recycled oxygen aboard bases, but I get sick of it. I cannot wait to see the sun without looking through three inches of gold-coated clear plate.</TEXT><PARA/><POP/></RDL>'''
1629 = '''<RDL><PUSH/><TEXT>The Bounty Hunters at Freeport 6 are often contracted by Kishiro to protect our base and hunt down particularly troublesome Ashbound. It is helpful that the Hunters are at the Zoner base, so we are not forced to house any of the Gaijin that we hire.</TEXT><PARA/><POP/></RDL>'''
1630 = '''<RDL><PUSH/><TEXT>This station uses the gases it mines in this field to produce Fertilizers and Terraforming Gases, which are then shipped to Freeport 6. At the Zoner base we purchase supplies and Mining Machinery for the return. It is a dangerous run, but our very existence here is a risky affair.</TEXT><PARA/><POP/></RDL>'''
1631 = '''<RDL><PUSH/><TEXT>I get an opportunity to see my family in Kyushu when I fly Fertilizer there from this base. In Kyushu I pick up the basic supplies that I can’t get at Freeport 6. Every time I leave Kyushu I worry that I may never see my children’s faces again.</TEXT><PARA/><POP/></RDL>'''
1632 = '''<RDL><PUSH/><TEXT>I’m sure Samura didn’t know that they had built this base so close to the Outcast’s Cardamine route. The mask breather attacks on this base must cost Samura a fortune in repairs and replacement personnel. I fear that my luck will eventually run out, for workers die everyday here.</TEXT><PARA/><POP/></RDL>'''
1633 = '''<RDL><PUSH/><TEXT>I signed up for a dangerous assignment when I began working for Samura. It is the only way to get promoted quickly in my company, and I am an excellent pilot. They gave me the Fertilizer run between this base and Larkspur.</TEXT><PARA/><POP/></RDL>'''
1634 = '''<RDL><PUSH/><TEXT>My brother is an accountant and cost estimator for our corporation. He told me that Samura was well aware of the danger associated with this system, and this field in particular because of its proximity to Outcast operations. The profits gained outnumber the expenses; human life is cheap on a balance sheet.</TEXT><PARA/><POP/></RDL>'''
1635 = '''<RDL><PUSH/><TEXT>There are freelance pilots who can make life difficult for Kishiro in this system. Samura makes sure that they remain employed as much as possible. If we could wrest control of this system from our chief competitor, the only issue would be the Ashbound.</TEXT><PARA/><POP/></RDL>'''
1636 = '''<RDL><PUSH/><TEXT>The useful thing about using Bounty Hunters is that they are free if they fail, and effective when they succeed. There is no need to pay a dead Bounty Hunter. A great many of the Bounty Hunters you find at Freeport 6 are Samura contracted.</TEXT><PARA/><POP/></RDL>'''
1637 = '''<RDL><PUSH/><TEXT>This system is more an extension of Orsena space than a Border World. It is unfortunate that the Orsena military does not venture farther into this system to offer protection to this base. I’m sure our contacts in Sablecross will soon correct that oversight.</TEXT><PARA/><POP/></RDL>'''
1638 = '''<RDL><PUSH/><TEXT>Tau-29 was discovered in 300 AS by a Orsena research expedition. They encountered large fields of Hydrocarbon chunks, frozen Methane, and Oxygen ice. The system’s abundance was staggering, yet these resources could not be fully exploited until the addition of Jump Gates.</TEXT><PARA/><POP/></RDL>'''
1639 = '''<RDL><PUSH/><TEXT>I’ve been tracking an Outcast named Santiago Llorens in this system for several days. I followed him back from Vespera. Once I bag the scum I won’t have to take another job for months. This guy has killed over a hundred men and stolen goods worth hundreds of thousands of credits.</TEXT><PARA/><POP/></RDL>'''
1640 = '''<RDL><PUSH/><TEXT>The Ashbound attack both Trade Lanes that cross this system. I run my patrols up from the Tau-31 Jump Hole to the Northern Oxygen Field, and then I head southeast into the Nago field and back down to Freeport 6. Along that route I usually encounter a good share of the mask breathers.</TEXT><PARA/><POP/></RDL>'''
1641 = '''<RDL><PUSH/><TEXT>This is the place to be if you are hunting Ashbound. There is a Jump Hole to the north side of this system’s oxygen field that leads to Tau-23. In Tau-23 you had better be sneaky, or have a posse with you, because the Ashbound are very strong there — whole squadrons of them.</TEXT><PARA/><POP/></RDL>'''
1642 = '''<RDL><PUSH/><TEXT>This base is where I refit and resupply. It is a long and dangerous trip here. I’ve been hunting an Outcast by the name of Santiago Llorens. He torched my partner and good friend back in Cortez. There’s another Bounty Hunter here trying to catch him too, but I’m going to get to Santiago first.</TEXT><PARA/><POP/></RDL>'''
1643 = '''<RDL><PUSH/><TEXT>After I’m done refueling my ship here, I’m going to go all the way up into Outcast space. I’ve been sneaking farther and farther into their territory every trip I make up here looking for a good ambush point. I think I found the spot I was looking for on my last run. If this plan works, I will be able to retire to California in less than a year.</TEXT><PARA/><POP/></RDL>'''
1644 = '''<RDL><PUSH/><TEXT>All the Cardamine that leaves Outcast space comes through here. Cryer Pharmaceuticals has hired me to try and capture a live Outcast with all his gear, including his mask and his Cardamine shipment. I don’t usually bring guys back alive, so I’m charging them double.</TEXT><PARA/><POP/></RDL>'''
1645 = '''<RDL><PUSH/><TEXT>Bowex ships Mining and Construction Machinery to this base from Leeds. These components build many of the installations you’ll find in the Border Worlds. Many of these shipments are harassed by Outcast pirates.</TEXT><PARA/><POP/></RDL>'''
1646 = '''<RDL><PUSH/><TEXT>Ships that are constructed in this part of Sirius no doubt benefit from the Basic Alloys and Ship Hull Panels that we bring here from Stokes. I suppose one could say that Border World vessels are more Vesperan than anything else.</TEXT><PARA/><POP/></RDL>'''
1647 = '''<RDL><PUSH/><TEXT>If you’d like to fly into Vespera, I’m sure you could make money hauling Fertilizers and Alien Organisms from this base to Glasgow. I make that run myself for Bowex and it is pretty lucrative, even though I’m a company man. Of course you have to fight all kinds of criminals to get there.</TEXT><PARA/><POP/></RDL>'''
1648 = '''<RDL><PUSH/><TEXT>The IMG has gone deep into the fringe areas of Sirius space looking for valuable minerals. The most dangerous post you can man for the IMG is Falkland; it’s hidden among the asteroids of Tau-37. The Ashbound do not yet know of its location.</TEXT><PARA/><POP/></RDL>'''
1649 = '''<RDL><PUSH/><TEXT>The Niobium deposits found in the two systems north of this one are incredible. The best IMG pilots ship Niobium into this base from Java and Falkland. From here they pick up any basic supplies they might need and head back.</TEXT><PARA/><POP/></RDL>'''
1650 = '''<RDL><PUSH/><TEXT>This system was the reason that IC became an insurer and not a lender. It was the loans that Dornmark and Orsena took from IC to finance these Border World Jump Gates and Trade Lanes that bankrupted the two houses. They defaulted on their loans to IC and embargoed Helion to make their point. IC had to swallow the loss.</TEXT><PARA/><POP/></RDL>'''
1651 = '''<RDL><PUSH/><TEXT>Kishiro hauls Mining Machinery and supplies to Nago. It’s not much of in the way of money, though. If that’s what you’re interested in, pick up a load of Polymers there to haul to Shinagawa, which would be more lucrative.</TEXT><PARA/><POP/></RDL>'''
1652 = '''<RDL><PUSH/><TEXT>If you enjoy danger, might I suggest you run Niobium from this base to Whiteharbor? It is an excellent opportunity to encounter adventure and monetary reward. I used to make the run for Kishiro myself.</TEXT><PARA/><POP/></RDL>'''
1653 = '''<RDL><PUSH/><TEXT>Would you like to visit Orsena space sometime and get out of these dangerous Border Worlds? Sablecross receives Kishiro shipments of Niobium from this base. You could fly there yourself with a full hold.</TEXT><PARA/><POP/></RDL>'''
1654 = '''<RDL><PUSH/><TEXT>The Alien Organisms we ship to Harris from this base are incredibly helpful to the terraforming process. The transformation of the planet from dead and sterile to arable is sped up by many centuries with their addition.</TEXT><PARA/><POP/></RDL>'''
1655 = '''<RDL><PUSH/><TEXT>Those miserable Gaians do not realize how badly they are hurting the people of Vespera. They have slowed down our operations immeasurably in Tau-31. The Gaian spin doctors of Green Front won’t be able to save them from the mob when the citizens realize what the Gaians have cost them.</TEXT><PARA/><POP/></RDL>'''
1656 = '''<RDL><PUSH/><TEXT>The terraforming job at Harris is almost complete. Won’t it be wonderful when Vespera has another planet to grow Food on? Planetform, Inc. has only the best in mind for the people of Vespera and all of Sirius.</TEXT><PARA/><POP/></RDL>'''
1657 = '''<RDL><PUSH/><TEXT>Samura brings Fertilizers and Terraforming Gases to Freeport 6 from Shinkaku. Once we have sold those Commodities, we shuttle basic supplies and Mining Machinery back to our base. As long as we miss any Ashbound on the way here or back, the trip is usually pretty uneventful.</TEXT><PARA/><POP/></RDL>'''
1658 = '''<RDL><PUSH/><TEXT>The Niobium we get at this base is first shipped to Pueblo and then farther to Whiteharbor to be used in the Luxury Consumer Goods market. These shipping runs are extremely profitable. You may be interested in trying them. Be wary — where there is profit, there is risk.</TEXT><PARA/><POP/></RDL>'''
1659 = '''<RDL><PUSH/><TEXT>The demand for Niobium in Kyushu is high. You may be a foreigner, but I’m sure the merchants there will accept your Niobium anyway. You can return from Kyushu with basic supplies to sell here, if you feel that it is worth it to you.</TEXT><PARA/><POP/></RDL>'''
1660 = '''<RDL><PUSH/><TEXT>I make a run to Freeport 10 in Tau-37 every so often. I take Construction Machinery, Hull Panels, and Polymers up there. I suppose you could do the same. That is, if the Ashbound will let you that far north.</TEXT><PARA/><POP/></RDL>'''
1661 = '''<RDL><PUSH/><TEXT>There is a demand for Fertilizers and Terraforming Gases in Freeport 10. You could supply our base with these if you think you could make it up there. Not everyone has the friends or skills to make this run.</TEXT><PARA/><POP/></RDL>'''
1662 = '''<RDL><PUSH/><TEXT>Bases are always going to need basic supplies if they don’t produce them there. They are lower-end commodities but can still earn you some money. Freeport 10 doesn’t produce everything it needs.</TEXT><PARA/><POP/></RDL>'''
1663 = '''<RDL><PUSH/><TEXT>Getting to Tau-23 from this system means that you have to take a Jump Hole. There are no Jump Gates that lead to that system from here. Head to the Oxygen field in the north end of this system, and you will find the Hole there.</TEXT><PARA/><POP/></RDL>'''
1664 = '''<RDL><PUSH/><TEXT>The farther north you go in Sirius, the closer you get to the Ashbound’ home systems. They don’t tolerate many intruders, and we only operate this base in relative safety because we provide them with something. If you have nothing to offer them, they will kill you — no question.</TEXT><PARA/><POP/></RDL>'''
1665 = '''<RDL><PUSH/><TEXT>This system is a crossroads between Orsena, Vespera, and the Outcast Edge Worlds. All kinds of criminals and company pass through, and we accept them all. Zoners do not care what your allegiance is; as long as you respect our ways, we will respect yours.</TEXT><PARA/><POP/></RDL>'''
1666 = '''<RDL><PUSH/><TEXT>Zoners basically want to get along with everybody. We try to produce Commodities at our bases that others will need; that way we can go where the governments aren’t. We survive by trading with other independently minded factions.</TEXT><PARA/><POP/></RDL>'''
1667 = '''<RDL><PUSH/><TEXT>The Bounty Hunters at this base are being paid by Samura and Kishiro, mostly in an effort to curb Outcast piracy. So far they are meeting with limited success. Other Bounty Hunters have been hired by Vesperan or Libertonian firms, and they have come up here tracking Ashbound back from House space.</TEXT><PARA/><POP/></RDL>'''
1668 = '''<RDL><PUSH/><TEXT>I’d say that of all the bases in this system, Samura’s base has to struggle the hardest to survive. Their base is too close to the Cardamine trade route, which makes Shinkaku the subject of Outcast aggression. Their rivals don’t make it easy for them either; Kishiro hires pilots to harass their operations.</TEXT><PARA/><POP/></RDL>'''
1678 = '''<RDL><PUSH/><TEXT>The Kurile Alien Organisms are shipped to our station in this system. They are an important part of our research, and we can always use more. We also purchase basic supplies from this base to use at our facility.</TEXT><PARA/><POP/></RDL>'''
1679 = '''<RDL><PUSH/><TEXT>The Ashbound frequently attack our base. It makes me angry that these people live here in relative peace, barring the occasional Corsair attack. I hate these simpletons here. There is something strange about them that I can’t put my finger on.</TEXT><PARA/><POP/></RDL>'''
1680 = '''<RDL><PUSH/><TEXT>There is a connection between the Cardamine and the Alien Organisms used for fish farming and terraforming. If Cryer could figure out the link, then we could come closer to synthesizing our own Cardamine. So far we haven’t had any luck, but Cryer is patient and persistent.</TEXT><PARA/><POP/></RDL>'''
1681 = '''<RDL><PUSH/><TEXT>The facility here on Kurile supplies Junyo with the Alien Organisms it needs to feed fish in its farms. The flight is not an easy one. But if you were to haul a load, I’m sure it would be worth your while.</TEXT><PARA/><POP/></RDL>'''
1682 = '''<RDL><PUSH/><TEXT>The only way that Samura could compete with Synth Foods was to find a way to boost the amount of fish that our fish farms could produce. Alien Organisms were the answer. They are in demand at our facility in Junyo.</TEXT><PARA/><POP/></RDL>'''
1683 = '''<RDL><PUSH/><TEXT>If you have any interest in going to Cinderwell, you could purchase the Alien Organisms we cultivate here and ship them to Newark. Helion uses them for terraforming and research purposes.</TEXT><PARA/><POP/></RDL>'''
1684 = '''<RDL><PUSH/><TEXT>The workers at this base want to be here. It is isolated, so we are left to our very simple way of life without much interruption. There is much peace in a simple life — a peace that I could not find in Sablecross or anywhere else.</TEXT><PARA/><POP/></RDL>'''
1685 = '''<RDL><PUSH/><TEXT>The average lifespan of the fish workers here in Kurile is higher than anywhere else in all of house space, perhaps even Sirius. The only other place that has an average lifespan this long is Junyo, although I’ve heard that Ashbound are known for their longevity. Interesting…</TEXT><PARA/><POP/></RDL>'''
1686 = '''<RDL><PUSH/><TEXT>Our shipments to and from this base often fall victim to Corsair attacks. This system is right along their Artifact route, or so I’ve heard. It is unfortunate because we wish them no harm here. We are simple farmers.</TEXT><PARA/><POP/></RDL>'''
1687 = '''<RDL><PUSH/><TEXT>Though we are Samura employees, this place is so isolated from the main body of Samura that we do not feel like we are connected. The farmers here are not company soldiers but family men. Harvesting the Organisms here is something that my family has been doing for generations.</TEXT><PARA/><POP/></RDL>'''
1688 = '''<RDL><PUSH/><TEXT>Samura has sent scientists to this base to study our Alien Organisms more closely. Concern has been raised about the fact that we are indirectly eating them, because the fish absorb some of the more unusual alien compounds into their flesh.</TEXT><PARA/><POP/></RDL>'''
1689 = '''<RDL><PUSH/><TEXT>My son has been eating the fish raised in Junyo all his life. We get excellent prices since we provide them with their Alien Organisms. When he went to Sablecross he became very ill, but once he returned, he recovered very quickly.</TEXT><PARA/><POP/></RDL>'''
1690 = '''<RDL><PUSH/><TEXT>Sometimes the Ashbound and Rift Captains will run into each other. When that happens you better watch out because it is going to get bloody. It’s impressive to watch two skilled opponents fight each other to the death. It occurs occasionally in this system — more often in Sigma-19.</TEXT><PARA/><POP/></RDL>'''
1691 = '''<RDL><PUSH/><TEXT>I was able to capture an Outcast in Omicron Beta a few months ago. First, I disabled his ship and hit it with a pulse beam to knock out the people inside. It’s an old Bounty Hunter weapon that’s available to Guild members only. Once he was unconscious I suited up and went space walking. That was it.</TEXT><PARA/><POP/></RDL>'''
1692 = '''<RDL><PUSH/><TEXT>This system separates northern Sirius from southern Sirius in the eastern Border Worlds. If you want to go south, you can hit the Omicron Theta Jump Hole in the Kunashir Cloud. If you travel west from the base you will come across another Jump Hole to Sigma-13.</TEXT><PARA/><POP/></RDL>'''
1693 = '''<RDL><PUSH/><TEXT>Cryer established this base here in Sigma-17 because of its close proximity to planet Kurile and the Alien Organisms found there, which are the subject of our research. We know that there is a link between the Alien Organisms and Cardamine, because they both affect RNA and DNA molecules in the same way.</TEXT><PARA/><POP/></RDL>'''
1694 = '''<RDL><PUSH/><TEXT>Cardamine affects human beings in many ways. Aside from the narcotic powers of the drug, we believe that it also has anti-aging benefits. We are trying to develop a product that would increase the human lifespan two-fold. If we could do that, Cryer would multiply its profits overnight.</TEXT><PARA/><POP/></RDL>'''
1695 = '''<RDL><PUSH/><TEXT>The Ashbound have been exposed to Cardamine for centuries. They are the key to understanding how the drug affects human beings. If we could understand that better, we could make a less dangerous Cardamine that wouldn’t interfere with worker productivity. We could then legally distribute it to the Sirius population.</TEXT><PARA/><POP/></RDL>'''
1696 = '''<RDL><PUSH/><TEXT>Alien Organisms are flown here by our pilots from Kurile, since we are always in need of more test subjects. It is usually an easy flight unless you are unlucky enough to stumble across the Ashbound or Rift Captains in this system.</TEXT><PARA/><POP/></RDL>'''
1697 = '''<RDL><PUSH/><TEXT>Test Subject 04227986 escaped from her containment area a few nights ago. She managed to kill several guards between the subject area and the communications center. Once inside the communications area she continued her slaughter. She wasn’t discovered for twelve minutes. We were able to recapture her alive, though she injured three more of us in the process.</TEXT><PARA/><POP/></RDL>'''
1698 = '''<RDL><PUSH/><TEXT>We keep Bounty Hunters at this base to protect our interests here. Some months ago we hired the very best to do a special job for us. We needed live Ashbound as test subjects to run experiments on. We have to do distasteful things at times to provide the people of Sirius with the finest in medical research.</TEXT><PARA/><POP/></RDL>'''
1699 = '''<RDL><PUSH/><TEXT>We often buy Organisms that independent pilots collect. They find them in Omicron Theta, and Omicron Beta. Most of them are the standard types, but you never know when a new one will come along.</TEXT><PARA/><POP/></RDL>'''
1700 = '''<RDL><PUSH/><TEXT>The Rift Captains do not attack us very often, but the Ashbound are always running raids against this base. They seem determined to destroy us, which is very disconcerting. I am just a biochemist; I don’t want to be caught in the middle of a war.</TEXT><PARA/><POP/></RDL>'''
1701 = '''<RDL><PUSH/><TEXT>The test subject who escaped from her cell several nights ago has been haunting my dreams. She slaughtered everyone that she came across, and when they dragged her back to her cell she was laughing and screaming the most horrible things, over and over she cried; “Santiago is coming!” Our communications officer tells us that the chance any messages she sent got through were very slim, but I still can’t help worrying about who Santiago is.</TEXT><PARA/><POP/></RDL>'''
1702 = '''<RDL><PUSH/><TEXT>This is some dangerous space you are in. It’s good to have friends in places like this. If you ever need to head into Omicron Theta, the Zoners have a base where you can land. I hope you get along okay with the Rift Captains. If not, it could be a short one-way trip.</TEXT><PARA/><POP/></RDL>'''
1703 = '''<RDL><PUSH/><TEXT>We bring these guys Alien Organisms from Freeport 9 in Omicron Theta. We also bring them other basic supplies. When I head back to “the Nine” I’m usually hauling Pharmaceuticals bound for Crete. That’s why the Rift Captains don’t kick them out of here tomorrow.</TEXT><PARA/><POP/></RDL>'''
1704 = '''<RDL><PUSH/><TEXT>This place kind of freaks me out. I’m looking forward to getting out of this test tube. You wouldn’t believe me, but I could have sworn I’ve heard screaming here late at night. Don’t tell the scientists I told you that, it wouldn’t be good for business.</TEXT><PARA/><POP/></RDL>'''
1705 = '''<RDL><PUSH/><TEXT>This is a good system to work in. I’ve got easy access to Rift Captains and Ashbound. I just have to bag a few of either to afford a ticket to stay aboard this ship as an honored guest. Orbital keeps me around in case the pirates get a little too aggressive.</TEXT><PARA/><POP/></RDL>'''
1706 = '''<RDL><PUSH/><TEXT>This system is the entry point for Ashbound into this part of space. Mostly they are trying to run their drugs from the Donryu Cloud to the Hiryu Cloud. The Donryu hides the Jump Hole to Omicron Beta, and the Hiryu hides the Jump Holes to Honshu and Sigma-13.</TEXT><PARA/><POP/></RDL>'''
1707 = '''<RDL><PUSH/><TEXT>If you are trying to get closer to the Rift Captains and their space, then I suggest you find the Jump Hole they use to enter this system from Sigma-17. The Hole is on the southern side of the Kikka Dust Cloud. That is the Hole they drag all their Artifacts through to sell to the Hogosha.</TEXT><PARA/><POP/></RDL>'''
1708 = '''<RDL><PUSH/><TEXT>I passed out drunk at the observation deck bar a few nights ago — too many of those deadly OmniStellar GulletBlasters I guess. While I was out someone stole my knife, probably some dirty tourist looking for a souvenir. Whoever took that knife is dead; it has been in my family for six generations.</TEXT><PARA/><POP/></RDL>'''
1709 = '''<RDL><PUSH/><TEXT>We sell the Artifacts directly to the Hogosha. There was a time when we went through the GMG, but it is always more profitable to cut out the middleman. I brought my Artifacts from Freeport 9.</TEXT><PARA/><POP/></RDL>'''
1710 = '''<RDL><PUSH/><TEXT>You are a trusted man by the Rift Captains, which is not an easy thing to be. You can make a fortune selling Artifacts to the Hogosha at this base. Pick them up at the Crete to get the most money.</TEXT><PARA/><POP/></RDL>'''
1711 = '''<RDL><PUSH/><TEXT>We supply this base with many basics. We also like to keep an eye on the Hogosha and Corsair dealings here. Soon they will both end up hating each other. Then the Rift Captains will be forced to deal with us, and we will get their Artifacts for a much cheaper price.</TEXT><PARA/><POP/></RDL>'''
1712 = '''<RDL><PUSH/><TEXT>Soon a certain Corsair will be leaving this base without one of her possessions. Once she gets away from </TEXT><TRA italic="true"/><TEXT>Hawaii</TEXT><TRA italic="false"/><TEXT>  and into open space she is going to stumble across a GMG trap. It will be most unfortunate for her.</TEXT><PARA/><POP/></RDL>'''
1713 = '''<RDL><PUSH/><TEXT>A Hogosha Artifacts dealer will soon turn up onboard this ship with a Corsair’s knife in his back. One of our men was able to get the knife from the Corsair while she was passed out drunk. The incident will certainly put a dent in their business dealings.</TEXT><PARA/><POP/></RDL>'''
1714 = '''<RDL><PUSH/><TEXT>The Artifacts that the Rift Captains bring to this base are highly prized on Sablecross’s black market. They are smuggled in by Hogosha operatives through the Jump Hole in this system to Honshu. From Honshu our people use the Jump Hole there that leads straight into Sablecross. That is the Hogosha Artifact smuggling route.</TEXT><PARA/><POP/></RDL>'''
1715 = '''<RDL><PUSH/><TEXT>I could swear that someone has been following me around onboard this ship. I am not a paranoid man, yet I cannot help but feel a presence behind me in the halls. When I turn around there is nothing. Maybe I’m the one that needs a vacation.</TEXT><PARA/><POP/></RDL>'''
1716 = '''<RDL><PUSH/><TEXT>It was best for both the Rift Captains and the Hogosha to cut the GMG out of our business dealings. It is true that the GMG are closer to our people than the Rift Captains, but “money makes friends of strangers” as the saying goes.</TEXT><PARA/><POP/></RDL>'''
1717 = '''<RDL><PUSH/><TEXT>The passengers aboard this ship are the </TEXT><TRA italic="true"/><TEXT>crème de la crème</TEXT><TRA italic="false"/><TEXT>  of Orsena society. They expect this liner to be appointed with the finest foods, and it is. The Luxury Foods consumed here come straight from the markets of Sablecross.</TEXT><PARA/><POP/></RDL>'''
1718 = '''<RDL><PUSH/><TEXT>This ship is lavishly furnished with works of art and the finest quality appointments. Orbital Spa and Cruise is dedicated to supplying our guests the finest that life has to offer. Luxury Goods are brought here all the way from Whiteharbor.</TEXT><PARA/><POP/></RDL>'''
1719 = '''<RDL><PUSH/><TEXT>Security caught a thief among our guests. Thankfully, all the stolen items have been returned to their rightful owners. The unfortunate criminal will be delivered to the proper authorities in Honshu tomorrow. Within a few weeks she will be working the Hydrocarbon mines of the Fuchu Ring.</TEXT><PARA/><POP/></RDL>'''
1720 = '''<RDL><PUSH/><TEXT>One of our pleasure skiffs near the Donryu Cloud was attacked and destroyed this morning by Ashbound. It is an unfortunate occurrence, but the allure of danger is one of the many things that draws the crowds from Orsena.</TEXT><PARA/><POP/></RDL>'''
1721 = '''<RDL><PUSH/><TEXT>This ship is outside of house space, so the things that go on here might not be completely legal. Government morality can be quite bothersome at times. We provide relief from the burdens of society. Whatever your desire, we will provide it here — no questions asked.</TEXT><PARA/><POP/></RDL>'''
1722 = '''<RDL><PUSH/><TEXT>Many guests are drawn here because they enjoy carousing with dangerous criminals like Hogosha and Rift Captains. Besides, wouldn’t you like to sit down at one of our bars and have a drink sitting next to a dangerous killer, knowing all the while that he is there to enjoy himself just as you are?</TEXT><PARA/><POP/></RDL>'''
1723 = '''<RDL><PUSH/><TEXT>The convergence of the Crow and Edge Nebula in this system makes for one of the most incredible space vistas in all of Sirius. Have you been to our observation deck? It is truly a magnificent sight. Every once in a while we are treated to a small skirmish between opposing factions in this sector — quite marvelous.</TEXT><PARA/><POP/></RDL>'''
1724 = '''<RDL><PUSH/><TEXT>Have you ever seen the fiery blooming “blossoms” of the Kikka Dust Cloud? They are quite extraordinary, yet no one knows where they come from or how they form. I can book you for one of our pleasure skiff runs to that area if you’d like to see them.</TEXT><PARA/><POP/></RDL>'''
1725 = '''<RDL><PUSH/><TEXT>Truth be told, it makes Orbital Spa a little uneasy to have Hogosha and Rift Captains conducting their Artifact business deals here aboard our vessel. But they do pay handsomely to be aboard and their presence is exciting for our guests, even if occasionally one of our esteemed clientele says the wrong thing to a Corsair and gets shot for it.</TEXT><PARA/><POP/></RDL>'''
1726 = '''<RDL><PUSH/><TEXT>With Sigma-13 almost depleted of Gases we had to come to this system to tap into its resources. Kishiro also does a fair bit of gas mining here. They make the best gas mining ships, because they always had to accept mining Gases from less desirable areas. Their ships had to be more efficient to compete.</TEXT><PARA/><POP/></RDL>'''
1727 = '''<RDL><PUSH/><TEXT>The GMG has been dealing with Samura for several centuries. We are responsible for a large part of Samura’s wealth, but they have not shown us the respect we deserve. It is for this reason that the GMG has entered into negotiations with Kishiro.</TEXT><PARA/><POP/></RDL>'''
1728 = '''<RDL><PUSH/><TEXT>The Rift Captains used to be our friends, but they made a very big mistake. We served as intermediaries in the Artifact trade between them and the Hogosha. Unwisely, they have decided to try and cut us out of the trade.</TEXT><PARA/><POP/></RDL>'''
1729 = '''<RDL><PUSH/><TEXT>The Ashbound in this system have made themselves quite a nuisance, because they feel that our presence here is an infringement upon their territory. We try to stay out of their way for the most part, though we used to venture into the Donryu Cloud. We soon learned that that was a mistake.</TEXT><PARA/><POP/></RDL>'''
1730 = '''<RDL><PUSH/><TEXT>The GMG fought the entire Dornmark Navy and won in the 80-Years War. We are not afraid of the Rift Captains even if everyone else is. They have decided to make us their enemies by cutting us out of the Artifact trade. If we see a Corsair in this system, we will attack. This is GMG space.</TEXT><PARA/><POP/></RDL>'''
1731 = '''<RDL><PUSH/><TEXT>The Hogosha may be all powerful in Orsena space, but this is not Orsena space. When the Hogosha agreed to deal us out of the lucrative Artifact trade between them and the Rift Captains, they made a powerful enemy for themselves. Samura should have intervened. The fact that they didn’t shows us how little Samura respects us.</TEXT><PARA/><POP/></RDL>'''
1732 = '''<RDL><PUSH/><TEXT>This base gets the majority of its supplies from Aomori. Anything else that we need is either mined or brought here by Kishiro shippers.</TEXT><PARA/><POP/></RDL>'''
1733 = '''<RDL><PUSH/><TRA italic="true"/><TEXT>Hawaii</TEXT><TRA italic="false"/><TEXT>  is a valuable customer to us and an easy run to make. The H-Fuel they use for their pleasure skiffs is supplied by this base.</TEXT><PARA/><POP/></RDL>'''
1735 = '''<RDL><PUSH/><TEXT>There are unexploited resources in the Donryu Cloud at the northern edge of this system but, the Ashbound guard that area fiercely. Any miners who have gone into the Donryu have not returned undamaged if at all. To venture into Omicron Beta is horribly dangerous and not often attempted; though there is an abundance of resources there.</TEXT><PARA/><POP/></RDL>'''
1736 = '''<RDL><PUSH/><TEXT>The Kishiro H-Fuel that drives Sirius is mined here. Soon Kishiro might supply all the H-Fuel, but you didn’t hear that from me. Our H-Fuel travels from this base throughout Orsena space. We even ship it as far as Larkspur.</TEXT><PARA/><POP/></RDL>'''
1737 = '''<RDL><PUSH/><TEXT>This base is Kishiro’s primary supplier of H-Fuel. We used to mine our own, but our relationship with the GMG has been improving. Kishiro H-Fuel in Cinderwell is imported there from this base. We ship to Whiteharbor and several other bases there.</TEXT><PARA/><POP/></RDL>'''
1738 = '''<RDL><PUSH/><TEXT>The Basic Alloys and Construction Machinery that the GMG needs at this base are brought here by Kishiro from Honshu. It is not very far to Honshu, but the route is beset by criminals and pirates, so you must be careful.</TEXT><PARA/><POP/></RDL>'''
1739 = '''<RDL><PUSH/><TEXT>If you have ever wanted to fly into the heart of Helion, you could always take a little Kishiro H-Fuel with you to Denver in Colorado. It will be purchased there.</TEXT><PARA/><POP/></RDL>'''
1740 = '''<RDL><PUSH/><TEXT>Kishiro has entered into very important negotiations with the GMG. If we are successful, there is a possibility that the two entities could merge, thereby making Kishiro the most powerful corporation in all of Sirius.</TEXT><PARA/><POP/></RDL>'''
1741 = '''<RDL><PUSH/><TEXT>We use the Kyushu Jump Hole to the northeast of this base to get into the system. These Ashbound are weird guys, but they sell us what we want. Cardamine is essential to the Golden Chrysanthemum way of life.</TEXT><PARA/><POP/></RDL>'''
1742 = '''<RDL><PUSH/><TEXT>The Cardamine we get from this base goes straight to Ainu. Sometimes we come here with H-Fuel from our base so that we can make a little money to buy extra Cardamine for personal use. We don’t get bothered by anyone in this system. Even the Bounty Hunters leave us alone.</TEXT><PARA/><POP/></RDL>'''
1743 = '''<RDL><PUSH/><TEXT>We rely upon the Ashbound of Tau-23 to supply us with our Cardamine. We sell it to Sablecross through Rappongi to fund our operations and to pay for the drugs that we use ourselves. Cardamine use is part of our culture. It is a symbol of our free spirit and the dream of a better life.</TEXT><PARA/><POP/></RDL>'''
1744 = '''<RDL><PUSH/><TEXT>Tau-23 is our space. Unfortunately BMM and the IMG have begun encroaching upon us. Niobium and Beryllium have been discovered here, and the miners have followed looking for it. That is why this base is mobilized for sorties. We’re fighting to keep their operations from spreading beyond this system towards Malta.</TEXT><PARA/><POP/></RDL>'''
1745 = '''<RDL><PUSH/><TEXT>We receive the Cardamine from where it is processed on Malta, and then we distribute it into Sirius. Our path towards the Helion and Vesperan systems passes through Edinburgh, where we encounter a slight hindrance: Orbital Spa and Cruise’s </TEXT><TRA italic="true"/><TEXT>Shetland</TEXT><TRA italic="false"/><TEXT>  Cruiser. It makes shipping Cardamine in secrecy all the more difficult.</TEXT><PARA/><POP/></RDL>'''
1746 = '''<RDL><PUSH/><TEXT>The Jump Hole to Tau-37 remains hidden to most amongst the asteroids that populate this system. Unfortunately the IMG found their way there. Beyond it you will find Omicron Alpha, which is the location of our home planet, Malta.</TEXT><PARA/><POP/></RDL>'''
1747 = '''<RDL><PUSH/><TEXT>Our most valued Cardamine customer is the Lane Hackers. Not only do they pay us well for our Cardamine, they will barter valuable Trade Lane information for it. I foresee them becoming completely dependent upon us. Soon their Trade Lane technology will be ours.</TEXT><PARA/><POP/></RDL>'''
1748 = '''<RDL><PUSH/><TEXT>It’s been hard to crack into the Orsena market with our drug, because their strongest crime syndicate, the Hogosha, refuse to deal with us. But we have found allies within Orsena who will help us tap that well. The Golden Chrysanthemums have discovered the allure of Cardamine.</TEXT><PARA/><POP/></RDL>'''
1749 = '''<RDL><PUSH/><TEXT>We get our Side Arms from the Junkers at Trafalgar in Larkspur. It would be very lucrative to run Cardamine there and return here with Detroit Side Arms.</TEXT><PARA/><POP/></RDL>'''
1750 = '''<RDL><PUSH/><TEXT>If you don’t mind risking NCR status in Helion, you may be interested in shipping our drugs. You can take the Cardamine from here and sell it at any Rogue or Junker base. The closer you get to capital systems, the more dangerous it gets. But it’s also more rewarding.</TEXT><PARA/><POP/></RDL>'''
1751 = '''<RDL><PUSH/><TEXT>One of our allies is the Rogues. They aren’t our partners as much as our pawns. We have them under control because they are addicted to Cardamine. Soon more groups will fall to the allure of the drug, and they will also be ours to control. I see this upon the horizon for the Golden Chrysanthemums.</TEXT><PARA/><POP/></RDL>'''
1752 = '''<RDL><PUSH/><TEXT>We trust you, so I will tell you how to make yourself very rich. The Cardamine brought to this base comes from Malta. It is there that we also receive all necessary supplies to run this base.</TEXT><PARA/><POP/></RDL>'''
1753 = '''<RDL><PUSH/><TEXT>I yearn for my return to Malta. I miss the orange fields of grass and sprawling plantations. The Cardamine is so woven into my blood that even my skin feels dry and cracked without the winds of my home planet upon it.</TEXT><PARA/><POP/></RDL>'''
1754 = '''<RDL><PUSH/><TEXT>I am Santiago Llorens. Perhaps you have heard of me? My lord, Don Miguel of the Benitez Cartel has asked me a favor, and I cannot deny him. I will soon leave this base and cross the Edge Worlds to a base named Atka, where I will kill all aboard and free my imprisoned brother Outcast.</TEXT><PARA/><POP/></RDL>'''
1755 = '''<RDL><PUSH/><TEXT>I have killed more than a thousand men and stolen a kingdom of riches. Even now there are two veteran Bounty Hunters that stalk me: one for revenge, the other for reward. They will have to follow me across the stars, for I am bound to another place. Neither one will live beyond Tau-37; Benitez will see to that.</TEXT><PARA/><POP/></RDL>'''
1756 = '''<RDL><PUSH/><TEXT>With mineral resources almost depleted within Vesperan space, we had no choice but to look elsewhere. When we found this system it was the answer that BMM had been looking for. Of course it has been quite a struggle against the Ashbound, and the IMG sucking up the Niobium does not help either.</TEXT><PARA/><POP/></RDL>'''
1757 = '''<RDL><PUSH/><TEXT>When DSE was building the Jump Gate into this system, there were never any Outcast attacks. Those crafty bastards were biding their time until the Gate was completed, and then they attacked in force. They were just waiting until we had committed ourselves to this area so they could pirate our shipping.</TEXT><PARA/><POP/></RDL>'''
1758 = '''<RDL><PUSH/><TEXT>BMM pilots in this part of Sirius die all the time. It’s not like in civilized space where you can drop your cargo and run. Out here the Ashbound will chase you down and kill you after you’ve dropped cargo. It’s like a sport for them.</TEXT><PARA/><POP/></RDL>'''
1759 = '''<RDL><PUSH/><TEXT>There is a permanent DSE staff here that repairs Jump Gate and Trade Lane Rings. The Ashbound just love shooting the Rings to bits, even though they never manage to destroy them. Those DSE chaps sure do earn a lot of money. Of course I earn danger pay for being stationed in the Border Worlds, but I’m just a miner, so I’m only going to earn so much.</TEXT><PARA/><POP/></RDL>'''
1760 = '''<RDL><PUSH/><TEXT>The Beryllium that we mine here gets shipped right to Stokes in the heart of Leeds. We do not want to be dependent on the IMG any longer. Unfortunately, if we do not find a new source of Niobium, we will soon need to buy that from them, too.</TEXT><PARA/><POP/></RDL>'''
1761 = '''<RDL><PUSH/><TEXT>The Niobium in this system should be mined by BMM, too, but those dirty independent miners set up their operation before we had a chance to file a claim. Here we are trying to save Vesperan industry, and those damned independents are sucking up the Niobium for their own benefit. What’s worse is that we take the brunt of the Outcast attacks in this system.</TEXT><PARA/><POP/></RDL>'''
1762 = '''<RDL><PUSH/><TEXT>There are no authorities whatsoever in this system; we are too far from Vesperan space to get protection from the military or the police. The Bounty Hunters who do come into the system loiter near the Tau-29 Jump Hole, but that strategy does us no good against the Ashbound attacking this base and the Trade Lanes!</TEXT><PARA/><POP/></RDL>'''
1763 = '''<RDL><PUSH/><TEXT>My shift starts soon, and I’ll have to get onboard that death trap we call a mining ship. DSE is still working on the Trade Lane that runs to the Beryllium fields, so in the mean time we are most vulnerable to the Ashbound aboard the miner. It’s pretty safe once you get to the mining area; the trip is the dangerous part.</TEXT><PARA/><POP/></RDL>'''
1764 = '''<RDL><PUSH/><TEXT>There are Jump Holes throughout this system that are used by criminals and independents. We believe that the Tau-29 Hole lies just to the east of the Beryllium fields. Look to the northeast for the Kyushu Hole.</TEXT><PARA/><POP/></RDL>'''
1765 = '''<RDL><PUSH/><TEXT>The run between here and Holman isn’t too bad considering what part of space you are in right now. DSE brings a lot of supplies to this base from Holman, including Trade Lane Parts and Construction Machinery.</TEXT><PARA/><POP/></RDL>'''
1766 = '''<RDL><PUSH/><TEXT>BMM is paying the bill for us to complete the Trade Lane to their mining area. The operation must be costing them a fortune considering the number of Outcast attacks on our construction sites. I’m glad I don’t have to go out there and work on the Rings. I’m a desk jockey — the guy who makes sure we ship all the right supplies to this base, plus I get danger pay. It’s a good job.</TEXT><PARA/><POP/></RDL>'''
1767 = '''<RDL><PUSH/><TEXT>The Trade Lane Parts that come to this base are shipped to us from two different bases, depending on who has what we need at the time. Sometimes we need to special order a component all the way from Waterloo in Larkspur.</TEXT><PARA/><POP/></RDL>'''
1771 = '''<RDL><PUSH/><TEXT>The IMG has gone deep into the riskiest areas of Sirius space looking for valuable minerals. The most dangerous post you can man for the IMG is Falkland, which is hidden among the asteroids of Tau-37. The Ashbound do not know its location, or they would have destroyed it for certain.</TEXT><PARA/><POP/></RDL>'''
1772 = '''<RDL><PUSH/><TEXT>This is dangerous space out here, and the other guys you see here in the Border Worlds are veterans. Anyone who comes here before they are ready doesn’t last very long. If you are a Zoner or IMG, it’s a little different, but then the miners you see out here are a different breed, too.</TEXT><PARA/><POP/></RDL>'''
1773 = '''<RDL><PUSH/><TEXT>More than anything else, this is Outcast space. You have to respect that or else they will bury you. Don’t underestimate the Ashbound. Generally they leave us alone, but that is because we are smart enough to stay out of their way.</TEXT><PARA/><POP/></RDL>'''
1774 = '''<RDL><PUSH/><TEXT>We operate this base here because of the rich Niobium deposits. Once it is mined, our pilots ship it out to Holman. From there we don’t really care what happens.</TEXT><PARA/><POP/></RDL>'''
1775 = '''<RDL><PUSH/><TEXT>Niobium is an important Commodity that can be used for several things. That’s why we come this far to get it. Once we bring it back here from our mining operations, it is shipped to Freeport 6, and the Zoners take it from there.</TEXT><PARA/><POP/></RDL>'''
1776 = '''<RDL><PUSH/><TEXT>It takes a lot to keep an operation like this running. One thing we always need more of is Mining Machinery. We pick it up in Holman, and the surplus is shipped to Falkland.</TEXT><PARA/><POP/></RDL>'''
1777 = '''<RDL><PUSH/><TEXT>Lots of people who come here think we are a pretty strange breed. It’s true we are loners, but if you want to meet some strange ones you should check out the wackos in Tau-37. Those guys get a rush from knowing that Ashbound might kill them at any time.</TEXT><PARA/><POP/></RDL>'''
1778 = '''<RDL><PUSH/><TEXT>It sure is good to see someone who isn’t a miner around here. I know there are Deep Space folks here too, but company staff are usually jerks who can’t wait to get out of here. They all think we are weirdoes. You don’t think I’m strange, do you? I’ve been out in the Edge so long I don’t even know what’s normal anymore.</TEXT><PARA/><POP/></RDL>'''
1779 = '''<RDL><PUSH/><TEXT>Sure, the Ashbound attack this base every once in a while. What they really focus on is the BMM site. Still, it’s kind of a rush knowing that an Outcast might be sitting in the Niobium fields waiting to smoke you. I always get goose bumps when I set my mining skiff down out there, so I guess I like it.</TEXT><PARA/><POP/></RDL>'''
1780 = '''<RDL><PUSH/><TEXT>We have Bounty Hunters working in this system. They are being well paid to dispose of our troubles with the Gaians. If it weren’t for their attacks, this planet would be complete by now, and Vespera could begin using Harris to supplement Cambridge as a Food source. This would alleviate the Food shortage problem that is facing our great colony.</TEXT><PARA/><POP/></RDL>'''
1781 = '''<RDL><PUSH/><TEXT>There are signs that the terraforming process may be completely infeasible. Though we have been dumping Oxygen into this planet’s atmosphere for centuries, our studies show that outgassing is beginning to occur. This means that no matter how much Oxygen we pump in, eventually Harris will revert back to its original condition.</TEXT><PARA/><POP/></RDL>'''
1782 = '''<RDL><PUSH/><TEXT>The money given to us by the Vesperan government to terraform Harris has already been used up. We would not have the funds to complete this project if we did not divert capital from other operations to this one. Luckily, we have been able to sell the government on terraforming more than one planet.</TEXT><PARA/><POP/></RDL>'''
1783 = '''<RDL><PUSH/><TEXT>Silver is a necessary and very expensive part of the terraforming process. It is used in our cloud-seeding operations. We have it shipped here from Canterbury.</TEXT><PARA/><POP/></RDL>'''
1784 = '''<RDL><PUSH/><TEXT>Alien Organisms are brought here as a catalyst to the terraforming process. They speed up the operation at least three fold. We ship the little critters from Leeds.</TEXT><PARA/><POP/></RDL>'''
1785 = '''<RDL><PUSH/><TEXT>The original CEOs and board members who founded Planetform are all dead and gone, but before they died they became very wealthy. Their families are all part of the Larkspur elite. I only hope that I can make my fortune and get out of the company before the government discovers what is truly going on.</TEXT><PARA/><POP/></RDL>'''
1786 = '''<RDL><PUSH/><TEXT>Terraforming Gases help to create an environment that is capable of sustaining life on otherwise barren planets. The Gases we pump into Harris are shipped here from Stokes.</TEXT><PARA/><POP/></RDL>'''
1787 = '''<RDL><PUSH/><TEXT>We get the majority of our basic supplies from other bases in the Border Worlds, but Mining and Construction Machinery is shipped in from Leeds. Terraforming is a heavy duty industry; we are creating life.</TEXT><PARA/><POP/></RDL>'''
1788 = '''<RDL><PUSH/><TEXT>The most efficient way to get Water onto a planet’s surface is to push ice asteroids into the atmosphere. Unfortunately, that is not possible here like it is in Edinburgh. Granted, there is an abundance of Ice and Oxygen in this system, which is very helpful, but it is not close enough to haul the asteroids directly.</TEXT><PARA/><POP/></RDL>'''
1789 = '''<RDL><PUSH/><TEXT>DSE uses this base to supply our operation in Tau-23 with the necessary commodities that keep it running. Most important to our success are the Trade Lane Parts and Construction Machinery we ship there from here.</TEXT><PARA/><POP/></RDL>'''
1790 = '''<RDL><PUSH/><TEXT>Those Ashbound in Tau-23 keep attacking our construction sites, which requires us to replace or repair components from the Trade Lane and Jump Gate Rings. The first step in that process is shipping Trade Lane Parts to this base from Waterloo in Larkspur.</TEXT><PARA/><POP/></RDL>'''
1791 = '''<RDL><PUSH/><TEXT>I used to be stationed at the BMM base in Tau-23. It was hell. You never knew when the Ashbound were going to attack. I guess we have the same problems here, but there are fewer Ashbound attacking us, and the military patrols this system.</TEXT><PARA/><POP/></RDL>'''
1792 = '''<RDL><PUSH/><TEXT>The IMG gets its hands on a lot of Niobium out here. It is Gateway’s responsibility to ship it back to Kensington, where it will either be used for ship building components or anodized and made into Luxury Goods.</TEXT><PARA/><POP/></RDL>'''
1793 = '''<RDL><PUSH/><TEXT>Some of the Niobium that we pick up here is not hauled to Vespera. We have a contract that requires us to ship Niobium to Narita in Sablecross. That is an exciting run, but the Orsena people aren’t very friendly.</TEXT><PARA/><POP/></RDL>'''
1794 = '''<RDL><PUSH/><TEXT>Most of the supplies that keep this place running are brought in from Vespera by Gateway. Bowex might prize itself on shipping through the Border Worlds, but it is Gateway that gets the job done. We bring this base Construction and Mining Machinery from Leeds.</TEXT><PARA/><POP/></RDL>'''
1795 = '''<RDL><PUSH/><TEXT>This base was established because we could make a living outside of colony space mining Water and Oxygen in this system. Basically, we became a trading hub in this part of space. All type of commodities flow through here headed deeper into the Border Worlds.</TEXT><PARA/><POP/></RDL>'''
1796 = '''<RDL><PUSH/><TEXT>This is the first of the Border World systems north of Vesperan space, and from here it gets crazier the farther you go. I like it here because it isn’t too dangerous, but you still get away from colony control. Mining Water and Oxygen isn’t easy, but it is a good job. Sometimes we are contacted to pull asteroids out of the Trade Lanes, too.</TEXT><PARA/><POP/></RDL>'''
1797 = '''<RDL><PUSH/><TEXT>The Water and Oxygen we mine in this system is highly desirable in Leeds. They have Water and Oxygen there already, but ours is exceptionally pure and clean. Many people don’t trust the Water you can get from Leeds, and I wouldn’t either. It is brownish in color and smells rather foul.</TEXT><PARA/><POP/></RDL>'''
1798 = '''<RDL><PUSH/><TEXT>Mining and Construction Machinery make their way to this base from Leeds. It’s that machinery that makes all of the industrial labor in this part of space possible. People will pay well for it. We take the Mining Machinery to our own base Java.</TEXT><PARA/><POP/></RDL>'''
1799 = '''<RDL><PUSH/><TEXT>The IMG brings Niobium to this base from our station in Tau-23. That is a dangerous piece of space, but we get regular shipments from Java.</TEXT><PARA/><POP/></RDL>'''
1800 = '''<RDL><PUSH/><TEXT>Basic supplies are brought here from Vesperan space, and then we take them to other IMG operations in the Border Worlds, including our operations in Tau-37. If you like danger you might give that a try, but you must be very careful not to give Falkland’s location away to the Ashbound.</TEXT><PARA/><POP/></RDL>'''
1801 = '''<RDL><PUSH/><TEXT>This system is relatively safe for the Border Worlds. Sure, there are all kinds of criminals here, including Ashbound and Gaians, but the Vesperan Military still sends patrols into this area from its battleship in Edinburgh. There are Bounty Hunters here, too, curbing the criminal presence a bit.</TEXT><PARA/><POP/></RDL>'''
1802 = '''<RDL><PUSH/><TEXT>I used to work for BMM until I discovered that they didn’t care about me. That’s why I joined the IMG — to be my own boss. I get paid for the amount of Water and Oxygen I mine — not some set salary that is always going to keep me under someone’s thumb.</TEXT><PARA/><POP/></RDL>'''
1803 = '''<RDL><PUSH/><TEXT>Being an independent miner isn’t a picnic, but at least we don’t have to answer to some corporate task master. That’s why we can expand more quickly than the larger corporations, like BMM. They paid tremendously for Jump Gates to Tau-23; we used Jump Holes and got there first, and that’s why the Niobium is ours.</TEXT><PARA/><POP/></RDL>'''
1804 = '''<RDL><PUSH/><TEXT>If you want to be a successful IMG miner, you have to know the locations of Jump Holes. There are two in this system: the Hole to Edinburgh is in the southwest corner of the system, and the Hole to Tau-29 is due north of this base just beyond the parallel of the sun.</TEXT><PARA/><POP/></RDL>'''
1805 = '''<RDL><PUSH/><TEXT>Soon our terraforming operations will be complete in Harris. We plan to meet our estimated time of completion in 820 AS. That will be a joyous day for Vespera and all of Sirius. You might think of purchasing real estate there while the prices are still low.</TEXT><PARA/><POP/></RDL>'''
1806 = '''<RDL><PUSH/><TEXT>The abundance of Water and Oxygen in this system made Harris a prime candidate for Planetform’s magic. Those bloody Gaians certainly have made things more difficult than they should have been. Thankfully, the Bounty Hunters we hire kill more of them each day.</TEXT><PARA/><POP/></RDL>'''
1807 = '''<RDL><PUSH/><TEXT>With the exorbitant price tag of terraforming, you would think that the Vesperan government would crack down harder on the Gaians and the Green Front. The Gaians shouldn’t be that difficult to destroy. They are a small, disorganized band of left-wing activists that could easily be purged from the ranks of the Vesperan populace.</TEXT><PARA/><POP/></RDL>'''
1808 = '''<RDL><PUSH/><TEXT>I’m visiting this great city to pick up some supplies for our base in the Kanto. There’s a great little sushi bar down the way that I always visit. You have to try the purple sea urchin, although it might be an acquired taste for a Gaijin like you.</TEXT><PARA/><POP/></RDL>'''
1809 = '''<RDL><PUSH/><TEXT>Tokyo is the only place we can buy Side Arms legitimately within Orsena. It’s very controlled here — not like Helion, I hear. We don’t have rabble like the Rogues and Xenos in Orsena — just misguided souls like the Golden C. and those Jade Vow.</TEXT><PARA/><POP/></RDL>'''
1810 = '''<RDL><PUSH/><TEXT>We supply all the Artifacts for Orsena and Helion. It’s been good for us, although the ban has been bad for business. It’s all Helion and the LSF’s fault. What harm are these trinkets ever going to cause anyone? If you’re interested in making some deliveries, stop by our base in the Kanto, behind Tokyo.</TEXT><PARA/><POP/></RDL>'''
1811 = '''<RDL><PUSH/><TEXT>My ship, The Kamakura Maru, just completed an arduous journey from Larkspur with a shipment of Gold. Now I have to leave it in Yukawa for several months. Somewhere in Tau-29, the Ashbound attacked, and a missile penetrated the aft bulkhead of reactor core 3. We patched it up, but it was close call.</TEXT><PARA/><POP/></RDL>'''
1812 = '''<RDL><PUSH/><TEXT>Kishiro competes directly with Samura in the Cinderwell-Sablecross Luxury Goods and Niobium trade. We both suffer equally in Libertonian space at the hands of the Rogues and Xenos. But once we enter Orsena, Kishiro has an advantage. The Jade Vow attack Samura mercilessly. By comparison, we are merely occasional targets of convenience.</TEXT><PARA/><POP/></RDL>'''
1813 = '''<RDL><PUSH/><TEXT>We have a large factory staffed with foreign workers at the Deshima Station in Shikoku. Producing Orsena Consumer Goods cheaply and efficiently is the only way to stay competitive with LPI, who uses free prison labor to keep its production costs down.</TEXT><PARA/><POP/></RDL>'''
1814 = '''<RDL><PUSH/><TEXT>Kishiro supplies many of the bases within this system, at least those that are not Samura owned. I don’t like Tokyo. It always feels like Samura’s heavy hand is at work here. In Honshu the city is much smaller and the ocean cleaner, but neither planet offers much arable land. Our Orsena ancestors came from many light years away in search of more space — how ironic that we landed here.</TEXT><PARA/><POP/></RDL>'''
1815 = '''<RDL><PUSH/><TEXT>Samura won’t let us land on Yokohama, so we must deliver our Shinagawa produced Optical Chips here instead. For the same reason, we ship Engine Components here rather than complete the journey to Kyushu, which is effectively a Samura base.</TEXT><PARA/><POP/></RDL>'''
1816 = '''<RDL><PUSH/><TEXT>Kishiro has been patient with Samura’s antics in Hokkaido, but we must not squander too much in that endeavor. Vespera is expanding into Tau-23 as we speak, obtaining the mineral wealth that Orsena so sorely needs. Rather than carrying on their feud with the Jade Vow, the government should think of all the Orsena people, not just the Samura cronies.</TEXT><PARA/><POP/></RDL>'''
1817 = '''<RDL><PUSH/><TEXT>Life in State Police is not as simple as it once was. We and the Hogosha had an agreement. Smuggling Artifacts is fine, but not Cardamine. The Golden Chrysanthemums have disturbed this harmonious balance. They insist on importing drugs into Roppongi, where we cannot watch them carefully. IC is not very concerned with their activities, so there is little we can do.</TEXT><PARA/><POP/></RDL>'''
1818 = '''<RDL><PUSH/><TEXT>The Kanto Field is directly behind Tokyo. It was once Orsena’s most important mining area, many centuries ago. Now it has become a criminal gathering place. The Hogosha keep things under control for us in there. In exchange, we let them do as they please around their base, Kabukicho.</TEXT><PARA/><POP/></RDL>'''
1819 = '''<RDL><PUSH/><TEXT>We believe there is a Jump Hole in the Kanto Field that leads to Kyushu and points beyond. From there, the Jade Vow and Golden C. can access our system and attack the Orsena people. We are certain that the Hogosha know its location, but they will not tell us, as it is most likely used for Artifact smuggling.</TEXT><PARA/><POP/></RDL>'''
1820 = '''<RDL><PUSH/><TEXT>The Hogosha are not really criminals, like the GC or the Jade Vow. They may engage in questionable behavior around Kishiro and foreign shippers’ storage areas on occasion, but will never directly attack any ship. Artifacts are harmless trinkets. All this fuss with the colony-wide ban seems rather extreme to me.</TEXT><PARA/><POP/></RDL>'''
1821 = '''<RDL><PUSH/><TEXT>Bounty Hunters are not welcome in Orsena space, outside of the Shikoku system. The Orsena State Police prefers to take care of its own criminal problems. We do not need to rely on uncouth foreigners like the Charter Guild to perform this task.</TEXT><PARA/><POP/></RDL>'''
1822 = '''<RDL><PUSH/><TEXT>Frankly speaking, I do not understand why we must persecute the Jade Vow so strongly. They are not indiscriminate pirates like the Ashbound or Rift Captains, only attacking Kishiro when they need supplies. Samura and the government have a deep hatred for the Dragons that has not diminished over the centuries. So I must follow orders …</TEXT><PARA/><POP/></RDL>'''
1823 = '''<RDL><PUSH/><TEXT>The most difficult assignment for a Junsa like me is at Sapporo, within the clouds of Hokkaido. We must protect Samura’s interests there at all costs. At least that’s what Tokyo says. So we help protect a system that should be the exclusive domain of the Naval Forces.</TEXT><PARA/><POP/></RDL>'''
1824 = '''<RDL><PUSH/><TEXT>The youth of Sablecross are developing dangerous habits. They prefer the taste of inferior foreign Foods like Synth Paste to superior Kyushu brands. What little extra money they have goes into buying Libertonian Luxury Goods and smuggled Cardamine.</TEXT><PARA/><POP/></RDL>'''
1825 = '''<RDL><PUSH/><TEXT>We as Orsena must change our traditional ways. Kishiro is an example for the future. Unfortunately, Samura wishes to preserve the past. They are too close with the Hogosha, who are far more unscrupulous than they would like to admit. Rather than reforming their agricultural production methods to resist the advance of Synth Foods, they have chosen to expend their resources on lobbying the government and backing the Farmers Alliance.</TEXT><PARA/><POP/></RDL>'''
1826 = '''<RDL><PUSH/><TEXT>I’m the Orbital rep here in Tokyo. It’s my job to coordinate the delivery of supplies to the </TEXT><TRA italic="true"/><TEXT>Hawaii</TEXT><TRA italic="false"/><TEXT>  cruise ship in Sigma-19. I also do the local marketing, trying to get the wealthy and upwardly mobile Tokyo clientele to come out to our little ship and see the magnificent view of the Edge.</TEXT><PARA/><POP/></RDL>'''
1827 = '''<RDL><PUSH/><TEXT>Your best bet at making good money with Orbital is the Luxury Food runs to the </TEXT><TRA italic="true"/><TEXT>Hawaii</TEXT><TRA italic="false"/><TEXT>. They eat a lot of those giant green prawns out there, let me tell you. They taste kind of funny to me, to be honest. I guess I’m used to Synth Paste. I prefer the beef flavor, whatever that is.</TEXT><PARA/><POP/></RDL>'''
1828 = '''<RDL><PUSH/><TEXT>It’s always raining here — worse than Larkspur. At least you can get Synth Paste here. That was a major coup by Synth Foods. Word on the street is that the government couldn’t pay for that Jump Gate in Hokkaido and asked for a price break. Whiteharbor made a deal by offering a free loan in exchange for access to the Orsena Food market. It worked like a charm in Dornmark.</TEXT><PARA/><POP/></RDL>'''
1829 = '''<RDL><PUSH/><TEXT>My ship is just passing through, and it’s good to drink real Orsena beer again. We normally do the Pharmaceutical run from Denver. Tomorrow well drop by our company offices in Shinjuku, and then head to Kyushu with the bulk of the load. We often bring Kyushu Food Containers on the return trip.</TEXT><PARA/><POP/></RDL>'''
1830 = '''<RDL><PUSH/><TEXT>I just sold a shipment of Whiteharbor Luxury Goods for the spoiled brats of our Shibuya district. The trip from Helion is tiring, given the threat of Xeno and Lane Hacker attacks. Then you must contend with those crazy Golden Chrysanthemum pirates, who would rather steal their designer clothes than buy them like a proper Orsena woman.</TEXT><PARA/><POP/></RDL>'''
1831 = '''<RDL><PUSH/><TEXT>Almost all Orsena shipping stops in Tokyo. My family is here, but I don’t see them often. It is a lonely life, that of a tanshin funin. We just brought a load of Niobium from Tau-29. I’m transferring to an armored transport leaving for Hokkaido on a Side Arms delivery to the </TEXT><TRA italic="true"/><TEXT>Matsumoto</TEXT><TRA italic="false"/><TEXT>  within the next hour. Hokkaido is not an easy trip. Maybe I’ll have some whiskey before I go.</TEXT><PARA/><POP/></RDL>'''
1832 = '''<RDL><PUSH/><TEXT>Samura handles most of the Orsena cargo runs across the Sigma-13 system to Dornmark. As part of the Treaty of Honshu, which ended the 80-Years War, we are not allowed to enter Ironreach. Instead, we must transfer our cargo to Republican at the Mainz Outpost in Frankfurt. That’s fine with me — it is too cold in Ironreach.</TEXT><PARA/><POP/></RDL>'''
1833 = '''<RDL><PUSH/><TEXT>They just unloaded my ship’s Luxury Food from Junyo at the Tsukiji fish market. Junyo is Samura’s most exciting project. We have transformed a sterile ocean moon in Shikoku into Orsena’s top seafood production area within 50 years. The secret is the Alien Organisms from Kurile in the Sigma-19 system. They have not only oxygenated Junyo’s oceans in record time but have provided cheap and abundant Food for the shrimp and fish farms.</TEXT><PARA/><POP/></RDL>'''
1834 = '''<RDL><PUSH/><TEXT>Orsena industrial might is shared between the two diversified corporations of Samura and Kishiro. Tokyo is the only neutral ground for the two giant companies. Kyushu is Samura territory; Honshu is Kishiro country. We are the older, more established concern, founded in the early days after the Arrival.</TEXT><PARA/><POP/></RDL>'''
1835 = '''<RDL><PUSH/><TEXT>That damned Farmers Alliance attacked us just as we left the Shikoku Gate. The State Police is not pursuing those Samura henchmen like they should. Yea, they’ve opened up their Food market, but they looked the other way when we lost a ship.</TEXT><PARA/><POP/></RDL>'''
1836 = '''<RDL><PUSH/><TEXT>We will prevail in our battle with Samura. Their farmers are using outdated methods and seeds to grow crops. More importantly, we are not reliant on planets. Plans are underway on Deshima to build an expansion wing of 50 biodomes. Soon we will crush the farmers of Kyushu.</TEXT><PARA/><POP/></RDL>'''
1837 = '''<RDL><PUSH/><TEXT>Synth Foods is now shipping directly to Honshu from the Deshima facility. Kishiro is far more accepting of Synth Foods. They accept the change as inevitable, as Orsena simply does not have the arable land to increase Food production on its own.</TEXT><PARA/><POP/></RDL>'''
1838 = '''<RDL><PUSH/><TEXT>We’re delivering some of Detroit’s finest personal Side Arms to the Orsena State Police. Then I’ll probably pick up some supplies for the Roppongi Station, high above this planet. I prefer it up there. You can get Helion Ale and other things from home.</TEXT><PARA/><POP/></RDL>'''
1839 = '''<RDL><PUSH/><TEXT>Universal handles part of the Luxury Goods trade between Whiteharbor and Tokyo. It is a very competitive route, but there’s room for three. We usually pick up Niobium for the return trip. If only we didn’t have those dark Independent Worlds to cross, where the bandits are always waiting.</TEXT><PARA/><POP/></RDL>'''
1840 = '''<RDL><PUSH/><TEXT>As part of the Sirius Commerce Pact, Universal and other Libertonian companies cannot own any permanent bases within Orsena space outside of Sablecross. So we rent space from IC on the Roppongi Station and use it as our transfer point for Construction Supplies and Jump Gate Parts for the project in Hokkaido.</TEXT><PARA/><POP/></RDL>'''
1841 = '''<RDL><PUSH/><TEXT>I’m not really comfortable having to share this cramped Outpost while so many of our competitors loiter about. You have to be very careful what you say here, especially with those Gateway sods about. At least Republican is a respectable company with the proper pedigrees.</TEXT><PARA/><POP/></RDL>'''
1842 = '''<RDL><PUSH/><TEXT>Bowex has been providing the most reliable transport of Orsena and Vespera goods across the Border Worlds since 258. Before the Trade Lanes were built through the Tau systems, it was a long and dangerous journey across the ice fields of the Barrier, sometimes taking upwards of six months.</TEXT><PARA/><POP/></RDL>'''
1843 = '''<RDL><PUSH/><TEXT>We’ve just come over from Yokohama to pick up a return cargo for Glasgow. It looks like it’ll be Engine Components or Optronics. It’s an odd place, Orsena. The two giants control everything — no mid-sized companies like the other Houses. I’d give Kishiro the technical edge of the two, but Samura has far more political clout in Sablecross.</TEXT><PARA/><POP/></RDL>'''
1844 = '''<RDL><PUSH/><TEXT>I’ve been doing the Kensington-Narita run for some time now. Normally we ship in Beryllium and Gold, and then return with H-Fuel. We’d like to expand to more lucrative return cargos, but the Vesperan government has some absurd law which states that only Bowex can import those Commodities directly from Orsena.</TEXT><PARA/><POP/></RDL>'''
1845 = '''<RDL><PUSH/><TEXT>This bloody hole is awful. I can’t wait to get back to a civilized place like Kensington. All the beer tastes the same — no character to it. Nothing like a good Vespera pint with a nice head to it. I’m leaving in the morning to run a load of H-Fuel back home. At least the Ashbound don’t get into that too much.</TEXT><PARA/><POP/></RDL>'''
1846 = '''<RDL><PUSH/><TEXT>We handle the IMG Niobium shipments from Holman in Tau-31. The Ashbound seem to be quite agitated up in that area of the Nacre Reach, probably because of the IMG venturing into their territory. At least that’s what I’ve heard.</TEXT><PARA/><POP/></RDL>'''
1847 = '''<RDL><PUSH/><TEXT>Narita is the transfer point for most foreign shippers in Orsena space. We sell our Optronics and Engine Components from Honshu here. We buy our Beryllium for the engine manufacturing center from Gateway. It would be less costly and faster if the government allowed them to ship directly to Honshu.</TEXT><PARA/><POP/></RDL>'''
1848 = '''<RDL><PUSH/><TEXT>The real reason this base exists is to allow a place for those slimy Hogosha to steal supplies for Samura’s factories. We at Kishiro abhor these unscrupulous methods employed by our competitor to gain competitive advantage.</TEXT><PARA/><POP/></RDL>'''
1849 = '''<RDL><PUSH/><TEXT>Gold is shipped to Narita rather than Tokyo, so we must bring the shipments back across two Trade Lanes that the transports have already traversed — most inefficient. This smells of a Samura-backed government regulation.</TEXT><PARA/><POP/></RDL>'''
1850 = '''<RDL><PUSH/><TEXT>The Orsena government established this base to give foreign shippers from Dornmark and Vespera a suitable location to trade their goods within Sablecross space. Helion corporations prefer to use the more accessible Roppongi Station above the planet.</TEXT><PARA/><POP/></RDL>'''
1851 = '''<RDL><PUSH/><TEXT>I’ve never understood why they put it so far from everything else in the system. The official word is that Tokyo didn’t want a congested trading area of shipping above the planet. Privately, I heard that they wanted to make it a little more costly and inconvenient for shippers like Republican to trade with Tokyo, giving Samura and Kishiro an edge on those trade routes.</TEXT><PARA/><POP/></RDL>'''
1852 = '''<RDL><PUSH/><TEXT>It is tiresome to guard against the Hogosha here. They patiently wait until all of our patrols are out. They seem to prefer shipbuilding materials, which is puzzling, because they use generic off-the-lot ships. I hear they’ve been spotted in Shinjuku on occasion. Apparently some of them work for Samura as salary men.</TEXT><PARA/><POP/></RDL>'''
1853 = '''<RDL><PUSH/><TEXT>We have problems with Hogosha stealing from the storage depots around this base. Narita is too small to store all of the cargo that is generated. The Hogosha are harmless, though — just skimming a little bit from the Gaijin shippers.</TEXT><PARA/><POP/></RDL>'''
1854 = '''<RDL><PUSH/><TEXT>I went on an assault patrol yesterday into Chiba. Suzuki-san was my patrol leader. We tracked two Jade Vow for some ways before they discovered our presence and engaged us in battle. Suzuki-san was able to destroy both of them. I feel ashamed that I was not of more assistance.</TEXT><PARA/><POP/></RDL>'''
1855 = '''<RDL><PUSH/><TEXT>The life of a Orsena State Police Junsa is not really very exciting most of the time, unless you are posted in Hokkaido. Sapporo is the most dangerous assignment on the force. It is all clouds and radiation up there. You never know when the Jade Vow or Golden C. will strike.</TEXT><PARA/><POP/></RDL>'''
1856 = '''<RDL><PUSH/><TEXT>We run Trade Lane patrols towards Shinagawa and Yokohama. The Jade Vow are the chief criminals in this area. They prefer to strike from the Chiba Field. It should really be a military matter, but they are otherwise occupied patrolling the Independent and Border Worlds.</TEXT><PARA/><POP/></RDL>'''
1857 = '''<RDL><PUSH/><TEXT>It is difficult being surrounded by so many foreigners all the time at this post, especially the Dornmarkers. Republican Shipping never should’ve been allowed back in Orsena space after the 80-Years War. They should’ve been forced to transfer all their cargo to Orsena ships at the Dornmark frontier post of Mainz.</TEXT><PARA/><POP/></RDL>'''
1858 = '''<RDL><PUSH/><TEXT>We believe there is a Jump Hole to Honshu in the Chiba Field, but they can be very difficult to locate. The Hogosha won’t say anything, but we see many Artifact smugglers crossing the system to the Kanto Field, so we are certain it is there.</TEXT><PARA/><POP/></RDL>'''
1859 = '''<RDL><PUSH/><TEXT>The only reason Samura doesn’t buy all of their Boron and High-Temperature Alloys from Mainz is to save more of their ships from being lost. The Rift Captains and Ashbound have become quite troublesome in that system, and there seems to be little that the GMG can do to control the problem.</TEXT><PARA/><POP/></RDL>'''
1860 = '''<RDL><PUSH/><TEXT>It seems like the Hogosha always manage to steal shipments from the storage area before they are officially signed over to Samura. This port is too small. If it had proper storage, we wouldn’t need to expose our goods to theft. It’s probably all part of Samura and the government’s grand plan.</TEXT><PARA/><POP/></RDL>'''
1861 = '''<RDL><PUSH/><TEXT>I’m headed to Roppongi after this. If I’m lucky, maybe some Golden Chrysanthemums will show up at the bar. They’ve always got extra Cardamine to share.</TEXT><PARA/><POP/></RDL>'''
1862 = '''<RDL><PUSH/><TEXT>This is not a very lucrative run because it is only one Trade Lane jump to Yokohama. Republican ships its High-Temperature Alloys and Boron all the way from Dornmark but must terminate here at Narita. Only Samura ships are allowed to land at Yokohama — no Dornmark ships. Rules and regulations …</TEXT><PARA/><POP/></RDL>'''
1863 = '''<RDL><PUSH/><TEXT>Even though this is a short run, the Jade Vow are always waiting. You never know when they will hit next. Sometimes I think I should change companies to Kishiro, although that would be disgraceful to my employer. At least Kishiro captains don’t have to worry so much about pirates.</TEXT><PARA/><POP/></RDL>'''
1864 = '''<RDL><PUSH/><TEXT>Just between you and me, the real reason Samura doesn’t want Republican landing on Yokohama is that the Samura use the Hogosha to steal shipbuilding supplies here. It’s always cheaper to steal than to buy, and it keeps costs down. Is it any wonder why they put the foreign commercial shipbuilders out of business?</TEXT><PARA/><POP/></RDL>'''
1865 = '''<RDL><PUSH/><TEXT>We’re here picking up a load of Scrap Metal for Stokes. We dropped off a load of Ship Hull Panels the other day for their commercial transport production here. It doesn’t make any sense to me. We ship these all the way across the Tau Border Worlds, yet they can still produce transports cheaper than Southampton.</TEXT><PARA/><POP/></RDL>'''
1866 = '''<RDL><PUSH/><TEXT>We’ve got a special ship for bringing in the MOX to Orsena from LD-14. Bringing MOX across the Border Worlds is a nail biter, to say the least. Pirates of all types fancy potential bomb-making material.</TEXT><PARA/><POP/></RDL>'''
1867 = '''<RDL><PUSH/><TEXT>Bowex has an exclusive contract with Samura to handle Orsena government MOX and Toxic Waste delivery and disposal. We had to be pretty competitive on our rates, since ALG already has a foothold in Honshu.</TEXT><PARA/><POP/></RDL>'''
1868 = '''<RDL><PUSH/><TEXT>The Yokohama shipyard has been producing all of Orsena’s Naval Forces ships since 100 AS. We have worked hand-in-hand with Samura to forge a great empire. The Jade Vow and the Golden Chrysanthemums are a threat to the peace and stability that Orsena has enjoyed for 800 years.</TEXT><PARA/><POP/></RDL>'''
1869 = '''<RDL><PUSH/><TEXT>The Jade Vow have been focusing more of their attacks on the Hokkaido Jump Gate. They realize that if Hokkaido can be isolated, it will soon fall into their hands. Our expeditionary force in the system is weary of the nonstop combat, heavy losses, and fanatical hatred that the government bureaucrats and Samura share for the enemy.</TEXT><PARA/><POP/></RDL>'''
1870 = '''<RDL><PUSH/><TEXT>The Jade Vow attack us incessantly here, usually from the Kanto Field, but other times from the Chiba. They will also hide behind Kitadake and launch surprise attacks when all of our patrols are out of range.</TEXT><PARA/><POP/></RDL>'''
1871 = '''<RDL><PUSH/><TEXT>Tokyo Command says that once the Jade Vow’ fire is extinguished, all of Orsena will again be in peace and prosperity. I doubt this. The government is almost bankrupt. Arming the GMG during the 80-Years War was very costly for Orsena. The ongoing difficulties around the Chugoku Gate Construction site have created a new burden on the already depleted Treasury.</TEXT><PARA/><POP/></RDL>'''
1872 = '''<RDL><PUSH/><TEXT>The Golden Chrysanthemums have staged several suicide attacks on the shipyard in recent years. They are not considered a threat, unless there are Jade Vow in the area, who will often come to the GC’s assistance in times of trouble. They make a strange alliance, those two.</TEXT><PARA/><POP/></RDL>'''
1873 = '''<RDL><PUSH/><TEXT>The Naval Forces is somewhat uncertain of our relationship with Samura. Kishiro has shown us more promising research in 10 years at our new center in Kansai than Samura ever has at Nansei. They recently offered to build our ships at the Yukawa yard in Honshu. Given their more advanced shielding technology, this is an attractive proposition.</TEXT><PARA/><POP/></RDL>'''
1874 = '''<RDL><PUSH/><TEXT>The GMG acts as our border guard in the Sigma systems. This has been invaluable in reducing overall security costs for Orsena. Otherwise, the </TEXT><TRA italic="true"/><TEXT>Matsumoto</TEXT><TRA italic="false"/><TEXT>  would not be available to patrol the Hokkaido system, which is arguably not of much strategic value to Orsena.</TEXT><PARA/><POP/></RDL>'''
1875 = '''<RDL><PUSH/><TEXT>We will never allow Republican to land at Yokohama, not after all the financial hardship that the Orsena people had to endure during the 80-Years War. Because large amounts of government money were available for advanced weapons research and development, the war did enable us to increase our shielding and cloaking capabilities.</TEXT><PARA/><POP/></RDL>'''
1876 = '''<RDL><PUSH/><TEXT>The Orsena Naval Forces has learned that Helion is developing a new class of super ships far more advanced than that displayed in the Missouri class. However, we have been unable to learn of the secret location. It would be impossible for Helion to conceal its intentions in the Cinderwell system.</TEXT><PARA/><POP/></RDL>'''
1877 = '''<RDL><PUSH/><TEXT>We have a special arrangement with Bowex in Orsena. They are allowed to land at our military shipyard to deliver MOX and remove Toxic Waste. We then transport the two dangerous substances within Orsena space to and from the appropriate bases.</TEXT><PARA/><POP/></RDL>'''
1878 = '''<RDL><PUSH/><TEXT>Most of our structural materials for shipbuilding come from Stokes or Pueblo. Combustion chamber and nozzle materials are supplied by Dornmark. They are transferred at Narita or brought in directly by our ships from Mainz.</TEXT><PARA/><POP/></RDL>'''
1879 = '''<RDL><PUSH/><TEXT>Yokohama is also the site of Samura’s commercial transport assembly. We currently control 70% of the market for Small and Large Transports. Orsena military contracts are not as numerous and lucrative as they once were, so we must be flexible to keep our yards busy.</TEXT><PARA/><POP/></RDL>'''
1880 = '''<RDL><PUSH/><TEXT>I’m just finishing up the trip from Helion. I’d rather stop at Roppongi, but Samura doesn’t land there, so we bring our cargo the last leg. Usually it’s Superconductors or Super Alloys. Samura hauls them too, but they have such a bad pirate problem that we can stay competitive.</TEXT><PARA/><POP/></RDL>'''
1881 = '''<RDL><PUSH/><TEXT>We’ve had problems with stolen goods at Roppongi recently. I’d swear that the cargo container of Superconductors outside is the same one that was lifted from our storage depots a few weeks ago by some Hogosha.</TEXT><PARA/><POP/></RDL>'''
1882 = '''<RDL><PUSH/><TEXT>These Naval Forces types are really secretive here. They won’t let you outside of the docking area or the bar. It’s kind of a run down place — not as nice as I expected. Looks like they’re hurting a bit on maintenance budgets.</TEXT><PARA/><POP/></RDL>'''
1883 = '''<RDL><PUSH/><TEXT>I’m on a crew replacement and supply run for the Chugoku Gate. We’ve been burning through a lot of spare parts and Construction Machinery up there. Nothing like telling some criminals you’re coming to get them by building a trillion credit Jump Gate to the middle of nowhere. We haven’t even begun to build the other side of the pair. Now </TEXT><TRA italic="true"/><TEXT>that’s</TEXT><TRA italic="false"/><TEXT>  going to be a nightmare.</TEXT><PARA/><POP/></RDL>'''
1884 = '''<RDL><PUSH/><TEXT>I’m hoping to transfer to duty in the Tau-23 area soon. It’s not supposed to be much easier, but at least you aren’t in the middle of some nebula with desperate Orsena terrorists fighting to the death — although a bunch of suicidal Ashbound probably ain’t much better. Guess that’s why they call it hazard pay.</TEXT><PARA/><POP/></RDL>'''
1885 = '''<RDL><PUSH/><TEXT>You see Golden C. out there in Hokkaido also. I guess that’s where they’ve got their base. They are just a crazy bunch, in my opinion. Bartender, give me a shot of whiskey for the road.</TEXT><PARA/><POP/></RDL>'''
1886 = '''<RDL><PUSH/><TEXT>Roppongi is nice to visit. The foreigners are polite to us, much better than Orsena would ever be. They have lots of luxury boutiques for all those IC employees here, so we take advantage of the opportunity to shop in relative peace. I hate Ainu. If only I could live in Sablecross again …</TEXT><PARA/><POP/></RDL>'''
1887 = '''<RDL><PUSH/><TEXT>We will continue our fight until a woman leads this country. I do not believe in much of the strange things they preach on Ainu, but one thing is certain. The women of Orsena must be freed of the oppressive yoke of our paternal society. Only then will Orsena move forward again.</TEXT><PARA/><POP/></RDL>'''
1888 = '''<RDL><PUSH/><TEXT>I think it’s time for my afternoon Cardamine break. We sell our cargo here, since they won’t let us land on Tokyo. All the hip Tokyo types come here to get their supply. That’s how we recruit new girls to join the cause.</TEXT><PARA/><POP/></RDL>'''
1889 = '''<RDL><PUSH/><TEXT>Roppongi was established in Sablecross following the resolution of the 80-Years War. Previously we had no physical presence in Orsena, unless one considers all of the Trade Lanes that IC financed here, which the Orsena incorrectly claimed were their own during the trade dispute in the sixth century.</TEXT><PARA/><POP/></RDL>'''
1890 = '''<RDL><PUSH/><TEXT>The Chugoku Jump Gate project has not been insured or sanctioned by IC. We view the Hokkaido affair as a deliberate deception plotted by the Orsena government against its own people. They need an enemy such as the Jade Vow to justify their enormous public expenditures incurred when opening up the Hokkaido system for Samura’s personal gain.</TEXT><PARA/><POP/></RDL>'''
1891 = '''<RDL><PUSH/><TEXT>Orsena would have minimal criminal problems if the government had agreed to some of the reforms proposed by Blood Dragon and Golden C. sympathizers some time ago. But they refuse to change their fundamental way of doing business, whether it is looking the other way with the Hogosha or supporting the corrupt Samura.</TEXT><PARA/><POP/></RDL>'''
1892 = '''<RDL><PUSH/><TEXT>We allow the Golden Chrysanthemums to land here, since they do not attack shipping indiscriminately. Their dispute is with the Orsena government and industry, and its stifling, paternalistic traditions. We at IC would view any reforms of Orsena society as beneficial to IC’s interests.</TEXT><PARA/><POP/></RDL>'''
1893 = '''<RDL><PUSH/><TEXT>The most troubling development in this sector is the growing strength of the Ashbound and Rift Captains in Honshu and Sigma-13. The military seems distracted by the Jade Vow, and the GMG is not capable of controlling these Edge Worlds pirates, who are far more vicious and cunning than the Imperial Dornmark Navy ever was.</TEXT><PARA/><POP/></RDL>'''
1894 = '''<RDL><PUSH/><TEXT>We are currently investigating rumored Farmers Alliance links with Samura. The attacks on Synth Foods transports within Orsena are blatant acts by Samura to discourage foreign competitors who threaten their business. We will press criminal charges against Samura and refuse their use of Trade Lanes within Libertonian space if they are found guilty.</TEXT><PARA/><POP/></RDL>'''
1895 = '''<RDL><PUSH/><TEXT>Our office was planetside on Sablecross before the Trade Lane Dispute of 521. At that time we were evicted from Orsena space. Financial transactions between the Helion and Orsena governments during the 80-Years War led to an amendment in the Sirius Commerce Pact in 710 that allowed us to establish a base in Sablecross. Roppongi was built shortly thereafter.</TEXT><PARA/><POP/></RDL>'''
1896 = '''<RDL><PUSH/><TEXT>We use this station to monitor the Trade Lane network within Orsena, Tau-29, and Sigma-13. The Tau Lanes are most affected by the Ashbound, who seem to have been disturbed by the opening of the Tau-29 Jump Gate in Tau-23. Sigma-13 is threatened by Rift Captains and Ashbound, though the two groups do not seem to be acting in concert.</TEXT><PARA/><POP/></RDL>'''
1897 = '''<RDL><PUSH/><TEXT>Unlike our other House bases, Charter Guild members are not allowed to base themselves on our station, at the request of the Orsena government. So we must make frequent visits to Deshima to communicate with the Guild management — a process that I find distasteful.</TEXT><PARA/><POP/></RDL>'''
1898 = '''<RDL><PUSH/><TEXT>We supply Roppongi with its needs. Being the place this is, that means bringing in Luxury Foods for those IC snobs, who are too lazy to go down to the planet. We also use this as our transfer point for Luxury Goods arriving from Whiteharbor.</TEXT><PARA/><POP/></RDL>'''
1899 = '''<RDL><PUSH/><TEXT>We’re supplying the Jump Gate Parts used in that crazy money pit they call the Chugoku Gate in Hokkaido. We’ve already shipped enough for those Deep Space builders to construct at least two. Guess they’ve had a lot of losses up there.</TEXT><PARA/><POP/></RDL>'''
1900 = '''<RDL><PUSH/><TEXT>They don’t let us ship our cargo directly to Yokohama — go figure — so we stop by here for a little R &amp; R and then do the hop up the yard. Usually we pick up some Niobium in Sablecross for the return trip to Helion.</TEXT><PARA/><POP/></RDL>'''
1901 = '''<RDL><PUSH/><TEXT>Shingawa is Kishiro’s center of operations for all of Sirius. From here we coordinate the dispatch of ships to all corners of the Trade Lane network. This is also the research and manufacturing center for Optical Chip production.</TEXT><PARA/><POP/></RDL>'''
1902 = '''<RDL><PUSH/><TEXT>Kishiro prefers a more focused approach to our businesses than Samura. We left the Food production area centuries ago, because it was clear that the sector was far removed from our core strengths in technology and shipbuilding.</TEXT><PARA/><POP/></RDL>'''
1903 = '''<RDL><PUSH/><TEXT>Unlike Samura in Hokkaido, Kishiro had to pay for the Jump Gates to Sigma-17. We shared the costs with the GMG, who will receive more equitable prices for their Fuel than they ever did with Samura. That is the right way to do business.</TEXT><PARA/><POP/></RDL>'''
1904 = '''<RDL><PUSH/><TEXT>Food from Deshima is transferred here to smaller ships and redistributed to our bases in Honshu and Sigma-19. We also receive regular shipments of Polymers, used in the Optical Chip fabrication process, from our Nago operation in Tau-29.</TEXT><PARA/><POP/></RDL>'''
1905 = '''<RDL><PUSH/><TEXT>We dominate the Honshu system. Samura controls the farmers of Kyushu. Shikoku is more complicated, as it is the one place where there are many foreigners in Orsena. We have exploited the cheap labor rates to open Consumer Goods factories there, much to the dismay of Samura, who once dominated the Orsena domestic market.</TEXT><PARA/><POP/></RDL>'''
1906 = '''<RDL><PUSH/><TEXT>Just between you and me, we intend to abandon the cargo shipping business within a few years. The competition is fierce, and the criminal element is making it more costly to insure our cargo. Look at IC and Ageira. They make incredible profits off of technology monopolies and their licensing. That is the future for Kishiro.</TEXT><PARA/><POP/></RDL>'''
1907 = '''<RDL><PUSH/><TEXT>Kishiro is the technology leader of Orsena. We design and manufacture everything from advanced Engine Components and Optronics to Optical Chips and Gas Miners. We also process and ship raw materials like Hydrocarbons and Polymers.</TEXT><PARA/><POP/></RDL>'''
1908 = '''<RDL><PUSH/><TEXT>We view the Golden Chrysanthemums and Jade Vow as misguided political terrorists who occasionally engage in acts of piracy against our ships. They embody the pent up frustrations that certain elements of Orsena society are feeling towards the glacial pace of change in Tokyo.</TEXT><PARA/><POP/></RDL>'''
1909 = '''<RDL><PUSH/><TEXT>Our company was founded in 91 AS by a man of infinite wisdom named Katsuhiro Kishiro. Kishiro-san is the father of quantum optronics as we know it today. His vision has carried us successfully through the centuries.</TEXT><PARA/><POP/></RDL>'''
1910 = '''<RDL><PUSH/><TEXT>Those Hogosha are nothing but common thieves. Did you know that some of them are technically employees of Samura by day? In their ”off-duty” hours they go and steal from Kishiro and any other competitor of Samura. This kind of behavior is what feeds the terrorists’ justification for their actions.</TEXT><PARA/><POP/></RDL>'''
1911 = '''<RDL><PUSH/><TEXT>We are trying to decipher the Trade Lane and Jump Gate technology that Helion has so closely guarded for many years. Spies tell us that they may have learned how to apply it directly to ships, thus allowing them to instantaneously jump from place to place in the universe without any need for static field generators.</TEXT><PARA/><POP/></RDL>'''
1912 = '''<RDL><PUSH/><TEXT>We see the Hokkaido campaign as a thinly veiled attempt by Samura to force the taxpayers of Orsena to pay for their access to new H-Fuel fields in the Crow Nebula in the name of fighting the threat of the Jade Vow. The government has no intention of ever completing the Chugoku Gate. They will abandon it within the next few years, declaring victory over the evil terrorists.</TEXT><PARA/><POP/></RDL>'''
1913 = '''<RDL><PUSH/><TEXT>Well, here I am. I used to be a bored salary man upstairs. Then they told me about this moonlighting position that involves a little risk. It sounded like a perfect way to change my life, although some of the types you meet on Kabukicho are a little rough for my taste — especially those Bosozoku.</TEXT><PARA/><POP/></RDL>'''
1914 = '''<RDL><PUSH/><TEXT>I’ve got orders to put a little pressure on a Kishiro supplier in Tokyo tomorrow, and then I’m off to a bureaucrat’s office to insure that he has enough money for his annual golf membership at that exclusive course near Tokyo.</TEXT><PARA/><POP/></RDL>'''
1915 = '''<RDL><PUSH/><TEXT>Narita was a great coup by Samura. They engineered some crazy law that required all the Gaijin to land there, and then they intentionally didn’t give them interior storage space. That’s where we come in — redistributing the goods in our favor.</TEXT><PARA/><POP/></RDL>'''
1916 = '''<RDL><PUSH/><TEXT>This base serves as our corporate headquarters and research center for all Samura operations in the Nacre Reach. H-Fuel and Food are also distributed to various Samura bases in the field from here.</TEXT><PARA/><POP/></RDL>'''
1917 = '''<RDL><PUSH/><TEXT>Samura is proud of our tradition as the builder and provider of Orsena. Our Food production units in Orsena and Junyo employ the latest technologies to produce top quality Foods that are more tuned to the sensitive Orsena palate than rough foreign imitations like Synth Paste.</TEXT><PARA/><POP/></RDL>'''
1918 = '''<RDL><PUSH/><TEXT>Privately, I’ve heard that our scientists believe that eating farmed fish fed with the Alien Organisms may have long term health consequences for the Orsena population. We have already noticed some changes among the workers on Junyo and especially Kurile. It would be best if this is kept private, to not create a panic in the populace.</TEXT><PARA/><POP/></RDL>'''
1919 = '''<RDL><PUSH/><TEXT>Samura is the largest corporation in the Nacre Reach. We are a vertically integrated company that produces everything from Fertilizers to Large Transports. We also ship to more locations than any of our competitors.</TEXT><PARA/><POP/></RDL>'''
1920 = '''<RDL><PUSH/><TEXT>The Farmers Alliance was created to combat the unfair business practices and inferior products that Synth Foods has introduced to the Orsena populace. We make occasional contributions to their worthy cause but do not at all condone their somewhat blunt methods.</TEXT><PARA/><POP/></RDL>'''
1921 = '''<RDL><PUSH/><TEXT>The Hokkaido system is now ours. The government funded and constructed the Hokkaido Gates in the name of security, which allows us access to the newly discovered H-Fuel fields there. Then we will be free of the GMG and their new partner, Kishiro.</TEXT><PARA/><POP/></RDL>'''
1922 = '''<RDL><PUSH/><TEXT>Our research laboratory on F deck is devoted to researching the mysterious Alien Organisms. We harvest them on Kurile in the Sigma-17 system for shipment to terraforming activities in Helion and Vespera. They have also proven most useful supporting the fish farming effort in Junyo.</TEXT><PARA/><POP/></RDL>'''
1923 = '''<RDL><PUSH/><TEXT>As far as we’re concerned, they should stop the Chugoku Gate project as soon as possible, as it is a colossal waste of money that only aggravates the Blood Dragon problem. The Jade Vow are an annoyance, but they have served their purpose well. Once the fields in Hokkaido are fully operational, Samura will have a revelation and rethink its views towards the terrorists.</TEXT><PARA/><POP/></RDL>'''
1924 = '''<RDL><PUSH/><TEXT>The Hogosha serve us well. By relieving our suppliers and competitors of extra Commodities in storage, we can keep our costs down and remain clear of suspicion. The occasional Hogosha gets caught, but that is the risk that they take. We will deny any knowledge of the arrangement if they are caught.</TEXT><PARA/><POP/></RDL>'''
1925 = '''<RDL><PUSH/><TEXT>I’m on supply duty. We’re to pick up our basic needs for Kagoshima, just across the Jump Hole in Kyushu. I was an unemployed farmer in Kyushu before I joined up. Samura was good to us through all the tough times — until Synth Foods came along. Then, everything changed. Now I’m here with these criminal thugs.</TEXT><PARA/><POP/></RDL>'''
1926 = '''<RDL><PUSH/><TEXT>We seem to have lots of weapons and supplies. We also have very accurate information on targets that need to be hit, and they aren’t always Synth Foods. I don’t know where our leadership gets the information — it is not my place to know too much.</TEXT><PARA/><POP/></RDL>'''
1927 = '''<RDL><PUSH/><TEXT>The Kanto Field gives us a good position from which to launch attacks against incoming Synth Food convoys from Shikoku. We will be victorious and force them back to Helion. I’ve heard, though, that some Alliance members are also attacking Kishiro ships, which puzzles me.</TEXT><PARA/><POP/></RDL>'''
1928 = '''<RDL><PUSH/><TEXT>We Hogosha are legitimate businessmen. Don’t believe any of those rumors about us stealing supplies from bases and all. As a matter of fact, I just came up from Tokyo with basic necessities. There’s nothing evil in that, is there?</TEXT><PARA/><POP/></RDL>'''
1929 = '''<RDL><PUSH/><TEXT>We help the Farmers Alliance by selling supplies and weapons for their base across the Hole in Kyushu. They’re not exactly an inspired lot. Seem to be pretty much spouting the company line, if you know what I mean.</TEXT><PARA/><POP/></RDL>'''
1930 = '''<RDL><PUSH/><TEXT>We know the holes pretty well in Orsena space. The Hole in this field goes to Kyushu, and then a quick jaunt gets you to Shikoku. In the other direction, it’s pretty much a straight shot to Honshu through the Chiba Field. Watch out for those Jade Vow, though. They can be nasty, especially if you’re running Artifacts for us.</TEXT><PARA/><POP/></RDL>'''
1931 = '''<RDL><PUSH/><TEXT>We have a little deal with the police — no drugs, no problems. Some of the young Bosozoku object to that. They usually get a one-way ticket out of a garbage airlock in short order. The Golden Cs are a different thing. We can’t control those zealots. Misguided feminists, that’s what they are.</TEXT><PARA/><POP/></RDL>'''
1932 = '''<RDL><PUSH/><TEXT>We are Samura’s hired muscle. When something unpleasant needs to be done, we’re the ones to do it. In exchange, they keep the police off our backs and make sure that Artifact smuggling is not taken too seriously in Orsena. We’ve had a long and profitable relationship and see no reason to change our ways.</TEXT><PARA/><POP/></RDL>'''
1933 = '''<RDL><PUSH/><TEXT>Our main business is Alien Artifacts. For some reason, the rich elites of Tokyo and Whiteharbor have always had a fondness for these toys. We used to get them from the GMG, who were the middlemen between us and the Rift Captains. They got greedy, like they all do — started charging too much. So when the </TEXT><TRA italic="true"/><TEXT>Hawaii</TEXT><TRA italic="false"/><TEXT>  opened, we bypassed them and went directly to the source.</TEXT><PARA/><POP/></RDL>'''
1934 = '''<RDL><PUSH/><TEXT>This has been our primary gas production area since 300 AS. It is almost exhausted, but we are hopeful that the new gas miners purchased from Kishiro will enable us to economically mine the lower density clouds remaining.</TEXT><PARA/><POP/></RDL>'''
1935 = '''<RDL><PUSH/><TEXT>Most of the great battlefields from the 80-Years War lay scattered around this system. In 668 we decisively defeated the Dornmark Imperial Navy at the Battle of Yanagi Cloud. After 130 years, ALG and the Junkers are finally removing the hazardous ship debris from that area.</TEXT><PARA/><POP/></RDL>'''
1936 = '''<RDL><PUSH/><TEXT>We are most upset that the Rift Captains have chosen to consort with the Hogosha in the Artifact trade. Our former friends have betrayed us; they are now our enemies. The Junkers give them shelter on their Yanagi base. Once the great cleanup of the debris fields is finished by ALG, we will chase them out of our territory.</TEXT><PARA/><POP/></RDL>'''
1937 = '''<RDL><PUSH/><TEXT>Most of our Gas produced here is shipped to Osaka by Samura, although that will be changing shortly. Supplies are brought in from our Aomori base in the Honshu system. Our Orsena ancestors did not have the advantage of Jump Gates, so the journey took many months.</TEXT><PARA/><POP/></RDL>'''
1938 = '''<RDL><PUSH/><TEXT>You must be careful of the oxygen pockets within Sigma-13. Many ships have stumbled unawares into these dangerous traps over the years. They are interesting phenomena created when an oxygen pocket is protected from the surrounding hydrogen-rich clouds by a shell of inert helium. When a ship enters the area, its engines emit hydrogen that reacts explosively with the surrounding oxygen.</TEXT><PARA/><POP/></RDL>'''
1939 = '''<RDL><PUSH/><TEXT>Samura has betrayed our trust. We made a pact with them centuries ago to simplify the sale and transport of our Gas. They have abused and exploited that agreement. Soon we will be rid of the Samura and will receive a fair market price from Kishiro for all of our H-Fuel.</TEXT><PARA/><POP/></RDL>'''
1940 = '''<RDL><PUSH/><TEXT>Our ancestors are Orsena fishermen that were forced to leave Honshu in the second century, after the fishing stocks became severely depleted. They entered the Crow Nebula in search of something new to harvest. After 20 years of wandering, they found Hydrogen and Helium isotopes that were far more abundant here than anywhere else in the Nacre Reach.</TEXT><PARA/><POP/></RDL>'''
1941 = '''<RDL><PUSH/><TEXT>The Ashbound have entered Sigma-13 in recent times. They are quite similar to the Rift Captains, yet seem to hate them as much as anyone else. They access this system through our own Jump Hole from Sigma-17. We must be more vigilant in our patrols.</TEXT><PARA/><POP/></RDL>'''
1942 = '''<RDL><PUSH/><TEXT>Kruger and the Dornmark Military will never be allowed to enter Sigma-13. Many sons and daughters of the GMG sacrificed their lives to fight the Dornmark invaders during the war. The GMG lost over half of its people during those dangerous times.</TEXT><PARA/><POP/></RDL>'''
1943 = '''<RDL><PUSH/><TEXT>My ship is here to pick up a shipment of H-Fuel bound for the Mainz Outpost in Frankfurt. Dornmark companies are not allowed to ship H-Fuel outside their own systems. I don’t feel comfortable here; the GMG are not true Orsena anymore. Somehow they have changed during their centuries of wandering.</TEXT><PARA/><POP/></RDL>'''
1944 = '''<RDL><PUSH/><TEXT>Samura has made immense profits from the H-Fuel monopoly we have shared with the GMG for over 400 years. Those ungrateful gas miners then betrayed our trust and entered a secret deal with Kishiro. Soon enough, the Hokkaido system will be fully operational, and we can abandon the GMG.</TEXT><PARA/><POP/></RDL>'''
1945 = '''<RDL><PUSH/><TEXT>Samura once dominated gas miner technology, but as in many other areas, we have been complacent and let Kishiro pass us by. That is the real reason that the GMG has decided to switch allegiance to our mortal enemy. Kishiro gas miners will enable them to harvest Gas in areas not considered economically viable.</TEXT><PARA/><POP/></RDL>'''
1946 = '''<RDL><PUSH/><TEXT>Sigma-13 is more dangerous now than at any time since it was reopened after the 80-Years War. The Ashbound and Rift Captains grow stronger everyday. They cannot be bribed or negotiated with like most criminal organizations. We would actually prefer if Republican handled most of the cargo runs through here, but Tokyo and the GMG object.</TEXT><PARA/><POP/></RDL>'''
1947 = '''<RDL><PUSH/><TEXT>You may see Zoners here on occasion. They are a strange breed that one sees at the edge of civilized space. I hear that they have established bases within the Edge Worlds, very close to the heart of the Corsair empire.</TEXT><PARA/><POP/></RDL>'''
1948 = '''<RDL><PUSH/><TEXT>The GMG was secretly backed by the Orsena government during the 80-Years War. It was very costly, but the GMG are our brethren, after all. They provide a protective shield for Orsena space, which allows the military to concentrate on more pressing problems, like securing Hokkaido for Samura.</TEXT><PARA/><POP/></RDL>'''
1949 = '''<RDL><PUSH/><TEXT>We pick up H-Fuel here to deliver to the Atka Research Station in Sigma-17. We then continue on to Freeport 9. The GMG are much like us — wanderers of the stars, who no longer belong on the settled planets.</TEXT><PARA/><POP/></RDL>'''
1950 = '''<RDL><PUSH/><TEXT>You must be very careful of the Rift Captains if you want to go further into the Sigma or Omicron Worlds. If you are not their friend, it is difficult to survive. The Bounty Hunters that prowl the Edge Worlds are brave souls indeed.</TEXT><PARA/><POP/></RDL>'''
1951 = '''<RDL><PUSH/><TEXT>We use the Jump Hole from Sigma-17 to access this system. It is near the southeast oxygen pocket, so you must be very careful. Rift Captains use if frequently, so don’t linger in the Hole area.</TEXT><PARA/><POP/></RDL>'''
1952 = '''<RDL><PUSH/><TEXT>We have been contracted by the Dornmark and Orsena governments to remove the debris remaining from the 80-Years War battlefields. Much of if poses hazards to shipping in the area. The GMG has allowed the Helgoland Scrap Metal shredding and sorting facility to be based in the Yanagi Pocket.</TEXT><PARA/><POP/></RDL>'''
1953 = '''<RDL><PUSH/><TEXT>ALG was reluctant to take this job, but the contract was quite lucrative. It is eerie dismantling all of these tombs of Dornmark sailors. The interiors of the ships look like the day they were destroyed over 130 years ago. There are plenty of bodies still floating about.</TEXT><PARA/><POP/></RDL>'''
1954 = '''<RDL><PUSH/><TEXT>ALG would like to see better relations between Dornmark and Orsena; that’s why we agreed to this job. It has also been the most ambitious salvage operation ever undertaken in the Nacre Reach. Many of these ships were just left as is by the GMG, engines still intact. We will have enough material here to supply ALG needs for years to come.</TEXT><PARA/><POP/></RDL>'''
1955 = '''<RDL><PUSH/><TEXT>We use this base as a stopover point for Toxic Waste and Scrap Metal ships returning from the Yukawa Shipyard in Honshu. We pick up additional Scrap Metal and Toxic Waste collected by the Junkers in this area, and then we continue on to Dortmund.</TEXT><PARA/><POP/></RDL>'''
1956 = '''<RDL><PUSH/><TEXT>We let the Junkers handle the dirty work of removing most of the Scrap and Toxic Waste. They don’t seem to be bothered by the often gruesome nature of their daily work. Organic material is brought here for incineration in our furnaces. So far, they’ve removed about 30% of the debris — not in much of a hurry.</TEXT><PARA/><POP/></RDL>'''
1957 = '''<RDL><PUSH/><TEXT>I feel very far from home here. The comforting sight of the Walker Nebula is nowhere to be seen in the blue expanse of the Crow. One can get lost in here quite easily. I’ve heard there are old Dornmark ships scattered throughout this system that no one has found yet.</TEXT><PARA/><POP/></RDL>'''
1958 = '''<RDL><PUSH/><TEXT>It’s a lonely job out in this station. ALG does not ship across any other Border World areas. I’ve seen Rift Captains and Ashbound in the area. They appear to be headed for the Junker base. The odd Zoner passes through on occasion, headed out to the Edge Worlds. They’re harmless.</TEXT><PARA/><POP/></RDL>'''
1959 = '''<RDL><PUSH/><TEXT>Beware of the oxygen pockets in this area. The GMG used them with devastating effects against the Dornmark fleet during the war. There’s a big one in the clouds just to the east of our base. Rumor has it there’s a Hole to Sigma-17 on the other side of it.</TEXT><PARA/><POP/></RDL>'''
1960 = '''<RDL><PUSH/><TEXT>ALG is a very progressive company that treats its workers properly. We don’t expose them to excessive danger like Daumann. For this reason, we let the Junkers do most of the difficult work here in the Yanagi Debris Field. It is just too dangerous for our employees.</TEXT><PARA/><POP/></RDL>'''
1961 = '''<RDL><PUSH/><TEXT>I’m just unloading some Scrap collected from the hulk of the </TEXT><TRA italic="true"/><TEXT>Koblenz</TEXT><TRA italic="false"/><TEXT>. That was some famous Dornmark Navy ship. It’s just an old wreck now. It gets kind of spooky in some of those interior deck areas. You get bodies floating out sometimes when you rip open a sealed compartment with your claw. They’re all sort of mummified. That’s why the ALG guys won’t go in there.</TEXT><PARA/><POP/></RDL>'''
1962 = '''<RDL><PUSH/><TEXT>ALG wants us to retrieve the reactor cores. That’s dangerous business, that is. We’ve had to upgrade our shields substantially to deal with the dangers out here. It sure helps if you wander into one of those oxygen pockets. That’s where all the good stuff is.</TEXT><PARA/><POP/></RDL>'''
1963 = '''<RDL><PUSH/><TEXT>We’re taking our time. That was the plan all along. GMG wants us out of here as soon as possible, but that would create problems for our little import/export business of Artifacts and Cardamine.</TEXT><PARA/><POP/></RDL>'''
1964 = '''<RDL><PUSH/><TEXT>We’ve recovered some interesting items of historical interest from the ship debris fields, I reckon. They should fetch a good price back in Ironreach among those nostalgic aristocrats. I found an officer’s Side Arm yesterday, one of those old Daumann 620 series 15 mm Auto-Blasters.</TEXT><PARA/><POP/></RDL>'''
1965 = '''<RDL><PUSH/><TEXT>It makes me wonder how Dornmark messed up the Yanagi campaign so badly. They had a huge advantage in ships and men. Chalk it up to imperial arrogance and a lack of appreciation for the local terrain.</TEXT><PARA/><POP/></RDL>'''
1966 = '''<RDL><PUSH/><TEXT>Our base is tucked away just inside the south edge of the Yanagi Debris Field. You should stop by for a drink sometime. Watch out for those Ashbound and Rift Captains, though. They can get a bit testy.</TEXT><PARA/><POP/></RDL>'''
1967 = '''<RDL><PUSH/><TEXT>It’s nice having a comfortable base from which to stage attacks on the Trade Lanes here. With all of the nebula clouds and lack of military patrols, the ships are easy targets. The Artifact run is long from Crete. We deserve a little rest and recreation.</TEXT><PARA/><POP/></RDL>'''
1968 = '''<RDL><PUSH/><TEXT>The Rift Captains would be far more numerous and powerful if we didn’t have so many senseless traditions that result in the death of so many of our energetic youth. The war with the Hessians is not going well; we are losing the war of attrition. We hope that the increased food supply promised by the expansion of Freeport 9 will enable our new population growth plans to succeed.</TEXT><PARA/><POP/></RDL>'''
1969 = '''<RDL><PUSH/><TEXT>There is a Jump Hole into Honshu in the northern end of this system just west of the Jump Gate. Beware of the oxygen pocket, though, and stay well to the west until you are even with the Gate.</TEXT><PARA/><POP/></RDL>'''
1970 = '''<RDL><PUSH/><TEXT>Welcome to our little corner of hell. I just brought in a new shipment of Daumann 20 mm 1200 series Side Arms yesterday from Kreuzberg. That model has a special new recoil-absorption feature to reduce the kick a bit. It’s fresh off the assembly line in Berlin, direct to you. Very popular with the Rift Captains and Ashbound.</TEXT><PARA/><POP/></RDL>'''
1971 = '''<RDL><PUSH/><TEXT>This is our most strategic base in the entire sector. The Cinder Guard block the Corsair Artifact trade to the south of Dornmark, and Cardamine would be too expensive if it had to be smuggled across Helion and the south Independent Worlds to get to Hamburg.</TEXT><PARA/><POP/></RDL>'''
1972 = '''<RDL><PUSH/><TEXT>There’s a Hole from Sigma-17 into this area. It’s just behind the oxygen pocket at the southeastern end of the system. That’s where the Rift Captains come in.</TEXT><PARA/><POP/></RDL>'''
1973 = '''<RDL><PUSH/><TEXT>We bring in special supplies for the Rift Captains and Ashbound, like Hull Panels, Engine Components, and Optronics. I guess they have their own shipyards out there at the edge of everything.</TEXT><PARA/><POP/></RDL>'''
1974 = '''<RDL><PUSH/><TEXT>You’d figure the Ashbound and Rift Captains were blood brothers or something, with their common heritage and all. You’d be wrong. They hate each others’ guts. We’ve had to establish a no-fire zone around the base area with all the death matches we had going on. Inside we’ve got rules: all Side Arms get checked at the door— no exceptions.</TEXT><PARA/><POP/></RDL>'''
1975 = '''<RDL><PUSH/><TEXT>The Hole that the Ashbound use to Sigma-19 is up towards the northeast, just beyond the GMG gas fields. The GMG is always patrolling it, but it’s easy for the Ashbound to lose them if they can get past the initial patrol.</TEXT><PARA/><POP/></RDL>'''
1976 = '''<RDL><PUSH/><TEXT>The Scrap Metal and Toxic Waste business is just our cover to allow us to operate in this somewhat hostile GMG territory. If they knew what we were really doing on this base with the criminal element, we’d be kicked back to Berlin in a second.</TEXT><PARA/><POP/></RDL>'''
1977 = '''<RDL><PUSH/><TEXT>This is the termination point for the Outcast and Corsair smuggling runs in this sector. The Cardamine comes in from the Outcast systems north of Sigma-19. The Artifacts come from the other direction along the southeastern boundary of the Edge Nebula. That’s Corsair country down there.</TEXT><PARA/><POP/></RDL>'''
1978 = '''<RDL><PUSH/><TEXT>We had a murder last week. Some Corsair woman had a little poisoned dart ring on her finger, but the bouncer didn’t catch it. An Outcast got drunk at the bar, started getting a little aggressive, and she slapped him. Before you know it, he’s on the ground writhing in spasms. Now that’s not very ladylike, is it?</TEXT><PARA/><POP/></RDL>'''
1979 = '''<RDL><PUSH/><TEXT>We get the odd Zoners in here. They prefer to stay out of the house systems. Usually they’re just picking up supplies for their Freeport out there in Omicron Theta. That lot likes living on the ragged edge, and you’ll find it in the Omicron systems.</TEXT><PARA/><POP/></RDL>'''
1980 = '''<RDL><PUSH/><TEXT>This is a very convenient exchange location for us. There’s no exposure to house military or police, and it’s not far from home — so we don’t develop withdrawal symptoms like on the Vespera-Helion runs. The GMG is a little annoying, but we can manage.</TEXT><PARA/><POP/></RDL>'''
1981 = '''<RDL><PUSH/><TEXT>Our closest base is Ruiz in Omicron Beta. Since you’re friendly enough for me to be telling you this, you should visit us up there and bring some supplies. Engine Components and Optronics are always in demand.</TEXT><PARA/><POP/></RDL>'''
1982 = '''<RDL><PUSH/><TEXT>Stay clear of the Rift Captains. You won’t win any points with us by flying with them. They are a dangerous threat to our territory and must be contained in the southern Sirius before they spread to the north, which is our domain.</TEXT><PARA/><POP/></RDL>'''
1983 = '''<RDL><PUSH/><TEXT>I’m just picking up supplies for Freeport 9. We have a big biodome operation out there that always need more Fertilizers and Terraforming Gases. It would be nice if we could find a real planet to live on, instead of those biodomes.</TEXT><PARA/><POP/></RDL>'''
1984 = '''<RDL><PUSH/><TEXT>I’ve never seen a planet; I’ve spent my whole life in this area of the Nacre Reach. The Edge Nebula is a dangerous and mysterious place. There are many stories in the Corsair and Zoner folklore of strange alien ships that appear out of the mists, and then disappear in another instant.</TEXT><PARA/><POP/></RDL>'''
1985 = '''<RDL><PUSH/><TEXT>The Rift Captains and Ashbound are such violent people. I don’t know where they went so wrong. Their need for space is something that we Zoners share. We have settlers always pushing further into the dark edges of Sirius. One day we will find our own homeland out there, free from the rule of the corrupt governments and corporations of the colonies.</TEXT><PARA/><POP/></RDL>'''
1986 = '''<RDL><PUSH/><TEXT>I haven’t really put many inmates in this prison; that’s more of a police job. The chaps that I’ve collected my bounties on are dead. It’s just easier like that and that’s how most companies prefer ’em.</TEXT><PARA/><POP/></RDL>'''
1987 = '''<RDL><PUSH/><TEXT>I used to collect lots of bounties on the Mollys who’d attack the ship trying to free their mates. Not anymore. I hang out at this base to hear about incoming convoys of newly captured prisoners. That’s where they try to make the breaks these days.</TEXT><PARA/><POP/></RDL>'''
1988 = '''<RDL><PUSH/><TEXT>My first trip to the Newgate I spent some time wearing a number. I decided then to go straight. After I finished serving my time I knew I’d never come back — not as a prisoner at least.</TEXT><PARA/><POP/></RDL>'''
1989 = '''<RDL><PUSH/><TEXT>I may be a Vesperan Bounty Hunter, but I’ve been making a lot of good money from a Helion company. Ageira is paying me big bucks to dust any Lane Hackers that I catch in this system.</TEXT><PARA/><POP/></RDL>'''
1990 = '''<RDL><PUSH/><TEXT>If you find Mollys in this system, they are either sitting here doing time or they came through the Leeds Jump Hole. That Hole is tucked away nicely in the Birmingham Ice Field.</TEXT><PARA/><POP/></RDL>'''
1991 = '''<RDL><PUSH/><TEXT>I sat down at a bar in Piccadilly once and met the only man to escape from this prison — Willy Logan. It took him ten years to make his vac-suit, and then he escaped through the waste disposal system and was flushed into space with the garbage.</TEXT><PARA/><POP/></RDL>'''
1992 = '''<RDL><PUSH/><TEXT>The Sheffield is a large distribution point for Commodities in Vespera. Since it is so close, we bring basic supplies to this base from there.</TEXT><PARA/><POP/></RDL>'''
1993 = '''<RDL><PUSH/><TEXT>It may be nearby, but I have close calls running Pharmaceuticals and Side Arms here from Sheffield all the time. On the last run I almost got vaped by some Ashbound.</TEXT><PARA/><POP/></RDL>'''
1994 = '''<RDL><PUSH/><TEXT>We use a lot of Oxygen and Water at this base, so Bowex ships additional supplies from Birmingham, a large producer of Commodities in this part of Vespera.</TEXT><PARA/><POP/></RDL>'''
1995 = '''<RDL><PUSH/><TEXT>The run that I make for Bowex is the only one that brings supplies to this base from outside of Manchester. H-Fuel from Cambridge is shipped regularly to this base.</TEXT><PARA/><POP/></RDL>'''
1996 = '''<RDL><PUSH/><TEXT>This ship, the Newgate Deep-Max Penitentiary Vessel, is a high-security prison for the worst of the Vesperan criminals. The terrorists, serial felons, escape artists, and others too dangerous to house planetside come here.</TEXT><PARA/><POP/></RDL>'''
1997 = '''<RDL><PUSH/><TEXT>I am paid to kill Mollys near this base, but that may change. A group of BMM executives got mashed by a giant ice cube last week. They were here doing a routine inspection, and on their way back, their ship collided with an ice asteroid. The word is that the Gaians towed it into the Trade Lanes.</TEXT><PARA/><POP/></RDL>'''
1998 = '''<RDL><PUSH/><TEXT>Did you hear about the transport that got blown open just outside this base a short while ago? I found them fighting off a couple of Ashbound that they must have dragged in from the Trade Lanes. I got there too late. Just as I was about to engage the Ashbound, the transport’s engines went critical. Too bad, I knew the pilot; he was a good guy.</TEXT><PARA/><POP/></RDL>'''
1999 = '''<RDL><PUSH/><TEXT>Peace is maintained in this system by the police and the Bounty Hunters. The Vesperan Armed Forces keep a battleship, the </TEXT><TRA italic="true"/><TEXT>Essex</TEXT><TRA italic="false"/><TEXT>, in a nearby system, but it is up to us to regulate order here.</TEXT><PARA/><POP/></RDL>'''
2000 = '''<RDL><PUSH/><TEXT>The Mollys hit the Trade Lane between here and the Larkspur Jump Gate quite frequently. I specialize in killing Mollys. My brother was onboard the Newgate as an inmate when Mollys attacked it trying to free one of their own. He got killed in the raid, with only six months left to serve.</TEXT><PARA/><POP/></RDL>'''
2001 = '''<RDL><PUSH/><TEXT>I was patrolling the Sheffield North a few weeks ago when I stumbled across three Lane Hackers. They were caught by surprise, too busy waiting on a Gold shipment that was coming by. I bagged one of them before they knew what hit ’em. The other two punched it for the Jump Hole to Magellan and escaped.</TEXT><PARA/><POP/></RDL>'''
2002 = '''<RDL><PUSH/><TEXT>The basic supplies produced at this base are shipped to every other base in this system. A Bowex pilot needs to be able to enter a Trade Lane in cruise speed. It’s not easy, but necessary when pirates are near.</TEXT><PARA/><POP/></RDL>'''
2003 = '''<RDL><PUSH/><TEXT>Polymers are a valued Commodity in Helion. Those produced here are shipped to the Cinderwell shipyards. The Helion Navy is responsible for patrolling the Independent Worlds, but I can tell you her fleet ain’t big enough to get the job done.</TEXT><PARA/><POP/></RDL>'''
2004 = '''<RDL><PUSH/><TEXT>Polymers and Hydrocarbons are shipped regularly to Los Angeles from this base. The trip through the Independent Worlds is a white-knuckle affair that leaves my nerves a little more shot each time.</TEXT><PARA/><POP/></RDL>'''
2005 = '''<RDL><PUSH/><TEXT>Terraforming Gases make their way to California Minor aboard Planetform transports that leave regularly from this base. Crossing the Independent Worlds isn’t a picnic, but terraforming is the future in Sirius, so I’m proud to do it.</TEXT><PARA/><POP/></RDL>'''
2006 = '''<RDL><PUSH/><TEXT>Planetform has just increased bounties for Gaians in this system. Their attacks are becoming more accurate and frequent. I believe if they could just understand exactly what it is we are doing and why, they would cease their attacks against us.</TEXT><PARA/><POP/></RDL>'''
2007 = '''<RDL><PUSH/><TEXT>The Terraforming Gases produced here are kept in open depots next to this base so that they stay cooled to space temperature. Unfortunately, these open gas depots are very tempting for Gaians.</TEXT><PARA/><POP/></RDL>'''
2008 = '''<RDL><PUSH/><TEXT>This base is a major distribution point in this part of Vesperan space. Aside from a small police outpost, this is the last stop before hitting the Independent Worlds.</TEXT><PARA/><POP/></RDL>'''
2009 = '''<RDL><PUSH/><TEXT>This base’s location between the two major ice fields in this system leaves us with plenty of options. All kinds of scumbag criminals come into this system. You name it, we got it: Mollys, Gaians, Ashbound, and even Lane Hackers. Most of the action takes place north of the Trade Lanes, except the occasional Molly raid on the Newgate.</TEXT><PARA/><POP/></RDL>'''
2010 = '''<RDL><PUSH/><TEXT>Your past does not matter when you become a Bounty Hunter. Once you join the Guild, all is forgotten. For many it is the only chance they have to turn their lives around. I’m not saying life is all roses from that point on — far from it — but it’s better than going back to the Newgate.</TEXT><PARA/><POP/></RDL>'''
2011 = '''<RDL><PUSH/><TEXT>Ashbound come into this system via the Magellan Jump Hole, so if you are looking to bag an Outcast, then I suggest you look in the Sheffield North. Be careful — Ashbound are pretty touchy with a hold full of Cardamine and have no problem blowing a hole in your ship.</TEXT><PARA/><POP/></RDL>'''
2012 = '''<RDL><PUSH/><TEXT>There are two Jump Holes in this system. The Hole to Leeds is in the Birmingham Ice Field; the Hole to Magellan is in the southern part of the Sheffield North Ice Field.</TEXT><PARA/><POP/></RDL>'''
2013 = '''<RDL><PUSH/><TEXT>There is a law in the Charter Guild that must never be broken. The proper authorities can’t ever be told the location of the Jump Holes. Any Bounty Hunter who breaks this rule is expelled from the Guild, and is usually the victim of an accident.</TEXT><PARA/><POP/></RDL>'''
2014 = '''<RDL><PUSH/><TEXT>My father was a Bounty Hunter and so was his father before him. Dad started taking me hunting with him when I turned fourteen. I’ve been doing this ever since, and I’ve bagged over four hundred criminals in that time.</TEXT><PARA/><POP/></RDL>'''
2015 = '''<RDL><PUSH/><TEXT>The best way to catch a Molly is to use bait. If you can take out one of their engines, the other Mollys are going to stay behind and try to rescue the distressed pilot. That’s when you find out if you are good enough to do this job.</TEXT><PARA/><POP/></RDL>'''
2016 = '''<RDL><PUSH/><TEXT>Lane Hackers do a lot of raiding in this system. They know when the Gold shipments are going to come through, and yellow metal is one of their favorite finds.</TEXT><PARA/><POP/></RDL>'''
2017 = '''<RDL><PUSH/><TEXT>Bowex transports basic supplies from here to the other bases in this system. A lot of the Commodities that come through here are either on their way to Helion or Larkspur.</TEXT><PARA/><POP/></RDL>'''
2018 = '''<RDL><PUSH/><TEXT>Side Arms and H-Fuel are shipped throughout this system from this base. Even though these shipments are staying in the system, the haul is still dangerous.</TEXT><PARA/><POP/></RDL>'''
2019 = '''<RDL><PUSH/><TEXT>From Larkspur Bowex hauls H-Fuel and Pharmaceuticals to meet the large demand at this base. It’s a decent run if you don’t mind when Mollys and Lane Hackers blast holes in your ship.</TEXT><PARA/><POP/></RDL>'''
2020 = '''<RDL><PUSH/><TEXT>Want to travel to California and make lots of cash while you’re at it? Buy Polymers and Hydrocarbons here, ship them to Los Angeles, and then come back with Optical Chips.</TEXT><PARA/><POP/></RDL>'''
2021 = '''<RDL><PUSH/><TEXT>Bowex ships the Optical Chips at this base to Cambridge and Leeds. Either facility will purchase them, so you can take your pick.</TEXT><PARA/><POP/></RDL>'''
2022 = '''<RDL><PUSH/><TEXT>Boron makes it to this base all the way from Breakwater. If you feel like you haven’t had enough adventure, you can always continue your journey to Stokes. They’ll purchase the Boron there.</TEXT><PARA/><POP/></RDL>'''
2023 = '''<RDL><PUSH/><TEXT>We maintain a presence here at this base because a lot of shippers, though they often rely on Bounty Hunters, still want to see the legitimate authorities. We run patrols from this area into the North and South Sheffield.</TEXT><PARA/><POP/></RDL>'''
2024 = '''<RDL><PUSH/><TEXT>The Crown has instituted a work program for the least dangerous criminals at the Newgate. They mine ice in the Sheffield South. I run the patrol from this base, which keeps their mining operation secure from attempted breaks.</TEXT><PARA/><POP/></RDL>'''
2025 = '''<RDL><PUSH/><TEXT>I don’t like being here at this base. I would prefer to be stationed at a police base where there are more of my kind. Several of the Bounty Hunters I have encountered here were criminals that I put away at one time or another.</TEXT><PARA/><POP/></RDL>'''
2026 = '''<RDL><PUSH/><TEXT>I fly a patrol from this base all the way to the Larkspur Jump Gate and back again. Last week I came up against a few Mollys on their way from Birmingham. One of the Mollys escaped, one died, and the third is on a convoy to Newgate.</TEXT><PARA/><POP/></RDL>'''
2027 = '''<RDL><PUSH/><TEXT>All the Cardamine that flows into Helion comes through this system. Have you ever tangled with an Outcast? I and two other police interceptors engaged four of them a few days ago. It was a mistake to go against them with fewer numbers. The other two interceptors got cooked.</TEXT><PARA/><POP/></RDL>'''
2028 = '''<RDL><PUSH/><TEXT>Gaians are a bunch of pansy rich kids who had no problems in their lives, so they decided to create one. Terraforming isn’t anything terrible or unethical. As a matter of fact, it will eventually save Vespera. I take pleasure in wasting or busting them filthy snobs.</TEXT><PARA/><POP/></RDL>'''
2029 = '''<RDL><PUSH/><TEXT>I hate crossing the Independent Worlds. When I signed up for the H-Fuel run from Los Angeles to here I thought it would be an adventure. I’d say it’s closer to a nightmare. Gateway doesn’t pay me enough to get killed.</TEXT><PARA/><POP/></RDL>'''
2030 = '''<RDL><PUSH/><TEXT>I ship Food and Consumer Goods to this base from Kensington. It’s a living, and you only have to jump from one system away. Mollys can be quite a problem on occasion, so be careful if you try it.</TEXT><PARA/><POP/></RDL>'''
2031 = '''<RDL><PUSH/><TEXT>Hauling Pharmaceuticals from Sheffield might be the easiest run that Gateway does. Sure, the pay isn’t great, but I don’t care as long as I have a better chance of making it home.</TEXT><PARA/><POP/></RDL>'''
2032 = '''<RDL><PUSH/><TEXT>Universal Shipping hauls Side Arms to this base from Ember Pier. A portion of our shipment is sold here, and then we continue to Larkspur to sell the rest. You could always do the same, if you are a competent pilot.</TEXT><PARA/><POP/></RDL>'''
2033 = '''<RDL><PUSH/><TEXT>Two of my escorts bought the farm back in Magellan, and so did one of my gunners. Too bad, we had made it all the way from Newark with a full load of H-Fuel without incident until then.</TEXT><PARA/><POP/></RDL>'''
2034 = '''<RDL><PUSH/><TEXT>Our shipping firm brings Trade Lane Parts from Ember Pier. It is a lucrative run. Maybe you could earn some cash and get to see Cinderwell while you’re at it.</TEXT><PARA/><POP/></RDL>'''
2035 = '''<RDL><PUSH/><TEXT>This station is supplied entirely by Bowex. We deliver Side Arms and Food here from Sheffield. Though the distance is short and there are plenty of police and Bounty Hunters patrolling the Trade Lanes, it is still a dangerous run.</TEXT><PARA/><POP/></RDL>'''
2036 = '''<RDL><PUSH/><TEXT>Birmingham provides this base with H-Fuel, Oxygen, and Water. It’s nice running supplies to a police station. You get to know the men and women who are out there protecting you.</TEXT><PARA/><POP/></RDL>'''
2037 = '''<RDL><PUSH/><TEXT>The demand here for H-Fuel is pretty high since patrols are constantly launching from this base. We supplement the H-Fuel supply to this base with deliveries from Cambridge.</TEXT><PARA/><POP/></RDL>'''
2038 = '''<RDL><PUSH/><TEXT>This base was built here to protect damaged ships arriving from the Border Worlds and to patrol the Trade Lanes between the Gate and Sheffield. We see ships in all kinds of conditions. Once a ship that was on fire arrived with no engines. The pilot brought it in using inertia from the Jump Gate.</TEXT><PARA/><POP/></RDL>'''
2039 = '''<RDL><PUSH/><TEXT>I’m glad that we don’t have to patrol into the Independent Worlds. I hear Magellan is a dangerous place. Luckily, that’s a Helion Navy responsibility. From the condition of some of the ships that arrive, I’d say they are understaffed.</TEXT><PARA/><POP/></RDL>'''
2040 = '''<RDL><PUSH/><TEXT>The Ashbound hang around in Sheffield North a lot. I hate pulling that beat. It has the highest mortality rate of any of our patrols. My wingman of six years died a few months ago when his ship smacked an ice asteroid while chasing an Outcast.</TEXT><PARA/><POP/></RDL>'''
2041 = '''<RDL><PUSH/><TEXT>The police in Vespera are nothing like Helion’s LPI. For some reason an idiot Helion Rogue flew into this system once. After he was apprehended he tried to offer me a bribe and was astonished when I turned it down and brought him in.</TEXT><PARA/><POP/></RDL>'''
2042 = '''<RDL><PUSH/><TEXT>Mollys — I hate those vile miscreants with passion. Their lack of regard for human life makes them terrible hypocrites, especially since they were formed to fight the barbarity of BMM. I wish old man Graves had worked all his miners to death before they could revolt.</TEXT><PARA/><POP/></RDL>'''
2043 = '''<RDL><PUSH/><TEXT>I love to watch the Newgate prisoner convoy being loaded. You should see the looks on the criminals’ faces when they trudge aboard the ship that takes them to the worst place in Vespera. They aren’t going to be going anywhere else for a long, long time.</TEXT><PARA/><POP/></RDL>'''
2044 = '''<RDL><PUSH/><TEXT>Liverpool has a proud history of Vesperan police. There are many families that have been police officers at this station for several generations. This station is responsible for over ten thousand C and I’s — that’s captures and incarcerations to the layman.</TEXT><PARA/><POP/></RDL>'''
2045 = '''<RDL><PUSH/><TEXT>The only criminal element that goes south of the Trade Lanes in this system is the Mollys. They are always trying to free their captured brethren, a noble pursuit I suppose. I don’t let that sentiment stop me from doing my job, however. Fewer free Mollys means that more pilots are going to go home to their families.</TEXT><PARA/><POP/></RDL>'''
2046 = '''<RDL><PUSH/><TEXT>Vesperan police are said to be incorruptible, but everyone is human. Even amongst our ranks some decide to break the law. If you are caught taking bribes here at Liverpool, we save you the humiliation of going to Newgate.</TEXT><PARA/><POP/></RDL>'''
2047 = '''<RDL><PUSH/><TEXT>This station is supplied entirely by Bowex. We deliver Side Arms and Food here from Sheffield. It’s not far, but the last delivery almost got destroyed by some marauding Gaians.</TEXT><PARA/><POP/></RDL>'''
2048 = '''<RDL><PUSH/><TEXT>Birmingham provides this base with H-Fuel, Oxygen, and Water. The run is an easy one overall, though you can run into occasional trouble with Mollys.</TEXT><PARA/><POP/></RDL>'''
2049 = '''<RDL><PUSH/><TEXT>The demand for H-Fuel here is pretty high since patrols are constantly taking off from this base. Some H-Fuel deliveries come from Cambridge.</TEXT><PARA/><POP/></RDL>'''
2050 = '''<RDL><PUSH/><TEXT>This station was constructed to protect the convoys traveling through the system from the Border Worlds. The Jump Gate just beyond this station leads to Cortez, which is dangerous space for anyone. Luckily, Cortez is outside of our jurisdiction.</TEXT><PARA/><POP/></RDL>'''
2051 = '''<RDL><PUSH/><TEXT>Our patrol areas focus on the Sheffield North Ice Field and the Birmingham Ice Field. In any one of those areas you will encounter several criminal groups that populate this system, including Mollys, Gaians, Lane Hackers, and Ashbound.</TEXT><PARA/><POP/></RDL>'''
2052 = '''<RDL><PUSH/><TEXT>We here at Kingston have an ongoing rivalry with Liverpool. Both stations’ police are constantly trying to outdo each other by bringing in more arrests, killing more uncapturables, and so on. The competition is really healthy.</TEXT><PARA/><POP/></RDL>'''
2053 = '''<RDL><PUSH/><TEXT>The two rookies that we got in here a couple of weeks ago both got killed on their first patrol. The veteran who was with them barely made it back himself. Those vicious Ashbound simply have no mercy. We’ll be getting in two more rookies in the next few days.</TEXT><PARA/><POP/></RDL>'''
2054 = '''<RDL><PUSH/><TEXT>Gaians frequently attack the Trade Lanes near our base. They are always trying to take down Planetform shipments and steal supplies. Although they are pretty easy kills, there are plenty of them here. The Bounty Hunters get more money for Mollys, so it’s more of a police issue.</TEXT><PARA/><POP/></RDL>'''
2055 = '''<RDL><PUSH/><TEXT>The Gaians are getting too smart for their own good. We’ve heard reports that they are towing ice asteroids from Birmingham into the Trade Lanes. If this is true, then the Gaians just bit off more than they can chew. One thing the Crown will not stand is the blocking of Trade Lanes, and more companies are going to start increasing bounties.</TEXT><PARA/><POP/></RDL>'''
2056 = '''<RDL><PUSH/><TEXT>I wish I knew how the Ashbound and Lane Hackers are getting into this system. They don’t come through the Jump Gates, that’s for certain, unless it’s some kind of crazy Lane Hacker technology we don’t know about.</TEXT><PARA/><POP/></RDL>'''
2057 = '''<RDL><PUSH/><TEXT>I worked hard all my life to save up the money to put my boy through college so he can be more than I ever had the chance to be. And what happens? The worthless idiot gets caught up in the Gaian movement in Cambridge. When he told me, I pulled him right out of school and sent him to work with a cousin of mine in Larkspur.</TEXT><PARA/><POP/></RDL>'''
2058 = '''<RDL><PUSH/><TEXT>Ever hear of Willy “The Snake” Logan, the famous escape artist people say cracked himself out of Newgate? It ain’t true — he didn’t make it, he got out of Newgate, but was picked up by the Mollys. They buried a pick axe in his chest for some wrongs he did to their people on the inside. That’s what one of the Mollys I captured told me, anyway.</TEXT><PARA/><POP/></RDL>'''
2059 = '''<RDL><PUSH/><TEXT>The IMG base is somewhere in the Malvinas Cloud. That’s the area I’m supposed to hang out in when I’m not here refitting and refueling. I don’t envy those miners. If the Ashbound figure out where the base is, there are going to be lots of dead miners floating around.</TEXT><PARA/><POP/></RDL>'''
2060 = '''<RDL><PUSH/><TEXT>BMM hired me to kill Ashbound. I’m glad I’m not a company man; they’re pretty dirty. They paid me extra to use an IMG identifier on my ship. That way it will look like IMG is attacking them.</TEXT><PARA/><POP/></RDL>'''
2061 = '''<RDL><PUSH/><TEXT>Every once in a while I can find a little Cardamine among the debris of the Outcast ships I destroy. That’s why I hunt them and not Rift Captains. They pay about the same, but killing the mask breathers has perks.</TEXT><PARA/><POP/></RDL>'''
2062 = '''<RDL><PUSH/><TEXT>The Bermejo Cloud hides the Jump Hole that leads to the Outcast home world. There are a few Bounty Hunters that will go into Omicron Alpha, but I’m not one of them. What good is money if you aren’t alive to spend it? In there it’s a different game.</TEXT><PARA/><POP/></RDL>'''
2063 = '''<RDL><PUSH/><TEXT>If you want to know the best place to hide in Omicron Alpha, it’s in the wreckage of the </TEXT><TRA italic="true"/><TEXT>Perihelion</TEXT><TRA italic="false"/><TEXT>. That’s the ship the Ashbound came to Sirius in. They’ve pulled most of the salvage out of there, but you can still find stuff. You didn’t know this old Bounty Hunter was educated, did you?</TEXT><PARA/><POP/></RDL>'''
2064 = '''<RDL><PUSH/><TEXT>I used to hunt in Omicron Alpha. Stay on the northern and southern edges of the system to avoid trouble. Move to the fringes of more populated areas and hit the stragglers. If more than a few of them spot you, get out of there fast.</TEXT><PARA/><POP/></RDL>'''
2065 = '''<RDL><PUSH/><TEXT>Almost all of the basic supplies used in Falkland are brought there by us from this base. It’s a dangerous run because we could be discovered by the Ashbound. If they followed us back to our base, we would all be killed.</TEXT><PARA/><POP/></RDL>'''
2066 = '''<RDL><PUSH/><TEXT>An identifier from one of our destroyed ships came back online a few days ago. That is very strange, since we are certain that the ship was destroyed. Whoever pirated the ship I.D. is a cruel deceiver. The dead pilot’s wife has been frantic hoping he’s still alive since the signature came back up.</TEXT><PARA/><POP/></RDL>'''
2067 = '''<RDL><PUSH/><TEXT>The toughest and bravest miners in all of Sirius work at the Falkland. Death looms over all of our heads every day, but we have a good hiding spot and the Niobium profits are incredible.</TEXT><PARA/><POP/></RDL>'''
2068 = '''<RDL><PUSH/><TEXT>The IMG followed the Zoners into this system; they are chasing the Niobium deposits in the asteroids that litter the space here. For now they have managed to elude us, but when we find that base none shall be spared. Those people should not have come here. They offer us nothing but trouble, so there can be no mercy.</TEXT><PARA/><POP/></RDL>'''
2069 = '''<RDL><PUSH/><TEXT>Many of the components that we use to build our ships come from this base. It is one of the reasons we let the Zoners live here. Ship Hull Panels, Construction Machinery, and Polymers are only a portion of the goods we ship to Malta.</TEXT><PARA/><POP/></RDL>'''
2070 = '''<RDL><PUSH/><TEXT>We use this base as a stopover for Cardamine shipments running between Malta and Cali. There was a time when we attacked this place and hunted the Zoners, because they were too close to us. After a while we realized that it was a convenience for us to have them here, so for now the Zoners enjoy relative safety.</TEXT><PARA/><POP/></RDL>'''
2071 = '''<RDL><PUSH/><TEXT>The Jump Hole to Malta is well hidden because of all the cloud in this system. This part of Sirius is also very isolated from the colony Houses. That’s why we didn’t discover each other for so long. Now Sirius just seems to keep getting smaller. I suppose that is alright as long as our Cardamine continues to sell.</TEXT><PARA/><POP/></RDL>'''
2072 = '''<RDL><PUSH/><TEXT>We get almost all of our basic supplies from Freeport 6 in Tau-29. Most importantly, we receive Fertilizers and Terraforming Gases for our biodome. In return we ship Freeport 6 Alien Organisms and Food.</TEXT><PARA/><POP/></RDL>'''
2073 = '''<RDL><PUSH/><TEXT>The Zoners at this base tell me it used to be very dangerous to live here. The Ashbound would often attack them. Eventually, they realized that this base was an asset to them. Maskers come here to refuel and resupply on their way in and out of Malta.</TEXT><PARA/><POP/></RDL>'''
2074 = '''<RDL><PUSH/><TEXT>I’m originally from Freeport 5. I made the mistake of falling in love with a Corsair woman. Once her father learned of our love he sent her away, and her brother is looking for me. If he finds me he’ll kill me. That’s why I came to this base. I knew if anyone could kill a Corsair it would be an Outcast. I crossed all of Sirius to hide here.</TEXT><PARA/><POP/></RDL>'''
2075 = '''<RDL><PUSH/><TEXT>When we came here we had saved up enough money to build a biodome, which is what saved us all from the Ashbound — that and the fact that we mind our own business. I just wish that Bounty Hunters wouldn’t land here, because it sets the maskers on edge.</TEXT><PARA/><POP/></RDL>'''
2076 = '''<RDL><PUSH/><TEXT>I used to be a soldier in the Vespera Armed Forces. I left Vespera and came to this place where I make a difference and feel that I belong. When this base was first established I was commander of Freeport 10’s base defenses. Now that the Ashbound don’t attack us, I help out in the biodome.</TEXT><PARA/><POP/></RDL>'''
2077 = '''<RDL><PUSH/><TEXT>As a Zoner we must accept all kinds, but those Ashbound give me the chills. A few months ago a Bounty Hunter flew in here, his ship torn to pieces. The Hunter was hurt pretty bad and wasn’t going to live very long. The Ashbound were making bets on the other side of the bar on when he would die.</TEXT><PARA/><POP/></RDL>'''
2078 = '''<RDL><PUSH/><TEXT>People say that the drug runners have all them nice ships because of all the money the Cardamine brings them. I believe that’s part of the reason, but they think differently than we do. An Outcast just seems to understand how a ship should look and run, like it’s a part of him.</TEXT><PARA/><POP/></RDL>'''
2079 = '''<RDL><PUSH/><TEXT>Some of them Outcast woman sure are fine to look at, but don’t let them catch you giving them the eye. They are all killers, man and woman alike. I heard about one of their women killing a Corsair in a brawl on a Junker base somewhere.</TEXT><PARA/><POP/></RDL>'''
2080 = '''<RDL><PUSH/><TEXT>The most powerful guys in Outcast society are the plantation owners on Malta. They are the ones who run the Cardamine cartels. If you mess with one Outcast, you just picked a fight with the whole family. The two most powerful are the Benitez and Toruella cartels.</TEXT><PARA/><POP/></RDL>'''
2081 = '''<RDL><PUSH/><TEXT>Falkland is supplied almost entirely by the Zoner base in this system. We can’t make supply runs too frequently for fear of being discovered by the Ashbound, and when we do we send our best pilots</TEXT><PARA/><POP/></RDL>'''
2082 = '''<RDL><PUSH/><TEXT>Mining Machinery is brought here from Java. If we are going to leave the system, we will take the Niobium we have mined and deliver it to Freeport 6, where it can be distributed.</TEXT><PARA/><POP/></RDL>'''
2083 = '''<RDL><PUSH/><TEXT>I didn’t sign up for this crap. It’s one thing to make extra pay for coming to this base; it’s another thing to get blown into tiny bits by the meanest criminals in Sirius for time and a half. I’m on the next transport out of here.</TEXT><PARA/><POP/></RDL>'''
2084 = '''<RDL><PUSH/><TEXT>Hey, we don’t get many nonminers here very often. I can’t remember the last time I was outside of this field. What’s your name? Ah, it’s so good to see a new face around here? What’s your name? If I see another chunk of Niobium tonight I’m gonna puke, mate. I’m Willy. What’s your name?</TEXT><PARA/><POP/></RDL>'''
2085 = '''<RDL><PUSH/><TEXT>I made my own vac-suit. Did you know that? Yup, made it myself — took me ten years, it did. It’s a good suit, and I wear it a lot. Hey, what’s your name? I mine Niobium, but I hate it. Maybe I’ll get lucky and some Outcast will blow my head off.</TEXT><PARA/><POP/></RDL>'''
2086 = '''<RDL><PUSH/><TEXT>Some guys around here call me “the Snake,” but I don’t do that any more. No sir, I’m straight as an arrow now. I’m a miner. I mine … Niobium. I like it … Please kill me.</TEXT><PARA/><POP/></RDL>'''
2087 = '''<RDL><PUSH/><TEXT>This place is as far away as you can get from house space. We are in the middle of nowhere unless you count the Ashbound. Me, I don’t give them lads any mind. If they kill us, then they kill us, a man doesn’t control when his ticket gets punched.</TEXT><PARA/><POP/></RDL>'''
2088 = '''<RDL><PUSH/><TEXT>My brother works for BMM. There is no way I would ever do that work. BMM will work you to death and then dock your pay for sleeping on the job when you keel over. I’ve got my pride. I don’t need some damn overseer yelling at me about corporate profits and what not. It’s just me and the Niobium out here.</TEXT><PARA/><POP/></RDL>'''
2089 = '''<RDL><PUSH/><TEXT>Some dirty Bounty Hunter paid me for poor old Rodney’s ship identifier. I didn’t know the jerk would use it right here in this system; I thought he’d be setting traps somewhere else. If they find out I’m the one who sold it to him, the other miners are going to kill me.</TEXT><PARA/><POP/></RDL>'''
2090 = '''<RDL><PUSH/><TEXT>Our sworn enemy is Cryer Pharmaceuticals. Cryer is trying to replicate Cardamine so they can take over the drug market with their harmless alternative. It will be legalized, regardless of how dangerous it is. Their ships in this system or in any Outcast space will be destroyed immediately.</TEXT><PARA/><POP/></RDL>'''
2091 = '''<RDL><PUSH/><TEXT>Once we discovered how to use Alien Organisms, the agriculture on Malta boomed. The creatures make for a kind of super fertilizer that causes the Cardamine grasses to grow twice as fast and become twice as potent. They even allow more Foods to grow on Malta.</TEXT><PARA/><POP/></RDL>'''
2092 = '''<RDL><PUSH/><TEXT>We have lived so long on Malta that our genes have mutated, and now we require Cardamine to live. On Malta it’s in everything: our Food, soil, air, and Water. After a while it got so we needed it. Somehow the Cardamine also had a negative effect on our birth rate. Fewer and fewer Ashbound are being born, though we live much longer.</TEXT><PARA/><POP/></RDL>'''
2093 = '''<RDL><PUSH/><TEXT>Orbital’s </TEXT><TRA italic="true"/><TEXT>Hawaii</TEXT><TRA italic="false"/><TEXT>  liner in Sigma-19 draws a lot of unwanted visitors near our territory. Sometimes we’ll run attacks against the liner if they come too close. It is also a hindrance to our drug trade, because our smuggling route requires us to pass through Sigma-19. There’d be a lot fewer eyes in that system if the </TEXT><TRA italic="true"/><TEXT>Hawaii</TEXT><TRA italic="false"/><TEXT>  weren’t there.</TEXT><PARA/><POP/></RDL>'''
2094 = '''<RDL><PUSH/><TEXT>This is Outcast space, and any ships that come into this system better be welcomed by us. The GMG has been sending ships into our turf looking for Alien Organisms. It’s no doubt they are working for Planetform or Samura, maybe even Cryer. When we catch them we kill them.</TEXT><PARA/><POP/></RDL>'''
2095 = '''<RDL><PUSH/><TEXT>This is the stopover for Cardamine shipments that will be delivered to the Junkers at Yanagi. We get the Cardamine from Malta, where it is processed. Malta is one system over through the northern Jump Hole.</TEXT><PARA/><POP/></RDL>'''
2096 = '''<RDL><PUSH/><TEXT>Junker base Yanagi supplies us here at Ruiz with almost everything we need to keep this place running and our men and women properly equipped. Whatever surplus we bring in goes to our home, Malta. Many of the Commodities we send to Malta will be used to build our attack craft and support Cardamine smugglers.</TEXT><PARA/><POP/></RDL>'''
2097 = '''<RDL><PUSH/><TEXT>The Alien Organisms we get here are sent to Malta to boost our Cardamine cultivation on the plantations. The organisms we don’t need in Malta are shipped to Freeport 10 and sold for extra income.</TEXT><PARA/><POP/></RDL>'''
2098 = '''<RDL><PUSH/><TEXT>The Cardamine we receive here from Malta will be shipped to different destinations throughout Dornmark via Yanagi. I miss the orange grasses swaying softly in the warm winds of my home, but I must do what my Don has asked of me.</TEXT><PARA/><POP/></RDL>'''
2099 = '''<RDL><PUSH/><TEXT>This base trades in Commodities almost exclusively with other Corsair bases. The less we have to deal with outsiders the better. We get our Water and Oxygen from Crete, so this base is almost entirely free from foreign trade. The Zoners are an unwanted presence here, but we tolerate them for now.</TEXT><PARA/><POP/></RDL>'''
2100 = '''<RDL><PUSH/><TEXT>We get some of our basic supplies from the Zoner bases in the area. If it doesn’t come from the Freeports, we get it from Yanagi. Any surplus we get, such as Dornmark Side Arms or Artifacts, is sent to Cadiz.</TEXT><PARA/><POP/></RDL>'''
2101 = '''<RDL><PUSH/><TEXT>This place is mostly a rest spot for Zoners and Rift Captains as they travel along the Edge Worlds. Others land here, but they have to respect our ways. Don’t stay here too long or else we begin to notice that an outsider is walking a Corsair base. Once that happens you use the airlock to leave.</TEXT><PARA/><POP/></RDL>'''
2102 = '''<RDL><PUSH/><TEXT>Hessians come in from Omega-11 and run attack raids on Rift Captains traveling through this system. We lash back with attacks on Diamond shipments in Omega-11. The problem with the Hessians is not that they are skilled or courageous, but their numbers; kill three and five more will replace them.</TEXT><PARA/><POP/></RDL>'''
2103 = '''<RDL><PUSH/><TEXT>This base was established to secure the supply lines that lead from our homeworld to Cadiz in Omega-5. It also protects our shipments arriving from Vespera and the Trade Lanes along the southwestern Edge Worlds. This space is the body of Corsair space. Proceed further and you will touch upon its heart.</TEXT><PARA/><POP/></RDL>'''
2104 = '''<RDL><PUSH/><TEXT>The Jump Holes in this system will lead you throughout southern Sirius: Omicron Gamma is to the east, Omicron Theta is north of the Freeport, Omega-5 is west of here, and Omega-11 lies to the north of this base. I tell you this because you have made yourself useful to us. Should that ever change, I will be one among many whom you will have to watch for.</TEXT><PARA/><POP/></RDL>'''
2105 = '''<RDL><PUSH/><TEXT>Some Zoner at Freeport 5 tried to run away with a Corsair woman. Her family is a laughing stock and will be so until her kin has killed the interloper. Her brother has gone to </TEXT><TRA italic="true"/><TEXT>Hawaii</TEXT><TRA italic="false"/><TEXT>  to sell Artifacts; when he returns he will hunt down the fool Zoner.</TEXT><PARA/><POP/></RDL>'''
2106 = '''<RDL><PUSH/><TEXT>If you ever cheat a Corsair, there is a special punishment that will befall you. Do you know what it is to be marooned? We’ll take you to a deserted chunk of rock in the middle of nowhere and leave you there. Death comes slowly in a vac-suit.</TEXT><PARA/><POP/></RDL>'''
2107 = '''<RDL><PUSH/><TEXT>I’ve come up against Ashbound in Sigma-19 before. They are very good at killing, as are we. Yes, even though they have greater numbers, I prefer to fight Cinder Guard. I may not be afraid of death, but I don’t go looking for it, either.</TEXT><PARA/><POP/></RDL>'''
2108 = '''<RDL><PUSH/><TEXT>I specialize in killing Rift Captains. If you want one dead I can do it for you, but its going to cost you. It’s a family business, really. My father was killing these heartless cretins before me. It’s not easy; these guys are incredible pilots with excellent ships.</TEXT><PARA/><POP/></RDL>'''
2109 = '''<RDL><PUSH/><TEXT>Obviously you have the skills required to survive if you have come to the edges of Sirius. As a Guild instructor I train newbie Bounty Hunters the skills that you and I already have. The first thing I teach them is that becoming a good pilot is a gradual process.</TEXT><PARA/><POP/></RDL>'''
2110 = '''<RDL><PUSH/><TEXT>The trick to killing Rift Captains is catching them off guard. Go into their home system, find a spot to hide, and ambush one or two as they cross in front of you. Once you’ve made your kills get out of there, because more are probably coming.</TEXT><PARA/><POP/></RDL>'''
2111 = '''<RDL><PUSH/><TEXT>I’m following a couple of Rift Captains back from Dublin, where they stole a shipment of Gold. The bounty on these two guys will put me on easy street for months. Once I’m done refueling and resupplying I’m headed into Omicron Gamma.</TEXT><PARA/><POP/></RDL>'''
2112 = '''<RDL><PUSH/><TEXT>The trick to killing Rift Captains is taking them head on. They aren’t used to someone getting in their face and fighting them squarely; it throws them off balance. Then you have the advantage. I know. I’ve killed two Rift Captains already.</TEXT><PARA/><POP/></RDL>'''
2113 = '''<RDL><PUSH/><TEXT>This is my first time in this part of Sirius. I couldn’t believe it when I saw my old instructor here. He told me that knowing the Jump Holes to this system didn’t mean I was ready for them yet. I’m not going home like he said I should I’m good enough for these Rift Captains.</TEXT><PARA/><POP/></RDL>'''
2114 = '''<RDL><PUSH/><TEXT>We bring Artifacts to this base from Crete. It is not as lucrative a run as others, but the Zoners will find buyers for them. Either way we make our money.</TEXT><PARA/><POP/></RDL>'''
2115 = '''<RDL><PUSH/><TEXT>One of the Zoners here at this base fell in love with my daughter. When she told me of her love I sent her back to Crete. She can never return here. My son has gone looking for the man who dishonored my family.</TEXT><PARA/><POP/></RDL>'''
2116 = '''<RDL><PUSH/><TEXT>The Bounty Hunters at this base are fools. Granted, we cannot attack them while they are here, but most of them will soon find themselves in Corsair ambushes when they have left the no-fighting zone that surrounds this place.</TEXT><PARA/><POP/></RDL>'''
2117 = '''<RDL><PUSH/><TEXT>The shipyard Tripoli requires many different Commodities to maintain production of our vessels and raiding crafts. We ship Polymers and Engine Components there from this base.</TEXT><PARA/><POP/></RDL>'''
2118 = '''<RDL><PUSH/><TEXT>One day the Rift Captains may destroy this base if we find we have no more need of it. The Zoners do not realize what kind of people we are. Death is so familiar to a Corsair that delivering it is second nature. It would trouble no Corsair to put every Zoner at this base to the sword.</TEXT><PARA/><POP/></RDL>'''
2119 = '''<RDL><PUSH/><TEXT>Soon I will be headed to Omega-5 to fight the Cinder Guard in that part of Sirius, where it is vital that we gain control. It is every Corsair’s responsibility to fly a tour of duty in the Hessian War.</TEXT><PARA/><POP/></RDL>'''
2120 = '''<RDL><PUSH/><TEXT>People often wonder how Rift Captains can have such excellent ships when they are all pieced together from other stolen and salvaged vessels. Rift Captains are masters of making something from nothing, and we have an advantage. Not all Artifacts are useless; many we recovered offered insight into the science of ship building.</TEXT><PARA/><POP/></RDL>'''
2121 = '''<RDL><PUSH/><TEXT>Every firstborn Corsair carries the family’s ancestral blade. The knife is a symbol of our struggle to live and the solidarity of each line. The blades are made from the remnants of the first ship that landed on Crete.</TEXT><PARA/><POP/></RDL>'''
2122 = '''<RDL><PUSH/><TEXT>Do you know what it means when I tell you that I am a Ventru? I doubt you would understand my full meaning. Travel deeper into our worlds and perhaps then the horrible truth will make itself clear to you.</TEXT><PARA/><POP/></RDL>'''
2123 = '''<RDL><PUSH/><TEXT>We get many of our goods from Freeport 1 in Omega-3. We ship Polymers, Engine Components, and Fertilizers here from that area. The Rift Captains must fight the Cinder Guard to enter that space, but we may pass unhindered.</TEXT><PARA/><POP/></RDL>'''
2124 = '''<RDL><PUSH/><TEXT>Zoner goods flow between this base and Freeport 9 on the other side of Omicron Gamma. The Rift Captains let us pass because we supply them with many of the goods they use themselves.</TEXT><PARA/><POP/></RDL>'''
2125 = '''<RDL><PUSH/><TEXT>Outside of colony space you don’t have the luxury of Jump Gates. You must use Jump Holes to travel between systems. Omega-41 is a crossroads in this part of space. There are Holes that lead to Omega-11 and Omega-5 on the western side and to Omicron Theta and Omicron Gamma in the eastern half.</TEXT><PARA/><POP/></RDL>'''
2126 = '''<RDL><PUSH/><TEXT>There is a very dangerous radiation zone in the center of the system. Even very good shields will not hold up very long in there. Be careful when traveling through that you avoid it, or you may end up dead.</TEXT><PARA/><POP/></RDL>'''
2127 = '''<RDL><PUSH/><TEXT>My son had to flee this base. He had to get as far away from this part of Sirius as he could. He made a terrible mistake and fell in love with a Corsair woman. Though the girl loved him, too, the Rift Captains would never accept such a union.</TEXT><PARA/><POP/></RDL>'''
2128 = '''<RDL><PUSH/><TEXT>The Rift Captains and Cinder Guard have been fighting a vicious war against each other to the west and north of here. As Zoners we do not get involved; we must sell supplies to both sides to make a living. My cousin is a proprietor in Omega-3 and often deals with Cinder Guard.</TEXT><PARA/><POP/></RDL>'''
2129 = '''<RDL><PUSH/><TEXT>To the west are the Sabana Fragments. You can get to Omega-41 from there — a good idea if you are trying to avoid the Rift Captains. They are still all over, since this is their space, but you won’t be going through the Corsair home system.</TEXT><PARA/><POP/></RDL>'''
2130 = '''<RDL><PUSH/><TEXT>I’ve been contracted by Cryer to come down here and kill a few Rift Captains for them. Their base, Atka, got hit a few weeks ago. Usually it’s the Ashbound who hit Atka, but this time it was the Rift Captains. Rift Captains, Ashbound — it doesn’t make any difference to me.</TEXT><PARA/><POP/></RDL>'''
2131 = '''<RDL><PUSH/><TEXT>Head for the cloud south of here and you will find Artifacts, but that’s not why I go there. The cloud to the south hides the Jump Hole to Omicron Gamma. If you do go in there, get ready to fight or you’d better be good at hiding. No matter what you do, don’t stay in there too long, because it’s just a matter of time before your number gets punched.</TEXT><PARA/><POP/></RDL>'''
2132 = '''<RDL><PUSH/><TEXT>I have come to this place looking for a Corsair named Jardin. He is an infamous killer and pirate. Many say he cannot be stopped, but if anyone can drop him, I can. He is just a man, and a man can die, no matter how tough he is.</TEXT><PARA/><POP/></RDL>'''
2133 = '''<RDL><PUSH/><TEXT>My brother joined the Charter Guild a few years ago. He’s not tough enough to take on Rift Captains yet; he should still be popping Rogues. The idiot sent me a message telling me he was ready for the big leagues in southern Sirius. I’m trying to find him before he gets killed.</TEXT><PARA/><POP/></RDL>'''
2134 = '''<RDL><PUSH/><TEXT>I was a Red Hessian for many years. I became pretty good at killing Rift Captains, so I decided to get paid for it. Besides, I had grown weary of piracy. I became a Hessian for political reasons, before they sold out.</TEXT><PARA/><POP/></RDL>'''
2135 = '''<RDL><PUSH/><TEXT>Sigma-17 is the next stop between here and the Junker bases where we offload the Artifacts marked for Dornmark. You’ll find the Jump Hole in the Orinoco Cloud. The other distribution point for our Artifacts is aboard the </TEXT><TRA italic="true"/><TEXT>Hawaii</TEXT><TRA italic="false"/><TEXT>. The Hogosha on that ship will fence our goods into Orsena.</TEXT><PARA/><POP/></RDL>'''
2136 = '''<RDL><PUSH/><TEXT>The Napo Cloud in this system is filled with Artifacts, but the Zoners here know better than to try and get them. Artifacts are Corsair business. The objects we get from that cloud have been funding and feeding the Rift Captains for centuries. You had better be a good friend to us if you decide to go there.</TEXT><PARA/><POP/></RDL>'''
2137 = '''<RDL><PUSH/><TEXT>The Hole that leads to our home system is in the Napo Cloud. Unwanted intruders who get taken alive have it worst of all, we keelhaul them. Try to imagine being in a vac-suit lashed to the outside of a ship that’s headed into a Jump Hole.</TEXT><PARA/><POP/></RDL>'''
2138 = '''<RDL><PUSH/><TEXT>We get many of our basic supplies from this base. The biodomes here provide us with the Food we consume throughout our space. Corsair leadership has decided that the next step for the Corsair Brotherhood is to build our own biodomes so we will never have to worry about Food again.</TEXT><PARA/><POP/></RDL>'''
2139 = '''<RDL><PUSH/><TEXT>The Side Arm you see me carrying came from Yanagi. It’s a Dornmarker piece, because I’m an eastern Corsair. The western Rift Captains get Detroit weaponry from Vespera. The Yanagi Junkers supply this base with Engine Components, too. We use those at Tripoli.</TEXT><PARA/><POP/></RDL>'''
2140 = '''<RDL><PUSH/><TEXT>Felix, of my sons, was killed at Cadiz fighting the Hessians. His brother, Cesar, died during initiation. Cesar was a good pilot and a strong man, but his sensors were damaged. He trusted them instead of his own instincts.</TEXT><PARA/><POP/></RDL>'''
2141 = '''<RDL><PUSH/><TEXT>Just between you and me, I’ll kill the occasional Zoner if he’s alone and there are no witnesses. Why pay for something when you can just take it, eh? They shouldn’t be here anyway. This is dangerous space for anybody, even you. You should be very careful around here, especially with that nice ship and all of your cargo.</TEXT><PARA/><POP/></RDL>'''
2142 = '''<RDL><PUSH/><TEXT>You can’t kill anyone onboard or in the immediate area of a Zoner base. That’s why the Bounty Hunters are still breathing here. I would like nothing better than to walk over to a Bounty Hunter and eliminate them with my Daumann Devastator.</TEXT><PARA/><POP/></RDL>'''
2143 = '''<RDL><PUSH/><TEXT>I will let a ship go if it drops it’s cargo without trouble. If you kill everyone you come across, everyone starts to run, and that means more work. Of course, if they try and get heroic or greedy, I blast them. It works both ways.</TEXT><PARA/><POP/></RDL>'''
2144 = '''<RDL><PUSH/><TEXT>The biodomes we invested in here have paid off in spades. Everyone in this part of space comes here for Food, and we get the profits. Well, us and Synth Foods, of course. We ship Food to Atka in Sigma-17 and Freeport 5 in Omega-41.</TEXT><PARA/><POP/></RDL>'''
2145 = '''<RDL><PUSH/><TEXT>We get many of our goods from the Junkers at Yanagi. Our boats haul Engine Components and Consumer Goods from there.</TEXT><PARA/><POP/></RDL>'''
2146 = '''<RDL><PUSH/><TEXT>We ship the Alien Organisms found in this system to the Cryer base in Sigma-17. Cryer also needs our Polymers, and we return with Pharmaceuticals.</TEXT><PARA/><POP/></RDL>'''
2147 = '''<RDL><PUSH/><TEXT>Our brothers in Freeport 5 send us Polymers, Fertilizers, and Consumer Goods. It’s a Zoner’s duty to help other Zoners where we can. This is a dangerous part of space; only by sticking together can we make it.</TEXT><PARA/><POP/></RDL>'''
2148 = '''<RDL><PUSH/><TEXT>Don’t ask me where the Jump Hole is that leads to the Corsair homeworld. I’ve said too much already. The Rift Captains would cut my throat if I dared to utter where the entrance to their system is. Just stay away from the Napo Cloud. I mean … it isn’t in the Napo Cloud, it’s … I’m a dead man.</TEXT><PARA/><POP/></RDL>'''
2149 = '''<RDL><PUSH/><TEXT>The Artifacts that you can find in this system are not worth taking. We don’t touch them; they are Corsair property. If you think differently, I recommend that you make sure you aren’t behind on your policy payments to IC.</TEXT><PARA/><POP/></RDL>'''
2150 = '''<RDL><PUSH/><TEXT>There were more than four sleeper ships that left for Sirius. Eight ships launched from the Federation dockyards on Pluto those many centuries ago. The Coalition fleet intercepted them before they could activate their jump drives, and three of the sleeper ships were destroyed in Sol. Five ships escaped, four of them might sound familiar: the </TEXT><TRA italic="true"/><TEXT>Helion</TEXT><TRA italic="false"/><TEXT>, the </TEXT><TRA italic="true"/><TEXT>Dornmark</TEXT><TRA italic="false"/><TEXT>, the </TEXT><TRA italic="true"/><TEXT>Vespera</TEXT><TRA italic="false"/><TEXT>, and the </TEXT><TRA italic="true"/><TEXT>Orsena</TEXT><TRA italic="false"/><TEXT>. The fifth was the </TEXT><TRA italic="true"/><TEXT>Perihelion</TEXT><TRA italic="false"/><TEXT>.</TEXT><PARA/><POP/></RDL>'''
2151 = '''<RDL><PUSH/><TEXT>The </TEXT><TRA italic="true"/><TEXT>Perihelion</TEXT><TRA italic="false"/><TEXT>, our sleeper ship that launched from Sol, escaped the Coalition forces undamaged, but there was a saboteur aboard. We had almost made it to Sirius when an explosion woke the crew and her passengers from their stasis sleep. The ship was crippled, adrift in the vastness of interstellar space.</TEXT><PARA/><POP/></RDL>'''
2152 = '''<RDL><PUSH/><TEXT>When the </TEXT><TRA italic="true"/><TEXT>Perihelion</TEXT><TRA italic="false"/><TEXT>  was badly damaged while traveling to the Nacre Reach, the crew had to determine the best way to survive. Half of the crew wanted to abandon ship and make the rest of the journey using </TEXT><TRA italic="true"/><TEXT>Perihelion</TEXT><TRA italic="false"/><TEXT>’s shuttles; the other half believed they could reach Sirius in the </TEXT><TRA italic="true"/><TEXT>Perihelion</TEXT><TRA italic="false"/><TEXT>. Those who chose to stay behind held the ship together until planetfall here on Malta.</TEXT><PARA/><POP/></RDL>'''
2153 = '''<RDL><PUSH/><TEXT>When we arrived on this planet there was nothing but sprawling fields of tall orange grasses. Our first foraging parties often didn’t return. When we sent others after them, we found out why. One becomes severely lacerated after just a few minutes walking through the razor-sharp grasses. If you continue much longer, you eventually bleed to death.</TEXT><PARA/><POP/></RDL>'''
2154 = '''<RDL><PUSH/><TEXT>The orange grasses that cover Malta are the source of Cardamine. Several years after our arrival, one of our scientists discovered how to process the drug into its current form. The grasses are one of a few plants that will grow in such acidic soil.</TEXT><PARA/><POP/></RDL>'''
2155 = '''<RDL><PUSH/><TEXT>The first several years after we arrived were touch and go. Many people starved; others simply gave up and died strung out on Cardamine. They would stare out into the distance — all hope gone from their faces, and purple juice dribbling from their mouths.</TEXT><PARA/><POP/></RDL>'''
2156 = '''<RDL><PUSH/><TEXT>After several centuries when we began to venture back out into space, some of our ships did not return. Eventually we realized the cause: the Cardamine we were exposed to on Malta had slowly altered our genetic code and made us dependent on the drug. The breather masks give us enough Cardamine to survive outside of Malta.</TEXT><PARA/><POP/></RDL>'''
2157 = '''<RDL><PUSH/><TEXT>When the Ashbound discovered the other inhabitants of Sirius we wanted to destroy them. We believe that the sabotage of the </TEXT><TRA italic="true"/><TEXT>Perihelion</TEXT><TRA italic="false"/><TEXT>  was the work of another colony trying to lessen competition for resources. Instead of throwing our lives away in an attack, the Dons decided to seek revenge with the Cardamine. If we can get enough of Sirius hooked, we will rule this space.</TEXT><PARA/><POP/></RDL>'''
2158 = '''<RDL><PUSH/><TEXT>There are other survivors of the </TEXT><TRA italic="true"/><TEXT>Perihelion</TEXT><TRA italic="false"/><TEXT>: the Rift Captains. Once long ago we were brethren, the scourge of southern Sirius. The Cardamine and time have changed us. We share very little in common with Rift Captains now; they have become more our competitors than anything else.</TEXT><PARA/><POP/></RDL>'''
2159 = '''<RDL><PUSH/><TEXT>Malta imports most of its vital Commodities from Yanagi and Ruiz. The Junkers have made our lives on this planet much easier. We have used the riches that Cardamine has made us to build a paradise in place of what was once a prison.</TEXT><PARA/><POP/></RDL>'''
2160 = '''<RDL><PUSH/><TEXT>Many of the components we require to manufacture our ships come from Freeport 10, including Ship Hull Panels, Polymers, and Construction Machinery. More is always needed.</TEXT><PARA/><POP/></RDL>'''
2161 = '''<RDL><PUSH/><TEXT>MOX is always in demand here. We use it for our larger ships, and we have discovered a means of making extremely destructive weaponry from it. Should a large navy enter this system, it would soon be destroyed by our planetary defense missiles. The missiles are a vehicle for chain-reaction, plutonium-tipped warheads.</TEXT><PARA/><POP/></RDL>'''
2162 = '''<RDL><PUSH/><TEXT>The Cardamine cartels ship the drug from this planet to our two distribution centers: Ruiz and Cali. From there it travels throughout Sirius, infecting the populace with the hunger for more of what we have to sell.</TEXT><PARA/><POP/></RDL>'''
2163 = '''<RDL><PUSH/><TEXT>Cardamine is shipped directly to Buffalo in Cinderwell. Cinderwell and Helion offer us the greatest opportunity to exploit the benefits of a Cardamine addicted people.</TEXT><PARA/><POP/></RDL>'''
2165 = '''<RDL><PUSH/><TEXT>An ancient race of beings developed the orange grasses on our planet. The codes within the genetic structure of the grass transform the user slowly. We are not human because we have been given a gift and can see further into truth than any man. Human beings are infants dabbling in the loam of an expansive ocean that stretches beyond the horizon. The Cardamine has let us see this.</TEXT><PARA/><POP/></RDL>'''
2166 = '''<RDL><PUSH/><TEXT>Why have we flourished? Why are our ships so well crafted and designed? We operate on a higher order of being. Many wonder why we take life so easily. It is because this life is just a dream of what truly is. What human beings cherish is an illusion; there is no such thing as death, only change.</TEXT><PARA/><POP/></RDL>'''
2167 = '''<RDL><PUSH/><TEXT>We are the ones who were left behind. We were not meant to survive, but we did, and in doing so we have become much more. The Cardamine has tied us to this planet, but it has changed us into something greater than you can understand. We are destined to rule Sirius one day. It will be our revenge upon those who wished to destroy us.</TEXT><PARA/><POP/></RDL>'''
2168 = '''<RDL><PUSH/><TEXT>Oxygen and Water are produced here in Crete. We supply all the other Corsair bases and the nearby Freeports with those necessities. Any other basic supplies must be imported or stolen.</TEXT><PARA/><POP/></RDL>'''
2169 = '''<RDL><PUSH/><TEXT>If you are trying to get Alien Artifacts into Orsena space, then I recommend you travel to the </TEXT><TRA italic="true"/><TEXT>Hawaii</TEXT><TRA italic="false"/><TEXT>, where the Hogosha will usually take them off your hands.</TEXT><PARA/><POP/></RDL>'''
2170 = '''<RDL><PUSH/><TEXT>There is a demand for Alien Artifacts in Ironreach. The Junkers at Yanagi will purchase our Artifacts and carry them the rest of the way into the Dornmark capital.</TEXT><PARA/><POP/></RDL>'''
2171 = '''<RDL><PUSH/><TEXT>The Artifacts that end up in Whiteharbor usually pass through Vespera’s market first. We export Alien Artifacts to the Junker base Trafalgar. I don’t suppose there would be anything to stop you from doing the same.</TEXT><PARA/><POP/></RDL>'''
2172 = '''<RDL><PUSH/><TEXT>The Artifacts collected in Omicron Gamma are shipped to our various other bases in the adjacent systems. It is good to have a supply of Alien Artifacts throughout Corsair space.</TEXT><PARA/><POP/></RDL>'''
2173 = '''<RDL><PUSH/><TEXT>The supplies we use to run our bases are either stolen or purchased with the money we make from selling stolen goods. The Construction Machinery here is almost all stolen.</TEXT><PARA/><POP/></RDL>'''
2174 = '''<RDL><PUSH/><TEXT>The Artifacts we trade in Yanagi more than pay for the Side Arms, Consumer Goods, and Fertilizers that we bring to this base on our return.</TEXT><PARA/><POP/></RDL>'''
2175 = '''<RDL><PUSH/><TEXT>The proximity of our base Cadiz to the Trade Lanes and Vesperan space makes it a primary source of stolen goods for the Rift Captains. H-Fuel, Pharmaceuticals, and Polymers are frequently shipped here from that base.</TEXT><PARA/><POP/></RDL>'''
2176 = '''<RDL><PUSH/><TEXT>The Zoners at Freeport 5 and Freeport 9 have access to many of the supplies we use at this base. In exchange for the Oxygen and Water we have in abundance here we are able to get all manner of goods.</TEXT><PARA/><POP/></RDL>'''
2177 = '''<RDL><PUSH/><TEXT>We traveled to Sirius on a sleeper ship like everyone else. Our ship, the </TEXT><TRA italic="true"/><TEXT>Perihelion</TEXT><TRA italic="false"/><TEXT>, fell victim to sabotage en route. We were forced to abandon her and make our way through the void. We found this planet with barely enough supplies to feed half of us. Few crops would grow in these infertile sands, and our numbers dwindled to almost nothing.</TEXT><PARA/><POP/></RDL>'''
2178 = '''<RDL><PUSH/><TEXT>The second year after planetfall we ran out of Food. The family leaders gathered together and decided upon a course of action. The Ventru line was chosen, and they gave themselves up to be butchered. Every Corsair is a Ventru, though the line no longer lives, they are a part of us all.</TEXT><PARA/><POP/></RDL>'''
2179 = '''<RDL><PUSH/><TEXT>The Rift Captains are consolidated into family lines that are brought together and strengthened by marriage. Our society is a closed one; we do not wish to dilute our blood with the seeds of weaker men. It is possible to fly with the Rift Captains and to be trusted by us, but an outsider will never marry into the families of Crete.</TEXT><PARA/><POP/></RDL>'''
2180 = '''<RDL><PUSH/><TEXT>Many think our rites of initiation are barbaric, but we can’t feed, clothe, and train every Corsair born. The initiation keeps our population problems in check. At the age of sixteen every Corsair must fly into the radioactive Malvadas Cloud in an unshielded ship and return with an Artifact. Some return as they left, others become sterile, and the rest die.</TEXT><PARA/><POP/></RDL>'''
2181 = '''<RDL><PUSH/><TEXT>The first outsider accepted by the Rift Captains was an independent pilot named John Bown. He fought several of our best pilots when he entered the system, so he was able to pass. He left with a cargo bay full of Artifacts, and that is when trade began. Our economy flourished, allowing us to feed more of our people.</TEXT><PARA/><POP/></RDL>'''
2182 = '''<RDL><PUSH/><TEXT>There were Artifacts all over Crete at one time. Most of those have been sold now, but we still find Artifacts in the Malvadas and Napo Clouds. Any Corsair could have many of the alien trinkets, but they have no function and are therefore meaningless, except for trade. Let some other fool spend his money on them.</TEXT><PARA/><POP/></RDL>'''
2183 = '''<RDL><PUSH/><TEXT>The MOX that powers this base’s larger ships is stolen, usually by our raiders that go into Vespera. The police there are no threat to our pilots.</TEXT><PARA/><POP/></RDL>'''
2184 = '''<RDL><PUSH/><TEXT>Engine Components, Construction Machinery, and Gold are Commodities that are crucial to our ship-building operations here. They are either stolen or purchased from Trafalgar and shipped here.</TEXT><PARA/><POP/></RDL>'''
2185 = '''<RDL><PUSH/><TEXT>Yanagi supplies us with several essential Commodities. We get a majority of our Optronics, Side Arms, and Basic Alloys from that base.</TEXT><PARA/><POP/></RDL>'''
2186 = '''<RDL><PUSH/><TEXT>We get many different goods and basic supplies from the Freeports in nearby zones. Often times it is easier to buy what we need with Artifact income than to steal it.</TEXT><PARA/><POP/></RDL>'''
2187 = '''<RDL><PUSH/><TEXT>Cadiz is an important base for the Rift Captains. It is one of our primary supply depots from which we receive many Commodities.</TEXT><PARA/><POP/></RDL>'''
2188 = '''<RDL><PUSH/><TEXT>In 450 AS we captured our first ship. It was the Dornmark exploration vessel </TEXT><TRA italic="true"/><TEXT>Schiller</TEXT><TRA italic="false"/><TEXT>. Once we dispatched the crew the ship was ours, and more inner colony ships began to disappear. The Rift Captains had begun a legacy that lasts to this day. We are pirates; we take what we need.</TEXT><PARA/><POP/></RDL>'''
2189 = '''<RDL><PUSH/><TEXT>As the number of captured ships grew, we realized that a shipyard was needed to repair damaged vessels and build ships from stolen components and spare parts. We began to gather modules together and steal the goods necessary for the construction of this shipyard, which you can see is quite operational.</TEXT><PARA/><POP/></RDL>'''
2190 = '''<RDL><PUSH/><TEXT>Within the Malvadas Cloud you’ll find a Jump Hole leading to Omicron Theta. There is another Jump Hole in this system in the Walker Cloud. Be careful, there are mines scattered among the carbon asteroids, but once past those you’ll come upon the Jump Hole to Omega-41.</TEXT><PARA/><POP/></RDL>'''
2191 = '''<RDL><PUSH/><TEXT>The Rift Captains and Ashbound are the survivors of the </TEXT><TRA italic="true"/><TEXT>Perihelion</TEXT><TRA italic="false"/><TEXT>. Half of the crew left in smaller ships and crawled into Sirius; they became the Rift Captains. The rest of the </TEXT><TRA italic="true"/><TEXT>Perihelion</TEXT><TRA italic="false"/><TEXT>  crew kept the ship running until it limped close enough to Sirius to abandon; they became the Ashbound. More than fifty percent of both groups died in the first two years after planetfall.</TEXT><PARA/><POP/></RDL>'''
2192 = '''<RDL><PUSH/><TEXT>The war with the Cinder Guard in Omega-5 has cost the Rift Captains many ships and pilots. Death is the way of the Corsair, so the lost pilots are regrettable yet acceptable. Much worse is the loss of their ships, which are often passed from one generation to the next. This shipyard is constantly running at full operational capacity to build new fighters for the front.</TEXT><PARA/><POP/></RDL>'''
2193 = '''<RDL><PUSH/><TEXT>Now that our shipyard is operational, we have begun gathering the components to build a biodome. If we could have one of those domes under direct control of the Rift Captains, none of us would ever want again. It would be a new age, a time without hunger. Even now we come closer and closer to it.</TEXT><PARA/><POP/></RDL>'''
2194 = '''<RDL><PUSH/><TEXT>IMG prospectors have been sneaking into the system recently, looking for Artifacts. They don’t understand whose space they are entering, until we catch them. Then their last few moments are spent thinking deeply about the subject. The Artifact trade is our resource; anyone who endangers it must be killed.</TEXT><PARA/><POP/></RDL>'''
2195 = '''<RDL><PUSH/><TEXT>We will never let the Junkers into Orsena space. For one thing, there is no junk. It was too precious for Orsena industry to ever throw away. The Junkers harbor many criminals that create problems for the other Houses.</TEXT><PARA/><POP/></RDL>'''
2196 = '''<RDL><PUSH/><TEXT>They’re sending me on the Artifact run to Leiden tomorrow. I don’t like going there. Those Lane Hackers are drug addicts, and the Helion Rogues smell badly. The GC will also show up sometimes, which can be dangerous for us. There have been Hogosha “accidents” in the cloud near the base.</TEXT><PARA/><POP/></RDL>'''
2197 = '''<RDL><PUSH/><TEXT>The Jade Vow want to restore the ways of the past. That is not the direction that Orsena should follow. The Hogosha is accused of many things, but we are just the messengers. Orsena society itself must change from within. That is difficult for our culture, where the nail that sticks up gets hammered down.</TEXT><PARA/><POP/></RDL>'''
2198 = '''<RDL><PUSH/><TEXT>We buy our supplies for Aomori in Honshu. We also sell our H-Fuel produced in Naha. One day we will probably sell a lot more here, when Osaka is closed.</TEXT><PARA/><POP/></RDL>'''
2199 = '''<RDL><PUSH/><TEXT>The Ashbound and Rift Captains have entered Honshu space in recent years. This is a very troublesome development for the GMG, as the Trade Lanes through the clouds are our main arteries of commerce. The Guild is considering upgrading our shield technology to match that of the foreign invaders.</TEXT><PARA/><POP/></RDL>'''
2200 = '''<RDL><PUSH/><TEXT>Honshu is our ancient homeland. I try to visit my ancestral village every chance I get. We try to maintain strong ties with our past on Honshu. After all, this is the only habitable planet that most of us have ever known.</TEXT><PARA/><POP/></RDL>'''
2201 = '''<RDL><PUSH/><TEXT>Honshu is the site of our Optronics plants and Engine Component factories that supply all of Sirius. From here we ship cargo to Helion, Dornmark, and Vespera. You will not find a cheaper price anywhere for these two Commodities.</TEXT><PARA/><POP/></RDL>'''
2202 = '''<RDL><PUSH/><TEXT>I’m just stopping by to visit some friends before heading on to Ogashawa in the Sigma-19 system. It’s a joint-venture, gas loading facility with the GMG that I’m helping redesign to handle more ships. Kishiro and the GMG will be an unstoppable force once it’s complete.</TEXT><PARA/><POP/></RDL>'''
2203 = '''<RDL><PUSH/><TEXT>Honshu produces all of the Construction Machinery for Orsena — another market that Samura used to dominate but lost because of its slow pace of innovation. Now it must buy our machinery to construct ships in Yokohama.</TEXT><PARA/><POP/></RDL>'''
2204 = '''<RDL><PUSH/><TEXT>The police is not doing enough to control the Outcast attacks in the Chuyu Cloud. Many of us feel that Samura is applying pressure to force Tokyo Command to reduce patrols in our sector of the system, in order to gain competitive advantage with their Gas from Osaka.</TEXT><PARA/><POP/></RDL>'''
2205 = '''<RDL><PUSH/><TEXT>We must bring in many supplies to support our factories here. High Temperature Alloys, Cobalt, and Basic Alloys come from Mainz.</TEXT><PARA/><POP/></RDL>'''
2206 = '''<RDL><PUSH/><TEXT>We at Kishiro feel a special kinship with the GMG; we share many of the same ancestors. Most of the Kishiro workers in the Optronics and Engine plants know of some distant relative that joined the Guild many years ago.</TEXT><PARA/><POP/></RDL>'''
2207 = '''<RDL><PUSH/><TEXT>Honshu is a challenging post for a Orsena State Police officer. The Rift Captains and Ashbound have discovered secret access points into the eastern part of the system from the Crow Nebula. We are not trained or equipped properly deal with these Edge World pirates.</TEXT><PARA/><POP/></RDL>'''
2208 = '''<RDL><PUSH/><TEXT>Trade Lane patrols can get very tedious for a senior person like me, but they let me spend more time at home on Honshu with my family. They used to be safe, but that has recently changed. We were ambushed by Ashbound on a routine run to Akita yesterday. I lost my partner of 10 years in a flash.</TEXT><PARA/><POP/></RDL>'''
2209 = '''<RDL><PUSH/><TEXT>We have received orders from Sablecross to take no prisoners among the Jade Vow. Who else will fill our prison convoys bound for Shikou? Anyone can be rehabilitated through years of hard work in the Fuchu prison mines.</TEXT><PARA/><POP/></RDL>'''
2210 = '''<RDL><PUSH/><TEXT>I drew the Chuyu Cloud patrol this week. That means one thing — Ashbound. They attack at will within the cloud, and there is little we can do to stop them. Last week an Orbital Spa shuttle was attacked and destroyed for no apparent reason. There were no survivors. That’s bad for the tourist business.</TEXT><PARA/><POP/></RDL>'''
2211 = '''<RDL><PUSH/><TEXT>The Hogosha run their Artifacts across Honshu to Tokyo from Sigma-19. We have begged them to tell us the location of their Jump Hole so that we can stop the Outcast scourge, but they will not cooperate.</TEXT><PARA/><POP/></RDL>'''
2212 = '''<RDL><PUSH/><TEXT>Honshu is a cold and windy place. Fishermen once sailed its seas in search of the redfin. Most hybrid fish species that our ancestors carried with them on the sleeper ship never really took hold in the new environments of Orsena. The redfin was an exception, until they fished it to extinction.</TEXT><PARA/><POP/></RDL>'''
2213 = '''<RDL><PUSH/><TEXT>The Jade Vow carry on their private war with Samura on the Trade Lane from Honshu to Yukawa. Samura is always issuing some distress call. They think we are their private security service. They forget that we must also guard Kishiro and the foreign shippers.</TEXT><PARA/><POP/></RDL>'''
2214 = '''<RDL><PUSH/><TEXT>I’ve never been to the </TEXT><TRA italic="true"/><TEXT>Hawaii</TEXT><TRA italic="false"/><TEXT>  in Sigma-19. A policeman’s salary in Orsena is far too humble to afford that. I hear that they allow criminals like the Rift Captains to land on their ship. Incredible! That would never be allowed in Orsena space.</TEXT><PARA/><POP/></RDL>'''
2215 = '''<RDL><PUSH/><TEXT>We do not need the Bounty Hunter Gaijin to do our difficult jobs for us in Orsena. The State Police has patrolled the fields and clouds of the Crow Nebula as long as anyone can remember. Our culture does not produce common criminals like the Helion Rogues. Orsena internal problems are more political in nature.</TEXT><PARA/><POP/></RDL>'''
2216 = '''<RDL><PUSH/><TEXT>We must purchase many of our shipbuilding supplies for Yokohama here — engine Components, Optronics, and Construction Machinery mostly. Samura once manufactured most of these Commodities, but we could not remain competitive with Kishiro in these specialties.</TEXT><PARA/><POP/></RDL>'''
2217 = '''<RDL><PUSH/><TEXT>Samura still makes the daily Food run from Kyushu, but we may need to reduce it soon to bi-weekly. People are no longer eating Kyushu Rice like they did. Those Synth Food invaders have been granted landing rights on Honshu at the insistence of Kishiro.</TEXT><PARA/><POP/></RDL>'''
2218 = '''<RDL><PUSH/><TEXT>We are delivering a load of Junyo produced Luxury Foods. Sometimes we ship Luxury Goods or Side Arms from Tokyo. It just depends on the local demand.</TEXT><PARA/><POP/></RDL>'''
2219 = '''<RDL><PUSH/><TEXT>You must understand that Orsena palates are more sensitive to delicate Foods than foreigners. We can detect a great difference in quality between Orsena Food Pastes and Synth Food imports. That is why the Orsena people will pay so much more for Kyushu Food products.</TEXT><PARA/><POP/></RDL>'''
2220 = '''<RDL><PUSH/><TEXT>I’m taking a breather while my ship is repaired and refitted for the return journey to Kurile in the Sigma-17 system. We must brave Outcast and Corsair every trip. I’ve seen many of my friends’ supply ships destroyed in front of my eyes. It is the fastest way to early retirement, though. Each roundtrip to Kurile counts as four years of normal service. I will be able to retire to Kyushu in three more trips, if I survive.</TEXT><PARA/><POP/></RDL>'''
2221 = '''<RDL><PUSH/><TEXT>Those cursed Jade Vow harass us all the way across Honshu to the Tokyo Gate. They do not seem to bother Kishiro as much. That is suspicious in my opinion. Perhaps Kishiro is secretly supplying them with weapons and money.</TEXT><PARA/><POP/></RDL>'''
2222 = '''<RDL><PUSH/><TEXT>This was quite a coup, getting access to Honshu and all. We negotiated with Kishiro for months. It took a special real estate arrangement on Deshima to finally close the deal. Soon all the youth of Honshu will be converted to our cheaper products, much as Sablecross has.</TEXT><PARA/><POP/></RDL>'''
2223 = '''<RDL><PUSH/><TEXT>It looks like Samura alerted the Farmers Alliance to our presence here. They’ve started attacking our transports in recent weeks on the Trade Lanes to the Tokyo Gate. They just never give up. One day we’ll have them cornered in Kyushu; I relish the thought.</TEXT><PARA/><POP/></RDL>'''
2224 = '''<RDL><PUSH/><TEXT>We have not been able to crack the Orsena Luxury Food market yet. Part of the problem is Orsena’s particular tastes, which lean heavily towards seafood. Stuttgart’s geography and climate is still not optimal for that kind of farming.</TEXT><PARA/><POP/></RDL>'''
2225 = '''<RDL><PUSH/><TEXT>Bowex is the only foreign shipper to be granted landing rights at Osaka for over 200 years. We supply all of Vespera’s H-Fuel needs. We are hopeful that the arrangement can continue, although we hear murmurs of great changes coming.</TEXT><PARA/><POP/></RDL>'''
2226 = '''<RDL><PUSH/><TEXT>I must say, Samura has let this facility fall into disrepair in recent years. We have pointed out numerous cracks and corroding joints in the tanks to their inspectors, but nothing ever comes of it. The Jade Vow are always trying to sabotage the place, and at this rate, their job will be simple.</TEXT><PARA/><POP/></RDL>'''
2227 = '''<RDL><PUSH/><TEXT>Samura has approached us about plans to open a new gas storage area adjacent to Shinjuku in recent months. We’re not quite sure what is going on within Orsena — plotting and scheming on all sides.</TEXT><PARA/><POP/></RDL>'''
2228 = '''<RDL><PUSH/><TEXT>The GMG has faithfully delivered gas to Osaka for many years. And what does Samura do? They give us half the market price. We felt bound to honor the unfair agreement from many centuries ago. Soon they will pay. The GMG will insure that Hokkaido will not be theirs for many years to come.</TEXT><PARA/><POP/></RDL>'''
2229 = '''<RDL><PUSH/><TEXT>People in Orsena think we are their long lost children that will return someday. We do share our genetic heritage with Honshu, but not much else. The goal of the GMG is to find an ocean planet somewhere in the mists of the Edge, with plentiful fish to reestablish our traditional way of life.</TEXT><PARA/><POP/></RDL>'''
2230 = '''<RDL><PUSH/><TEXT>This is the primary distribution point for Naha Gas produced in Sigma-13. Ogashawa H-Fuel is shipped directly from Sigma-19 or transferred on Honshu to Kishiro transports.</TEXT><PARA/><POP/></RDL>'''
2231 = '''<RDL><PUSH/><TEXT>This is the largest storage and shipping facility in the entire Nacre Reach. From here, Samura and Bowex ship H-Fuel to the far corners of the House systems. H-Fuel is the lifeblood of space transportation. It is the one raw material that Orsena has been blessed with in abundance.</TEXT><PARA/><POP/></RDL>'''
2232 = '''<RDL><PUSH/><TEXT>Osaka is old; Samura is no longer maintaining the tanks well. We know that shortly the GMG will abandon us. There have been numerous complaints by Bowex about the dangerous conditions, but there is little that we can do.</TEXT><PARA/><POP/></RDL>'''
2233 = '''<RDL><PUSH/><TEXT>Rumor is that there will be an “attack” by the Jade Vow someday soon that will result in the destruction of this facility, and a massive insurance claim will be filed with the government. Just business as usual for our company, I guess …</TEXT><PARA/><POP/></RDL>'''
2234 = '''<RDL><PUSH/><TEXT>The Jade Vow have become bolder. They have attempted frontal assaults on Osaka in recent years. It would be a catastrophe if they were to start a chain-reaction explosion in the storage areas. We have strengthened the tank walls as a precaution.</TEXT><PARA/><POP/></RDL>'''
2235 = '''<RDL><PUSH/><TEXT>The GMG has transferred its Gas here as long as anyone can remember. Osaka’s isolated location was intentional. It would not have been cost effective or safe to place such a facility planetside. We needed to keep it clear of the clouds for security reasons.</TEXT><PARA/><POP/></RDL>'''
2236 = '''<RDL><PUSH/><TEXT>We have bought the GMG’s Gas at very reasonable prices for 400 years. Now they betray our trust and secretly negotiate with Kishiro. They will pay for this. Perhaps there will be fewer State Police available to patrol this system in the near future …</TEXT><PARA/><POP/></RDL>'''
2237 = '''<RDL><PUSH/><TEXT>A Blood Dragon spy was discovered last week. He had entered a restricted H-Fuel re-pressurization area without the proper credentials. When confronted, the imposter blew himself up, killing several guards. We were lucky — the effects of the blast were absorbed by a structural bulkhead. One must always be vigilant.</TEXT><PARA/><POP/></RDL>'''
2238 = '''<RDL><PUSH/><TEXT>Orsena has controlled the H-Fuel since the dawn of Jump Gates. There are those at Samura who feel that Orsena did not exploit this powerful tool more effectively in the past, as Helion as done with their Trade Lane technology monopoly.</TEXT><PARA/><POP/></RDL>'''
2239 = '''<RDL><PUSH/><TEXT>Samura will open an H-Fuel complex larger than this in Hokkaido, once the criminal element has been reduced to an acceptable level. Hokkaido is much closer to markets and less susceptible to Edge World pirates than the Sigma systems. Kishiro and the GMG will not be able to compete.</TEXT><PARA/><POP/></RDL>'''
2240 = '''<RDL><PUSH/><TEXT>ALG has been providing Ship Hull Panels and High-Temperature Alloys to this shipyard for some time. We were delighted to recently win the MOX contract over the BMM/BOWEX team, although I’m surprised how much they go through up here. I never realized that gas miners required so much to operate.</TEXT><PARA/><POP/></RDL>'''
2241 = '''<RDL><PUSH/><TEXT>Kishiro does generate some Toxic Waste and Scrap Metal, which we take back to Dortmund via Sigma-13. Usually we pick up additional containers at Helgoland. That’s the site of the Yanagi Debris Field cleanup operation, a legacy of the 80-Years War.</TEXT><PARA/><POP/></RDL>'''
2242 = '''<RDL><PUSH/><TEXT>Our most difficult system is Sigma-13, although the clouds at the eastern end of Honshu come in a close second. Rift Captains mostly. They’ll always take a few shots at a MOX shipment, just for grins.</TEXT><PARA/><POP/></RDL>'''
2243 = '''<RDL><PUSH/><TEXT>The Yukawa Shipyard has been in operation since the second century. We have always produced commercial ships, specifically gas miners. Our miners must deal with the extremely high operating temperatures prevalent within the gaseous clouds of the Crow Nebula. Extreme radiation levels are a fact of daily life for a gas miner within the heart of the Nebula.</TEXT><PARA/><POP/></RDL>'''
2244 = '''<RDL><PUSH/><TEXT>Kishiro was locked out of the GMG/Samura monopoly for many years, so we had to develop superior technology that could economically mine less concentrated deposits of H-Fuel than those found in Sigma-13. Now the research and development is finally paying off. We will not sell the GMG our latest miners unless they agree to abandon their relationship with Samura.</TEXT><PARA/><POP/></RDL>'''
2245 = '''<RDL><PUSH/><TEXT>There is a secret area of the shipyard where we build new Hull Panel prototypes for the Kansai Research Station. We also have a restricted area where a second massive onboard field generator prototype is being tested. It’s not for gas miners.</TEXT><PARA/><POP/></RDL>'''
2246 = '''<RDL><PUSH/><TEXT>Raw materials are shipped here from all over the colonies. ALG has become an important ally, bringing us High-Temperature Alloys and other products of their Dortmund plant. The rest we import from Narita, Honshu, or Shinagawa.</TEXT><PARA/><POP/></RDL>'''
2247 = '''<RDL><PUSH/><TEXT>The Jade Vow are in the area. You can sense their presence in the cloud. They rarely bother us, except for supplies on occasion. Those Farmers Alliance pests are a different matter. We caught them stealing supplies from our storage area the other day.</TEXT><PARA/><POP/></RDL>'''
2248 = '''<RDL><PUSH/><TEXT>The Yukawa shipyard may be building the new Orsena navy soon. The current class of Edo ships is obsolete, derived from old Samura designs dating back almost 100 years. We are working in concert with the Kansai Research Center to create a new generation that will be competitive with the new Helion ships now in development.</TEXT><PARA/><POP/></RDL>'''
2249 = '''<RDL><PUSH/><TEXT>Huge electrostatic fields must be created by a gas miner to attract the desired Deuterium and Helium 3 gas molecules into the collectors. Other gases such as Oxygen are often collected as byproducts. We use specially fabricated Superconductors built onsite to perform this task.</TEXT><PARA/><POP/></RDL>'''
2250 = '''<RDL><PUSH/><TEXT>Yukawa also manufactures Orsena freighters. We have ceded the Transport market to Samura, however. It is difficult to compete with a corporation that steals its building supplies from its competitors. They bribe the Tokyo bureaucrats and police to look the other way.</TEXT><PARA/><POP/></RDL>'''
2251 = '''<RDL><PUSH/><TEXT>We ship Superconductors and other research materials to Kansai on a regular basis. Unfortunately, the Jade Vow view the Naval Forces as the enemy, regardless of their partners, so we must protect ourselves when we enter the cloud.</TEXT><PARA/><POP/></RDL>'''
2252 = '''<RDL><PUSH/><TEXT>This is the most well paid location for Kishiro research scientists. If we can deliver on our promises, all of Orsena will view us as heroes one day. If we fail, I will enter the airlock and eject myself into the mine field.</TEXT><PARA/><POP/></RDL>'''
2253 = '''<RDL><PUSH/><TEXT>There is a faction of scientists at Kishiro that doubt we can ever catch up with Helion. After all, they have had centuries to decipher the alien technology. Kishiro only began the effort 50 years ago.</TEXT><PARA/><POP/></RDL>'''
2254 = '''<RDL><PUSH/><TEXT>This is the most well paid location for Kishiro research scientists. If we can deliver on our promises, all of Orsena will view us as heroes one day. If we fail, I will enter the airlock and eject myself into the mine field.</TEXT><PARA/><POP/></RDL>'''
2255 = '''<RDL><PUSH/><TEXT>Orsena is tolerant of the Artifact trade for different reasons than Helion and the LSF realize. The Hogosha are required to turn over any that appear to be technology related to the government, in exchange for minimal police interference with their other affairs. They end up here, where we have been patiently unlocking their secrets.</TEXT><PARA/><POP/></RDL>'''
2256 = '''<RDL><PUSH/><TEXT>I’m a direct descendant of Kishiro, the founder of this company. People murmur that I got this post because of my family, but I have worked hard to get where I am. I was first in my class at Sablecross University. This was a natural choice to honor my family tradition.</TEXT><PARA/><POP/></RDL>'''
2257 = '''<RDL><PUSH/><TEXT>One day soon, the new Orsena Naval Forces shipyard will be here, within the clouds of this nebula. Yokohama and Samura will merely be a front for the world, building the occasional gunboat to avoid raising suspicion within Helion.</TEXT><PARA/><POP/></RDL>'''
2258 = '''<RDL><PUSH/><TEXT>We buy our supplies from the Yukawa shipyard or Shinagawa. Since we produce our own life support Gases, our needs are few. It is a lonely life, surrounded by our protective mine field. Once you enter this complex, you rarely leave.</TEXT><PARA/><POP/></RDL>'''
2259 = '''<RDL><PUSH/><TEXT>This base is dedicated to high-temperature Superconductor research. This is a key technical problem faced by both gas miners and military ships in the brutally hot conditions typically encountered in the interior of the Crow Nebula. The challenge is creating a strong enough electrostatic heat shield to keep the ship from melting.</TEXT><PARA/><POP/></RDL>'''
2260 = '''<RDL><PUSH/><TEXT>We have conclusively determined that the Trade Lane and Jump Gate technologies are clearly of alien origin, which confirms our long standing suspicions. Unfortunately, practical manufacturing limitations have prevented us from replicating the Superconductor field-generating materials.</TEXT><PARA/><POP/></RDL>'''
2261 = '''<RDL><PUSH/><TEXT>The Jade Vow think that we are creating some super weapon here that Tokyo will use to destroy them. Nothing could be further from the truth. We are interested in creating the ultimate battleship that can traverse space without the aid of Jump Gates or Lanes. We have reliable information that Helion has achieved exactly this goal.</TEXT><PARA/><POP/></RDL>'''
2262 = '''<RDL><PUSH/><TEXT>Kishiro is building specialized new Hull Panels under the guise of gas miner production in the Yukawa shipyard. They are also constructing special field generators that are able to fit within a stripped down cruiser. Our goal is to make an instant leap into Sigma-17 from Kansai, without the aid of Jump Gates, less than 10 years from now.</TEXT><PARA/><POP/></RDL>'''
2263 = '''<RDL><PUSH/><TEXT>This is an ideal location for research away from prying eyes, unlike Nansei. The Kishiro scientists are also more creative and willing to take risks than their Samura counterparts.</TEXT><PARA/><POP/></RDL>'''
2264 = '''<RDL><PUSH/><TEXT>If we unlock the secrets of Trade Lanes and Jump Gates, Orsena will finally be free of the Helion yoke. We have been exploited far too long by Ageira and IC. All of Sirius will be on a level playing field.</TEXT><PARA/><POP/></RDL>'''
2265 = '''<RDL><PUSH/><TEXT>We have several large laboratories here dedicated to analysis the Helion Jump Gates and Trade Lanes. Parts have been gathered in random criminal raids throughout the years to avoid arousing the suspicion of IC and the LSF.</TEXT><PARA/><POP/></RDL>'''
2266 = '''<RDL><PUSH/><TEXT>Once our prototype cruiser is working, the Orsena Naval Forces will test it on the Blood Dragon base in Chugoku. If all goes well, we will be able to muster a secret attack force here in Kansai, step aboard, and be at the doorstep of the Jade Vow minutes later. It would be over in a matter of hours.</TEXT><PARA/><POP/></RDL>'''
2267 = '''<RDL><PUSH/><TEXT>Sigma-13 and 17 are the heart of GMG territory. We will defend it fiercely if threatened, as Dornmark did during the 80-Years War. The wreckage of the GMG fleet remains in Sigma-13 to this day, floating in the vacuum of the Yanagi Debris Field.</TEXT><PARA/><POP/></RDL>'''
2268 = '''<RDL><PUSH/><TEXT>We are searching of a planet to call home. We thought there was a possibility in the Donryu Cloud, but the twin planets are frozen gas, alas. The Ashbound have also proven very challenging in that region of space. We are now looking further inside the Edge Nebula, where our sensors have indicated another planet may lie.</TEXT><PARA/><POP/></RDL>'''
2269 = '''<RDL><PUSH/><TEXT>Sometimes Samura can be so naive. They have never understood where the Jade Vow get their financial support. We are the silent partner; we decided to aid the fledgling movement of the Jade Vow to exact our revenge for centuries of theft and humiliation at the hands of Samura.</TEXT><PARA/><POP/></RDL>'''
2270 = '''<RDL><PUSH/><TEXT>The Rift Captains and Hogosha were once our friends and partners in the Artifact business. Then they became greedy and bypassed us to trade directly with each other. We do not forget such betrayals easily. All Hogosha and Rift Captains are now shot on sight.</TEXT><PARA/><POP/></RDL>'''
2271 = '''<RDL><PUSH/><TEXT>This base has come under attack by the Ashbound since they discovered the Jump Hole from Sigma-19. We have attempted to patrol it, but they are fearsome fighters, blasting their way through our blockades with impunity.</TEXT><PARA/><POP/></RDL>'''
2272 = '''<RDL><PUSH/><TEXT>Samura thinks that once that the government pulls back from the Chugoku Gate project that Hokkaido will finally be theirs. They are gravely mistaken. The GMG will insure that the Jade Vow live on, and do not rest in peace until Samura abandons Hokkaido. The victory will be sweet.</TEXT><PARA/><POP/></RDL>'''
2273 = '''<RDL><PUSH/><TEXT>Kishiro has offered us superior gas miners that could double our profits. We will abandon Samura within the next year and deliver our Gas to Kishiro exclusively, ending our centuries long agreement with the old lady of Orsena.</TEXT><PARA/><POP/></RDL>'''
2274 = '''<RDL><PUSH/><TEXT>We buy our basic supplies in Honshu. For many us, it is difficult to walk planetside, after spending our entire lives in stations that simulate half the normal gravitational force. From here it is a short journey through the Gate to Sigma-17, the site of our newest field.</TEXT><PARA/><POP/></RDL>'''
2275 = '''<RDL><PUSH/><TEXT>The GMG has secretly trained many of the best pilots of the Jade Vow. We gained much valuable tactical knowledge of how to fight in the clouds of the Crow Nebula during our long war with the Dornmarkers.</TEXT><PARA/><POP/></RDL>'''
2276 = '''<RDL><PUSH/><TEXT>There have been cutbacks at this post recently. Last week they transferred two regular patrols to Tokyo, citing lack of identifiable threats. Believe me, there is no lack of enemies here. The Ashbound and Rift Captains have found that Orsena presents an easy target, especially with the military distracted by Hokkaido.</TEXT><PARA/><POP/></RDL>'''
2277 = '''<RDL><PUSH/><TEXT>We have heard that there is a Hole into Sigma-13, but the GMG will not tell us. They keep their secrets close; they are not truly Orsena anymore.</TEXT><PARA/><POP/></RDL>'''
2278 = '''<RDL><PUSH/><TEXT>The GMG has assured us that they can handle the criminal problem in Sigma-13, but this does not seem to be the case. They should bring in the military — that would seal the border.</TEXT><PARA/><POP/></RDL>'''
2279 = '''<RDL><PUSH/><TEXT>This one of the most difficult postings for a Orsena State Police officer in our colony. Maybe Sapporo is worse. The most dreaded patrol does a circuit into the Hiryo Cloud, where the Rift Captains lurk. We had 50% casualties on it last month. That’s enough to make one superstitious.</TEXT><PARA/><POP/></RDL>'''
2280 = '''<RDL><PUSH/><TEXT>Sometimes I wish that we could bring the Charter Guild into Honshu. They do very well in the nebulas and know how to deal with difficult Edge World criminals like the Rift Captains, but Tokyo will not allow it. They say we must show our bushi-do spirit and accept the challenge.</TEXT><PARA/><POP/></RDL>'''
2281 = '''<RDL><PUSH/><TEXT>I am under orders to not pursue Hogosha unless they have been caught stealing from storage depots. It is strange how the rules are always changing with regards to the Hogosha. The GMG seems to dislike them very much, unlike former times.</TEXT><PARA/><POP/></RDL>'''
2282 = '''<RDL><PUSH/><TEXT>The GMG and Samura haul H-Fuel to Osaka past our lonely station. Kishiro, ALG and Republican are the other shippers using this area. Tokyo has said we must hold this line against the Edge World threat, yet reduces our strength on a regular basis.</TEXT><PARA/><POP/></RDL>'''
2283 = '''<RDL><PUSH/><TEXT>I have one more year in the field, then I can get a desk job in Tokyo. No more stress like this, wondering if you will live another day. My wife and her parents are back there always asking about my return date. Maybe it’s not so bad here …</TEXT><PARA/><POP/></RDL>'''
2284 = '''<RDL><PUSH/><TEXT>The Orsena State Police prides itself in being a highly ethical organization. Hogosha often attempt bribes when they are caught, but we will never accept them. The bureaucrats of Tokyo are another matter, however. There are many stories of the criminal bribes and gifts that are accepted by the rulers of our nation.</TEXT><PARA/><POP/></RDL>'''
2285 = '''<RDL><PUSH/><TEXT>We supply this base with its essential needs. We’ve had to ship a lot of new issue Side Arms in from Tokyo. Guess there’s been a little attrition around here lately.</TEXT><PARA/><POP/></RDL>'''
2286 = '''<RDL><PUSH/><TEXT>Just having a quick beer with an old friend who’s posted here with the Police. We graduated from the same school in Kyushu years ago. I miss the green isles of home. Honshu is always grim and gray — and full of Kishiro people.</TEXT><PARA/><POP/></RDL>'''
2287 = '''<RDL><PUSH/><TEXT>I’ve been hauling supplies in my little freighter around Samura and government bases for as long as I can remember. Honshu was pretty quiet until the Edge World pirates showed up. Shikoku has always been active. You’ve got Helion criminals in the southern end, and Bounty hunters and Jade Vow feuding in the rest.</TEXT><PARA/><POP/></RDL>'''
2288 = '''<RDL><PUSH/><TEXT>One day soon they will shut down Osaka, and many people like me will be forced to find work elsewhere. Hokkaido does not sound attractive to me. Maybe I’ll join the rice farmers of Kyushu.</TEXT><PARA/><POP/></RDL>'''
2289 = '''<RDL><PUSH/><TEXT>I’m just switching some crew with a transport bound for Mainz. They lost a couple in a Blood Dragon attack near Osaka and needed a full complement for the Sigma-13 crossing. I wish them the best of luck.</TEXT><PARA/><POP/></RDL>'''
2290 = '''<RDL><PUSH/><TEXT>Upper management is trying to put pressure on the GMG and Kishiro by having police patrols removed from this base. I’m not sure it really helps us though, as Samura ships must still travel to Dornmark with other supplies.</TEXT><PARA/><POP/></RDL>'''
2291 = '''<RDL><PUSH/><TEXT>This is a most difficult situation. Tokyo insists that we construct this Jump Gate to the Chugoku system in order to eliminate the Blood Dragon threat. But it is not easy to supply our ships across the Kyofu Gap. The Jade Vow are patient, waiting for us to lower our guard for a moment. Then they strike out of the Kayo Cloud.</TEXT><PARA/><POP/></RDL>'''
2292 = '''<RDL><PUSH/><TEXT>It will be virtually impossible to build the other end of this Jump Gate in Chugoku. It will take months to transport supplies and run the battleship cross the gap, and we will be very close to the Chugoku base while attempting to construct the Gate. This is sheer folly — a tremendous waste of money.</TEXT><PARA/><POP/></RDL>'''
2293 = '''<RDL><PUSH/><TEXT>We are certain that the Hole to Chugoku is somewhere in the Kayo Cloud, but it is hard for us to linger long in there. The Jade Vow emerge from the fog, destroy one ship of the patrol, then flee like cowards into the mists. It is very demoralizing on our pilots.</TEXT><PARA/><POP/></RDL>'''
2294 = '''<RDL><PUSH/><TEXT>I’ve heard that we will abandon this area of Hokkaido soon. Tokyo wants us to build a defensive line on the other side of the Kyofu Gap and leave it at that. All the Gas that Samura wants is in the southern end of the system anyway.</TEXT><PARA/><POP/></RDL>'''
2295 = '''<RDL><PUSH/><TEXT>We must also patrol the navigation path to the construction area through the Unyo Cloud. The terrorists would destroy all of the Deep Space convoys if we didn’t. It is a tenuous balance in the northern end of Hokkaido.</TEXT><PARA/><POP/></RDL>'''
2296 = '''<RDL><PUSH/><TEXT>Why do the Jade Vow hate the government and Samura so much? They seem to tolerate Kishiro and the GMG. I’m just a soldier following orders. I want this war to end so that I can go home to Kyushu. Unfortunately, it seems like there will be no simple resolution to this conflict.</TEXT><PARA/><POP/></RDL>'''
2297 = '''<RDL><PUSH/><TEXT>Welcome to the end of the universe. You probably need a drink, and an anti-rad pill after crossing the Gap. The Kyofu makes life difficult here, because you can’t just hop back to Tokyo to take your leave. They prefer to minimize exposure to once every two months for anyone posted here.</TEXT><PARA/><POP/></RDL>'''
2298 = '''<RDL><PUSH/><TEXT>The patrols could sure use help up here. The enemy picks away at them, one by one. Never do any suicide assaults, at least not on us. They like to harass the construction site and the Deep Space workers. They’ll fly right at them, then swerve away at the last moment. It is most effective at unnerving the Gaijin.</TEXT><PARA/><POP/></RDL>'''
2299 = '''<RDL><PUSH/><TEXT>None of us know why we are here. The government should withdraw behind the Gap and abandon the site. That would be much easier to defend than this hell hole. It is a matter of saving face for the bureaucrats in Tokyo that approved this project. They cannot admit their error, or more likely, return the bribes they accepted from Samura.</TEXT><PARA/><POP/></RDL>'''
2300 = '''<RDL><PUSH/><TEXT>I’m not feeling so well — probably all the radiation up here. I volunteered for the position because of all the hazard pay. The previous chief on the Hokkaido supply route refused to run it anymore. Now I understand why.</TEXT><PARA/><POP/></RDL>'''
2301 = '''<RDL><PUSH/><TEXT>Samura has had advisors here since the beginning of the Gate construction project. We have surveyed the Kayo and Unyo Clouds for potential Gas reserves. It appears that the southern area of the system is richer. That is probably for the best, as we may be forced to withdraw from this area soon.</TEXT><PARA/><POP/></RDL>'''
2302 = '''<RDL><PUSH/><TEXT>The MOX run to this ship and the Chugoku gate is very dangerous. The enemy seem particularly interested in intercepting our special cargo. I don’t know why we are supposed to return the Toxic Waste to Yokohama. We should just dump it in the Gap.</TEXT><PARA/><POP/></RDL>'''
2303 = '''<RDL><PUSH/><TEXT>Samura has accomplished our primary goal of establishing a viable gas field in Hokkaido. The government’s assistance was invaluable achieving this goal. We no longer need the Chugoku Gate project to justify our presence in Hokkaido.</TEXT><PARA/><POP/></RDL>'''
2304 = '''<RDL><PUSH/><TEXT>They go through a lot of Pharmaceuticals up here because of all the radiation. You can see it in the people around here — hair falling out, lesions. They all look unwell. We shouldn’t be here; it is not worth it.</TEXT><PARA/><POP/></RDL>'''
2305 = '''<RDL><PUSH/><TEXT>I’m not sure what they will do with the Gate once it is abandoned. Billions of Orsena credits have already been expended. At the very least, it is a monument to the power that we have over the corrupt bureaucrats. They will support every whim and wish that we desire.</TEXT><PARA/><POP/></RDL>'''
2306 = '''<RDL><PUSH/><TEXT>The Jade Vow can land nowhere in Orsena space, so we must come here to purchase our supplies from the Golden C. girls. They are all drug addicts, which we do not approve of, but they share the passion for a new Orsena, so we help them fight the evil Samura.</TEXT><PARA/><POP/></RDL>'''
2307 = '''<RDL><PUSH/><TEXT>This is the fastest route for us to access Kyushu and Shikoku, but we must cross the Gap and dodge the military patrols in the Kayo Cloud. It has been a difficult battle, but I believe we will be victorious soon. Samura and the military will declare victory and abandon that absurd Gate project.</TEXT><PARA/><POP/></RDL>'''
2308 = '''<RDL><PUSH/><TEXT>Our base is in Chugoku, through the Jump Hole in the Kayo Cloud. If you want to bring us supplies, there is good money to be made. We especially need Pharmaceuticals.</TEXT><PARA/><POP/></RDL>'''
2309 = '''<RDL><PUSH/><TEXT>We use Ainu as our forward base from which to launch attacks into Kyushu. The Hole lies just south of us here. Our favorite targets are the Samura transports, at least if the police aren’t around. On occasion, we have made assaults on the Nansei Research Center, but that is risky with the </TEXT><TRA italic="true"/><TEXT>Nagumo</TEXT><TRA italic="false"/><TEXT>  so close by.</TEXT><PARA/><POP/></RDL>'''
2310 = '''<RDL><PUSH/><TEXT>We use Kyushu to access Shikoku, where many of our sisters and brothers are held unjustly in Fuchu prison by the government henchmen of Samura. There we must contend with the Hogosha, Bounty Hunters, the military, and police.</TEXT><PARA/><POP/></RDL>'''
2311 = '''<RDL><PUSH/><TEXT>The Golden Chrysanthemums believe that they have the next emperor — excuse me, empress — of Orsena back in a corner of the living deck in the form of a seven-year-old Kyushu girl. They’re teaching her everything she needs to know to run the country. Good luck.</TEXT><PARA/><POP/></RDL>'''
2312 = '''<RDL><PUSH/><TEXT>I was once a Shibuya shopping girl in Sablecross. Now I have purpose in my life. We will lead the women of Orsena to a new future, according to the teachings of Yuyu Matsuda, the martyred leader of our movement. Orsena males beware!</TEXT><PARA/><POP/></RDL>'''
2313 = '''<RDL><PUSH/><TEXT>This is our Kinkakuji, however humble it may seem to you. Here our new recruits must learn the teachings of Yuyu in the “Golden Chrysanthemum in Bloom,” our source of inspiration. It says that Orsena will eventually be engulfed in revolution and united under the rule of a benevolent empress personally selected by the goddess Amaterasu to watch over her people.</TEXT><PARA/><POP/></RDL>'''
2314 = '''<RDL><PUSH/><TEXT>The only place we can land in Orsena space is Roppongi. The foreigners find us more amusing than threatening, and tolerate our presence there. So we buy Luxury Goods in the boutiques onboard, and sell our Cardamine to the highest bidders in the bars scattered around the station.</TEXT><PARA/><POP/></RDL>'''
2315 = '''<RDL><PUSH/><TEXT>We are not numerous yet, but that will change as more of the oppressed women of Orsena tire of the old ways. As we speak, underground cells of the disaffected youth are being formed on all the home planets. We encourage them to visit foreign lands, try exotic foods, and experiment with many new ideas.</TEXT><PARA/><POP/></RDL>'''
2316 = '''<RDL><PUSH/><TEXT>We must occasionally make the long journey to Leiden in the Independent Worlds to sell Cardamine and buy supplies from the smelly foreigners. The Lane Hackers are strange, but not so bad once you get to know them. The Rogues are disgusting pigs. They always harass us in the bar.</TEXT><PARA/><POP/></RDL>'''
2317 = '''<RDL><PUSH/><TEXT>Once we are more established in Orsena, we will no longer need this hellish place. Samura puts much pressure on us. Only the assistance of the Jade Vow has allowed us to survive at all out here.</TEXT><PARA/><POP/></RDL>'''
2318 = '''<RDL><PUSH/><TEXT>I graduated from Sablecross University with a degree in Quantum Engineering. I found work at Samura pouring coffee for my male boss. When the Golden C. approached me at a Roppongi bar, I jumped at the chance to finally fight back for the women of Orsena.</TEXT><PARA/><POP/></RDL>'''
2319 = '''<RDL><PUSH/><TEXT>We buy our Cardamine from the Ashbound on Cali in the Tau-23 system. They are disturbing people — always wearing those masks, but we need the Cardamine. It defines our cause and serves as an important security mechanism. All recruits of Matsuda must become addicted to the drug before they are allowed to become full-fledged members. This makes it difficult for the Orsena security forces to penetrate our cell. And of course, they are not women…</TEXT><PARA/><POP/></RDL>'''
2320 = '''<RDL><PUSH/><TEXT>We support the Jade Vow as well as we can. They need access to our base to rest and resupply after crossing the Gap, or after long Kyushu raids. We do not share the same beliefs, but they are not incompatible. We are all devoted to the overthrow of the Orsena government.</TEXT><PARA/><POP/></RDL>'''
2321 = '''<RDL><PUSH/><TEXT>So what brought you to the armpit of the universe? Never been on a Gate construction job where they lob missiles at you everyday. That’s why we’re an all all-volunteer force here. Work here one year and you can retire, and not in the wastelands of Houston, mind you. Nope, I’m headed to California to buy me a nice house and rub elbows with those rich folks.</TEXT><PARA/><POP/></RDL>'''
2322 = '''<RDL><PUSH/><TEXT>I’ve been hearing rumors that they might shut this thing down pretty soon. Orsena government’s tired of the cost overruns. I can tell you, we’re tired of watching our buddies get atomized while they’re out there welding. This ain’t no place for civilians like us, even on hazard pay.</TEXT><PARA/><POP/></RDL>'''
2323 = '''<RDL><PUSH/><TEXT>Those Orsena types sure have lots of money and patience. The Dragons probably destroy half of the construction supplies getting here. Then they do their daily target practice on the storage depots and get most of the rest. We don’t care much about the parts and machinery, as long as they keep paying us the big bucks.</TEXT><PARA/><POP/></RDL>'''
2324 = '''<RDL><PUSH/><TEXT>The Samura folks just made a replacement MOX run yesterday. Last one got wasted in the cloud. We’re all short timers up here — either short time to the grave, or to paradise on the beaches of Curacao.</TEXT><PARA/><POP/></RDL>'''
2325 = '''<RDL><PUSH/><TEXT>We pay top dollar for Jump Gate Parts and Construction Machinery. As you can see, we need a lot of replacement parts in case something gets accidentally vaporized by a Blood Dragon pulse cannon. IC won’t insure this project; that should tell you something.</TEXT><PARA/><POP/></RDL>'''
2326 = '''<RDL><PUSH/><TEXT>Those Samura people are always snooping around. We have to keep watchful and enforce LSF and company policy. No unauthorized personnel near the black boxes or anything marked PROPERTY OF AGEIRA. Those are the rules.</TEXT><PARA/><POP/></RDL>'''
2327 = '''<RDL><PUSH/><TEXT>It’s a long way up here from Houston. I saw a lot of Sirius for the first time. We stopped at Roppongi to switch crews and take on supplies before heading up to Sapporo. That’s the last outpost of civilization on the other side of the Kyofu Gap. They make everyone put on special suits before crossing that.</TEXT><PARA/><POP/></RDL>'''
2328 = '''<RDL><PUSH/><TEXT>I have no idea how they expect us to build the other side of this Gate in Chugoku. Then we’d be in the backyard of the Dragons. Can’t imagine that they’d just give up. Bunch of craziness this project is. Lot of people killed and money spent for nothing.</TEXT><PARA/><POP/></RDL>'''
2329 = '''<RDL><PUSH/><TEXT>The Samura people are polite, but they keep their distance. They would prefer to do this job themselves, but Helion’s got regulations protecting our intellectual property, at least as far as Trade Lanes and Jump Gates are concerned. Keeps us in business, so I don’t care.</TEXT><PARA/><POP/></RDL>'''
2330 = '''<RDL><PUSH/><TEXT>We deliver the MOX from Yokohama that powers the main reactors of the Jump Gates. Deep Space will not allow us to handle the actual components of the Gate, however. Helion is very careful about controlling that aspect of their technology advantage.</TEXT><PARA/><POP/></RDL>'''
2331 = '''<RDL><PUSH/><TEXT>The Jade Vow seem to grow stronger with every passing month. Our operatives tell us that they have not been able to determine where this organization obtains its funding. I wouldn’t be surprised if it were Kishiro.</TEXT><PARA/><POP/></RDL>'''
2332 = '''<RDL><PUSH/><TEXT>When this Gate is abandoned shortly after completion, due to “irresolvable security issues,” Orsena will finally have a prototype to disassemble and examine at our leisure, far from the watchful eyes of IC and Ageira. We chose this impossible location in the nebula with all of this interference and radiation for a reason.</TEXT><PARA/><POP/></RDL>'''
2333 = '''<RDL><PUSH/><TEXT>The Helion construction workers are a foul-mouthed, disrespectful lot that care only about money. At Samura we must think of the company first, never ourselves. To help create the correct spirit, new trainees must go through a year of drills and exercises to instill the proper respect for our traditions.</TEXT><PARA/><POP/></RDL>'''
2334 = '''<RDL><PUSH/><TEXT>It is incredible that the Orsena public has never questioned the facts that the Orsena government has provided them concerning the economic viability of this project. Samura has known from the onset that it would never be financially or logistically feasible.</TEXT><PARA/><POP/></RDL>'''
2335 = '''<RDL><PUSH/><TEXT>Personally, I doubt that the Jade Vow will stop attacking us once we retreat across the Kyofu Gap. The grand scheme to free Samura from our historical agreement with the GMG is dependent on Hokkaido providing a safe, reliable source of H-Fuel. I don’t see that happening anytime soon in this area.</TEXT><PARA/><POP/></RDL>'''
2336 = '''<RDL><PUSH/><TEXT>Last stop before the Kyofu Gap. If we’re lucky, no one will attack us along the lonely stretch of navigational buoys that define the route to the construction site. You never where or when they’ll strike. I’m hauling Jump Gate parts, since only DSE personnel are allowed to handle them. Otherwise, I’d love to let Samura handle this one for us.</TEXT><PARA/><POP/></RDL>'''
2337 = '''<RDL><PUSH/><TEXT>If this is the future of DSE Trade Lane projects, I want out. I’d rather see Helion start letting other companies shoulder more of the physical risk. This is Orsena’s little dirty war. We shouldn’t be stuck in the middle of it.</TEXT><PARA/><POP/></RDL>'''
2338 = '''<RDL><PUSH/><TEXT>It is a beautiful system up here — very inspiring to an artist type like myself. That’s one of the reasons I signed up for the Border World division. We get to see the cool places, and get paid very well, thank you.</TEXT><PARA/><POP/></RDL>'''
2339 = '''<RDL><PUSH/><TEXT>Can I buy you a drink? I definitely need one. It was a difficult day. My unit was on a deep reconnaissance patrol in the Shiden Cloud, looking for the GC. We were engaged in battle with the GC for 15 minutes, and then they vanished. Our unit lost Takana-san and Ogawa-san. I was just singing karaoke with them last night, so sad …</TEXT><PARA/><POP/></RDL>'''
2340 = '''<RDL><PUSH/><TEXT>We are here to support Samura’s expansion into Hokkaido. It seems like a lot of trouble to mine Gas when there are plentiful supplies in the Sigma systems. But Samura is adamant that Hokkaido be developed, so here I am.</TEXT><PARA/><POP/></RDL>'''
2341 = '''<RDL><PUSH/><TEXT>I hear that the GMG was forced to pay a special “reparation” tax to the government to help Orsena recover some of the loans given to the GMG during the 80-Years War — more specifically, to pay for the immense costs of constructing the Hokkaido and Chugoku Gates.</TEXT><PARA/><POP/></RDL>'''
2342 = '''<RDL><PUSH/><TEXT>The Golden C. are the main problem in this part of the system; on the other side of the Gap, it’s Jade Vow. But that’s the military’s problem. Anyway, they like to attack the gas miners, or wait for supply ships to pass along the buoy route.</TEXT><PARA/><POP/></RDL>'''
2343 = '''<RDL><PUSH/><TEXT>Bounty Hunters would be useful up here. Samura could afford to pay them well, unlike us poor State Police officers. We do not like to take bribes. That is the privilege of the Sablecross bureaucrats.</TEXT><PARA/><POP/></RDL>'''
2344 = '''<RDL><PUSH/><TEXT>One day Sapporo will be converted into a large complex, much like Osaka. Then we will no longer be needed, assuming that the Blood Dragon and GC is gone. I do not believe that day is coming soon.</TEXT><PARA/><POP/></RDL>'''
2345 = '''<RDL><PUSH/><TEXT>They say that The Golden Chrysanthemums hate all men. I would believe that. A GC would rather die than be captured by one of us. It is so sad to see a young woman look at life in such a harsh light.</TEXT><PARA/><POP/></RDL>'''
2346 = '''<RDL><PUSH/><TEXT>There are at least two Holes into this system: one comes from Kyushu, the other from Chugoku. Both are very well concealed in the clouds, where our sensors cannot pick them up. You know when you are close, though. The criminals become agitated and attack like a swarm of stinging insects.</TEXT><PARA/><POP/></RDL>'''
2347 = '''<RDL><PUSH/><TEXT>I’ve heard a drunk Samura manager brag that one day soon, Orsena will understand the Jump Gate technology that Helion has controlled for so long. I wonder if it has anything to do with this project.</TEXT><PARA/><POP/></RDL>'''
2348 = '''<RDL><PUSH/><TEXT>We deliver supplies to this post on a weekly basis, and then continue on to the </TEXT><TRA italic="true"/><TEXT>Matsumoto</TEXT><TRA italic="false"/><TEXT>. They always need more Pharmaceuticals on the battleship — radiation poisoning and battle wounds. It is a nasty little war we have going up there.</TEXT><PARA/><POP/></RDL>'''
2349 = '''<RDL><PUSH/><TEXT>One day this system will be full of gas miners, and the enemies of Orsena will be distant memories. The police must first find and eliminate the GC base, which lies somewhere to the west of this outpost.</TEXT><PARA/><POP/></RDL>'''
2350 = '''<RDL><PUSH/><TEXT>We have begun gas mining operations here, but they are not up to full production — too many attacks by the Golden Chrysanthemums and Jade Vow. The </TEXT><TRA italic="true"/><TEXT>Matsumoto</TEXT><TRA italic="false"/><TEXT>  should be stationed here, not up by the Chugoku Gate site.</TEXT><PARA/><POP/></RDL>'''
2351 = '''<RDL><PUSH/><TEXT>Welcome to the end of the world. I hope you brought supplies with you. We always need Food and Pharmaceuticals. Side Arms are also prized. An unarmed warrior does not garner much respect in this bar.</TEXT><PARA/><POP/></RDL>'''
2352 = '''<RDL><PUSH/><TEXT>Things are more complicated than they seem in Orsena. Samura would have you believe that we are nothing more than common criminals trying to destroy the Orsena way of life. Nothing could be further from the truth. Many of our secret friends in the government have quietly amassed power in the shadow of the corrupt bureaucrats that feast at Samura’s table. Our day will arrive soon.</TEXT><PARA/><POP/></RDL>'''
2353 = '''<RDL><PUSH/><TEXT>The Jade Vow believe that for Orsena to change, the tight relationship between the bureaucrats, Samura, and the Hogosha must end. We have amassed enough damning evidence against our three enemies to sway the next election in favor of our supporters.</TEXT><PARA/><POP/></RDL>'''
2354 = '''<RDL><PUSH/><TEXT>We coordinate all our attacks in Orsena space from here. There are Jump Holes to Honshu and Hokkaido just south of our base here. From Hokkaido, we can access Kyushu and Shikoku. You can reach Tokyo using either route.</TEXT><PARA/><POP/></RDL>'''
2355 = '''<RDL><PUSH/><TEXT>The GMG has been invaluable in providing financial assistance and training to the Jade Vow. At first they were reluctant, but once the government forced them to pay a reparation tax for the 80-Years Wars, they changed their minds.</TEXT><PARA/><POP/></RDL>'''
2356 = '''<RDL><PUSH/><TEXT>We prefer to attack installations and Samura-owned transports rather than raid foreign shipping, which does not help our cause. Unfortunately, sometimes we must obtain supplies. The Golden Chrysanthemums are not nearly as discriminating, which has created a publicity problem for us, since they are perceived by the press as our allies.</TEXT><PARA/><POP/></RDL>'''
2357 = '''<RDL><PUSH/><TEXT>The battle of the Chugoku Gate has been a long and bloody one. We have lost many of our warriors to the Naval Forces. But they are tiring, while we grow stronger every day with new recruits from the disenchanted youth of Orsena, yearning for a better future for our people.</TEXT><PARA/><POP/></RDL>'''
2358 = '''<RDL><PUSH/><TEXT>The Golden Chrysanthemums are a bit unorthodox in their methods, but share our vision of a new Orsena. We do not espouse their heavy use of Cardamine, however. That drug is evil, and will prove their undoing.</TEXT><PARA/><POP/></RDL>'''
2359 = '''<RDL><PUSH/><TEXT>One day we hope to return to Tokyo victorious after almost five centuries in hiding. Until that moment, we must suffer on this lonely and crowded rock, patiently waiting for our foes to make the fatal mistake.</TEXT><PARA/><POP/></RDL>'''
2360 = '''<RDL><PUSH/><TEXT>Samura’s plan was to open Hokkaido to gas mining in order to compete with the GMG, a partner whom they have exploited for centuries. I assure you that Hokkaido will not be a good place for Samura to do business for many years to come. The GMG will make sure of that.</TEXT><PARA/><POP/></RDL>'''
2361 = '''<RDL><PUSH/><TEXT>We are modern Ronin — masterless warriors. We hope to find a new master that can break the curse of Orsena corruption and stagnation and once again bring our nation to glory. There is a young bureaucrat, fresh out of Sablecross University, who speaks of change. The Commerce ministry can dismiss him for now as a naive youngster, but maybe he will be the one who can lead Orsena to the future.</TEXT><PARA/><POP/></RDL>'''
2362 = '''<RDL><PUSH/><TEXT>It has been difficult to voice our opinion in Orsena, as the Hogosha apply pressure to anyone in the media who dares report anything favorably about us. The Hogosha are merely following Samura’s orders.</TEXT><PARA/><POP/></RDL>'''
2363 = '''<RDL><PUSH/><TEXT>The Golden Chrysanthemums are becoming too close to the Ashbound. The allure of Cardamine is seductive, but deadly. If you use too much of it, irreversible physiological changes occur in our body. You are no longer truly human. That is the curse of the Ashbound.</TEXT><PARA/><POP/></RDL>'''
2364 = '''<RDL><PUSH/><TEXT>Our movement is very old, dating back to the Sakura Coup in 321 AS. On that fateful day the Shogun Hideyoshi was toppled by the military, which was backed by Samura. Our ancestors were the Shogun’s royal guards. They fought bravely but fled the palace when it was clear that Samura had won the day. The Jade Vow were thus born, a group dedicated to cleansing the cancer of Samura from Orsena once and for all.</TEXT><PARA/><POP/></RDL>'''
2365 = '''<RDL><PUSH/><TEXT>The GMG has trained us in many nebula fighting tactics that they learned during the 80-Years War. This is why we can fly circles around the Orsena Naval Forces in Hokkaido. Nansei is a different story. The Research Station is very protected and difficult to attack in the style to which we are accustomed.</TEXT><PARA/><POP/></RDL>'''
2366 = '''<RDL><PUSH/><TEXT>The Orsena inmates at Fuchu are the most dangerous in all of our space. They deserve to be surrounded by the Gaijin. I wish that I did not have to be surrounded by them also, but I have no friends or family in the police force, so I am forced to take an undesirable post.</TEXT><PARA/><POP/></RDL>'''
2367 = '''<RDL><PUSH/><TEXT>This prison used to be in Sablecross, but the government felt it was a bad idea to keep so many criminals in the capital system, especially when half of the convicts here are Gaijin. Fuchu was moved here because it is the closest system to the Border Worlds, and there is but one habitable planet.</TEXT><PARA/><POP/></RDL>'''
2368 = '''<RDL><PUSH/><TEXT>Many of the prisoners attempt escape when they are sent to the ring to mine for Hydrocarbons. That is when security is at its lowest, because they are not surrounded by walls. We have been given permission to shoot and kill anyone who tries to escape while working.</TEXT><PARA/><POP/></RDL>'''
2369 = '''<RDL><PUSH/><TEXT>The military is often called in to help us when the Jade Vow attack. We lack the equipment, fire power, and training to repel the Dragons. They attack here trying to free their brethren quite often. I don’t know why we shouldn’t execute them all as traitors right when they are captured.</TEXT><PARA/><POP/></RDL>'''
2370 = '''<RDL><PUSH/><TEXT>The only other group that attacks this prison is the Golden Chrysanthemums. They do not have the skill or equipment that the Dragons do, but they are fearless. We kill plenty of them, but they are not disheartened. That dastardly Cardamine is such an evil thing. We must fight each day to keep the people of Orsena from falling to its allure.</TEXT><PARA/><POP/></RDL>'''
2371 = '''<RDL><PUSH/><TEXT>There is a Helion Rogue here who always claims to be a Lane Hacker. He has been here three years, and every day he offers me more money to let him escape. I think yesterday he offered me enough to buy my own planet, the poor fool. I know he has no money. Even if he were a Lane Hacker I would not take his money; we aren’t the LPI.</TEXT><PARA/><POP/></RDL>'''
2372 = '''<RDL><PUSH/><TEXT>The Golden C. usually attack from the Keiun. The bold Jade Vow will attack from anywhere. Most of the other criminals fly within the clouds to hide themselves, yet the Dragons will cross in open space, daring anyone to give chase, even the military.</TEXT><PARA/><POP/></RDL>'''
2373 = '''<RDL><PUSH/><TEXT>The battleship </TEXT><TRA italic="true"/><TEXT>Myoko</TEXT><TRA italic="false"/><TEXT>  was sent here to secure the Jump Gates and stop the flood of Gaijin criminals currently pouring in from the Border Worlds. I am glad they are here, but sadly they are not enough. If they did a better job, we wouldn’t have half of this facility filled with foreigners.</TEXT><PARA/><POP/></RDL>'''
2374 = '''<RDL><PUSH/><TEXT>I cannot believe how often I see the ex-inmates of this prison in Shikoku flying around as Bounty Hunters. They do not respect the importance of laws and codes, so why should they be enforcing them? It is the greatest of hypocrisies spawned in foreign space.</TEXT><PARA/><POP/></RDL>'''
2375 = '''<RDL><PUSH/><TEXT>The prisoners here produce much of the Hydrocarbons in Orsena. It is our job to ship them to Tsushima.</TEXT><PARA/><POP/></RDL>'''
2376 = '''<RDL><PUSH/><TEXT>A large portion of the basic supplies that keep this prison running are shipped here from Deshima. Deshima may be a haven for Gaijin and other filth, but it is also a trading hub in this sector.</TEXT><PARA/><POP/></RDL>'''
2377 = '''<RDL><PUSH/><TEXT>Mining Machinery is shipped here from Freeport 6 in the Border Worlds. This machinery is used by the inmate population to gather the Hydrocarbons from the ring surrounding this base.</TEXT><PARA/><POP/></RDL>'''
2378 = '''<RDL><PUSH/><TEXT>I do not like coming here usually, though it is rewarding at times. They brought in a group of Helion Rogues that had been attacking our shipments for weeks. It was good to see their faces, particularly when they were pushed into their cells.</TEXT><PARA/><POP/></RDL>'''
2379 = '''<RDL><PUSH/><TEXT>Our patrols enter in the Border Worlds in an attempt to stem piracy in this system and in nearby areas. If we can reduce the number of criminals in Kepler and Galileo, we will reduce the criminals in Shikoku.</TEXT><PARA/><POP/></RDL>'''
2380 = '''<RDL><PUSH/><TEXT>After the Shikoku-Tokyo Gate was built in 300 AS, our period of isolation was over. Since then more and more Gaijin have entered our space. At first, the foreigners were closely monitored, and not many were allowed to enter beyond this system. That has changed, and now you may travel rather freely through our space.</TEXT><PARA/><POP/></RDL>'''
2381 = '''<RDL><PUSH/><TEXT>This system is a crossroads of Orsena and Helion shipping. Consequently, we get a lot of Helion criminals here. There are Rogues and Lane hackers as well as our own Jade Vow, Golden Chrysanthemums, Farmers Alliance, and Hogosha.</TEXT><PARA/><POP/></RDL>'''
2382 = '''<RDL><PUSH/><TEXT>The Jade Vow are fierce opponents, and the police require our help to fight them off. Bounty Hunters are also successful at dealing with them, and I know that Samura has hired many of these mercenaries to deal with the problem. Deshima is home to the Charter Guild in Orsena. No where else will you find their bases operating in this part of space.</TEXT><PARA/><POP/></RDL>'''
2383 = '''<RDL><PUSH/><TEXT>I fly a patrol into the Keiun to hunt down Gaijin pirates. They are mostly coming in from that area. I also escort convoys from the Border Worlds. Often times the ships have been so beaten up out there that to be attacked here in Shikoku almost insures their death.</TEXT><PARA/><POP/></RDL>'''
2384 = '''<RDL><PUSH/><TEXT>The Xenos in Kepler wreak havoc upon our shipping concerns traveling between Orsena and Helion. They feel as we do toward outsiders. Though I can sympathize with that sentiment, they are not justified in their belief as we are.</TEXT><PARA/><POP/></RDL>'''
2385 = '''<RDL><PUSH/><TEXT>The Lane Hackers make attacks upon our vessels in Galileo. They have a base there in the Komatsu Cloud, though its exact position within the cloud is unknown. They are always able to sniff out the most expensive cargoes to seize. We have taken to escorting the most lucrative shipments; sometimes it is not enough just to run patrols.</TEXT><PARA/><POP/></RDL>'''
2386 = '''<RDL><PUSH/><TEXT>The police are commissioned with capturing criminals, whereas we are not burdened by that limitation. If pirates are harassing shipping, we are fully within our rights to destroy them. Only if they surrender will they be spared.</TEXT><PARA/><POP/></RDL>'''
2387 = '''<RDL><PUSH/><TEXT>I wish that the Helion Rogues would confine themselves to Helion. They are not skilled or coordinated in their attacks, but they are plentiful, which is unfortunate. I must try harder to kill more of them. They are the foulest of the Helion criminals; they have no intellect or honor.</TEXT><PARA/><POP/></RDL>'''
2388 = '''<RDL><PUSH/><TEXT>This battleship has most of its basic supplies brought here by Samura from Deshima. It is a good run because you know it should be reasonably safe.</TEXT><PARA/><POP/></RDL>'''
2389 = '''<RDL><PUSH/><TEXT>Samura makes a run to Yokohama from this station every few days. The engines of this battleship produce Toxic Waste, which is shipped there. We return with full loads of MOX.</TEXT><PARA/><POP/></RDL>'''
2390 = '''<RDL><PUSH/><TEXT>My family members are fishermen in Junyo. I thought it would be exciting to become a pilot. Now I wish I could be a fisherman again. I suppose one always to be something else, but this is different. Do you know how often Samura pilots die in this system just running supplies?</TEXT><PARA/><POP/></RDL>'''
2391 = '''<RDL><PUSH/><TEXT>This is the only system in Orsena space that allows the Bounty Hunters to have a base. They don’t like foreigners in Orsena, and Shikoku has served as a buffer between Helion and this House ever since the Jump Gates connecting the two were built.</TEXT><PARA/><POP/></RDL>'''
2392 = '''<RDL><PUSH/><TEXT>Samura pays the Bounty Hunters very well to destroy Jade Vow in this system. They are tough scum bags to kill, but worth the cash they earn me. I decided to come to Orsena because there is less competition here among other Bounty Hunters.</TEXT><PARA/><POP/></RDL>'''
2393 = '''<RDL><PUSH/><TEXT>To be a decent Bounty Hunter you have to know the Jump Hole networks that span all of Sirius. There are two Jump Holes in this system. The one leading to Kyushu is in the Saiun on the northern end of the system. In the south you will find a Hole to Galileo tucked into the Keiun.</TEXT><PARA/><POP/></RDL>'''
2394 = '''<RDL><PUSH/><TEXT>If you are looking to kill Golden Chrysanthemums, head north to the Kyushu Hole in Saiun. The Golden C. also use the clouds to move through the system. I get paid good money to vaporize those ladies. Watch out, if they sense that they are about to be destroyed, they have no problem ramming you.</TEXT><PARA/><POP/></RDL>'''
2395 = '''<RDL><PUSH/><TEXT>Synth Foods offered me some money to hunt down and destroy the Farmers Alliance in the system. Then some Samura approached me and said they would pay me not to kill Alliance fighters. I will always take money for nothing over money for something.</TEXT><PARA/><POP/></RDL>'''
2396 = '''<RDL><PUSH/><TEXT>Strange that Samura never pays to have Farmers Alliance activity popped in this area. They seem most concerned with Lane Hackers and Rogues that enter the system and loiter near the Keiun. They use the Jump Hole from Galileo.</TEXT><PARA/><POP/></RDL>'''
2397 = '''<RDL><PUSH/><TEXT>I’m in this system operating on behalf of Universal. I handle the problems that they encounter when shipping into Orsena. Let me give you some advice about hunting here: don’t mess with the Hogosha, they are connected.</TEXT><PARA/><POP/></RDL>'''
2398 = '''<RDL><PUSH/><TEXT>I have been hired to kill any and all Farmers Alliance ships that I encounter. IC is paying me on behalf of Synth Foods. The police here haven’t really been paying the Alliance any mind, which has been further stressing IC’s relationship with Orsena. Finally IC decided to contract some professional killing. Those farmers don’t know what hit ’em when I come swooping in.</TEXT><PARA/><POP/></RDL>'''
2399 = '''<RDL><PUSH/><TEXT>The Guild has a general contract, paid by the Orsena government, that rewards us for any escaped convicts from Fuchu. I love getting double bumped; I get paid by a corporation for hitting a criminal and paid by Orsena because the mark was an escapee.</TEXT><PARA/><POP/></RDL>'''
2400 = '''<RDL><PUSH/><TEXT>Kishiro ships Polymers and Optical Chips here from Shinagawa for use in the manufacturing of Consumer Goods. The best of these will be shipped to Sablecross.</TEXT><PARA/><POP/></RDL>'''
2401 = '''<RDL><PUSH/><TEXT>Kishiro sends Consumer Goods, H-Fuel, and Optical Chips from Denver. Only the best Kishiro pilots hazard the dangers of the Independent Worlds, but shipping between here and Helion must be done.</TEXT><PARA/><POP/></RDL>'''
2402 = '''<RDL><PUSH/><TEXT>Terraforming Gases and Super Conductors are brought here From Pueblo through the Independent Worlds. On the way there we send them H-Fuel and Niobium.</TEXT><PARA/><POP/></RDL>'''
2403 = '''<RDL><PUSH/><TEXT>We do quite a bit of trading between this base and Honshu. They ship Optronics and Engine Components to us. We, in turn, supply them with Superconductors.</TEXT><PARA/><POP/></RDL>'''
2404 = '''<RDL><PUSH/><TEXT>The Kishiro H-Fuel at this base comes here from Ogashawa in the eastern Border Worlds. Samura supplies H-Fuel here too, but ours is much better. Your ship will fly faster, we promise.</TEXT><PARA/><POP/></RDL>'''
2405 = '''<RDL><PUSH/><TEXT>Niobium is brought here from where it is mined by the Zoners at Freeport 6. That is probably one of the most dangerous runs that Kishiro makes because you must cross most of the western Border Worlds and half of Orsena.</TEXT><PARA/><POP/></RDL>'''
2406 = '''<RDL><PUSH/><TEXT>Along with basic Commodities, Samura ships Side Arms from here to Fuchu and Myoko. It is a short run to either base.</TEXT><PARA/><POP/></RDL>'''
2407 = '''<RDL><PUSH/><TEXT>Detroit Side Arms brought here from Pueblo are then shipped to Sablecross. Samura has more contacts than Kishiro — of course, we are the ones who deliver the more sensitive Commodities into the heart of Orsena.</TEXT><PARA/><POP/></RDL>'''
2408 = '''<RDL><PUSH/><TEXT>I make the Nansei Superconductor run for Samura. My family originally comes from Kyushu, so I am lucky that I got that assignment.</TEXT><PARA/><POP/></RDL>'''
2409 = '''<RDL><PUSH/><TEXT>The Deshima Food operation is a crucial part of our plan to penetrate the Orsena Food market. We bring in the fertilizers we need from Houston, since Samura would never sell us any.</TEXT><PARA/><POP/></RDL>'''
2410 = '''<RDL><PUSH/><TEXT>We send Food produced at this base to the Sablecross system where it can be enjoyed in the heart of the Orsena Shogunate. Too bad those Farmers Alliance pirates keep attacking our convoys. That just means higher prices for the children of Orsena.</TEXT><PARA/><POP/></RDL>'''
2411 = '''<RDL><PUSH/><TEXT>We know that Samura is behind the Farmers Alliance. Our sources tell us that they have been funding them for some time now, yet the only way we can stop the farmers is by hiring Bounty Hunters. The government has deaf ears when it comes to anything Samura related.</TEXT><PARA/><POP/></RDL>'''
2412 = '''<RDL><PUSH/><TEXT>We provide the Side Arms used by the Orsena security forces. They have laws that ban internal production. No such problem in Helion.</TEXT><PARA/><POP/></RDL>'''
2413 = '''<RDL><PUSH/><TEXT>Xenos have a strong presence in Kepler. I must admit, I don’t mind those psychotic bastards. They don’t really attack us; they’re too busy blowing up Orsena ships.</TEXT><PARA/><POP/></RDL>'''
2414 = '''<RDL><PUSH/><TEXT>This is one of the most beautiful systems in all of Sirius. You know those names the clouds have? One of the Kishiro here told me what the names mean: the cloud to the north, the Saiun, means painted cloud; the Keiun to the south means beautiful cloud; and the western Shiun means violet cloud.</TEXT><PARA/><POP/></RDL>'''
2415 = '''<RDL><PUSH/><TEXT>Ames, our base in Kepler, gets almost all of its supplies from Deshima. Aside from the basics, we also get Engine Components here. We are pretty close by, really.</TEXT><PARA/><POP/></RDL>'''
2416 = '''<RDL><PUSH/><TEXT>We don’t have a lot of enemies in Libertonian space, but we don’t have any friends here. My ship got attacked by some crazy women calling themselves the Golden Chrysanthemums. They freaked me out, talking about how I was a male oppressor and such. Hey, the Zoners don’t oppress anybody.</TEXT><PARA/><POP/></RDL>'''
2417 = '''<RDL><PUSH/><TEXT>I know our buddies in Freeport 6 need Commodities from this base. I’m glad that Kishiro makes the run. If Zoners had to do it, then there’d be a lot more of us getting all corpsed up.</TEXT><PARA/><POP/></RDL>'''
2418 = '''<RDL><PUSH/><TEXT>I fly along the Trade Lanes between here and the Sablecross Jump Gate. It is one of the most dangerous patrols in this system, and this is one of the most dangerous places in Orsena space. Needless to say, I am an excellent pilot.</TEXT><PARA/><POP/></RDL>'''
2419 = '''<RDL><PUSH/><TEXT>Sometimes I will buy fish here and take it to my family. Once I forgot to take the fish out of my ship, and it stayed there overnight. No matter how much I clean, it always smells very bad in the cockpit. The other police call me Squid-san now; it is very embarrassing.</TEXT><PARA/><POP/></RDL>'''
2420 = '''<RDL><PUSH/><TEXT>The Golden C. are dangerous fanatics who do not care if they live or die. The Cardamine has made them mad. One tried to ram my ship. Fortunately, I dodged her attack and blew her craft to pieces.</TEXT><PARA/><POP/></RDL>'''
2421 = '''<RDL><PUSH/><TEXT>The Saiun Cloud was so beautiful to me when I was first assigned to this system. Now I look upon its painted scape with fear, for there the worst of Orsena lurks. Even now I’m sure pirates wait for the next appetizing convoy to pass.</TEXT><PARA/><POP/></RDL>'''
2422 = '''<RDL><PUSH/><TEXT>The Bounty Hunters are filth-ridden foreigners, but I must admit they are very good pilots. They kill many of the worst pirates in this system, and for that I am thankful. It should be Gaijin killing Gaijin anyway. Why must I risk my skin fighting smelly outsiders?</TEXT><PARA/><POP/></RDL>'''
2423 = '''<RDL><PUSH/><TEXT>Jade Vow attacked the most recent convoy headed to Fuchu prison. We got the distress call and scrambled to help, but by the time we arrived the entire convoy was destroyed. Even the prisoner ship was demolished; there was no one left alive.</TEXT><PARA/><POP/></RDL>'''
2424 = '''<RDL><PUSH/><TEXT>You seem to be an honorable fellow. This base could always use more Construction Machinery to keep our operations running smoothly. If you take Luxury Foods to Honshu and return with the Machinery, you should turn a nice profit.</TEXT><PARA/><POP/></RDL>'''
2425 = '''<RDL><PUSH/><TEXT>We bring Alien Organisms to this planet to help maintain our fish populations. Most of the Organisms we get are from Shinjuku.</TEXT><PARA/><POP/></RDL>'''
2426 = '''<RDL><PUSH/><TEXT>This planet is very young. We first overlooked these oceans as a place to raise fish because they were bereft of life. It would have taken a very long time for a food chain to develop here, that is, until we used Alien Organisms to jumpstart the process.</TEXT><PARA/><POP/></RDL>'''
2427 = '''<RDL><PUSH/><TEXT>The Oxygen and Water collected at this base is sent to every other base in this system by Samura shipping convoys. Though we ship basic supplies, we still fall under attack quite often. Even criminals must drink and breathe, only I wish did they did less of it.</TEXT><PARA/><POP/></RDL>'''
2428 = '''<RDL><PUSH/><TEXT>If you wish to go to Sablecross, there is a way to line your pockets and travel there as well. Take a load of the Luxury Foods we produce here to the capital. You may return with H-Fuel.</TEXT><PARA/><POP/></RDL>'''
2429 = '''<RDL><PUSH/><TEXT>Denver buys a lot of Junyo Luxury Food. It is a difficult journey for Samura because of the Xenos, but you may find it easier.</TEXT><PARA/><POP/></RDL>'''
2430 = '''<RDL><PUSH/><TEXT>In the Border Worlds on the eastern side of Orsena space is a planet where Alien Organisms are found in vast numbers. That planet, Kurile, is in dangerous space. If you believe yourself to be a good pilot, you could always bring them here.</TEXT><PARA/><POP/></RDL>'''
2431 = '''<RDL><PUSH/><TEXT>Most of the criminals that attack my ship in the Trade Lanes pour from the Saiun. It’s such a beautiful place that to be filled with so many loathsome creatures is very regrettable.</TEXT><PARA/><POP/></RDL>'''
2432 = '''<RDL><PUSH/><TEXT>Sometimes I will look across these waters and wonder what creatures might have eventually emerged from these depths had we not meddled with nature here. Sometimes it is better for a man to eat rice, but you didn’t hear that from me.</TEXT><PARA/><POP/></RDL>'''
2433 = '''<RDL><PUSH/><TEXT>I used to be an important man in Sablecross. My division was always ahead of schedule, and my team very efficient. One of my men was a terrible worker, so I fired him. Little did I know he was the cousin to a powerful executive.</TEXT><PARA/><POP/></RDL>'''
2434 = '''<RDL><PUSH/><TEXT>I will stare into the depths of the waters here. There is little I can do to escape this place. I miss Sablecross dearly, and I want only to be back there. I hate fish; I can never completely wash its smell from my skin.</TEXT><PARA/><POP/></RDL>'''
2435 = '''<RDL><PUSH/><TEXT>The communications tower is very high in the center of the station. There are always many people nearby. Perhaps I could throw myself off of its highest point and end this suffering.</TEXT><PARA/><POP/></RDL>'''
2436 = '''<RDL><PUSH/><TEXT>This station was built to protect the Gates to Orsena space. You may see many Gaijin here in Shikoku, but the number of foreigners drops greatly in the rest of our systems.</TEXT><PARA/><POP/></RDL>'''
2437 = '''<RDL><PUSH/><TEXT>The majority of inmates in Fuchu prison are Gaijin. This confirms our beliefs that the fewer foreigners we have in our space, the better it is for Orsena. I am not pleased that the government keeps lowering entrance standards.</TEXT><PARA/><POP/></RDL>'''
2438 = '''<RDL><PUSH/><TEXT>The Jade Vow are a formidable opponent for us. Our patrols are not enough to curb their piracy within this part of space. We try to keep the Jump Gate clear of riffraff and protect the prison convoys.</TEXT><PARA/><POP/></RDL>'''
2439 = '''<RDL><PUSH/><TEXT>The Jade Vow are the greatest threat in this part of the system. We also encounter Golden C. and Farmers Alliance attack patrols on the Trade Lanes running from the Jump Gates.</TEXT><PARA/><POP/></RDL>'''
2440 = '''<RDL><PUSH/><TEXT>For many of our ranks it is better to work here. Our job means the most in Shikoku. This would be the entry point for many of the criminals that could plague our space if we let them.</TEXT><PARA/><POP/></RDL>'''
2441 = '''<RDL><PUSH/><TEXT>My daughter has joined the Golden Chrysanthemums. It is a terrible dishonor for my family, and I try to keep the fact secret. She was always a precocious child. I only pray she is killed without being identified.</TEXT><PARA/><POP/></RDL>'''
2442 = '''<RDL><PUSH/><TEXT>It is a pity that this system is so rife with criminals, since it is a very beautiful place. Sometimes I will sit and meditate upon this paradox. It is as if mud has been kicked upon a flower.</TEXT><PARA/><POP/></RDL>'''
2443 = '''<RDL><PUSH/><TEXT>I am glad that I do not work at the Fuchu prison. It would make me sick to be surrounded by so many bloodthirsty Rogues. Even stepping foot on Deshima makes my eyes water; it smells so foul there.</TEXT><PARA/><POP/></RDL>'''
2444 = '''<RDL><PUSH/><TEXT>There was a time when the only foreigners in Orsena were in this system. That was a wonderful time for our people, I’m sure. We wouldn’t have any criminals to speak of except the Jade Vow if things had remained that way.</TEXT><PARA/><POP/></RDL>'''
2445 = '''<RDL><PUSH/><TEXT>The Side Arms you see strapped to all of our honorable law bringers come from Deshima station. It’s ironic that we must use Ageira weapons to protect ourselves from Helion criminals.</TEXT><PARA/><POP/></RDL>'''
2446 = '''<RDL><PUSH/><TEXT>Basic supplies are brought to this base by Samura and no other. It is either brought in from Sablecross, or we ship it here from within the system.</TEXT><PARA/><POP/></RDL>'''
2447 = '''<RDL><PUSH/><TEXT>The only company allowed to land at this base is Samura. We are honored with the task of keeping Orsena safe. It is true that we do not do the work ourselves, but how would the police operate without our assistance?</TEXT><PARA/><POP/></RDL>'''
2448 = '''<RDL><PUSH/><TEXT>Even though we are shipping to a police base, our convoys are attacked quite often. I do not wish to speak ill of our police force, but they cannot always defend us from the mongrels in this system. It is all the foreigners that turn their attention away from the real criminals, the Jade Vow.</TEXT><PARA/><POP/></RDL>'''
2449 = '''<RDL><PUSH/><TEXT>My son — he is a good boy — told me he wanted to make a difference and was going to join the police. He was never interested in business or I would have secured him a position with Samura. I told him that the police did not live long enough to make a good career. He is serving in the military.</TEXT><PARA/><POP/></RDL>'''
2450 = '''<RDL><PUSH/><TEXT>The only base that Kishiro does business on in this system is Deshima. This should tell you who is the more trusted of the two keiretsu. Orsena’s corporate interests in Shikoku are faithfully represented by Samura.</TEXT><PARA/><POP/></RDL>'''
2451 = '''<RDL><PUSH/><TEXT>This planet is known as the garden planet of Orsena. We have been growing rice here since 65 AS, when the first settlers arrived. Samura has organized the farmers into collectives to make Food production more efficient.</TEXT><PARA/><POP/></RDL>'''
2452 = '''<RDL><PUSH/><TEXT>Though this system has limited resources, its proximity to the Barrier makes it valuable because of the possible Commodities that can be exploited in the Border Worlds. Many planners believe that this system is the gateway to Orsena expansion in the Barrier. If we can populate the surrounding systems with our citizens, Orsena will eventually be able to lay claim to them.</TEXT><PARA/><POP/></RDL>'''
2453 = '''<RDL><PUSH/><TEXT>As farming technology has improved, the added efficiency has left many of the Kyushu youth with little or nothing in the way of jobs. We lose many of them to jobs in Sablecross or Shikoku. Often times these youngsters will never return.</TEXT><PARA/><POP/></RDL>'''
2454 = '''<RDL><PUSH/><TEXT>Much of our time is devoted to rerouting Gaijin from this system into Shikoku. The populace of Kyushu does not look well upon foreign business entering the system, or any part of Orsena for that matter. This system is the home to the Farmers Alliance, after all.</TEXT><PARA/><POP/></RDL>'''
2455 = '''<RDL><PUSH/><TEXT>In 400 AS the Orsena government began offering huge corporate incentives to relocate operations here. It was mainly an effort to curb overpopulation problems in Sablecross. Of the two keiretsu, Samura was the one who decided to invest in Kyushu.</TEXT><PARA/><POP/></RDL>'''
2456 = '''<RDL><PUSH/><TEXT>The Jade Vow are becoming bolder by the day here. They are even growing heedless of the military presence. Their attacks range all over the system, but they focus upon Samura’s research facility and Kyushu food shipments.</TEXT><PARA/><POP/></RDL>'''
2457 = '''<RDL><PUSH/><TEXT>The Orsena police usually operate only in the eastern half of Kyushu. We keep a watch on the Trade Lanes and Jump Gates leading into Sablecross, and the military keeps an eye on the half of the system that leads from Orsena space into the Border Worlds.</TEXT><PARA/><POP/></RDL>'''
2458 = '''<RDL><PUSH/><TEXT>The police patrols that originate from the Kyushu planet cover the two dust clouds on the eastern half of the system. I fly a patrol that skirts the Seiran Dust Fields. The men in the other patrol wing keep an eye on activity going on in the Hayate Dust Fields.</TEXT><PARA/><POP/></RDL>'''
2459 = '''<RDL><PUSH/><TEXT>The Hogosha don’t really bother anyone in this system; they are usually just passing through. We can’t divert manpower from the really dangerous criminals to see that Hogosha activity is one hundred percent legal. We let them slide a bit.</TEXT><PARA/><POP/></RDL>'''
2460 = '''<RDL><PUSH/><TEXT>The Food grown here is shipped to every system in Orsena space and into the Border Worlds. Oxygen and Water produced here is shipped to every base in the system. Samura is the heart of this system and Kyushu feeds Orsena.</TEXT><PARA/><POP/></RDL>'''
2461 = '''<RDL><PUSH/><TEXT>Samura saw that this system was a perfect opportunity to really break into the Food market. We grow the finest Foods in all of Orsena in Shikoku. When the government offered us incentives to relocate investments here, we jumped at the chance.</TEXT><PARA/><POP/></RDL>'''
2462 = '''<RDL><PUSH/><TEXT>The Farmers Alliance focuses its attacks on Foreigners’ Commodities moving through Shikoku, especially those produced by Synth Foods, who undermines the hard work that we… er the farmers do. The Alliance has also been known to make accidental attacks on Kishiro shipping convoys moving through the system. How unfortunate for Kishiro.</TEXT><PARA/><POP/></RDL>'''
2463 = '''<RDL><PUSH/><TEXT>Kyushu is the recipient of Luxury Goods, Side Arms, and Engine Components from Sablecross. These fine products are sent here to keep the people of Kyushu satisfied, armed, and on the move.</TEXT><PARA/><POP/></RDL>'''
2464 = '''<RDL><PUSH/><TEXT>Fertilizers make their way here from Shinkaku in the Border Worlds. In return we send them H-Fuel. It is a very beneficial relationship.</TEXT><PARA/><POP/></RDL>'''
2465 = '''<RDL><PUSH/><TEXT>If you would care to cross the Border Worlds, there is business you might conduct for us in Freeport 6. They send us their Niobium; in return we take them Engine Components and other basic supplies.</TEXT><PARA/><POP/></RDL>'''
2466 = '''<RDL><PUSH/><TEXT>The Niobium we get from Freeport 6 will often be used to make Luxury Goods in Sablecross. Perhaps you could be a link in that chain.</TEXT><PARA/><POP/></RDL>'''
2467 = '''<RDL><PUSH/><TEXT>The H-Fuel we get from Shinjuku and Osaka is distributed throughout Shikoku. It is not as lucrative a run as others, but relatively easy.</TEXT><PARA/><POP/></RDL>'''
2468 = '''<RDL><PUSH/><TEXT>The gas rings that surround Aso comprise valuable Methane Gases that are mined and used to make Polymers. The Polymers manufactured here are shipped to Yokohama in Sablecross.</TEXT><PARA/><POP/></RDL>'''
2469 = '''<RDL><PUSH/><TEXT>All of this station’s basic supplies come from this system’s main planet, Kyushu. It is an easy supply run to make, if not very lucrative.</TEXT><PARA/><POP/></RDL>'''
2470 = '''<RDL><PUSH/><TEXT>Hydrocarbons are shipped to this facility from Fuchu prison in Shikoku. The Hydrocarbons will be used to convert the Gases we mine into Polymers.</TEXT><PARA/><POP/></RDL>'''
2471 = '''<RDL><PUSH/><TEXT>Recently Kishiro opened a Polymer manufactory in the Border Worlds. Somehow they are able to produce their Polymers for a smaller cost. This has made our operations here more difficult since the market is being flooded by lower priced and obviously lower quality products. I’m sure the shipyards will realize the importance of using better, slightly more expensive components.</TEXT><PARA/><POP/></RDL>'''
2472 = '''<RDL><PUSH/><TEXT>My family members have been joint fitters in the Yokohama shipyards for many generations. I came because Samura is paying well for laborers to mine the Methane and Ethane out of the ice rings that surround this planet. Besides, Sablecross was getting much too crowded.</TEXT><PARA/><POP/></RDL>'''
2473 = '''<RDL><PUSH/><TEXT>I have no idea why the Jade Vow attack this base. It could serve them no good to harass ice miners. I hate terrorists. Their political objectives are always so extreme, and so are their violent actions.</TEXT><PARA/><POP/></RDL>'''
2474 = '''<RDL><PUSH/><TEXT>Golden Chrysanthemums lifted our Water supplies twice in a row. I have not been able to bathe in more than three days, nor has anyone else on the base. It smells unbearable. Do you know how badly miners smell? I am slowly being driven mad.</TEXT><PARA/><POP/></RDL>'''
2475 = '''<RDL><PUSH/><TEXT>Just beyond this planet lies the Ohka Dust Field. Beyond that is the Border Worlds, the Barrier … adventure. I am tired of being a miner. I wish to discover Sirius like Matsuo, the great Orsena explorer. My father just doesn’t understand.</TEXT><PARA/><POP/></RDL>'''
2476 = '''<RDL><PUSH/><TEXT>The subsidies that Samura receives from the government to run this plant more than pay for the pilots we hire to attack the Kishiro Polymer production plant that just became operational in the Border Worlds. Still, the added expense cuts into our profits.</TEXT><PARA/><POP/></RDL>'''
2477 = '''<RDL><PUSH/><TEXT>I would love to take a shower; I haven’t bathed in days. At least those damnable Chrysanthemums didn’t steal our Food shipments or else we would be starving to death right now. Imagine starving to death in Kyushu — there’s irony for you.</TEXT><PARA/><POP/></RDL>'''
2478 = '''<RDL><PUSH/><TEXT>I am getting too old for this job. I would like to retire like they do in Helion and Vespera. But, Samura hires its employees for life. If I quit I will dishonor my family. Maybe I could have a mining “accident.”</TEXT><PARA/><POP/></RDL>'''
2479 = '''<RDL><PUSH/><TEXT>The young bucks who come to work here do not understand the life they have chosen for themselves. They will understand in twenty years or so that we are nothing more than machines that Samura will throw away when it is done with us.</TEXT><PARA/><POP/></RDL>'''
2480 = '''<RDL><PUSH/><TEXT>This ship is commissioned with keeping the nearby Border Worlds as free from piracy as possible. It is a daunting task, but we manage to kill and capture many of the worst of them. Still more try to slip into the system, but we halt that traffic also.</TEXT><PARA/><POP/></RDL>'''
2481 = '''<RDL><PUSH/><TEXT>One of the greatest threats to Orsena is the spread of Cardamine abuse. The Golden Chrysanthemums have been smuggling Cardamine into Orsena through this system, and it must end. I have ordered all Golden Chrysanthemums to be summarily executed and given flight commanders a red pass on patrols in the Border Worlds and this system.</TEXT><PARA/><POP/></RDL>'''
2482 = '''<RDL><PUSH/><TEXT>Though some of their actions do get a little violent, the Farmers Alliance is not a real threat to Orsena society. Much of our time and resources would be wasted hunting down a paper tiger. The occasional accidental attack on Kishiro occurs, but for the most part they attack only Gaijin shipping.</TEXT><PARA/><POP/></RDL>'''
2483 = '''<RDL><PUSH/><TEXT>The Golden Chrysanthemums might be our number one priority in this system, but it is the Jade Vow who are the greatest threat to our physical safety. The Golden C. pilots are young and reckless; the Dragons are skilled and fearless.</TEXT><PARA/><POP/></RDL>'''
2484 = '''<RDL><PUSH/><TEXT>The Golden C. are using the Ohka Field to get Cardamine into the system. We know they are not coming through the Jump Gates. It is infuriating that they are getting in right under our noses somehow. Soon those disrespectful girls will be put to rest.</TEXT><PARA/><POP/></RDL>'''
2485 = '''<RDL><PUSH/><TEXT>Dragons lay bleeding while the Chrysanthemums die fighting Orsena.</TEXT><PARA/><POP/></RDL>'''
2486 = '''<RDL><PUSH/><TEXT>The Seiran Dust Field is the point of entry for the Jade Vow that enter the system. Our patrols have spotted them moving between there and the Okha Dust Field. We cannot interrogate the ones we capture as we would like to, so many of their strategies remain secrets.</TEXT><PARA/><POP/></RDL>'''
2487 = '''<RDL><PUSH/><TEXT>Our patrols in Tau-29 come up against Ashbound on occasion. We know they are the source of Cardamine, but they are not the problem for us. It is the women who smuggle it into our system. Before the Golden C. there was no Cardamine problem in Orsena.</TEXT><PARA/><POP/></RDL>'''
2488 = '''<RDL><PUSH/><TEXT>Much of our effort is spent redirecting the Gaijin into Shikoku. We are trying to seal this part of Orsena space and, more importantly, Sablecross from their presence. Vesperans and the populations of the Border Worlds are very unsavory characters. They would be more comfortable in the other system.</TEXT><PARA/><POP/></RDL>'''
2489 = '''<RDL><PUSH/><TEXT>The fusion chambers in this ship produce Toxic Waste, which we take to Yokohama. There we pick up the MOX and bring it back here to fuel the engines of this ship.</TEXT><PARA/><POP/></RDL>'''
2490 = '''<RDL><PUSH/><TEXT>Side Arms are given to every soldier aboard the ship. They are supplied from relay bases in Sablecross.</TEXT><PARA/><POP/></RDL>'''
2491 = '''<RDL><PUSH/><TEXT>All the basic supplies needed to run this base are brought here from Kyushu. The shipments also bring in mail, since many of the soldiers aboard the </TEXT><TRA italic="true"/><TEXT>Nagumo</TEXT><TRA italic="false"/><TEXT>  are from the finest families planetside.</TEXT><PARA/><POP/></RDL>'''
2492 = '''<RDL><PUSH/><TEXT>This ship plays an important role in keeping the foreign criminals out of our beautiful system. Let them infest Shikoku if they must; Kyushu is ours. Personally, I wish that Orsena was still strictly isolationist. We could always transfer goods at our borders, but the government has grown lax.</TEXT><PARA/><POP/></RDL>'''
2493 = '''<RDL><PUSH/><TEXT>The Nansei Research Center is protected by this battleship. It is a great responsibility protecting the best and brightest minds in Orsena. Someone must take the forefront of scientific research in Orsena, and that great task falls upon Samura’s shoulders.</TEXT><PARA/><POP/></RDL>'''
2494 = '''<RDL><PUSH/><TEXT>I enjoy this assignment aboard the </TEXT><TRA italic="true"/><TEXT>Nagumo</TEXT><TRA italic="false"/><TEXT>. I am afforded the pleasure of seeing the worlds beyond Orsena, but in the safety of a battleship patrol. Yes, sometimes the pilots will take me with them on circuit sorties — very exciting.</TEXT><PARA/><POP/></RDL>'''
2495 = '''<RDL><PUSH/><TEXT>Orsena is attempting to use antimatter as the primary propellant rather than as an intermediary to superheat the hydrogen plasma in engine combustion chambers. To do this, we must dramatically lower the cost of antimatter production.</TEXT><PARA/><POP/></RDL>'''
2496 = '''<RDL><PUSH/><TEXT>The scientists here feel that it would be foolish to store antimatter in a ship. Somehow we need to find a way to generate on the fly the moderate amounts of it needed during the high boost phase of the engines.</TEXT><PARA/><POP/></RDL>'''
2497 = '''<RDL><PUSH/><TEXT>The field of solar collectors you see outside generate the immense amounts of power required in antimatter production. We have done a lot of allied research in cheap manufacturing methods for solar collectors.</TEXT><PARA/><POP/></RDL>'''
2498 = '''<RDL><PUSH/><TEXT>The antimatter research is a cover for our real purpose here: replicating the Ageira Superconductors. Somehow Helion has learned extremely advanced manufacturing techniques to create compounds that we’ve never seen.</TEXT><PARA/><POP/></RDL>'''
2499 = '''<RDL><PUSH/><TEXT>It appears from our research that it is still not economical to create mass quantities of antimatter, even with cheap solar energy. Then there is the issue of transport. A large amount of antimatter transported on a ship would be a tremendously powerful bomb if the containment field were ever breached by accident or hostile action.</TEXT><PARA/><POP/></RDL>'''
2500 = '''<RDL><PUSH/><TEXT>The Jade Vow know what our weakness is here. They always go after the antimatter storage vessels. If they were to breach just one, it could be a chain-reaction catastrophe.</TEXT><PARA/><POP/></RDL>'''
2501 = '''<RDL><PUSH/><TEXT>If there were ever an accident in Nansei, all of Kyushu would know immediately. This entire complex would be vaporized in an instant. Antimatter destroys matter on contact in a mutually destructive collision. We have several metric tons stored here for research purposes. That would make a 1000-megaton thermonuclear weapon explosion look like a candle flame in comparison.</TEXT><PARA/><POP/></RDL>'''
2502 = '''<RDL><PUSH/><TEXT>Nansei is in direct competition with Kansai. They have more innovative and well paid scientists at Kishiro. Samura receives much money from the government for this project, yet we lack simple supplies and modern laboratory facilities.</TEXT><PARA/><POP/></RDL>'''
2503 = '''<RDL><PUSH/><TEXT>We require many Superconductors to create the massive electromagnetic fields needed to accelerate hydrogen to the speeds that create antimatter particles. The high efficiency Helion Superconductors are far more economical than any Orsena has been able to fabricate.</TEXT><PARA/><POP/></RDL>'''
2504 = '''<RDL><PUSH/><TEXT>We supply this facility with the Superconductors and MOX that it needs, along with Basic Supplies from Kyushu. It is an isolated location, which I guess it needs to be, given the dangerous nature of their research here.</TEXT><PARA/><POP/></RDL>'''
2505 = '''<RDL><PUSH/><TEXT>We are not making nearly as much money as Kishiro research scientists. Plus, all of our equipment is outdated. Some of our materials are getting so old that accidents can happen. This is not a good place to work, though I could not dishonor myself by leaving Samura.</TEXT><PARA/><POP/></RDL>'''
2506 = '''<RDL><PUSH/><TEXT>This is just another kickback from the government to Samura. Samura receive 50 million from Tokyo every year, yet we never are allowed to spend more than 20. The rest goes to fund all of Samura’s extracurricular activities around Orsena.</TEXT><PARA/><POP/></RDL>'''
2507 = '''<RDL><PUSH/><TEXT>The Samura scientists stationed here have been demoralized by the cuts in overtime and bonuses by Samura during the last year. Rumor is that our support of the Farmers Alliance has been more costly than expected.</TEXT><PARA/><POP/></RDL>'''
2508 = '''<RDL><PUSH/><TEXT>All the best scientists work for Kishiro — everyone knows that. Most of us are Kyushu University graduates, a school known more for its agricultural research than up-to-date propulsion engineering programs.</TEXT><PARA/><POP/></RDL>'''
2509 = '''<RDL><PUSH/><TEXT>In 400 AS the Orsena government decided to offer corporations incentives to move offices and bases into Kyushu. This was to help stimulate development of the system. We decided to take advantage of that offer; in return the government is getting the best research available governing antimatter. Eventually, these projects could lead to new forms of propulsion, energy, and weaponry.</TEXT><PARA/><POP/></RDL>'''
2510 = '''<RDL><PUSH/><TEXT>We get all of our supplies from Kabukicho in the Kanto Field of the Sablecross system. Those Hogosha seem dishonest, but they are friends of Samura, so I guess they must be okay.</TEXT><PARA/><POP/></RDL>'''
2511 = '''<RDL><PUSH/><TEXT>The Orsena government should not allow lower quality imports that threaten the farmers’ traditional way of life. Before Synth Foods was allowed into Orsena, we could charge a premium price for our Rice and Produce. Now all of the Tokyo urbanites prefer cheap Synth Paste.</TEXT><PARA/><POP/></RDL>'''
2512 = '''<RDL><PUSH/><TEXT>I hear that our equipment and supplies are paid for by some mysterious benefactor in Shinjuku. It’s a good thing we have someone with much money willing to fight the foreigners. Sometimes they ask us to raid Kishiro storage depots, which is troubling. We don’t see ourselves as common thieves, like the Hogosha.</TEXT><PARA/><POP/></RDL>'''
2513 = '''<RDL><PUSH/><TEXT>We are the unemployed farmers of the garden planet of Kyushu. Our families have toiled for generations, producing Food for all of Orsena. Synth Foods has destroyed our traditional way of life in 10 years. They must be stopped.</TEXT><PARA/><POP/></RDL>'''
2514 = '''<RDL><PUSH/><TEXT>Samura has been very good to us. They built the factories in Kyushu, provided us with special Seeds and Fertilizers, and even provided special Samura Bank loans to my family. We drive a Samura XCV series personal craft, of course.</TEXT><PARA/><POP/></RDL>'''
2515 = '''<RDL><PUSH/><TEXT>Some people say that we are just puppets of Samura. It is true that Samura financially supports our cause, and tells us whom and where to strike next. But we still can decide for ourselves if we want to continue doing this. We are all volunteers to the cause.</TEXT><PARA/><POP/></RDL>'''
2516 = '''<RDL><PUSH/><TEXT>We have been able to find many eager recruits in Kyushu. The factories are empty and the fields lay fallow in Kyushu because of the foreigners. Kishiro uses Gaijin labor at Deshima to manufacture its Consumer Goods, products that were once made by Kyushu craftsmen.</TEXT><PARA/><POP/></RDL>'''
2517 = '''<RDL><PUSH/><TEXT>The Golden Chrysanthemums represent all that is wrong with the young women of Orsena. They refuse to accept their traditional honored role as wife and mother in our society, instead becoming drug addicted man-haters. Samura tells us that they are working together with those dangerous Jade Vow.</TEXT><PARA/><POP/></RDL>'''
2518 = '''<RDL><PUSH/><TEXT>We use this base to attack Synth Food convoys in Shikoku and Tokyo. There are Jump Holes near both systems. Sometimes the council of elders orders us to attack Kishiro Consumer Goods transports, or even Optical Chips. We do what we are told; that is the traditional Orsena way.</TEXT><PARA/><POP/></RDL>'''
2519 = '''<RDL><PUSH/><TEXT>I make the shipping run to this base from the BMM </TEXT><TRA italic="true"/><TEXT>Douglas</TEXT><TRA italic="false"/><TEXT>. When I come here, I bring Hydrocarbons and Polymers. When I leave, I take all the basic supplies that keep the </TEXT><TRA italic="true"/><TEXT>Ole Doug</TEXT><TRA italic="false"/><TEXT>  running. You’d be surprised how often I get jumped by Rift Captains. Aye, they’re mean ones. Glad I don’t have to tangle with them Hessians too. That would be too much.</TEXT><PARA/><POP/></RDL>'''
2520 = '''<RDL><PUSH/><TEXT>Some of the Zoners at this base are always lookin at me side ways, acting like I’m the almighty hand of BMM itself. Ah, stupid base snipes is all they are. Next one I see looking at me funny is gonna get some teeth popped outta his head.</TEXT><PARA/><POP/></RDL>'''
2521 = '''<RDL><PUSH/><TEXT>This system is gonna be Vesperan space one day, you wait and see. The </TEXT><TRA italic="true"/><TEXT>Ole Doug</TEXT><TRA italic="false"/><TEXT>  was plopped down by BMM on queen’s orders to keep an eye on them cretinous Dornmarkers. They won’t have much to do around here once Sprague is all fixed up and we’re living on her.</TEXT><PARA/><POP/></RDL>'''
2522 = '''<RDL><PUSH/><TEXT>Cambridge supplies this base with almost everything we use at Freeport 1. Then we ship the Polymers and Hydrocarbons here back to Cambridge. It works out rather tidily.</TEXT><PARA/><POP/></RDL>'''
2523 = '''<RDL><PUSH/><TEXT>It really is a shame about that Gateway convoy that was set upon by Rift Captains last week. All hands lost, truly a tragedy. Ha! They shouldn’t be meddling with Bowex business; I say it serves them all right. Fine by me their wives are widows, that’s what you get for marrying an idiot.</TEXT><PARA/><POP/></RDL>'''
2524 = '''<RDL><PUSH/><TEXT>Ruegen gets her goods from this base — some of the basics at least. The less we have to walk the corridors of this hole the better. I don’t like being around insolent Vesperan scum.</TEXT><PARA/><POP/></RDL>'''
2525 = '''<RDL><PUSH/><TEXT>Many people on Ruegen fear that Vespera will eventually control this system. I say there isn’t a chance. They are counting on colonizing Sprague once it’s terraformed, then forcing us out. Have you ever heard of Planetform, Inc. ever finishing a project? No. This is Dornmark space.</TEXT><PARA/><POP/></RDL>'''
2526 = '''<RDL><PUSH/><TEXT>The only competent Bounty Hunters in Sirius are Dornmark Hunters. For that matter, the only competent </TEXT><TRA italic="true"/><TEXT>anybody</TEXT><TRA italic="false"/><TEXT>  in Sirius are Dornmarkers. Everyone else has gotten lucky — like Helion — or cheated like the GMG and Orsena. We make the finest products, mine the meanest systems, and even have the toughest pirates.</TEXT><PARA/><POP/></RDL>'''
2527 = '''<RDL><PUSH/><TEXT>We have a contract that keeps our convoys running between here and Dortmund. Hydrocarbons and Polymers purchased here are shipped into Dornmark. It’s tough because once we clear the Rift Captains, we hit Hessian space, which can be just as bad.</TEXT><PARA/><POP/></RDL>'''
2528 = '''<RDL><PUSH/><TEXT>From Kensington in Larkspur we travel here to sell Mining Machinery to these old boys. Quite a bit of excitement, but it pays me well enough, I’d say.</TEXT><PARA/><POP/></RDL>'''
2529 = '''<RDL><PUSH/><TEXT>Freiburg keeps this base rather well equipped with basic supplies and Mining Machinery. Quite a shame, it was this shipping run that got destroyed just a while back. All hands lost, including my brother’s wife, she was a good pilot too.</TEXT><PARA/><POP/></RDL>'''
2530 = '''<RDL><PUSH/><TEXT>I’ve been hired by BMM to fight off attacks on their station. They pay me well enough, I suppose, but I’m thinking of leaving. They hired four of us and they’re already asking the Guild for three replacements. The Rift Captains in this space are battle-hardened, worse than their usual lot.</TEXT><PARA/><POP/></RDL>'''
2531 = '''<RDL><PUSH/><TEXT>If you are trying to kill Rift Captains, then keep to the western side of Omega-3 and hunt in the fields there. Make sure to patrol the Coombe in the south too — though you may run into more Hessians than you like down below.</TEXT><PARA/><POP/></RDL>'''
2532 = '''<RDL><PUSH/><TEXT>There’s only one Jump Hole in Omega-3, it’s in the Coombe Field on the southern end of the system. It leads right into Omega-5. That’s right, into the war zone. The Hessians and Rift Captains butcher themselves in there. I don’t go there unless I’m trying to pass through, and I’ve got the throttle buried the whole way.</TEXT><PARA/><POP/></RDL>'''
2533 = '''<RDL><PUSH/><TEXT>Bowex is paying me very well to protect its shipping convoys that pass through this system. This is probably the most dangerous shipping route in all of Sirius, so their pilots are top notch. Even so, a lot of them get charbroiled in Omega-3 and Omega-7.</TEXT><PARA/><POP/></RDL>'''
2534 = '''<RDL><PUSH/><TEXT>I can tell you where the dangerous elements are in this system to help you avoid ’em. They are everywhere, so go home. Ha, just kidding. There are Hessians to the east in the fields and Rift Captains to the west. Both are to the south. Just watch your butt, cuz these pirates will shoot it off.</TEXT><PARA/><POP/></RDL>'''
2535 = '''<RDL><PUSH/><TEXT>Some jerk pulled a knife on me a few nights ago in the bar during a brawl. Since he pulled steel, I decided to pull some ceramic. My “crowd killer” lived up to its name. Too bad I got the two behind him. Lucky I was able to get away without being identified.</TEXT><PARA/><POP/></RDL>'''
2536 = '''<RDL><PUSH/><TEXT>We tried to make this facility as independent as possible. We produce many necessary Commodities here. The Rift Captains have need of these at their base Cadiz. Along with the basics, Rift Captains will pay for Engine Components.</TEXT><PARA/><POP/></RDL>'''
2537 = '''<RDL><PUSH/><TEXT>It’s important that we help other Zoner bases in the area get what they need to survive. The people at Freeport 5 need the basic supplies plus Fertilizers, Polymers, and Engine Components.</TEXT><PARA/><POP/></RDL>'''
2538 = '''<RDL><PUSH/><TEXT>There are BMM representatives here who purchase goods for their base. I don’t mind them spending their money with us, but honestly I don’t like having them here. Many of us left Vespera to escape the BMM. They are awful to work for.</TEXT><PARA/><POP/></RDL>'''
2539 = '''<RDL><PUSH/><TEXT>The trick to surviving out here in the Barrier is to have things that powerful groups want. Our supplies make us allies of many of the toughest ones in this space.</TEXT><PARA/><POP/></RDL>'''
2540 = '''<RDL><PUSH/><TEXT>I see quite a few Bounty Hunters arrive at this base. They get refueled, refitted, have a couple drinks at the bar, and take off. After that I don’t usually see them again. This is rough space, and I imagine plenty of them get their ships blown open.</TEXT><PARA/><POP/></RDL>'''
2541 = '''<RDL><PUSH/><TEXT>Daumann and BMM hate each other. Did you know that? Aye, they are trying to establish colonial presence in this system so that they may eventually annex Omega-3. Whoever spreads fastest will probably get the system. I don’t care who gets it — I just hope that I’m dead by then.</TEXT><PARA/><POP/></RDL>'''
2542 = '''<RDL><PUSH/><TEXT>A couple of Gateway boys were minding their own business in our bar a few days ago when some Bowex chaps started talking some smack to them. Next thing you know a fight was going. I enjoy a good bar brawl and was knocking the teeth out of a BMMer when someone pulled a Daumann “crowd killer” and let loose in there.</TEXT><PARA/><POP/></RDL>'''
2543 = '''<RDL><PUSH/><TEXT>You are in some tough space, you know. The Zoners here, though we don’t go looking for fights can all handle ourselves. I used to be a pilot in the BAF. That’s right. But I gave it up when I realized there weren’t a future in it for me but a gold watch or a space burial.</TEXT><PARA/><POP/></RDL>'''
2544 = '''<RDL><PUSH/><TEXT>Zoners hazard the Border Worlds because we don’t want any governments telling us how to live. That’s why I hope the Rift Captains and Hessians force the corporations out of this area. Then we’d have the system to ourselves.</TEXT><PARA/><POP/></RDL>'''
2545 = '''<RDL><PUSH/><TEXT>If you want to make yourself useful, make one of our shipments for us. We get all the basics from the Zoners at Freeport 1. I don’t like to go there personally. Feels almost like a Vespera outpost.</TEXT><PARA/><POP/></RDL>'''
2546 = '''<RDL><PUSH/><TEXT>If you’d like to see what a real space station looks like, I suggest you visit the Ring in Ironreach. And if you are going, you may as well take Hydrocarbons and Polymers with you.</TEXT><PARA/><POP/></RDL>'''
2547 = '''<RDL><PUSH/><TEXT>Leipzig in Dresden will pay you decently for the Hydrocarbons produced here. I hope you are a competent pilot, if not you will certainly die. The Hessians only get more frequent as you travel into Dornmark.</TEXT><PARA/><POP/></RDL>'''
2548 = '''<RDL><PUSH/><TEXT>Oder is found in Ironreach, which is the center of civilized space in Sirius. Many will say that it is Helion that bears this distinction. But it is only because they have never been to Ironreach. Go, and take Polymers with you.</TEXT><PARA/><POP/></RDL>'''
2549 = '''<RDL><PUSH/><TEXT>We import our Mining Machinery from Freiburg, in the Stuttgart system. Ripping an asteroid apart wears out the grinders and crushers pretty quickly.</TEXT><PARA/><POP/></RDL>'''
2550 = '''<RDL><PUSH/><TEXT>After the Eighty Years War we lost everything. My family worked for Kruger in those days. When the bottom fell out of the economy we lost our jobs and the bonuses that had been promised us. Worse than that, more than half of my ancestors were killed trying to mine gases in contested space. My brother joined the Hessians, but I am not a violent man, I joined Daumann.</TEXT><PARA/><POP/></RDL>'''
2551 = '''<RDL><PUSH/><TEXT>I work here in this mining operation, because I will not work in the shipyards. This place is far from the center of Dornmark. Here it is a little more lax; I work normal hours at Ruegen. Only ten hours a day, six days per week; it’s a breeze compared to the Ring.</TEXT><PARA/><POP/></RDL>'''
2552 = '''<RDL><PUSH/><TEXT>One of the chaps that works here has a brother in the Cinder Guard. This should illustrate what a blood thirsty gang of murderers they are: the miners name is Scmidt, and the leader of the Hessians who attack this base is also named Schmidt. The Hessian is attacking his own brother’s installation.</TEXT><PARA/><POP/></RDL>'''
2553 = '''<RDL><PUSH/><TEXT>You know, the only reason BMM has a base in this system is to try and take Omega-3 away from us. Sure, both governments paid for the Trade Lanes and Jump Gates here, but we were the ones who first moved in. Larkspur only wants it now because we’re here.</TEXT><PARA/><POP/></RDL>'''
2554 = '''<RDL><PUSH/><TEXT>This base was built here to supply Vespera with much-needed Hydrocarbons and Polymers. First, they’ll get shipped to the Zoner base here, and then off to Larkspur to be used for our proud old battleships and patrol crafts. Too bad we don’t see any of them here — it isn’t called the Border Worlds for nothing.</TEXT><PARA/><POP/></RDL>'''
2555 = '''<RDL><PUSH/><TEXT>We get all our goods from Freeport 1, we do. If you care to make the jaunt you can pick us up the basics. Watch out for those Rift Captains; aye, they’re gritty ones, they are. Keep outta the Fields as much you can to avoid ’em.</TEXT><PARA/><POP/></RDL>'''
2556 = '''<RDL><PUSH/><TEXT>Douglas is a tough post. Lots of Corsair activity in the area. I’m not sure why we’re here, actually. The Manchester operation is far safer. There’s just a few Gaians passing through now and then.</TEXT><PARA/><POP/></RDL>'''
2557 = '''<RDL><PUSH/><TEXT>Go to Thames and fetch us some Mining Machinery. I’m sure my bosses will pay you well for it. The crap I have to work with is all but rusted and busted away, it is.</TEXT><PARA/><POP/></RDL>'''
2558 = '''<RDL><PUSH/><TEXT>Rift Captains got one of our supply ships with the Mining Machinery shipment from Thames yesterday. They could have to suspend operations tomorrow. All of our bits and crushers are worn out.</TEXT><PARA/><POP/></RDL>'''
2561 = '''<RDL><PUSH/><TEXT>The Bounty Hunters here were hired to protect our shipments from Rift Captains. The Hessians are more concerned with killing Daumann boys than us, though they will attack our shipments in the Trade Lanes on occasion. Sometimes we’ll even get attacked while we’re mining. A ship’s weapon will blow a man to smithereens; it isn’t pretty.</TEXT><PARA/><POP/></RDL>'''
2564 = '''<RDL><PUSH/><TEXT>All the garbage comes pouring out of the Jump Hole in the Coombe Field. If you patrol that area, you will encounter both Rift Captains and Hessians. It’s a rough and tumble area; they kill each other a lot down below. The ones that survive make their way to the Lanes and attack shipping convoys.</TEXT><PARA/><POP/></RDL>'''
2565 = '''<RDL><PUSH/><TEXT>The Hessians and Rift Captains are fighting a bloody war down south of here in Omega-5. They are battling for control of the Border Worlds between Dornmark and Vespera. The Hessians are expanding — and that brings them into the Rift Captains’ Artifact shipping routes to Vespera.</TEXT><PARA/><POP/></RDL>'''
2566 = '''<RDL><PUSH/><TEXT>BMM and Daumann have a pretty serious rivalry in this system. I’m looking forward to some real hostility getting started between the two of ’em. Some of my buddies I served with on the Newgate are coming here to work for BMM harassing Daumann. They aren’t in the Guild, so they can do that.</TEXT><PARA/><POP/></RDL>'''
2567 = '''<RDL><PUSH/><TEXT>Bowex pays me to protect their shipping convoys at Freeport 1. I also get paid by BMM. That ain’t completely allowed according to Guild bylaws, but I ain’t just in it for the Guild. I’m here to make money. Besides, who cares if I split my time? Either way, I’m saving lives. That makes me a good person.</TEXT><PARA/><POP/></RDL>'''
2569 = '''<RDL><PUSH/><TEXT>Many of the supplies that keep Cadiz running come from the Junkers of Trafalgar in Vespera. Not only do we get basics, we also ship Engine Components here.</TEXT><PARA/><POP/></RDL>'''
2570 = '''<RDL><PUSH/><TEXT>The Side Arms you see the Rift Captains carrying at this base came from Leon. You can make money on this run. And you can always pick up a piece for yourself if you have need of a better one.</TEXT><PARA/><POP/></RDL>'''
2571 = '''<RDL><PUSH/><TEXT>Our shipyard Tripoli requires Engine Components and Polymers from this base. There they will be crafted into the best ships in all of Sirius.</TEXT><PARA/><POP/></RDL>'''
2572 = '''<RDL><PUSH/><TEXT>Artifacts that come to this base are brought from throughout Corsair space. From here they will be shipped to Trafalgar where the Junkers will fence them to the rest of Sirius.</TEXT><PARA/><POP/></RDL>'''
2573 = '''<RDL><PUSH/><TEXT>This is the Corsair forward sector. From here we organize raiding parties that venture into Cambridge and Larkspur to resupply our bases with stolen goods. Power is something that is taken, and we have the power to take what we wish, especially in Larkspur. The police force there is laughable.</TEXT><PARA/><POP/></RDL>'''
2574 = '''<RDL><PUSH/><TEXT>This system is a war zone between Rift Captains and Hessians. Thousands have died in the conflict. You’ll find debris strewn throughout the system from destroyed ships lost to both sides. The fighting has come to a bloody stalemate, with each side looking for the one last push to topple the other’s hold.</TEXT><PARA/><POP/></RDL>'''
2575 = '''<RDL><PUSH/><TEXT>The Omega-3 Trade Lanes are a tempting target for our raiders. That space is filled with Hessians, and the Jump Hole is an ambush point for the Hessians. But once they arrive in Omega-3, goods-laden ships traveling the Lanes between Dornmark and Vespera are easy pickings.</TEXT><PARA/><POP/></RDL>'''
2576 = '''<RDL><PUSH/><TEXT>Omega-5 is the hub for all travel in this part of the Border Worlds. In this system you will find five Jump Holes that lead to Omega-3, Omega-7, Cambridge, Omega-11, and Omega-41. That’s why it is so important we hold this system as Corsair space.</TEXT><PARA/><POP/></RDL>'''
2577 = '''<RDL><PUSH/><TEXT>The Jump Hole to Omega-41 will take you one step closer to our home system of Omicron Gamma. There you will come upon our shipyard, Tripoli, and our home world the beloved Crete, from which the Rift Captains found a place to grab onto and live.</TEXT><PARA/><POP/></RDL>'''
2578 = '''<RDL><PUSH/><TEXT>We supply this base with everything it needs. From basic supplies to Engine Components and Polymers, you name it, we ship it here from Freeport 1. We know it will all be used to fight the Hessians or rob Vesperans, but that is not our affair.</TEXT><PARA/><POP/></RDL>'''
2579 = '''<RDL><PUSH/><TEXT>This base is a forward command for the Rift Captains fighting the Hessians. It is a horrible struggle, with both sides losing many. I believe that the Rift Captains will eventually win. They are the fiercest warriors I have ever seen, and are not afraid to die.</TEXT><PARA/><POP/></RDL>'''
2580 = '''<RDL><PUSH/><TEXT>As well as being the front in the Hessian war, this base also serves as a distribution center for all the goods that the Rift Captains steal in Vespera. I suppose that works perfectly because so many resources must be dedicated to fighting.</TEXT><PARA/><POP/></RDL>'''
2581 = '''<RDL><PUSH/><TEXT>The Corsair general who commands this base has lost all four of his children to the Hessians. His daughter was the finest pilot of the four; she perished but a month ago. General Rivera has a hatred of Hessians unmatched by any other.</TEXT><PARA/><POP/></RDL>'''
2582 = '''<RDL><PUSH/><TEXT>This system is key to controlling the Border Worlds because it has so many Jump Holes. Most important to the Rift Captains is the one leading into Vespera. If the Hessians win the war, they will seal the Rift Captains into the Edge Worlds.</TEXT><PARA/><POP/></RDL>'''
2583 = '''<RDL><PUSH/><TEXT>I do not believe it will be so, but I hope that the Rift Captains lose this war. Then they will be forced to rely upon the Zoners for all of their goods. We will become rich selling the Rift Captains supplies. Why, we might even smuggle their Artifacts for them and make millions.</TEXT><PARA/><POP/></RDL>'''
2584 = '''<RDL><PUSH/><TEXT>I used to loathe Daumann more than any other, but that’s changed. I hate the Rift Captains as much as I could hate any. Of the forty pilots who came here as part of the Red Hessian Twilight Squadron in 797 AS, there are four of us left.</TEXT><PARA/><POP/></RDL>'''
2585 = '''<RDL><PUSH/><TEXT>This is where Daumann and Kruger are coming, so this is where we must be. I don’t think it’s worth it. The Hammen Hole is where Hessians and Rift Captains have staged their largest battles. Out there you’ll find good salvage — if you don’t become salvage yourself.</TEXT><PARA/><POP/></RDL>'''
2586 = '''<RDL><PUSH/><TEXT>The Schmidts mined for Daumann over several generations, we fought in the popular Revolt; my family is part of Dornmark history. I’m the last one left of my line, aside from one brother, and here I sit in Omega-5 not fighting for our rights against Daumann or Kruger, but risking my neck fighting Rift Captains.</TEXT><PARA/><POP/></RDL>'''
2587 = '''<RDL><PUSH/><TEXT>The Omega-3 Jump Hole is where you’ll find the action these days in our war against the Rift Captains. Both sides run patrols there. We lie in wait so if any Corsair ships come through we can hit them. Funny — the Rift Captains do the same thing.</TEXT><PARA/><POP/></RDL>'''
2588 = '''<RDL><PUSH/><TEXT>This system is an important one for the Hessians; it has Jump Holes that lead to Cambridge, Omega-3, Omega-7, Omega-11, and Omicron Theta. That’s a lot of traffic we can raid, and that’s why it can’t fall to the Rift Captains; if they gain control we will be able to expand no further.</TEXT><PARA/><POP/></RDL>'''
2589 = '''<RDL><PUSH/><TEXT>The Hessians in Vogtland will tell you that we are chasing Daumann and Kruger operations here to Omega-5; it seems to me that it’s the other way around. We came here originally to build a new main base of operations. Now we are entrenched in a bitter battle.</TEXT><PARA/><POP/></RDL>'''
2590 = '''<RDL><PUSH/><TEXT>Everything that we need at this base comes from Darmstadt, Freital, or Freistadt. Not just basic supplies, but Side Arms and Engine Components, too. This base is a military operation, so other Hessian bases funnel supplies here.</TEXT><PARA/><POP/></RDL>'''
2591 = '''<RDL><PUSH/><TEXT>I have a friend who is stealing Diamonds in Omega-11. The greedy swine was supposed to come here with me to help win the war against the Rift Captains. He said he didn’t want to die poor and unimportant. Unimportant indeed — I have fought my way to squadron leader.</TEXT><PARA/><POP/></RDL>'''
2592 = '''<RDL><PUSH/><TEXT>The Rift Captains have better ships and many of them are better pilots than your average Red Hessian. Usually a Corsair will win one on one, but we have numbers on our side. I am confident of victory; it is just a matter of wearing them down. Besides, I’ve lived long enough to learn how to kill Rift Captains on my own.</TEXT><PARA/><POP/></RDL>'''
2593 = '''<RDL><PUSH/><TEXT>It was DSE that constructed this station in the first place. Sometimes one of our engineers will direct repairs that need to be done to keep Freistadt safe. It is a rather old base and without our supervision I’m sure it would become very dangerous to live here.</TEXT><PARA/><POP/></RDL>'''
2594 = '''<RDL><PUSH/><TEXT>I hate working here. This is a very dangerous part of Sirius, yet the Trade Lanes and Jump Gates must be maintained. I will never understand why pirates attack us, or our rings. If they only understood that without us or the rings, the shipping they prey upon would not exist.</TEXT><PARA/><POP/></RDL>'''
2595 = '''<RDL><PUSH/><TEXT>My job is to keep the Trade Lane Rings at this base maintained. If something goes wrong, any ship that enters might be shot off course into a planet or star or gas pocket. It’s very ugly when that happens. No one survives, of course — and DSE gets blamed.</TEXT><PARA/><POP/></RDL>'''
2596 = '''<RDL><PUSH/><TEXT>One of Gateway’s more lucrative runs to this base originates in Bonn. We ship Trade Lane Parts here and head back to Bonn with Silver and Copper. It can be quite dangerous since you can be attacked by two of the most vicious groups in all of Sirius.</TEXT><PARA/><POP/></RDL>'''
2597 = '''<RDL><PUSH/><TEXT>Much of the Silver that is mined here is shipped into Vespera. Kensington has need of Silver, so we deliver. I enjoy going back into Vespera, but surviving the trip is always a bit tricky.</TEXT><PARA/><POP/></RDL>'''
2598 = '''<RDL><PUSH/><TEXT>Copper and Cobalt is shipped to Dortmund. ALG will use its smelters to turn the raw ore into workable materials. If the miners here were more ambitious, they could do the same.</TEXT><PARA/><POP/></RDL>'''
2599 = '''<RDL><PUSH/><TEXT>This base receives all its basic supplies from Freiburg. More than just the basic necessities; we also bring Mining Machinery and Engine Components. I fear that much of what we ship here, the IMG turns around and sells to the Cinder Guard, making our jobs much more perilous.</TEXT><PARA/><POP/></RDL>'''
2600 = '''<RDL><PUSH/><TEXT>This base is spared attacks because we purchase many basic supplies for our bases in the area. I come from Ronneburg, and we get almost everything here. Right now I’m looking to replace some Engine Components that were damaged last week on my ship.</TEXT><PARA/><POP/></RDL>'''
2601 = '''<RDL><PUSH/><TEXT>Many of the IMG members are former Daumann and Kruger workers. A shame they are too cowardly to exact revenge, but that is their loss. Regardless, they supply Freital with basic supplies and Engine Components.</TEXT><PARA/><POP/></RDL>'''
2602 = '''<RDL><PUSH/><TEXT>Some of the Vesperan shipping boys on this base aren’t bad fellows; just trying to make a living, I suppose. Too bad they chose the wrong line of work. I might have a beer or two with them in the bar, but it won’t stop me from blowing a hole in their ship out in the void.</TEXT><PARA/><POP/></RDL>'''
2603 = '''<RDL><PUSH/><TEXT>There are two Jump Holes in this system. One leads to Omega-11, which is pretty much dominated by the Hessians. That Hole is located in the Furstenfelde. Look southwest of the Daumann base in there and you should stumble across it.</TEXT><PARA/><POP/></RDL>'''
2604 = '''<RDL><PUSH/><TEXT>If you are looking to go into Omega-5, use the Jump Hole on the far west side of the system. It’s just south of a large gas pocket below the Trade Lanes. Be very careful; Omega-5 is a meat grinder no matter how good you are.</TEXT><PARA/><POP/></RDL>'''
2605 = '''<RDL><PUSH/><TEXT>I can kill Rift Captains or Hessians and get paid by whoever I want. They attack everyone who has a base here or passes through, except the IMG. Rift Captains generally keep to the western side, but when they come up against Hessians you are going to see a fight</TEXT><PARA/><POP/></RDL>'''
2606 = '''<RDL><PUSH/><TEXT>We were the first ones in this system that decided to try and scratch out a living, mining metals. Recently, the large corporations from Dornmark have moved in; both Daumann and Kruger. It is disturbing to see them coming into our space. Many of us became IMGers to get away from those damned companies.</TEXT><PARA/><POP/></RDL>'''
2607 = '''<RDL><PUSH/><TEXT>This system used to be free from pirates, but after the revolt, the Hessians gathered together and started attacking shipments moving between Dornmark and Vespera. A lot more of us miners came here after the revolt as well. Daumann and Kruger are both evil companies that worked us for nothing but promises and heartache. I hope the Hessians kill them all.</TEXT><PARA/><POP/></RDL>'''
2608 = '''<RDL><PUSH/><TEXT>This base was left behind by the companies that built the Trade Lanes and Jump Gates in this system. What we mine is the amount that will buy us the Food and supplies we need from Freiburg. We don’t need to amass a fortune or anything like that. Just trying to get by.</TEXT><PARA/><POP/></RDL>'''
2609 = '''<RDL><PUSH/><TEXT>The Hessians don’t really attack us, so that is good. We don’t have to fear for our physical safety, but Gateway does all the shipping to this base and their convoys often get attacked on the way in. So the pirates do make our lives a bit harder sometimes, but I’m not going to try and explain that to the Hessians who come here.</TEXT><PARA/><POP/></RDL>'''
2610 = '''<RDL><PUSH/><TEXT>I hear word that Dresden is running out of raw materials to mine. That’s why it doesn’t surprise me to see Daumann sniffing around here. If I had to wager, I’d say they are just testing the waters for a larger operation in Omega-7. They weren’t here ten years ago when Dresden was still doing fine. You wait and see. I’m right.</TEXT><PARA/><POP/></RDL>'''
2611 = '''<RDL><PUSH/><TEXT>I’m glad I don’t work for Kruger anymore. No sir, I wouldn’t step foot on that base of theirs for anything. You can bet the men there are working obscene hours, eking out profits for the executives in Ironreach — and getting shot up by Hessians.</TEXT><PARA/><POP/></RDL>'''
2612 = '''<RDL><PUSH/><TEXT>Watch out for the gas pockets in this system. If you fly through one of those, you are going to become a permanent fixture of your ship. You will melt right into your seat. I’ve seen it happen; some fool was not being careful and — kapow! — vapor.</TEXT><PARA/><POP/></RDL>'''
2613 = '''<RDL><PUSH/><TEXT>Usually IMG has to compete with BMM for resources within systems. Here in Omega-7, BMM knows that it would be too costly to start operating where we have already laid stakes. No, this system was left to us. Now I just hope that the Dornmark companies will do the same.</TEXT><PARA/><POP/></RDL>'''
2614 = '''<RDL><PUSH/><TEXT>It’s easy to get lost in here if you leave the Trade Lanes. It’s a dangerous system to live in, but being friends with the Hessians helps. Well, not friends, but not enemies either. Imagine getting lost and then beset by pirates. It’s over pretty quick.</TEXT><PARA/><POP/></RDL>'''
2615 = '''<RDL><PUSH/><TEXT>On this base we mine for Copper, Silver, and Cobalt. All will be shipped directly to the Ring in Ironreach. This is a dangerous run because of those damnable Hessians. I curse them all. We aren’t the ones who exploited them; yet we are the ones who get killed.</TEXT><PARA/><POP/></RDL>'''
2616 = '''<RDL><PUSH/><TEXT>All the basic supplies this base requires to keep running are shipped in from Freiburg — even the Mining Machinery we use to carve the metals from the rocks. Only dependable Dornmark machinery gets the job done.</TEXT><PARA/><POP/></RDL>'''
2617 = '''<RDL><PUSH/><TEXT>Many of the men on this base are not miners, but assessment teams and surveyors. Daumann is considering the construction of a major mining facility in this system. It would be a great addition to the amount of ore we could ship to Ironreach, as well as to what we get from Dresden.</TEXT><PARA/><POP/></RDL>'''
2618 = '''<RDL><PUSH/><TEXT>Our company is not used to being the third into a system. Usually we claim space first. Not so here, but Kruger is in its death throes and the IMG can easily be removed. Of course, if Kruger does merge with ALG they will have the backing necessary to establish control. That must be considered if we are to attempt a major investment.</TEXT><PARA/><POP/></RDL>'''
2619 = '''<RDL><PUSH/><TEXT>The Hessians attack our base, our miners, and our ships incessantly. My wife wanted to come with me to this base when I was assigned here. I told her she was being a fool. To come here is to risk death every day, and I will not let my family be brought here. The trip itself is dangerous, let alone staying in Omega-7.</TEXT><PARA/><POP/></RDL>'''
2620 = '''<RDL><PUSH/><TEXT>The rodents who run Freistadt have been mining here for some time. It is unfortunate that this is so, because they have taken the best field for themselves. This will go in my report to Ironreach. I’m sure Daumann can find a way to force them out; it will not have been the first time. We are working for the greater glory of Dornmark. Sometimes bugs must be crushed underfoot to do this.</TEXT><PARA/><POP/></RDL>'''
2621 = '''<RDL><PUSH/><TEXT>I was doing some surveying in the Gubenfelde just south of the IMG base when I was saw a flight of Cinder Guard run right into a Corsair patrol. It was the most incredible thing I have ever seen. I thank good luck my ship was obscured by asteroids, and that I could watch, hidden amongst rock. They fought so fiercely, it was actually beautiful — as if they were all artists, and death was their canvas.</TEXT><PARA/><POP/></RDL>'''
2622 = '''<RDL><PUSH/><TEXT>Right now, the men at the Kruger base in the Ebersfeld are doing the same thing we are: trying to figure out if they should build a major base in this system. Of course, we hire pilots to attack their operations to help them decide against it. Let’s hope that is enough persuasion.</TEXT><PARA/><POP/></RDL>'''
2623 = '''<RDL><PUSH/><TEXT>I’m not some lowly miner. I’m a surveyor; my father is a higher-up in this company. If the Hessians only knew whose son was on this base, they would double their efforts to destroy Briesen. No, after this short assignment I’m headed straight to Ironreach, where I will assume command of a division.</TEXT><PARA/><POP/></RDL>'''
2624 = '''<RDL><PUSH/><TEXT>All the supplies at this facility are supplied to us from Freiburg. Not just the basics, but everything including Mining Machinery. We will not stoop to purchase our goods from the IMG at Freistadt; it would only encourage them.</TEXT><PARA/><POP/></RDL>'''
2625 = '''<RDL><PUSH/><TEXT>Our miners hunt for and extract Silver from the asteroids in this field. Once that is done, Kruger ships it to Ironreach where it is loaded onto long distance transports bound for Helion and Orsena.</TEXT><PARA/><POP/></RDL>'''
2626 = '''<RDL><PUSH/><TEXT>At first we did not wish to construct operations in this system; we knew it was filled with all manner of dangerous criminals. Yet ALG requested that we do so. The lazy fools at Freistadt were not supplying them with enough ore. ALG needed efficient and diligent workers to get the job done.</TEXT><PARA/><POP/></RDL>'''
2627 = '''<RDL><PUSH/><TEXT>We acquiesced to ALG’s request to supply them with metals mined from this system because we are trying to foster a friendship between the two companies. Since the 80-Years War, Kruger has been struggling to stay afloat. A merger between Kruger and ALG would put us back on top.</TEXT><PARA/><POP/></RDL>'''
2628 = '''<RDL><PUSH/><TEXT>I’m beginning to believe that the IMGers know how to run a mining operation better than we do. Certainly we mine more than they do, and more efficiently, but they don’t lose dozens of men per year to Red Hessian attacks.</TEXT><PARA/><POP/></RDL>'''
2629 = '''<RDL><PUSH/><TEXT>I’m glad that Daumann has established a base in this system. For a while we were the ones getting hit the hardest by the Cinder Guard and the Rift Captains. Now they have to split their time between the two of us and the Trade Lanes.</TEXT><PARA/><POP/></RDL>'''
2630 = '''<RDL><PUSH/><TEXT>I know some of the attacks on this base come from pilots hired by Daumann; that’s just how they operate. I don’t need any proof. In response, Kruger has hired our own pilots to attack the Daumann base and its shipments.</TEXT><PARA/><POP/></RDL>'''
2631 = '''<RDL><PUSH/><TEXT>One of the pilots that we hired to attack Daumann … there’s something about the way he flies. It seems familiar to me — just like the way a raider flew that attacked this base a few weeks ago. Must be coincidence.</TEXT><PARA/><POP/></RDL>'''
2632 = '''<RDL><PUSH/><TEXT>When I was on furlough a couple of months ago in Ironreach, a man approached me with a card full of credits. He said it would be deposited into my account if I did a little sabotaging here and there on this base. I don’t get paid enough here to say no to that.</TEXT><PARA/><POP/></RDL>'''
2633 = '''<RDL><PUSH/><TEXT>If you got the guts for it, I know a way you can make a whole lot of money. Get Diamonds from this base and fly them to Ironreach. Once you’re there, pick up basic supplies or Mining Machinery and bring ’em back here.</TEXT><PARA/><POP/></RDL>'''
2634 = '''<RDL><PUSH/><TEXT>If you don’t want to fly into Ironreach for whatever reason, there’s a market for Diamonds in Stuttgart. Take them to Freiburg; they’ll buy Diamonds from you there.</TEXT><PARA/><POP/></RDL>'''
2635 = '''<RDL><PUSH/><TEXT>This station receives almost all of her basic supplies from Stuttgart. If you want to, you can go there and get us what we need. Maybe the Hessians won’t kill you if you aren’t carrying Diamonds, but I wouldn’t bet on it.</TEXT><PARA/><POP/></RDL>'''
2636 = '''<RDL><PUSH/><TEXT>This system was first explored by a great man named Van Rohe. The belt that surrounds the dying sun is named after him. That’s where you are going to find the Diamonds in Omega-11. He sacrificed his life for his crew.</TEXT><PARA/><POP/></RDL>'''
2637 = '''<RDL><PUSH/><TEXT>Van Rohe believed the belt that shares his name to be a planet that was knocked out of orbit by the expanding sun’s pull. It was shattered against its own moon. All the metals and Diamonds were cracked out of its crust, and now drift in the belt.</TEXT><PARA/><POP/></RDL>'''
2638 = '''<RDL><PUSH/><TEXT>If you want to find the Diamonds, you must cross Abgrund into the Van Rohe Belt. Once there, head south since the Diamonds closest to this base have been mined out. Don’t get greedy or else a flare will kill you for staying out too long and insulting the sun.</TEXT><PARA/><POP/></RDL>'''
2639 = '''<RDL><PUSH/><TEXT>The Cinder Guard are pure evil. It’s not enough that the sun will strike you dead for not respecting him; you gotta worry about Hessians, too. I came here because I was a poor man and this work pays better than any other Daumann outfit. You’d think the Hessians would respect that, seeing as they were once just like us.</TEXT><PARA/><POP/></RDL>'''
2640 = '''<RDL><PUSH/><TEXT>There’s ghost ships all throughout Abgrund and the Van Rohe Belt. They will lure you into a pocket full of Diamonds and tempt you to stay longer than you should. You see, the dead don’t like to be alone, they want company. Don’t do it. Come back as fast as you can or else the sun will roast your bones.</TEXT><PARA/><POP/></RDL>'''
2641 = '''<RDL><PUSH/><TEXT>New miners who come here learn fast or we bounce ’em out. They gotta learn to listen to the flare reports and get themselves a bit of luck. Me, I carry a Cinder Guard knuckle bone. Yup, we pulled a skeleton out of a dead ship in Abgrund a few years ago.</TEXT><PARA/><POP/></RDL>'''
2642 = '''<RDL><PUSH/><TEXT>The miners at this base have gone crazy. They are all extremely superstitious. I once referred to the sun as a she, and they all started screaming at me. They said the sun would burn my shadow into a Diamond for saying such a thing.</TEXT><PARA/><POP/></RDL>'''
2643 = '''<RDL><PUSH/><TEXT>There are five Jump Holes in this system. The Rift Captains come in from Omega-41, which is in the Madsack Fragment. The Holes to the other two Border Worlds connected to this system are in the Jeschke Fragment. That field is loaded with Hessians; don’t go there unless that’s what you’re looking for.</TEXT><PARA/><POP/></RDL>'''
2644 = '''<RDL><PUSH/><TEXT>The war between the Hessians and the Rift Captains is still raging in Omega-5, but here the Hessians are in control. The Rift Captains still come to Omega-11 by way of the Omega-41 Jump Hole, but they are looking for Diamonds usually. They do make hit and runs on the Hessians, too.</TEXT><PARA/><POP/></RDL>'''
2645 = '''<RDL><PUSH/><TEXT>The Jump Hole to Dresden is in the Kraft Fragment. It is just south of the Jump Gate to Stuttgart. The Cinder Guard make use of that Hole quite often, so be careful.</TEXT><PARA/><POP/></RDL>'''
2646 = '''<RDL><PUSH/><TEXT>If you want to get into Stuttgart, and you don’t need any authorities scanning your ship, I recommend using the Jump Hole in the Franke Fragment. This system is littered with Hessians, so you’ll find them in that field.</TEXT><PARA/><POP/></RDL>'''
2647 = '''<RDL><PUSH/><TEXT>Since the Dornmark authorities have deemed this system too unsafe to patrol, we are the only protection that the corporations have from Rift Captains and Cinder Guard. This place is hell; if you don’t get your brains cooked out of your head by radiation, the pirates will kill you.</TEXT><PARA/><POP/></RDL>'''
2648 = '''<RDL><PUSH/><TEXT>You can do yourself a favor and run Diamonds for us to Vogtland. Once there, you may wish to purchase basic supplies and other necessities like Side Arms and Engine Components. Bring those Commodities back here and we will buy them from you.</TEXT><PARA/><POP/></RDL>'''
2649 = '''<RDL><PUSH/><TEXT>Hessians on Freistadt ship us many of the basic Commodities we require at this base. They also bring Engine Components with them.</TEXT><PARA/><POP/></RDL>'''
2650 = '''<RDL><PUSH/><TEXT>Everything needed to keep a base running is sent from Freital to Ronneburg. We are their suppliers, as Vogtland supplies us. If you enjoy being friends with the Hessians, you can always help us out by running these shipments.</TEXT><PARA/><POP/></RDL>'''
2651 = '''<RDL><PUSH/><TEXT>The miners who work the Daumann mining plant in this system hate us. Those stupid fools are the ones who went back to work for Daumann after the Popular Revolt. Anyone who labors away for Daumann doesn’t have the brains to know when to get out.</TEXT><PARA/><POP/></RDL>'''
2652 = '''<RDL><PUSH/><TEXT>If you want to move up the ladder with the Cinder Guard quickly, you come to Omega-11. Diamonds all over. There are Rift Captains here, too, but not like Omega-5. My comrade went to “The Five” to fight. I’m pretty sure he’s dead now.</TEXT><PARA/><POP/></RDL>'''
2653 = '''<RDL><PUSH/><TEXT>The ships that disappear in Van Rohe aren’t always cooked by flares. If I snag a ship in the belt, I’m going to destroy it. I don’t let the crew come back to whine to Daumann. Better to let everyone think they got torched by a flare.</TEXT><PARA/><POP/></RDL>'''
2654 = '''<RDL><PUSH/><TEXT>The Van Rohe Belt is filled with Diamonds, and so are the shipments out of here. Take your pick, just be careful if you’re gonna go looking for Diamonds in the belt; a bad solar flare will melt your ship before you can put on a pair of sunglasses.</TEXT><PARA/><POP/></RDL>'''
2655 = '''<RDL><PUSH/><TEXT>This system offers plenty of mobility; she’s got five Jump Holes that will take you to Omega-41, Omega-5, Omega-7, Stuttgart, or Dresden. The one to Dresden leads to Vogtland; that’s where our diamonds go. Then they get hauled to Kreuzberg where the Junkers fence them.</TEXT><PARA/><POP/></RDL>'''
2656 = '''<RDL><PUSH/><TEXT>I worked at Solarius years ago until I wised up. I earned danger pay but it didn’t compare to what I earn now. I quit when an entire load of Diamonds we were shipping was stolen. Why not be the guys who steal the Diamonds instead of giving them up to Daumann?</TEXT><PARA/><POP/></RDL>'''
2657 = '''<RDL><PUSH/><TEXT>We purchase our basic supplies and H-Fuel here for the Dortmund Smelter. Berlin needs Basic Alloys for the Consumer Goods factories, which we produce in our Scrap Metal recycling unit in Dortmund.</TEXT><PARA/><POP/></RDL>'''
2658 = '''<RDL><PUSH/><TEXT>Unlike Republican and Daumann ships, ALG ships are not viewed by of Dornmark criminals as a threat. We’ve tried to take a less antagonistic approach in dealing with our current and former employees in the hope that we can avoid the poor labor relations that have plagued other Dornmark companies.</TEXT><PARA/><POP/></RDL>'''
2659 = '''<RDL><PUSH/><TEXT>ALG has cleaned up this system dramatically since the early Daumann days. They are still operating smelters using centuries-old technology. One visit to Leipzig will show you the harmful effects of Daumann’s unregulated emissions of pollutants.</TEXT><PARA/><POP/></RDL>'''
2660 = '''<RDL><PUSH/><TEXT>Daumann buys supplies for most of our bases in Berlin. Republican does not enter Dresden or Omega-11, so we must support our own operations. I’m bound for Leipzig with Water, Pharmaceuticals, and Consumer Goods.</TEXT><PARA/><POP/></RDL>'''
2661 = '''<RDL><PUSH/><TEXT>Our headquarters is in the Ring, high above Berlin at the La Grange point between Ironreach and Potsdam. At least up there we never have to worry about the notorious Berlin night, which lasts upwards of a year here. It would be lifeless on this planet without the strong volcanic and geothermal activity.</TEXT><PARA/><POP/></RDL>'''
2662 = '''<RDL><PUSH/><TEXT>At least in Ironreach, one has a reasonable amount of security provided by the Federal Police. Out in the Omega systems and Dresden, the Cinder Guard are running amok. Their flame is fed by the growing legions of unemployed Dornmark workers.</TEXT><PARA/><POP/></RDL>'''
2663 = '''<RDL><PUSH/><TEXT>Just picking up supplies for our base in the Ruhrfeld. We need a wide variety of goods for all the people who might just happen by our base. Side Arms and Engine Components are two of the higher-value items that have proved popular with the criminally minded.</TEXT><PARA/><POP/></RDL>'''
2664 = '''<RDL><PUSH/><TEXT>If you want to find Diamonds cheaply, go out into Omega-11. That’s where the Hessians find them. They bring ’em in to Kreuzberg, we sell them to the Berlin Diamond traders. It’s all perfectly legitimate.</TEXT><PARA/><POP/></RDL>'''
2665 = '''<RDL><PUSH/><TEXT>If you want to make the real money, haul in some Cardamine or Artifacts from Kreuzberg. Just remember, if you get caught by the police, I’ve never seen you in my life.</TEXT><PARA/><POP/></RDL>'''
2666 = '''<RDL><PUSH/><TEXT>My ship just arrived from Bautzen. That’s our base in Dresden. The Hessians attacked us twice. The first time it was just before the Berlin Gate. Then another group ambushed us on the south Trade Lane in Ironreach. Good thing we had an armored transport.</TEXT><PARA/><POP/></RDL>'''
2667 = '''<RDL><PUSH/><TEXT>It’s nice to be in a civilized city again. Our ship just came in from Omega-7 with a load of Silver. The Hessians love the thick clouds of the Walker. Once you enter open space in Stuttgart, it gets better. Then there’s another difficult stretch passing the Saarfeld in this system — a notorious area for Hessian pirates.</TEXT><PARA/><POP/></RDL>'''
2668 = '''<RDL><PUSH/><TEXT>Kruger has an experimental H-Fuel center in Mannheim, Frankfurt. I don’t know why we bother to continue the operation. Only the government subsidy keeps our price competitive with Orsena and GMG gas from the Crow Nebula.</TEXT><PARA/><POP/></RDL>'''
2669 = '''<RDL><PUSH/><TEXT>Ironreach produces most of Dornmark’s Consumer Goods. My ship makes the runs to the other home planets on a regular basis. Unioners are always waiting for us in Hamburg. In Stuttgart it depends on the Red Hessian activity level.</TEXT><PARA/><POP/></RDL>'''
2670 = '''<RDL><PUSH/><TEXT>Berlin is the Diamond-trading center of Sirius. They’re mined-out in Dresden and Omega-11. Daumann and Kruger ship them in here, where the initial sorting and cutting takes place. Then we ship them to the far corners of the universe for use in Luxury Goods or Mining Machinery.</TEXT><PARA/><POP/></RDL>'''
2671 = '''<RDL><PUSH/><TEXT>The Silver that Kruger mines in Omega-7 ends up in the Commodity markets of Ironreach. We then transport it to Orsena and Helion. It’s especially in demand in terraforming operations like the one on California Minor.</TEXT><PARA/><POP/></RDL>'''
2672 = '''<RDL><PUSH/><TEXT>Berlin’s a strange place. Night and day each last a year because of the planet’s extremely slow rotation rate. You’re lucky — we just emerged into daylight a month ago. People get crazy toward the end of the dark period.</TEXT><PARA/><POP/></RDL>'''
2673 = '''<RDL><PUSH/><TEXT>The Federal Police runs a daily patrol up into the Aachenfeld to keep an eye on the Bundschuh and the Unioners. Dornmark’s full of splinter groups like them. Their usual targets are the Ring and the Oder Shipyard. Everyone wants to overthrow the government and big business in Dornmark.</TEXT><PARA/><POP/></RDL>'''
2674 = '''<RDL><PUSH/><TEXT>Sometimes we have to deal with demonstrations and riots, which has become an all-too-frequent occurrence in Berlin these days. It’s easy to control them because so much of Berlin was built underground. We just seal the doors to the entire affected area.</TEXT><PARA/><POP/></RDL>'''
2675 = '''<RDL><PUSH/><TEXT>Dornmark has seen better days. Since the end of the war, we’ve had one crisis after another. The Popular Revolution never fulfilled its promise. The government just keeps issuing more money in order to pay off its debts, so the inflation rate is out of control. It’s running about 5 percent a week right now.</TEXT><PARA/><POP/></RDL>'''
2676 = '''<RDL><PUSH/><TEXT>The old Harz mining area south of Ironreach is favored by the Cinder Guard. They prefer to attack the Trade Lane to Brandenburg, especially Daumann ships. There’s some pretty bad blood between those two.</TEXT><PARA/><POP/></RDL>'''
2677 = '''<RDL><PUSH/><TEXT>Artifacts and Cardamine have recently begun appearing in the high-end clubs of Berlin. We think the Junkers are involved, though they’re hard to pin down. They always seem to know when we’re planning a sting operation. Smells like a mole to me.</TEXT><PARA/><POP/></RDL>'''
2678 = '''<RDL><PUSH/><TEXT>The Federal Police was once a proud agency. Now we are underpaid and demoralized. Many of the younger officers accept bribes, which was unheard of among the old timers. Guess the hard times have finally hit us too.</TEXT><PARA/><POP/></RDL>'''
2679 = '''<RDL><PUSH/><TEXT>Ironreach was once the mining center of Dornmark. But over the centuries all of the deposits were exhausted. Now most of the new activity is in Omega-7. Even Dresden is not what it once was.</TEXT><PARA/><POP/></RDL>'''
2680 = '''<RDL><PUSH/><TEXT>Dornmark has been humiliated militarily and economically bankrupted by the poor decisions of Empress Leicht 200 years ago. Now we must suffer the injustice of foreign corporations occupying our homeland. Someday Dornmark will once again be strong enough to control its destiny.</TEXT><PARA/><POP/></RDL>'''
2681 = '''<RDL><PUSH/><TEXT>Synth Foods is proud to be the exclusive supplier of both standard and Luxury Foods to the people of Dornmark. The citizens of Ironreach have grown to love our products, which are considerably cheaper than the food formerly produced by the WVS on Stuttgart.</TEXT><PARA/><POP/></RDL>'''
2682 = '''<RDL><PUSH/><TEXT>We are concerned by recent reports that the Cinder Guard have become sympathetic to the LWB and are planning new strikes focused on Synth Foods convoys. The LWB are an irritating annoyance. The Hessians are an entirely different matter.</TEXT><PARA/><POP/></RDL>'''
2683 = '''<RDL><PUSH/><TEXT>The LWB has many supporters in Ironreach, so we must spend heavily here to defeat their cause. The Dornmark officials expect ever-larger bribes from us. It’s the cost we pay to continue our expansion plans in Stuttgart, unfettered by government interference.</TEXT><PARA/><POP/></RDL>'''
2684 = '''<RDL><PUSH/><TEXT>Berlin is a new route for Universal. Before the little loan agreement between Helion and Dornmark, Universal and Synth Foods couldn’t land on any planets here. Now that’s all changed, of course. We do the Luxury Goods-Diamond circuit between Whiteharbor and Berlin.</TEXT><PARA/><POP/></RDL>'''
2685 = '''<RDL><PUSH/><TEXT>My ship’s down from Bonn — that large space station at the western end of this system. We buy our basic supplies here. Kind of a Helion outpost up there. Synth Foods, Bounty Hunters, IC — they all call Bonn home.</TEXT><PARA/><POP/></RDL>'''
2686 = '''<RDL><PUSH/><TEXT>Let me tell you, Dornmark is tough. It’s a cakewalk through Helion, even the Texas system isn’t that bad. Then wham, you hit the Independent Worlds. We have to rearm in Houston and beef up the escorts for the rest of the trip here. At least we don’t have the LWB headache that Synth Foods is dealing with.</TEXT><PARA/><POP/></RDL>'''
2687 = '''<RDL><PUSH/><TEXT>Daumann doesn’t like us here, but they have no choice. We provide the shipyard with MOX, and haul away its Toxic Waste and Scrap Metal for reprocessing at our Dortmund furnaces.</TEXT><PARA/><POP/></RDL>'''
2688 = '''<RDL><PUSH/><TEXT>ALG is in negotiations with the military to build a new shipyard near Dortmund to produce the next line of Dornmark battleships. Engineers recently demonstrated locally produced Super Alloys that met the stringent requirements set by the Bremen ship design team. Soon Dornmark will be free of importing that particular Commodity from Helion.</TEXT><PARA/><POP/></RDL>'''
2689 = '''<RDL><PUSH/><TEXT>Our original mining areas in Ironreach have been exhausted for 300 years, and Vespera has supplied all of Dornmark with its Basic Alloys and Ship Hull Panels ever since. We are proud to once again produce these manufactured goods in Dornmark at our Dortmund facility.</TEXT><PARA/><POP/></RDL>'''
2690 = '''<RDL><PUSH/><TEXT>The military shipyards always need Boron, so we do a monthly run in from Holstein, in the Frankfurt system. Daumann has a seawater salt extraction plant there.</TEXT><PARA/><POP/></RDL>'''
2691 = '''<RDL><PUSH/><TEXT>It is an arduous journey from Omega-3 to Ironreach. We must contend with Red Hessian attacks along the entire route. All for some simple Polymers.</TEXT><PARA/><POP/></RDL>'''
2692 = '''<RDL><PUSH/><TEXT>It seems like all the cargo runs into Berlin are difficult now. The Cinder Guard have become too strong. Crossing Dresden is becoming a tenuous proposition, at best. Last week, two successive convoys outbound from Leipzig with High-Temperature Alloys were set upon and annihilated by Hessians.</TEXT><PARA/><POP/></RDL>'''
2693 = '''<RDL><PUSH/><TEXT>This yard consumes many materials from distant places. Republican transports Superconductors and Super Alloys from Helion, and Optical Chips from Orsena. Gold is shipped in from Vespera. The rest of the materials are locally procured.</TEXT><PARA/><POP/></RDL>'''
2694 = '''<RDL><PUSH/><TEXT>Republican and Daumann relations have never fully recovered since we’ve hired away so many of their top ship design engineers over the years. The dissatisfaction among Daumann personnel has become acute since the end of the Eighty-Years War. We can’t help it if there’s no work for them here.</TEXT><PARA/><POP/></RDL>'''
2695 = '''<RDL><PUSH/><TEXT>The Unioners are Republican Shipping’s biggest problem. There are other pirates out there to fend off, but when we are going up against Unioners it gets personal.</TEXT><PARA/><POP/></RDL>'''
2696 = '''<RDL><PUSH/><TEXT>Republican supplies Oder with its basic needs. Berlin is the cheapest place to buy most of those items in the immediate area. You have to be careful of Unioners and the like, even in the shadow of Berlin. They will attack any Republican ship within range.</TEXT><PARA/><POP/></RDL>'''
2697 = '''<RDL><PUSH/><TEXT>Our shipyard is actually just part of the Ring. We like to consider it as a separate entity, however. We do not approve of Daumann’s methods, and would like to cultivate a different culture that is more respectful of the rank-and-file worker.</TEXT><PARA/><POP/></RDL>'''
2698 = '''<RDL><PUSH/><TEXT>The Oder Shipyard built all the ships of the great Imperial Fleet —now just shattered hulks and wreckage drifting through the clouds of Sigma-13. My great-grandfather was serving on a cruiser that was lost with all hands during the Battle of the Yanangi Cloud.</TEXT><PARA/><POP/></RDL>'''
2699 = '''<RDL><PUSH/><TEXT>We know Orsena has been trying to decipher the alien technology that Helion has so jealously guarded for many centuries. Our government has a similar research plan, but no money to spend on it. We did send several expeditions into the Edge Worlds in search of Alien Artifacts — with mixed results.</TEXT><PARA/><POP/></RDL>'''
2700 = '''<RDL><PUSH/><TEXT>We were once a proud force, serving all of Dornmark. But we now limp toward oblivion. The ships are old, there are many accidents, and nobody is paid for months at a time. All the government’s money goes to repay the Helion debts that Dornmark incurred more than a century ago.</TEXT><PARA/><POP/></RDL>'''
2701 = '''<RDL><PUSH/><TEXT>Dornmark must find a way to manufacture the Superconductors that are produced exclusively by Helion. It seems wasteful to ship our cheap raw materials halfway across Sirius to Ageira’s plant in Pueblo. Our new ship design is far more advanced than the </TEXT><TRA italic="true"/><TEXT>Westfalen</TEXT><TRA italic="false"/><TEXT>, and will require development of new propulsion and shielding technologies.</TEXT><PARA/><POP/></RDL>'''
2702 = '''<RDL><PUSH/><TEXT>Our newest battleship, the </TEXT><TRA italic="true"/><TEXT>Bremen</TEXT><TRA italic="false"/><TEXT>, has not even passed the design stage. No money, they say. Dornmark has only one operational capital ship, the </TEXT><TRA italic="true"/><TEXT>Westfalen</TEXT><TRA italic="false"/><TEXT>. It is serving as a large police post to patrol northern Hamburg.</TEXT><PARA/><POP/></RDL>'''
2703 = '''<RDL><PUSH/><TEXT>Because we have no money or ships, we cannot patrol the Trade Lanes in Omega-7 or protect the Daumann operations in Dresden and Omega-4. The police must make do as well as they can, but that’s not always sufficient when Cinder Guard are involved.</TEXT><PARA/><POP/></RDL>'''
2704 = '''<RDL><PUSH/><TEXT>The Dornmark Military was once the envy of all the Houses. Now we are the topic of jokes even in Vespera bars. Dornmark has many resources, it just lacks a coherent government policy and strategy to guide us into the future.</TEXT><PARA/><POP/></RDL>'''
2705 = '''<RDL><PUSH/><TEXT>Daumann has been our partner for as long as anyone can remember. There are murmurings from the High Command that we should investigate ALG. They are developing superior materials at lower cost than Daumann. And their workers seem more motivated and productive.</TEXT><PARA/><POP/></RDL>'''
2706 = '''<RDL><PUSH/><TEXT>The Ring is one of Dornmark’s most famous landmarks. On a clear day, you can see it planetside on Berlin. It is positioned at the La Grange point between Potsdam and Berlin, where the gravitational attraction of the planet and moon effectively neutralize each other. That enables the Ring to maintain a stable orbit with minimal attitude and speed corrections, which would otherwise exert substantial forces on such a large structure.</TEXT><PARA/><POP/></RDL>'''
2707 = '''<RDL><PUSH/><TEXT>The Orsena Engine Component manufacturer Kishiro has benefited greatly from ALG’s entry into the High-Temperature Alloy market. It has been difficult to compete with the cheaper Orsena imports since ALG began shipping them their raw materials. Daumann feels that ALG has betrayed the future of Dornmark industrial might for their short-term monetary gain.</TEXT><PARA/><POP/></RDL>'''
2708 = '''<RDL><PUSH/><TEXT>The truth is, Daumann viewed the Eighty-Years War as an excellent way to make large amounts of money in the ship-building business, which ultimately supports all our primary extraction operations. The ships lost during the War may have been costly for Dornmark, but were very profitable for the owners and shareholders of Daumann Heavy Construction.</TEXT><PARA/><POP/></RDL>'''
2709 = '''<RDL><PUSH/><TEXT>The Ring also houses the Oder Shipyard. It has served as headquarters for Daumann Heavy Construction since it was first built in 310 AS. Engine Components, Construction Machinery, and Side Arms are the primary products of the factories around us.</TEXT><PARA/><POP/></RDL>'''
2710 = '''<RDL><PUSH/><TEXT>The workers in Leipzig and the Ring have always been treated as well as market conditions could justify. That is a myth spread by the Red Hessian miscreants in order to recast their acts of common piracy as part of a just political cause.</TEXT><PARA/><POP/></RDL>'''
2711 = '''<RDL><PUSH/><TEXT>Many goods pass through the Ring on their way to distant lands. This facility serves as Daumann’s transfer point for its various mining operations further afield in Dresden and the Omega systems. From here, Republican ships haul our minerals and finished goods to Orsena, Helion, and Vespera.</TEXT><PARA/><POP/></RDL>'''
2712 = '''<RDL><PUSH/><TEXT>The industrial pollution and horrors that have been blamed on Daumann are completely groundless. The Bundschuh and other political terrorists view us as the villains of Dornmark. We have provided generations of Dornmark workers with secure jobs and decent pay. Yet they always want to work less and make more. We couldn’t possibly meet their demands and still be profitable.</TEXT><PARA/><POP/></RDL>'''
2713 = '''<RDL><PUSH/><TEXT>Daumann provides the Cobalt and High-Temperature Alloys for the Engine Components manufacturing plants from our mining and smelting operation of Leipzig, in the Dresden system. On the return trip, we will often take Vespera-produced Niobium.</TEXT><PARA/><POP/></RDL>'''
2714 = '''<RDL><PUSH/><TEXT>The Ring is the terminating point for inbound Daumann transports delivering Polymers and Hydrocarbons from the base of Reugen in Omega-3. That system also contains a BMM operation producing the same materials, so it is a very competitive route.</TEXT><PARA/><POP/></RDL>'''
2715 = '''<RDL><PUSH/><TEXT>My ship specializes in Side Arms shipments to the various Federal Police locations within Dornmark space. Republican is the exclusive supplier of Arms to government bases within Dornmark. Daumann Side Arms are unfortunately not used in other areas of Sirius in great numbers; Detroit dominates the export market.</TEXT><PARA/><POP/></RDL>'''
2716 = '''<RDL><PUSH/><TEXT>Republican has enjoyed a long and fruitful relationship with Daumann. We view the ALG/Gateway/IMG partnership as a serious challenge to the proper way of doing business in Dornmark. After all, two of these companies are of Vesperan origin. It would be a grave mistake for Kruger to join forces with those foreigners.</TEXT><PARA/><POP/></RDL>'''
2717 = '''<RDL><PUSH/><TEXT>The Ring is the focal point for Republican-shipping activity within Berlin space. We import superconductors from Helion and Beryllium from Vespera via our Freiburg station. Engine Components are exported from here to Helion and Vespera on a regular basis.</TEXT><PARA/><POP/></RDL>'''
2718 = '''<RDL><PUSH/><TEXT>Orsena shippers are still not allowed into Dornmark space; the only concession from Orsena that Dornmark was able to be granted in the treaty that ended the Eighty-Years War. Samura and Kishiro offload their Optical Chips, Optronics, and H-Fuel at the Mainz Outpost in Frankfurt.</TEXT><PARA/><POP/></RDL>'''
2719 = '''<RDL><PUSH/><TEXT>The Ring is a key transfer point for Colorado-bound raw materials like Copper and Cobalt. Daumann ships them here from their mines in Dresden and Omega-7. The security risks are considered too high for Republican to ship directly from those systems.</TEXT><PARA/><POP/></RDL>'''
2720 = '''<RDL><PUSH/><TEXT>From this base, we supply the Alster Shipyard with some of its key raw materials — Engine Components and Polymers, to be precise. It is not a hugely profitable run, and the Unioners make it difficult for Republican ships.</TEXT><PARA/><POP/></RDL>'''
2721 = '''<RDL><PUSH/><TEXT>The Guild has been in Dornmark since IC was allowed to establish this station in 730. Many of the early members here were Helion transplants. That didn’t sit too well with the locals. The typical recruit nowadays is more likely to be an unpaid Dornmark Federal Police officer or a reformed Red Hessian just out of Vierlande.</TEXT><PARA/><POP/></RDL>'''
2722 = '''<RDL><PUSH/><TEXT>If you want a real challenge, head out to Solarius in Omega-11. Daumann needs Bounty Hunters to help them with basic security. It’s a rough post, but you can go Diamond mining while you’re out looking for Hessians and Rift Captains.</TEXT><PARA/><POP/></RDL>'''
2723 = '''<RDL><PUSH/><TEXT>There’s a simple reason that the main areas of criminal activity in Berlin are in the Ruhrfeld and Saarfeld: That’s where the Jump Holes are. The Hamburg Hole is in the northern part of the Ruhr; the Saar Hole leads to Dresden.</TEXT><PARA/><POP/></RDL>'''
2724 = '''<RDL><PUSH/><TEXT>There’s good business for the Guild down in Dresden. Daumann and Kruger are both looking for Bounty Hunters to guard their operations. Kruger is the better one because you can always go Diamond mining when no one is looking. You’ll earn your keep, though. Plenty of Hessians to go around in Dresden.</TEXT><PARA/><POP/></RDL>'''
2725 = '''<RDL><PUSH/><TEXT>Beware of the radioactive areas in the Ruhr. They’re up in the mid-section, north of the Junker Debris pocket. The Ruhr used to be Dornmark’s center of uranium mining and processing.</TEXT><PARA/><POP/></RDL>'''
2726 = '''<RDL><PUSH/><TEXT>This sure beats the police. I hadn’t been paid in two months. The rest of my post had turned to “Trade Lane tolls” that they forced passing ships to pay. Berlin got wind of it and sent the lot of them to Vierlande to discourage others sharing the same thought. I decided to change professions and try to earn some legitimate money.</TEXT><PARA/><POP/></RDL>'''
2730 = '''<RDL><PUSH/><TEXT>The Helion folks lobbied the Dornmark government quite heavily to allow us to land here. Not quite so sure what their real intentions were, but it’s been a boon for the IMG and Gateway. We haul their Copper and Silver from Omega-3.</TEXT><PARA/><POP/></RDL>'''
2731 = '''<RDL><PUSH/><TEXT>Gateway and the IMG haven’t had nearly the problems with the Cinder Guard that Kruger and Daumann have. We try to tolerate them as much as possible, which specifically means not hiring Bounty Hunters to chase them down.</TEXT><PARA/><POP/></RDL>'''
2732 = '''<RDL><PUSH/><TEXT>We’re doing very well on this route since Helion decided to use us as a secondary source of metals for their factories and smelters. Word was that they didn’t trust Daumann anymore and were concerned with the Hessians shutting off the flow of Copper through Dresden.</TEXT><PARA/><POP/></RDL>'''
2733 = '''<RDL><PUSH/><TEXT>Interspace Commerce monitors the Trade Lane network of Dornmark from this station. If repeat offenders involved in Lane attacks can be identified, the Bounty Hunters are sent off to dispose of them.</TEXT><PARA/><POP/></RDL>'''
2734 = '''<RDL><PUSH/><TEXT>The Dornmark government asked IC to leave after the trade dispute of 521. We were not able to return to Ironreach until the agreement between Helion and Dornmark following the Eighty-Years War. Helion companies were granted free access to Dornmark space at that time.</TEXT><PARA/><POP/></RDL>'''
2735 = '''<RDL><PUSH/><TEXT>Dornmark and its adjacent Border Worlds now suffer the dubious distinction of having the highest shipping insurance rates in the Nacre Reach. We have advised the Vesperan and Orsena militaries of the situation in the hope that a special arrangement can be made to keep the Border World Trade Lanes operating in this area.</TEXT><PARA/><POP/></RDL>'''
2736 = '''<RDL><PUSH/><TEXT>Bonn receives most of its basic supplies from Ironreach, with the exception of food. That’s brought in from Stuttgart by Synth Foods. This station is also the exclusive Dornmark distributor for spare Trade Lane parts — always in demand in the Omega systems.</TEXT><PARA/><POP/></RDL>'''
2737 = '''<RDL><PUSH/><TEXT>Dornmark is plagued by a wide variety of criminals, some political, others engaged in common piracy. It is the latter group that interests us. Excessive insurance claims made by shipping companies and damage inflicted to the physical Trade Lane infrastructures can lead to decreased profits.</TEXT><PARA/><POP/></RDL>'''
2738 = '''<RDL><PUSH/><TEXT>The Eighty-Years War was a colossal mistake for Dornmark. The nation was fairly self-sufficient and prosperous, yet Kruger was not content. They had fallen behind Daumann, and hoped that the gases of the Crow Nebula would be their salvation. It was Daumann that actually persuaded the government to step in, for reasons of cynical self-interest. They knew that fat military contracts would head their way once the fighting began in earnest.</TEXT><PARA/><POP/></RDL>'''
2739 = '''<RDL><PUSH/><TEXT>We will issue a decision on the Omega-7 system shortly. There are field agents assessing the situation. IC may no longer insure cargo in that system, as in Dresden after the rise of the Cinder Guard. This would significantly increase the exposure of area shippers to catastrophic losses.</TEXT><PARA/><POP/></RDL>'''
2740 = '''<RDL><PUSH/><TEXT>IC is very concerned that the Dornmark Military has proven unable to patrol the Omega-7 system satisfactorily. That is a crucial shipping route between Dornmark and Vespera. Many of the precious metals in the Nacre Reach are found there. In particular, the future Copper supply for Ageira’s plant in Colorado.</TEXT><PARA/><POP/></RDL>'''
2741 = '''<RDL><PUSH/><TEXT>The Sigma-13 Trade Lane attacks have attained crisis status. The Rift Captains and Ashbound grow stronger with every passing year, and the GMG seems to be unable to effectively defend their territory as they did during the Eighty-Years War. The Edge World pirates have proven to be far more formidable adversaries than the Dornmark Imperial Fleet.</TEXT><PARA/><POP/></RDL>'''
2742 = '''<RDL><PUSH/><TEXT>The cursed LWB has teamed up with the Hessians. They must have pleaded their cause to repel the foreign invader or something. Now we have a much-better-armed adversary to contend with. Los Angeles never thought it would escalate to this.</TEXT><PARA/><POP/></RDL>'''
2743 = '''<RDL><PUSH/><TEXT>The LWB was getting a lot of flack from the Dornmark public for attacking their food supply. So now they’ve switched to Fertilizers. They figure if our costs get high enough, we’ll have to reconsider the current assimilation strategy of Stuttgart. They may have a point.</TEXT><PARA/><POP/></RDL>'''
2744 = '''<RDL><PUSH/><TEXT>Stuttgart may prove to be the undoing of Synth Foods. Nobody imagined the ferocity with which the LWB would strike back. Nor did we realize how challenging the criminal situation was in Dornmark. Our Fertilizer ships have to be specially armed just to survive the trip from Houston to Bonn. Escorts are required on all runs to and from Stuttgart.</TEXT><PARA/><POP/></RDL>'''
2745 = '''<RDL><PUSH/><TEXT>We supply Bonn with the basics from Ironreach while we’re waiting for a load of Copper or Silver from Gateway. Then we’re off to Whiteharbor or Houston.</TEXT><PARA/><POP/></RDL>'''
2746 = '''<RDL><PUSH/><TEXT>Bonn is burning through the Trade Lane spare-parts supply pretty fast. Deep Space is out there in Omega-7 or Stuttgart every other week. Looks like we’ll have to bring in another load sooner than expected from Ember Pier.</TEXT><PARA/><POP/></RDL>'''
2747 = '''<RDL><PUSH/><TEXT>This is the end of the line for Universal. Management says that it’s not worth it to go into Stuttgart. Too many problems. Just look at Synth Foods. Their security costs could bite them one of these days. Maybe the LWB will actually defeat Goliath.</TEXT><PARA/><POP/></RDL>'''
2748 = '''<RDL><PUSH/><TEXT>ALG reprocesses the Toxic Waste from ships and furnaces throughout the Nacre Reach into fresh MOX pellets using special breeder reactors. Dornmark no longer contains enough Toxic Waste source material for our needs, so we have entered into agreements with the Helion government and Ageira to ensure a reliable supply.</TEXT><PARA/><POP/></RDL>'''
2749 = '''<RDL><PUSH/><TEXT>ALG was founded in 88 AS to handle the cleanup of Daumann and Kruger mining operations within Ironreach. We were also instrumental in developing the specialized materials and construction methods necessary to adapt to the highly oxidizing environment of Stuttgart. In 460, we were tasked to clean up the Ruhr uranium mining field, that Daumann had exhausted and left abandoned.</TEXT><PARA/><POP/></RDL>'''
2750 = '''<RDL><PUSH/><TEXT>BMM controls the only remaining Uranium-mining area in Sirius. LD-14 still provides the bulk of newly processed MOX fuel for Vespera. Our enrichment and recycling technologies are far more advanced, however, enabling us to offer a more competitive price within Helion.</TEXT><PARA/><POP/></RDL>'''
2751 = '''<RDL><PUSH/><TEXT>Our partnership with ALG and the IMG has proven very fruitful. We now have a shipper and mining company to support our manufacturing prowess. We have taken great care to avoid the acrimonious labor relations that plague Daumann and Republican by treating our workers well, and strictly enforcing safety procedures.</TEXT><PARA/><POP/></RDL>'''
2752 = '''<RDL><PUSH/><TEXT>ALG Waste Disposal is proud to be at the forefront of Scrap Metal recycling efforts within the Nacre Reach. We are now under contract to clean all of Helion’s Debris fields by 850 AS. We are also engaged in the clean-up of the Yanagi battlefield in Sigma-13, which had created hazards for shipping.</TEXT><PARA/><POP/></RDL>'''
2753 = '''<RDL><PUSH/><TEXT>We have stripped Dornmark of almost all the viable Scrap Metal deposits. Only the pocket around Kreuzberg in the Ruhr Field remains. The Junkers do not seem to be in any hurry to remove their last source of legitimate income within the Ironreach system. A similar situation exists in Sigma-13.</TEXT><PARA/><POP/></RDL>'''
2754 = '''<RDL><PUSH/><TEXT>Scrap is melted into its constituent metals in our furnaces. It’s then blended with Beryllium, Cobalt, Copper, or Niobium to create Basic and High-Temperature Alloys. From those basic components we manufacture Ship Hull Panels and Industrial Furnaces for use in shipbuilding and manufacturing plants.</TEXT><PARA/><POP/></RDL>'''
2755 = '''<RDL><PUSH/><TEXT>Anyone interested in MOX for criminal purposes is an enemy of ALG. Our most pressing threat is currently the Xenos, who see us as foreigners to be attacked on sight. The Rift Captains and Ashbound have also been troublesome within Sigma-13. ALG would prefer to not ship MOX or Toxic Waste, but Gateway is not interested in such dangerous cargo.</TEXT><PARA/><POP/></RDL>'''
2756 = '''<RDL><PUSH/><TEXT>ALG Ship Hull Panels supply the civilian shipyards in Hamburg, Honshu, and Cinderwell. Our only competitor is the Stokes Smelter in Leeds. BMM is using outdated production methods which are less cost effective than ours, so we are confident that ALG will soon own all of this market.</TEXT><PARA/><POP/></RDL>'''
2757 = '''<RDL><PUSH/><TEXT>We bring in most of the minerals that ALG needs for its smelters here. My ship usually hauls Beryllium or Niobium in from Kensington or Cardiff. On the return, we’re running High-Temperature Alloys to Southampton. That’s sure rocked the boat with Republican; they’ve had that little market to themselves for a very long time.</TEXT><PARA/><POP/></RDL>'''
2758 = '''<RDL><PUSH/><TEXT>It’s a good thing that they trade Polymers and Hydrocarbons on Freeport I. Otherwise ALG would have a difficult time buying any at a good price, since BMM and Daumann pretty much control those Commodities in this part of Sirius.</TEXT><PARA/><POP/></RDL>'''
2759 = '''<RDL><PUSH/><TEXT>We’ve started running in Copper and Cobalt from the IMG base in Freistadt. That’s in Omega-7. IMG gets its minerals to ALG, and we profit. A nice arrangement for everyone concerned.</TEXT><PARA/><POP/></RDL>'''
2760 = '''<RDL><PUSH/><TEXT>My ship is picking up a load of Mining Machinery to take out to the IMG operation in Omega-7. We were just over at Dortmund across the way, dropping off some copper from Freistadt.</TEXT><PARA/><POP/></RDL>'''
2761 = '''<RDL><PUSH/><TEXT>There are a lot of people at Gateway who aren’t sure we should get so close to the Dornmarkers. We were doing fine with the IMG before ALG came along. Now they want to buy Kruger, which will result in a massive corporation like Daumann or Republican. We’re being straight-armed by ALG into accepting their proposal, with little or no say in the matter.</TEXT><PARA/><POP/></RDL>'''
2762 = '''<RDL><PUSH/><TEXT>Gateway does not often deal with Kruger. But that could change soon. They say that ALG will soon acquire the remnants of this once-proud company for next to nothing. Can’t say it surprises me; Kruger’s been on the ropes for decades.</TEXT><PARA/><POP/></RDL>'''
2763 = '''<RDL><PUSH/><TEXT>This has been Kruger’s headquarters since early in the second century. We are a proud family company that helped build the industrial might of Dornmark. Kruger still produces the finest Mining Machinery in the Nacre Reach, utilizing our cheap supply of Diamonds from the Dresden system.</TEXT><PARA/><POP/></RDL>'''
2764 = '''<RDL><PUSH/><TEXT>Kruger has seen better days. We’ve been forced to lay off many of our workers in recent times. Our company incurred vast debts at the beginning of the Eighty-Years War when we lost more than half our mining fleet to the GMG. We’ve never recovered from that dark period.</TEXT><PARA/><POP/></RDL>'''
2765 = '''<RDL><PUSH/><TEXT>Secret negotiations are underway between ALG and Kruger. ALG would like to merge our companies into one giant corporation that can build all types of machinery and Engine Components to finally truly compete with Daumann’s Ring. It is a tempting offer, but there are complications. The membership of the IMG, one of ALG’s partners, views us with suspicion. Many of them are former Kruger employees.</TEXT><PARA/><POP/></RDL>'''
2766 = '''<RDL><PUSH/><TEXT>The Aachenfeld was Kruger’s primary mining area for centuries. When it was exhausted, we were forced to expand our exploration efforts into Omega-7. We have a profitable Silver mine in operation there now. We also own a synthetic H-Fuel-extraction facility in the Frankfurt system.</TEXT><PARA/><POP/></RDL>'''
2767 = '''<RDL><PUSH/><TEXT>Kruger could once compete with Daumann, but they are now much larger and more diversified. We still hold a commanding lead in Mining Machinery, and hold key deposits of Diamonds and Silver. But that is not enough. Kruger Minerals will eventually be crushed by the Daumann goliath if radical steps are not taken soon.</TEXT><PARA/><POP/></RDL>'''
2768 = '''<RDL><PUSH/><TEXT>Daumann lies at the heart of Dornmark’s problems. They have paid for many a Dornmark government functionary’s palatial residence in the countryside of Stuttgart over the centuries. At the same time, their merciless treatment of workers in Leipzig led directly to the Popular Revolution and all the unrest that followed. You can thank them for the rise of the Cinder Guard.</TEXT><PARA/><POP/></RDL>'''
2769 = '''<RDL><PUSH/><TEXT>Our operations in Dresden and Omega-7 have been plagued by the Cinder Guard in recent times. We never mistreated our workers as Daumann has. Yet many of our laid-off workers that joined the Hessians soon felt that way. We are always in the shadow of Daumann — paying for their mistakes, or watching them profit from ours.</TEXT><PARA/><POP/></RDL>'''
2770 = '''<RDL><PUSH/><TEXT>Kruger’s management felt that we had no choice but to expand into the Crow Nebula. Daumann had blocked our expansion plans in Dresden, and Berlin was exhausted. We felt that there was enough gas for everyone in Sigma-13, but that viewpoint was obviously not shared by the GMG.</TEXT><PARA/><POP/></RDL>'''
2771 = '''<RDL><PUSH/><TEXT>Our H-Fuel-extraction operation in Mannheim is totally dependent on government subsidies for its survival. It has not been profitable since the end of the war, 120 years ago. Once Berlin can no longer support it, the last vestige of that sad chapter in Dornmark history will be gone.</TEXT><PARA/><POP/></RDL>'''
2772 = '''<RDL><PUSH/><TEXT>We supply this operation with Optical Chips from Houston. I guess they use them in their Mining Machinery-manufacturing process for control devices. On the return trip to Helion, we haul the Mining Machinery needed by the Dallas Debris Field prison crews and the Breakwater Boron-extraction operation.</TEXT><PARA/><POP/></RDL>'''
2773 = '''<RDL><PUSH/><TEXT>One day soon we will no longer stop here. Rumor has it that the ALG/Gateway alliance is gaining a new member. That would be a sad end to the proud family company of Kruger, last of the old “Mittlestand.”</TEXT><PARA/><POP/></RDL>'''
2774 = '''<RDL><PUSH/><TEXT>We must contend with many pirates on our journey to Helion. The Unioners await our ships in Hamburg and Bering. If we take the alternative route through Hudson, we often encounter Xenos. I’m not sure which are worse. Both groups represent the dregs of humanity.</TEXT><PARA/><POP/></RDL>'''
2775 = '''<RDL><PUSH/><TEXT>Just dropping off some supplies and Side Arms from Berlin. We don’t deliver them as often as we used to, since the government can’t afford to pay us. But we can’t let the police run out of Water and air now, can we?</TEXT><PARA/><POP/></RDL>'''
2776 = '''<RDL><PUSH/><TEXT>This is as far as Republican goes. The Trade Lane south of here and the Dresden system are off limits to our ships. Too dangerous out there. Daumann hauls its minerals and alloys to the Ring. We pick up the cargo there for the remainder of the journey to Helion or the other houses.</TEXT><PARA/><POP/></RDL>'''
2777 = '''<RDL><PUSH/><TEXT>We don’t get the Unioners so bad in this part of the system. They prefer to operate out of the Ruhrfeld. Guess that’s where their Jump Hole to Hamburg must be.</TEXT><PARA/><POP/></RDL>'''
2778 = '''<RDL><PUSH/><TEXT>Berlin ordered this post built about fifty years ago. The Hessians were using the old Saar and Harz mining areas as staging grounds to attack the southern Trade Lanes. We’re the only thing holding back the Hessian hordes from controlling the entire southern end of the Ironreach system.</TEXT><PARA/><POP/></RDL>'''
2779 = '''<RDL><PUSH/><TEXT>We do two field patrols out of here; one along the northern end of the Saar, the other into the Harz. Neither one is a walk in the park. The Hessians and the LWB lurk everywhere.</TEXT><PARA/><POP/></RDL>'''
2780 = '''<RDL><PUSH/><TEXT>Privately, the people of Dornmark are very unhappy with the greedy Helion companies — especially Synth Foods. They have destroyed the traditional way of life for the growers of the WVS on Stuttgart and stolen one of Dornmark’s most precious assets from her people.</TEXT><PARA/><POP/></RDL>'''
2781 = '''<RDL><PUSH/><TEXT>Daumann and Kruger convoys coming in from the Dresden Gate have been attacked numerous times in recent weeks. The Hessians patiently wait in the fields on either side until they enter the Trade Lane. Then they come out, guns blazing.</TEXT><PARA/><POP/></RDL>'''
2782 = '''<RDL><PUSH/><TEXT>I wouldn’t be surprised if there’s a Jump Hole in the Saarfeld. It sure seems to get a lot of criminal traffic. My guess is that the Hole accesses Dresden or Stuttgart. Hard to tell which.</TEXT><PARA/><POP/></RDL>'''
2783 = '''<RDL><PUSH/><TEXT>Synth Foods pays us well to keep the LWB under control in this area. At least they’ve got money, unlike our police force. We wouldn’t get paid at all if it weren’t for the foreigners. So I guess I can protect their shipping.</TEXT><PARA/><POP/></RDL>'''
2784 = '''<RDL><PUSH/><TEXT>There are many of us torn by our orders to dispose of so many of the Dornmark workers who have fallen onto hard times during the last eighty years. The LWB is a good example. They were once prosperous farmers on Stuttgart. Now they have resorted to violence against the foreign corporation of Synth Foods, which has occupied their homeland. Is that so wrong?</TEXT><PARA/><POP/></RDL>'''
2785 = '''<RDL><PUSH/><TEXT>Many of my comrades are joining the Bounty Hunters. They say you can make as much in one day killing Hessians as we get paid in a month. That is, if we get paid at all. The rich aristocrats of Berlin do not seem to be feeling our pain at all. There is money in Dornmark, but it is concentrated in the hands of an elite few.</TEXT><PARA/><POP/></RDL>'''
2786 = '''<RDL><PUSH/><TEXT>The asteroid fields around us were once the pride of Dornmark. Generations of early settlers mined the metals that brought riches to all. Then the rich and powerful grew greedy, and decided that they needed more. So they took it from the common man, instead of expanding their companies through innovation and sensible investment.</TEXT><PARA/><POP/></RDL>'''
2787 = '''<RDL><PUSH/><TEXT>We are here to obtain medical supplies and Side Arms for our base in Frankfurt. The Bundschuh are not common criminals like the rabble you see here. We are dedicated to overthrowing the government and restoring justice to Dornmark.</TEXT><PARA/><POP/></RDL>'''
2788 = '''<RDL><PUSH/><TEXT>The Bundschuh were instrumental in bringing about the Popular Revolution. We ensured that the Workers Convention of Rights was ratified by the Dornmark government in 705. Unfortunately, its terms were never honored by the Dornmark corporations, so little has changed.</TEXT><PARA/><POP/></RDL>'''
2789 = '''<RDL><PUSH/><TEXT>We are always looking for other factions to join our cause. I’m afraid we’ve lost the Cinder Guard, although we hold out hope for the Unioners and LWB, who have not entirely fallen into a mode of indiscriminate piracy.</TEXT><PARA/><POP/></RDL>'''
2790 = '''<RDL><PUSH/><TEXT>If you want to make friends with a Hessian, start shooting up some Daumann or Kruger ships. We mount many of our attacks in Berlin right out of this base. You’ve got Kruger’s base at Essen, and the Trade Lanes to Hamburg and Stuttgart. Plenty of choices, just depends what mood you’re in.</TEXT><PARA/><POP/></RDL>'''
2791 = '''<RDL><PUSH/><TEXT>The Hessians are always looking for able-bodied pilots who like a bit of a fight, especially if you hate Rift Captains like we do. We always need supplies up in Vogtland. That’s our headquarters in Dresden, through the Hole in the Saarfeld.</TEXT><PARA/><POP/></RDL>'''
2792 = '''<RDL><PUSH/><TEXT>I’ve just come in from the Freital base in Omega-11 with some Diamonds mined from the Von Rohe Belt. You’re on the edge of nowhere out there — Corsair country to the south and west. We’ve got a little war with them going in Omega-5, if you want some action.</TEXT><PARA/><POP/></RDL>'''
2793 = '''<RDL><PUSH/><TEXT>This is a good stop-over point for our forays into Hamburg. Not really our territory up there. We just make runs on the prison occasionally, mostly when they capture a senior pilot or someone else valuable to our cause.</TEXT><PARA/><POP/></RDL>'''
2794 = '''<RDL><PUSH/><TEXT>We’ve been helping the LWB a bit. They let us use their base in the Ostnebel in Stuttgart. They aren’t really up to Hessian standards as far as combat skill and equipment levels, but they are fast learners.</TEXT><PARA/><POP/></RDL>'''
2795 = '''<RDL><PUSH/><TEXT>It’s kind of nice to see a sun again. I’ve been trapped on Vogtland for months, repairing ships damaged in the Omega-5 battles. They let me have a little rest and recreation in Berlin. So I’m out popping Bounty Hunters and Daumann escort ships. I find it very therapeutic.</TEXT><PARA/><POP/></RDL>'''
2796 = '''<RDL><PUSH/><TEXT>Good Scrap is getting difficult to find around here. There are still some good pockets, but they’re in the radioactive areas, so that’s no good. At least it’s cheap paying off the police in Dornmark. Makes it much easier to do business.</TEXT><PARA/><POP/></RDL>'''
2797 = '''<RDL><PUSH/><TEXT>You’ll want to be careful in the northern areas of the Ruhr. There are some nasty pockets of radiation that’ll cook your ship pretty fast. The Jump Hole to Hamburg is up there too.</TEXT><PARA/><POP/></RDL>'''
2798 = '''<RDL><PUSH/><TEXT>If you want to risk it, we need Cardamine and Artifacts run into Ironreach. The police could care less about the Diamond trade, but they don’t budge on drugs and trinkets. Verboten. End of discussion.</TEXT><PARA/><POP/></RDL>'''
2799 = '''<RDL><PUSH/><TEXT>There’s a daily ship that makes the trip to Berlin with Diamonds that the Hessians bring in from Dresden and the Border Worlds. We usually stock up on Side Arms and Engine Components, which are tough to come by for most of the criminals that frequent our little depot.</TEXT><PARA/><POP/></RDL>'''
2800 = '''<RDL><PUSH/><TEXT>Hans just brought in some Artifacts and Cardamine from Yanagi. He had a close call in Hamburg with some Bounty Hunters, but otherwise it was a quiet trip. Sigma-13 is a new area for us Junkers. We’ve had to improve our shielding and general weaponry a lot just to survive out there in GMG country. It’s a long run from there, so you’d make some good money.</TEXT><PARA/><POP/></RDL>'''
2801 = '''<RDL><PUSH/><TEXT>The Hessians don’t like our tolerating the Rift Captains in Sigma-13. They’re locked in some death struggle for control of the southern Edge Worlds. Word is that the Hessians are winning because of all the fresh recruits they can find in Dornmark to send into the meat grinder.</TEXT><PARA/><POP/></RDL>'''
2802 = '''<RDL><PUSH/><TEXT>A lot of the local thugs use our depot as their bed for the night. They make raids out into the Lanes, then retreat to the comforts of home. Nothing like a nice big stein of Kreuzberg Weissbier after a hard day’s work blasting Synth Foods transports into oblivion.</TEXT><PARA/><POP/></RDL>'''
2803 = '''<RDL><PUSH/><TEXT>I can’t keep all the bad guys straight here, personally. The Bundschuh are elitist Berlin University types who are trying to change the world — go figure. The Unioners have it in for Republican Shipping, while the Cinder Guard aim more at Daumann. The LWB prefers to prey on Synth Foods. Of course, a lot of them will just knock over a passing ship if it’s an easy mark.</TEXT><PARA/><POP/></RDL>'''
2804 = '''<RDL><PUSH/><TEXT>We’d like to supply Helion with Artifacts and Cardamine from our Yanagi base using the Unioners as the couriers, but they won’t bite. They’ve got principles, they say. Diamond smuggling is perfectly legitimate in their eyes, I guess.</TEXT><PARA/><POP/></RDL>'''
2805 = '''<RDL><PUSH/><TEXT>If you’re looking to help our cause, haul some supplies up to Darmstadt. That’s our base in the Ostnebel in Stuttgart. We often buy them in Vogtland, but they are much more expensive there.</TEXT><PARA/><POP/></RDL>'''
2806 = '''<RDL><PUSH/><TEXT>There’s a raiding party leaving shortly for the Dortmund-Bonn Lane. Someone heard a Junker talking about a Synth Foods transport coming in from Hamburg with Fertilizers. They don’t guard them as well as the Food shipments, especially Luxury Foods.</TEXT><PARA/><POP/></RDL>'''
2807 = '''<RDL><PUSH/><TEXT>Synth Foods blames us for the food shortages in Berlin. The truth is, most of their food is bound for Helion, where they can make much higher profits. Whether Dornmark starves or not is none of their concern.</TEXT><PARA/><POP/></RDL>'''
2808 = '''<RDL><PUSH/><TEXT>We use this base to attack the Republican Shipping imperialists within Ironreach. It’s also a convenient place to purchase proper Dornmark Side Arms at a good price. Most of our brothers in arms are in Hamburg, waiting in the asteroid fields for any opportunities that may present themselves.</TEXT><PARA/><POP/></RDL>'''
2809 = '''<RDL><PUSH/><TEXT>We make our living smuggling Diamonds from here to Pacifica. Unioners carry them all they way to Dawson, where they are sold to the Rogues, who smuggle them past the Xenos in Hudson and Texas and across the final stretch in Cinderwell.</TEXT><PARA/><POP/></RDL>'''
2810 = '''<RDL><PUSH/><TEXT>The Junkers have approached us with a proposal to smuggle Artifacts and Cardamine into Dawson. We have not accepted, although it would be very lucrative and give us much more money to buy ships and weapons. If the Unioners became drug addicts and smugglers like the Rogues, then we would deserve to be called common criminals.</TEXT><PARA/><POP/></RDL>'''
2811 = '''<RDL><PUSH/><TEXT>DSE had to station a permanent repair crew in Omega-7 to deal with all of the Trade Lane ring damage that’s been happening in all of the Corsair and Red Hessian attacks. We’re on the supply transport just in from Freistadt. They don’t bother us on the return trip, just when we have a full load.</TEXT><PARA/><POP/></RDL>'''
2812 = '''<RDL><PUSH/><TEXT>We do day runs to Dresden as needed to repair rings. It’s a hell of a place to have Trade Lanes, I’ll tell you. The system is an inferno, full of lava asteroids and hostile Hessians.</TEXT><PARA/><POP/></RDL>'''
2813 = '''<RDL><PUSH/><TEXT>Had to send out a crew to fix the Omega-11 Gate in Stuttgart last week. Hessians got into it with a Daumann Armored Transport coming in from Solarius. The ship tried to re-enter the Gate, but was caught by the raiding party while docking.</TEXT><PARA/><POP/></RDL>'''
2814 = '''<RDL><PUSH/><TEXT>I’m from Texas. You get lots of sun and wind there. Beautiful in a stark sort of way. This place is too cold and gray. Then there’s that frosty disposition of the Dornmarkers. They aren’t the friendliest of folks, especially toward the Guild.</TEXT><PARA/><POP/></RDL>'''
2815 = '''<RDL><PUSH/><TEXT>Hamburg’s a good place to be based. It’s a criminal crossroads of sorts, because of the nature of the Jump Hole network in Dornmark. You can find plentiful work without having to go into the heart of the Walker Nebula. Those clouds can change the odds quite a bit, usually in the bad guy’s favor.</TEXT><PARA/><POP/></RDL>'''
2816 = '''<RDL><PUSH/><TEXT>Republican pays most of the bounties around here. That means we hunt down Unioners. The only reason to chase a Junker is a chance at some contraband. We don’t get paid enough by the military to bother that much with the Bundschuh.</TEXT><PARA/><POP/></RDL>'''
2817 = '''<RDL><PUSH/><TEXT>There’s a Hole into Frankfurt in the Alsterfeld. That’s where you’ll see Junkers running contraband and the odd Bundschuh raiding party headed for the Westfalen. And there are always plenty of Unioners to keep you company.</TEXT><PARA/><POP/></RDL>'''
2818 = '''<RDL><PUSH/><TEXT>Vierlande doesn’t produce that many ex-cons who could become Bounty Hunters, for the simple reason that most sentences are for life. Personally, sounds a little harsh to me. They don’t even put them to work, like the LPI. It’s a pretty grim place.</TEXT><PARA/><POP/></RDL>'''
2819 = '''<RDL><PUSH/><TEXT>It’s not real exciting work around here; chasing down Unioners and the odd Bundschuh for the most part. If it’s excitement you’re looking for, go to Omega-11. I’d buy me a pretty strong shield, though. The sun’s gone red giant, going to go planetary nova pretty soon.</TEXT><PARA/><POP/></RDL>'''
2820 = '''<RDL><PUSH/><TEXT>Hamburg is practically a company town of Republican’s. We created this city, and have employed many of its workers over the years. Now they resent us, and blame Republican for all of their problems. We cannot pay workers so much money and give them long vacations yet also remain competitive with Orsena and Helion.</TEXT><PARA/><POP/></RDL>'''
2821 = '''<RDL><PUSH/><TEXT>Hamburg planet is the primary distribution point within this system for Consumer Goods, Pharmaceuticals, and Oxygen. We also ship Side Arms in from the Ring for use at Vierlande, or on the Westfalen.</TEXT><PARA/><POP/></RDL>'''
2822 = '''<RDL><PUSH/><TEXT>The most lucrative Commodities in Hamburg are Diamonds and Silver. Inbound cargos come in from Ironreach. We often switch to better-armored ships with escorts for the run across the Independent Worlds to Houston.</TEXT><PARA/><POP/></RDL>'''
2823 = '''<RDL><PUSH/><TEXT>There have been reports of Junkers sighted in the Alsterfeld. They aren’t often found outside of capital systems like Berlin, so we assume they’re smuggling Artifacts and Cardamine.</TEXT><PARA/><POP/></RDL>'''
2824 = '''<RDL><PUSH/><TEXT>Republican pays us well to clear out the Unioners and keep the peace in Hamburg, so we can’t complain. I hear that other Federal Police stations have been caught extorting passing ships for “security” money. Berlin sent a crew of them to Vierlande last month to appease the Helion companies.</TEXT><PARA/><POP/></RDL>'''
2825 = '''<RDL><PUSH/><TEXT>They’ve got me on prison convoy duty this month. We’re usually hauling a load of Unioners picked up from the North Field. Their comrades wait for us in the Sud Fels, which we have to pass to get to Vierlande.</TEXT><PARA/><POP/></RDL>'''
2826 = '''<RDL><PUSH/><TEXT>The real reason we’ve got so many Unioners is simple — no work. Hamburg’s got a 30-percent unemployment rate currently. Hard times and empty stomachs lead to anger and resentment, mostly directed against Republican Shipping. They broke the union after the war, which effectively ended the good times in Hamburg.</TEXT><PARA/><POP/></RDL>'''
2827 = '''<RDL><PUSH/><TEXT>We’ve got two regular field patrols. One goes up into the North Field — mostly Unioners up there. The Alster Field patrol will sometimes see Bundschuh or Junkers. And lots of Unioners, of course — they’re the dominant criminal species of Hamburg.</TEXT><PARA/><POP/></RDL>'''
2828 = '''<RDL><PUSH/><TEXT>We have a lot of Bounty Hunters on Hamburg. Gives this place a bit of a hard edge. The ones in from Texas can be a rough lot. A few of my comrades have joined the Guild, mostly to make better money. They’re definitely a little more casual about killing people than they were as police officers.</TEXT><PARA/><POP/></RDL>'''
2829 = '''<RDL><PUSH/><TEXT>Republican used to require foreign shippers in Dornmark space to unload all cargo at stations like Altona. There were dock workers that packed and unpacked ships all day long. Talk about an unnecessary job. Now it’s all automated, and Helion ships often bypass Altona and Hamburg.</TEXT><PARA/><POP/></RDL>'''
2830 = '''<RDL><PUSH/><TEXT>If we catch a Junker with Cardamine or Artifacts, they usually try to run for it. Their ships are not very fast, so we often can catch them quickly. They almost always refuse to surrender, though. Guess they prefer to die rather than be interrogated and imprisoned.</TEXT><PARA/><POP/></RDL>'''
2831 = '''<RDL><PUSH/><TEXT>The Dornmark military patrols the Trade Lanes in the northwestern part of the system. It’s one of the few places in Dornmark space where we get any assistance from them. There is little we can do about the Independent Worlds, though. You’re on your own until you reach the Helion Navy patrols in the northern portions of those systems.</TEXT><PARA/><POP/></RDL>'''
2832 = '''<RDL><PUSH/><TEXT>I just made the Hudson crossing with a load of Fertilizers. We usually drop off a few containers for Republican here before continuing onto Stuttgart. They ship them off to the Frankfurt system. I hear they end up in bio-domes out in the Edge Worlds.</TEXT><PARA/><POP/></RDL>'''
2833 = '''<RDL><PUSH/><TEXT>We always make a stop in Hamburg to deliver the weekly food supply from Stuttgart. It’s a relatively quiet system for us, with no LWB about. The Unioners couldn’t care less about what’s happening in that part of Dornmark. Everyone needs to eat, after all.</TEXT><PARA/><POP/></RDL>'''
2834 = '''<RDL><PUSH/><TEXT>There are two reasons Synth Foods took over Stuttgart: Less expensive Luxury Foods for the Helion elites, and cheap food for the prisoners of Texas. That about sums up Helion society.</TEXT><PARA/><POP/></RDL>'''
2835 = '''<RDL><PUSH/><TEXT>It feels strange to stand here in this city. The Zoners do not have a planet that we can call home. We are accustomed to the low-gravity environments of our Freeports. We only visit House systems like Hamburg if we must procure supplies that are not sold by passing ships.</TEXT><PARA/><POP/></RDL>'''
2836 = '''<RDL><PUSH/><TEXT>The Zoners’ philosophy is to not antagonize anyone. We wish to coexist in peace with all factions in the Nacre Reach, whether they are criminal or government. Zoners who cannot abide by this code are asked to leave. They often become Bounty Hunters. So we have a special relationship with the Guild.</TEXT><PARA/><POP/></RDL>'''
2837 = '''<RDL><PUSH/><TEXT>You should visit our Freeport in Bering. Be careful of the Unioners, though. They often prey on shipping in the southern end of our system. There are no military patrols along the Lanes until you reach Freeport 2.</TEXT><PARA/><POP/></RDL>'''
2838 = '''<RDL><PUSH/><TEXT>We deliver MOX to the Westfalen every few months or so. Berlin has been having difficulty making their payments lately. ALG would like to improve our relationship with the military, so we often waive the transport and installation fees.</TEXT><PARA/><POP/></RDL>'''
2839 = '''<RDL><PUSH/><TEXT>The structural integrity of this ship is suspect. It suffered a lot of damage during the Eighty Years War, but was forced to remain in service, since all of its sister ships are now Scrap Metal in the Sigma-13 system. We are always nervous when we have to enter the reactor compartments of this ship. Especially since the recent accident.</TEXT><PARA/><POP/></RDL>'''
2840 = '''<RDL><PUSH/><TEXT>Our most lucrative runs for MOX are into Colorado. One must first survive the Xenos in the Independent Worlds, however. The Rogues would also like to get their hands on bomb-making material — especially the group found in Hudson.</TEXT><PARA/><POP/></RDL>'''
2841 = '''<RDL><PUSH/><TEXT>The military’s brought us in to help them out in the Nordheide. They don’t pay us too much, though. But they have good, long-range scanners and a strategic position in this area, so it’s worthwhile for us. Most of the actual bounties are put up by Republican.</TEXT><PARA/><POP/></RDL>'''
2842 = '''<RDL><PUSH/><TEXT>There are a few reformed Hessians among us here in Hamburg. They’re the lucky ones who got out of Vierlande before their sentences were up. One guy had some story about some neutron star in Omega-41. That’s way out there in the Edge Worlds in Corsair land.</TEXT><PARA/><POP/></RDL>'''
2843 = '''<RDL><PUSH/><TEXT>The Hole to Bering is up in the Nordheide. If you’re looking for diamond smuggling Unioners, then that’s the place to be. There isn’t a direct route between here and Hudson, which keeps the Xenos and Rogues out of Hamburg.</TEXT><PARA/><POP/></RDL>'''
2844 = '''<RDL><PUSH/><TEXT>Some of the Hunters use this as a base for journeys into Hudson. Most of the bounties up there are for Xenos and Rogues. Republican posts the bulk of them, though Universal and IC chip in on occasion.</TEXT><PARA/><POP/></RDL>'''
2845 = '''<RDL><PUSH/><TEXT>Just came back from Hudson. We were cruising for baddies in the gap between the Wrangell and Kenai Fields. Ran right into a little skirmish going on between the local thugs. I got me two Xenos and a Rogue. Buy you a drink?</TEXT><PARA/><POP/></RDL>'''
2846 = '''<RDL><PUSH/><TEXT>Hudson is a little rougher than Hamburg. No safe havens, not even any military in the Dornmark part of the system. Helion Navy’s putting a lot of pressure on them, but they can’t do much about it. You can see why. Look around at this dump.</TEXT><PARA/><POP/></RDL>'''
2847 = '''<RDL><PUSH/><TEXT>It’s a quick trip from Hamburg. We run in supplies on a regular basis. Sometimes they can’t pay us, but we usually can arrange something. Maybe four dead Unioners for a container of Pharmaceuticals.</TEXT><PARA/><POP/></RDL>'''
2848 = '''<RDL><PUSH/><TEXT>Republican is competing with ALG to win the contract for constructing the next generation of Dornmark battleships. We have a clear advantage in ship design and practical construction experience. But they have a definite strength in alloys and specialized Hull Panel fabrication.</TEXT><PARA/><POP/></RDL>'''
2849 = '''<RDL><PUSH/><TEXT>Although it’s not far to Hamburg from here, the Unioners will attack us if given the opportunity. Their preferred method is to disable a Trade Lane ring near the center of the stretch, then flee back into the Nordheide at the first sign of a military patrol.</TEXT><PARA/><POP/></RDL>'''
2850 = '''<RDL><PUSH/><TEXT>The </TEXT><TRA italic="true"/><TEXT>Westfalen</TEXT><TRA italic="false"/><TEXT>  is the last battleship still operational in the Dornmark fleet. We are always short of spare parts, and the men are paid only once every three months. Some enterprising pilots have taken to moonlighting for Republican or Synth Foods in order to make ends meet.</TEXT><PARA/><POP/></RDL>'''
2851 = '''<RDL><PUSH/><TEXT>This ship is a deathtrap. They had an explosion last week in Fusion Reactor 6. Had to seal off the entire A Deck. They’re not even going to fix it. That’s a sorry state of affairs. The </TEXT><TRA italic="true"/><TEXT>Westfalen</TEXT><TRA italic="false"/><TEXT>  will never be able to make a jump again.</TEXT><PARA/><POP/></RDL>'''
2852 = '''<RDL><PUSH/><TEXT>There are rumors circulating that ALG is planning on building a new shipyard in Dortmund to build the Bremen and her sister ships. They’re willing to build them at cost in order to gain entry into this new market. That’s an attractive proposition for Berlin at this point and time.</TEXT><PARA/><POP/></RDL>'''
2853 = '''<RDL><PUSH/><TEXT>The Dornmark Military is tasked with patrolling the northern areas of Hamburg and the adjacent Independent Worlds of Bering and Hudson. But we only have enough working fighters to cover the Trade Lanes in the immediate area, plus a daily patrol into the Nordheide. We assign Bounty Hunters to handle many of our other patrol routes in the area.</TEXT><PARA/><POP/></RDL>'''
2854 = '''<RDL><PUSH/><TEXT>Ever since we lost the war, Dornmark just hasn’t been the same; the entire colony feels beaten and bereft of vigor. Look around, there is no one smiling or enjoying themselves. What will it take for my House to heal?</TEXT><PARA/><POP/></RDL>'''
2855 = '''<RDL><PUSH/><TEXT>Daumann is the real culprit in the Eighty-Years War. The Imperial Navy Command had grave doubts about the wisdom of fighting a guerrilla-style war in the Crow Nebula against an enemy that was so well-supplied by Orsena. But Daumann saw the huge profits to be made in lucrative shipbuilding contracts, and bribed hundreds of key government officials. The rest is history.</TEXT><PARA/><POP/></RDL>'''
2856 = '''<RDL><PUSH/><TEXT>Many of the young officers are leaving the Dornmark Military, tired of the poor conditions and low pay. Most of them end up flying commercial transports for Republican or Synth Foods. The rest end up with the Charter Guild.</TEXT><PARA/><POP/></RDL>'''
2857 = '''<RDL><PUSH/><TEXT>The Dornmark public doesn’t respect the military anymore. We lost the Eighty-Years War to a ragtag bunch of gas miners as far as they’re concerned. That is one reason it has been so difficult for Berlin to increase our budget — the politicians backed by the Bundschuh always vote it down.</TEXT><PARA/><POP/></RDL>'''
2858 = '''<RDL><PUSH/><TEXT>The Bundschuh continues to attack this floating piece of junk for some reason. We usually run them off after a few minutes. I guess they don’t have any other obvious military targets left in Dornmark — except maybe the Oder Shipyard. Have to have an enemy to keep the cause going.</TEXT><PARA/><POP/></RDL>'''
2859 = '''<RDL><PUSH/><TEXT>Republican is the exclusive supplier for all Federal Police installations in Dornmark. We’ve had to augment our weekly shipments to accommodate the swelling population here. The Pharmaceuticals supply has become critical with all the illness and disease sweeping through the prisoner population.</TEXT><PARA/><POP/></RDL>'''
2860 = '''<RDL><PUSH/><TEXT>It’s nice to see so many Unioners locked up in their solitary cells. Maybe that will dissuade others who are considering joining the cause. Somehow I think not.</TEXT><PARA/><POP/></RDL>'''
2861 = '''<RDL><PUSH/><TEXT>We’ve had Unioners try to sneak out of here in our empty cargo containers. Unfortunately, the vacuum conditions and extreme cold of outer space generally mean death for most stowaways within a few minutes.</TEXT><PARA/><POP/></RDL>'''
2862 = '''<RDL><PUSH/><TEXT>Vierlande is the new maximum-security prison for hardened criminals. It was built in the Hamburg system to put it out of reach of the Hessian hordes in Berlin and Stuttgart. Unfortunately, they seem to have found a secret access route into this system, so we still get prison-break attempts.</TEXT><PARA/><POP/></RDL>'''
2863 = '''<RDL><PUSH/><TEXT>The Federal Police prison warden sees little hope of rehabilitation for most of these criminals, so most sentences are extended indefinitely. There are standing orders from Berlin to not release Bundschuh under any circumstances. The only planet those poor brutes will ever see for the rest of their lives is Hannover.</TEXT><PARA/><POP/></RDL>'''
2864 = '''<RDL><PUSH/><TEXT>Truth is, most of the people in here haven’t committed that many crimes, especially the Bundschuh. Some of them look like Berlin University kids who decided to join a demonstration on a lark without thinking much of the consequences.</TEXT><PARA/><POP/></RDL>'''
2865 = '''<RDL><PUSH/><TEXT>There is a special political section for the Bundschuh. The government doesn’t want them mixing with the other inmates and stirring up trouble. Don’t want any more Popular Revolutions now, do we?</TEXT><PARA/><POP/></RDL>'''
2866 = '''<RDL><PUSH/><TEXT>The Sudheide has become a veritable cesspool of humanity. The Cinder Guard, Unioners, and Bundschuh all stage their prison breakout attempts from that field. I don’t know why they try. This prison has a triple hull, with outer walls more than two meters thick. No prisoner has ever escaped Vierlande alive.</TEXT><PARA/><POP/></RDL>'''
2867 = '''<RDL><PUSH/><TEXT>The Unioners and the Bundschuh pretty much keep to themselves. The tough guys are the Cinder Guard. They control the area inside the inner-security perimeter, where guards rarely venture. You’d never know that some of them were regular working folks before they went bad.</TEXT><PARA/><POP/></RDL>'''
2868 = '''<RDL><PUSH/><TEXT>The prison convoys have been shipping them in pretty fast from all over Dornmark. As a result, Vierlande has become very overcrowded. There have been hunger strikes to protest the conditions, but there’s no money to build an extension. So we keep packing them in a little tighter. One day, it’ll all explode.</TEXT><PARA/><POP/></RDL>'''
2869 = '''<RDL><PUSH/><TEXT>Some of the older prisoners that come in from Berlin look more like politicians than hardened criminals. Rumor is that they’re whistle blowers and reformers from the government that were getting a little too honest for their own good.</TEXT><PARA/><POP/></RDL>'''
2870 = '''<RDL><PUSH/><TEXT>We keep just enough LWB examples in Vierlande to show and tell for the Synth Food execs that come through here on their Dornmark inspection tour every few months or so. They want to see progress on the LWB problem on Dornmark. That means a steadily increasing number of LWB inmates at our lovely facility. So we show them a few LWB mixed in with a crowd of Unioners. Works every time.</TEXT><PARA/><POP/></RDL>'''
2871 = '''<RDL><PUSH/><TEXT>We provide Republican with many of their essential shipbuilding materials, such as Ship-Hull Panels, Basic Alloys, and MOX from Dortmund. In return, they sell us their Scrap Metal and Toxic Waste from old ships that are being dismantled.</TEXT><PARA/><POP/></RDL>'''
2872 = '''<RDL><PUSH/><TEXT>Republican is completely dependent on ALG products to build their ships. They are competing for the new Dornmark Military contract, but lack the technical expertise to fabricate the custom hull materials and other sophisticated features required by the government.</TEXT><PARA/><POP/></RDL>'''
2873 = '''<RDL><PUSH/><TEXT>Republican believes it can solve the Unioner problem by posting bounties and throwing them all in prison. The reality of their situation is far more tenuous. We’ve heard from reliable sources that many of their current workers are Union sympathizers who are quietly plotting the eventual overthrow of Republican Management.</TEXT><PARA/><POP/></RDL>'''
2874 = '''<RDL><PUSH/><TEXT>The Alster Shipyard produces Freight Trains, Heavy Lifters, and Dornmark Freighters. It has been in continuous use since 412 AS. We are the only commercial shipyard in operation within Dornmark.</TEXT><PARA/><POP/></RDL>'''
2875 = '''<RDL><PUSH/><TEXT>Gold is used as a reflective coating on windows for our ships. Ours is delivered by special armored transport from Freiburg periodically. It’s a difficult run all the way through Dornmark. Criminals can smell it from across a system.</TEXT><PARA/><POP/></RDL>'''
2876 = '''<RDL><PUSH/><TEXT>Privately, Republican committed some management blunders in the early days of Alster. There were many ongoing safety lapses that eventually led to major industrial accidents. The unions would never have become as strong as they did without those galvanizing events.</TEXT><PARA/><POP/></RDL>'''
2877 = '''<RDL><PUSH/><TEXT>A shipyard needs a wide array of raw materials delivered on a regular basis to function smoothly. Helion provides us with Superconductors and Optical Chips. The Ring, in Ironreach, supplies Engine Components and Construction Machinery.</TEXT><PARA/><POP/></RDL>'''
2878 = '''<RDL><PUSH/><TEXT>The Alster Shipyard workers are proud of our tradition. Unfortunately, there is a group of malcontents that wishes to destroy everything we have created after almost 400 years in Hamburg. The Unioners are a pestilence that must be eliminated.</TEXT><PARA/><POP/></RDL>'''
2879 = '''<RDL><PUSH/><TEXT>Every week, we run a transport in from Mainz, in the Frankfurt system. It either carries Boron from the Holstein extraction facility, or Optronics from Orsena.</TEXT><PARA/><POP/></RDL>'''
2880 = '''<RDL><PUSH/><TEXT>This shipyard was once controlled by the unions, who demanded ever higher wages and longer vacations. Republican could afford their extravagant demands during the Eighty Years War. But when the hard times hit, we had to make adjustments in order to remain profitable.</TEXT><PARA/><POP/></RDL>'''
2881 = '''<RDL><PUSH/><TEXT>The Alster unions made a fatal error when they supported the Popular Revolution. The new government worsened the already serious economic situation by inflating the currency to pay off external war debts. This backfired and resulted in the common worker in Dornmark suffering terribly.</TEXT><PARA/><POP/></RDL>'''
2882 = '''<RDL><PUSH/><TEXT>The Unioners are everywhere in Hamburg. They often lurk in the Alsterfeld, waiting for a shipment to arrive. They attack our ships in the Trade Lanes, Altona, or anything else that says Republican on it.</TEXT><PARA/><POP/></RDL>'''
2883 = '''<RDL><PUSH/><TEXT>Altona was once a bustling place, before the government allowed Helion ships to bypass us and ship their goods directly to Berlin and Stuttgart after the Eighty Years War. Now it is probably just a matter of time before this outpost is closed and dismantled.</TEXT><PARA/><POP/></RDL>'''
2884 = '''<RDL><PUSH/><TEXT>There are few of the once numerous dock workers left at this station. Automated machinery and declining shipping traffic have both taken their toll. Sadly, many of them have turned to piracy as the solution to their problems.</TEXT><PARA/><POP/></RDL>'''
2885 = '''<RDL><PUSH/><TEXT>Hamburg has notified the managers that they will be shutting our station down within a year. Soon the 750 people on this station will be unemployed and join the legions of dispossessed Dornmark workers. No one knows when our misery will end.</TEXT><PARA/><POP/></RDL>'''
2886 = '''<RDL><PUSH/><TEXT>Most of our traffic is northbound out of Altona. Copper and Cobalt are the chief metals being shipped into Helion. Mining Machinery and High Temperature Alloys make up the remainder. Most of the ships unload in Houston, although some continue to Cinderwell or Colorado.</TEXT><PARA/><POP/></RDL>'''
2887 = '''<RDL><PUSH/><TEXT>Our close proximity to Hamburg and the Docking Ring provides a moderate level of security. Even so, the Unioners will try to steal supplies or attack us whenever they have the chance.</TEXT><PARA/><POP/></RDL>'''
2888 = '''<RDL><PUSH/><TEXT>Republican should recognize the Unioners as a legitimate movement and agree to their terms. It would be better for all of Dornmark, especially the shipping business.</TEXT><PARA/><POP/></RDL>'''
2889 = '''<RDL><PUSH/><TEXT>Our main southbound cargo at Altona is Superalloys from Houston. The Oder Shipyard pays a premium price for their supply, the most expensive in the Nacre Reach.</TEXT><PARA/><POP/></RDL>'''
2890 = '''<RDL><PUSH/><TEXT>The Independent Worlds beyond Hamburg provide different challenges. The Bering system is the homeland of the cursed Unioners, which needs no further explanation. The Hudson system, which is blissfully free of our nemesis, unfortunately harbors a large population of Xenos, who share a hatred of all foreigners.</TEXT><PARA/><POP/></RDL>'''
2891 = '''<RDL><PUSH/><TEXT>We must expend more money every year on the bounty and bribe fund to keep the peace in this system. It is frustrating to have so little support from the government in terms of security forces.</TEXT><PARA/><POP/></RDL>'''
2892 = '''<RDL><PUSH/><TEXT>Boy, this place is a ghost town. I heard it was once quite the place, back when Republican had a special deal going with the government. No foreign ships allowed beyond their border posts of Altona, Freiburg, and Mainz. Those days are gone for Helion shipping, at least.</TEXT><PARA/><POP/></RDL>'''
2893 = '''<RDL><PUSH/><TEXT>We bring in Superconductors from Houston, then turn back north with High Temperature Alloys. It’s not a hugely profitable run, but you can make money. It’s probably better if you went all the way to the source.</TEXT><PARA/><POP/></RDL>'''
2894 = '''<RDL><PUSH/><TEXT>Most of our ships just pass on through here now. Sometimes they do a crew or equipment change to upgrade for the Independent World crossings. Gets a lot easier once you’re in Helion. Nothing like Dornmark. We’ve got police and military everywhere you look.</TEXT><PARA/><POP/></RDL>'''
2895 = '''<RDL><PUSH/><TEXT>We bring up Sidearm shipments and H-fuel from Berlin. It’s cheaper to buy them there than is in Hamburg. Not a big money maker, but it pays the bills.</TEXT><PARA/><POP/></RDL>'''
2896 = '''<RDL><PUSH/><TEXT>Hamburg is relatively calm compared to running the Border Worlds. They transferred me here to recuperate after six months of doing the Cambridge-Freiburg route. Omega-7 can be very taxing on the nerves. Anytime you’ve got Rift Captains in the area, watch out.</TEXT><PARA/><POP/></RDL>'''
2897 = '''<RDL><PUSH/><TEXT>The Unioners hit our Water transport coming down from Hamburg yesterday. Usually they don’t bother with the small prey like that. Must of been bored or something. The captain dropped their cargo and left it to the pirates, who shortly realized the error they’d made.</TEXT><PARA/><POP/></RDL>'''
2898 = '''<RDL><PUSH/><TEXT>Lubeck can get lonely. We don’t get up to Hamburg too often. Wouldn’t matter anyway, because we never get paid. We’re here to keep an eye on the Sudheide. Lot of criminal activity in there. Berlin’s nervous about the prison convoys mostly.</TEXT><PARA/><POP/></RDL>'''
2899 = '''<RDL><PUSH/><TEXT>We’ve caught a few Junkers running Artifacts and Cardamine across Hamburg. It’s unusual to see them outside of Berlin. Seems like it started when they built that base up in Sigma-13.</TEXT><PARA/><POP/></RDL>'''
2900 = '''<RDL><PUSH/><TEXT>Hamburg is an important junction in the criminal network. We believe there may be Jump Holes into Berlin, Frankfurt, and Bering, but we are not certain. The Bounty Hunters know where they are, but will not tell us. Company secret, they say.</TEXT><PARA/><POP/></RDL>'''
2901 = '''<RDL><PUSH/><TEXT>We do a daily up into the fields and along the Trade Lane to Alster. It can get fairly exciting. There seems to be a big crossing point for smugglers and such about half way up the Lane.</TEXT><PARA/><POP/></RDL>'''
2902 = '''<RDL><PUSH/><TEXT>There are Bundschuh spotted here on occasion. It looks like they’re just passing through on supply runs, although there have been attacks up in the northern end of Hamburg on the Westfalen.</TEXT><PARA/><POP/></RDL>'''
2903 = '''<RDL><PUSH/><TEXT>Without this border post, southern Hamburg would be chaos. As it is, we lose good officers every week, especially when the Hessians show up. Soon they’ll have no choice but to staff our base with Bounty Hunters. There are plenty of those ruffians to go around.</TEXT><PARA/><POP/></RDL>'''
2904 = '''<RDL><PUSH/><TEXT>Hessians are active in this area of Hamburg, although not really along the Trade Lanes. They are mostly interested in Vierlande and their imprisoned comrades in arms. Good luck, I say. That prison is virtually impregnable.</TEXT><PARA/><POP/></RDL>'''
2905 = '''<RDL><PUSH/><TEXT>One day Dornmark will be great again and we will be proud to be police officers. For now, we suffer along with the rest of our proud nation through these economic hard times.</TEXT><PARA/><POP/></RDL>'''
2906 = '''<RDL><PUSH/><TEXT>This post is really not that bad. A friend of ours was transferred to Dresden. He sent several messages over the next few weeks, each more despairing than the last, then nothing. We heard later that his entire patrol vanished in the Giftnebel.</TEXT><PARA/><POP/></RDL>'''
2907 = '''<RDL><PUSH/><TEXT>This installation gets all her basics from the Mainz within this system. No sense leaving this hole if we don’t have to, is there? The same ships pick up our Boron and take it back to the Mainz. She is this system’s supply depot.</TEXT><PARA/><POP/></RDL>'''
2908 = '''<RDL><PUSH/><TEXT>The only thing we need shipped here from outside of this system is Mining Machinery. That gets shipped in on transports from the Ring in Ironreach. They pick up the Boron we mine here and take it back.</TEXT><PARA/><POP/></RDL>'''
2909 = '''<RDL><PUSH/><TEXT>The Oder Shipyard uses our Boron to build ships. I don’t know what ships they might be building there, I haven’t seen anything worth a mention. All our finest ships were destroyed in “the Eighty.”</TEXT><PARA/><POP/></RDL>'''
2910 = '''<RDL><PUSH/><TEXT>I guess Daumann came back to this system because Kruger was here. After the Richtofen went up everybody left — that was it, the war was over. After a while Kruger came back, and that means Daumann had to follow suit, didn’t they?</TEXT><PARA/><POP/></RDL>'''
2911 = '''<RDL><PUSH/><TEXT>My father died in “the Eighty,” and his father before him. I guess most of my family was killed by them GMG. It ain’t their fault though. We shouldn’t have been going to where we didn’t have any business. Damn the empire and damn the new government — a republic…ha!</TEXT><PARA/><POP/></RDL>'''
2912 = '''<RDL><PUSH/><TEXT>The GMG who come into this system are scoundrels. If they wanted Frankfurt, they could have taken it. If they come here now with their guns armed, then they are just looking to fight for no reason.</TEXT><PARA/><POP/></RDL>'''
2913 = '''<RDL><PUSH/><TEXT>Long ago Frankfurt was the jewel of the empire. Everyone had their eye on this system — we were going to lead the way to a glorious Dornmark future from this place. Now look around you. This is what arrogance and avarice will bring. Look, I say, at this empty place of broken promises.</TEXT><PARA/><POP/></RDL>'''
2914 = '''<RDL><PUSH/><TEXT>The Bundschuh built a base here because they knew that the government was too poor to put enough police here to stop them. No one cares what happens in Frankfurt. Republican is the only one that does decent business here and that’s the reason you’ll see Unioners.</TEXT><PARA/><POP/></RDL>'''
2915 = '''<RDL><PUSH/><TEXT>I mine Boron here because every other Dornmark system I go to makes me sick. I hate seeing rich Dornmarkers, or anybody who actually gives a damn about this House. Just leave me be to mine my Boron. You can try and fix whatever you want, but don’t bother me about it.</TEXT><PARA/><POP/></RDL>'''
2916 = '''<RDL><PUSH/><TEXT>Life must go on, even after defeat. No one really cared about the GMG once the rebellion started. It could have been quite horrible but the life’s blood of Dornmark — her companies — were not dissolved. It would have been chaos if that had happened. Who knows who would be running things now.</TEXT><PARA/><POP/></RDL>'''
2917 = '''<RDL><PUSH/><TEXT>One day the Dornmark Navy will be as powerful as it once was. Our day of reckoning is only separated from us by an expanse of time. Every day that passes, the expanse gets shorter. Dornmark will rise from the ashes like a phoenix from the flames. Then the GMG will pay — and so will Orsena and the rest of Sirius.</TEXT><PARA/><POP/></RDL>'''
2918 = '''<RDL><PUSH/><TEXT>The miners here are a sullen lot. I was transferred in from HQ a few months ago. Everyone here hates the government, but the Republic and the empire before it was just trying to do their best for us. Besides, everyone didn’t lose everything; my family still holds all of their land. We are okay.</TEXT><PARA/><POP/></RDL>'''
2919 = '''<RDL><PUSH/><TEXT>This is a transit point between Dortmund in Ironreach and Yukawa in Honshu. Basic and High-Temperature Alloys plus Ship-Hull Panels pass through this base on their way into Orsena.</TEXT><PARA/><POP/></RDL>'''
2920 = '''<RDL><PUSH/><TEXT>ALG does a good business in Frankfurt. Terraforming Gases arrive at this base from Dortmund. They expect to receive supplies of Boron from here in return.</TEXT><PARA/><POP/></RDL>'''
2921 = '''<RDL><PUSH/><TEXT>Though it requires the danger of flying into the Border Worlds, ALG ships Food to the Helgoland, beyond Dornmark space.</TEXT><PARA/><POP/></RDL>'''
2922 = '''<RDL><PUSH/><TEXT>Our Boron mining facility in Holstein receives all their basic supplies from this base. You could deliver these for us if you need money. It is a very short trip.</TEXT><PARA/><POP/></RDL>'''
2923 = '''<RDL><PUSH/><TEXT>You see the Samura and Kishiro men on this base? They always have a very smug look on their faces, it makes me livid. I would enjoy killing them both. You know that Orsena and her keiretsu backed the GMG throughout the entire war, don’t you?</TEXT><PARA/><POP/></RDL>'''
2924 = '''<RDL><PUSH/><TEXT>This is the station where the Orsena shippers must offload their products and receive ours. I don’t think many Dornmarkers care to see H-Fuel brought into the heart of our Republic aboard their ships, the insult would be unbearable.</TEXT><PARA/><POP/></RDL>'''
2925 = '''<RDL><PUSH/><TEXT>Our reputation requires us to keep stock in all manner of Commodities at our base; Yanagi is no different. We ship many basic supplies to Yanagi from this locale.</TEXT><PARA/><POP/></RDL>'''
2926 = '''<RDL><PUSH/><TEXT>It is always better to purchase supplies from desperate people. The people of Dornmark have lost almost everything. We purchase Fertilizers and Terraforming Gases for a good price from this base.</TEXT><PARA/><POP/></RDL>'''
2927 = '''<RDL><PUSH/><TEXT>Optronics, Consumer Goods, and Basic Alloys are part of the trade we do with this base and the Yanagi. We get excellent prices from these Dornmark boys, poor bastards.</TEXT><PARA/><POP/></RDL>'''
2928 = '''<RDL><PUSH/><TEXT>Kishiro brings this base Optronics from Honshu. While we are here, we purchase Basic and High-Temperature Alloys plus Cobalt to return to Honshu with.</TEXT><PARA/><POP/></RDL>'''
2929 = '''<RDL><PUSH/><TEXT>If you have ever wished to see the wonders of the Sablecross system, then you could ship Diamonds to the capital planet and return with Optical Chips from Shinagawa.</TEXT><PARA/><POP/></RDL>'''
2930 = '''<RDL><PUSH/><TEXT>Yukawa is in need of the Boron that the Dornmark people mine in this system. If you are willing, you could provide them with this Commodity.</TEXT><PARA/><POP/></RDL>'''
2931 = '''<RDL><PUSH/><TEXT>Go to Ogashawa. There is the main source of Kishiro H-Fuel. You will find the best prices at the source. Every station needs H-Fuel, including this one.</TEXT><PARA/><POP/></RDL>'''
2932 = '''<RDL><PUSH/><TEXT>High-value Commodities make their way into this system from Ironreach on Republican shipping convoys. Silver and Diamonds are traded at this base with the Orsena.</TEXT><PARA/><POP/></RDL>'''
2933 = '''<RDL><PUSH/><TEXT>Basic supplies are brought here from throughout the republic. This station is a supply hub for all of Frankfurt. We also do a fair bit of business in the Border Worlds and Orsena.</TEXT><PARA/><POP/></RDL>'''
2934 = '''<RDL><PUSH/><TEXT>All H-Fuel that comes into this system is immediately loaded off the Orsena ships and onto Republican vessels. From here, most of the H-Fuel will be sent to the capital, where it will be redistributed throughout all of Dornmark.</TEXT><PARA/><POP/></RDL>'''
2935 = '''<RDL><PUSH/><TEXT>Fertilizers are brought here from Hamburg. They will make their way into the Border Worlds eventually. Zoners need the Fertilizers for their bio-domes.</TEXT><PARA/><POP/></RDL>'''
2936 = '''<RDL><PUSH/><TEXT>Boron and High-Temperature Alloys will be taken all the way to Narita in the heart of Orsena from this base. It will be Republican shippers that brave the Border Worlds to keep trade running smoothly.</TEXT><PARA/><POP/></RDL>'''
2937 = '''<RDL><PUSH/><TEXT>Republican will ship Optronics and Optical Chips to the Ring in Ironreach. On the way back, our convoys carry High-Temperature Alloys and Cobalt.</TEXT><PARA/><POP/></RDL>'''
2938 = '''<RDL><PUSH/><TEXT>Even in Frankfurt — the derelict child of Dornmark — the Unioners come to harass our shipping concerns. There is truly no rest for the weary. We must hire Bounty Hunters and independent pilots to protect our convoys out here, as the police presence is minimal.</TEXT><PARA/><POP/></RDL>'''
2939 = '''<RDL><PUSH/><TEXT>This base is necessary; business must go on in Frankfurt even after the devastation it suffered in the Eighty-Years War. We are still the gateway to the Border Worlds and Orsena out here, even if no one wishes to remember that.</TEXT><PARA/><POP/></RDL>'''
2940 = '''<RDL><PUSH/><TEXT>There isn’t much left here in Frankfurt. Most of the population in this system left for better mining grounds or were killed in “the Eighty.” After several decisive losses to the GMG, the Imperial Navy began conscripting soldiers from the mining operations. The rate of attrition was horrible; you were a miner one week, a soldier the next, and dead by month’s end.</TEXT><PARA/><POP/></RDL>'''
2941 = '''<RDL><PUSH/><TEXT>The foolish Dornmark people tried to wrestle the control of H-Fuel production from the GMG. They could never do so; even today if you want H-Fuel you must travel to the Border Worlds and do business with Orsena companies. Samura Fuel comes from Naha, so you can purchase from the source if you like.</TEXT><PARA/><POP/></RDL>'''
2942 = '''<RDL><PUSH/><TEXT>The Silver we purchase in this dying system will be shipped aboard our convoys to Sablecross. If you wish to see a vibrant, living system, go there. But bathe first.</TEXT><PARA/><POP/></RDL>'''
2943 = '''<RDL><PUSH/><TEXT>Yokohama is in need of High-Temperature Alloys. This Commodity is necessary for the construction of ships, and Orsena ships are amongst the finest in Sirius.</TEXT><PARA/><POP/></RDL>'''
2944 = '''<RDL><PUSH/><TEXT>Kruger produces H-Fuel at this station and ships it to Essen. In return, they supply us with the Mining Machinery that keeps our operation going. Even without the Border Worlds, Kruger manages to get H-Fuel for Dornmark.</TEXT><PARA/><POP/></RDL>'''
2945 = '''<RDL><PUSH/><TEXT>Station Mannheim produces H-Fuel and also mines Oxygen and Water. These three basic goods are shipped to Ironreach. Then we deliver Food back here.</TEXT><PARA/><POP/></RDL>'''
2946 = '''<RDL><PUSH/><TEXT>The amount of H-Fuel we are able to squeeze from the gases in this system is minimal. Nevertheless, the operation is good for PR. It lets the Dornmark people know that we haven’t given up.</TEXT><PARA/><POP/></RDL>'''
2947 = '''<RDL><PUSH/><TEXT>Once Station Richtofen was destroyed, we knew that we had lost the war — and much worse: Kruger had lost the Border Worlds to the GMG. It was a dark day for Dornmark and for Kruger. Maybe one day Dornmark will rise again.</TEXT><PARA/><POP/></RDL>'''
2948 = '''<RDL><PUSH/><TEXT>Kruger lost most of her capital in the Border World gas mining venture. When that failed utterly, our proud company lost all of her clout. Now, Kruger’s only real chance for survival is merging with ALG. It is really the only way left for us.</TEXT><PARA/><POP/></RDL>'''
2949 = '''<RDL><PUSH/><TEXT>The vermin who call themselves the GMG dealt the first blow in the conflict that would erupt into the Eighty-Years War. The Kruger survey vessel Helle Wolke went missing. When we sent ships after her, we found the GMG in the vicinity of the wreckage. The GMG could not explain what had happened, but claimed to be investigating themselves.</TEXT><PARA/><POP/></RDL>'''
2950 = '''<RDL><PUSH/><TEXT>After the Helle Wolke Incident, we knew that the GMG was a treacherous group. As we pushed into the Border Worlds, small skirmishes flared between Kruger and the Guild. When Empress Leicht annexed the Border Worlds, the real war began.</TEXT><PARA/><POP/></RDL>'''
2951 = '''<RDL><PUSH/><TEXT>Dornmark did not recognize any political sovereignty of the GMG; they were a band of miners, or so it seemed. What we did not realize at the time was that they were a close-knit organization with political clout in Orsena and underworld connections. Only after Dornmark and Kruger had fully committed to the action did we realize the extent of their power and backing.</TEXT><PARA/><POP/></RDL>'''
2952 = '''<RDL><PUSH/><TEXT>By the end of “the Eighty,” the government was more concerned with putting down the rising rebellion than the GMG and the devastated system of Frankfurt. The empire’s coffers were drained. On the edge of insolvency, Dornmark borrowed from Helion and sold away the last of its ability to stand alone.</TEXT><PARA/><POP/></RDL>'''
2953 = '''<RDL><PUSH/><TEXT>Basic supplies make their way to this base from Mainz. Republican is committed to keeping the brave peace officers of Frankfurt taken care of.</TEXT><PARA/><POP/></RDL>'''
2954 = '''<RDL><PUSH/><TEXT>Premium Daumann Side Arms are shipped here from the Ring in Ironreach. It is one of the more dangerous hauls; there are Unioners, Bundschuh, and Cinder Guard looking to get their hands on our cargo.</TEXT><PARA/><POP/></RDL>'''
2955 = '''<RDL><PUSH/><TEXT>The police in this system are the dregs of the Dornmark Federal Police. They cannot even keep the Bundschuh in check. Of course, that is why they find themselves in the most unfashionable system in all of Dornmark. Ach, I hate coming here.</TEXT><PARA/><POP/></RDL>'''
2956 = '''<RDL><PUSH/><TEXT>Police presence here is the absolute minimum required to keep this system from degenerating into anarchy. The Bundschuh, a terrorist organization, can be seen walking the corridors of corporate bases here in the open. The people of Frankfurt don’t care about who is who, only that they have money to spend.</TEXT><PARA/><POP/></RDL>'''
2957 = '''<RDL><PUSH/><TEXT>I came to Frankfurt because I wanted to go to a place where I could make a difference; a piece of space where people needed support. The only thing I found here is a haunted chunk of Dornmark that died at the end of the Eighty-Years War. I realized that nobody can make a difference. What is, is simply the truth — the rest is illusion.</TEXT><PARA/><POP/></RDL>'''
2958 = '''<RDL><PUSH/><TEXT>Cinder Guard attack this system from the southern end near the Jump Gate to Ironreach. That is not our problem, we are here to stop GMG incursions into Dornmark space. Only there hasn’t been a GMG incursion in months.</TEXT><PARA/><POP/></RDL>'''
2959 = '''<RDL><PUSH/><TEXT>Unioners make their way into the system because Republican Shipping still does business in Frankfurt. They are the ones who supply this base with its basics. One shipment the Unioners don’t harass is the police supply shipment. If they did, there would be little we could do to stop them.</TEXT><PARA/><POP/></RDL>'''
2960 = '''<RDL><PUSH/><TEXT>My grandfather fought in the battle for Richtofen; he was one of the few who survived. I used to watch him sitting in his chair, staring at nothing when I was a little kid. Though people said he was a great pilot, my father told me grandfather wished that he had died at Richtofen.</TEXT><PARA/><POP/></RDL>'''
2961 = '''<RDL><PUSH/><TEXT>I’m thinking of quitting the police. We have the oldest ships and equipment in Sirius. Every time I strap into my patrol craft, I wonder whether or not life support is going to function or my engines will give out. This is not what I should be worrying about.</TEXT><PARA/><POP/></RDL>'''
2962 = '''<RDL><PUSH/><TEXT>If you want to find Unioners, just look along the Trade Lanes on the northern end of the system. They like to hit the Republican shipments that are there. Unioners seem to come from the Westerwald.</TEXT><PARA/><POP/></RDL>'''
2963 = '''<RDL><PUSH/><TEXT>I will probably die defending the pathetic idiots who still make this system their home. I don’t know why I risk my neck each day bringing in Unioners and Bundschuh when the people don’t care if they have criminals walking amongst them. Frankfurt should be left to the criminals and sealed up forever.</TEXT><PARA/><POP/></RDL>'''
2964 = '''<RDL><PUSH/><TEXT>The Taunus Field is where you are going to find the Bundschuh — and lots of them. A lot of the people in this system agree with the reasons they are fighting, so they get plenty of popular support. Of course, that makes our jobs harder.</TEXT><PARA/><POP/></RDL>'''
2965 = '''<RDL><PUSH/><TEXT>We get everything we need from the Junkers. Either we go into the Border Worlds to Yanagi, or to Ironreach, where we will find the Kreuzberg Base.</TEXT><PARA/><POP/></RDL>'''
2966 = '''<RDL><PUSH/><TEXT>Those who go to Vierlande seldom return; most sentences are for life, and it’s not just pirates, but the political opponents of the corporate elite as well. The Bundschuh fly attack raids on the prison ships and inbound convoys. We fight to liberate our brethren who have been unjustly incarcerated.</TEXT><PARA/><POP/></RDL>'''
2967 = '''<RDL><PUSH/><TEXT>The Bundschuh is a political organization founded by Ironreach university students who were tired of the corruption of the old regime. Decades later we still toil under the yoke of an oppressive government, though its name has changed.</TEXT><PARA/><POP/></RDL>'''
2968 = '''<RDL><PUSH/><TEXT>The Bundschuh need not lower itself to common piracy like the Cinder Guard. Instead, we are funded by the enlightened Berlin intelligentsia looking to do away with the burdens of a corrupt government. This frees us to work directly toward our political agenda without being sidetracked by financial necessities.</TEXT><PARA/><POP/></RDL>'''
2969 = '''<RDL><PUSH/><TEXT>The corporations, though exploitive and uncaring, aren’t truly at fault for what they do. Corporations are intrinsically self-serving; it’s the government’s role to keep them in check. As long as the government is corrupt enough to accept corporate bribes, the workers cannot be free.</TEXT><PARA/><POP/></RDL>'''
2970 = '''<RDL><PUSH/><TEXT>Our base is located in the Taunus Asteroid field of Frankfurt. Within the same cloud is a Jump Hole to Sigma-13. Nearby is another Jump Hole that leads to Hamburg. In Hamburg there is the Vierlande Prison Ship, the </TEXT><TRA italic="true"/><TEXT>Westfallen</TEXT><TRA italic="false"/><TEXT>  battleship, and the Berlin Jump Gate. These are all priority Bundschuh targets.</TEXT><PARA/><POP/></RDL>'''
2971 = '''<RDL><PUSH/><TEXT>The Bundschuh recruits new members from the Cinder Guard, LWB, Unioners, and even disgruntled Daumann and Kruger workers. But the people we take in must care about our cause, because they won’t get rich flying for us.</TEXT><PARA/><POP/></RDL>'''
2972 = '''<RDL><PUSH/><TEXT>In 700 AS, the Dresden Revolt sparked the Popular Revolution that would do away with the Dornmark Imperial Government and replace it with a coalition of the people. The Bundschuh was a key player in the Dresden Revolt, running supplies to the rebels.</TEXT><PARA/><POP/></RDL>'''
2973 = '''<RDL><PUSH/><TEXT>After the revolution, the Bundschuh found itself sidelined by the new government. The coalition wanted the support of the wealthy aristocrats who headed Daumann Industries and Kruger Minerals. By 715 AS, the Bundschuh was forced to go underground again, this time by a government it had helped to create.</TEXT><PARA/><POP/></RDL>'''
2974 = '''<RDL><PUSH/><TEXT>Because we have taken the high road, and not one of piracy like the Cinder Guard, our ranks have dwindled. But the members of the Bundschuh are purists, committed to a political agenda — unlike other underground organizations.</TEXT><PARA/><POP/></RDL>'''
2975 = '''<RDL><PUSH/><TEXT>We have contracts with Synth Foods to ship this planet Terraforming Gases. From Dortmund we bring the gases in and try not to think about what they will do to the lovely climate of Stuttgart.</TEXT><PARA/><POP/></RDL>'''
2976 = '''<RDL><PUSH/><TEXT>Since we are a corporation the bottom line is the most important thing to consider. Our board was hard pressed when it came time to decide on selling Terraforming Gases to Synth Foods. What they do now will affect the planet for thousands of years, and all they care about is breeding that sickly gray weed from which they mill their disgusting paste.</TEXT><PARA/><POP/></RDL>'''
2977 = '''<RDL><PUSH/><TEXT>Much of the money that we earn from selling Terraforming Gases to Synth Foods will be secretly funneled to the LWB. ALG’s chairman is a large supporter of the displaced farmers of Stuttgart. Her own plantation has been growing blue jillies for centuries.</TEXT><PARA/><POP/></RDL>'''
2978 = '''<RDL><PUSH/><TEXT>Our Border World operations in Solarius, are supplied to a great degree by this planet. All the basic supplies make their way there from here.</TEXT><PARA/><POP/></RDL>'''
2979 = '''<RDL><PUSH/><TEXT>We are not safe from the Cinder Guard anywhere in all of Dornmark. They have grown so numerous and widespread there is not a single Trade Lane where one of our shipments have not fallen victim to a Hessian attack.</TEXT><PARA/><POP/></RDL>'''
2980 = '''<RDL><PUSH/><TEXT>The LWB are sensible enough not to harass Daumann too much; that is why we do not pay to have them killed by Bounty Hunters. We leave that to the Synth Foods invaders. Personally, I hope all their damn cellulose crops burn.</TEXT><PARA/><POP/></RDL>'''
2981 = '''<RDL><PUSH/><TEXT>I was hired by Synth Foods to protect them against LWB terrorist attacks. Unexplained fires still sweep across the fields here from time to time. We are paid to make the arsonists sorry.</TEXT><PARA/><POP/></RDL>'''
2982 = '''<RDL><PUSH/><TEXT>The LWB base is located near the Jump Hole to Dresden. Do you know where that is? Aye, it’s in the Ostnebel. The LWB conduct operations from that are. Mostly they run attacks on the lanes between here and the Ironreach Jump Gate.</TEXT><PARA/><POP/></RDL>'''
2983 = '''<RDL><PUSH/><TEXT>I came here once as a child; it was a lush and green planet with a warm golden sun. This is not like it was; the rolling green fields and prismatic growing tents that dotted the horizons are gone. Look as far as you can see in any direction and only the gray Synth Foods plants are seen spilling their way to the edges of the land.</TEXT><PARA/><POP/></RDL>'''
2984 = '''<RDL><PUSH/><TEXT>Where there’s LWB you are probably going to find Cinder Guard nearby. Those two groups seem to get along pretty well, of course the Hessians are far more dangerous. Though, the LWB pilots are becoming better and better pilots, don’t forget they all used to be simple farmers.</TEXT><PARA/><POP/></RDL>'''
2985 = '''<RDL><PUSH/><TEXT>The Cinder Guard come into this system through the Jump Hole leading to Omega-11. The hole is tucked away in the southern side of the Westnebel. Hessians use this system to get to Dresden and for resupply at the LWB base on the eastern side of Stuttgart.</TEXT><PARA/><POP/></RDL>'''
2986 = '''<RDL><PUSH/><TEXT>I can sympathize with the LWB, I’m a Dornmarker. I don’t like those Synth Foods Helion vultures coming here and despoiling the most beautiful planet in our space, but it comes down to the money. The fools in Ironreach sold Stuttgart away fighting the GMG, and I sold my allegiance to who had the most cash.</TEXT><PARA/><POP/></RDL>'''
2987 = '''<RDL><PUSH/><TEXT>Orbital Spa’s resort on Baden-Baden needs basic supplies like any other station in Sirius. We get the majority of our goods from this planet. Too bad Synth Foods has despoiled Stuttgart in so many ways, but perhaps that will force more people to use Orbital Spa’s facilities.</TEXT><PARA/><POP/></RDL>'''
2988 = '''<RDL><PUSH/><TEXT>The Foods and Luxury Foods that the clientele aboard our luxuriant resort enjoys, come exclusively from Stuttgart. We wouldn’t think of bringing food in from another locale, though the quality of the Luxury Food has diminished recently, which may cause things to change in the future.</TEXT><PARA/><POP/></RDL>'''
2989 = '''<RDL><PUSH/><TEXT>I can appreciate nationalism and pride, but I’d say these Dornmarkers are a bit over sensitive. They should welcome the influx of money and jobs that Helion corporations bring with them into the system. All I ever hear from these people are complaints about Helion scum this, and foreign money that, they are worse than the Orsena.</TEXT><PARA/><POP/></RDL>'''
2990 = '''<RDL><PUSH/><TEXT>Republican ships basic supplies to all the other legitimate bases in this system. Whatever anyone needs in Stuttgart, you can bet that Republican is shipping it for them.</TEXT><PARA/><POP/></RDL>'''
2991 = '''<RDL><PUSH/><TEXT>From The Ring in Ironreach, Republican ships Sidearms and Construction Machinery to Stuttgart proper. We also bring Consumer Goods from the capital planet. At Republican, we’ve got you covered.</TEXT><PARA/><POP/></RDL>'''
2992 = '''<RDL><PUSH/><TEXT>Next time you go to Hamburg, remember that Republican Shipping makes a good profit taking food to the Alster Shipyards. On your way back it would be easy enough to bring in Pharmaceuticals.</TEXT><PARA/><POP/></RDL>'''
2993 = '''<RDL><PUSH/><TEXT>My ancestors moved here centuries ago and began growing roses. Stuttgart is where people moved when they had made their fortunes and wished to retire. Originally, my family were independent pilots who made their money running Luxury Goods. We lost everything when the subsidies came to a halt.</TEXT><PARA/><POP/></RDL>'''
2994 = '''<RDL><PUSH/><TEXT>In the midst of the Eighty Years War the Dornmark government bankrupted itself fighting the GMG. With no other avenue left, they indebted themselves to Helion, that was the beginning of the end for Stuttgart. At the war’s finish, the debts needed to be settled.</TEXT><PARA/><POP/></RDL>'''
2995 = '''<RDL><PUSH/><TEXT>The WVS was the Stuttgart growing association that all farmers paid their dues to. The dues paid for lobbying in Ironreach and many other things that kept life good here. The WVS was a powerful voice in the old empire’s parliament. Now the WVS is an entity controlled by Synth Foods.</TEXT><PARA/><POP/></RDL>'''
2996 = '''<RDL><PUSH/><TEXT>Synth Foods’ cellulose plant was bred to survive in less than perfect growing conditions. That is what I don’t understand. Why did Synth Foods wish to take Stuttgart? They changed a garden planet capable of growing the most exotic and delicate flora into a factory for their tasteless weed.</TEXT><PARA/><POP/></RDL>'''
2997 = '''<RDL><PUSH/><TEXT>Once Synth Foods moved into Stuttgart they destroyed a way of life that had been going on for centuries. Mighty growing dynasties were torn apart overnight. Only the strongest families were able to keep their plantations, the rest were thrown free of the land by their own government.</TEXT><PARA/><POP/></RDL>'''
2998 = '''<RDL><PUSH/><TEXT>When fires began breaking out on Synth Foods farms, an investigation was launched. No one was able to discover who was at fault but, as the fires raged, the WVS fire trucks stayed in their garages. Synth Foods cried out for the WVS to be punished and of course Ironreach complied. The leaders of WVS; the master growers, were replaced with Synth Foods cronies.</TEXT><PARA/><POP/></RDL>'''
2999 = '''<RDL><PUSH/><TEXT>Even now, the finest foods found in all of Sirius are grown or raised here. My family was able to hold onto their farm, they weren’t over extended like many others when the subsidies came to a screeching halt. But now Synth Foods is dumping Carbon Dioxide into the atmosphere, and adding rough Fertilizers to the soil. These changes are making it difficult to cultivate the more delicate crops.</TEXT><PARA/><POP/></RDL>'''
3000 = '''<RDL><PUSH/><TEXT>The Oxygen content is very high on this planet. A man can work twice as hard without tiring when he has that much more Oxygen to breathe. And that euphoria you are feeling…also caused by the Oxygen concentration, the human body loves Oxygen.</TEXT><PARA/><POP/></RDL>'''
3001 = '''<RDL><PUSH/><TEXT>It took some time to safeguard the populace of this planet from the risks of fire. This much Oxygen makes the air flammable, but we learned to deal with it. Almost everything here is made from plastics, ships land and take off at the poles where the cold reduces the Oxygen amount and combustion engines aren’t used, everything is battery powered.</TEXT><PARA/><POP/></RDL>'''
3002 = '''<RDL><PUSH/><TEXT>Synth Foods earns more money shipping our yummy pastes to the LPI Huntsville and Sugarland in Houston, than supplying all of Frankfurt. The truth is we prefer to ship our pastes to people who will pay what they are worth. These silly Dornmarkers are too poor to deserve our pastes.</TEXT><PARA/><POP/></RDL>'''
3003 = '''<RDL><PUSH/><TEXT>Synth Foods brings in our own specially prepared Fertilizers from Houston and Bonn. If you are going to Bonn to pick up Fertilizers, you can take a shipment of paste with you.</TEXT><PARA/><POP/></RDL>'''
3004 = '''<RDL><PUSH/><TEXT>Synth Foods, pumping paste into the heart of Dornmark. That’s right, you can take Foods and Luxury Foods to Ironreach from Stuttgart.</TEXT><PARA/><POP/></RDL>'''
3005 = '''<RDL><PUSH/><TEXT>There is a lucrative market for Luxury Foods in Whiteharbor. If you are willing to make the trip, I’m sure the markets there will pay well for Stuttgart’s finest.</TEXT><PARA/><POP/></RDL>'''
3006 = '''<RDL><PUSH/><TEXT>The Dornmark government is composed entirely of fools. The economy of Stuttgart and of Dornmark for that matter were interwoven with the subsidies they had been pumping into Stuttgart for generations. When the government realized what a drain the subsidies were, they cut them overnight. Immediately the entire economy bottomed out, as bankruptcies and foreclosures skyrocketed. Then we came in and bought almost everyone out.</TEXT><PARA/><POP/></RDL>'''
3007 = '''<RDL><PUSH/><TEXT>Daumann keeps several villas here for its top executives. I have just arrived for the first time, due to a recent promotion. This is where I’m going to really launch my career. They say that you can get more accomplished five minutes in a mud bath than in two weeks of division meetings. Too bad I had to leave my children and wife at home, they would love it here.</TEXT><PARA/><POP/></RDL>'''
3008 = '''<RDL><PUSH/><TEXT>Now that I’m getting to the top, I’m going to start playing the game by my rules. It is time for a change in Daumann, they must be made to realize that our corporation can still profit without exploiting its workers.</TEXT><PARA/><POP/></RDL>'''
3009 = '''<RDL><PUSH/><TEXT>My father was a joint fitter at the Alster Shipyards. Nobody else knows this but me and his ghost. He worked triple shifts sometimes to pay my way through Ironreach University. He was on the bottom rung in Daumann; I just made VP.</TEXT><PARA/><POP/></RDL>'''
3010 = '''<RDL><PUSH/><TEXT>Kruger has booked the entire eastern mud bath wing of this facility to host our “We’re Pals with ALG, Appreciation Bash!” Five lucky Dornmark families will be chosen from the Kruger products and services mailing list at random to spend a week with the top ALG and Kruger executives. They will be able to soak in mud and give us their views on Dornmark corporate power.</TEXT><PARA/><POP/></RDL>'''
3011 = '''<RDL><PUSH/><TEXT>If this bash doesn’t go over well, I’m in big trouble. Kruger is posting record losses and we need something to turn this company around. We haven’t been able to get going since our horrible losses in Frankfurt, and the reparations we were forced to pay.</TEXT><PARA/><POP/></RDL>'''
3012 = '''<RDL><PUSH/><TEXT>While I’m here, I’m going to try and enjoy myself. But my miserable wife is eating every Luxury Food in sight. I keep telling her that this resort is not all-inclusive, I cannot put this all on my expense account — ach, I must not think of these things…relax, relax. I hate that fat cow.</TEXT><PARA/><POP/></RDL>'''
3013 = '''<RDL><PUSH/><TEXT>Any basic supplies we need here are either produced here or shipped in from Stuttgart by our own Commodity transports.</TEXT><PARA/><POP/></RDL>'''
3014 = '''<RDL><PUSH/><TEXT>The finest foods in all of Sirius are brought in from Stuttgart and hand-delivered to our exclusive clientele. Luxury Foods make a luxury vacation.</TEXT><PARA/><POP/></RDL>'''
3015 = '''<RDL><PUSH/><TEXT>The appointments at this beautiful resort are of the finest quality. Whiteharbor is where we get all of our Luxury Goods — from the art on the walls to the Phantasy Game Consoles in each room. In every way it’s Orbital, exceeding your expectations.</TEXT><PARA/><POP/></RDL>'''
3016 = '''<RDL><PUSH/><TEXT>This planet’s oceans and landmasses are lifeless. At first we believed this would be a detriment to tourist activities, but it actually works out quite well; no bothersome insects or man-eating carnivores. Just human beings and the animals they wish to bring here.</TEXT><PARA/><POP/></RDL>'''
3017 = '''<RDL><PUSH/><TEXT>Many of Dornmark’s elite used to build in Stuttgart when they wanted a summer home or were thinking about retiring. But now, with Synth Foods moved in and the LWB attacks and fires, many are finding Baden-Baden to be their choice for premium relaxation.</TEXT><PARA/><POP/></RDL>'''
3018 = '''<RDL><PUSH/><TEXT>The spring-heated mud baths of Baden-Baden make Sieglinde a singular vacationing experience. Where else can you wile away the hours covered in nutrient-enhanced moisturizing muds? Those wrinkles gotcha down, but you are afraid of dermaburns? Take off a decade or two in Baden-Baden.</TEXT><PARA/><POP/></RDL>'''
3019 = '''<RDL><PUSH/><TEXT>Every month we hold our Sieglinde submersible-craft races. They are a favorite with retired pilots and adventure seekers. The oceans of Baden-Baden are deep and clear, which makes for some fun racing amongst the jagged rocks of the ocean depths. Luckily, only a few casualties per year.</TEXT><PARA/><POP/></RDL>'''
3020 = '''<RDL><PUSH/><TEXT>The LWB are reasonable people. Their attacks on Baden-Baden will become less frequent, but gradually, so as to not arouse suspicion. A little money in their coffers helps us all profit. They may need a little extra funding to help them blow up the vacation villas on Stuttgart.</TEXT><PARA/><POP/></RDL>'''
3021 = '''<RDL><PUSH/><TEXT>Because of the financial troubles Dornmark is in, we haven’t been making as much profit at this resort as our others. We may be forced to bring in Helion vacationers. Not the quality types either — they can go to </TEXT><TRA italic="true"/><TEXT>Hawaii</TEXT><TRA italic="false"/><TEXT>  or Curacao. We’ve had to bring in the econoclass vacationers to fill the rooms.</TEXT><PARA/><POP/></RDL>'''
3022 = '''<RDL><PUSH/><TEXT>Ah, what a wonderful place this is. Have you looked across the black sand beaches at the ocean during sunset? It is truly spectacular. I enjoy using the northern mud bath facilities, That is where the </TEXT><TRA italic="true"/><TEXT>crème de la crème</TEXT><TRA italic="false"/><TEXT>  of Dornmark society book their vacations.</TEXT><PARA/><POP/></RDL>'''
3023 = '''<RDL><PUSH/><TEXT>This resort is nice and relaxed, not like the other Orbital Spa locales that are populated by criminals and deviants. Yes, this is where you go to rub elbows; not just with the rich, but with the genteel.</TEXT><PARA/><POP/></RDL>'''
3024 = '''<RDL><PUSH/><TEXT>My great-grandfather was on the board of directors for Republican when we changed our name from Imperial Shipping. A Neumann has sat upon the board for the past 200 years, and this has always been a favorite vacation spot.</TEXT><PARA/><POP/></RDL>'''
3025 = '''<RDL><PUSH/><TEXT>I love this wonderful resort. My favorite area is the western mud baths. I can just imagine the purple muds squishing between my toes. Amazing how the Water and the earth mix at just the right temperature for total relaxation.</TEXT><PARA/><POP/></RDL>'''
3026 = '''<RDL><PUSH/><TEXT>I’m a captain in the Navy, but here I am a tourist like any other. No matter how powerful you are, you still need to relax here and there. Of course, my ship could destroy all the people on this planet from orbit, but that means nothing when I am plopped in a mud bath.</TEXT><PARA/><POP/></RDL>'''
3027 = '''<RDL><PUSH/><TEXT>If Orbital didn’t give us discounts, they would find themselves fighting off a lot more pirates than they do now. Hey, it’s not my problem a few tourists get blown up here and there. There is a lot of space to keep safe.</TEXT><PARA/><POP/></RDL>'''
3028 = '''<RDL><PUSH/><TEXT>The LWB has made a foolish mistake by attacking the tourist transports to this base. Orbital must get their food from somewhere, it might as well be Stuttgart. To attack innocent vacationers is going too far. They will be made to pay…later.</TEXT><PARA/><POP/></RDL>'''
3029 = '''<RDL><PUSH/><TEXT>Yes, Orbital knows how to keep its resorts well-protected; they offer discounts to higher-ranking members of the Dornmark Police. Police presence is stretched to the maximum in Dornmark, yet there are two bases within Stuttgart — a system that houses two Helion corporations as its primary residents.</TEXT><PARA/><POP/></RDL>'''
3030 = '''<RDL><PUSH/><TEXT>Don’t be fooled; just because I work for a bankrupt government, that doesn’t mean I don’t have credits to spend. Several corporations always pay well for the authorities to turn a blind eye to certain actions. I don’t open my mouth when Synth Foods burns down one of the few remaining Dornmark plantation houses, and that’s how I make sure I’ll retire in style.</TEXT><PARA/><POP/></RDL>'''
3031 = '''<RDL><PUSH/><TEXT>From Larkspur, Bowex brings Gold to this distribution depot in Dornmark space. It’s good cash if you don’t get your ship blown inside-out by Hessians or Rift Captains. While you’re here, you might think about taking Engine Components into the Southampton Shipyards for the trip there.</TEXT><PARA/><POP/></RDL>'''
3032 = '''<RDL><PUSH/><TEXT>Border World Exports, or Bowex as we are more commonly known, brings the Diamonds gathered here in Dornmark to our solicitors in Larkspur. Hazardous run, I can promise you that, but not without its perks — basically, the cash you get for making it there with Diamonds.</TEXT><PARA/><POP/></RDL>'''
3033 = '''<RDL><PUSH/><TEXT>From Larkspur Bowex brings Gold to this distribution depot in Dornmark space. It’s good cash if you don’t get your ship blown inside-out by Hessians or Rift Captains.</TEXT><PARA/><POP/></RDL>'''
3034 = '''<RDL><PUSH/><TEXT>Daumann’s mining facility sends Diamonds to this depot on our convoys from Solarius. It is a dangerous run to make, but perhaps you are willing.</TEXT><PARA/><POP/></RDL>'''
3035 = '''<RDL><PUSH/><TEXT>Ruegen, the Daumann operation in the Border Worlds, needs us to supply them with Mining Machinery and H-Fuel. You could be the one to help them there, if you don’t fear the Border Worlds.</TEXT><PARA/><POP/></RDL>'''
3036 = '''<RDL><PUSH/><TEXT>Our base Briesen in the Border Worlds requires basic necessities to be shipped in from this facility. The Diamonds we trade here more than pay for any supplies they may need there.</TEXT><PARA/><POP/></RDL>'''
3037 = '''<RDL><PUSH/><TEXT>From Cardiff, Gateway brings Beryllium to Dornmark. This is only a supply depot; our shipments continue on to Dortmund.</TEXT><PARA/><POP/></RDL>'''
3038 = '''<RDL><PUSH/><TEXT>Gateway crosses the deadly Border Worlds, bringing Gold and Niobium here from Kensington. We took some casualties in Omega-7 from Cinder Guard. They hit us hard; most of our escorts got wiped.</TEXT><PARA/><POP/></RDL>'''
3039 = '''<RDL><PUSH/><TEXT>Freistadt in Omega-3 is in need of our services to ship basic supplies and Mining Machinery. The chaps who live out there are crazy ones.</TEXT><PARA/><POP/></RDL>'''
3040 = '''<RDL><PUSH/><TEXT>The lads at Freeport 1 pay us to bring them Mining Machinery and Engine Components from this shipping hub. Strange how much people will withstand to live free of governmental control.</TEXT><PARA/><POP/></RDL>'''
3041 = '''<RDL><PUSH/><TEXT>The Jump Holes in this system lie on opposite sides of Stuttgart. The hole to Omega-11 is in the Westnebel, and the hole to Dresden lies within the Ostnebel.</TEXT><PARA/><POP/></RDL>'''
3042 = '''<RDL><PUSH/><TEXT>If you’re looking for the LWB, you’re best served hunting them down in the Ostnebel. That’s where they will be found — or raiding the Trade Lanes between Ironreach and the planet Stuttgart.</TEXT><PARA/><POP/></RDL>'''
3043 = '''<RDL><PUSH/><TEXT>The Cinder Guard are the real problem in this system. At least the LWB confine themselves to the east side of Stuttgart. The Hessians come in from the Jump Hole in the Westnebel and range all over this place. They are fierce pilots too. My apprentice lived for six days before he died.</TEXT><PARA/><POP/></RDL>'''
3044 = '''<RDL><PUSH/><TEXT>The Hessians think they own Dornmark, but I am paid to make them think differently. I used to be an independent pilot that did a lot of work for the Rift Captains. Eventually, I had to start going up against Hessians in Omega-5. That’s how I learned to kill them.</TEXT><PARA/><POP/></RDL>'''
3045 = '''<RDL><PUSH/><TEXT>Occasionally I am hired to kill the LWB. I don’t like the work as much as taking down Hessians, but it’s much easier. Synth Foods is really the only company that pays well for LWB pilots, and the less I have to work for Helion the better.</TEXT><PARA/><POP/></RDL>'''
3046 = '''<RDL><PUSH/><TEXT>The police in Dornmark barely get enough parts to keep their ships flying. They are good pilots and have decent training, but that is all they’ve got. Hey, I can find more work in Dornmark than anywhere else. That means the police aren’t doing their job.</TEXT><PARA/><POP/></RDL>'''
3047 = '''<RDL><PUSH/><TEXT>Kruger ships Mining Machinery to our base in the Border Worlds — perhaps you have been to this place? Elbich is an important part of our operations.</TEXT><PARA/><POP/></RDL>'''
3048 = '''<RDL><PUSH/><TEXT>Our convoy pilots brave the Hessians and the Rift Captains, making sure that the employees at Elbich receive all the necessary supplies to keep operations running smoothly.</TEXT><PARA/><POP/></RDL>'''
3049 = '''<RDL><PUSH/><TEXT>From Essen, we bring Mining Machinery to this base, where it will be used in operations throughout the Dornmark-occupied Border Worlds.</TEXT><PARA/><POP/></RDL>'''
3050 = '''<RDL><PUSH/><TEXT>Republican supplies this base with the basic necessities from Stuttgart. Our convoys fall under attack from the Hessians and the LWB, but at least we don’t have to worry about the Unioners in this system.</TEXT><PARA/><POP/></RDL>'''
3051 = '''<RDL><PUSH/><TEXT>Republican makes several shipments between this base and the Ring in Ironreach. From Daumann’s station, we bring in Engine Components and ship them Beryllium and Niobium.</TEXT><PARA/><POP/></RDL>'''
3052 = '''<RDL><PUSH/><TEXT>The Diamonds that come to this base from the Border Worlds are shipped directly to Cambridge on our shipping convoys. It is a dangerous yet lucrative run.</TEXT><PARA/><POP/></RDL>'''
3053 = '''<RDL><PUSH/><TEXT>Gold is brought aboard this station from Larkspur. It is a prosperous run but requires the crossing of the Border Worlds. If you are willing, it could make you plenty of money. Or it could kill you.</TEXT><PARA/><POP/></RDL>'''
3054 = '''<RDL><PUSH/><TEXT>The ships that get built in Alster Shipyards require Gold to be produced. Republican makes sure that they get the Gold they need to do the job.</TEXT><PARA/><POP/></RDL>'''
3055 = '''<RDL><PUSH/><TEXT>Ironreach often needs Gold. It is a valuable Commodity, and we are happy to provide the fine artisans of Ironreach with the supplies they need from this base.</TEXT><PARA/><POP/></RDL>'''
3056 = '''<RDL><PUSH/><TEXT>Though their presence is heavy in this system compared to others, the Dornmark Federal Police hardly do an adequate job keeping our shipments safe. That is why Republican hires so many Bounty Hunters in Dornmark space; it is a necessary expense.</TEXT><PARA/><POP/></RDL>'''
3057 = '''<RDL><PUSH/><TEXT>The Alster Shipyards are the root of our troubles with the Unioners. Our Gold shipments headed for Alster often get waylaid by those devilish curs. I shall look forward to the day when the last Unioner lays dead upon the ground. Fortunately, there are none in this system.</TEXT><PARA/><POP/></RDL>'''
3058 = '''<RDL><PUSH/><TEXT>Cinder Guard and the LWB are our concerns in this system. The Bounty Hunters we hire are competent, only it is a shame we must hire assassins to do what the government collects taxes to accomplish. We lose men every week on our shipping runs. Soon I will be able to retire and not have to worry about these things anymore.</TEXT><PARA/><POP/></RDL>'''
3059 = '''<RDL><PUSH/><TEXT>Republican Shipping provides the Ulm Police Base with all of her basic supplies from Stuttgart. It is not incredibly profitable to do this, but relatively safe.</TEXT><PARA/><POP/></RDL>'''
3060 = '''<RDL><PUSH/><TEXT>Premium Daumann weapons make their way to the hands of the Dornmark Federal Police via Republican convoys from the Ring in Ironreach.</TEXT><PARA/><POP/></RDL>'''
3061 = '''<RDL><PUSH/><TEXT>The Dornmark government is always several months behind in its payments to the Commodity brokers that keep their bases supplied. It is appalling to see our sovereign nation fall into such terrible times.</TEXT><PARA/><POP/></RDL>'''
3062 = '''<RDL><PUSH/><TEXT>I am furious that the criminals we fight are better equipped than our finest. The Hessians have better ships and better weapons. We have better pilots, but we are running out of them. More of us die each day, and for what?</TEXT><PARA/><POP/></RDL>'''
3063 = '''<RDL><PUSH/><TEXT>We are the guardians to the gates that lead into the Border Worlds. We patrol our side, but dare not go into Omega-7. It is grounds for immediate termination. No lives or ships can be spared defending space that Dornmark cannot even lay claim to.</TEXT><PARA/><POP/></RDL>'''
3064 = '''<RDL><PUSH/><TEXT>The Cinder Guard pour from the Westnebel in an unending stream. We lack the resources to stop half of them. I used to be disdainful of Bounty Hunters, but if it were not for their actions here, we could be overrun. The only Dornmark military you will see here are captains and admirals sunning themselves in Baden-Baden.</TEXT><PARA/><POP/></RDL>'''
3065 = '''<RDL><PUSH/><TEXT>My family, the Steiners, have grown thin in number. We were once a large group of men and women known as excellent pilots and daring fighters. Now there is just my brother and me left alive.</TEXT><PARA/><POP/></RDL>'''
3066 = '''<RDL><PUSH/><TEXT>My brother is a police pilot in Frankfurt. He says that conditions are worse there. Of course, that is the system that got ravaged by the GMG, but we all lost in “the Eighty.” I wish I had been alive to fight in it.</TEXT><PARA/><POP/></RDL>'''
3067 = '''<RDL><PUSH/><TEXT>I have been giving thought to becoming a Bounty Hunter. That way I would be better equipped and much better paid. I see them collecting rewards on every vermin they kill. Perhaps I could go to Helion and kill Rogues.</TEXT><PARA/><POP/></RDL>'''
3068 = '''<RDL><PUSH/><TEXT>There is a pilot here who wishes to leave our ranks. He has tried to keep it secret but I found out. He wants to become a Bounty Hunter and leave Dornmark. I’m sure it is because he is afraid to fight Cinder Guard — he has trouble killing them.</TEXT><PARA/><POP/></RDL>'''
3069 = '''<RDL><PUSH/><TEXT>We intercepted a Red Hessian supply shipment crossing the system between the Ostnebel and Westnebel. It was quite a boost in morale around here; normally things are rather glum, but we were able to salvage all manner of goods. Of course, we don’t turn in everything we find, they barely pay me enough to feed my children.</TEXT><PARA/><POP/></RDL>'''
3070 = '''<RDL><PUSH/><TEXT>One of the other policemen at this station, Steiner, has two brothers, though he will only mention one. The third is a Red Hessian. One day, perhaps the two brothers will face each other out there. I don’t know who will win. Steiner is the best pilot here, but his brother…I hear he is an incredible pilot, a soldier in the Corsair Wars.</TEXT><PARA/><POP/></RDL>'''
3071 = '''<RDL><PUSH/><TEXT>The supplies we bring to this base from Stuttgart keep it going. It is the better half of my job being there, even with the Libertonian dogs despoiling the air. This place is falling apart.</TEXT><PARA/><POP/></RDL>'''
3072 = '''<RDL><PUSH/><TEXT>From the Ring in Ironreach come the Daumann Side Arms that keep the police safe when they are not shielded and armored within their ships.</TEXT><PARA/><POP/></RDL>'''
3073 = '''<RDL><PUSH/><TEXT>I may be bringing supplies to a police base, but trust me, our convoys are no safer than any other. The Cinder Guard will attack anyone if they are carrying what they are looking for, or even for sport, the villainous </TEXT><TRA italic="true"/><TEXT>schwein</TEXT><TRA italic="false"/><TEXT>.</TEXT><PARA/><POP/></RDL>'''
3074 = '''<RDL><PUSH/><TEXT>The Dornmark government posted police bases at the edges of Dornmark and the Border Worlds. Yes, very noble of them, but I don’t know who they are trying to fool. The Cinder Guard pour into this system, and there is very little we can do to stop them without the help of the Navy. But that is far too expensive, isn’t it?</TEXT><PARA/><POP/></RDL>'''
3075 = '''<RDL><PUSH/><TEXT>The LWB are not really our problem unless they come to this side of Stuttgart. Our concern is the plague of Dornmark: the Cinder Guard. I’ve heard that they are fighting a war against the Rift Captains in the Border Worlds. By their numbers, I’d say they aren’t losing.</TEXT><PARA/><POP/></RDL>'''
3076 = '''<RDL><PUSH/><TEXT>Any navy Dornmark had to speak of was destroyed in the Eighty-Years War, and we lost that too, didn’t we? They can’t help us here. We are good enough pilots and honest men; not like the LPI in Cinderwell. But there are too few of us and our ships are falling apart.</TEXT><PARA/><POP/></RDL>'''
3077 = '''<RDL><PUSH/><TEXT>We don’t take as many criminals in as we used to; we cannot afford to. The price is too high — in ships and in men. It is always more difficult to capture than to kill.</TEXT><PARA/><POP/></RDL>'''
3078 = '''<RDL><PUSH/><TEXT>I have no real beef with the LWB; they are just doing what they think is best for Stuttgart. It’s the Hessians I don’t like — they are simply murderers and pirates. Too bad the LWB has fallen in with them. Makes me wonder if I won’t be cursing them in twenty years as well. If I last twenty, I guess I’ll be lucky.</TEXT><PARA/><POP/></RDL>'''
3079 = '''<RDL><PUSH/><TEXT>At Konstanz we have a saying: “If the engine fires up, it’s good enough to fly.” I used to believe that with the faint optimism of a man with no choice, but after I saw Wattenbarger’s ship go up last week when his shields failed him…well, I’ve been thinking I </TEXT><TRA italic="true"/><TEXT>do</TEXT><TRA italic="false"/><TEXT>  have a choice.</TEXT><PARA/><POP/></RDL>'''
3080 = '''<RDL><PUSH/><TEXT>There is a Hessian who has killed a few of our pilots. He is a formidable adversary and knows how to take on more than one opponent. Another Hessian we captured, when questioned about the first, was obstinate. After a little persuasion he told us that his comrade would never be found north of the Westnebel, but he would not tell us why.</TEXT><PARA/><POP/></RDL>'''
3081 = '''<RDL><PUSH/><TEXT>During the Eighty-Years War, that Daumann was unethical in its labor practices in the shipyards and smelters. But that does not excuse the barbaric slaughter and pillaging the Cinder Guard commit in the name of revenge. Fallen empire or not, we will stop them.</TEXT><PARA/><POP/></RDL>'''
3082 = '''<RDL><PUSH/><TEXT>It is my duty to complete my job to the best of my ability. This is in spite of the condititons that may befall me due to circumstance. To blame other things is only an excuse and the tool of a weak man; I am a Dornmarker of the sleeper ship Dornmark. Perhaps we lost “the Eighty,” but that does not give us license to quit.</TEXT><PARA/><POP/></RDL>'''
3083 = '''<RDL><PUSH/><TEXT>The Hessians use this base as a stopover between Vogtland and Ronneburg. We ship all the basic supplies to this base. Some of them we sell to the LWB, the rest we deliver to the Ronneburg.</TEXT><PARA/><POP/></RDL>'''
3084 = '''<RDL><PUSH/><TEXT>Aside from basic supplies, we bring Side Arms and Engine Components here. The LWB are only too happy to purchase those goods. Whatever we don’t sell continues on to Ronneburg.</TEXT><PARA/><POP/></RDL>'''
3085 = '''<RDL><PUSH/><TEXT>This system has a strong police presence compared to others, but the lanes here are also carrying many juicy Commodities. The traffic to and from the Republican supply depot here is a tempting target for us.</TEXT><PARA/><POP/></RDL>'''
3086 = '''<RDL><PUSH/><TEXT>Daumann, Kruger, Republican, the government — it’s all just the rich exploiting the poor. I hate our government and our corporations too much to ever try and help this accursed place. Men are crushed to nothing by the system, that’s why I became a Red Hessian. I’d be damned if I wasted my life living under another man’s boot.</TEXT><PARA/><POP/></RDL>'''
3087 = '''<RDL><PUSH/><TEXT>I’ve been all over Dornmark and the Border Worlds. I’ve killed Vesperans, Police, and Military. I began my career fighting the Rift Captains in Omega-5. After that meat grinder, I became numb to it all.</TEXT><PARA/><POP/></RDL>'''
3088 = '''<RDL><PUSH/><TEXT>My brother is a Dornmark Federal Police pilot; he operates out of the station Ulm, north of the </TEXT><TRA italic="true"/><TEXT>Westnebel</TEXT><TRA italic="false"/><TEXT>. I do not fly in that space — we may be on opposite sides of the law, but I do not wish to see any harm come to him.</TEXT><PARA/><POP/></RDL>'''
3089 = '''<RDL><PUSH/><TEXT>The Cinder Guard are allies of ours, though they do not share in the LWB’s intense hatred of Synth Foods and ALG. From our base in the Ostnebel, we can attack shipments of ALG Fertilizers, and harass any shipments that Synth Foods is trying to get off of the planet.</TEXT><PARA/><POP/></RDL>'''
3090 = '''<RDL><PUSH/><TEXT>The WVS, or Stuttgart Growing Association, protected the rights of the Stuttgart farmers for a very long time. It was an age of wealth and pride for Stuttgart. We were a united front in Ironreach and lobbied forcefully to gain government subsidies. But it all came to a stop at the end of that terrible war.</TEXT><PARA/><POP/></RDL>'''
3091 = '''<RDL><PUSH/><TEXT>After the Eighty-Years War, the Dornmark Government was bankrupt, and they were deep in debt to Helion. That is how Helion corporations were able to get their hands on the soil of Stuttgart. They came in with their foreign capital and bribed the old government into selling the garden. The debt to Helion was cancelled, but honor is something you should not trade at any price.</TEXT><PARA/><POP/></RDL>'''
3092 = '''<RDL><PUSH/><TEXT>The Cinder Guard use this base as a rest stop in their travels through Dornmark. In return we may purchase many Commodities from their base, Vogtland. The Engine Components we get from them help keep our ships operational.</TEXT><PARA/><POP/></RDL>'''
3093 = '''<RDL><PUSH/><TEXT>A benefit of the Ostnebel Cloud that hides Darmstaad is the Jump Hole that leads to Dresden. It makes travel throughout Dornmark easier. The other Jump Hole in Stuttgart is across the system in the Westnebel; it will lead you to Omega-11.</TEXT><PARA/><POP/></RDL>'''
3094 = '''<RDL><PUSH/><TEXT>Under the WVS, Stuttgart was a planet of proud farmers who owned and tilled the land as free men; it was a paradise. Do you know what it is to caress the leaf of a plant growing strong in your own fields? When my father was a boy, he walked lands with his father that had fed our family, and all of Dornmark, for generations.</TEXT><PARA/><POP/></RDL>'''
3095 = '''<RDL><PUSH/><TEXT>The LWB (Farmer’s Rights Movement) was founded in 730 AS after Synth Foods executives took control of the WVS (Stuttgart Growing Association). The WVS was dead from that day forward. We came together to safeguard what rights we had left. The LWB is not a terrorist organization; we fight to protect the farmers on Stuttgart from exploitation at the hands of Synth Foods.</TEXT><PARA/><POP/></RDL>'''
3096 = '''<RDL><PUSH/><TEXT>We are supplied by the Ironreach Junkers of Kreuzberg. They offer us almost everything we need, from basic necessities to Side Arms.</TEXT><PARA/><POP/></RDL>'''
3097 = '''<RDL><PUSH/><TEXT>Pumping Fertilizers and Terraforming Gases into Stuttgart makes it impossible to grow anything else but that damned Synth Foods weed. The weather systems have shifted and the luxury crops that helped individual farmers stave off Synth Foods buyouts are starting to fail. We will attack any ALG Fertilizers or Synth Terraforming Gases on their way to Stuttgart.</TEXT><PARA/><POP/></RDL>'''
3098 = '''<RDL><PUSH/><TEXT>Every Synth Foods ship laden with crops leaving our system not grown by WVS farmers is an insult to Dornmark, and the great farming culture that once was Stuttgart. That is why they must be destroyed; every convoy we can destroy with Synth Paste brings us one step closer to the sovereign lands we lost.</TEXT><PARA/><POP/></RDL>'''
3099 = '''<RDL><PUSH/><TEXT>The subsidies that Stuttgart farmers enjoyed before the Eighty-Years War stopped overnight at the war’s end in 685 AS. Ironreach was bankrupt. Immediately, more than half of the Stuttgart farmers were plunged into poverty. I understand why they stopped the subsidies, but to do so overnight destroyed the last remnants of a stable economy in Dornmark. I curse the fools in Ironreach.</TEXT><PARA/><POP/></RDL>'''
3100 = '''<RDL><PUSH/><TEXT>This base receives its basic supplies from the capital planet, Ironreach. Crucial to our operations here is the Mining Machinery we receive from the same source.</TEXT><PARA/><POP/></RDL>'''
3101 = '''<RDL><PUSH/><TEXT>Ruegen in Ironreach is where our convoys go to pick up the Hydrocarbons that this base needs to maintain its operations.</TEXT><PARA/><POP/></RDL>'''
3102 = '''<RDL><PUSH/><TEXT>Daumann’s primary facility — the Ring in Ironreach — supplies us with our Niobium. In return, we ship them the High-Temperature Alloys and Cobalt that is produced here. If you wish to see the pride of Dornmark, you could make this run.</TEXT><PARA/><POP/></RDL>'''
3103 = '''<RDL><PUSH/><TEXT>If you have the skill and the inclination, Fort Bush in Cinderwell is always willing to purchase Dresden Copper.</TEXT><PARA/><POP/></RDL>'''
3104 = '''<RDL><PUSH/><TEXT>The Oder Shipyard is the largest shipyard in all of Sirius. They are in need of our High-Temperature Alloys. If you go there, we would be happy to purchase any MOX you bring back.</TEXT><PARA/><POP/></RDL>'''
3105 = '''<RDL><PUSH/><TEXT>This system has been the heart of Dornmark’s industrial power since 188 AS, when the first Jump Gates were built here connecting us to Ironreach. For centuries we mined and smelted in peace; that all changed after “the Eighty.” Now we are plagued by all manner of pirates.</TEXT><PARA/><POP/></RDL>'''
3106 = '''<RDL><PUSH/><TEXT>Leipzig is surrounded by a sulfurous cloud that has accreted over centuries of industrial labor at this base. It is a byproduct of Daumann’s works in this area. Sulfur is no longer released into space; instead it is captured and shipped as Fertilizers for Synth Foods operations.</TEXT><PARA/><POP/></RDL>'''
3107 = '''<RDL><PUSH/><TEXT>Red Hessian activity in this system is exceptionally vicious. Because they are pirates, they are plentiful in Ironreach. But because they were once Daumann employees, their attacks here are the most violent. This is where the Cinder Guard began; the heart of industry, the heart of revolt. Hessians plague this system not for goods, but for revenge — unceasing revenge.</TEXT><PARA/><POP/></RDL>'''
3108 = '''<RDL><PUSH/><TEXT>This system is where the Popular Revolt began when disgruntled miners took over Leipzig Station on Von Rohe’s Day in 700 AS. Before long, the revolt had spread throughout all of Dornmark, and the days of the empire where numbered.</TEXT><PARA/><POP/></RDL>'''
3109 = '''<RDL><PUSH/><TEXT>In the Lavafeld you will find a Jump Hole to Omega-11; that is where the Cinder Guard enter and exit this system for the western Border Worlds. If you are looking for them, and you want to pop them with Diamonds in their holds, then that is where you go.</TEXT><PARA/><POP/></RDL>'''
3110 = '''<RDL><PUSH/><TEXT>The LWB are not a huge presence in this system. They are more concerned with keeping supplies running between the Hessian base here and their base in Stuttgart. This system is also their transit point to Ironreach. If you are looking for them, do your hunting in the Giftnebel.</TEXT><PARA/><POP/></RDL>'''
3111 = '''<RDL><PUSH/><TEXT>This is the backbone of Daumann’s mining concerns, so of course you will find a Red Hessian base here in Dresden. Look in the Giftnebel, you will encounter it, along with Jump Holes that lead to Ironreach and Stuttgart. If you go there, I hope that you are a good pilot and not afraid to go up against multiple targets.</TEXT><PARA/><POP/></RDL>'''
3112 = '''<RDL><PUSH/><TEXT>If Daumann didn’t pay me so much for dead Hessians, I would go looking for other types to bring down. But since I know where they operate and how they fly, and since they pay the most, it is an easy choice. The hard part is killing them; they don’t die easily and there are always more.</TEXT><PARA/><POP/></RDL>'''
3113 = '''<RDL><PUSH/><TEXT>I like to hang out in the Daumann Lavafeld. I know that there are always going to be Hessian attacks there. And the executives like to see you make your kills near the base they are paying you to protect. Just hang out in the sulfur a bit, Cinder Guard will fly right under your nose.</TEXT><PARA/><POP/></RDL>'''
3114 = '''<RDL><PUSH/><TEXT>My old man was a Red Hessian. He was the one who taught me all their Jump Hole networks, and when to hit them when they were carrying Diamonds. He left the Cinder Guard because they were changing. My father wasn’t a pirate; he was a Daumann political opponent.</TEXT><PARA/><POP/></RDL>'''
3115 = '''<RDL><PUSH/><TEXT>The Schwefelnebel hides the Jump Hole leading into Frankfurt. Cinder Guard make supply runs into that system, so it is a good place to hunt for them. Plus, the proximity to this base from there means that if you get shot up and need repairs, you don’t have to fly far with a leaky ship.</TEXT><PARA/><POP/></RDL>'''
3116 = '''<RDL><PUSH/><TEXT>If you want some real trouble, you might try heading to Omega-11 — there are Diamonds and Hessians all over that system. It’s one of the most dangerous places in Sirius. If the pirates don’t kill you, the solar flares usually will. The Jump Hole is in the Lavafeld.</TEXT><PARA/><POP/></RDL>'''
3117 = '''<RDL><PUSH/><TEXT>You can kill LWB and Cinder Guard in the Giftnebel. There are Jump Holes in there as well as a Hessian base. It is extremely dangerous, though; you must excerise caution if you go. I tell newbie Bounty Hunters I don’t like, that it is the place they need to be.</TEXT><PARA/><POP/></RDL>'''
3118 = '''<RDL><PUSH/><TEXT>I’ve almost got enough saved to retire. I don’t know what I’m going to do or where I will go. I might go to Helion. I don’t really want to, but I always get paid in Helion coin so the currency doesn’t lose value before I can spend it.</TEXT><PARA/><POP/></RDL>'''
3119 = '''<RDL><PUSH/><TEXT>I’m doing the guys I kill a favor. If they got caught by the police they would have to go to Vierlande for the rest of their days. It is much better to die fighting than to rot away in a dark hole.</TEXT><PARA/><POP/></RDL>'''
3120 = '''<RDL><PUSH/><TEXT>I’m one of the few men who went to the Vierlande and came back out again. Almost all of the sentences are for life, including mine. But I got a reprieve after I helped the guards put down a riot. After being there, I prefer getting blown away by Hessians to breaking the law again.</TEXT><PARA/><POP/></RDL>'''
3121 = '''<RDL><PUSH/><TEXT>The Diamonds we mine in this system aren’t usually high enough quality to make the Luxury Goods markets, but they are perfect for industrial drill bits. Kruger ships these Diamonds to Essen, and while in Essen we purchase Mining Machinery and bring it back here.</TEXT><PARA/><POP/></RDL>'''
3122 = '''<RDL><PUSH/><TEXT>Our mining vessels require H-Fuel, like any other non-capital-class ship. We supply our base with H-Fuel from Mannheim.</TEXT><PARA/><POP/></RDL>'''
3123 = '''<RDL><PUSH/><TEXT>The best-quality Diamonds mined here are sent to Ironreach to be used in the Luxury Goods market. Our convoys leave with holds full of Diamonds, and return with basic supplies.</TEXT><PARA/><POP/></RDL>'''
3124 = '''<RDL><PUSH/><TEXT>Everyone knows that it was Daumann’s fault that the miners in this system revolted. But the chain reaction swept through all of Dornmark. The reparations we were forced to pay, along with the crippling losses we incurred in the Eighty-Years War, have left us struggling to stay afloat.</TEXT><PARA/><POP/></RDL>'''
3125 = '''<RDL><PUSH/><TEXT>The police station Pirna has some excellent pilots, and they are honorable officers who know that Kruger is their friend, but they do not have the power to hold back the tide of Cinder Guard in this system. We are forced to hire mercenaries. I do not respect the Charter Guild, but I appreciate their work.</TEXT><PARA/><POP/></RDL>'''
3126 = '''<RDL><PUSH/><TEXT>Of course Kruger was somewhat strict with its workers before the revolt, and I suppose we still are now to a degree. But that is the way you must be to run a successful company. We could not have remained competitive if we didn’t push our employees to work the hours that Daumann required of their employees.</TEXT><PARA/><POP/></RDL>'''
3127 = '''<RDL><PUSH/><TEXT>The most recent Red Hessian attack on our operations was horrible. They caught a whole team of miners working a large asteroid in the Schwefelnebel. The miserable Hessians didn’t stop firing until there was nothing moving but body parts, all thirty of the miners dead.</TEXT><PARA/><POP/></RDL>'''
3128 = '''<RDL><PUSH/><TEXT>The Kruger Lavafeld is too close to the sun to send miners out in vac-suits. It is far too hot and dangerous to traverse. Instead we do our mining in the Schwefelnebel. I would say that that field is too dangerous too, but only because of the Cinder Guard.</TEXT><PARA/><POP/></RDL>'''
3129 = '''<RDL><PUSH/><TEXT>Employees die, that is just how industry is. We encourage our labor force to take breaks when they are too tired to work safely. It is their choice to keep working, and therefore it is their risk. Though some may say it is unfair, we could not remain soluble if we paid employees for resting on the job. No work means no pay.</TEXT><PARA/><POP/></RDL>'''
3130 = '''<RDL><PUSH/><TEXT>Daumann tries to show its appreciation for these brave men by bringing them the best in Side Arms directly from where they are produced at the Ring. From Riot Breakers to the new Daumann Shredders, these boys get the best.</TEXT><PARA/><POP/></RDL>'''
3131 = '''<RDL><PUSH/><TEXT>Basic supplies are shipped here by our convoys, which depart from Ironreach. It is a contract we are proud to fulfill, though the way is beset by dangerous pirates. We keep the Federal Police running with our goods.</TEXT><PARA/><POP/></RDL>'''
3132 = '''<RDL><PUSH/><TEXT>This post is so depressing; look at the faces of the men at this base. They are supposed to protect us? They look as if they expect death at any time. It makes me wonder if they know something that I don’t.</TEXT><PARA/><POP/></RDL>'''
3133 = '''<RDL><PUSH/><TEXT>Our base is situated between the Daumann and Kruger base, so both of their operations are our responsibility. The Hessians focus their attacks on the Trade Lanes that pass by both bases on the way to Ironreach. We try to patrol those areas, but we are stretched too thin here.</TEXT><PARA/><POP/></RDL>'''
3134 = '''<RDL><PUSH/><TEXT>My family has had men and women in the Dornmark Federal Police Force since before the Revolt. Back then we were known as the Imperial Police. In those days they had it easy; their ships were well-maintained and there was far less piracy than there is now.</TEXT><PARA/><POP/></RDL>'''
3135 = '''<RDL><PUSH/><TEXT>This job just doesn’t pay me enough to do the things that are required to keep my patrol area clear of criminals. It just seems like I’m risking my life for nothing these days. For every Red Hessian I bring in, another three are ready to take me out.</TEXT><PARA/><POP/></RDL>'''
3136 = '''<RDL><PUSH/><TEXT>Dresden is a hellhole. Look around — we are surrounded by poisonous gas clouds and irradiated asteroid fields. What are you doing here? What could possibly interest you enough to be in this system?</TEXT><PARA/><POP/></RDL>'''
3137 = '''<RDL><PUSH/><TEXT>This is a great job. I fly a rusty old heap of metal, my pay is lousy, I risk my life each day, and the pirates I fight make more money than I do. Maybe I could take my training and become a Hunter.</TEXT><PARA/><POP/></RDL>'''
3138 = '''<RDL><PUSH/><TEXT>The Dornmark credits that I am paid with lose more value each day. The inflation we are experiencing here is so great that the only kind of payment that keeps is actual Commodities. If it wasn’t for the fact that we get room and board, I would find other work.</TEXT><PARA/><POP/></RDL>'''
3139 = '''<RDL><PUSH/><TEXT>This is one of the systems that they send you to if you are a good pilot but complain too much — or the captain does not like you. The mortality rate here among Federal Police is the highest in all of Dornmark. All we fight are Cinder Guard and the occasional LWB.</TEXT><PARA/><POP/></RDL>'''
3140 = '''<RDL><PUSH/><TEXT>The blue Diamonds that Kruger mines here are highly prized in the Luxury Goods markets at Ironreach. That’s one of the reasons that the Hessians attack the lanes near the Kruger base so often. They also hit the miners out in the fields. When that happens, all that’s left of the miners is their teeth.</TEXT><PARA/><POP/></RDL>'''
3141 = '''<RDL><PUSH/><TEXT>”Learn to be a pilot,” my mother always told me. “Don’t waste away in the mines,” she would say. Ha — look at this base, look at the pilots here; what a wonderful life I have chosen. Soon enough I’m going to make a mistake out there and then I’m dead. It’s just a matter of time.</TEXT><PARA/><POP/></RDL>'''
3142 = '''<RDL><PUSH/><TEXT>All the supplies we need to keep this base going are bought by us from Junkers in Kreuzberg and brought here. Thank goodness for our lovely black markets in Ironreach.</TEXT><PARA/><POP/></RDL>'''
3143 = '''<RDL><PUSH/><TEXT>This base serves as a trade depot for other Hessian bases in the area. The basic supplies we ship here also get shipped to Freital. If you made these shipments, it would be easier for us since the police actively hunt for us.</TEXT><PARA/><POP/></RDL>'''
3144 = '''<RDL><PUSH/><TEXT>Along with basic supplies, we also purchase Side Arms and Engine Components from the Junkers in Ironreach to ship here. Surplus weapons and engine parts get sent to Freital.</TEXT><PARA/><POP/></RDL>'''
3145 = '''<RDL><PUSH/><TEXT>Diamonds come to this base from Freital in Omega-11. We will take them to the Junkers in Ironreach to be sold on the black markets. It is these Diamonds that fund the majority of all Red Hessian operations.</TEXT><PARA/><POP/></RDL>'''
3146 = '''<RDL><PUSH/><TEXT>The Giftnebel is a dangerous cloud to move through, but its proximity to the Kruger and Daumann operations here makes it worthwhile. We know this system well, and that helps us when we raid the corporates trying to ship their goods back to Ironreach.</TEXT><PARA/><POP/></RDL>'''
3147 = '''<RDL><PUSH/><TEXT>What a fitting place this cloud is; formed from the sulfurous waste of the smelting plants in the system, crafted by Daumann and Kruger’s heedlessness. Now it hides their greatest threat: the Cinder Guard. It also hides the Jump Holes to Ironreach and Stuttgart.</TEXT><PARA/><POP/></RDL>'''
3148 = '''<RDL><PUSH/><TEXT>We might eventually win this system from the corporates. Ore deposits here will soon be exhausted, and our attacks cost them dearly. Intelligence suggests they may be moving the bulk of their mining operations to Omega-7. If that happens, it will be a great victory for us.</TEXT><PARA/><POP/></RDL>'''
3149 = '''<RDL><PUSH/><TEXT>Years ago this was our only base. But we have expanded, due greatly to the Jump Holes that have been found. Also, we’ve had great success mining and stealing Diamonds. Hessians know the corporate strategies and protocols — we used to be part of them. That’s why our strikes are so effective.</TEXT><PARA/><POP/></RDL>'''
3150 = '''<RDL><PUSH/><TEXT>Dornmarkers have a slang for Diamonds — they call them “Hessian Tears.” They symbolize the lives of all the miners crushed into the Dornmark corporate machine, our fight to hold back the tide of Daumann and Kruger, and our struggle to pay for our crusade with their beauty.</TEXT><PARA/><POP/></RDL>'''
3151 = '''<RDL><PUSH/><TEXT>I’m one of the few Cinder Guard left who really tries to fight for the cause. Mostly, my brotherhood is one of pirates, but there are still some of us who haven’t lost the meaning in all of the greed that has overcome the others.</TEXT><PARA/><POP/></RDL>'''
3152 = '''<RDL><PUSH/><TEXT>I’ve killed hundreds — old and young. You may think me a monster, but that is because your view of what’s right and wrong is so narrow. There is no such thing as evil or good, there is only power and weakness.</TEXT><PARA/><POP/></RDL>'''
3153 = '''<RDL><PUSH/><TEXT>The Dornmark Republic was supposed to be about the common man getting paid well for hard work, about companies that cared if their employees were safe. Those brave souls who died fighting to overthrow the empire — why? Dornmark has the same masters, only now they rule a republic instead of an empire.</TEXT><PARA/><POP/></RDL>'''
3154 = '''<RDL><PUSH/><TEXT>We take basic supplies from this base to our home base Darmstadt, in Stuttgart. I am reminded why I must fight for my system when I come to this place of poison sulfurous clouds.</TEXT><PARA/><POP/></RDL>'''
3155 = '''<RDL><PUSH/><TEXT>The Hessians do business with the Junkers in Ironreach for Engine Components and Side Arms. Then we do business with the Cinder Guard here. We require the same things to remain a scenescript in the side of Synth Foods and the traitorous ALG.</TEXT><PARA/><POP/></RDL>'''
3156 = '''<RDL><PUSH/><TEXT>This system is useful to the LWB only as a place from which we can be resupplied by the Cinder Guard. Dresden is anathema to anyone who ever farmed land or lived in a place of beauty. The less time I spend here, the better.</TEXT><PARA/><POP/></RDL>'''
3209 = '''<RDL><PUSH/><TEXT>The </TEXT><TRA italic="true"/><TEXT>Trujillo</TEXT><TRA italic="false"/><TEXT>  stumbled into a gas pocket in the old Somerset mining area during the early days of Corsair incursion in the Larkspur system. The ship was lost deep inside the hazard area. Several attempts were made to rescue the Artifacts it carried, but to no avail.</TEXT><PARA/><POP/></RDL>'''
3210 = '''<RDL><PUSH/><TEXT>The Molly fighter </TEXT><TRA italic="true"/><TEXT>Vanguard</TEXT><TRA italic="false"/><TEXT>  was on a Gold run from Dublin to Trafalgar when it was intercepted by a Vespera Armed Forces patrol in the Cumbria Asteroid Field. They gave chase and he fled into a known gas hazard area. Unfortunately, his luck ran out that day when he encountered a particularly dense pocket. The ship still lies there, awaiting anyone foolish enough to knowingly enter a volatile gas zone.</TEXT><PARA/><POP/></RDL>'''
3211 = '''<RDL><PUSH/><TEXT>The Outcast fighter </TEXT><TRA italic="true"/><TEXT>Puno</TEXT><TRA italic="false"/><TEXT>  stumbled into one of the Southampton Debris Field radiation zones on the first Outcast drug run into the Larkspur system in 751. It still lies there, untouchable to anyone who values their life.</TEXT><PARA/><POP/></RDL>'''
3212 = '''<RDL><PUSH/><TEXT>The </TEXT><TRA italic="true"/><TEXT>Henry Jones</TEXT><TRA italic="false"/><TEXT>  Gold convoy was bound for Dornmark when it was attacked by Rift Captains near the Omega-3 Gate. Its escorts were destroyed, and the ship was commandeered. An Armed Forces patrol responding to the initial distress call intercepted the raiding party near the edge of the Grasmere Cloud, and a bloody firefight ensued. The heavily damaged armored transport was the only pirate ship able to escape into the safety of the Grasmere Cloud. Its crew is believed to have perished in there before establishing contact with other Rift Captains in the area.</TEXT><PARA/><POP/></RDL>'''
3213 = '''<RDL><PUSH/><TEXT>The Corsair ship </TEXT><TRA italic="true"/><TEXT>Caraz</TEXT><TRA italic="false"/><TEXT>  was making a routine Artifact smuggling run from Cadiz to Trafalgar several weeks ago, but it never arrived. Several intercepted military comms. suggest that it was damaged by an Armed Forces patrol and pursued into the Grasmere Ice Cloud.</TEXT><PARA/><POP/></RDL>'''
3214 = '''<RDL><PUSH/><TEXT>The </TEXT><TRA italic="true"/><TEXT>San Vicente</TEXT><TRA italic="false"/><TEXT>  was making a Cardamine run from Cali to Larkspur when it was ambushed by an Armed Forces patrol in the West Leeds Smog Cloud. The cargo was recovered by the military, but it is possible that one of the larger pieces of debris still has some equipment attached.</TEXT><PARA/><POP/></RDL>'''
3215 = '''<RDL><PUSH/><TEXT>The Outcast ship </TEXT><TRA italic="true"/><TEXT>Lorenzo</TEXT><TRA italic="false"/><TEXT>  was making a Cardamine run from Cali to Mactan when it was caught by a military patrol in the LD-14 Asteroid Field. It turned further into the heart of the field to escape its pursuers and stumbled into an old radioactive pocket. The crew is presumed dead, but the ship is probably still intact. No one has retrieved the cargo yet due to the high radiation danger in the area.</TEXT><PARA/><POP/></RDL>'''
3216 = '''<RDL><PUSH/><TEXT>The Vespera Armed Forces Gunboat </TEXT><TRA italic="true"/><TEXT>Storm</TEXT><TRA italic="false"/><TEXT>  was pursuing the culprits responsible for the Founders Day Revolt of 752 when it blundered into a large booby trap laid by the fleeing rebels within the future Molly Gold Field. The number 2 fusion reactor was breached, resulting in a huge explosion that vaporized the ship instantly. Several of its nearby escorts were caught in the shock wave and destroyed as well. To this day their debris lies somewhere in the mined area, which is officially off limits to Armed Forces salvage crews.</TEXT><PARA/><POP/></RDL>'''
3217 = '''<RDL><PUSH/><TEXT>The </TEXT><TRA italic="true"/><TEXT>Scargill</TEXT><TRA italic="false"/><TEXT>  was participating on a Gold poaching run into the GS&amp;M Gold Field several weeks ago when it was caught by the company security patrol. They pursued the fleeing ship into the minefield, where it blew up. There may still be looted Gold in the cargo hold; the GS&amp;M patrol left it in place as a warning to other Mollys.</TEXT><PARA/><POP/></RDL>'''
3218 = '''<RDL><PUSH/><TEXT>Omega-5 is the site of a full scale war between the Rift Captains and Hessians. The two factions are vying for control of this critical Jump Hole crossroads in the Omega Sector. Within the area of the no-man’s-land and the Hammen Hole are numerous dead ships from both sides. Most are picked clean, but there are some that may still yield some weapons.</TEXT><PARA/><POP/></RDL>'''
3219 = '''<RDL><PUSH/><TEXT>The Republican freight train </TEXT><TRA italic="true"/><TEXT>Bremerhaven</TEXT><TRA italic="false"/><TEXT>  was attempting to evade a Corsair attack along the Trade Lane when it blundered into the Furstenfelde gas pocket and was disabled. Attempts to rescue the crew and its cargo of Engine Components were unsuccessful. The drifting ship serves as a reminder of the dangers of venturing off the safe path in the Walker Nebula.</TEXT><PARA/><POP/></RDL>'''
3220 = '''<RDL><PUSH/><TEXT>A Red Hessian attack on the Kruger freighter </TEXT><TRA italic="true"/><TEXT>Monschau</TEXT><TRA italic="false"/><TEXT>  failed when the ship attempted to flee. Unfortunately, it flew straight into the Ebersfeld gas pocket that separates the IMG mining area and the Elbich Mining Facility. No one has yet dared to retrieve the cargo of Silver, as the risk of explosion is too high.</TEXT><PARA/><POP/></RDL>'''
3221 = '''<RDL><PUSH/><TEXT>The local word is that one of the early Corsair raiding parties into Omega-7 headed straight into the Gubenfelde gas pocket just south of the Omega-3 Gate. It is believed that the remains of at least three ships are still in there.</TEXT><PARA/><POP/></RDL>'''
3222 = '''<RDL><PUSH/><TEXT>The treacherous conditions created by the dying sun of Omega-11 has not discouraged many criminals, Bounty Hunters, or even Daumann employees from pushing their luck too far in search of instant riches. Out along the long Von Rohe Belt, unprotected from radiation, numerous dead ships lie floating in the void. Some of them may have Diamonds, most don’t. Many of the salvage expeditions that have been sent to retrieve the precious cargos have lingered too long and succumbed to the radiation themselves.</TEXT><PARA/><POP/></RDL>'''
3223 = '''<RDL><PUSH/><TEXT>The Kruger gas mining area was abandoned early in the 80-Years War, almost overnight. In their haste to depart, the Kruger personnel left several cargo pods intact. As far as anyone knows, they are still out there, scattered among the debris. The south oxygen pocket has since drifted over the site, making recovery a difficult proposition at best.</TEXT><PARA/><POP/></RDL>'''
3224 = '''<RDL><PUSH/><TEXT>Although the bulk of the Imperial Dornmark fleet was destroyed in the Battle of the Yanagi Cloud, the heavy cruiser </TEXT><TRA italic="true"/><TEXT>Kassel</TEXT><TRA italic="false"/><TEXT>  and its escorts survived the initial slaughter. They were not so lucky with the second GMG ambush at the edge of the north oxygen pocket. The remains have since drifted into the gas area, out of reach of the salvage crews.</TEXT><PARA/><POP/></RDL>'''
3225 = '''<RDL><PUSH/><TEXT>The great battlefield in Sigma-13 is the site of Dornmark’s most shameful defeat of the 80-Years War. The entire First Fleet was reduced to smoking hulks within several hours by the GMG. In the high radiation areas, the debris is relatively untouched to this day, but salvaging it is very dangerous and unpredictable.</TEXT><PARA/><POP/></RDL>'''
3226 = '''<RDL><PUSH/><TEXT>During the Relay Seven attack, a brief communication was received on Freeport 9 from a Bounty Hunter named Jim Adams. He had managed to make it into the Kunashir Cloud, but still had hostiles in hot pursuit. Most people figure he was trying to make it to the Jump Hole to Omicron Theta. He never made it here.</TEXT><PARA/><POP/></RDL>'''
3227 = '''<RDL><PUSH/><TEXT>The </TEXT><TRA italic="true"/><TEXT>Robert Fitzgerald</TEXT><TRA italic="false"/><TEXT>  was attacked by Ashbound shortly after it left Kurile with a load of Alien Organisms. A distress signal was picked up by the Atka base, but by the time fighters could scramble, the distressed ship had vanished into the mists of the Kunashir Cloud.</TEXT><PARA/><POP/></RDL>'''
3228 = '''<RDL><PUSH/><TEXT>Yesterday, the Corsair ship </TEXT><TRA italic="true"/><TEXT>Menorca</TEXT><TRA italic="false"/><TEXT>  was ambushed and destroyed by the Ashbound somewhere in the Gikka Dust Field. The Rift Captains have just begun the search for the wreckage. If you are lucky, you may be able to beat them to it and grab the Artifact load for yourself.</TEXT><PARA/><POP/></RDL>'''
3229 = '''<RDL><PUSH/><TEXT>One of the GMG’s best pilots left his patrol and pursued a fleeing Outcast fighter into the Donryu Cloud. The </TEXT><TRA italic="true"/><TEXT>Hien</TEXT><TRA italic="false"/><TEXT>  never returned. An Outcast ambush is suspected, but no one knows. He had some very good weapons aboard.</TEXT><PARA/><POP/></RDL>'''
3230 = '''<RDL><PUSH/><TEXT>Somewhere in the Sigma-19 Crow Nebula clouds, the Outcast ship </TEXT><TRA italic="true"/><TEXT>Perez</TEXT><TRA italic="false"/><TEXT>  was lost while making a drug run from Ruiz to Yanagi. Suspicions are that it was the work of the GMG, but no one is certain.</TEXT><PARA/><POP/></RDL>'''
3231 = '''<RDL><PUSH/><TEXT>One of many Bounty Hunters flying out of Freeport 6 in search of Ashbound, Ryan McKeen, was an incautious type who tended to exhibit more bravado than common sense. His ship, the </TEXT><TRA italic="true"/><TEXT>Wolverine</TEXT><TRA italic="false"/><TEXT>, is floating somewhere near Cali, a message left by the Ashbound to not get too close.</TEXT><PARA/><POP/></RDL>'''
3232 = '''<RDL><PUSH/><TEXT>The </TEXT><TRA italic="true"/><TEXT>Edward Marshall</TEXT><TRA italic="false"/><TEXT>  was bringing a load of Niobium back to base from the mining area when the ship was approached by an Outcast patrol. They surrendered and were boarded by the pirates, who mercilessly jettisoned the crew into space. A BMM patrol was scrambled from the Tau-31 Gate and managed to destroy the ship in the minefield before it reached Cali.</TEXT><PARA/><POP/></RDL>'''
3233 = '''<RDL><PUSH/><TEXT>The </TEXT><TRA italic="true"/><TEXT>Whetstone</TEXT><TRA italic="false"/><TEXT>  never completed its scheduled run from Holman to the Tau-31 Gate construction site. The cargo of Construction Machinery is likely still intact — not valuable enough to the Ashbound to haul away. It most likely lies somewhere in the system’s northwest quadrant.</TEXT><PARA/><POP/></RDL>'''
3234 = '''<RDL><PUSH/><TEXT>A Gaian attack was broken up the other day by the Vespera Armed Forces north of Harris. Most of the Gaians were vaporized on the spot, but the </TEXT><TRA italic="true"/><TEXT>Valiant</TEXT><TRA italic="false"/><TEXT>, flown by Lucy Collins, escaped to the northwestern end of the system, in Outcast territory. No one has heard from her since.</TEXT><PARA/><POP/></RDL>'''
3235 = '''<RDL><PUSH/><TEXT>Jessica Stephenson was a former Vespera Police Authority prison guard who yearned for a more exciting life outside of the walls of Newgate. A quick study, she joined the Charter Guild and quickly rose through the ranks, eventually taking on the most challenging assignments the Guild had to offer in the Edge Worlds. She was based out of Freeport 10, which is a risky post for a Hunter given the dominating presence of the Ashbound in the area. It is said that they laid a trap for her in the Bermejo Cloud.</TEXT><PARA/><POP/></RDL>'''
3236 = '''<RDL><PUSH/><TEXT>The IMG freighter </TEXT><TRA italic="true"/><TEXT>Barossa</TEXT><TRA italic="false"/><TEXT>  is believed to have been ambushed by the Ashbound in the Malvinas Cloud while making a routine shipment of Niobium to Java.</TEXT><PARA/><POP/></RDL>'''
3237 = '''<RDL><PUSH/><TEXT>The legendary “T-Bob” Biggs was known as a cautious man, but he was willing to take big risks when necessary. Close to retiring, he had one of the best ships in the Guild. A certain Outcast pilot by the name of Juan Gonzalez had been implicated in a number of attacks within the Sigma-19 system. Biggs had a lot of reservations about taking the job, but the bounty was high. On that fateful day, he flew into the Donryu Cloud and was never heard from again. It is assumed that he finally met his match out there in Outcast territory, a fitting end for a Guild ace.</TEXT><PARA/><POP/></RDL>'''
3238 = '''<RDL><PUSH/><TEXT>An exploratory GMG expedition consisting of the </TEXT><TRA italic="true"/><TEXT>Hosho Maru</TEXT><TRA italic="false"/><TEXT>  and her two escorts was sent into Omicron Beta. The last communication from the three ships was garbled, but it appears that instead of finding H-Fuel, there were Alien Organisms for the taking. Soon after, a brief distress signal fragment suggests the convoy was being attacked by some unknown enemy. No further transmissions were received.</TEXT><PARA/><POP/></RDL>'''
3239 = '''<RDL><PUSH/><TEXT>Drifting just beyond the inner edge of the planetary fragment field, the </TEXT><TRA italic="true"/><TEXT>Independence</TEXT><TRA italic="false"/><TEXT>  was the part of the IMG’s failed effort to establish a Diamond mining operation in Omega-41. The debris has been left untouched for some time now, mostly due to its highly exposed location near the neutron star. It is rumored that there were Diamonds onboard, but no one is certain.</TEXT><PARA/><POP/></RDL>'''
3240 = '''<RDL><PUSH/><TEXT>The </TEXT><TRA italic="true"/><TEXT>Volsung</TEXT><TRA italic="false"/><TEXT>  was on a long-range recon mission into Omega-41 searching for Rift Captains when it was caught in one of the minefields. The pilot succumbed to the intense radiation emitted by the system’s neutron star before a rescue ship could reach him. His ship was rumored to have a specially modified Hessian gun.</TEXT><PARA/><POP/></RDL>'''
3241 = '''<RDL><PUSH/><TEXT>Jesse Casas was truly an original. Captured as a young Corsair on his first mission to the inner house systems, he spent years imprisoned in Vierlande. He eventually renounced his Corsair vows and joined the Charter Guild. Flying the </TEXT><TRA italic="true"/><TEXT>Rebel</TEXT><TRA italic="false"/><TEXT>, Casas used his intimate knowledge of the pirate ways to full tactical advantage. He finally met his demise somewhere in the Napo Cloud in 791.</TEXT><PARA/><POP/></RDL>'''
3242 = '''<RDL><PUSH/><TEXT>In 550 AS the Vesperan government chartered the exploratory/research ship </TEXT><TRA italic="true"/><TEXT>Fearless</TEXT><TRA italic="false"/><TEXT>  to explore the fringes of the mysterious edge nebula. After several years spent crossing the outer Omega systems, they discovered Omicron Theta and its sole planet, Pygar. Upon completing a brief survey of the planet and retrieving several strange Artifacts that were sent back by courier ship to Cambridge, they continued on into the mysterious clouds that traversed the eastern end of the system. The </TEXT><TRA italic="true"/><TEXT>Fearless</TEXT><TRA italic="false"/><TEXT>  was never seen again.</TEXT><PARA/><POP/></RDL>'''
3243 = '''<RDL><PUSH/><TEXT>The Ashbound consider the Siniestre Nube a sacred place for several reasons. Early explorers discovered a Jump Hole within the depths of the cloud that led to a strange world of ringed stars and strange craft. All ships in the burial ground are placed facing that Hole to honor the alien spirits.</TEXT><PARA/><POP/></RDL>'''
3244 = '''<RDL><PUSH/><TEXT>There is a legend that a secret Jump Hole lies at the center of the Graveyard of the Innocents in the Malvada Cloud. A young Corsair completing his adulthood initiation rites stumbled across it while trying to find his Artifact. He entered it and emerged in an uncharted system. Strange alien ships soon appeared in the distance, and he fled for his life back to known territory. Few people believe the story.</TEXT><PARA/><POP/></RDL>'''
3245 = '''<RDL><PUSH/><TEXT>Kelly Nielson was one of the top female Bounty Hunters in the Guild, always trying to prove herself to the guys. Because of this, she tended to take more extreme risks than most. After one of her flights in the Viking deep into the Outcast home system, she told of a mysterious debris field. Later, she returned and brought back a piece of metal that she claimed belonged to the long lost Perihelion. Eventually her luck ran out. The ship is most likely floating somewhere in Omicron Alpha.</TEXT><PARA/><POP/></RDL>'''
3246 = '''<RDL><PUSH/><TEXT>In the heart of the Siniestre Cloud is an intense radiation pocket of unknown origins. Over the centuries, this area — located midway between the Omicron Beta Hole and the planet Carinea — became the traditional burial grounds of great Outcast pilots. When a warrior dies, they are put in their ship with their most treasured weapons and set adrift in the zone, always facing towards the source of the spirits. But be careful, strange alien beings are said to guard this most sacred of Outcast places.</TEXT><PARA/><POP/></RDL>'''
3247 = '''<RDL><PUSH/><TEXT>“Lucky” Logan Conner was one tough nut, as anyone will tell you. He would take on an entire patrol of Rift Captains, picking them off one by one. Based out of Freeport 5 to be close to his favorite prey, he liked living life on the ragged edge. His luck finally ran out in 780, when he ventured too far from the safety of the Gredos Cloud in the Rift Captains home territory of Omicron Gamma. A mass of Rift Captains pursued him back into the nebula. It was rumored that they didn’t actually dispose of Conner on the spot, but merely disabled his ship and let him die a slow death by asphyxiation.</TEXT><PARA/><POP/></RDL>'''
3248 = '''<RDL><PUSH/><TEXT>The Malvada Nube serves as the key adult initiation ritual within the close families of the Rift Captains. Young pilots must fly a stripped ship into the cloud, find an Artifact, and return safely to Crete. Almost 30% never return. The radiation levels are high, and it is rumored that there are strange beings that guard the best areas. By tradition, a lost trainee’s ship and body are never recovered, just left as a reminder to future generations of failure’s cost.</TEXT><PARA/><POP/></RDL>'''
3249 = '''<RDL><PUSH/><TEXT>A Xeno patrol got too close to the Unioner base and was attacked a few days ago. Two ships fled back through the Jump Hole, but the third didn’t make it. The Unioners have little use for Xeno weapons, so they probably just left the ship carcass adrift out there in the Tanner Asteroid Belt.</TEXT><PARA/><POP/></RDL>'''
3250 = '''<RDL><PUSH/><TEXT>The transport </TEXT><TRA italic="true"/><TEXT>Bradley</TEXT><TRA italic="false"/><TEXT>  was attacked by Hackers in the Barrier Cloud in Magellan yesterday. It is believed that they towed it off the Trade Lane somewhere into the cloud to study the latest version more carefully.</TEXT><PARA/><POP/></RDL>'''
3251 = '''<RDL><PUSH/><TEXT>The </TEXT><TRA italic="true"/><TEXT>Edward Kane</TEXT><TRA italic="false"/><TEXT>  and its escorts were ambushed in the Roatan Ice Crystal Cloud several weeks ago, probably by Rogues or Lane Hackers. They commandeered the ship and flew it further into the cloud. Several Bounty Hunters happened upon the hijacked ship, and a fierce firefight ensued. Only one limped back to tell the tale. She said the ship was still out there in the cloud, abandoned and drifting with the field.</TEXT><PARA/><POP/></RDL>'''
3252 = '''<RDL><PUSH/><TEXT>A Universal large transport named the </TEXT><TRA italic="true"/><TEXT>McKinley</TEXT><TRA italic="false"/><TEXT>  was caught in the Dark Matter Storm of 784, which destroyed the old Trade Lane through the eastern part of the system. It was carrying a load of Superconductors.</TEXT><PARA/><POP/></RDL>'''
3253 = '''<RDL><PUSH/><TEXT>The </TEXT><TRA italic="true"/><TEXT>Kamakura Maru</TEXT><TRA italic="false"/><TEXT>, a Samura transport carrying a cargo of Niobium, was caught in the Dark Matter Storm of 784. The storm destroyed the old Trade Lane route through the eastern part of the system. The ship is believed to lie somewhere in the Matsuo Cloud.</TEXT><PARA/><POP/></RDL>'''
3254 = '''<RDL><PUSH/><TEXT>The Samura armored transport </TEXT><TRA italic="true"/><TEXT>Nikko Maru</TEXT><TRA italic="false"/><TEXT>  was carrying Luxury Goods from Whiteharbor to Sablecross when it was caught in the Dark Matter Storm of 784. It lies somewhere in the Matsuo Cloud along the abandoned Trade Lane.</TEXT><PARA/><POP/></RDL>'''
3255 = '''<RDL><PUSH/><TEXT>The Universal Shipping transport </TEXT><TRA italic="true"/><TEXT>Chesapeake</TEXT><TRA italic="false"/><TEXT>  was hijacked several months ago and flown into the Komatsu Cloud. It is rumored to still be there, serving as a Pharmaceuticals storage depot for the Lane Hackers and Rogues.</TEXT><PARA/><POP/></RDL>'''
3256 = '''<RDL><PUSH/><TEXT>The </TEXT><TRA italic="true"/><TEXT>Freespirit</TEXT><TRA italic="false"/><TEXT>  was beginning its regular Artifact run from Leiden to Rochester when it was ambushed by Bounty Hunters. It fled into the Reppu Cloud and disappeared. No one has been able to locate the ship for some time.</TEXT><PARA/><POP/></RDL>'''
3257 = '''<RDL><PUSH/><TEXT>The </TEXT><TRA italic="true"/><TEXT>Shibuya Maru</TEXT><TRA italic="false"/><TEXT>  was making a Cardamine shipment across the southern end of the Shikoku system when it was intercepted by a Bounty Hunter named Jake Rush. He swears that he opened fire and badly wounded the ship. He searched the cloud for some time, but never found the </TEXT><TRA italic="true"/><TEXT>Shibuya</TEXT><TRA italic="false"/><TEXT>. The word around Deshima is that it never made it to the Galileo system. It’s probably out there somewhere in the Keiun Cloud.</TEXT><PARA/><POP/></RDL>'''
3258 = '''<RDL><PUSH/><TEXT>The </TEXT><TRA italic="true"/><TEXT>Kobe Maru</TEXT><TRA italic="false"/><TEXT>  was making its weekly Artifact run across the Shikoku system when it was ambushed by the Jade Vow. The ship is presumed destroyed, and its whereabouts are unknown, although it’s been rumored to be drifting somewhere in the Shiun Cloud.</TEXT><PARA/><POP/></RDL>'''
3259 = '''<RDL><PUSH/><TEXT>The </TEXT><TRA italic="true"/><TEXT>Shoki</TEXT><TRA italic="false"/><TEXT>, part of a Blood Dragon raiding party in the Kyushu system, was intercepted and destroyed by the Orsena Naval Forces. Two of the three ships have been located and salvaged. The patrol leader’s ship, the </TEXT><TRA italic="true"/><TEXT>Shoki</TEXT><TRA italic="false"/><TEXT>                                </TEXT><TRA italic="true"/><TEXT>Nagumo</TEXT><TRA italic="false"/><TEXT>.</TEXT><PARA/><POP/></RDL>'''
3260 = '''<RDL><PUSH/><TEXT>The </TEXT><TRA italic="true"/><TEXT>Ohtori</TEXT><TRA italic="false"/><TEXT>  was escorting the </TEXT><TRA italic="true"/><TEXT>Yukari Maru</TEXT><TRA italic="false"/><TEXT>  from Cali to Ainu when it was ambushed by a Naval Forces patrol crossing Kyushu. The cargo ship fled to safety while its escort turned to fight the attackers to the death. There are rumors that the </TEXT><TRA italic="true"/><TEXT>Ohtori</TEXT><TRA italic="false"/><TEXT>  may be still intact somewhere in the Seiran Dust Cloud.</TEXT><PARA/><POP/></RDL>'''
3261 = '''<RDL><PUSH/><TEXT>The </TEXT><TRA italic="true"/><TEXT>Fugaku</TEXT><TRA italic="false"/><TEXT>  was lost in a raid on the Kansai Research Center within the Hiyo Cloud. The fighter became entangled in the mine field during the attack, and the pilot was killed. It eventually drifted off into the cloud. No one has seen it since.</TEXT><PARA/><POP/></RDL>'''
3262 = '''<RDL><PUSH/><TEXT>The GMG encountered a Corsair raiding party in the Chuyu Cloud a few days ago. They engaged and destroyed most of the fighters, but one heavily damaged ship escaped to the Hiryo Cloud. The GMG set up an ambush near the Sigma-13 Jump Hole, but the Corsair never arrived.</TEXT><PARA/><POP/></RDL>'''
3263 = '''<RDL><PUSH/><TEXT>The ship </TEXT><TRA italic="true"/><TEXT>Thomas Morrel</TEXT><TRA italic="false"/><TEXT>  was transporting Trade Lane Parts to the Chugoku Gate construction site. Shortly after crossing the Kyofu Gap, it was attacked by Jade Vow. The disabled </TEXT><TRA italic="true"/><TEXT>Morrel</TEXT><TRA italic="false"/><TEXT>  drifted into an area of the Unyo Cloud perilously close to the gap. Several of the containers were offloaded to smaller ships before a radiation storm forced the salvage crew to abandon the area. Upon their return, the ship had disappeared.</TEXT><PARA/><POP/></RDL>'''
3264 = '''<RDL><PUSH/><TEXT>Many Naval Forces fighters have been lost recently in skirmishes with the Jade Vow. Due to the low visibility and difficult conditions in the cloud, some weapons could still remain on the ships in some of the more remote locations.</TEXT><PARA/><POP/></RDL>'''
3265 = '''<RDL><PUSH/><TEXT>A Bounty Hunter named Harry Riggs went out after some Ashbound in the Badlands but never came back. He had some decent weapons on his ship.</TEXT><PARA/><POP/></RDL>'''
3266 = '''<RDL><PUSH/><TEXT>Helion Navy Patrol 27 flew into Badlands two weeks ago on their regular route, and then disappeared without a trace. An extensive search by authorities has not turned up anything so far. The patrol comprised three elite fighters.</TEXT><PARA/><POP/></RDL>'''
3267 = '''<RDL><PUSH/><TEXT>The </TEXT><TRA italic="true"/><TEXT>Flint</TEXT><TRA italic="false"/><TEXT>  didn’t make it from Buffalo to Rochester on a routine Cardamine smuggling run several weeks ago. There was no distress call, no reports of LPI or Navy interdiction heard on comms. It probably hit an asteroid somewhere in the western quadrant of the Badlands, off the regular patrol routes.</TEXT><PARA/><POP/></RDL>'''
3268 = '''<RDL><PUSH/><TEXT>A few days ago, the Outcast ship </TEXT><TRA italic="true"/><TEXT>Balboa</TEXT><TRA italic="false"/><TEXT>  was damaged by an LPI patrol that surprised it in the Tahoe Ice Cloud. It escaped its pursuers, but the failing control systems eventually caused it to hit an ice crystal and explode — at least that’s what they’ve been able to piece together from radar and the pilot’s last words. The wreckage was scattered and drifted over a large area. The Cardamine cargo remains missing, probably still in the hold of the ship.</TEXT><PARA/><POP/></RDL>'''
3269 = '''<RDL><PUSH/><TEXT>Not too long ago there was a prison break by some Rogues from a Sugarland work convoy in the East Dallas Debris Field. They fled into the Pequena Negra Cloud, pursued by a Bounty Hunter named Annie “Shorty” Davis. She flew a nice rig called the </TEXT><TRA italic="true"/><TEXT>Avenger</TEXT><TRA italic="false"/><TEXT>. The Rogues eventually doubled back and escaped through the California Hole. Annie must have gotten confused in there, or maybe her ship was damaged by some enemy fire. Either way, she never emerged from that dark cloud.</TEXT><PARA/><POP/></RDL>'''
3270 = '''<RDL><PUSH/><TEXT>In 521, the supply ship </TEXT><TRA italic="true"/><TEXT>Ft. Worth</TEXT><TRA italic="false"/><TEXT>  was approaching the Dallas Research Station from Houston when it was caught in the tremendous system-wide explosion that occurred during the failed Jump Gate experiment. The ship was far enough away from the initial blast that some people think it may still be floating out there in the Grande Negra Cloud. The </TEXT><TRA italic="true"/><TEXT>Ft. Worth</TEXT><TRA italic="false"/><TEXT>  was carrying a full load of Jump Gate Parts.</TEXT><PARA/><POP/></RDL>'''
3271 = '''<RDL><PUSH/><TEXT>Somewhere in the Grande Negra Cloud, the main complex of the Dallas Research Station is rumored to still have some relatively intact pieces. There was a lot of Superconductor research there, so some storage containers may still exist.</TEXT><PARA/><POP/></RDL>'''
3272 = '''<RDL><PUSH/><TEXT>The Rogue fighter </TEXT><TRA italic="true"/><TEXT>Prudhoe</TEXT><TRA italic="false"/><TEXT>  was making a Diamond run from Hudson to Beaumont when it was ambushed by a Xeno assault patrol. It fled into the Pequena Negra Cloud, with the Xenos in hot pursuit. No one has seen them since. People here figure they all died in there from the radiation.</TEXT><PARA/><POP/></RDL>'''
3273 = '''<RDL><PUSH/><TEXT>There are multiple dead ships floating in a radiation pocket of the Ruhrfeld. They are most likely Unioners, maybe a Red Hessian or two. Most of them have been stripped clean, but there may still be a few with one or two weapons left on them.</TEXT><PARA/><POP/></RDL>'''
3274 = '''<RDL><PUSH/><TEXT>The </TEXT><TRA italic="true"/><TEXT>Babylon</TEXT><TRA italic="false"/><TEXT>  was finishing a routine Luxury Goods run from Whiteharbor to Baden-Baden when it was attacked on the final leg by the LWB. The freighter feigned surrender, then made a run for it, but was cut off before reaching the planet. It then fled towards the southern end of the Ostnebel, with the LWB in hot pursuit. The </TEXT><TRA italic="true"/><TEXT>Babylon</TEXT><TRA italic="false"/><TEXT>  was never found.</TEXT><PARA/><POP/></RDL>'''
3275 = '''<RDL><PUSH/><TEXT>Several days ago, the </TEXT><TRA italic="true"/><TEXT>Belknap</TEXT><TRA italic="false"/><TEXT>  was traversing the Trade Lane from Stuttgart to the Berlin Gate when it was hijacked by LWB pirates. They flew the ship into the Ostnebel, where it is likely stationed for use as a temporary food supply.</TEXT><PARA/><POP/></RDL>'''
3276 = '''<RDL><PUSH/><TEXT>The </TEXT><TRA italic="true"/><TEXT>Nurnberg</TEXT><TRA italic="false"/><TEXT>  was making a gun run from here to Omega-11 when it was attacked by a Federal Police patrol while crossing the open area in the center of the system. The ship was pursued into the Westnebel, where it lost contact. Because it never arrived in Freital, the police must have destroyed it.</TEXT><PARA/><POP/></RDL>'''
3277 = '''<RDL><PUSH/><TEXT>Patrol 421 was doing a routine sweep of the Westnebel when it abruptly ceased communications with Ulm Control. Cinder Guard are suspected as the culprits, but no one is sure. The Federal Police have been unable to locate any debris so far.</TEXT><PARA/><POP/></RDL>'''
3278 = '''<RDL><PUSH/><TEXT>The </TEXT><TRA italic="true"/><TEXT>Danzig</TEXT><TRA italic="false"/><TEXT>  is a long lost Kruger freighter that strayed into the Giftnebel in 450 while returning from the Diamond fields. The cloud’s hostile conditions prevented any thorough search. Pieces of debris have been spotted drifting occasionally within the area, but no one has been able to determine if they are the remains of the </TEXT><TRA italic="true"/><TEXT>Danzig</TEXT><TRA italic="false"/><TEXT>.</TEXT><PARA/><POP/></RDL>'''
3769 = '''<RDL><PUSH/><TEXT>Synth Foods uses Roppongi as a transfer point between Deshima and Honshu. There’s a ship headed out there now. The Farmers Alliance will most likely be waiting.</TEXT><PARA/><POP/></RDL>'''
3770 = '''<RDL><PUSH/><TEXT>70% of the Sablecross population under the age of 30 prefers Synth Paste to Kyushu grown food. It is just a matter of time before the Farmers Alliance will be a moot point. There will be no market for Kyushu food outside of the planet.</TEXT><PARA/><POP/></RDL>'''
3771 = '''<RDL><PUSH/><TEXT>Synth Foods is certain that Samura funds the Farmers Alliance movement. The Orsena government has been unwilling so far to open an investigation, which is not surprising, given that many government officials are on Samura’s bribe list.</TEXT><PARA/><POP/></RDL>'''
3864 = '''<RDL><PUSH/><TEXT>Republican requested that a permanent contingent of Federal Police be stationed at Alster to deter Unioner attacks. This place happens to be located near the most active criminal asteroid field in Hamburg, so we’re kept busy.</TEXT><PARA/><POP/></RDL>'''
3865 = '''<RDL><PUSH/><TEXT>We’re put on full alert when the Vierlande prison convoy comes through. That’s when all the criminal activity in this system peaks. It’s a stressful time. Our patrol barely survived a Hessian attack launched from the Sudheime during last month’s run.</TEXT><PARA/><POP/></RDL>'''
3866 = '''<RDL><PUSH/><TEXT>The Federal Police runs daily patrols out into the Alsterfeld. You’ll see Bundschuh, Unioners, even the odd Junker. It’s a maximum activity area, as Hamburg Control puts it. We think there’s a Jump Hole in there somewhere, but the Bounty Hunters aren’t talking.</TEXT><PARA/><POP/></RDL>'''
3867 = '''<RDL><PUSH/><TEXT>The Junkers are running Cardamine and Artifacts through here. We’re almost directly astride their smuggling route, so it’s easy to scan them. It seems like some of them have been slipping through our net. It’s probably no accident that Heinrich suddenly got an unexpected windfall from a relative. At least that’s how he put it.</TEXT><PARA/><POP/></RDL>'''
3868 = '''<RDL><PUSH/><TEXT>There was a Unioner attack just last week. They came out of the Alsterfeld, heading straight for one of the freight trains in the dry docks. The base turrets laid down very heavy fire, but were not able to destroy all the enemy attack force. Two got through and released their torpedoes. The freight train </TEXT><TRA italic="true"/><TEXT>Eifel</TEXT><TRA italic="false"/><TEXT>  was heavily damaged.</TEXT><PARA/><POP/></RDL>'''
3869 = '''<RDL><PUSH/><TEXT>Hamburg has missed two paydays in a row. There’s been grumbling among the ranks. After all, we have to make a living. It’s awfully tempting to ambush some of those Hessian Diamond smugglers that pass by here and grab the loot for ourselves. No one would ever know.</TEXT><PARA/><POP/></RDL>'''
