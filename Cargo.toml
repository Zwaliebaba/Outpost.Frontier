[workspace]
resolver = "3"
members = [
    "apps/outpost-frontier",
    "apps/outpost-server",
    "crates/game-app",
    "crates/game-logic",
    "crates/game-sim",
    "crates/neuron-client",
    "crates/neuron-core",
    "crates/neuron-server",
    "xtask",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.100"
publish = false

[workspace.dependencies]
game-app = { path = "crates/game-app" }
game-logic = { path = "crates/game-logic" }
neuron-client = { path = "crates/neuron-client" }
neuron-core = { path = "crates/neuron-core" }
neuron-server = { path = "crates/neuron-server" }

# External crates. Each one needs an entry in design/decisions.md (T13).
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
md-5 = { version = "0.10", default-features = false }
parry3d = { version = "0.25.3", default-features = false, features = ["required-features", "std", "alloc"] }
proptest = { version = "1", default-features = false, features = ["std"] }
# MPEG Layer III decoding of the game's MP3-in-WAV sounds (P4.10).
symphonia = { version = "0.6.1", default-features = false, features = ["mp3"] }
toml = "0.9"
tracing = { version = "0.1", default-features = false, features = ["std"] }
# Direct3D 12, DXGI, the window, known-folder, registry and DPAPI FFI of
# neuron-client::platform (P4.1, P4.2).
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# The MP3 decoder is slow unoptimised; the data tests decode every shipped
# sound (P4.10).
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3

[profile.dev.package.symphonia-core]
opt-level = 3

[workspace.lints.rust]
# Unsafe code is denied everywhere. Only the modules listed in xtask's
# policy may allow it (design/decisions.md T14). Pure crates forbid it.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
# A finished work package contains no placeholder code.
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
