[workspace]
resolver = "3"
members = [
    "apps/outpost-frontier",
    "apps/outpost-server",
    "crates/game-app",
    "crates/game-logic",
    "crates/game-sim",
    "crates/lua32-compiler",
    "crates/neuron-client",
    "crates/neuron-core",
    "crates/neuron-server",
    "xtask",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.100"
publish = false

[workspace.dependencies]
game-app = { path = "crates/game-app" }
game-logic = { path = "crates/game-logic" }
game-sim = { path = "crates/game-sim" }
lua32-compiler = { path = "crates/lua32-compiler" }
neuron-client = { path = "crates/neuron-client" }
neuron-core = { path = "crates/neuron-core" }
neuron-server = { path = "crates/neuron-server" }

# External crates. Each one needs an entry in design/decisions.md (T13).
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
md-5 = { version = "0.10", default-features = false }
parry3d = { version = "0.25.3", default-features = false, features = ["required-features", "std", "alloc"] }
proptest = { version = "1", default-features = false, features = ["std"] }
# The dedicated server's platform services through safe wrappers (P3.9,
# decisions O42 and T14): the local time, the interrupt handler and the
# Documents folder.
ctrlc = { version = "3.5.3", default-features = false, features = ["termination"] }
dirs = { version = "7.0.0", default-features = false }
jiff = { version = "1.0.3", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
# The QUIC transport (P3.8, decisions O6, T16, T17): quinn on tokio's
# current-thread runtime, rustls with the ring provider, and rcgen for the
# server's self-signed certificate.
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring"] }
# MPEG Layer III decoding of the game's MP3-in-WAV sounds (P4.10).
symphonia = { version = "0.6.1", default-features = false, features = ["mp3"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "time"] }
toml = "0.9"
tracing = { version = "0.1", default-features = false, features = ["std"] }
# Direct3D 12, DXGI, the window, known-folder, registry and DPAPI FFI of
# neuron-client::platform (P4.1, P4.2); XAudio2, X3DAudio and COM
# initialisation (P4.10); the DirectWrite font backend (P4.12); the machine
# queries of a new install's account and the memory figures (P4.1).
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_XAudio2",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# The MP3 decoder is slow unoptimised; the data tests decode every shipped
# sound (P4.10).
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3

[profile.dev.package.symphonia-core]
opt-level = 3

# The simulation is slow unoptimised: a debug server with Content's NPC
# population (P3.6d) falls behind its frames, each longer frame steps more
# and the run never catches up (Gate G3's scripted client). Rust contracts
# no float operations, so the results do not change (decision O51).
[profile.dev.package.neuron-core]
opt-level = 2

[profile.dev.package.game-sim]
opt-level = 2

[workspace.lints.rust]
# Unsafe code is denied everywhere. Only the modules listed in xtask's
# policy may allow it (design/decisions.md T14). Pure crates forbid it.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
# A finished work package contains no placeholder code.
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
