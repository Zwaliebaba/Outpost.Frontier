name: Rust CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare Rust
        run: rustup toolchain install
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --locked --workspace --all-targets
      - name: Build executables
        run: cargo build --locked --release --workspace --bins

  host:
    # Everything outside the Windows platform modules must build and test on
    # any host (design/migration-plan.md section 7).
    name: Linux host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare Rust
        run: rustup toolchain install
      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-targets --target host-tuple -- -D warnings
      - name: Test workspace
        run: cargo test --locked --workspace --all-targets --target host-tuple

  policy:
    name: Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare Rust
        run: rustup toolchain install
      - name: Check crate graph, legacy APIs and unsafe placement
        run: cargo xtask check-policy
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Check dependencies
        run: cargo deny check
