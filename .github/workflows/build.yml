name: Build

# Debug|x64 and Release|x64, since 2026-08-19 (ADR-018 D11).
#
# Release was deliberately not built while the tree was young -- a second
# configuration doubles CI time to catch little that Debug does not. The
# universe phase is what changed the calculation, and it changed it three ways:
# acceptance criteria are now perf-gated (R17's parse threshold triggers a
# *structural* content split, U5 has a frame budget, ADR-018 D1c gives the tick
# one), and a number measured in Debug is 5-20x away from the number that
# decides those; a shard ships Release binaries (ADR-018 D1); and the shader
# build had forked per configuration without anyone deciding it, so the Release
# path had never once been compiled.
#
# The source-level guards run on the Debug leg only: they read source, not
# object code, so running them twice would only make the log longer.
#
# The Debug leg is currently NON-BLOCKING (see `continue-on-error` below) while
# R22 is open, so a green run on this workflow certifies Release only. That is a
# temporary, deliberate, and loudly-announced reduction in coverage, not a
# silenced failure.

on:
  push:
    branches: ['**']
  workflow_dispatch:

# One run per branch. Added after four runs of the same branch sat in progress
# simultaneously -- each holding a Windows runner on the hung Debug test step
# (R22) -- and starved the run that was carrying the instrument meant to
# diagnose it. Superseding is right regardless of the hang: a push makes the
# run below it uninteresting, and the queue is shared.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.configuration }}|x64
    # NOT pinned, and that is a known gap rather than an oversight: ADR-018 D11
    # asks for a pinned image, and the projects are on PlatformToolset v145,
    # which only the newest images carry -- pinning to the wrong one would trade
    # a floating toolchain for a broken build. The "Record the toolchain" step
    # below prints what the runner actually provided, so the day an image bump
    # changes the compiler it shows up as a diff in the summary rather than as a
    # mystery. Pin this the first time that log says something new.
    runs-on: windows-latest

    # The Debug leg does not gate the run, by owner decision (2026-08-19), until
    # R22's intermittent Debug test hang is root-caused -- that needs a Windows
    # machine and the hang dump, which CI cannot supply. This is a deliberate and
    # temporary reduction in what a green run means: **green currently certifies
    # Release only**. It is not a way of hiding the failure -- the Debug leg still
    # builds, still runs, still uploads its dump, and the last step of this job
    # writes an unmissable banner into the summary when it fails.
    #
    # Remove this line the day R22 closes. If it is still here and R22 is closed,
    # that is a bug in someone's discipline, not in the build.
    continue-on-error: ${{ matrix.configuration == 'Debug' }}

    # A hang must cost 45 minutes, not the 6-hour default. Added when the Debug
    # leg was found stuck in `Run tests` for over 100 minutes on a docs-only
    # commit -- a pre-existing hang the Release leg exposed by contrast, since
    # Release runs the same four suites in seconds (see the WER step below).
    timeout-minutes: 45

    strategy:
      # Both legs always run: a Release failure is information about Release,
      # and it must not hide whether Debug is green.
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # What the floating image actually gave us. This is the visible half of
      # ADR-018 D11's pinning decision (see the runs-on comment).
      - name: Record the toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -format json | ConvertFrom-Json
          $lines = @(
            "- image: $env:ImageOS ($env:ImageVersion)",
            "- visual studio: $($vs.installationVersion) ($($vs.displayName))",
            "- msbuild: $((msbuild -version -nologo | Select-Object -Last 1).Trim())"
          )
          $dxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter dxc.exe -ErrorAction SilentlyContinue |
            Sort-Object FullName | Select-Object -Last 1
          if ($dxc) { $lines += "- dxc: $($dxc.FullName)" } else { $lines += '- dxc: not found on PATH roots' }
          $lines | ForEach-Object { Write-Host $_ }
          (@("## Toolchain (${{ matrix.configuration }})") + $lines) | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      # `ASSERT`/`DEBUG_ASSERT` end in `__debugbreak()` (NeuronCore/Debug.h:41,
      # 48), and `DEBUG_ASSERT` is `__noop` in Release (:62). So an assertion
      # that fires under test is a Debug-only event, and on a runner with no
      # debugger the breakpoint exception reaches Windows Error Reporting, whose
      # default behaviour is to sit there -- which is a hung job rather than a
      # failed one, and indistinguishable from a slow one. Turning the UI off
      # and disabling the queue makes the process die instead, so vstest reports
      # a crashed test and `/Blame` below names it.
      - name: Make a Debug assertion fail the job instead of hanging it
        shell: pwsh
        run: |
          $wer = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting'
          New-Item -Path $wer -Force | Out-Null
          Set-ItemProperty -Path $wer -Name DontShowUI -Value 1 -Type DWord
          Set-ItemProperty -Path $wer -Name Disabled -Value 1 -Type DWord
          Write-Host 'Windows Error Reporting UI disabled for this runner'

      # msquic and C++/WinRT arrive as NuGet packages. These are
      # packages.config projects, not PackageReference, so this is
      # `nuget install` per project rather than `msbuild -t:restore` -- and per
      # project rather than for the solution because CI builds the vcxproj
      # directly and Outpost.slnx is the new solution format, which the NuGet
      # CLI does not read. -OutputDirectory must match the ..\packages\ that
      # the vcxproj files import, or EnsureNuGetPackageBuildImports fails.
      #
      # The Tests projects have no packages.config and need nothing here.
      - name: Restore NuGet packages
        shell: pwsh
        run: |
          foreach ($p in 'NeuronCore', 'GameLogic', 'NeuronServer', 'NeuronClient', 'Outpost')
          {
            nuget install "$p\packages.config" -OutputDirectory packages -NonInteractive
            if ($LASTEXITCODE -ne 0) { throw "restore failed for $p" }
          }

      # A header whose name matches a CRT or C++ standard header shadows it on a
      # case-insensitive filesystem, because every project folder is on the
      # include path. NeuronCore/Time.h did exactly this: <ctime> found it
      # instead of <time.h> and every time symbol vanished from the global
      # namespace, 24 errors deep inside the STL with nothing pointing at us.
      # Cheap to check, miserable to diagnose.
      - name: Check header names against the CRT
        if: matrix.configuration == 'Debug'
        shell: pwsh
        run: |
          $reserved = @('assert','ctype','errno','fenv','float','inttypes','iso646','limits','locale','math',
                        'setjmp','signal','stdalign','stdarg','stdatomic','stdbool','stddef','stdint','stdio',
                        'stdlib','stdnoreturn','string','tgmath','threads','time','uchar','wchar','wctype',
                        'complex','new','memory','vector','string_view','span','bit','chrono','thread','mutex')
          $bad = @()
          # Derived from the tree, not spelled here (ADR-018 A24): a project
          # added by a later slice is guarded the day its folder appears.
          $projects = Get-ChildItem -Directory | Where-Object { Test-Path "$($_.Name)/$($_.Name).vcxproj" } | ForEach-Object { $_.Name }
          Write-Host "guarding $($projects.Count) projects: $($projects -join ', ')"
          foreach ($dir in $projects)
          {
            Get-ChildItem -Path $dir -Filter *.h -ErrorAction SilentlyContinue | ForEach-Object {
              if ($reserved -contains $_.BaseName.ToLower()) { $bad += "$dir/$($_.Name)" }
            }
          }
          if ($bad.Count -gt 0)
          {
            $bad | ForEach-Object { Write-Host "::error::$_ shadows a standard header of the same name" }
            throw 'rename these headers'
          }
          Write-Host 'no header shadows a standard header'

      # The other half of R14, and the half that had no mechanical check until
      # now. Every project folder is on the include path and includes are
      # unqualified (ADR-013 §4), so two files sharing a name across projects
      # resolve to whichever root the compiler reaches first -- silently, and
      # differently depending on which project is building. ADR-013 §3's registry
      # is the discipline; this is the check.
      - name: Check file names are unique repo-wide
        if: matrix.configuration == 'Debug'
        shell: pwsh
        run: |
          $seen = @{}
          $bad = @()
          $projects = Get-ChildItem -Directory | Where-Object { Test-Path "$($_.Name)/$($_.Name).vcxproj" } | ForEach-Object { $_.Name }
          foreach ($dir in ($projects + 'Tests'))
          {
            Get-ChildItem -Path $dir -Include *.h, *.cpp -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
              # pch.h/pch.cpp sit at every project root by design (ADR-013 §1)
              # and are never included across a project boundary.
              if ($_.Name -eq 'pch.h' -or $_.Name -eq 'pch.cpp') { return }

              $key = $_.Name.ToLower()
              $path = Resolve-Path -Relative $_.FullName
              if ($seen.ContainsKey($key)) { $bad += "$path collides with $($seen[$key])" }
              else { $seen[$key] = $path }
            }
          }
          if ($bad.Count -gt 0)
          {
            $bad | ForEach-Object { Write-Host "::error::$_" }
            throw 'file names must be unique repo-wide (ADR-013 §3)'
          }
          Write-Host "$($seen.Count) file names, all unique"

      # ADR-013 §3 one level down. The rule makes *file* names unique repo-wide
      # because every project root is on the include path; the same argument
      # applies to a namespace-scope constant, and `Neuron::INVALID_ENTITY_ID`
      # proved it -- NeuronCore declared it u16, NeuronClient declared it u32,
      # and every translation unit that saw both failed with C2371. The file
      # check could not see it because the two files have different names.
      - name: Check the engine declares no constant twice
        if: matrix.configuration == 'Debug'
        shell: pwsh
        run: |
          $seen = @{}
          $bad = @()
          # "Engine project" is a property of the name, so the tree can be asked
          # rather than told (ADR-018 A24): a fourth Neuron* library is guarded
          # the day it lands.
          $engine = Get-ChildItem -Directory -Filter 'Neuron*' | Where-Object { Test-Path "$($_.Name)/$($_.Name).vcxproj" } | ForEach-Object { $_.Name }
          foreach ($dir in $engine)
          {
            Get-ChildItem -Path $dir -Filter *.h -ErrorAction SilentlyContinue | ForEach-Object {
              $file = $_.Name
              $number = 0
              foreach ($line in Get-Content $_.FullName)
              {
                $number++
                # Namespace scope only: indented ones are class members, which
                # are scoped by their class and may repeat freely.
                if ($line -match '^\s{0,2}inline\s+constexpr\s+[\w:<>,\s\*&]+?\b(\w+)\s*(=|\{)')
                {
                  $name = $Matches[1]
                  $where = "${file}:${number}"
                  if ($seen.ContainsKey($name)) { $bad += "$name at $where also at $($seen[$name])" }
                  else { $seen[$name] = $where }
                }
              }
            }
          }
          if ($bad.Count -gt 0)
          {
            $bad | ForEach-Object { Write-Host "::error::$_" }
            throw 'two engine headers declare the same constant (ADR-013 §3)'
          }
          Write-Host "$($seen.Count) namespace-scope constants, all declared once"

      # ADR-014: Neuron is a two-game engine, and the sibling repository ships
      # these same libraries around a different game. The moment an engine
      # project references GameLogic it stops being an engine and becomes this
      # game's client. That is a property nobody can hold in their head across
      # a year of slices, so the build holds it instead.
      - name: Check that only Outpost references GameLogic
        if: matrix.configuration == 'Debug'
        shell: pwsh
        run: |
          $bad = @()
          $engine = Get-ChildItem -Directory -Filter 'Neuron*' | Where-Object { Test-Path "$($_.Name)/$($_.Name).vcxproj" } | ForEach-Object { $_.Name }
          foreach ($project in $engine)
          {
            $file = "$project/$project.vcxproj"
            if ((Get-Content $file -Raw) -match 'GameLogic') { $bad += $file }
          }
          # The test projects too: a test that links GameLogic to drive an
          # engine library proves the opposite of what the seam suite claims.
          # Derived the same way, so an engine suite added later is covered.
          $engineTests = Get-ChildItem -Path Tests -Directory -Filter 'Neuron*' |
            Where-Object { Test-Path "Tests/$($_.Name)/$($_.Name).vcxproj" } | ForEach-Object { $_.Name }
          Write-Host "guarding $($engine.Count) engine projects and $($engineTests.Count) engine test projects"
          foreach ($project in $engineTests)
          {
            $file = "Tests/$project/$project.vcxproj"
            if ((Get-Content $file -Raw) -match 'GameLogic') { $bad += $file }
          }
          # Source, not just project files: an include would fail to compile
          # without the reference, but it is worth naming the real mistake.
          # The header list is derived from the tree rather than hand-spelled,
          # so a GameLogic header added by a later slice is covered the day it
          # lands (ADR-018 A24) -- pch.h is excluded because every project has
          # one and the name says nothing about the game.
          $gameHeaders = Get-ChildItem -Path GameLogic -Filter *.h |
            Where-Object { $_.Name -ne 'pch.h' } |
            ForEach-Object { [regex]::Escape($_.BaseName) }
          $pattern = '#include\s*"(' + ($gameHeaders -join '|') + ')\.h"'
          Write-Host "guarding $($gameHeaders.Count) GameLogic headers"
          foreach ($dir in $engine)
          {
            Get-ChildItem -Path $dir -Include *.h, *.cpp -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
              if ((Get-Content $_.FullName -Raw) -match $pattern) { $bad += $_.FullName }
            }
          }
          if ($bad.Count -gt 0)
          {
            $bad | ForEach-Object { Write-Host "::error::$_ references GameLogic; only Outpost.exe may (ADR-014)" }
            throw 'the engine has grown a dependency on the game'
          }
          Write-Host 'the engine references no game'

      # ADR-005 §5: same-binary replay determinism is bought by construction,
      # and every one of these is a way to spend it by accident. The replay
      # suite would catch most of them eventually; this says which line did it.
      - name: Check GameLogic's determinism rules
        if: matrix.configuration == 'Debug'
        shell: pwsh
        run: |
          $bad = @()
          $sources = Get-ChildItem -Path GameLogic -Include *.h, *.cpp -Recurse -ErrorAction SilentlyContinue |
                     Where-Object { $_.Name -ne 'pch.h' -and $_.Name -ne 'pch.cpp' }

          foreach ($file in $sources)
          {
            $text = Get-Content $file.FullName -Raw

            # No clock. The tick index is the simulation's only clock (ADR-002 §1).
            if ($text -match '#include\s*[<"](chrono|ctime|time\.h)[>"]' -or $text -match '#include\s*"Clock\.h"' -or
                $text -match '\b(QueryPerformanceCounter|GetTickCount64|GetTickCount|GetSystemTime|std::chrono)\b')
            {
              $bad += "$($file.Name): reads a clock"
            }

            # No randomness but the seeded PCG32 carried in world state.
            if ($text -match '#include\s*[<"]random[>"]' -or
                $text -match '\b(std::random_device|std::mt19937|std::minstd_rand|srand|::rand)\b' -or
                $text -match '[^_a-zA-Z]rand\s*\(')
            {
              $bad += "$($file.Name): uses a random source other than the seeded Pcg32"
            }

            # No DirectXMath estimate functions: their accuracy is documented as
            # instruction-set dependent, so one of these silently makes replays
            # per-machine rather than per-build (ADR-010 §6).
            if ($text -match '\bXM\w*Est\s*\(')
            {
              $bad += "$($file.Name): calls an XM*Est estimate function"
            }
          }

          # ADR-009 §2: universe coordinates are exact int64 metres and belong to
          # placement, not to per-tick math. The tick runs in local float metres.
          #
          # Stated as an exclusion rather than a list (ADR-018 A24): every
          # GameLogic file is per-tick code unless its job *is* the universe, so
          # a file added by U1 or T1 is guarded the day it lands instead of on
          # the day someone remembers to extend a list here.
          #
          # Two names, two exclusions, because they are two different rules.
          # `UniversePos` is the *coordinate*, and nothing outside the universe
          # files may touch one -- that is the arithmetic ADR-009 §2 is about,
          # and it has no exceptions. `UniverseDef` is the *content*, and one
          # file outside the universe legitimately reads it: the registry, whose
          # whole job is turning anchors into worlds (U2). It looks an anchor up
          # and never does math on a position, which is why it appears in the
          # second list and not the first.
          $posOwned = @('Universe.h', 'Universe.cpp', 'UniverseParse.h', 'UniverseParse.cpp', 'UniverseGen.h', 'UniverseGen.cpp')
          $defOwned = $posOwned + @('WorldRegistry.h', 'WorldRegistry.cpp')
          $guarded = Get-ChildItem -Path GameLogic -Include *.h, *.cpp -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -ne 'pch.h' -and $_.Name -ne 'pch.cpp' }
          Write-Host "guarding $($guarded.Count) GameLogic files against universe coordinates"
          foreach ($file in $guarded)
          {
            $text = Get-Content $file.FullName -Raw
            if ($file.Name -notin $posOwned -and $text -match '\bUniversePos\b')
            {
              $bad += "$($file.Name): universe coordinates in per-tick simulation code"
            }
            if ($file.Name -notin $defOwned -and $text -match '\bUniverseDef\b')
            {
              $bad += "$($file.Name): the universe definition in per-tick simulation code"
            }
          }

          if ($bad.Count -gt 0)
          {
            $bad | ForEach-Object { Write-Host "::error::$_" }
            throw 'GameLogic broke a determinism rule'
          }
          Write-Host 'GameLogic reads no clock, draws no unseeded randomness, and keeps the universe out of the tick'

      # AGENTS.md §1 names two rules its own .clang-tidy config cannot express,
      # and says a reviewer therefore has to carry them. This is that reviewer.
      #
      #   R2 - clang-tidy can require an absent prefix but cannot ban a present
      #        suffix, so `FooBase` and `FooImpl` slip past it entirely.
      #   R7 - nothing checks that a new file is PascalCase .h/.cpp, and nothing
      #        checks the .vcxproj *and* .filters entries that must accompany it.
      #        The first run of this step found AudioTests.cpp in the project and
      #        not in the filters, which is exactly the miss §8's checklist
      #        predicts and exactly the kind a person does not catch twice.
      - name: Check the naming rules clang-tidy cannot express
        if: matrix.configuration == 'Debug'
        shell: pwsh
        run: |
          # Vendored SDK code keeps its own spelling (AGENTS.md R4) and is not
          # ours to rename: d3dx12.h is Microsoft's D3D12 helper header, and
          # every CD3DX12_* type in it would fail R2 by design.
          $vendored = @('d3dx12.h')
          $pch = @('pch.h', 'pch.cpp')

          $projects = @(Get-ChildItem -Directory | Where-Object { Test-Path "$($_.Name)/$($_.Name).vcxproj" } | ForEach-Object { $_.Name })
          $projects += @(Get-ChildItem -Path Tests -Directory | Where-Object { Test-Path "Tests/$($_.Name)/$($_.Name).vcxproj" } |
                         ForEach-Object { "Tests/$($_.Name)" })

          $bad = @()
          $checked = 0
          foreach ($dir in $projects)
          {
            $leaf = Split-Path $dir -Leaf
            $projectFile = "$dir/$leaf.vcxproj"
            $projectText = Get-Content $projectFile -Raw
            $filtersFile = "$projectFile.filters"
            $filtersText = if (Test-Path $filtersFile) { Get-Content $filtersFile -Raw } else { $null }

            # -Include needs a wildcard path to work without -Recurse, and
            # recursing is wrong here: a project folder is flat by ADR-013 §1,
            # and Outpost/CompiledShaders holds generated headers that are
            # build output rather than source.
            $sources = @(Get-ChildItem -Path "$dir/*" -Include *.h, *.cpp -File)
            $sources += @(Get-ChildItem -Path "$dir/Shaders/*" -Include *.hlsl, *.hlsli -File -ErrorAction SilentlyContinue)
            foreach ($file in $sources)
            {
              if ($vendored -contains $file.Name) { continue }
              $checked++

              # R7: PascalCase, and registered in both places. Shaders live one
              # level down and are checked for registration only -- ADR-013 §1's
              # flat rule is about code, and the .hlsl set is its own tree.
              if (($pch -notcontains $file.Name) -and ($file.Extension -in @('.h', '.cpp')) -and
                  ($file.Name -cnotmatch '^[A-Z][A-Za-z0-9]*\.(h|cpp)$'))
              {
                $bad += "$dir/$($file.Name): file names are PascalCase .h/.cpp (AGENTS.md R7)"
              }
              # Anchored on the closing quote and on whatever precedes the
              # name, because a shader is listed as Shaders\UiVS.hlsl while a
              # source file is listed bare -- and matching the name alone would
              # let AudioTests.cpp be satisfied by an entry for something that
              # merely ends the same way.
              $listed = '["\\]' + [regex]::Escape($file.Name) + '"'
              if ($projectText -notmatch $listed)
              {
                $bad += "$dir/$($file.Name): not listed in $leaf.vcxproj (AGENTS.md §3)"
              }
              if ($null -ne $filtersText -and $filtersText -notmatch $listed)
              {
                $bad += "$dir/$($file.Name): not listed in $leaf.vcxproj.filters (AGENTS.md §3)"
              }

              # R2: no I/C/S/E prefix, no Base/Abstract/Impl suffix. A bare
              # `struct Impl;` is the pimpl idiom the corpus sanctions and is
              # not a suffix on anything, so the pattern requires a name before
              # it. C++ only: HLSL has its own vocabulary.
              if ($file.Extension -notin @('.h', '.cpp')) { continue }
              $number = 0
              foreach ($line in Get-Content $file.FullName)
              {
                $number++
                if ($line -cmatch '\b(class|struct|using)\s+([ICSE][A-Z]\w*)')
                {
                  $bad += "$dir/$($file.Name):${number}: $($Matches[2]) carries a type prefix (AGENTS.md R2)"
                }
                if ($line -cmatch '\b(class|struct|using)\s+(\w+(Base|Abstract|Impl))\b')
                {
                  $bad += "$dir/$($file.Name):${number}: $($Matches[2]) carries a banned suffix (AGENTS.md R2)"
                }
              }
            }
          }

          if ($bad.Count -gt 0)
          {
            $bad | ForEach-Object { Write-Host "::error::$_" }
            throw 'the naming convention was broken (AGENTS.md §1)'
          }
          Write-Host "$checked files: names conform, and each is in its .vcxproj and .filters"

      # The clang-tidy step AGENTS.md §1 has anticipated since the first commit
      # ("Nothing runs either automatically yet. Until a CI step exists, §1 is
      # enforced by review"), and ADR-018 A24 asks for.
      #
      # It landed non-blocking, on the argument that this tree had never been
      # through clang-tidy on Windows and a gate over an unanswered question is
      # a gate that gets deleted the week it first fires. **The question is
      # answered and the `continue-on-error` is gone**, which is the promise
      # that step made to itself.
      #
      # The two runs it took are worth keeping. The first found something the
      # same sweep under clang-tidy 18 on Linux had not (the runner carries LLVM
      # 20.1.8): `ComputeUniverseHash` promising `noexcept` while allocating a
      # vector per entity list, which is `std::terminate` on `bad_alloc` on the
      # boot path that reads the biggest file this game owns. The second came
      # back clean in ~90 s. So the version spread is itself a finding -- "clean"
      # is always clean *under something* -- and it is the argument for running
      # this where it runs rather than where it was written.
      #
      # It still covers GameLogic only. Widening to the engine projects, which
      # reach D3D12, C++/WinRT, XAudio2 and msquic headers, is its own piece of
      # work and should land the same way: non-blocking until a run is clean.
      - name: Run clang-tidy
        if: matrix.configuration == 'Debug'
        shell: pwsh
        run: |
          # Findings arrive on stderr and clang-tidy exits non-zero on them
          # (WarningsAsErrors in .clang-tidy). Neither is an error *here* -- this
          # step's job is to collect them, not to trip over them -- so the
          # GitHub pwsh wrapper's stop-on-error default is stood down for the
          # duration and the step decides its own exit code at the end.
          $ErrorActionPreference = 'Continue'

          $candidates = @(
            "$env:ProgramFiles\LLVM\bin\clang-tidy.exe",
            "${env:ProgramFiles(x86)}\LLVM\bin\clang-tidy.exe"
          )
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          if ($vs) { $candidates += (Join-Path $vs 'VC\Tools\Llvm\x64\bin\clang-tidy.exe') }

          $tidy = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $tidy)
          {
            Write-Host '::warning::clang-tidy is not on this image -- §1 is still enforced by review'
            '## clang-tidy not available on the runner' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          Write-Host "using $tidy"
          Write-Host (& $tidy --version | Out-String)

          # The MSVC environment, so clang-cl finds the CRT and the Windows SDK.
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          cmd /c "`"$devcmd`" -arch=amd64 -host_arch=amd64 -no_logo && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { Set-Item -Path "env:$($Matches[1])" -Value $Matches[2] }
          }

          $findings = @()
          foreach ($file in Get-ChildItem -Path GameLogic -Filter *.cpp -File | Where-Object { $_.Name -ne 'pch.cpp' })
          {
            $output = & $tidy --quiet $file.FullName -- --driver-mode=cl /std:c++latest /EHsc /D_DEBUG /DWIN32 /D_WINDOWS `
                        "/I$($PWD.Path)\GameLogic" "/I$($PWD.Path)\NeuronCore" 2>&1
            $findings += @($output | Where-Object { $_ -match ': (warning|error): ' })
          }

          if ($findings.Count -eq 0)
          {
            Write-Host 'clang-tidy: GameLogic is clean'
            exit 0
          }

          $findings | ForEach-Object { Write-Host "::error::$_" }
          $lines = @("## clang-tidy: $($findings.Count) finding(s) in GameLogic", '```') +
                   ($findings | Select-Object -First 40) + @('```')
          $lines | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          throw "clang-tidy found $($findings.Count) finding(s) in GameLogic (AGENTS.md §1)"

      # ADR-018 A24 / review finding CPP-4. Nine projects each carried an
      # identical copy of the toolset and the language switches, and the two
      # settings the determinism story actually rests on -- /fp:precise and the
      # absence of /arch -- were not written anywhere at all: they were MSVC
      # defaults that the documents described as though they had been chosen.
      #
      # The two property sheets are now the only place they are spelled, and
      # this is what keeps them there. It matters more than the usual guard
      # because Visual Studio rewrites project files on its own -- it did
      # exactly that to Outpost.vcxproj.filters during the shader move -- so
      # "we removed the duplicates once" is not a state that survives without a
      # check. A project that re-grows one of these lines fails here, naming it.
      - name: Check the build invariants are centralised
        if: matrix.configuration == 'Debug'
        shell: pwsh
        run: |
          $bad = @()

          # The sheets exist and still say what the projects rely on them saying.
          $required = @{
            'Outpost.Toolset.props' = @('PlatformToolset')
            'Outpost.Compile.props' = @('LanguageStandard', 'ConformanceMode', 'FloatingPointModel', 'EnableEnhancedInstructionSet')
          }
          foreach ($sheet in $required.Keys)
          {
            if (-not (Test-Path $sheet)) { $bad += "$sheet is missing"; continue }
            $text = Get-Content $sheet -Raw
            foreach ($setting in $required[$sheet])
            {
              if ($text -notmatch "<$setting>") { $bad += "$sheet no longer sets $setting" }
            }
          }

          # Every project imports both, and spells neither.
          $centralised = @('PlatformToolset', 'LanguageStandard', 'ConformanceMode', 'FloatingPointModel', 'EnableEnhancedInstructionSet')
          $projects = @(Get-ChildItem -Directory | Where-Object { Test-Path "$($_.Name)/$($_.Name).vcxproj" } |
                        ForEach-Object { "$($_.Name)/$($_.Name).vcxproj" })
          $projects += @(Get-ChildItem -Path Tests -Directory | Where-Object { Test-Path "Tests/$($_.Name)/$($_.Name).vcxproj" } |
                         ForEach-Object { "Tests/$($_.Name)/$($_.Name).vcxproj" })
          Write-Host "checking $($projects.Count) projects"

          foreach ($project in $projects)
          {
            $text = Get-Content $project -Raw
            foreach ($sheet in 'Outpost.Toolset.props', 'Outpost.Compile.props')
            {
              if ($text -notmatch [regex]::Escape($sheet)) { $bad += "$project does not import $sheet" }
            }
            foreach ($setting in $centralised)
            {
              if ($text -match "<$setting>")
              {
                $bad += "$project spells <$setting> itself; it belongs to the property sheet"
              }
            }
          }

          if ($bad.Count -gt 0)
          {
            $bad | ForEach-Object { Write-Host "::error::$_" }
            throw 'the build invariants have escaped their property sheets (ADR-018 A24)'
          }
          Write-Host 'toolset, language, conformance, /fp and /arch are stated once and imported everywhere'

      # SolutionDir is passed explicitly (trailing backslash required): each
      # project lists the libraries it includes as $(SolutionDir)<Project>,
      # and $(SolutionDir) is empty when a .vcxproj is built directly. The
      # NuGet CLI cannot read .slnx, which is why CI builds the projects
      # rather than the solution.
      #
      # /flp contains a semicolon, which PowerShell reads as a statement
      # separator unless the whole switch is quoted. Serial by design: with /m
      # the failing project's diagnostics can be interleaved away.
      - name: Build libraries
        shell: pwsh
        run: |
          foreach ($p in 'NeuronCore', 'GameLogic', 'NeuronServer', 'NeuronClient')
          {
            msbuild "$p\$p.vcxproj" `
              /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 /p:SolutionDir=$PWD\ `
              /v:normal /nologo "/flp:LogFile=build.log;Verbosity=diagnostic;Append"
            if ($LASTEXITCODE -ne 0) { throw "build failed for $p" }
          }

      # Outpost.exe is a Windows-subsystem application, so it cannot link until
      # it has an entry point -- today the project holds only pch.cpp and the
      # link fails with LNK2019 on WinMain. Rather than leave CI permanently
      # red (which teaches everyone to ignore it), the exe is built once an
      # entry point exists. Slice S1 adds Main.cpp and this starts building
      # itself, with no edit to this file.
      - name: Build Outpost
        shell: pwsh
        run: |
          $entry = Select-String -Path 'Outpost\*.cpp' -Pattern 'WinMain|\bmain\s*\(' -Quiet
          if (-not $entry)
          {
            Write-Host 'Outpost.exe: no entry point yet -- skipped (slice S1 adds Main.cpp)'
            "## Outpost.exe skipped - no entry point yet" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          Write-Host 'Outpost.exe: entry point found -- building'
          msbuild Outpost\Outpost.vcxproj `
            /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 /p:SolutionDir=$PWD\ `
            /v:normal /nologo "/flp:LogFile=build.log;Verbosity=diagnostic;Append"
          if ($LASTEXITCODE -ne 0) { throw 'build failed for Outpost' }

      # The test projects are not referenced by Outpost.exe, so they are built
      # separately. Appending to the same log keeps one artifact.
      - name: Build tests
        shell: pwsh
        run: |
          foreach ($t in 'NeuronCoreTests', 'GameLogicTests', 'NeuronServerTests', 'NeuronClientTests')
          {
            msbuild "Tests\$t\$t.vcxproj" `
              /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 /p:SolutionDir=$PWD\ `
              /v:normal /nologo "/flp:LogFile=build.log;Verbosity=diagnostic;Append"
            if ($LASTEXITCODE -ne 0) { throw "build failed for $t" }
          }

      # The other half of A24, and the half that checks the invariant where it
      # actually takes effect. The step above proves the switches are written in
      # one place; this proves they reached cl.exe, by reading them back off the
      # command lines MSBuild logged at diagnostic verbosity.
      #
      # Deliberately asymmetric about what it does with what it finds. Absence
      # of evidence is not failure: if a future MSBuild moves the command line
      # into a response file the log will stop carrying it, and a guard that
      # goes red over its own log format teaches everyone to ignore it. A
      # *contradiction* is failure: an /arch: or an /fp:fast on any command line
      # means a translation unit is being built outside ADR-005 §6's determinism
      # envelope, which is the defect this exists to catch and cannot be a log
      # format question.
      - name: Check the switches reached the compiler
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path build.log)) { Write-Host 'no build.log -- nothing to read'; exit 0 }

          # Scoped to lines that are compiler command lines, identified by the
          # switch the property sheet itself puts there. Searching the whole log
          # would be searching MSBuild's property dumps too, and a guard that
          # can fire on its own diagnostics is worse than no guard.
          $commandLines = @(Select-String -Path build.log -Pattern '/std:c\+\+latest' | ForEach-Object { $_.Line })
          Write-Host "$($commandLines.Count) compiler command line(s) carrying /std:c++latest"

          if ($commandLines.Count -eq 0)
          {
            Write-Host '::warning::build.log carries no compiler command lines -- the switches could not be read back here'
            exit 0
          }

          $precise    = @($commandLines | Where-Object { $_ -match '/fp:precise' }).Count
          $permissive = @($commandLines | Where-Object { $_ -match '/permissive-' }).Count
          $fast       = @($commandLines | Where-Object { $_ -match '/fp:fast' }).Count
          $arch       = @($commandLines | Where-Object { $_ -match '/arch:' }).Count
          Write-Host "/fp:precise $precise, /permissive- $permissive, /fp:fast $fast, /arch: $arch"

          $bad = @()
          if ($fast -gt 0) { $bad += "/fp:fast is on $fast compiler command line(s) - ADR-005 §6" }
          if ($arch -gt 0) { $bad += "/arch: is on $arch compiler command line(s) - ADR-005 §6" }
          if ($bad.Count -gt 0)
          {
            $bad | ForEach-Object { Write-Host "::error::$_" }
            throw 'a translation unit is being built outside the determinism envelope (ADR-018 A24)'
          }
          if ($precise -ne $commandLines.Count)
          {
            # A warning rather than a failure: the two counts disagreeing means
            # either the sheet missed a translation unit or a line matched that
            # is not a command line, and only a person reading the log can say
            # which. Guessing wrong in the strict direction reddens a leg that
            # gates on a log-format question, which is how a guard gets deleted.
            Write-Host "::warning::/fp:precise is on $precise of $($commandLines.Count) matched lines - worth a look"
          }
          else
          {
            Write-Host 'every command line carries /fp:precise and none carries /arch: or /fp:fast'
          }

      # Located through vswhere rather than assumed on PATH: vstest.console.exe
      # lives inside the VS install and its path carries the VS version.
      - name: Run tests
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $vstest = Join-Path $vs 'Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe'
          if (-not (Test-Path $vstest)) { throw "vstest.console.exe not found under $vs" }

          # Scoped to this leg's output directory: with two configurations built
          # in the same workspace on different jobs this is belt and braces, but
          # a stray assembly from the other configuration would be a confusing
          # way to go green.
          $dlls = Get-ChildItem -Recurse -Filter '*Tests.dll' |
            Where-Object { $_.FullName -notmatch '\\packages\\' -and $_.FullName -match '\\${{ matrix.configuration }}\\' } |
            Select-Object -ExpandProperty FullName
          if (-not $dlls) { throw 'no test assemblies were produced' }

          $dlls | ForEach-Object { Write-Host "testing $_" }

          # Captured as well as echoed: a failing assertion is the whole reason
          # this step exists, and it must not be something you have to scroll a
          # 1500-line log to find.
          # Blame with hang detection, because the job timeout is the wrong
          # instrument: it kills the runner and takes the evidence with it.
          # `TestTimeout` makes *vstest* give up on a test that has produced
          # nothing for five minutes, dump the hung process and name the test in
          # Sequence.xml -- so a hang becomes a normal red build with a culprit.
          # Five minutes is far above any honest Debug test here: the whole
          # Release suite finishes in seventeen seconds.
          #
          # Disabling Windows Error Reporting (step above) was the first attempt
          # and did not stop the hang, which is itself a finding: the Debug hang
          # is not an assertion reaching WER but something that waits -- a
          # deadlock or a socket that never returns, visible only at Debug
          # timing. This is the instrument that will say which.
          & $vstest $dlls /Platform:x64 /Blame:"CollectHangDump;TestTimeout=300000" `
            /Logger:console`;verbosity=normal 2>&1 |
            Tee-Object -FilePath test.log
          $failed = $LASTEXITCODE -ne 0

          if ($failed)
          {
            # A backtick-fenced here-string would be unreadable in PowerShell
            # (a fence needs six backticks inside a double-quoted string), so
            # the summary is assembled as lines and the fences are literals.
            $detail = Select-String -Path test.log -Pattern 'Failed\s+[A-Za-z]|Error Message|Assert failed|Stack Trace' -Context 0,3 |
              Select-Object -First 40 | ForEach-Object { $_.Line.Trim(); $_.Context.PostContext | ForEach-Object { '    ' + $_.Trim() } }
            $totals = Select-String -Path test.log -Pattern '^(Failed|Passed)!' | ForEach-Object { $_.Line.Trim() }

            Write-Host '--- failing tests ---'
            $detail | ForEach-Object { Write-Host $_ }

            $lines = @('## Tests failed (${{ matrix.configuration }})', '```') + $totals + @('') + $detail + @('```')
            $lines | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            throw 'tests failed'
          }

      # The S14 gate: the aggregated self test -- schema self-check, wire
      # round-trips, a replay-determinism run, and the whole handshake + order
      # + snapshot loop over a real QUIC loopback socket -- in the shipping
      # binary, on a runner with no GPU and no display. The exe reads its
      # config from the working directory (there is no command line, ADR-012),
      # so the step runs from a scratch directory whose Outpost.json turns the
      # self test on and points back at the repo's content.
      - name: Run the self test
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'x64\${{ matrix.configuration }}\Outpost.exe'
          if (-not (Test-Path $exe)) { throw 'Outpost.exe was not built' }

          New-Item -ItemType Directory -Force ci-selftest | Out-Null
          @'
          {
            "mode": "headless",
            "selfTest": true,
            "logging": { "level": "debug", "file": "Outpost.log" },
            "universe": { "definition": "../GameData/Universe/Frontier.json" }
          }
          '@ | Out-File -Encoding utf8 ci-selftest\Outpost.json

          # A Windows-subsystem exe detaches from the console, so wait on the
          # process object to get the real exit code.
          $p = Start-Process -FilePath $exe -WorkingDirectory ci-selftest -Wait -PassThru
          Write-Host "self test exit code: $($p.ExitCode)"

          if (Test-Path ci-selftest\Outpost.log)
          {
            Get-Content ci-selftest\Outpost.log | ForEach-Object { Write-Host $_ }
            Copy-Item ci-selftest\Outpost.log selftest.log
          }
          if ($p.ExitCode -ne 0)
          {
            $failures = Select-String -Path ci-selftest\Outpost.log -Pattern 'FAILED' -ErrorAction SilentlyContinue |
              ForEach-Object { $_.Line.Trim() }
            $lines = @('## Self test failed (${{ matrix.configuration }})', '```') + $failures + @('```')
            $lines | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            throw "self test failed with exit code $($p.ExitCode)"
          }

      # Spike 2's raw material (Risk Register, standing spikes). The self test
      # logs the replay hash it computed; this lifts it out so the comparison
      # job can put the two configurations side by side. ADR-005 §6 scopes
      # determinism to one binary, so the two are *expected* to differ -- the
      # point of recording it is that nobody mistakes that for a defect later.
      - name: Extract the replay hash
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path selftest.log)) { Write-Host 'no selftest.log -- nothing to extract'; exit 0 }
          $line = Select-String -Path selftest.log -Pattern 'replay hash ([0-9a-f]{16}) \(checkpoint ([0-9a-f]{16})\)' |
            Select-Object -First 1
          if (-not $line) { Write-Host 'no replay-hash line in selftest.log'; exit 0 }
          $final = $line.Matches[0].Groups[1].Value
          $checkpoint = $line.Matches[0].Groups[2].Value
          Write-Host "${{ matrix.configuration }}: final=$final checkpoint=$checkpoint"
          "${{ matrix.configuration }} $final $checkpoint" | Out-File -Encoding ascii "replay-hash-${{ matrix.configuration }}.txt"

      # R10's tick-budget soak (ADR-018 A4). The self test measures it; this
      # lifts the table into the run summary, because a number that only exists
      # inside a 1,500-line log is a number nobody re-reads -- which is exactly
      # how the hand-run figure this replaces went stale. D11 scopes the
      # acceptance figure to Release; the Debug row is printed beside it so the
      # ratio between the two configurations stays visible rather than becoming
      # folklore.
      - name: Record the tick soak
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path selftest.log)) { Write-Host 'no selftest.log -- nothing to record'; exit 0 }
          $rows = Select-String -Path selftest.log -Pattern 'soak (\d+) ships -- (\d+) ticks, mean ([0-9.]+) ms, worst ([0-9.]+) ms' |
            ForEach-Object {
              $g = $_.Matches[0].Groups
              [pscustomobject]@{ Ships = [int]$g[1].Value; Ticks = [int]$g[2].Value; Mean = [double]$g[3].Value; Worst = [double]$g[4].Value }
            }
          if (-not $rows) { Write-Host 'no soak rows in selftest.log'; exit 0 }

          $lines = @("## Tick soak (${{ matrix.configuration }}) - R10 / ADR-018 D1c", '',
                     '| ships | ticks | mean ms | worst ms | % of the 50 ms tick |', '|---|---|---|---|---|')
          foreach ($row in $rows)
          {
            $lines += ('| {0} | {1} | {2:N3} | {3:N3} | {4:N1} % |' -f $row.Ships, $row.Ticks, $row.Mean, $row.Worst, (100.0 * $row.Mean / 50.0))
            Write-Host ("soak {0} ships: mean {1} ms, worst {2} ms over {3} ticks" -f $row.Ships, $row.Mean, $row.Worst, $row.Ticks)
          }
          $capped = $rows | Where-Object { $_.Ships -eq 1024 } | Select-Object -First 1
          if ($capped)
          {
            $lines += ''
            $lines += ('A capped grid costs {0:N1} % of the tick, so {1:N1} of them fit one core at 20 Hz.' -f
                       (100.0 * $capped.Mean / 50.0), (50.0 / $capped.Mean))
          }
          $lines += ''
          $lines += 'Measured on a shared runner: read it as an order of magnitude, and as a trend across runs.'
          $lines | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      # R17's parse threshold (build order U1). The committed universe is 2,500
      # systems of JSON and the fallback if it costs about a second to read is a
      # structural per-region content split -- so the number belongs in the run
      # summary beside the tick soak, measured in the configuration D11 says
      # perf numbers mean, rather than in a note someone took once.
      - name: Record the universe parse
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path selftest.log)) { Write-Host 'no selftest.log -- nothing to record'; exit 0 }
          $line = Select-String -Path selftest.log -Pattern 'universe: read, parsed and hashed in (\d+) ms' | Select-Object -First 1
          if (-not $line) { Write-Host 'no universe timing in selftest.log'; exit 0 }
          $ms = [int]$line.Matches[0].Groups[1].Value
          Write-Host "universe parse+hash: $ms ms (${{ matrix.configuration }})"
          $verdict = if ($ms -lt 1000) { 'inside R17''s ~1000 ms threshold - no per-region content split is owed' }
                     else { '**over R17''s ~1000 ms threshold** - the per-region split is the designed fallback' }
          @("## Universe parse (${{ matrix.configuration }}) - R17", '', "Read, parsed and hashed in **$ms ms**: $verdict.") |
            Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Upload the replay hash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-hash-${{ matrix.configuration }}
          path: replay-hash-${{ matrix.configuration }}.txt
          if-no-files-found: ignore

      # MSBuild can exit non-zero with the failure only in the file log, so
      # surface it rather than leaving the job with no explanation.
      - name: Show failures from build log
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build.log)
          {
            Select-String -Path build.log -Pattern 'error |fatal error|Build FAILED|Error\(s\)|LNK' |
              Select-Object -Last 60 | ForEach-Object { $_.Line }
          }
          else { Write-Host 'no build.log produced' }

      # MSBuild repeats a warning once per referencing project, so the raw
      # count is misleading; these are deduplicated and repo-relative.
      - name: Summarise warnings
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path build.log)) { Write-Host 'no build.log produced'; exit 0 }
          $root = [regex]::Escape((Get-Location).Path + '\')
          $warnings = Select-String -Path build.log -Pattern ': warning [A-Z]+[0-9]+:' |
            ForEach-Object { $_.Line.Trim() -replace $root, '' -replace ' \[[^\]]*\.vcxproj\]$', '' } |
            Sort-Object -Unique
          $header = "## ${{ matrix.configuration }}|x64 - $($warnings.Count) unique warning(s)"
          Write-Host $header
          $header | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if ($warnings.Count -gt 0)
          {
            $shown = $warnings | Select-Object -First 200
            '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            $shown | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            if ($warnings.Count -gt 200)
            {
              "... and $($warnings.Count - 200) more" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            }
            '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            $shown | ForEach-Object { Write-Host $_ }
          }

      # continue-on-error makes the run green; it must not make the failure
      # quiet. Anyone reading the summary sees what did not pass and why it was
      # allowed through.
      - name: Say plainly that Debug failed and was not allowed to gate
        if: failure() && matrix.configuration == 'Debug'
        shell: pwsh
        run: |
          $lines = @(
            '## :warning: Debug|x64 FAILED - and did not fail the run',
            '',
            'The Debug leg is **non-blocking** by owner decision (2026-08-19) while',
            'Risk-Register **R22** is open: the Debug test run hangs intermittently, and',
            'root-causing it needs a Windows machine and the hang dump attached to this run.',
            '',
            '**A green tick on this run certifies Release only.** Debug coverage is not',
            'being reported. The dump and per-test blame output are in the',
            '`build-log-Debug-x64` artifact.',
            '',
            'When R22 closes, delete `continue-on-error` from the build job.'
          )
          $lines | ForEach-Object { Write-Host $_ }
          $lines | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Write-Host '::warning title=Debug leg failed (non-blocking, R22)::Green certifies Release only until R22 closes'

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.configuration }}-x64
          path: |
            build.log
            test.log
            selftest.log
            TestResults/**
          if-no-files-found: ignore

  # Standing spike 2: "confirm hashes *differ* across configs is acceptable and
  # documented (same-binary scope, ADR-005 §6) -- prevents a false alarm later."
  # It ran as a one-off nowhere for months because it needed a Release build
  # nobody had; now that both configurations exist it is a job, and it reports
  # rather than judges. Differing hashes are the expected result and are not a
  # failure; the failure this repo actually cares about -- a configuration
  # disagreeing with *itself* -- is asserted inside each self test.
  replay-hash-comparison:
    name: Spike 2 - replay hash across configurations
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - name: Download the hashes
        uses: actions/download-artifact@v4
        with:
          pattern: replay-hash-*
          merge-multiple: true

      - name: Compare
        shell: bash
        run: |
          shopt -s nullglob
          files=(replay-hash-*.txt)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no replay hashes were produced (both legs failed before the self test?)"
            echo "## Spike 2: no hashes produced" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          cat "${files[@]}"
          {
            echo "## Spike 2 - replay hash across configurations"
            echo
            echo '| configuration | final | checkpoint |'
            echo '|---|---|---|'
            awk '{ printf "| %s | `%s` | `%s` |\n", $1, $2, $3 }' "${files[@]}"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ${#files[@]} -lt 2 ]; then
            echo "only one configuration reported -- nothing to compare this run" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          distinct=$(awk '{ print $2 }' "${files[@]}" | sort -u | wc -l)
          if [ "$distinct" -eq 1 ]; then
            echo "Debug and Release agree. Allowed, not required: ADR-005 §6 scopes determinism to one binary, so this is a coincidence of codegen rather than a guarantee, and nothing should be built on it." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Debug and Release differ, which is the **expected** result: ADR-005 §6 buys same-binary replay determinism only, and deliberately does not pay for cross-build bit-exactness. Replays and world-hash goldens are per-build artifacts. This line exists so that a future run finding two different numbers is read as the design working rather than as a defect." >> "$GITHUB_STEP_SUMMARY"
          fi
