name: Rust CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare Rust
        run: rustup toolchain install
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --locked --workspace --all-targets
      - name: Build executables
        run: cargo build --locked --release --workspace --bins
      - name: Fetch the pinned shader compiler
        # Record 0004, point 16 as amended on 2026-11-19: dxc from the
        # Microsoft.Direct3D.DXC NuGet package, pinned by version and hash
        # (crates/neuron-client/shaders/README.md).
        shell: pwsh
        run: |
          $version = '1.9.2609.5'
          $sha256 = '73CFA082245918C2CC1EC6740250EB7377E83A757B3B3A3E16E0D71535BFBFC3'
          $package = Join-Path $env:RUNNER_TEMP 'dxc.zip'
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.dxc/$version/microsoft.direct3d.dxc.$version.nupkg" -OutFile $package
          $found = (Get-FileHash -Algorithm SHA256 $package).Hash
          if ($found -ne $sha256) { throw "dxc package hash $found, expected $sha256" }
          $dir = Join-Path $env:RUNNER_TEMP 'dxc'
          Expand-Archive -Path $package -DestinationPath $dir -Force
          "OUTPOST_DXC=$dir\build\native\bin\x64\dxc.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Check shaders
        # Record 0004, point 18: the committed blobs are what the sources
        # compile to with the pinned dxc.
        run: cargo xtask shaders --check

  host:
    # Everything outside the Windows platform modules must build and test on
    # any host (design/migration-plan.md section 7).
    name: Linux host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare Rust
        run: rustup toolchain install
      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-targets --target host-tuple -- -D warnings
      - name: Test workspace
        run: cargo test --locked --workspace --all-targets --target host-tuple
      - name: Check the synthetic render traces
        # Record 0004, point 15: the committed traces are what the generator writes.
        run: python3 crates/neuron-client/tests/fixtures/render/make_render_traces.py --check

  policy:
    name: Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare Rust
        run: rustup toolchain install
      - name: Check crate graph, legacy APIs and unsafe placement
        run: cargo xtask check-policy
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Check dependencies
        run: cargo deny check

  reference:
    # Builds the whole C++ reference solution (design/reference-build.md), so
    # changes to CppSource (decided exceptions and oracle instrumentation,
    # such as the P0.5 client mode and renderer trace) are compiled on every
    # push. Running the client needs the owner's machine. Removed with the C++
    # in P7.3.
    name: Reference build
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build the solution
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          & $msbuild CppSource\OutpostFrontier.sln /m /p:Configuration=Release /p:Platform=Win32 /v:minimal /nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check the generated P0.5 proxies
        # The +oracle IClient proxy and the P2.3 scenario oracle's IClient stub against
        # include/rpc_iclient.h, the RenderTrace forwarding code against
        # include/render/IRenderPipeline.h, and the call decoding of
        # Oracle.exe render-replay against RenderTrace's method table.
        shell: pwsh
        run: |
          python CppSource\OutpostFrontier\Client\make_oracle_iclient.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python CppSource\RenderTrace\make_render_trace.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python CppSource\Oracle\make_render_replay.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python CppSource\Oracle\SimClientStub\make_sim_client_stub.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  oracle:
    # Builds the C++ oracle harness (design/migration-plan.md P0.4) and checks
    # that it reproduces the committed vectors byte for byte. Tools\Oracle
    # also builds what its modes load at run time through project references:
    # x86math.dll, SceneRuntime.dll, particlefx.dll, SimClientStub.dll and
    # (P4.3, Oracle.exe render-replay) DX8RENDERER.dll. Removed with the C++
    # in P7.3.
    name: Oracle vectors
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build the oracle harness
        id: build
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          & $msbuild CppSource\OutpostFrontier.sln '/t:Tools\Oracle' /m /p:Configuration=Release /p:Platform=Win32 /v:minimal /nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the oracle harness
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force oracle-out | Out-Null
          & .\bin\Oracle.exe "$PWD\crates\neuron-core\tests\fixtures\oracle" "$PWD\oracle-out"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compare with the committed vectors
        # The harness writes the game-sim protocol suites (P2.2) to
        # oracle-out\game-sim; they are moved aside and compared with game-sim's
        # vectors in the next step.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force oracle-out-game-sim | Out-Null
          if (Test-Path oracle-out\game-sim) { Move-Item oracle-out\game-sim\* oracle-out-game-sim; Remove-Item oracle-out\game-sim }
          git diff --no-index --stat crates/neuron-core/tests/vectors oracle-out
          git diff --no-index crates/neuron-core/tests/vectors oracle-out
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Run the game-sim suites and compare
        # game-sim's vectors come from two runs: the protocol suites (P2.2)
        # from the main run above, moved into oracle-out-game-sim, and the
        # data suites (P2.1) from Oracle.exe game-sim on its own fixtures, so
        # that Common's string cache has seen nothing else. The directory is
        # compared once both have written.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force oracle-out-game-sim | Out-Null
          & .\bin\Oracle.exe game-sim "$PWD\crates\game-sim\tests\fixtures\oracle" "$PWD\oracle-out-game-sim"
          $code = $LASTEXITCODE
          Write-Host ("Oracle.exe game-sim exit code {0} (0x{0:x8})" -f $code)
          Get-ChildItem oracle-out-game-sim | ForEach-Object { "{0} {1} bytes" -f $_.Name, $_.Length }
          if ($code -ne 0) { exit 1 }
          git diff --no-index --stat crates/game-sim/tests/vectors oracle-out-game-sim
          git diff --no-index crates/game-sim/tests/vectors oracle-out-game-sim
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Run the GDI font metrics mode
        # P4.12 (oracle_gdi_fonts.cpp): GDI's text metrics on this runner for
        # crates/neuron-client/tests/fixtures/oracle/gdi_fonts.list, compared by
        # the next step once tests/vectors/gdi_fonts.jsonl is committed, and with
        # DirectWrite's by tests/gdi_font_metrics.rs. Until then it is printed.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force oracle-out-neuron-client | Out-Null
          & .\bin\Oracle.exe gdi-fonts "$PWD\crates\neuron-client\tests\fixtures\oracle" "$PWD\oracle-out-neuron-client"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path crates\neuron-client\tests\vectors\gdi_fonts.jsonl)) {
            Get-Content oracle-out-neuron-client\gdi_fonts.jsonl
            Remove-Item oracle-out-neuron-client\gdi_fonts.jsonl
          }
      - name: Run the neuron-client suites and compare
        # Work package P4.14: the scene-script Lua state through the reference's
        # own Lua 3.2 (CppSource/Oracle/oracle_scene_script.cpp); P4.12-P4.14:
        # the VC6 number texts and RDLX markup through MSXML (oracle_text.cpp);
        # P4.12: LayoutRichText and the list functions of Common.dll on a
        # recording text context (oracle_rich_text.cpp; rich_text.jsonl);
        # P4.10: SoundManager's software mixer (oracle_audio.cpp) and the client's sound
        # archetypes, play keys and sound tick (oracle_audio_client.cpp); P4.14: the engine
        # calls of the parser's second pass (oracle_scene_script_build.cpp); P4.14: param
        # curves, spline paths and playback (oracle_scene_script_runtime.cpp); P4.4: the
        # texture library at run time and ximage's BigImage (oracle_texture.cpp,
        # oracle_big_image.cpp); P4.5: the material regular expressions, library,
        # global records, animation and batcher of Shading (oracle_material.cpp), and
        # the 22 material kinds and BatchedMaterial against recording services
        # (oracle_material_kinds.cpp), surfacematerials' 19 materials
        # (oracle_material_surface.cpp) and FLAppearance (oracle_material_appearance.cpp;
        # material_*.jsonl); P4.6: RendComp's render
        # manager and mesh kinds against recording services (oracle_mesh_render.cpp,
        # compiled into oracle_mesh_data.cpp; mesh_render.jsonl, and the IMesh faces,
        # mesh_faces.jsonl); P4.7: Deformable2's
        # skinning, draw, instance slots, aim solving and EyeMaterial against recording
        # services (oracle_deformable.cpp, compiled into oracle_mesh_data_dfm.cpp;
        # deformable.jsonl); P4.8: particlefx's
        # ramp evaluation, simulation and draws, its sources compiled in
        # (oracle_particles.cpp; particle_*.jsonl); over
        # crates/neuron-client/tests/fixtures/oracle.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force oracle-out-neuron-client | Out-Null
          & .\bin\Oracle.exe neuron-client "$PWD\crates\neuron-client\tests\fixtures\oracle" "$PWD\oracle-out-neuron-client"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # vectors\render holds the synthetic renderer traces (record 0004,
          # point 15), inputs written by make_render_traces.py; their images
          # are checked by the render-replay step below.
          Copy-Item -Recurse crates\neuron-client\tests\vectors\render oracle-out-neuron-client\render
          git diff --no-index --stat crates/neuron-client/tests/vectors oracle-out-neuron-client
          git diff --no-index crates/neuron-client/tests/vectors oracle-out-neuron-client
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Compare the game-app vectors
        # P4.1: CPlayerAccount on a scripted machine and registry
        # (oracle_account.cpp; account.jsonl) and PerfOptions.ini through
        # LoadPerfOptions and SavePerfOptions (oracle_perf_options.cpp;
        # perf_options.jsonl), over crates/game-app/tests/fixtures/oracle.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force oracle-out-game-app | Out-Null
          & .\bin\Oracle.exe game-app "$PWD\crates\game-app\tests\fixtures\oracle" "$PWD\oracle-out-game-app"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --no-index --stat crates/game-app/tests/vectors oracle-out-game-app
          git diff --no-index crates/game-app/tests/vectors oracle-out-game-app
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Check the data-dump mode on a synthetic installation
        # The same pipeline .github/workflows/data.yml runs on the original
        # data in outdir/, on a tree made from fixtures.
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP\fake-install"
          $out = "$env:RUNNER_TEMP\fake-oracle"
          $f = "crates\neuron-core\tests\fixtures\oracle"
          New-Item -ItemType Directory -Force "$root\DATA\SHIPS", "$root\EXE" | Out-Null
          Copy-Item "$f\ini\basic.ini" "$root\DATA\basic.ini"
          Copy-Item "$f\ini\crlf_only.ini" "$root\DATA\SHIPS\crlf_only.ini"
          Copy-Item "$f\ini\empty.ini" "$root\DATA\Empty.INI"
          Copy-Item "$f\engine\include.ini", "$f\engine\sub.ini", "$f\engine\basic.ini" "$root\EXE\"
          Copy-Item "$f\vfs\utf\full.utf" "$root\DATA\SHIPS\full.cmp"
          Copy-Item "$f\vfs\utf\compact.utf" "$root\DATA\compact.3db"
          Copy-Item "$f\sur\tree.sur" "$root\DATA\SHIPS\tree.sur"
          Copy-Item "$f\anim\script_full.utf" "$root\DATA\anim.cmp"
          Copy-Item "$f\fx\basic.ale" "$root\DATA\fx.ale"
          Copy-Item "$f\shading\texlib\basic.utf" "$root\DATA\tex.txm"
          Copy-Item "$f\shading\material\mats.utf" "$root\DATA\mats.mat"
          Copy-Item "$f\mesh_data\library.vms" "$root\DATA\SHIPS\library.vms"
          Copy-Item "$f\mesh_data\body.dfm" "$root\DATA\body.dfm"
          & .\bin\Oracle.exe dump $root $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup toolchain install
          $env:OUTPOST_DATA_DIR = $root
          $env:OUTPOST_ORACLE_DIR = $out
          # Every data_dump_<kind> test (crates/neuron-core/tests/support/data.rs).
          cargo test --locked -p neuron-core --tests -- data_dump_ --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The tree has no EXE\OutpostFrontier.ini: the game databases (P2.1) list no files.
          cargo test --locked -p game-sim --tests -- data_dump_ --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The scene scripts of P4.14 (crates/neuron-client/tests/data_dump.rs); none in this tree.
          cargo test --locked -p neuron-client --tests -- data_dump_ --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the resource DLLs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          $targets = 'UiText', 'FieldGuideText', 'DialogueText', 'NameCatalog', 'EquipmentCatalog', 'NegotiationText', 'InterfaceExtras', 'serverinterface' | ForEach-Object { "ResourceDLLs\$_" }
          & $msbuild CppSource\OutpostFrontier.sln "/t:$($targets -join ';')" /m /p:Configuration=Release /p:Platform=Win32 /v:minimal /nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compare the text catalogs with the resource DLLs
        # Work package P1.6: the catalogs built from outdir/data/text must hold
        # what the game reads from the DLLs built from CppSource/Resources.
        # The dump is game text, so it stays in the runner's temp folder and
        # is not uploaded.
        shell: pwsh
        run: |
          $dump = "$env:RUNNER_TEMP\catalog-oracle"
          $catalogs = "$env:RUNNER_TEMP\catalogs"
          New-Item -ItemType Directory -Force $dump | Out-Null
          & .\bin\Oracle.exe catalog "$PWD\bin" $dump
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup toolchain install
          cargo xtask catalog --out $catalogs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:OUTPOST_CATALOG_DIR = $catalogs
          $env:OUTPOST_ORACLE_DIR = $dump
          cargo test --locked -p neuron-core --test catalog_dump -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Replay the synthetic render traces into DX8RENDERER
        # Record 0004, point 15 (P4.3): Oracle.exe render-replay plays each
        # crates/neuron-client/tests/vectors/render/<name>/trace.jsonl into the
        # real Direct3D 8 renderer in a window on the runner and writes the
        # back buffer of its selected frame as <name>\expected.bmp (24-bit,
        # before gamma; CppSource/Oracle/oracle_render_replay.cpp). A committed
        # expected.bmp must equal it byte for byte; a missing or different one
        # is printed as base64 between marker lines, to be committed from the
        # log (never made from Rust). The step fails when the player fails,
        # including when the runner cannot create a Direct3D 8 HAL device. It
        # runs whenever the harness built, so its log is there even when an
        # earlier comparison failed.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          $out = "$PWD\oracle-out-render"
          New-Item -ItemType Directory -Force $out | Out-Null
          & .\bin\Oracle.exe render-replay "$PWD\crates\neuron-client\tests\vectors\render" $out
          $code = $LASTEXITCODE
          Write-Host ("Oracle.exe render-replay exit code {0} (0x{0:x8})" -f $code)
          $failed = $code -ne 0
          foreach ($trace in Get-ChildItem crates\neuron-client\tests\vectors\render -Directory) {
            $name = $trace.Name
            $made = Join-Path $out "$name\expected.bmp"
            $committed = Join-Path $trace.FullName 'expected.bmp'
            if (-not (Test-Path $made)) {
              Write-Host "::error::${name}: render-replay wrote no expected.bmp"
              $failed = $true
              continue
            }
            if (Test-Path $committed) {
              if ((Get-FileHash $made).Hash -eq (Get-FileHash $committed).Hash) {
                Write-Host "${name}: expected.bmp equals the C++ image"
                continue
              }
              Write-Host "::error::${name}: the committed expected.bmp differs from the C++ image"
              $failed = $true
            } else {
              Write-Host "::warning::${name}: no expected.bmp committed yet"
            }
            Write-Host "=== expected.bmp $name base64 begin ==="
            Write-Host ([Convert]::ToBase64String([IO.File]::ReadAllBytes($made)))
            Write-Host "=== expected.bmp $name base64 end ==="
          }
          if ($failed) { exit 1 }
      - name: Keep the oracle output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-vectors
          path: |
            oracle-out
            oracle-out-game-sim
            oracle-out-neuron-client
            oracle-out-render
          if-no-files-found: ignore
