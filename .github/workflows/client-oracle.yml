name: Client oracle trial

# Phase 5 (decision O50): can the C++ client's +oracle mode
# (design/reference-build.md section 8, "Hosted runner") run on a hosted
# runner, so that Gate G5's interface-tree dumps need not wait for the
# owner's machine? This job builds the reference client and runs the oracle
# scripts on the original data in outdir/ with the run-folder values of the
# owner's run (section 3: no startup movies, intro.ini's bDrawScripts =
# false; a PerfOptions.ini that skips the machine warnings), answers the
# client's sound warning (the runner has no audio device), and compares the
# runs with each other and with the owner run's figures (the step "Run the
# oracle scripts" lists them). It is a trial: it runs on request and when
# this file, the oracle scripts or the client's oracle mode change, and no
# other job depends on it.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/client-oracle.yml"
      - "CppSource/OutpostFrontier/oracle/**"
      - "CppSource/OutpostFrontier/Client/oracle_*"
      - "crates/game-app/**"
      - "apps/outpost-frontier/**"

concurrency:
  group: client-oracle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  client:
    name: C++ client +oracle on a hosted runner
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Restore the C++ build
        id: client-bin
        uses: actions/cache/restore@v4
        with:
          key: client-bin-v1-${{ hashFiles('CppSource/**') }}
          path: bin
      - name: Build the reference solution
        # The whole solution, as the reference job builds it: the client loads its DLLs by
        # name from the engine INI and the local server from the client INI. The image's
        # default toolset, because OutpostServer needs MFC, which only v145 has.
        if: ${{ steps.client-bin.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          & $msbuild CppSource\OutpostFrontier.sln /m /p:Configuration=Release /p:Platform=Win32 /v:minimal /nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save the C++ build
        if: ${{ success() && steps.client-bin.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.client-bin.outputs.cache-primary-key }}
          path: bin

      - name: Describe the runner
        # What the client will find: the session it runs in (0 is the services session,
        # which has no desktop), the display, the adapters, the audio service and endpoints.
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          $session = (Get-Process -Id $PID).SessionId
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Host "Session $session, interactive $([Environment]::UserInteractive), screen $($screen.Width)x$($screen.Height)"
          Get-CimInstance Win32_VideoController | Format-Table Name, DriverVersion, CurrentHorizontalResolution, CurrentVerticalResolution -AutoSize | Out-String | Write-Host
          Get-Service Audiosrv, AudioEndpointBuilder -ErrorAction SilentlyContinue | Format-Table Name, Status, StartType -AutoSize | Out-String | Write-Host
          Get-CimInstance Win32_SoundDevice | Format-Table Name, Status -AutoSize | Out-String | Write-Host
          Get-WindowsOptionalFeature -Online -FeatureName DirectPlay -ErrorAction SilentlyContinue | Format-List FeatureName, State | Out-String | Write-Host

      - name: Prepare the runner
        # Each change is tried and logged; the run below shows whether the client needs it.
        # DirectPlay: section 5 enables it for single player too (the login manager uses it).
        # The display: a windowed 1024x768 client area with its frame does not fit a
        # 1024x768 screen, and a windowed Direct3D 8 screenshot copies the screen area.
        shell: pwsh
        run: |
          DISM /Online /Enable-Feature /FeatureName:DirectPlay /All /NoRestart /Quiet
          Write-Host "DISM DirectPlay: exit code $LASTEXITCODE"
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop; Write-Host 'Set-DisplayResolution: done' }
          catch { Write-Host "Set-DisplayResolution: $($_.Exception.Message)" }
          try {
            Set-Service Audiosrv -StartupType Automatic -ErrorAction Stop
            Start-Service AudioEndpointBuilder, Audiosrv -ErrorAction Stop
            Write-Host 'Audio service: started'
          } catch { Write-Host "Audio service: $($_.Exception.Message)" }
          Add-Type -AssemblyName System.Windows.Forms
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Host "Screen now $($screen.Width)x$($screen.Height)"

      - name: Prepare the run folder
        # The owner run's folder (section 3): bin\ with the INI files, the .fl templates and
        # flconfigdatabase.txt beside it, data\ a junction to outdir\data. The two run-folder
        # values are made in this checkout only: the client INI plays no startup movies, and
        # intro.ini draws no intro scene.
        shell: pwsh
        run: |
          $run = "$env:RUNNER_TEMP\run"
          New-Item -ItemType Directory -Force $run | Out-Null
          Copy-Item bin\* $run -Recurse
          Copy-Item outdir\*.ini, outdir\*.fl, outdir\flconfigdatabase.txt $run
          New-Item -ItemType Junction -Path "$run\data" -Target "$PWD\outdir\data" | Out-Null
          $ini = "$run\OutpostFrontier.ini"
          (Get-Content $ini) -replace '^(movie_file\s*=)', ';$1' | Set-Content $ini
          $intro = 'outdir\data\INTERFACE\intro.ini'
          (Get-Content $intro) -replace '^bDrawScripts\s*=\s*true', 'bDrawScripts = false' | Set-Content $intro
          Select-String -Path $ini -Pattern 'movie_file' | ForEach-Object { Write-Host $_.Line }
          Select-String -Path $intro -Pattern 'bDrawScripts' | ForEach-Object { Write-Host $_.Line }

      - name: Restore the C++ runs
        # Decision O54 (4): the C++ client's outputs change only with CppSource and the oracle
        # scripts (both under CppSource), so a run whose sources an earlier run already ran takes
        # its outputs. Raise the v-number when the step "Run the oracle scripts" changes.
        id: cpp-runs
        uses: actions/cache/restore@v4
        with:
          key: client-oracle-runs-v1-${{ hashFiles('CppSource/**') }}
          path: ${{ runner.temp }}/oracle-out

      - name: Run the oracle scripts
        if: ${{ steps.cpp-runs.outputs.cache-hit != 'true' }}
        # Section 8: the pointer parked in a screen corner, no UserKeyMap.ini, the window left
        # in front; each run gets five minutes, a timed-out run is killed with its process
        # tree. The runs, in order:
        #   w      menu_walk.txt from a fresh per-user state (the registry key and the user
        #          folder removed), the warm-up
        #   a, b   menu_walk.txt again, twice: the runs compared with each other
        #   c      menu_walk.txt after removing the registry key only
        #   d      menu_walk.txt after removing the user folder only
        #   s1, s2 single_player.txt twice, with the in-process server on the oracle clock
        #   l1, l2 load_game.txt twice: the newest save, the first base s2 left (P5.3)
        # Each run's user folder afterwards is copied to its out\user (the saves, for the port's
        # load-game comparison, since a cache hit skips the runs).
        # c and d tell which per-user state makes the first run's extra login response.
        # Every run starts from a PerfOptions.ini that skips the machine warnings.
        timeout-minutes: 45
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $run = "$env:RUNNER_TEMP\run"
          $scripts = "$PWD\CppSource\OutpostFrontier\oracle"
          $spew = "$env:LOCALAPPDATA\OutpostFrontier\FLSpew.txt"
          $user = "$env:USERPROFILE\Documents\My Games\OutpostFrontier"
          $regKey = 'HKCU:\Software\Microsoft\Microsoft Games\OutpostFrontier'
          function Capture($path) {
            try {
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
              $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
              $g.Dispose(); $bmp.Dispose()
            } catch { Write-Host "Desktop capture failed: $($_.Exception.Message)" }
          }
          Add-Type -TypeDefinition @"
          using System; using System.Text; using System.Collections.Generic; using System.Runtime.InteropServices;
          public static class Win {
            delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] static extern bool EnumWindows(EnumProc f, IntPtr l);
            [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int GetClassName(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            [DllImport("user32.dll")] static extern void keybd_event(byte vk, byte scan, uint flags, UIntPtr extra);
            public static List<IntPtr> Of(uint pid) {
              var r = new List<IntPtr>();
              EnumWindows((h, l) => { uint p; GetWindowThreadProcessId(h, out p); if (p == pid) r.Add(h); return true; }, IntPtr.Zero);
              return r;
            }
            public static string Describe(IntPtr h) {
              var t = new StringBuilder(256); var c = new StringBuilder(256);
              GetWindowText(h, t, 256); GetClassName(h, c, 256);
              return string.Format("{0:x} class={1} title={2} visible={3}", h.ToInt64(), c, t, IsWindowVisible(h));
            }
            public static bool Visible(IntPtr h) { return IsWindowVisible(h); }
            delegate bool ChildProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] static extern bool EnumChildWindows(IntPtr p, ChildProc f, IntPtr l);
            [DllImport("user32.dll")] static extern int GetDlgCtrlID(IntPtr h);
            [DllImport("user32.dll")] static extern IntPtr GetDlgItem(IntPtr d, int id);
            [DllImport("user32.dll")] static extern IntPtr SendMessage(IntPtr h, uint m, IntPtr w, IntPtr l);
            public static List<string> Children(IntPtr d) {
              var r = new List<string>();
              EnumChildWindows(d, (h, l) => { var t = new StringBuilder(1024); GetWindowText(h, t, 1024); r.Add(string.Format("id={0} {1}", GetDlgCtrlID(h), t)); return true; }, IntPtr.Zero);
              return r;
            }
            public static bool Click(IntPtr d, int id) {
              var b = GetDlgItem(d, id); if (b == IntPtr.Zero) return false;
              SendMessage(b, 0x00F5, IntPtr.Zero, IntPtr.Zero); return true;
            }
            public static string Class(IntPtr h) { var c = new StringBuilder(256); GetClassName(h, c, 256); return c.ToString(); }
            public static bool Front(IntPtr h) {
              keybd_event(0x12, 0, 0, UIntPtr.Zero); keybd_event(0x12, 0, 2, UIntPtr.Zero);
              SetForegroundWindow(h);
              return GetForegroundWindow() == h;
            }
          }
          "@
          function Windows($id) {
            [Win]::Of([uint32]$id) | ForEach-Object { [Win]::Describe($_) }
          }
          function Reset($what) {
            if ($what -in 'all', 'registry') { Remove-Item $regKey -Recurse -Force -ErrorAction SilentlyContinue }
            if ($what -in 'all', 'files') { Remove-Item $user -Recurse -Force -ErrorAction SilentlyContinue }
            # The low-machine warning (engine_init.cpp, BuildLowMachineWarning) opens a modal
            # dialog when the renderer's device level is low; the C++ skips the device test
            # when PerfOptions.ini says so, in the form its own writer uses.
            New-Item -ItemType Directory -Force $user | Out-Null
            Remove-Item "$user\UserKeyMap.ini" -ErrorAction SilentlyContinue
            "[PerfVersion]`nversion=5`nSkipMachineWarnings=TRUE`n" | Set-Content -NoNewline "$user\PerfOptions.ini"
          }
          function RunOracle($name, $script, $reset) {
            $out = "$env:RUNNER_TEMP\oracle-out\$name"
            $diag = "$env:RUNNER_TEMP\oracle-out\diag-$name"
            New-Item -ItemType Directory -Force (Split-Path $out), $diag | Out-Null
            Reset $reset
            Remove-Item $spew -ErrorAction SilentlyContinue
            [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point(0, 0)
            $start = Get-Date
            $p = Start-Process -FilePath "$run\OutpostFrontier.exe" -ArgumentList '+oracle', "`"$scripts\$script`"", "`"$out`"" -WorkingDirectory $run -PassThru
            $code = 'timeout'
            $fronted = $false
            for ($t = 1; $t -le 300; $t++) {
              if ($p.WaitForExit(1000)) { $code = $p.ExitCode; break }
              # A dialog of the client's: its text into the log, then its Yes button (id 6), as
              # a player answers it. On the runner this is the sound warning (caption IDS 210,
              # text "... failed to initialize sound ... continue without sound?"): the runner
              # has no audio device, so the client runs without sound.
              foreach ($w in [Win]::Of([uint32]$p.Id)) {
                if ([Win]::Visible($w) -and [Win]::Class($w) -eq '#32770') {
                  $text = ([Win]::Children($w) | Where-Object { $_ -match '^id=65535' }) -join ' '
                  Write-Host "$name t=$t s: dialog '$text', Yes pressed: $([Win]::Click($w, 6))"
                }
              }
              if (-not $fronted) {
                $main = [Win]::Of([uint32]$p.Id) | Where-Object { [Win]::Visible($_) -and [Win]::Class($_) -eq 'OutpostFrontier' } | Select-Object -First 1
                if ($main) { $fronted = $true; Write-Host "$name t=$t s: foreground $([Win]::Front($main))" }
              }
            }
            if ($code -eq 'timeout') {
              Capture "$diag\desktop_timeout.png"
              Windows $p.Id | ForEach-Object { Write-Host "  $_" }
              taskkill /T /F /PID $p.Id | Out-Null
              Get-Process WerFault, dw15, OutpostServer -ErrorAction SilentlyContinue | Stop-Process -Force
            }
            $seconds = [int]((Get-Date) - $start).TotalSeconds
            Write-Host "Run $name ($script, reset $reset): exit $code after $seconds s"
            New-Item -ItemType Directory -Force $out | Out-Null
            if (Test-Path $spew) { Copy-Item $spew "$out\FLSpew.txt" }
            if (Test-Path $user) { Copy-Item $user "$out\user" -Recurse -Force }
            if ($code -ne 0 -and (Test-Path $spew)) { Get-Content $spew -Tail 30 | Write-Host }
            "$name,$script,$reset,$code,$seconds"
          }
          $result = @()
          $result += RunOracle 'w' 'menu_walk.txt' 'all'
          $result += RunOracle 'a' 'menu_walk.txt' 'none'
          $result += RunOracle 'b' 'menu_walk.txt' 'none'
          $result += RunOracle 'c' 'menu_walk.txt' 'registry'
          $result += RunOracle 'd' 'menu_walk.txt' 'files'
          $result += RunOracle 's1' 'single_player.txt' 'none'
          $result += RunOracle 's2' 'single_player.txt' 'none'
          $result += RunOracle 'l1' 'load_game.txt' 'none'
          $result += RunOracle 'l2' 'load_game.txt' 'none'
          Get-ChildItem "$env:LOCALAPPDATA\CrashDumps", "$env:ProgramData\Microsoft\Windows\WER\ReportArchive" -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like '*OutpostFrontier*' } | ForEach-Object { Write-Host "WER: $($_.FullName)" }
          $result | Where-Object { $_ -match ',' } | Set-Content "$env:RUNNER_TEMP\oracle-out\exit.csv"

      - name: Save the C++ runs
        if: ${{ success() && steps.cpp-runs.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.cpp-runs.outputs.cache-primary-key }}
          path: ${{ runner.temp }}/oracle-out

      - name: Prepare Rust
        if: ${{ always() }}
        run: rustup toolchain install
      - name: Cache the Rust build
        if: ${{ always() }}
        uses: Swatinem/rust-cache@v2
      - name: Compare the port with the C++ client
        # Decision O53 (2), (4) and (5): the port's oracle files against this runner's C++
        # runs: keymap.jsonl and layout.jsonl's key and option lists, pages and navbar.ini
        # window tree against run a (the tree also against s1), the single-player login's
        # IClient lines against runs w (a fresh user folder) and a (the folder w made), and a new
        # game's IClient lines up to the frames after entering space against run s1 of
        # single_player.txt.
        if: ${{ always() }}
        shell: pwsh
        env:
          OUTPOST_CLIENT_ORACLE_DIR: ${{ runner.temp }}\oracle-out\a
          OUTPOST_CLIENT_ORACLE_FRESH_DIR: ${{ runner.temp }}\oracle-out\w
          OUTPOST_CLIENT_ORACLE_SP_DIR: ${{ runner.temp }}\oracle-out\s1
        run: |
          cargo test --locked -p game-app --test keymap_data -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p game-app --test preferences_data -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p game-app --test page_data -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The navigation bar's window tree (P5.9): menu_walk.txt's load at frame 0 (run a),
          # then single_player.txt's two loads, the second in the first base (run s1).
          cargo test --locked -p game-app --test navbar_data -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:OUTPOST_CLIENT_ORACLE_DIR = "${{ runner.temp }}\oracle-out\s1"
          cargo test --locked -p game-app --test navbar_data -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:OUTPOST_CLIENT_ORACLE_DIR = "${{ runner.temp }}\oracle-out\a"
          cargo test --locked -p outpost-frontier --test local_server -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p outpost-frontier --test new_game -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run the port's client
        # The Rust OutpostFrontier.exe in its +oracle mode (decision O53 (2)) on menu_walk.txt
        # from the run folder and a fresh user folder, as run w. Its start-up is ported (the
        # forced display, the seed, the single-player login, the IDR_ALWAYS_PRESENT key map);
        # the screens are not, so the script's waits time out and its dumps have no tree.
        if: ${{ always() }}
        timeout-minutes: 30
        shell: pwsh
        run: |
          cargo build --locked --release -p outpost-frontier
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $run = "$env:RUNNER_TEMP\run"
          Copy-Item target\x86_64-pc-windows-msvc\release\OutpostFrontier.exe "$run\OutpostFrontierPort.exe"
          $out = "$env:RUNNER_TEMP\oracle-out\port"
          $script = "$PWD\CppSource\OutpostFrontier\oracle\menu_walk.txt"
          $user = "$env:USERPROFILE\Documents\My Games\OutpostFrontier"
          Remove-Item 'HKCU:\Software\Microsoft\Microsoft Games\OutpostFrontier' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $user -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $user | Out-Null
          "[PerfVersion]`nversion=5`nSkipMachineWarnings=TRUE`n" | Set-Content -NoNewline "$user\PerfOptions.ini"
          $start = Get-Date
          $p = Start-Process -FilePath "$run\OutpostFrontierPort.exe" -ArgumentList '+oracle', "`"$script`"", "`"$out`"" -WorkingDirectory $run -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\port-stdout.txt" -RedirectStandardError "$env:RUNNER_TEMP\port-stderr.txt"
          if (-not $p.WaitForExit(900000)) { taskkill /T /F /PID $p.Id | Out-Null; $code = 'timeout' } else { $code = $p.ExitCode }
          Write-Host "The port's client: exit $code after $([int]((Get-Date) - $start).TotalSeconds) s"
          Get-Content "$env:RUNNER_TEMP\port-stdout.txt", "$env:RUNNER_TEMP\port-stderr.txt" -ErrorAction SilentlyContinue | Write-Host

      - name: Compare the port's client with the C++ client
        # Run port against run w (both on a fresh user folder): keymap.jsonl whole, the IClient
        # lines of frame 0 (the single-player login), and session.jsonl's display and seed records.
        if: ${{ always() }}
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP\oracle-out"
          function Lines($path) { if (Test-Path $path) { @(Get-Content $path) } else { @() } }
          $fail = $false
          function Same($a, $b) { $a.Count -gt 0 -and $b.Count -eq $a.Count -and @(Compare-Object $a $b -SyncWindow 0).Count -eq 0 }
          $a = @(Lines "$root\w\keymap.jsonl"); $b = @(Lines "$root\port\keymap.jsonl")
          if (Same $a $b) { Write-Host "keymap.jsonl: $($a.Count) lines equal" }
          else { Write-Host "keymap.jsonl differs ($($a.Count) and $($b.Count) lines)"; $fail = $true }
          $a = @(Lines "$root\w\iclient.jsonl" | Where-Object { $_ -match '^\{"frame":0,' })
          $b = @(Lines "$root\port\iclient.jsonl" | Where-Object { $_ -match '^\{"frame":0,' })
          if (Same $a $b) { Write-Host "iclient.jsonl, frame 0: $($a.Count) lines equal" }
          else { Write-Host "iclient.jsonl, frame 0, differs:"; $a | Write-Host; Write-Host '--- port:'; $b | Write-Host; $fail = $true }
          foreach ($rec in 'display', 'seed') {
            $a = @(Lines "$root\w\session.jsonl" | Where-Object { $_ -match "`"rec`":`"$rec`"" })
            $b = @(Lines "$root\port\session.jsonl" | Where-Object { $_ -match "`"rec`":`"$rec`"" })
            if ($a.Count -eq 1 -and $b.Count -eq 1 -and $a[0] -eq $b[0]) { Write-Host "session.jsonl $rec`: equal" }
            else { Write-Host "session.jsonl $rec differs: $a | $b"; $fail = $true }
          }
          if ($fail) { exit 1 }

      - name: Compare the runs
        if: ${{ always() }}
        # The figures of every run, a against the owner run's (section 8, "Owner run"); then
        # a against b, w against a and s1 against s2 file by file, with the IClient calls that
        # differ. The start record names the output folder, so it is left out.
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP\oracle-out"
          function Lines($path) { if (Test-Path $path) { @(Get-Content $path) } else { @() } }
          function Figures($dir) {
            $session = Lines "$dir\session.jsonl" | ForEach-Object { $_ | ConvertFrom-Json }
            $quit = $session | Where-Object rec -eq 'quit' | Select-Object -Last 1
            $dumps = @($session | Where-Object rec -eq 'dump')
            $keymap = Lines "$dir\keymap.jsonl" | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object rec -eq 'load'
            $base = $keymap | Where-Object phase -eq 'base' | Select-Object -First 1
            $calls = @(Lines "$dir\iclient.jsonl" | ForEach-Object { ($_ | ConvertFrom-Json).seq } | Sort-Object -Unique)
            "$($quit.frame) | $($dumps.Count) | $(@($dumps | Where-Object { $_.shot }).Count) | $(if ($base) { "$($base.cmds)/$($base.groups)" }) | $((Lines "$dir\layout.jsonl").Count) | $($calls.Count)"
          }
          $summary = @('## Client oracle trial', '', '| Run | Script | Reset | Exit | Seconds | Quit frame | Dumps | Shots | Key map | Layout | IClient calls |', '| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |')
          $summary += '| owner 2026-11-17 | menu_walk.txt | | 0 | | 398 | 9 | 9 | 122/5 | 176 | 6 |'
          $summary += '| owner 2026-11-17 | single_player.txt | | 0 | | 2626 | 7 | 7 | | | |'
          Get-Content "$root\exit.csv" | ForEach-Object { $f = $_ -split ','; $summary += "| $($f[0]) | $($f[1]) | $($f[2]) | $($f[3]) | $($f[4]) | $(Figures "$root\$($f[0])") |" }
          function Pair($x, $y) {
            $out = @('', "### $y against $x", '')
            foreach ($file in 'session.jsonl', 'tree.jsonl', 'keymap.jsonl', 'layout.jsonl', 'iclient.jsonl') {
              $a = @(Lines "$root\$x\$file" | Where-Object { $_ -notmatch '"rec":"start"' })
              $b = @(Lines "$root\$y\$file" | Where-Object { $_ -notmatch '"rec":"start"' })
              if ($a.Count -eq 0 -and $b.Count -eq 0) { $out += "- ``$file``: missing in both"; continue }
              $diff = @(Compare-Object $a $b -SyncWindow 0)
              if ($diff.Count -eq 0) { $out += "- ``$file``: equal ($($a.Count) lines)"; continue }
              $first = 0; while ($first -lt [Math]::Min($a.Count, $b.Count) -and $a[$first] -eq $b[$first]) { $first++ }
              $out += "- ``$file``: differs ($($a.Count) and $($b.Count) lines, first at line $($first + 1), $($diff.Count) lines only in one)"
              if ($file -eq 'iclient.jsonl') {
                $diff | Select-Object -First 12 | ForEach-Object {
                  $line = $_.InputObject; if ($line.Length -gt 300) { $line = $line.Substring(0, 300) + '...' }
                  $out += "    $($_.SideIndicator) $line"
                }
              }
            }
            $s1 = Get-ChildItem "$root\$x\shot_*.bmp" -ErrorAction SilentlyContinue
            $same = @($s1 | Where-Object { (Test-Path "$root\$y\$($_.Name)") -and (Get-FileHash $_).Hash -eq (Get-FileHash "$root\$y\$($_.Name)").Hash }).Count
            $out += "- screenshots: $same of $(@($s1).Count) byte-identical"
            $out
          }
          $summary += Pair 'a' 'b'
          $summary += Pair 'w' 'a'
          $summary += Pair 's1' 's2'
          $summary += Pair 'l1' 'l2'
          $summary += @('', '### Login responses per run', '')
          foreach ($n in 'w', 'a', 'c', 'd') {
            $calls = Lines "$root\$n\iclient.jsonl" | Where-Object { $_ -match 'SendServerLoginResponse|"m":"Startup"|OnConnect' -and $_ -notmatch '"r":' }
            $summary += "- $n`: $(($calls | ForEach-Object { $j = $_ | ConvertFrom-Json; "$($j.m) $($j.a | ConvertTo-Json -Compress)" }) -join ' ; ')"
          }
          $summary | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          $summary | Write-Host

      - name: Keep the outputs
        # Made from the game data, so kept as a short-lived artifact and never committed
        # (AGENTS.md); the owner can compare them with a local run.
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: client-oracle-trial
          path: ${{ runner.temp }}/oracle-out
          retention-days: 7
          if-no-files-found: warn
