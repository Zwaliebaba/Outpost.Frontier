name: Data dumps

# TEMPORARY, branch claude/oracle-determinism only (owner, 2026-11-19): the oracle
# reproducibility probe, second run. Not for main. The normal data.yml is on main.
#
# The first probe (run 44523076483) showed that the 5 ensemble pairs end differently in
# separate processes of one build on one machine; machine, CPU and toolset do not decide
# the outcome. This run builds the oracle once and runs each pair 6 times (--runs 6, each a
# fresh process) twice: as Windows starts it, and with Oracle.exe's address-space
# randomization switched off (Set-ProcessMitigation: bottom-up, high-entropy and forced
# relocation). compare_runs.py prints, per pair, each run's heap and stack placement and
# the first records that differ from run 1.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeat:
    name: Repeated runs with and without ASLR
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build the oracle harness
        shell: pwsh
        run: |
          Write-Host "image: $env:ImageOS $env:ImageVersion"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          Get-ChildItem "$vs\VC\Auxiliary\Build" -Filter 'Microsoft.VCToolsVersion.default.txt' | ForEach-Object { "MSVC: $(Get-Content $_.FullName)" }
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          $targets = 'Tools\Oracle', 'DLLs\Content', 'DLLs\ReadFile', 'DLLs\RendComp', 'DLLs\system', 'DLLs\SceneScript', 'DLLs\DX8RENDERER', 'DLLs\Shading'
          & $msbuild CppSource\OutpostFrontier.sln "/t:$($targets -join ';')" /m /p:Configuration=Release /p:Platform=Win32 /v:minimal /nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the pairs with and without ASLR
        shell: pwsh
        run: |
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          Write-Host "cpu: $($cpu.Name)"
          $pairs = 'dogfight 3358599207', 'dogfight 464813110', 'skirmish 1478717352', 'skirmish 225462782', 'strafe 2731971922'
          $root = "$env:RUNNER_TEMP\det"
          foreach ($mode in 'aslr', 'noaslr') {
            if ($mode -eq 'noaslr') {
              Set-ProcessMitigation -Name Oracle.exe -Disable BottomUp, HighEntropy, ForceRelocateImages
              Get-ProcessMitigation -Name Oracle.exe | Select-Object -ExpandProperty ASLR | Format-List | Out-String | Write-Host
            }
            foreach ($pair in $pairs) {
              $name, $seed = $pair -split ' '
              $dir = "$root\$mode\${name}_$seed"
              & .\bin\Oracle.exe sim "$PWD\outdir" "CppSource\Oracle\scenarios\$name.txt" $dir --seed $seed --runs 6
              Write-Host "$mode $name seed ${seed}: exit $LASTEXITCODE"
            }
          }
      - name: Compare the runs
        shell: pwsh
        run: python -I .github\oracle-determinism\compare_runs.py "$env:RUNNER_TEMP\det"
