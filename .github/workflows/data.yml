name: Data dumps

# Gate G1 (design/migration-plan.md section 6): every reader on the original
# game data in outdir/ (decision O15) against the C++ oracle. Each work
# package's dump is a data_dump_<kind> test (crates/neuron-core/tests/support/
# data.rs; crates/game-sim/tests/data_dump.rs for the game databases). Runs
# nightly, on pushes to main, and on demand; the per-push oracle job in
# build.yml runs the same pipeline on a synthetic tree.

on:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data:
    name: Original data against the oracle
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build the oracle harness
        # Oracle builds Server.dll and SimClientStub.dll through its references; the
        # scenario oracle (Oracle.exe sim) also loads Content.dll and the engine DLLs
        # NEURONCOMPONENTSsrv.ini names, built here by name.
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          $targets = 'Tools\Oracle', 'DLLs\Content', 'DLLs\ReadFile', 'DLLs\RendComp', 'DLLs\system', 'DLLs\SceneScript', 'DLLs\DX8RENDERER', 'DLLs\Shading'
          # The pinned MSVC toolset (.github/msvc-toolset.txt).
          $pin = & .github\scripts\msvc-pin.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $msbuild CppSource\OutpostFrontier.sln "/t:$($targets -join ';')" /m /p:Configuration=Release /p:Platform=Win32 /v:minimal /nologo @pin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Dump the original data with the oracle
        # The dump root holds DATA (a junction to outdir\data) and EXE (the
        # INI files at the top of outdir\), as design/reference-build.md
        # section 7 describes. The dumps are not uploaded.
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP\outpost-data"
          New-Item -ItemType Directory -Force "$root\EXE" | Out-Null
          New-Item -ItemType Junction -Path "$root\DATA" -Target "$PWD\outdir\data" | Out-Null
          Copy-Item outdir\*.ini "$root\EXE\"
          # P3.2: the character templates the saves kind reads next to the executable.
          Copy-Item outdir\*.fl "$root\EXE\"
          & .\bin\Oracle.exe dump $root "$env:RUNNER_TEMP\outpost-oracle"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare Rust
        run: rustup toolchain install
      - name: Compare the port with the oracle
        shell: pwsh
        run: |
          $env:OUTPOST_DATA_DIR = "$env:RUNNER_TEMP\outpost-data"
          $env:OUTPOST_ORACLE_DIR = "$env:RUNNER_TEMP\outpost-oracle"
          cargo test --locked --release -p neuron-core --tests -- data_dump_ --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The game databases of work package P2.1 (crates/game-sim/tests/data_dump.rs).
          cargo test --locked --release -p game-sim --tests -- data_dump_ --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The scene scripts of work package P4.14 (crates/neuron-client/tests/data_dump.rs).
          cargo test --locked --release -p neuron-client --tests -- data_dump_ --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The character save reader of work package P3.2 (crates/game-logic/tests/save_dump.rs).
          cargo test --locked --release -p game-logic --tests -- data_dump_ --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep the summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-dump-summaries
          path: ${{ runner.temp }}/outpost-oracle/rust-*.txt
          if-no-files-found: ignore
      - name: Run the scenario oracle
        # Work package P2.3 (design/adr/0003-simulation-oracle.md, design/reference-build.md
        # section 10): every scenario in CppSource/Oracle/scenarios three times, each run in a
        # fresh process, on the original data in outdir/. The records stay on the runner; the
        # spread summaries (record 0003 point 9) and each run's session log are kept.
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\outpost-sim"
          $keep = "$env:RUNNER_TEMP\outpost-sim-summaries"
          New-Item -ItemType Directory -Force $keep | Out-Null
          $failed = @()
          foreach ($scenario in Get-ChildItem CppSource\Oracle\scenarios -Filter *.txt) {
            $name = $scenario.BaseName
            & .\bin\Oracle.exe sim "$PWD\outdir" $scenario.FullName "$out\$name" --runs 3
            if ($LASTEXITCODE -ne 0) { $failed += $name }
            New-Item -ItemType Directory -Force "$keep\$name" | Out-Null
            Copy-Item "$out\$name\spread.*" "$keep\$name\" -ErrorAction SilentlyContinue
            Get-ChildItem "$out\$name" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item "$($_.FullName)\session.jsonl" "$keep\$name\$($_.Name)-session.jsonl" -ErrorAction SilentlyContinue
              Copy-Item "$($_.FullName)\load_rand.txt" "$keep\$name\$($_.Name)-load_rand.txt" -ErrorAction SilentlyContinue
            }
            # A scenario marked "# ci: expect collision": every run records collision events
            # with their CalcCollisionDamage calls, and the runs record the same ones.
            if (Select-String -Path $scenario.FullName -Pattern '^# ci: expect collision' -Quiet) {
              $seen = @()
              foreach ($run in Get-ChildItem "$out\$name" -Directory -ErrorAction SilentlyContinue) {
                $events = @(Select-String -Path "$($run.FullName)\events.jsonl" -Pattern '"rec":"collision"' -ErrorAction SilentlyContinue | ForEach-Object { $_.Line })
                $calls = @(Select-String -Path "$($run.FullName)\calls.jsonl" -Pattern '"rec":"collision_damage"' -ErrorAction SilentlyContinue | ForEach-Object { $_.Line })
                Write-Host "$name $($run.Name): $($events.Count) collision events, $($calls.Count) CalcCollisionDamage calls"
                $events | Select-Object -First 6 | ForEach-Object { Write-Host "  $_" }
                $calls | Select-Object -First 6 | ForEach-Object { Write-Host "  $_" }
                if ($events.Count -eq 0 -or $calls.Count -eq 0) { $failed += "$name (no collision in $($run.Name))" }
                $seen += (($events + $calls) -join "`n")
              }
              if (@($seen | Select-Object -Unique).Count -gt 1) { $failed += "$name (the runs record different collisions)" }
            }
          }
          # The step log carries what the artifacts hold: spreads, error records and the
          # load-time rand() draws of each scenario's first run.
          foreach ($dir in Get-ChildItem $keep -Directory) {
            Write-Host "== $($dir.Name)"
            Get-Content "$($dir.FullName)\spread.txt" -ErrorAction SilentlyContinue
            Get-ChildItem $dir.FullName -Filter *-session.jsonl | ForEach-Object {
              Select-String -Path $_.FullName -Pattern '"error"|"note"|"fault"' | Select-Object -First 20 | ForEach-Object { "$($_.Filename): $($_.Line)" }
            }
            Get-Content "$($dir.FullName)\run_01-load_rand.txt" -ErrorAction SilentlyContinue
          }
          # P2.5 (the dogfight): each run's events counted by kind and objects (munition hits
          # shooter->target, target picks ship->target), and the ticks each AI ship spent in
          # each behaviour (tick.jsonl `behavior`, the BehaviorTypes id) with each target.
          foreach ($dir in Get-ChildItem $out -Directory) {
            foreach ($run in Get-ChildItem $dir.FullName -Directory) {
              # P2.4: the asteroid cubes and docking-point calls recorded.
              foreach ($rec in 'asteroids.jsonl', 'dock.jsonl') {
                $file = Join-Path $run.FullName $rec
                if (Test-Path $file) { "$($dir.Name)/$($run.Name) ${rec}: $(@(Get-Content $file).Count) records" }
              }
              if ($run.Name -eq 'run_01') {
                Get-Content (Join-Path $run.FullName 'asteroids.jsonl') -ErrorAction SilentlyContinue |
                  Where-Object { $_.Contains('"probe"') -and $_.Contains('"tick":0,') } |
                  ForEach-Object { "$($dir.Name)/$($run.Name) $_" }
                Select-String -Path (Join-Path $run.FullName 'fdump.txt') -Pattern 'steroid' -ErrorAction SilentlyContinue |
                  Select-Object -First 10 | ForEach-Object { "$($dir.Name)/$($run.Name) fdump: $($_.Line)" }
              }
              $events = Join-Path $run.FullName 'events.jsonl'
              if (Test-Path $events) {
                Get-Content $events | ForEach-Object { $_ | ConvertFrom-Json } |
                  Group-Object { "$($_.rec) $($_.obj ?? $_.shooter_obj ?? $_.a_obj ?? $_.ship_obj)->$($_.target_obj ?? $_.b_obj ?? $_.dock_obj ?? $_.killer_obj)" } |
                  ForEach-Object { "$($dir.Name)/$($run.Name) events: $($_.Count) x $($_.Name)" }
                Select-String -Path $events -Pattern '"rec":"destroyed"' |
                  ForEach-Object { "$($dir.Name)/$($run.Name) destroyed: $($_.Line)" }
              }
              $ticks = Join-Path $run.FullName 'tick.jsonl'
              if ((Test-Path $ticks) -and (Select-String -Path $ticks -Pattern '"behavior":[0-9]' -Quiet)) {
                Get-Content $ticks | Where-Object { $_.Contains('"behavior":') } | ForEach-Object { $_ | ConvertFrom-Json } |
                  Where-Object { $_.behavior -ge 0 } |
                  Group-Object { "$($_.obj) behaviour $($_.behavior) target $($_.target_obj)" } |
                  ForEach-Object { "$($dir.Name)/$($run.Name) ticks: $($_.Count) x $($_.Name)" }
              }
            }
          }
          if ($failed.Count -gt 0) {
            Write-Host "Scenarios with a failed run: $($failed -join ', ')"
            exit 1
          }
      - name: Check that the oracle repeats itself
        # The reproducibility work (owner, 2026-11-19; design/adr/0003-simulation-oracle.md,
        # reference-build.md section 10, "Determinism"). Before IServerImpl::Startup's srand
        # took the scenario's seed, these five seeds of the G2 fights ended differently in
        # separate processes of one build; ram_ship and fire_at_target (no AI, comms on) run at
        # their own seed. Each runs three times (--runs 3, fresh processes)
        # with the frame-time rand() recorder: the records must be identical (ai.jsonl apart: the
        # personality padding it copies holds stack garbage), and with
        # `comms off` no draw comes from Content's comm system. Each fight also runs once with
        # comms on: the records must be identical to the comms-off run before the first contact.
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP\outpost-repeat"
          $env:OUTPOST_ORACLE_RUN_RAND = '1'
          $failed = @()
          # A run_rand.jsonl's draws: all of them, those whose caller is IsGcsCommAllowed
          # (Content's comm roll), and the other draws after the first comm roll.
          function Get-CommDraws($file) {
            $sites = @(Select-String -Path $file -Pattern '"rec":"sym".*IsGcsCommAllowed' | ForEach-Object { ($_.Line | ConvertFrom-Json).at })
            $total = 0; $comm = 0; $after = 0
            foreach ($line in [IO.File]::ReadLines($file)) {
              if (-not $line.StartsWith('{"rec":"draw"')) { continue }
              $total++
              if ($sites.Count -gt 0 -and $sites -contains ($line | ConvertFrom-Json).stack[0]) { $comm++ }
              elseif ($comm -gt 0) { $after++ }
            }
            return [pscustomobject]@{ Total = $total; Comm = $comm; After = $after }
          }
          $pairs = 'dogfight 3358599207', 'dogfight 464813110', 'skirmish 1478717352', 'skirmish 225462782', 'strafe 2731971922', 'ram_ship 1330790723', 'fire_at_target 1330790723'
          foreach ($pair in $pairs) {
            $name, $seed = $pair -split ' '
            $dir = "$root\${name}_$seed"
            & .\bin\Oracle.exe sim "$PWD\outdir" "CppSource\Oracle\scenarios\$name.txt" $dir --seed $seed --runs 3 | Out-Null
            if ($LASTEXITCODE -ne 0) { $failed += "$name $seed (exit $LASTEXITCODE)" }
            $runs = @(Get-ChildItem $dir -Directory | Sort-Object Name)
            foreach ($file in 'tick.jsonl', 'events.jsonl', 'calls.jsonl', 'psi.jsonl') {
              $hashes = @($runs | ForEach-Object { (Get-FileHash "$($_.FullName)\$file" -Algorithm SHA256 -ErrorAction SilentlyContinue).Hash })
              $distinct = @($hashes | Select-Object -Unique).Count
              if ($distinct -ne 1) { $failed += "$name $seed $file ($distinct versions in $($runs.Count) runs)" }
            }
            # run_rand.jsonl: each draw's tick, index, value, module and caller (dbghelp's walk
            # of the frames beyond the caller is not compared).
            $draws = @($runs | ForEach-Object {
              $kept = foreach ($line in [IO.File]::ReadLines("$($_.FullName)\run_rand.jsonl")) {
                if ($line -match '^(\{"rec":"draw",.*?"stack":\["[^"]*")') { $Matches[1] }
              }
              ($kept -join "`n").GetHashCode()
            })
            $distinct = @($draws | Select-Object -Unique).Count
            if ($distinct -ne 1) { $failed += "$name $seed run_rand.jsonl draws ($distinct versions in $($runs.Count) runs)" }
            $session = "$($runs[0].FullName)\session.jsonl"
            $server = Select-String -Path $session -Pattern '"rec":"server"' | Select-Object -First 1
            $beats = Select-String -Path $session -Pattern '"rec":"heartbeats"' | Select-Object -First 1
            $envRec = Select-String -Path $session -Pattern '"rec":"env"' | Select-Object -First 1
            $comms = Get-CommDraws "$($runs[0].FullName)\run_rand.jsonl"
            $contact = Select-String -Path "$($runs[0].FullName)\events.jsonl" -Pattern '"rec":"(munition_hit|collision)"' | Select-Object -First 1
            $contactTick = if ($contact) { ($contact.Line | ConvertFrom-Json).tick } else { 'none' }
            Write-Host "$name seed ${seed}: $($runs.Count) runs, first contact tick $contactTick, draws $($comms.Total), comm rolls $($comms.Comm), other draws after the first comm roll $($comms.After)"
            Write-Host "  $($server.Line)"
            Write-Host "  $($beats.Line)"
            if ($pair -eq $pairs[0]) { Write-Host "  $($envRec.Line)" }
            $isOff = Select-String -Path "CppSource\Oracle\scenarios\$name.txt" -Pattern '^comms off' -Quiet
            if ($isOff -and $comms.Comm -ne 0) { $failed += "$name $seed ($($comms.Comm) comm rolls with comms off)" }
            if ($isOff) {
              # The same seed with comms on: equal before the first contact.
              $on = "$env:RUNNER_TEMP\${name}_comms_on.txt"
              Get-Content "CppSource\Oracle\scenarios\$name.txt" | Where-Object { $_ -notmatch '^comms off' } | Set-Content $on
              $onDir = "$root\${name}_${seed}_comms_on"
              & .\bin\Oracle.exe sim "$PWD\outdir" $on $onDir --seed $seed | Out-Null
              $a = @(Get-Content "$($runs[0].FullName)\tick.jsonl")
              $b = @(Get-Content "$onDir\tick.jsonl")
              $first = 'never'
              for ($i = 0; $i -lt [Math]::Max($a.Count, $b.Count); $i++) {
                if ($a[$i] -ne $b[$i]) { $first = ($a[$i] | ConvertFrom-Json).tick; break }
              }
              $onComms = Get-CommDraws "$onDir\run_rand.jsonl"
              Write-Host "  comms on: draws $($onComms.Total), comm rolls $($onComms.Comm), other draws after the first $($onComms.After); tick.jsonl first differs from comms off at tick $first"
              if ($first -ne 'never' -and $contactTick -ne 'none' -and [int]$first -lt [int]$contactTick) {
                $failed += "$name $seed (comms on differs at tick $first, before the first contact at $contactTick)"
              }
            }
          }
          if ($failed.Count -gt 0) {
            Write-Host "Not reproducible: $($failed -join '; ')"
            exit 1
          }
      - name: Run the seed ensemble
        # Gate G2's seed ensemble (design/adr/0003-simulation-oracle.md point 9; owner,
        # 2026-11-19): each scenario of crates/game-sim/tests/fixtures/g2_ensemble.txt once per
        # seed listed there, each run in a fresh process with --seed (the seed of the srand the
        # harness calls again after the load), into outpost-ensemble\seed_<S>\<scenario>\. Each
        # run must record its seed. Only what the Rust comparison reads is kept on the runner
        # (tick.jsonl, events.jsonl, the munition_hit and collision_damage records of calls.jsonl,
        # the head of ai.jsonl with the pilots' personalities and attitudes, session.jsonl); the
        # session logs go to the summaries.
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $ens = "$env:RUNNER_TEMP\outpost-ensemble"
          $keep = "$env:RUNNER_TEMP\outpost-sim-summaries\ensemble"
          New-Item -ItemType Directory -Force $keep | Out-Null
          $list = Get-Content crates\game-sim\tests\fixtures\g2_ensemble.txt | ForEach-Object { ($_ -split '#')[0].Trim() } | Where-Object { $_ }
          $scenarios = @($list | Where-Object { $_ -like 'scenario *' } | ForEach-Object { ($_ -split '\s+')[1] })
          $seeds = @($list | Where-Object { $_ -like 'seed *' } | ForEach-Object { ($_ -split '\s+')[1] })
          Write-Host "seed ensemble: $($scenarios -join ', ') x $($seeds.Count) seeds"
          $kept = 'tick.jsonl', 'events.jsonl', 'calls.jsonl', 'ai.jsonl', 'session.jsonl', 'load_rand.txt'
          $failed = @()
          $clock = [Diagnostics.Stopwatch]::StartNew()
          foreach ($seed in $seeds) {
            foreach ($name in $scenarios) {
              $dir = "$ens\seed_$seed\$name"
              $run = [Diagnostics.Stopwatch]::StartNew()
              & .\bin\Oracle.exe sim "$PWD\outdir" "CppSource\Oracle\scenarios\$name.txt" $dir --seed $seed
              $code = $LASTEXITCODE
              Write-Host "$name seed ${seed}: exit $code, $([int]$run.Elapsed.TotalSeconds) s"
              if ($code -ne 0) { $failed += "$name seed $seed (exit $code)" }
              if (-not (Select-String -Path "$dir\session.jsonl" -Pattern "`"reseed`":$seed[,}]" -Quiet -ErrorAction SilentlyContinue)) {
                $failed += "$name seed $seed (session.jsonl does not record the seed)"
              }
              if ($seed -eq $seeds[0]) {
                Get-ChildItem $dir -File | ForEach-Object { "  $name seed ${seed} $($_.Name): $($_.Length) bytes" }
              }
              $calls = "$dir\calls.jsonl"
              if (Test-Path $calls) {
                $lines = @(Select-String -Path $calls -Pattern '"rec":"(munition_hit|collision_damage)"' | ForEach-Object { $_.Line })
                Set-Content -Path $calls -Value $lines
              }
              $ai = "$dir\ai.jsonl"
              if (Test-Path $ai) {
                $head = @(Get-Content $ai -TotalCount 2000)
                Set-Content -Path $ai -Value $head
              }
              Get-ChildItem $dir -File -ErrorAction SilentlyContinue | Where-Object { $kept -notcontains $_.Name } | Remove-Item
              Copy-Item "$dir\session.jsonl" "$keep\seed_$seed-$name-session.jsonl" -ErrorAction SilentlyContinue
              Select-String -Path "$dir\session.jsonl" -Pattern '"error"|"fault"' -ErrorAction SilentlyContinue |
                Select-Object -First 5 | ForEach-Object { "  $name seed ${seed}: $($_.Line)" }
            }
          }
          Write-Host "seed ensemble: $($scenarios.Count * $seeds.Count) runs in $($clock.Elapsed)"
          if ($failed.Count -gt 0) {
            Write-Host "Ensemble runs that failed: $($failed -join ', ')"
            exit 1
          }
      - name: Replay the recorded PSIs through the port
        # Decision O20, replay layer: every psi.jsonl the scenarios wrote is replayed one PSI
        # at a time through neuron-core::physics (crates/neuron-core/tests/sim_replay.rs).
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $env:OUTPOST_ORACLE_DIR = "$env:RUNNER_TEMP\outpost-sim"
          cargo test --locked --release -p neuron-core --test sim_replay -- --nocapture
          $code = $LASTEXITCODE
          Copy-Item "$env:OUTPOST_ORACLE_DIR\rust-sim-replay.txt" "$env:RUNNER_TEMP\outpost-sim-summaries\" -ErrorAction SilentlyContinue
          exit $code
      - name: Replay the controllers, the damage and the scenarios through the object model
        # Work package P2.4 (decision O20): the flight controllers rebuilt from each PSI's recorded
        # inputs (ctl) against the recorded pushes, the munition hits and collision damages of
        # calls.jsonl against the recorded damage lists, and the scenarios run through the Rust
        # world against tick.jsonl (differences reported; only gross divergence fails, the
        # envelopes being unapproved); the asteroid field walk and the docking points replayed
        # from the oracle's own inputs against asteroids.jsonl and dock.jsonl (field_replay).
        # Summaries rust-controller-replay.txt, rust-damage-replay.txt, rust-scenario-replay.txt,
        # rust-field-replay.txt and rust-dock-replay.txt.
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $env:OUTPOST_ORACLE_DIR = "$env:RUNNER_TEMP\outpost-sim"
          $failed = 0
          foreach ($test in 'controller_replay', 'damage_replay', 'scenario_replay', 'behavior_replay', 'field_replay') {
            cargo test --locked --release -p game-sim --test $test -- --nocapture
            if ($LASTEXITCODE -ne 0) { $failed = 1 }
          }
          Copy-Item "$env:OUTPOST_ORACLE_DIR\rust-*-replay.txt" "$env:RUNNER_TEMP\outpost-sim-summaries\" -ErrorAction SilentlyContinue
          exit $failed
      - name: Compare the seed ensemble through the Rust world
        # Gate G2 (record 0003 point 9): the same scenarios and seeds through the Rust world
        # (scenario_replay's g2_seed_ensemble test). Each seed is judged exactly up to its first
        # contact or munition impact, ram_ship's first-contact damage within 5 % (owner,
        # 2026-11-19); after it the outcome statistics of the seeds, Rust's against the oracle's,
        # are reported against the proposed bounds. Summary rust-ensemble.txt.
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $env:OUTPOST_ENSEMBLE_DIR = "$env:RUNNER_TEMP\outpost-ensemble"
          $env:OUTPOST_ORACLE_DIR = "$env:RUNNER_TEMP\outpost-sim"
          cargo test --locked --release -p game-sim --test scenario_replay -- g2_seed_ensemble --nocapture
          $code = $LASTEXITCODE
          Copy-Item "$env:OUTPOST_ENSEMBLE_DIR\rust-ensemble.txt" "$env:RUNNER_TEMP\outpost-sim-summaries\" -ErrorAction SilentlyContinue
          exit $code
      - name: Keep the scenario spread summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-spread-summaries
          path: ${{ runner.temp }}/outpost-sim-summaries
          if-no-files-found: ignore
