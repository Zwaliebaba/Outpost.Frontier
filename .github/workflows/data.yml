name: Data dumps

# TEMPORARY, branch claude/oracle-determinism only (owner, 2026-11-19): the oracle
# reproducibility probe, second run. Not for main. The normal data.yml is on main.
#
# Probe 1 (run 44523076483): the 5 ensemble pairs end differently in separate processes of
# one build on one machine. Probe 2 (run 44526581221): the same with ASLR off; the first
# difference is the rand() sequence (a behaviour tick draws values shifted by a few draws).
# This run records every frame-time rand() draw with its caller (OUTPOST_ORACLE_RUN_RAND,
# run_rand.jsonl) and prints the first draw that differs between runs.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeat:
    name: Repeated runs with the rand() recorder
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build the oracle harness
        shell: pwsh
        run: |
          Write-Host "image: $env:ImageOS $env:ImageVersion"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          Get-ChildItem "$vs\VC\Auxiliary\Build" -Filter 'Microsoft.VCToolsVersion.default.txt' | ForEach-Object { "MSVC: $(Get-Content $_.FullName)" }
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          $targets = 'Tools\Oracle', 'DLLs\Content', 'DLLs\ReadFile', 'DLLs\RendComp', 'DLLs\system', 'DLLs\SceneScript', 'DLLs\DX8RENDERER', 'DLLs\Shading'
          & $msbuild CppSource\OutpostFrontier.sln "/t:$($targets -join ';')" /m /p:Configuration=Release /p:Platform=Win32 /v:minimal /nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the pairs with the frame-time rand() recorder
        shell: pwsh
        run: |
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          Write-Host "cpu: $($cpu.Name)"
          $env:OUTPOST_ORACLE_RUN_RAND = '1'
          $pairs = 'dogfight 3358599207', 'dogfight 464813110', 'skirmish 1478717352', 'skirmish 225462782', 'strafe 2731971922'
          $root = "$env:RUNNER_TEMP\det"
          foreach ($pair in $pairs) {
            $name, $seed = $pair -split ' '
            $dir = "$root\rand\${name}_$seed"
            & .\bin\Oracle.exe sim "$PWD\outdir" "CppSource\Oracle\scenarios\$name.txt" $dir --seed $seed --runs 5
            Write-Host "$name seed ${seed}: exit $LASTEXITCODE"
            Get-ChildItem $dir -Directory | ForEach-Object { "  $($_.Name) run_rand.jsonl: $((Get-Item "$($_.FullName)\run_rand.jsonl" -ErrorAction SilentlyContinue).Length) bytes" }
          }
      - name: Compare the runs
        shell: pwsh
        run: python -I .github\oracle-determinism\compare_runs.py "$env:RUNNER_TEMP\det"
